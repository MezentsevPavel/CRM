<title>CRM wind-solar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Цвета и шрифт — из приложения PVCalc (его tokens.css и тёмная тема): тёплый светлый фон,
   белые карточки, один зелёный акцент, солнечный янтарь — резервы и «внимание», красный — нарушения.
   Синего и фиолетового в палитре приложения нет, поэтому «в пути» и каналы связи — нейтральный серый.
   Раскладка: светлая панель разделов слева, справа рабочее поле с карточками.
   Тема: оболочка ставит на <html> data-theme="light" или "dark" (светлая, тёмная или по системе — S.prefs.theme);
   блок @media — только до запуска кода. --logo-plate — подложка логотипа: в тёмной теме светлая,
   иначе тёмная надпись Windsolar не читается. */
:root{
  --bg:#F1F2EF; --surface:#FFFFFF; --surface-2:#F7F8F6; --sunken:#E8E9E6; --line:rgba(27,29,27,.10); --line-2:rgba(27,29,27,.18); --ink:#1B1D1B; --ink-2:rgba(27,29,27,.66); --ink-3:rgba(27,29,27,.64); --primary:#0C8646; --primary-2:#0A733A; --primary-ink:#FFFFFF; --primary-soft:#E7F5EE; --primary-line:rgba(14,158,82,.28); --primary-deep:#07602F; --sun:#F5A623; --on-sun:#2A1C00; --sun-soft:#FDEFD7; --sun-ink:#8A5200; --ok:#0A7A3F; --ok-soft:#E7F5EE; --warn:#8A5200; --warn-soft:#FDEFD7; --bad:#B3261E; --bad-soft:#F7E9E8; --info:#4F524F; --info-soft:#E8E9E6; --violet:#4F524F; --violet-soft:#E8E9E6; --seg-on:#FFFFFF; --bezel:#1B1D1B; --overlay:rgba(14,18,16,.45); --on-overlay:#FFFFFF; --shadow-1:0 1px 2px rgba(20,30,24,.05),0 2px 8px rgba(20,30,24,.05); --shadow:0 4px 10px rgba(20,30,24,.08),0 20px 44px rgba(20,30,24,.14);
  --f-display:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --logo-plate:transparent;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1210; --surface:#171C1A; --surface-2:#1D2220; --sunken:#222926; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.16); --ink:#ECEFEA; --ink-2:rgba(236,239,234,.66); --ink-3:rgba(236,239,234,.60); --primary:#35C77F; --primary-2:#4FCD91; --primary-ink:#0E1210; --primary-soft:#1B3026; --primary-line:rgba(53,199,127,.32); --primary-deep:#9BE8C0; --sun:#E8B23C; --on-sun:#2A1C00; --sun-soft:#38341F; --sun-ink:#EDBE5A; --ok:#35C77F; --ok-soft:#1B3026; --warn:#EDBE5A; --warn-soft:#38341F; --bad:#E0894A; --bad-soft:#332B21; --info:#B9BDB8; --info-soft:#222926; --violet:#B9BDB8; --violet-soft:#222926; --seg-on:#393E3B; --bezel:#2A302D; --overlay:rgba(0,0,0,.55); --on-overlay:#FFFFFF; --shadow-1:0 1px 2px rgba(0,0,0,.34),0 2px 8px rgba(0,0,0,.30); --shadow:0 4px 12px rgba(0,0,0,.42),0 22px 48px rgba(0,0,0,.55);
  --logo-plate:#F1F2EF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1210; --surface:#171C1A; --surface-2:#1D2220; --sunken:#222926; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.16); --ink:#ECEFEA; --ink-2:rgba(236,239,234,.66); --ink-3:rgba(236,239,234,.60); --primary:#35C77F; --primary-2:#4FCD91; --primary-ink:#0E1210; --primary-soft:#1B3026; --primary-line:rgba(53,199,127,.32); --primary-deep:#9BE8C0; --sun:#E8B23C; --on-sun:#2A1C00; --sun-soft:#38341F; --sun-ink:#EDBE5A; --ok:#35C77F; --ok-soft:#1B3026; --warn:#EDBE5A; --warn-soft:#38341F; --bad:#E0894A; --bad-soft:#332B21; --info:#B9BDB8; --info-soft:#222926; --violet:#B9BDB8; --violet-soft:#222926; --seg-on:#393E3B; --bezel:#2A302D; --overlay:rgba(0,0,0,.55); --on-overlay:#FFFFFF; --shadow-1:0 1px 2px rgba(0,0,0,.34),0 2px 8px rgba(0,0,0,.30); --shadow:0 4px 12px rgba(0,0,0,.42),0 22px 48px rgba(0,0,0,.55);
  --logo-plate:#F1F2EF;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.sm{font-size:12.5px}
.m0{margin:0}
.nowrap{white-space:nowrap}
.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bad-t{color:var(--bad)}.ok-t{color:var(--ok)}.warn-t{color:var(--warn)}
.xs{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack-s{display:flex;flex-direction:column;gap:14px;min-width:0}

/* ——— лента карточек: комментарии и события (41-feed.js, вид feedHtml) ——— */
.feed{display:flex;flex-direction:column;gap:14px;min-width:0}
.feed-add{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.feed-add textarea{min-height:64px}
.feed-add .btn{align-self:flex-start}
.feed-list{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.feed-i{position:relative;display:flex;flex-direction:column;gap:3px;min-width:0;padding:0 0 14px 18px}
.feed-i:last-child{padding-bottom:0}
/* нить ленты и точка записи */
.feed-i::before{content:"";position:absolute;left:4px;top:6px;bottom:-2px;width:2px;background:var(--line)}
.feed-i:last-child::before{display:none}
.feed-i::after{content:"";position:absolute;left:0;top:5px;width:10px;height:10px;border:2px solid var(--ink-3);border-radius:50%;background:var(--surface)}
.feed-i.k-comment::after{border-color:var(--primary);background:var(--primary-soft)}
.feed-i.k-win::after{border-color:var(--ok);background:var(--ok-soft)}
.feed-i.k-lose::after{border-color:var(--bad);background:var(--bad-soft)}
.feed-i.k-reserve::after{border-color:var(--sun);background:var(--sun-soft)}
.feed-i.k-msg::after{border-color:var(--info);background:var(--info-soft)}
.feed-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:13px}
.feed-h b{font-weight:600}
.feed-h small{font-size:12px;color:var(--ink-3)}
.feed-t{margin:0;font-size:13.5px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}
.feed-i.k-comment .feed-t{padding:8px 10px;border-radius:12px;background:var(--surface-2)}

/* ——— дела в ленте: «Запланировать», открытые дела, выполненные ——— */
.act-plan{border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.act-plan>summary{display:flex;width:100%;justify-content:flex-start;list-style:none;cursor:pointer;border:0;background:transparent}
.act-plan>summary::-webkit-details-marker{display:none}
.act-plan[open]>summary{border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
.act-form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:12px;min-width:0}
.act-form .field{min-width:0}
.act-form .field:nth-child(2),.act-form .field:nth-child(3),.act-form .err,.act-form .btn{grid-column:1/-1}
.act-form .btn{justify-self:start}
.act-form input,.act-form select{min-width:0;max-width:100%}
.act-q{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.act-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.act-i{display:flex;align-items:center;gap:10px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:12px;background:var(--surface)}
.act-i.over{border-color:var(--bad-soft);border-left-color:var(--bad);background:var(--bad-soft)}
.act-ic{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:9px;background:var(--primary-soft);color:var(--primary-deep)}
.act-i.over .act-ic{background:var(--surface);color:var(--bad)}
.act-ic .ic{width:17px;height:17px}
.act-b{display:flex;flex-direction:column;align-items:flex-start;gap:2px;flex:1;min-width:0}
.act-t{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.act-b small{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.act-late{color:var(--bad);font-weight:700}
.act-i .btn{flex:none}
.act-empty{display:flex;align-items:center;gap:8px;margin:0;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.act-empty .ic{width:16px;height:16px;flex:none}
/* выполненное дело в ленте — серое */
.feed-i.k-act::after{border-color:var(--line-2);background:var(--sunken)}
.feed-i.k-act .feed-h b,.feed-i.k-act .feed-t{color:var(--ink-3)}
.feed-i.k-act .feed-t{padding:8px 10px;border-radius:12px;background:var(--sunken)}
/* метка ближайшего дела на карточках канбана и в списках */
.act-nx{display:inline-flex;align-items:center;gap:5px;max-width:100%;font-size:12px;color:var(--ink-2)}
.act-nx .ic{width:14px;height:14px;flex:none}
.act-nx>span{min-width:0;overflow-wrap:anywhere}
.act-nx.over{color:var(--bad);font-weight:600}
.act-nx.none{white-space:normal}
.act-nx.none .ic{width:12px;height:12px}
.tcard>.act-nx{align-self:flex-start}
@media (max-width:560px){
  .act-form{grid-template-columns:1fr}
  .act-i{flex-wrap:wrap}
  .act-i .btn{margin-left:40px}
}

/* ——— каркас ——— */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;overflow-y:auto;padding-block:18px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;background:var(--surface);border-right:1px solid var(--line);color:var(--ink)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:0 0 4px}
.logo{display:block;padding:6px 10px;border-radius:12px;background:var(--logo-plate)}
.logo img{display:block;width:auto;height:30px}
.brand small{display:block;padding-left:10px;font-size:11.5px;color:var(--ink-3)}
.side-b{display:flex;flex-direction:column;flex:1 0 auto}
.nav-g{display:flex;flex-direction:column;gap:2px;margin-top:20px}
.nav-g h4{margin:0 10px 6px;font:700 10.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.nav-i{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;border-radius:12px;background:transparent;color:var(--ink);font-size:13.5px;font-weight:500;text-align:left}
.nav-i .ic{color:var(--ink-3)}
.nav-i:hover{background:var(--surface-2)}
.nav-i.on{background:var(--primary-soft);color:var(--primary-deep);font-weight:700}
.nav-i.on .ic{color:var(--primary)}
.cnt{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:10px;background:var(--sunken);color:var(--ink-2);font-size:11.5px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.cnt.hot{background:var(--sun);color:var(--on-sun)}
.me{display:flex;align-items:center;gap:10px;margin-top:auto;padding:14px 6px 2px;border-top:1px solid var(--line)}
.me b{display:block;font-size:13px}
.me small{display:block;font-size:11.5px;color:var(--ink-3)}
.side-scrim{display:none;position:fixed;inset:0;z-index:44;background:var(--overlay)}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{position:relative;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:24px;padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.ttl{margin:0;font:800 17px/1.2 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
/* .btn.burger: иначе .btn ниже по файлу показывает «меню» и на широком экране */
.btn.burger{display:none}
.search{position:relative;flex:1 1 0;min-width:160px;max-width:440px;margin-left:auto}
.s-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);display:flex;color:var(--ink-3)}
.search .inp{padding-left:36px;background:var(--surface-2)}
.as{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.as select{width:auto;max-width:240px}
.theme-sw{display:flex}
.theme-seg.compact{flex-wrap:nowrap}
.theme-seg:not(.compact){border-radius:14px}
.theme-seg:not(.compact) button{border-radius:11px}
.theme-seg button{display:inline-flex;align-items:center;gap:7px}
.theme-seg .ic{width:16px;height:16px}
.theme-seg.compact button{padding:6px 8px}
.theme-seg.compact span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bell-w{position:relative}
.bn{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--sun);color:var(--on-sun);font-size:10.5px;font-weight:700;line-height:1;display:grid;place-items:center}
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:min(400px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.pop-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pop-h b{font-size:13.5px}
.pop-l{max-height:min(60vh,460px);overflow-y:auto;margin:0;padding:0;list-style:none}
.pop-f{padding:8px;border-top:1px solid var(--line)}
.q-res{left:0;right:auto;width:100%}
.q-res .pop-l{padding:6px}

.demo{display:flex;align-items:center;gap:10px;padding-block:7px;padding-left:24px;padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--sun-soft);color:var(--sun-ink);font-size:12.5px;line-height:1.35}
.demo .ic{width:16px;height:16px}
.demo>span{flex:1;min-width:0}
.demo .btn{color:var(--sun-ink)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.view{display:flex;flex-direction:column;gap:16px;padding-block:22px 48px;padding-left:24px;padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ——— элементы ——— */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:linear-gradient(135deg,var(--primary),var(--primary-2));border-color:transparent;color:var(--primary-ink);box-shadow:var(--shadow-1)}
.btn.pri:hover{background:var(--primary-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.icon{width:36px;padding:0}
.btn.big{width:100%;height:48px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .ic{width:16px;height:16px}
.link{padding:0;border:0;background:none;color:var(--primary);font-weight:500;text-align:left}
.link:hover{text-decoration:underline}
.inp{width:100%;height:38px;padding:0 11px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);font-size:14px}
.inp.sm{height:32px;padding:0 8px;font-size:13px}
textarea.inp{height:auto;min-height:72px;padding:9px 11px;line-height:1.45;resize:vertical}
.inp:focus{outline:2px solid var(--primary);outline-offset:-1px}
.inp:disabled{background:var(--sunken);color:var(--ink-3)}
.w-auto{width:auto}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.field.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.span2{grid-column:1/-1}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;margin:0;accent-color:var(--primary)}
.hint{margin:0;font-size:12.5px;color:var(--ink-3);max-width:80ch}
.err{margin:0;font-size:13px;color:var(--bad)}
.lock{display:flex;align-items:center;gap:8px;margin:0;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:var(--sunken);color:var(--ink-2);font-size:12px;font-weight:500;line-height:1.5;white-space:nowrap}
.pill.sm{padding:1px 7px;font-size:11px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}.pill.sun{background:var(--sun-soft);color:var(--sun-ink)}.pill.violet{background:var(--violet-soft);color:var(--violet)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;text-align:left}
button.chip:hover{border-color:var(--line-2);background:var(--sunken)}
button.chip:disabled{opacity:.5;cursor:not-allowed}
.chip b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:13px}
.fchip:hover{border-color:var(--line-2)}
.fchip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-deep);font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:999px;background:var(--sunken)}
.seg button{padding:6px 12px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button b{margin-left:5px;color:var(--ink-3);font-weight:600}
.seg.wide{display:flex}
.seg.wide button{flex:1}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.av{display:inline-grid;place-items:center;width:30px;height:30px;flex:none;border-radius:50%;background:var(--sunken);color:var(--ink-2);font-size:11.5px;font-weight:600}
.av.xs{width:20px;height:20px;font-size:9.5px}
.av .ic{width:12px;height:12px}
.who{display:inline-flex;align-items:center;gap:7px;min-width:0}

.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-1)}
.card.clip{overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:14px 16px 10px}
.card-h h3{margin:0;font-size:14.5px;font-weight:600}
.card-b{padding:0 16px 16px}
.empty{margin:0;padding:18px 16px;color:var(--ink-3);font-size:13.5px}
.sh{margin:0 0 8px;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
/* «Нет доступа к разделу» — прямой переход туда, где у человека нет права */
.deny{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:560px;margin:24px auto 0;padding:32px 24px;text-align:center}
.deny h2{margin:0;font:800 18px/1.25 var(--f-display);letter-spacing:-.015em}
.deny p{margin:0;max-width:44ch;color:var(--ink-2)}
.deny-ic{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--sunken);color:var(--ink-3)}
.deny-ic .ic{width:22px;height:22px}
.deny .btn{margin-top:6px}

/* ——— таблицы (общие для всех разделов) ——— */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);color:var(--ink-3);font-size:12px;font-weight:500;text-align:left;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl .c{text-align:center}

/* ——— уведомления ——— */
.notes{margin:0;padding:0;list-style:none}
.note{display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px;padding:11px 16px;border-top:1px solid var(--line)}
.notes>.note:first-child{border-top:0}
.note.unread{background:var(--surface-2)}
.nic{display:grid;place-items:center;width:32px;height:32px;border-radius:9px}
.nic .ic{width:17px;height:17px}
.nic.info{background:var(--info-soft);color:var(--info)}.nic.ok{background:var(--ok-soft);color:var(--ok)}.nic.pri{background:var(--primary-soft);color:var(--primary)}
.nic.sun{background:var(--sun-soft);color:var(--sun-ink)}.nic.violet{background:var(--violet-soft);color:var(--violet)}.nic.bad{background:var(--bad-soft);color:var(--bad)}
.nt p{margin:0;font-size:13.5px}
.nt small{display:block;margin-top:3px;font-size:12px;color:var(--ink-3)}
.new-b{color:var(--sun-ink);font-weight:600}
.to{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

/* ——— карточка справа и окна ——— */
.scrim{position:fixed;inset:0;z-index:40;background:var(--overlay);animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;display:flex;flex-direction:column;width:min(580px,100%);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);background:var(--surface);box-shadow:var(--shadow);animation:slide .22s ease}
.still .scrim,.still .drawer{animation:none}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.dh-t{flex:1;min-width:0}
.dh-t small{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.dh-t h2{margin:4px 0 0;font:800 18px/1.25 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.dh-t p{margin:6px 0 0;font-size:13px;color:var(--ink-3)}
.drawer-b{flex:1;display:flex;flex-direction:column;gap:22px;overflow-y:auto;padding:18px 20px 32px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;margin:0;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.st{display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:12px;background:var(--surface-2)}
.st span{font-size:11.5px;line-height:1.2;color:var(--ink-3)}
.st b{font:800 17px/1.1 var(--f-display);letter-spacing:-.01em}
.rform{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--surface-2)}
.rform .sh{margin:0}
.mv{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.mv li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.mv li:first-child{border-top:0}
.mv small{margin-left:auto;font-size:12px;color:var(--ink-3)}
.prose{max-width:62ch;margin:0;font-size:14px;line-height:1.55}
.modal-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--overlay);animation:fade .15s}
.modal{display:flex;flex-direction:column;width:min(560px,100%);max-height:100%;overflow-y:auto;border-radius:26px;background:var(--surface);box-shadow:var(--shadow)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font:800 16px/1.25 var(--f-display);letter-spacing:-.01em}
.modal-b{display:flex;flex-direction:column;gap:14px;padding:16px 18px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:8px}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;width:min(400px,calc(100% - 32px));pointer-events:none}
.toast{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-size:13.5px;line-height:1.4;pointer-events:auto;animation:tin .22s ease;transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateY(6px)}
.toast .ic{width:17px;height:17px;margin-top:1px;color:var(--sun)}
/* ——— стрелки у краёв досок (50-shell.js: контейнер с data-hscroll оборачивается в .hs) ———
   Полоса .hs-a во всю высоту доски; сама кнопка липнет к видимой части экрана, чтобы её было видно и у высокой доски.
   Видна, только когда с этой стороны есть что листать (иначе hidden) и мышь у края (data-near) или кнопка в фокусе. */
.hs{position:relative;min-width:0}
.hs-a{position:absolute;top:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:center;width:52px;pointer-events:none}
.hs-l{left:0}
.hs-r{right:0}
.hs-b{position:sticky;top:96px;bottom:96px;display:grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid var(--line-2);border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .15s,background .15s}
.hs-b *{pointer-events:none}
.hs-b:hover{background:var(--primary-soft);color:var(--primary-deep)}
.hs[data-near="l"] .hs-l .hs-b,.hs[data-near="r"] .hs-r .hs-b,.hs-b:focus-visible{opacity:1;pointer-events:auto}
/* палец листает сам, стрелки только мешали бы */
@media (hover:none),(pointer:coarse){.hs-a{display:none}}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;left:0;z-index:45;width:min(290px,86vw);padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-104%);transition:transform .22s ease}
  .app.nav-open .side{transform:none;box-shadow:var(--shadow)}
  .app.nav-open .side-scrim{display:block}
  .btn.burger{display:inline-flex}
  .top,.demo,.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ttl{flex:1 1 0;min-width:0}
  .search{order:9;flex-basis:100%;max-width:none;margin-left:0}
  .as select{max-width:150px}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .drawer{padding-left:env(safe-area-inset-left,0px)}
}

@media (max-width:560px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .top{gap:10px}
  .ttl{font-size:15px}
  /* телефон: 1-я строка — меню, раздел, тема, уведомления; 2-я — «Кто я»; 3-я — поиск */
  .as{order:8;flex:1 1 100%;min-width:0}
  .as select{flex:1;min-width:0;max-width:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .demo{align-items:flex-start}
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ——— «Сегодня» ——— */
/* строка «что здесь и зачем» под заголовком раздела: оболочка кладёт её из NAV.hint */
.sec-hint{margin:-6px 0 0;font-size:13.5px;line-height:1.45;color:var(--ink-2);max-width:80ch}
/* пустой список: что это, как наполнить, и кнопка (emptyState в оболочке) */
.empty-st{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:6px 16px 18px}
.empty-st .empty{padding:12px 0 0;max-width:62ch}
.hello h2{margin:0;font:800 22px/1.2 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.hello p{margin:6px 0 0;color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi,.ttile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-1);background:var(--surface);color:var(--ink);text-align:left}
.kpi:hover,.ttile:hover{border-color:var(--line-2)}
.k-l{font-size:12.5px;color:var(--ink-2)}
.k-v{font:800 30px/1 var(--f-display);letter-spacing:-.02em}
.k-s{font-size:12.5px;color:var(--ink-3)}
.k-s.bad{color:var(--bad)}.k-s.warn{color:var(--warn)}.k-s.ok{color:var(--ok)}
/* плитки «что сделать сегодня»: нулевая — спокойная, красная только при просрочке */
.today{display:flex;flex-direction:column;gap:10px}
.today-h{margin:0;font:800 15px/1.2 var(--f-display);letter-spacing:-.01em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ttile{min-width:0}
.ttile .k-l{overflow-wrap:anywhere}
.ttile.bad .k-v,.ttile.bad .k-s{color:var(--bad)}
.ttile.warn .k-s{color:var(--warn)}
.ttile.calm .k-v{color:var(--ink-3)}
/* «Пульт проверки»: карточка на каждую имитацию, под кнопкой — что вышло и куда посмотреть */
.sims{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.sim .card-h{flex-wrap:wrap;gap:8px}
.sim-out{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:12px;background:var(--sunken);min-width:0;overflow-wrap:anywhere}
.week{display:grid;grid-template-columns:repeat(var(--n),minmax(108px,1fr));gap:8px;min-width:calc(var(--n) * 116px)}
.wd{display:flex;flex-direction:column;gap:6px;min-height:118px;padding:9px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.wd.today{border-color:var(--primary);background:var(--surface);box-shadow:inset 0 0 0 1px var(--primary)}
.wd.late{border-color:var(--bad-soft);background:var(--bad-soft)}
.wd-h{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.wd-h b{display:block;margin-top:2px;font:800 14px/1.2 var(--f-display);letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.wd.late .wd-h{color:var(--bad)}
.wchip{display:flex;flex-direction:column;gap:1px;padding:6px 8px;border:0;border-radius:7px;background:var(--info-soft);color:var(--info);font-size:11.5px;line-height:1.3;text-align:left}
.wchip.out{background:var(--ok-soft);color:var(--ok)}
.wchip.late{background:var(--surface);color:var(--bad)}
.wchip b{font-size:12px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.list{margin:0;padding:0 8px 8px;list-style:none}
.li{display:flex;align-items:flex-start;gap:11px;width:100%;padding:9px 8px;border:0;border-radius:12px;background:transparent;text-align:left}
.li:hover{background:var(--surface-2)}
.li-ic{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:8px;background:var(--sunken);color:var(--ink-2)}
.li-ic .ic{width:16px;height:16px}
.li.bad .li-ic{background:var(--bad-soft);color:var(--bad)}.li.warn .li-ic{background:var(--warn-soft);color:var(--warn)}.li.info .li-ic{background:var(--info-soft);color:var(--info)}
.li-t{flex:1;min-width:0;font-size:13.5px}
.li-t small{display:block;margin-top:2px;font-size:12px;color:var(--ink-3)}
.due{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.due.bad{color:var(--bad);font-weight:500}
.tdot{width:10px;height:10px;flex:none;margin-top:5px;border:2px solid var(--ink-3);border-radius:50%}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .home-grid{grid-template-columns:minmax(0,1fr)}
}

@media (max-width:560px){
  .k-v{font-size:24px}
}

/* ——— задачи ——— */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;min-width:1036px}
.col{display:flex;flex-direction:column;gap:8px;min-height:260px;padding:10px;border-radius:18px;background:var(--sunken)}
.col.drop{outline:2px dashed var(--primary);outline-offset:-2px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px;font-size:13px;font-weight:600}
.cnt-s{font-size:12px;font-weight:500;color:var(--ink-3)}
.col-empty{margin:0;padding:14px 6px;text-align:center;font-size:12.5px;color:var(--ink-3)}
.tcard{display:flex;flex-direction:column;gap:8px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:grab}
.tcard:hover{border-color:var(--line-2)}
.tcard.dragging{opacity:.5}
.tcard.done .tc-t{color:var(--ink-3);text-decoration:line-through}
.tc-top{display:flex;flex-wrap:wrap;gap:6px}
.tc-top:empty{display:none}
.tc-t{margin:0;font-size:13.5px;font-weight:500;line-height:1.35}
.tc-m{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2)}
.tcard .tc-top .tdot{margin-top:0}
.tdot.ok{border-color:var(--ok);background:var(--ok-soft)}
.tdot.info{border-color:var(--primary);background:var(--primary-soft)}
.tc-take{align-self:flex-start}
.tk-box{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin:12px 0;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--info-soft)}
/* режим «Редактировать доску»: имя колонки правится на месте, замок вместо «×» у защищённого этапа */
.col-edit .col-h{align-items:stretch;gap:6px;padding-bottom:6px}
.col-edit .pe-stage{flex:1}
.col-add{align-items:flex-start;justify-content:flex-start;background:transparent;border:2px dashed var(--line-2)}

/* ——— товары и остатки ——— */
.pname{display:flex;flex-direction:column;gap:2px;min-width:200px}
.pname small{font-size:11.5px;color:var(--ink-3)}
.u{font-size:12px;color:var(--ink-3)}
.in-t{display:block;color:var(--info);font-weight:500;white-space:nowrap}
td small.muted{display:block;font-size:11.5px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:12px;height:8px;border-radius:2px}
.lg.f,.sbar .f{background:var(--ok)}
.lg.r,.sbar .r{background:var(--sun)}
.lg.w,.sbar .w{background:repeating-linear-gradient(135deg,var(--info) 0 2px,var(--info-soft) 2px 4px)}
.sbar{display:flex;width:128px;height:8px;overflow:hidden;border-radius:4px;background:var(--sunken)}
.sbar i{display:block;height:100%}
.sbar.big{width:100%;height:12px;border-radius:6px}
.search-in{position:relative;flex:1;min-width:220px;max-width:380px}
.search-in .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search-in .inp{padding-left:36px}
/* список: счётчик, страницы, фильтры */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;max-width:760px}
.count{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 14px;margin:0;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.count b{color:var(--ink)}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;padding:12px 16px;border-top:1px solid var(--line)}
.pname small{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
td.free b{font-weight:700}
/* карточка товара */
.pst{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.st small{font-size:11px;line-height:1.3;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:minmax(92px,32%) minmax(0,1fr);gap:8px 12px;margin:0;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv dd small{display:block;font-size:12px;color:var(--ink-3)}
.mx th{white-space:normal;min-width:72px}
.mx th[scope=row]{background:transparent;color:var(--ink);font-size:13.5px;font-weight:500;white-space:nowrap;text-align:left}
.mx td.e{background:var(--surface-2)}
.mx td.tot{font-weight:700}
.mx tfoot th,.mx tfoot td{border-top:1px solid var(--line-2);border-bottom:0}
.mv .pill{align-self:center}
.rbtns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.sell-l li>span{flex:1 1 140px;min-width:0}
.sell-l small{order:3;flex:1 0 100%;margin-left:0}
.sell-l .btn{margin-left:auto}
/* настройки: склады и юрлица */
.wh-row{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.wh-row.city{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.wh-add{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.wh-add .field{flex:1;min-width:180px}
@media (max-width:560px){.wh-row.city{grid-template-columns:minmax(0,1fr)}}

/* ——— поставки и перевозки: таблица, воронка, шкала маршрута, позиции, карточка ——— */

/* этапы полосками — общие для карточки поставки и карточки сделки */
.steps{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;margin:0;padding:0;list-style:none}
.steps li{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:11px;line-height:1.25;color:var(--ink-3);overflow-wrap:anywhere}
.steps li::before{content:"";height:5px;border-radius:3px;background:var(--sunken)}
.steps li.done::before{background:var(--primary-line)}
.steps li.cur::before{background:var(--primary)}
.steps li.cur{color:var(--ink);font-weight:600}
.waits{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink-2)}
.waits .ic{width:16px;height:16px;margin-top:1px;color:var(--ink-3)}
.ship-f{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.photos-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.photos-row img,.ph-ph{width:54px;height:54px;border-radius:8px;object-fit:cover}
.ph-ph{display:grid;place-items:center;background:var(--sunken);color:var(--ink-3)}
.photos-row small{margin-left:4px;font-size:12px;color:var(--ink-3)}

/* фильтры и настройка вида */
.sfilters{padding:12px 14px}
.sf-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.sf-row .field{flex:1 1 130px;min-width:0}
.sf-row .sf-q{flex:2 1 240px}
.sset .hint{margin:0}
.ss-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;align-items:start}
.ss-f{display:flex;flex-direction:column;gap:8px;min-width:0;margin:0;padding:0;border:0}
fieldset.ss-f legend{padding:0;margin-bottom:6px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.s-count{margin:0;font-size:13px;color:var(--ink-3)}
.s-pager{display:flex;align-items:center;justify-content:center;gap:12px}

/* таблица: строка фиксированной высоты, лишнее обрезается */
.stbl{min-width:1100px}
.stbl td{height:64px;padding:6px 12px;overflow:hidden}
.stbl.dense td{height:40px;padding:3px 10px}
.srow.is-late>td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.srow.is-done{color:var(--ink-2)}
.sgrp td{height:auto;padding:7px 12px;background:var(--surface-2);font-size:12.5px}
.s-sort{padding:0;border:0;background:none;color:inherit;font:inherit;white-space:nowrap}
.s-sort:hover,.s-sort.on{color:var(--ink)}
.s-id{display:block;font-weight:600}
.s-id+small{display:block;font-size:11px;line-height:13px}
.s-ell{display:block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-ell small{display:block}
.s-stsel{width:auto;min-width:150px;max-width:200px;height:30px}
.s-eta{white-space:nowrap}
.s-eta b{display:block}
.s-eta small{display:block;font-size:11.5px}
.s-where{min-width:250px}
.s-itc{min-width:270px}
.stbl.dense .s-ell small{display:inline;margin-left:6px}
.stbl.dense .s-eta b,.stbl.dense .s-eta small{display:inline}
.stbl.dense .s-id,.stbl.dense .s-id+small{display:inline}

/* позиции «3 + ещё N» */
.s-items{display:flex;align-items:center;gap:8px;min-width:0}
.s-itl{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.s-it{display:flex;gap:4px;max-width:250px;font-size:12.5px;line-height:15px;white-space:nowrap}
.s-it span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.s-it b{flex:none;font-weight:600;color:var(--ink-2)}
.s-more{flex:none;min-width:36px;height:26px;padding:0 9px;border:1px solid var(--primary-line);border-radius:999px;background:var(--primary-soft);color:var(--primary);font:600 12px var(--f-body);cursor:pointer}
.s-more:hover{background:var(--primary-line)}
.stbl.dense .s-itl{flex-direction:row;gap:12px}
.stbl.dense .s-it{max-width:130px}
.drawer .s-it{max-width:none;font-size:13.5px;line-height:21px;white-space:normal}
.drawer .s-it span{overflow:visible;text-overflow:clip}
.drawer .s-items{align-items:flex-start}

/* шкала маршрута */
.rs{display:flex;flex-direction:column;gap:3px;max-width:270px}
.rs.full{max-width:none;gap:6px;padding:4px 30px 0}
.rs-line{position:relative;height:14px;margin:0 7px}
.rs-line::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;border-radius:1px;background:var(--line-2)}
.rs-fill{position:absolute;left:0;top:6px;height:2px;border-radius:1px;background:var(--primary)}
.rs.late .rs-fill{background:var(--bad)}
.rs-dot{position:absolute;top:2px;width:10px;height:10px;margin-left:-5px;box-sizing:border-box;border:2px solid var(--line-2);border-radius:50%;background:var(--surface)}
.rs-dot.on{border-color:var(--primary);background:var(--primary)}
.rs.late .rs-dot.on{border-color:var(--bad);background:var(--bad)}
.rs-dot.cur{box-shadow:0 0 0 3px var(--primary-soft)}
.rs.late .rs-dot.cur{box-shadow:0 0 0 3px var(--bad-soft)}
.rs-mark{position:absolute;top:0;width:14px;height:14px;margin-left:-7px;box-sizing:border-box;border:2px solid var(--surface);border-radius:50%;background:var(--sun);box-shadow:0 0 0 1px var(--sun-ink)}
.rs-names{position:relative;height:16px;margin:0 7px}
.rs-names span{position:absolute;top:0;transform:translateX(-50%);font-size:11.5px;white-space:nowrap;color:var(--ink-3)}
.rs-names span.on{color:var(--ink);font-weight:600}
.rs-cap{display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:15px}
.rs-w{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.rs-cap b{flex:none;font-weight:600;color:var(--ink-2)}
.rs-cap b.bad-t{color:var(--bad)}
.rs.full .rs-cap{font-size:13px;line-height:18px}
.stbl.dense .rs{flex-direction:row;align-items:center;gap:8px}
.stbl.dense .rs-line{flex:none;width:70px}
.stbl.dense .rs-cap{flex:1;min-width:0}

/* воронка */
.sfun{display:grid;grid-template-columns:repeat(var(--n),minmax(220px,1fr));gap:12px;min-width:calc(var(--n)*232px)}
.scol{min-height:200px}
.scol-b{display:flex;flex-direction:column;gap:8px;max-height:min(68vh,640px);overflow-y:auto;overscroll-behavior:contain}
.scard{display:flex;flex-direction:column;gap:5px;padding:10px 11px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.scard[draggable="true"]{cursor:grab}
.scard:hover{border-color:var(--line-2)}
.scard.dragging{opacity:.5}
.scard.is-late{border-color:var(--bad)}
.scard.is-done{color:var(--ink-2)}
.sc-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.sc-s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--ink-2)}
.sc-m{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-size:12px;color:var(--ink-2)}
.sc-m b{color:var(--ink)}

/* окно «Все позиции» */
.si-sum{margin:0;font-size:13px;color:var(--ink-2)}
.si-scroll{max-height:min(52vh,460px);overflow:auto;border:1px solid var(--line);border-radius:12px}
.si-scroll .tbl th{position:sticky;top:0;z-index:1}
#si-body{display:flex;flex-direction:column;gap:10px}

/* карточка справа */
.d-stage{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.d-stage .field{min-width:200px}
.shist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.shist li{padding-left:12px;border-left:2px solid var(--line)}
.sh-t{font-size:13.5px}
.shist small{display:block;margin-top:2px;font-size:12px;color:var(--ink-3)}

@media (max-width:560px){
  .sf-row .field{flex:1 1 calc(50% - 10px)}
  .sf-row .sf-q{flex:1 1 100%}
  .d-stage .field{min-width:0;flex:1 1 100%}
  .rs.full{padding:4px 26px 0}
}

/* схема маршрута: контуры, линии и точки в одной системе процентов; подписи и числа — кнопки поверх */
.smap{position:relative;aspect-ratio:100/58;min-height:300px;margin:14px;overflow:hidden;border-radius:14px;background:var(--surface-2)}
.smap-svg{position:absolute;inset:0;width:100%;height:100%}
.sm-land{stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.sm-land.cn{fill:var(--sun-soft);stroke:var(--sun-ink);stroke-opacity:.35}
.sm-land.ru{fill:var(--primary-soft);stroke:var(--primary);stroke-opacity:.35}
.sm-line{stroke:var(--line-2);stroke-width:1.5;stroke-dasharray:3 4}
.sm-line.on{stroke:var(--primary);stroke-width:2.5;stroke-dasharray:none}
.sm-country{position:absolute;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);opacity:.7;pointer-events:none}
.sm-country.cn{left:2%;top:7%}
.sm-country.ru{left:62%;top:6%}
.sm-dots{position:absolute;inset:0;pointer-events:none}
.sm-dot{position:absolute;left:var(--xm);top:var(--ym);width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--sun-ink);animation:sm-run var(--dur) linear infinite;animation-delay:var(--dl)}
@keyframes sm-run{0%{left:var(--x1);top:var(--y1);opacity:0}10%{opacity:1}90%{opacity:1}100%{left:var(--x2);top:var(--y2);opacity:0}}
.sm-pt{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;box-sizing:border-box;border:2px solid var(--line-2);border-radius:50%;background:var(--surface)}
.sm-pt.has{border-color:var(--primary);background:var(--primary)}
.sm-leg{position:absolute;display:inline-flex;align-items:baseline;gap:4px;padding:2px 8px;transform:translate(-50%,-50%);border:1px solid var(--line-2);border-radius:999px;background:var(--surface);color:var(--ink-3);font:600 12px/16px var(--f-body);white-space:nowrap;cursor:pointer}
.sm-leg.on{border-color:var(--primary);color:var(--ink)}
.sm-leg:hover,.sm-chip:hover,.sm-cust:hover{border-color:var(--primary);background:var(--primary-soft)}
.sm-node{position:absolute;display:flex;flex-direction:column;gap:4px;max-width:46%}
.sm-node.bl{left:0;top:calc(var(--y) + 14px);align-items:flex-start}
.sm-node.tl{right:calc(100% - var(--x) - 18px);bottom:calc(100% - var(--y) + 14px);align-items:flex-end;text-align:right}
.sm-node.r{left:calc(var(--x) + 20px);top:var(--y);max-width:calc(88% - var(--x) - 20px);transform:translateY(-50%);align-items:flex-start}
.sm-node.tr{right:0;bottom:calc(100% - var(--y) + 14px);align-items:flex-end;text-align:right}
.sm-node.br{right:0;top:calc(var(--y) + 14px);align-items:flex-end;text-align:right}
.sm-chip,.sm-cust{display:flex;flex-direction:column;gap:1px;padding:6px 10px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;text-align:inherit;cursor:pointer;box-shadow:var(--shadow-1)}
.sm-chip.has{border-color:var(--primary-line)}
.sm-nm{font-size:14px;font-weight:700}
.sm-lbl{font-size:11.5px;line-height:14px;color:var(--ink-3)}
.sm-key{color:var(--sun-ink);font-weight:600}
.sm-cnt{display:flex;flex-wrap:wrap;gap:0 8px;font-size:12px;line-height:16px;color:var(--ink-2)}
.sm-cnt b{color:var(--ink)}
.sm-cust{flex-direction:row;gap:4px;padding:3px 10px;border-color:var(--sun);background:var(--sun-soft);color:var(--sun-ink);font-size:12px;font-weight:600}
.sm-cust.has{border-color:var(--sun-ink)}
.sm-note{margin:0;padding:0 14px 12px}
.sm-list{display:flex;flex-direction:column;margin:0;padding:0 14px 8px;list-style:none}
.sm-list li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.sm-list li:first-child{border-top:0}
@media (prefers-reduced-motion:reduce){.sm-dot{animation:none;opacity:1}}
@media (max-width:640px){
  .smap{aspect-ratio:100/92;min-height:0;margin:10px}
  .sm-u,.sm-role,.sm-sep{display:none}
  .sm-leg{padding:1px 6px}
  .sm-chip,.sm-cust{padding:4px 8px}
  .sm-nm{font-size:13px}
  .sm-lbl{font-size:11px;line-height:13px}
  .sm-cnt{flex-direction:column;font-size:11.5px;line-height:14px}
  .sm-node{max-width:50%}
}

/* Настройки → «Поставки»: правила «если событие — поставить этап» */
.srule{align-items:flex-end;flex-wrap:wrap;padding-left:0;padding-right:0}
.srule .sw{align-self:center}
.sr-body{display:flex;flex:1 1 380px;flex-wrap:wrap;gap:10px;min-width:0}
.sr-body .field,.srule-add .field{flex:1 1 200px;min-width:0}
.srule-add{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;padding-top:12px;border-top:1px solid var(--line)}

/* ——— приёмка ——— */
.rcv{display:grid;grid-template-columns:minmax(0,410px) minmax(0,1fr);gap:24px;align-items:start}
.phone{padding:10px;border-radius:34px;background:var(--bezel);box-shadow:var(--shadow)}
.phone-in{display:flex;flex-direction:column;overflow:hidden;border-radius:26px;background:var(--bg)}
.ph-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px 10px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:var(--primary-ink);font-size:12.5px}
.ph-bar b{font:800 13px var(--f-display)}
.ph-sec{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ph-sec h3{margin:0;font-size:15px;font-weight:600}
.ph-step{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--primary-deep)}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;font-size:13.5px}
.opt.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.opt input{margin-top:3px;accent-color:var(--primary)}
.opt small{display:block;margin-top:2px;font-size:12px;color:var(--ink-3)}
.cnt-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.cnt-name{font-size:13.5px;font-weight:500}
.cnt-name small{display:block;font-size:12px;font-weight:400;color:var(--ink-3)}
.qty{display:flex;align-items:center;overflow:hidden;border:1px solid var(--line-2);border-radius:12px;background:var(--surface)}
.qty button{width:36px;height:38px;border:0;background:var(--surface-2);color:var(--ink-2);font-size:18px}
.qty input{width:64px;height:38px;border:0;background:transparent;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.qty input:focus{outline:2px solid var(--primary);outline-offset:-2px}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cnt-x{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{position:relative;max-width:100%;aspect-ratio:1;margin:0;overflow:hidden;border-radius:12px;background:var(--sunken)}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph-x{position:absolute;top:4px;right:4px;display:grid;place-items:center;width:24px;height:24px;border:0;border-radius:50%;background:var(--overlay);color:var(--on-overlay)}
.ph-x .ic{width:14px;height:14px}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px;border:1.5px dashed var(--line-2);background:var(--surface);color:var(--primary);font-size:11.5px;font-weight:500;text-align:center;cursor:pointer}
.ph-foot{padding:14px 16px 18px;background:var(--surface)}
.done-box{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:28px 18px}
.done-ic{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--ok-soft);color:var(--ok)}
.done-ic .ic{width:24px;height:24px}
.wait{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px}
.wait-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px}
.who-list{display:flex;flex-wrap:wrap;gap:6px}
.plain{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.plain li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13.5px}
.plain li span:first-child{flex:1;min-width:0}

.rcv-cell{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rcv-cell .field{min-width:0}

@media (max-width:1100px){
  .rcv{grid-template-columns:minmax(0,1fr)}
  .rcv .phone{width:100%;max-width:440px}
}

@media (max-width:560px){
  .phone{padding:0;border-radius:16px;background:transparent;box-shadow:none}
  .phone-in{border:1px solid var(--line);border-radius:14px}
}

/* ——— сделки: доска, таблица, карточка, КП ——— */
.dbar .search-in{flex:1 1 260px;max-width:380px}
.dfilt{gap:8px}
.dfilt .inp{max-width:100%}
/* доска: колонки — этапы воронки; контейнер листается вбок (data-hscroll) */
.dkan{display:grid;grid-template-columns:repeat(var(--n),minmax(250px,1fr));gap:12px;min-width:calc(var(--n) * 250px + (var(--n) - 1) * 12px)}
.dcol{min-height:200px}
.dcol .col-h{min-height:28px}
.dplus{width:28px;height:28px;border-radius:9px}
.dplus .ic{width:15px;height:15px}
.dcol-s{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;margin:-4px 4px 2px;font-size:12.5px;color:var(--ink-2)}
.dcol-s b{font:800 14px/1.2 var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.dcol-s small{width:100%;font-size:11.5px;color:var(--ink-3)}
.dcard .tc-t small{display:block;margin-top:2px;font-size:11.5px;color:var(--ink-3);overflow-wrap:anywhere}
.dcard.lost{cursor:pointer;background:var(--surface-2)}
.dcard.lost .tc-t{color:var(--ink-2)}
.dc-sum{margin:0;font:800 15px/1.2 var(--f-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.dc-lost{margin:0;font-size:12.5px;color:var(--bad)}
.dcard .tc-m{flex-wrap:wrap}

/* карточка сделки: полоса этапов, действия, вкладки */
.dsteps{display:flex;gap:4px;margin:0 -2px;padding:0 2px 2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.dstep{flex:1 0 84px;display:flex;flex-direction:column;gap:6px;min-width:0;padding:0;border:0;background:transparent;color:var(--ink-3);font-size:11px;line-height:1.25;text-align:left}
.dstep::before{content:"";height:5px;border-radius:3px;background:var(--sunken);transition:background .15s}
.dstep span{padding-bottom:2px;overflow-wrap:anywhere}
.dstep.done::before{background:var(--primary-line)}
.dstep.cur::before{background:var(--primary)}
.dstep.lost::before{background:var(--bad)}
.dstep.cur,.dstep.lost{color:var(--ink);font-weight:600}
.dstep:not(:disabled):hover::before{background:var(--primary-line)}
.dstep:not(:disabled):hover{color:var(--ink)}
.dstep:disabled{cursor:default}
.dsteps:has(.dstep.lost) .dstep:not(.lost),.dstep:disabled:not(.cur):not(.lost):not(.done){opacity:.7}
.dact{display:flex;flex-wrap:wrap;gap:8px}
.dtabs{display:flex;gap:2px;margin:0 -20px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
.dtab{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--ink-2);font-size:13.5px;font-weight:500;white-space:nowrap}
.dtab b{padding:0 6px;border-radius:9px;background:var(--sunken);color:var(--ink-2);font-size:11.5px;font-weight:700}
.dtab:hover{color:var(--ink)}
.dtab.on{border-bottom-color:var(--primary);color:var(--primary-deep);font-weight:700}
.dpane{display:flex;flex-direction:column;gap:18px;min-width:0}
.dform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dform .field small{font-size:12px;color:var(--ink-3)}
.dform .field>span:not(.lbl){font-size:14px}

/* вкладка «Товары» */
.dlines{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.dline{display:flex;flex-direction:column;gap:10px;min-width:0;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.dl-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.dl-n{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:13.5px}
.dl-n b{font-weight:600;overflow-wrap:anywhere}
.dl-st{font-size:12px;color:var(--ink-3)}
.dl-in{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dl-in .field>label,.dl-in .lbl{font-size:11.5px}
.dl-sum{display:flex;align-items:center;min-height:32px;font:700 13.5px/1.2 var(--f-body);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.dl-f{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dl-f:empty{display:none}
.dl-r{flex-wrap:wrap}
.dl-r .btn.sm{height:24px;padding:0 8px}
.dtot{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.dtot span{font-size:13px;color:var(--ink-2)}
.dtot b{font:800 20px/1.1 var(--f-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.dpres{display:flex;flex-direction:column;gap:4px}
.dpr{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n i" "s i";align-items:center;gap:1px 10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.dpr:hover{border-color:var(--line-2);background:var(--surface-2)}
.dpr-n{grid-area:n;font-size:13.5px;overflow-wrap:anywhere}
.dpr small{grid-area:s;font-size:12px;color:var(--ink-3)}
.dpr .ic{grid-area:i;color:var(--primary)}

/* окно «Новая сделка»: выбор клиента */
.dpicks{display:flex;flex-direction:column;gap:4px}
.dpick{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13.5px;cursor:pointer}
.dpick:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.dpick input{margin:3px 0 0;accent-color:var(--primary)}
.dpick span{display:flex;flex-direction:column;gap:1px;min-width:0;overflow-wrap:anywhere}
.dpick small{font-size:12px;color:var(--ink-3)}

/* коммерческое предложение */
.modal:has(.kp){width:min(820px,100%)}
.kp{display:flex;flex-direction:column;gap:16px;color:var(--ink)}
.kp-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.kp-top .logo img{height:36px}
.kp-t{text-align:right}
.kp-t h2{margin:0;font:800 19px/1.2 var(--f-display);letter-spacing:-.015em}
.kp-t p{margin:4px 0 0;font-size:13px;color:var(--ink-3)}
.kp-kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0;font-size:13.5px}
.kp-kv dt{color:var(--ink-3)}
.kp-kv dd{margin:0;overflow-wrap:anywhere}
.kp-tbl th,.kp-tbl td{padding:8px 10px}
.kp-tot{display:flex;align-items:baseline;justify-content:flex-end;gap:14px;margin:0;font-size:14px}
.kp-tot b{font:800 22px/1.1 var(--f-display);letter-spacing:-.01em;font-variant-numeric:tabular-nums}

@media (max-width:700px){
  .dbar .search-in{flex-basis:100%;max-width:none}
  .d-hide-s{display:none}
  /* телефон: колонки листаются пальцем, по одной на экран */
  .dkan{grid-template-columns:repeat(var(--n),minmax(78vw,1fr));min-width:calc(var(--n) * 78vw + (var(--n) - 1) * 12px)}
  .dform{grid-template-columns:minmax(0,1fr)}
  .dl-in{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dtabs{margin:0 -16px;padding:0 16px}
  .dtot b{font-size:18px}
  .kp-top{flex-direction:column;align-items:flex-start}
  .kp-t{text-align:left}
  .kp-kv{grid-template-columns:minmax(0,1fr);gap:2px}
  .kp-kv dd{margin-bottom:8px}
}

/* печать: только коммерческое предложение */
@media print{
  html,body{height:auto;background:#fff}
  .app,#drawer-root,.toasts,.no-print,.modal-h{display:none!important}
  #modal-root .modal-wrap{position:static;display:block;padding:0;background:none;animation:none}
  #modal-root .modal{width:100%;max-height:none;overflow:visible;border-radius:0;box-shadow:none;background:#fff}
  #modal-root .modal-b{padding:0}
  .kp{color:#111;gap:14px}
  .kp *{color:#111!important;border-color:#999!important}
  .kp .hint,.kp .muted,.kp-t p,.kp-kv dt{color:#555!important}
  .kp .tbl th{background:#f0f0f0}
  .kp .logo{background:#fff}
  .kp .xs{overflow:visible}
}

/* ——— переписка ——— */
.chat{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:18px;background:var(--sunken)}
.bub{max-width:88%;padding:9px 12px;border-radius:14px 14px 14px 4px;background:var(--surface);font-size:13.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.out{align-self:flex-end;border-radius:14px 14px 4px 14px;background:var(--primary-soft)}
.bub small{display:block;margin-top:4px;font-size:11px;color:var(--ink-3)}
.bub mark{padding:0 3px;border-radius:4px;background:var(--bad-soft);color:var(--bad)}
.prev-h{margin:0 0 8px;font-size:12.5px;color:var(--ink-3)}
.tpl-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.vars{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}
.compose{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.rules{margin:0;padding:0 16px 8px;list-style:none}
.rule{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule p{margin:0;font-size:13.5px;color:var(--ink-2)}
.rule p+p{margin-top:2px}
.rule b{color:var(--ink);font-weight:600}
.sw{position:relative;flex:none;margin-top:1px}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.sw-t{position:relative;display:block;width:38px;height:22px;border-radius:11px;background:var(--line-2);transition:background .15s}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+.sw-t{background:var(--ok)}
.sw input:checked+.sw-t::after{transform:translateX(16px)}
.sw input:focus-visible+.sw-t{outline:2px solid var(--primary);outline-offset:2px}
.sw input:disabled+.sw-t{opacity:.5}

/* таблица журнала сообщений */
.msg-cell{min-width:280px;max-width:520px}

@media (max-width:1100px){
  .tpl-grid{grid-template-columns:minmax(0,1fr)}
}

/* ——— права ——— */
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;z-index:1;min-width:240px;background:var(--surface)}
.matrix th:first-child{background:var(--surface-2)}
.matrix input{width:18px;height:18px;accent-color:var(--primary)}

/* ——— лиды: список, воронка, карточка ——— */
.lbar .search-in{flex:1 1 260px;max-width:380px}
.lfilt{gap:8px}
.lfilt .inp{max-width:100%}
.l-show-s{display:none}
/* воронка: столбцы — этапы, на телефоне друг под другом */
.lkan{display:grid;grid-template-columns:repeat(var(--n),minmax(210px,1fr));gap:12px}
.lkan .col{min-height:180px}
.lcard .tc-t small{display:block;margin-top:2px;font-size:11.5px;color:var(--ink-3)}
.lcard .lc-x{display:-webkit-box;margin:0;overflow:hidden;overflow-wrap:anywhere;font-size:12.5px;line-height:1.4;color:var(--ink-2);-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lcard .tc-m{flex-wrap:wrap}
/* метка «ждёт N мин»: в списке под этапом, в воронке отдельной строкой карточки */
.lead-wait .ic{width:12px;height:12px}
.tcard>.lead-wait{align-self:flex-start}
td>.lead-wait{margin-top:4px}
/* карточка лида */
.lead-act{display:flex;flex-wrap:wrap;gap:8px}
.lead-waitnote{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0;font-size:13px;color:var(--ink-2)}
.lead-waitnote>span{min-width:0;overflow-wrap:anywhere}
.drawer .mv li>span{min-width:0;overflow-wrap:anywhere}

@media (max-width:700px){
  .lkan{grid-template-columns:minmax(0,1fr)}
  .l-hide-s{display:none}
  .l-show-s{display:inline}
  .lbar .search-in{flex-basis:100%;max-width:none}
  .lbar .btn.sm{white-space:normal;height:auto;min-height:30px;padding-block:5px;text-align:left}
}

/* ——— Настройки → Лиды ——— */
.lset-opts{display:flex;flex-direction:column;gap:8px}
.lset-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.lset-opt.on{border-color:var(--primary);background:var(--primary-soft)}
.lset-opt input{margin-top:2px}
.lset-opt span{display:flex;flex-direction:column;gap:2px}
.lset-opt small{font-size:12.5px;color:var(--ink-2)}
.lset-list{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.lset-list li{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:4px 16px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.lset-list li:first-child{border-top:0}
.lset-list span{color:var(--ink-2)}
@media (max-width:700px){.lset-list li{grid-template-columns:minmax(0,1fr)}}
.lwait{max-width:260px}
@media (max-width:700px){.lwait{max-width:none}}

/* ——— почта: три столбца (ящики и папки · письма · письмо), на телефоне — один с кнопкой «назад» ——— */
.mail-hint{margin:0}
.mail{display:grid;grid-template-columns:minmax(210px,250px) minmax(280px,360px) minmax(0,1fr);gap:14px;align-items:start}
.mail>.card{max-height:calc(100vh - 190px);min-height:320px;overflow:auto}
.mail-back{display:none;align-self:flex-start}
.mail-nav-b{display:flex;flex-direction:column;gap:6px;padding:0 10px 12px}
.mail-box{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;padding:9px 10px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:left;color:var(--ink)}
.mail-box:hover{background:var(--surface-2)}
.mail-box.on{background:var(--primary-soft);border-color:var(--primary-line)}
.mail-box-t{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.mail-box small{max-width:100%;overflow-wrap:anywhere;font-size:11.5px;color:var(--ink-2)}
.mail-box small.muted{color:var(--ink-3)}
.mail-folds{display:flex;flex-direction:column;gap:1px;margin:-2px 0 4px 10px;padding-left:8px;border-left:2px solid var(--line)}
.mail-fold{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:7px 9px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);font-size:13px;text-align:left}
.mail-fold:hover{background:var(--surface-2)}
.mail-fold.on{background:var(--sunken);color:var(--ink);font-weight:600}
.mail-fold>span:first-child{min-width:0;overflow-wrap:anywhere}
/* список писем */
.mail-bar{display:flex;flex-direction:column;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.mail-title{display:flex;flex-direction:column;gap:1px}
.mail-title small{color:var(--ink-3);font-size:12px}
.mail-bar .search-in{max-width:none;min-width:0}
.mail-items{margin:0;padding:6px;list-style:none}
.mail-li{display:flex;flex-direction:column;gap:3px;width:100%;padding:9px 10px;border:0;border-radius:12px;background:transparent;text-align:left;color:var(--ink)}
.mail-li:hover{background:var(--surface-2)}
.mail-li.on{background:var(--primary-soft)}
.mail-li-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mail-li-top b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.mail-li-top small{flex:none;font-size:11.5px;color:var(--ink-3)}
.mail-li.unread .mail-li-top b,.mail-li.unread .mail-li-sub{font-weight:700}
.mail-li.unread .mail-li-top b::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:var(--sun)}
.mail-li-sub{font-size:13px;overflow-wrap:anywhere}
.mail-li-sn{font-size:12px;color:var(--ink-3);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mail-li-tags{display:flex;flex-wrap:wrap;gap:4px}
.mail-li-tags:empty{display:none}
/* письмо */
.mail-lh{display:flex;flex-direction:column;gap:8px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.mail-lh h2{margin:0;font-size:17px;overflow-wrap:anywhere}
.mail-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:0;font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.mail-body{padding:14px 18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.55}
.mail-replies{display:flex;flex-direction:column;gap:10px;padding:0 18px 12px}
.mail-replies h4{margin:0;font-size:13px;color:var(--ink-2)}
.mail-reply{padding:10px 12px;border-left:3px solid var(--sun);border-radius:0 12px 12px 0;background:var(--sun-soft);color:var(--sun-ink)}
.mail-reply-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.mail-reply-h small{color:var(--sun-ink);font-size:11.5px}
.mail-reply p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);font-size:13.5px}
.mail-act{display:flex;flex-direction:column;gap:14px;padding:4px 18px 18px}
.mail-reply-f{display:flex;flex-direction:column;gap:10px}
.mail-reply-f textarea{height:auto;padding:9px 11px;resize:vertical}
.mail-reply-btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.mail-rem{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px dashed var(--line-2);border-radius:14px;background:var(--surface-2)}
.mail-rem-f{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:end}
.mail-empty{display:grid;place-items:center}

/* ——— Настройки → Почта ——— */
.mset-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:10px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.mset-row:first-of-type{border-top:0}
.mset-box{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.mset-box:first-of-type{border-top:0}
.mset-roles{display:flex;flex-wrap:wrap;gap:6px 16px}
.mset-add{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mset-add .wide{grid-column:1/-1}
.mset-name{display:flex;flex-wrap:wrap;align-items:center;gap:6px}

@media (max-width:1100px){
  .mail{grid-template-columns:minmax(190px,220px) minmax(0,1fr)}
  .mail-letter{grid-column:1/-1}
  .mail>.mail-letter{max-height:none}
}
@media (max-width:900px){
  /* один столбец: ящики и папки → письма → письмо, назад — кнопкой */
  .mail{grid-template-columns:minmax(0,1fr)}
  .mail>.card{display:none;max-height:none}
  .mail[data-pane="nav"]>.mail-nav,.mail[data-pane="list"]>.mail-list,.mail[data-pane="letter"]>.mail-letter{display:block}
  .mail[data-pane="letter"]>.mail-letter.mail-empty{display:grid}
  .mail-back{display:inline-flex}
  .mail[data-pane="nav"] .mail-back{display:none}
  .mail-rem-f,.mset-row,.mset-box,.mset-add{grid-template-columns:minmax(0,1fr)}
}

/* ——— «Настройки → Воронки» и режим «Редактировать доску»: один редактор воронок ——— */
.pe-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.pe-name{flex:1 1 220px;max-width:420px;min-width:0;font-weight:600}
.pe-stage{display:flex;align-items:center;gap:6px;min-width:0}
.pe-sname{flex:1;min-width:0}
.pe-lock{color:var(--ink-3)}
.pe-list{margin:0;padding:0;list-style:none}
.pe-row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.pe-row:first-child{border-top:0}
.pe-n{width:22px;flex:none;text-align:right;font-size:12px;color:var(--ink-3)}
.pe-main{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:4px}
.pe-why{display:flex;align-items:flex-start;gap:5px;font-size:12px;color:var(--ink-3)}
.pe-why .ic{width:13px;height:13px;flex:none;margin-top:1px}
.pe-cnt{white-space:nowrap}
.pe-foot{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
@media (max-width:560px){
  .pe-row{align-items:flex-start}
  .pe-cnt{flex-basis:100%;padding-left:32px}
}

/* ——— «Настройки → Уведомления» ——— */
.nset-g{margin:18px 0 2px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.nset-g:first-of-type{margin-top:14px}
.nset-list{margin:0;padding:0;list-style:none}
.nset-row{display:flex;align-items:flex-start;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.nset-list>.nset-row:first-child{border-top:0}
.nset-row .sw{margin-top:2px}
.nset-t{min-width:0}
.nset-t b{display:block;font-size:13.5px;font-weight:600}
.nset-t span{display:block;margin-top:1px;font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.nset-test{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px}
.nset-test .hint{flex:1 1 260px}
.seg[role=radiogroup]{border-radius:16px}

/* ——— «Настройки → Роли и права» ——— */
.mx-h{display:inline-flex;align-items:center;justify-content:center;gap:2px}
.mx-own{display:block;font-weight:400;font-size:11px;color:var(--ink-3)}
.perm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 18px;margin:0;padding:0;border:0;min-width:0}
.perm-grid legend{padding:0;margin-bottom:8px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.perm-opt{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;line-height:1.35;cursor:pointer}
.perm-opt input{flex:none;width:18px;height:18px;margin:0;accent-color:var(--primary)}
.role-add-f{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px}

/* ——— отправки: список, воронка, карточка, форма ——— */
.dspbar .search-in{flex:1 1 260px;max-width:380px}
.dspfilt{gap:8px}
.dspfilt .inp{max-width:100%}
.dsp-show-s{display:none}
/* воронка: колонки — этапы, контейнер листается вбок (data-hscroll), страница — нет */
.dspkan{display:grid;grid-template-columns:repeat(var(--n),minmax(240px,1fr));gap:12px;min-width:calc(var(--n) * 240px + (var(--n) - 1) * 12px)}
.dspkan .col{min-height:200px}
.dspcard .tc-t small{display:block;margin-top:2px;font-size:11.5px;color:var(--ink-3)}
.dspcard .dsp-ad{margin:0;overflow-wrap:anywhere;font-size:12.5px;line-height:1.4;color:var(--ink-2)}
.dspcard .tc-m{flex-wrap:wrap}
.dspcard.done{opacity:.8}
/* блок «Назначены мне» */
.dsp-mine-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.dsp-mi{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:13.5px;cursor:pointer}
.dsp-mi:hover{border-color:var(--line-2);background:var(--surface-2)}
.dsp-mi b{overflow-wrap:anywhere}
.dsp-mi span{overflow-wrap:anywhere}

/* карточка заявки: один столбец, крупные кнопки */
.dsp-stages,.dsp-quick{display:flex;flex-direction:column;gap:8px}
.dsp-stages:empty{display:none}
.dsp-stg{height:auto;min-height:52px;padding:10px 14px;font-size:16px;line-height:1.25;white-space:normal;text-align:center}
.dsp-cancel{color:var(--bad)}
.dsp-call{text-decoration:none}
.dsp-route{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:14px;background:var(--surface-2)}
.dsp-route .ic{width:16px;height:16px;vertical-align:-3px}
.dsp-assign{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.dsp-assign .inp{flex:1 1 180px;min-width:0}
.dsp-lines{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.dsp-lines li{border-top:1px solid var(--line)}
.dsp-lines li:first-child{border-top:0}
.dsp-line{display:flex;align-items:flex-start;gap:12px;min-height:44px;padding:10px 0;cursor:pointer}
.dsp-line input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--primary)}
.dsp-line span{min-width:0;overflow-wrap:anywhere;font-size:14px}
.dsp-sold{display:block;margin-top:2px;font-size:12px;color:var(--ink-3)}
.dsp-sell{margin:0 0 10px 34px}
.dsp-files{display:flex;flex-wrap:wrap;gap:8px}
.dsp-files>p{width:100%}
.dsp-th{position:relative;display:flex;flex-direction:column;gap:4px;width:96px;margin:0;padding:0;border:0;background:transparent;text-align:left}
.dsp-th img{width:96px;height:96px;border-radius:10px;object-fit:cover;background:var(--sunken)}
.dsp-th small{max-width:96px;overflow:hidden;font-size:11.5px;color:var(--ink-3);text-overflow:ellipsis;white-space:nowrap}
.dsp-fl{position:relative;display:flex;align-items:center;gap:8px;min-width:0;max-width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:13px;text-decoration:none}
.dsp-fl .ic{flex:none;width:18px;height:18px;color:var(--ink-3)}
.dsp-fl span{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}
.dsp-fl small{font-size:11.5px;color:var(--ink-3)}
.dsp-fl small.warn-t{color:var(--warn)}
.dsp-fl.bad{border-color:var(--warn)}
.dsp-th .dsp-rm{position:absolute;top:2px;right:2px;width:26px;height:26px;background:var(--surface)}
.dsp-big{display:block;max-width:100%;max-height:70vh;margin:0 auto;border-radius:12px;object-fit:contain}

/* форма */
.dsp-form .dsp-addfile{align-self:flex-start;cursor:pointer}
.dsp-form [aria-invalid="true"]{border-color:var(--bad);outline:1px solid var(--bad)}
.dsp-its,.dsp-pres{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.dsp-it{display:grid;grid-template-columns:minmax(0,1fr) 84px 36px;align-items:center;gap:8px}
.dsp-it-n{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:13.5px}
.dsp-it-n b{font-weight:600;overflow-wrap:anywhere}
.dsp-it-n small{font-size:12px;color:var(--ink-3)}
.dsp-q{padding:0 6px;text-align:right}
.dsp-own{display:flex;gap:8px}
.dsp-own .inp{flex:1 1 auto;min-width:0}

@media (max-width:700px){
  .dsp-hide-s{display:none}
  .dsp-show-s{display:block}
  .dspbar .search-in{flex-basis:100%;max-width:none}
  .dsp-own{flex-wrap:wrap}
  .dsp-own .btn{width:100%}
  .dsp-mine-l{grid-template-columns:minmax(0,1fr)}
}

/* ——— клиенты: список, карточка, подсказка о дубле ——— */
.cbar .search-in{flex:1 1 260px;max-width:380px}
.c-show-s{display:none}
.cform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cform .field small{font-size:12px;color:var(--ink-3)}
.cform .field>span:not(.lbl){font-size:14px;overflow-wrap:anywhere}

/* связанные записи в карточке: кнопка-строка с названием, подписью и суммой */
.crel{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.crow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;width:100%;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-size:13.5px;text-align:left}
button.crow{cursor:pointer}
button.crow:hover{border-color:var(--line-2);background:var(--surface-2)}
.crow-t{display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.crow-t small{font-size:12px;color:var(--ink-3)}
.crow-s{flex:none;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.cmsg-t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--ink-2)}

/* «Похоже, это …»: найденный клиент и кнопка «Выбрать его» */
.dup{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:1px solid var(--warn);border-radius:12px;background:var(--warn-soft)}
.dup-l{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.dup-l li{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-width:0}
.dup-t{display:flex;align-items:flex-start;gap:8px;min-width:0;font-size:13.5px;color:var(--ink)}
.dup-t>.ic{flex:none;width:16px;height:16px;margin-top:2px;color:var(--warn)}
.dup-t>span{display:flex;flex-direction:column;gap:1px;min-width:0;overflow-wrap:anywhere}
.dup-t small{font-size:12px;color:var(--ink-2)}
.dup .btn{flex:none}
.dup .hint{color:var(--ink-2)}

@media (max-width:700px){
  .cbar .search-in{flex-basis:100%;max-width:none}
  .c-hide-s{display:none}
  .c-show-s{display:inline}
  .cform{grid-template-columns:minmax(0,1fr)}
  .dup-l li{flex-direction:column;align-items:stretch}
  .dup .btn{align-self:flex-start}
}

/* «Настройки → Лиды и сделки»: список причин отказа */
.lreasons{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.lreason{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px}
.lreason small{white-space:nowrap}
.lreason-new{display:flex;gap:8px}
.lreason-new .inp{flex:1;min-width:0}
@media (max-width:700px){
  .lreason{grid-template-columns:minmax(0,1fr) auto}
  .lreason small{grid-column:1;grid-row:2}
  .lreason .btn{grid-column:2;grid-row:1}
  .lreason-new{flex-direction:column;align-items:stretch}
}
</style>

const Store = (() => {
  const KEY = 'ws-crm-v3';
  const VERSION = 3;
