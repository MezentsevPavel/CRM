    const ik = innKey(q.inn), ek = emailKey(q.email), pk = phonesOf(q).map(phoneKey);
    let s = 0;
    if (ik && innKey(c.inn) === ik) s = 3;
    else if (pk.length && (c.phones || []).some(p => pk.includes(phoneKey(p)))) s = 2;
    else if (ek && emailKey(c.email) === ek) s = 1;
    return s;
  }

  // Найденные клиенты с тем же ИНН, телефоном или почтой: сначала совпавшие по ИНН, затем по телефону, затем по почте.
  function find(st, q = {}) {
    return (st.clients || []).map(c => ({ c, s: score(c, q) })).filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s).map(x => x.c);
  }

  // Вид по данным: есть ИНН или сказано «компания» — компания; иначе человек.
  const kindOf = data => (KIND[data.kind] ? data.kind : (innKey(data.inn) ? 'company' : 'person'));

  // Завести клиента без проверки прав (его зовут и сами записи: лид → сделка, демо). Без названия — нельзя.
  function make(st, data, by, now) {
    const name = str(data.name);
    if (!name) return { ok: false, id: null, client: null, missing: ['name'], reason: 'Не заполнено: название клиента.' };
    st.clients = st.clients || [];
    const c = { id: Leads.nextId(st.clients, 'К', 0), kind: kindOf(data), name, phones: phonesOf(data), demo: !!data.demo };
    if (innKey(data.inn)) c.inn = str(data.inn);
    if (str(data.email)) c.email = str(data.email);
    if (str(data.address)) c.address = str(data.address);
    if (data.managerId && personOf(st, data.managerId)) c.managerId = data.managerId;
    st.clients.push(c);
    Feed.add(st, { t: 'client', id: c.id }, { kind: 'create', text: `Клиент заведён: ${c.name}`, by, at: now });
    return { ok: true, id: c.id, client: c, missing: [], reason: '' };
  }

  // Может ли человек заводить и править клиентов: право «клиенты». by пустой — это система (демо, импорт).
  const canEdit = (st, by) => !by || (!!personOf(st, by) && Perms.can(st, by, 'clients'));
  const NO_RIGHT = { ok: false, id: null, client: null, missing: [], reason: 'У вашей роли нет права заводить и править клиентов.' };

  // Новый клиент: {name, kind?, inn?, phone | phones?, email?, address?, managerId?, demo?}.
  // Без названия — {ok:false, missing:['name']}. Дубли здесь не проверяются: «Похоже, это…» показывает форма по find.
  function create(st, data, by, now) {
    if (!canEdit(st, by)) return NO_RIGHT;
    return make(st, data || {}, by, now);
  }

  // Поля клиента, которые правятся, и их подписи в ленте.
  const LABEL = { name: 'Название', kind: 'Вид', inn: 'ИНН', phones: 'Телефоны', email: 'Почта', address: 'Адрес', managerId: 'Менеджер' };
  const show = (st, f, v) => {
    if (f === 'kind') return KIND[v] || 'нет данных';
    if (f === 'phones') return (v || []).join(', ') || 'нет данных';
    if (f === 'managerId') return (personOf(st, v) || {}).name || 'нет данных';
    return str(v) || 'нет данных';
  };

  // Правка клиента: patch — любые из name, kind, inn, phones (список целиком, заменяет), email, address, managerId.
  // Пустое название нельзя. Изменение — запись в ленту клиента; новое название едет в сделки клиента (deal.client).
  // → {ok, changed:[поле…], reason}
  function update(st, id, patch, by, now) {
    const c = byId(st, id), p = patch || {};
    if (!c) return { ok: false, changed: [], reason: 'Такого клиента нет.' };
    if (!canEdit(st, by)) return { ok: false, changed: [], reason: NO_RIGHT.reason };
    const next = {};
    for (const f of Object.keys(LABEL)) {
      if (!(f in p)) continue;
      let v = p[f];
      if (f === 'name') { v = str(v); if (!v) return { ok: false, changed: [], reason: 'Название клиента не может быть пустым.' }; }
      else if (f === 'kind') { if (!KIND[v]) return { ok: false, changed: [], reason: 'Вид клиента — человек или компания.' }; }
      else if (f === 'phones') v = phonesOf({ phones: v });
      else if (f === 'managerId') { v = v || null; if (v && !personOf(st, v)) return { ok: false, changed: [], reason: 'Такого сотрудника нет.' }; }
      else v = str(v);
      const same = f === 'phones' ? v.join('|') === (c.phones || []).join('|') : (c[f] == null ? '' : c[f]) === (v == null ? '' : v);
      if (!same) next[f] = v;
    }
    const changed = Object.keys(next), lines = [], data = [];
    for (const f of changed) {
      lines.push(`${LABEL[f]}: ${show(st, f, c[f])} → ${show(st, f, next[f])}`);
      data.push({ field: f, from: c[f] == null ? null : c[f], to: next[f] });
      if (next[f] === '' || next[f] === null) delete c[f]; else c[f] = next[f];
    }
    if (changed.includes('name')) for (const d of st.deals || []) if (d.clientId === c.id) d.client = c.name;
    if (changed.length) Feed.add(st, { t: 'client', id: c.id }, { kind: 'field', text: lines.join('; '), by, at: now, data: { changes: data } });
    return { ok: true, changed, reason: '' };
  }

  // Найти клиента по ИНН, телефону или почте (первый — самый надёжный по find) или завести нового. → {client, created}.
  // У найденного дописываются то, чего не хватало: новые телефоны, почта, ИНН, адрес (занятое не затирается).
  // Без совпадений и без названия клиента не будет: {client:null, created:false}.
  function findOrCreate(st, data, by, now) {
    const d = data || {}, found = find(st, d)[0];
    if (!found) {
      const r = make(st, d, by, now);
      return { client: r.client, created: r.ok };
    }
    const add = [];
    const have = new Set((found.phones || []).map(phoneKey));
    for (const ph of phonesOf(d)) if (!have.has(phoneKey(ph))) { (found.phones = found.phones || []).push(ph); have.add(phoneKey(ph)); add.push(`телефон ${ph}`); }
    for (const [f, label] of [['email', 'почта'], ['inn', 'ИНН'], ['address', 'адрес']]) {
      if (!str(found[f]) && str(d[f]) && (f !== 'inn' || innKey(d.inn))) { found[f] = str(d[f]); add.push(`${label} ${found[f]}`); }
    }
    if (add.length) Feed.add(st, { t: 'client', id: found.id }, { kind: 'field', text: `Из заявки добавлено: ${add.join(', ')}`, by, at: now });
    return { client: found, created: false };
  }

  // Принадлежит ли лид клиенту: привязан явно (clientId) или, пока не привязан, совпал телефоном, почтой или ИНН.
  const leadBelongs = (c, l) => (l.clientId ? l.clientId === c.id : score(c, l) > 0);

  // Всё, что относится к клиенту: {leads, deals, msgs, dispatches}. personId — только то, что этому человеку видно:
  // лиды по Leads.visible, сделки по Leads.dealsVisible (сделки чужого типа не видны), сообщения — по этим сделкам.
  // Отправки — по этим сделкам и те заявки, где телефон получателя совпал с телефоном клиента (phoneKey; раздел видят все,
  // поэтому совпавшие по телефону показываются без проверки видимости), каждая один раз. Без personId — всё.
  function related(st, clientId, personId) {
    const c = byId(st, clientId), none = { leads: [], deals: [], msgs: [], dispatches: [] };
    if (!c) return none;
    const deals = (personId ? Leads.dealsVisible(st, personId) : (st.deals || [])).filter(d => d.clientId === c.id);
    const leads = (personId ? Leads.visible(st, personId) : (st.leads || [])).filter(l => leadBelongs(c, l));
    const ids = new Set(deals.map(d => d.id));
    const phones = new Set((c.phones || []).map(phoneKey).filter(Boolean));
    return {
      leads, deals,
      msgs: (st.msgs || []).filter(m => ids.has(m.deal)),
      dispatches: (st.dispatches || []).filter(x => ids.has(x.dealId) || phones.has(phoneKey(x.to && x.to.phone))),
    };
  }

  // Клиенты по строке поиска: название, телефон (по цифрам), ИНН, почта. Пустая строка — все. Для списка «Клиенты».
  function search(st, q) {
    const s = str(q).toLowerCase(), pk = phoneKey(q), ik = innKey(q);
    if (!s) return (st.clients || []).slice();
    return (st.clients || []).filter(c =>
      c.name.toLowerCase().includes(s) || emailKey(c.email).includes(s)
      || (pk.length >= 3 && (c.phones || []).some(p => phoneKey(p).includes(pk)))
      || (ik.length >= 3 && innKey(c.inn).includes(ik)));
  }

  return { KIND, phoneKey, byId, find, create, update, findOrCreate, related, search };
})();

// Шаг SEEDS: демо-клиенты. Каждая сделка получает клиента (clientId) из своего названия, контакта и телефона: сделки из лидов
// уже получили его при создании, прежние сделки v2 — здесь. Всё помечено «пример» (demo:true и слово в названии),
// телефоны вида +7 900 000-00-NN, ИНН и почта — условные: настоящих людей и компаний тут нет.
// У прежних сделок v2 текст deal.client остаётся как был (его читают уведомления приёмки), «(пример)» — в названии клиента.
// Лиды с тем же телефоном или ИНН привязываются к тому же клиенту: два открытых лида повторно обращаются под данными
// клиентов Д-311 и Д-314 — это и есть образец «Похоже, это …».
SEEDS.push(st => {
  st.clients = st.clients || [];
  const when = day(-12, 9, 0);
  // условные данные для прежних сделок v2 (в самих сделках телефонов нет)
  const CONTACT = {
    'Д-311': { phone: '+7 900 000-00-31', email: 'primer31@example.com' },
    'Д-314': { phone: '+7 900 000-00-32', inn: '0000000101' },
    'Д-318': { phone: '+7 900 000-00-33' },
    'Д-320': { phone: '+7 900 000-00-34', inn: '0000000102', email: 'primer34@example.com' },
    'Д-305': { phone: '+7 900 000-00-35' },
    'Д-322': { phone: '+7 900 000-00-36' },
  };
  for (const d of st.deals.filter(x => !x.clientId)) {
    const c = CONTACT[d.id] || {};
    const { client } = Clients.findOrCreate(st, {
      name: `${d.client} (пример)`, kind: d.type === 'b2b' ? 'company' : 'person',
      phone: d.phone || c.phone, email: d.email || c.email, inn: c.inn, managerId: d.managerId, demo: true,
    }, null, when);
    d.clientId = client.id;
    if (!d.phone && client.phones[0]) d.phone = client.phones[0];
    if (!d.email && client.email) d.email = client.email;
  }
  // два открытых лида повторно пришли под данными клиентов: B2C — под телефоном Д-311, B2B — под ИНН Д-314
  const open = l => !Pipes.isFinal(st, l.pipeId, l.stageId);
  const again = (type, key, from) => {
    const lead = st.leads.find(l => open(l) && l.type === type && !l.dealId && l[key]);
    const src = Clients.byId(st, st.deals.find(x => x.id === from).clientId);
    if (!lead || !src) return;
    if (key === 'phone') lead.phone = src.phones[0]; else lead[key] = src[key];
  };
  again('b2c', 'phone', 'Д-311');
  again('b2b', 'inn', 'Д-314');
  for (const l of st.leads) {
    const c = Clients.find(st, l)[0];
    if (c && !l.clientId) l.clientId = c.id;
  }
});

// Ядро и вид: одна лента для всех карточек — сделка, лид, клиент, отправка. Комментарии и события, новые сверху.
// Лента хранит только свои записи (st.feed); остальное подмешивает of(): историю лида, резервы по сделке,
// сообщения клиенту, а у клиента — ленты его сделок и лидов; у сделки — ленты её отправок. Дела (T10) и отправки (T07) пишут сюда же.
// Чистые функции над состоянием st; время приходит параметром. Вид feedHtml не меняет состояние.

const Feed = (() => {
  // Виды записей и подписи. Модули дел и отправок добавляют свои виды сюда же: Feed.KINDS.act = 'Дело'.
  const KINDS = {
    comment: 'Комментарий', create: 'Создано', stage: 'Этап', field: 'Изменение', item: 'Товары',
    reserve: 'Резерв', win: 'Успешно', lose: 'Провалена', msg: 'Сообщение клиенту', history: 'История', act: 'Дело выполнено', actmove: 'Дела из лида',
    dispatch: 'Отправка',
  };
  // Что есть ссылка на карточку и как её назвать в ленте клиента.
  const REF = { deal: 'Сделка', lead: 'Лид', client: 'Клиент', dispatch: 'Отправка' };

  const same = (a, b) => !!a && !!b && a.t === b.t && a.id === b.id;
  const time = at => { const n = at == null ? NaN : new Date(at).getTime(); return isNaN(n) ? null : n; };
  const nameOf = (st, id) => ((st.products || []).find(p => p.id === id) || {}).name || 'нет данных: товар';

  // Запись в ленту ref = {t:'deal'|'lead'|'client'|'dispatch', id}: {kind, text, by, at, data?}.
  // Без ссылки, текста или времени записи не будет (null). Новая запись — в конец st.feed; порядок показа решает of().
  function add(st, ref, { kind, text, by, at, data } = {}) {
    const t = String(text == null ? '' : text).trim();
    if (!ref || !REF[ref.t] || !ref.id || !t || time(at) === null) return null;
    st.feed = st.feed || [];
    const e = { id: Store.freeId(st.feed, 'f'), ref: { t: ref.t, id: ref.id }, at, by: by || null, kind: kind || 'comment', text: t };
    if (data !== undefined) e.data = data;
    st.feed.push(e);
    return e;
  }

  // Где резерв и до какого числа: «со склада (ИП, Иркутск)» или «из поставки П-1043». Единственная фраза о резерве:
  // её читают лента сделки, уведомление складу и карточка. withDeal — добавить «для Д-311 (клиент)».
  function reserveText(st, r, withDeal) {
    const where = r.src === 'stock' || !r.src
      ? `со склада (${Stock.entityName(st, r.entityId || Stock.ANY) ?? r.entityId}, ${Stock.cityName(st, r.cityId || Stock.ANY) ?? r.cityId})`
      : `из поставки ${r.src}`;
    const d = withDeal ? (st.deals || []).find(x => x.id === r.dealId) : null;
    const forDeal = d ? ` для ${d.id} (${d.client})` : '';
    return `Резерв: ${low(nameOf(st, r.productId))} — ${num(r.qty)} ${where}${forDeal}${r.until ? ' до ' + fD(r.until) : ''}.`;
  }

  // Когда и кем поставлен резерв: своя отметка (at, by), иначе запись «Резерв» в журнале движений по той же сделке.
  function reserveWhen(st, r) {
    if (time(r.at) !== null) return { at: r.at, by: r.by || null };
    const m = (st.moves || []).find(x => x.kind === Stock.KINDS.reserve && x.doc === r.dealId && x.productId === r.productId && x.qty === r.qty);
    return m ? { at: m.at, by: m.by || null } : { at: null, by: null };
  }

  // Записи, которые лента подмешивает сама, по виду карточки. Каждая — как запись ленты со своей ссылкой ref.
  function synthetic(st, ref, own) {
    const out = [];
    if (ref.t === 'lead') {
      const l = (st.leads || []).find(x => x.id === ref.id);
      ((l && l.history) || []).forEach((h, i) => out.push({ id: `h:${ref.id}:${i}`, ref, at: h.at, by: h.by || null, kind: 'history', text: h.text }));
    }
    // выполненные дела карточки: серые записи, пишутся в момент выполнения (Acts.done), здесь только показываются
    for (const a of st.acts || []) {
      if (!a.doneAt || a.ref.t !== ref.t || a.ref.id !== ref.id) continue;
      out.push({ id: `a:${a.id}`, ref, at: a.doneAt, by: a.doneBy || null, kind: 'act', text: Acts.doneText(a), data: { actId: a.id, type: a.type, ownerId: a.ownerId } });
    }
    if (ref.t === 'deal') {
      const done = new Set(own.filter(e => e.data && e.data.reserveId).map(e => e.data.reserveId));
      for (const r of st.reserves || []) {
        if (r.dealId !== ref.id || done.has(r.id)) continue;
        const w = reserveWhen(st, r);
        out.push({ id: `r:${r.id}`, ref, at: w.at, by: w.by, kind: 'reserve', text: reserveText(st, r), data: { reserveId: r.id, productId: r.productId, qty: r.qty } });
      }
      for (const m of st.msgs || []) {
        if (m.deal !== ref.id) continue;
        out.push({ id: `m:${m.id}`, ref, at: m.at, by: m.by || null, kind: 'msg', text: m.text, data: { channel: m.channel, inbound: !!m.inbound, auto: !!m.auto } });
      }
    }
    return out;
  }

  // Лента карточки: записи по времени, новые сверху (при одинаковом времени — позже добавленные выше); без времени — в конце.
  // personId (необязательно) — у клиента подмешиваются только сделки и лиды, которые этот человек видит.
  function of(st, ref, personId) {
    const all = [];
    const take = (r, wrap) => {
      const own = (st.feed || []).filter(e => same(e.ref, r));
      own.forEach(e => all.push(wrap ? wrap(e) : e));
      synthetic(st, r, own).forEach(e => all.push(wrap ? wrap(e) : e));
    };
    take(ref);
    // у сделки — ещё ленты её отправок (заявки с этим dealId), с подписью «Отправка ОТ-NNN». Их записи идут видом 'dispatch'
    // (прежний вид — в data.was), чтобы этапы заявки не путались с этапами самой сделки.
    const asDispatch = e => ({ ...e, kind: 'dispatch', data: { ...(e.data || {}), was: e.kind } });
    if (ref.t === 'deal') (st.dispatches || []).filter(d => d.dealId === ref.id).forEach(d => take({ t: 'dispatch', id: d.id }, asDispatch));
    if (ref.t === 'client') {
      const rel = Clients.related(st, ref.id, personId);
      rel.deals.forEach(d => take({ t: 'deal', id: d.id }));
      rel.leads.forEach(l => take({ t: 'lead', id: l.id }));
    }
    return all.map((e, i) => ({ e, i, t: time(e.at) }))
      .sort((a, b) => (a.t === null) - (b.t === null) || (b.t - a.t) || (b.i - a.i))
      .map(x => ({ ...x.e }));
  }

  // Кто может писать в ленту карточки: сделка и клиент — право «клиенты» (сделку человек должен видеть), лид — «лиды»
  // (и видеть лид), отправка — Dispatch.canComment: любой сотрудник (раздел видят все).
  function canComment(st, personId, ref) {
    if (!ref || !(st.people || []).some(p => p.id === personId)) return false;
    if (ref.t === 'deal') return Leads.dealsVisible(st, personId).some(d => d.id === ref.id);
    if (ref.t === 'lead') return Leads.visible(st, personId).some(l => l.id === ref.id);
    if (ref.t === 'client') return Perms.can(st, personId, 'clients');
    if (ref.t === 'dispatch') return Dispatch.canComment(st, personId, Dispatch.byId(st, ref.id));
    return false;
  }

  // Комментарий в ленту: пустой текст и чужая карточка — отказ с причиной. → {ok, entry, reason}
  function comment(st, ref, text, by, now) {
    if (!String(text == null ? '' : text).trim()) return { ok: false, entry: null, reason: 'Напишите комментарий.' };
    if (!canComment(st, by, ref)) return { ok: false, entry: null, reason: 'У вас нет права писать в эту ленту.' };
    const entry = add(st, ref, { kind: 'comment', text, by, at: now });
    return entry ? { ok: true, entry, reason: '' } : { ok: false, entry: null, reason: 'Не удалось записать комментарий.' };
  }

  return { KINDS, REF, add, of, reserveText, reserveWhen, canComment, comment };
})();

// ——— вид ———
// Лента карточки: «Запланировать» сверху, открытые дела над лентой (ближайшее первым, просроченные красным),
// поле «Комментарий» и сама лента, новые записи сверху. Один вид для лида, сделки, клиента и отправки. Не меняет состояние.
// st по умолчанию — S; видит человек st.me; now — для «просрочено» (по умолчанию сейчас).
// Класс feed-add / data-form="feed-comment" — форма комментария (feedCommentForm), data-form="act-plan" — форма дела (feedWire).

Object.assign(IC,{phone:'<path d="M6.5 3.5h3l1.5 4-2 1.3a10 10 0 0 0 5.2 5.2l1.3-2 4 1.5v3a2 2 0 0 1-2.2 2A15.5 15.5 0 0 1 4.5 5.7 2 2 0 0 1 6.5 3.5z"/>'});
// Значок вида дела
const ACT_IC = { call: 'phone', meet: 'users', mail: 'mail', todo: 'tasks' };
// Дата и время для поля datetime-local: «2026-11-02T10:00»
const actInput = d => iso(d) + 'T' + fT(d);
// Число на пункте меню: мои дела на сегодня и просроченные по карточкам этого вида ('deal' | 'lead'); считает Acts.counts
const actsBadge = type => { const c = Acts.counts(S, S.me, new Date(), type); return c.today + c.overdue; };
const actWho = (st, id) => ((st.people || []).find(p => p.id === id) || {}).name || 'нет данных: сотрудник';

// Форма «Запланировать»: вид, название, срок (быстрые кнопки и поле даты со временем), ответственный (по умолчанию я), напоминание
function actPlanHtml(ref, st, now) {
  const me = st.me, people = (st.people || []).filter(p => Feed.canComment(st, p.id, ref));
  return `<details class="act-plan"><summary class="btn">${ic('plus')}Запланировать дело</summary>
    <form class="act-form" data-form="act-plan" data-t="${esc(ref.t)}" data-id="${esc(ref.id)}" novalidate>
      <div class="field"><label for="act-type">Что</label><select id="act-type" class="inp">${Object.entries(Acts.TYPES).map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join('')}</select></div>
      <div class="field"><label for="act-title">Название</label><input id="act-title" class="inp" placeholder="Например: перезвонить по расчёту" autocomplete="off"></div>
      <div class="field"><label for="act-due">Срок</label><input id="act-due" class="inp" type="datetime-local" value="${esc(actInput(Acts.quick('tomorrow', now)))}"><div class="act-q">${Object.entries(Acts.QUICK).map(([k, l]) => `<button type="button" class="fchip" data-act="act-quick" data-q="${k}">${esc(l)}</button>`).join('')}</div></div>
      <div class="field"><label for="act-owner">Ответственный</label><select id="act-owner" class="inp">${people.map(p => `<option value="${esc(p.id)}"${p.id === me ? ' selected' : ''}>${esc(p.name)}${p.id === me ? ' (я)' : ''}</option>`).join('')}</select></div>
      <div class="field"><label for="act-remind">Напомнить</label><select id="act-remind" class="inp">${Acts.REMINDS.map(([v, l]) => `<option value="${v === null ? '' : v}"${v === 0 ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
      <p class="err" id="act-err" hidden></p>
      <button class="btn pri" type="submit">${ic('check')}Запланировать</button>
    </form></details>`;
}

// Открытые дела: ближайшее первым; просроченное — красным и словом «просрочено»; дел нет — «Нет следующего шага»
function actListHtml(ref, st, now) {
  const list = Acts.open(st, ref, st.me), t = now.getTime();
  if (!list.length) return Acts.noNext(st, ref) ? `<p class="act-empty">${ic('alert')}Нет следующего шага. Запланируйте звонок, встречу или дело.</p>` : '';
  return `<ul class="act-list" aria-label="Открытые дела">${list.map(a => {
    const over = new Date(a.due).getTime() < t;
    const from = a.ref.t !== ref.t || a.ref.id !== ref.id ? `<span class="pill sm">${esc((Feed.REF[a.ref.t] || '') + ' ' + a.ref.id)}</span>` : '';
    return `<li class="act-i k-${esc(a.type)}${over ? ' over' : ''}"><span class="act-ic">${ic(ACT_IC[a.type] || 'tasks')}</span><div class="act-b"><b class="act-t">${esc(a.title)}</b><small>${esc(Acts.TYPES[a.type] || 'Дело')} · ${over ? '<span class="act-late">просрочено</span> · ' : ''}${esc(fWhen(a.due))} · ${esc(actWho(st, a.ownerId))}</small>${from}</div>${Feed.canComment(st, st.me, a.ref) ? `<button type="button" class="btn sm" data-act="act-done" data-id="${esc(a.id)}">${ic('check')}Выполнено</button>` : ''}</li>`;
  }).join('')}</ul>`;
}

// Метка на карточке канбана и в списке: ближайшее дело («звонок · завтра, 10:00») или «нет следующего шага».
// У закрытой карточки метки нет. Просроченное — красным и словом «просрочено».
function actNextHtml(ref, st = S, now = new Date()) {
  if (!Acts.alive(st, ref)) return '';
  const a = Acts.next(st, ref);
  if (!a) return `<span class="pill sm warn act-nx none">${ic('alert')}нет следующего шага</span>`;
  const over = new Date(a.due).getTime() < now.getTime();
  return `<span class="act-nx${over ? ' over' : ''}" title="${esc(a.title)}">${ic(ACT_IC[a.type] || 'tasks')}<span>${esc(Acts.label(a))}${over ? ' · просрочено' : ''}</span></span>`;
}

function feedHtml(ref, st = S, now = new Date()) {
  const me = st.me, who = id => (st.people || []).find(p => p.id === id);
  const kindLabel = e => e.kind === 'msg' && e.data && e.data.inbound ? 'Сообщение от клиента' : (Feed.KINDS[e.kind === 'dispatch' && e.data && e.data.was ? e.data.was : e.kind] || 'Событие');
  const rows = Feed.of(st, ref, me).map(e => {
    const by = e.by ? (who(e.by) ? who(e.by).name : 'нет данных: сотрудник') : (e.kind === 'msg' && e.data && e.data.inbound ? 'Клиент' : 'Система');
    // запись из другой карточки (в ленте клиента — сделка или лид) подписана, откуда она
    const from = e.ref.t !== ref.t || e.ref.id !== ref.id ? `<span class="pill sm">${esc((Feed.REF[e.ref.t] || '') + ' ' + e.ref.id)}</span>` : '';
    const when = e.at ? fWhen(e.at) : 'нет данных: время';
    return `<li class="feed-i k-${esc(e.kind)}"><div class="feed-h"><b>${esc(kindLabel(e))}</b>${from}<small>${esc(by)} · ${esc(when)}</small></div><p class="feed-t">${esc(e.text)}</p></li>`;
  }).join('');
  const can = Feed.canComment(st, me, ref);
  const plan = can && Acts.REFS.includes(ref.t) && Acts.alive(st, ref) ? actPlanHtml(ref, st, now) : '';
  const acts = Acts.REFS.includes(ref.t) ? actListHtml(ref, st, now) : '';
  const form = can
    ? `<form class="feed-add" data-form="feed-comment" data-t="${esc(ref.t)}" data-id="${esc(ref.id)}" novalidate><textarea id="feed-text" class="inp" rows="3" placeholder="Комментарий" aria-label="Комментарий"></textarea><p class="err" id="feed-err" hidden></p><button class="btn pri" type="submit">${ic('chat')}Добавить комментарий</button></form>`
    : `<p class="lock">${ic('lock')}У вашей роли нет права писать в эту ленту.</p>`;
  return `<div class="feed" data-ref-t="${esc(ref.t)}" data-ref-id="${esc(ref.id)}">${plan}${acts}${form}${rows ? `<ol class="feed-list">${rows}</ol>` : '<p class="muted m0">В ленте пока пусто.</p>'}</div>`;
}

// Отправка формы комментария (data-form="feed-comment"): пишет в ленту от имени S.me. Регистрируется в FORMS
// экраном раздела: FORMS['feed-comment'] = feedCommentForm (реестр FORMS объявлен в 50-shell, а этот файл читается раньше).
function feedCommentForm(f) {
  const ta = byId('feed-text'), txt = ta.value.trim();
  if (!txt) { ta.focus(); return; }
  const r = Feed.comment(S, { t: f.dataset.t, id: f.dataset.id }, txt, S.me, new Date());
  if (!r.ok) { showErr('feed-err', r.reason); return; }
  ta.value = '';
  render();
  toast('Комментарий записан в ленту.');
}

// Дела в ленте: окно «Выполнено», форма «Запланировать», быстрые сроки. Реестры A, FORMS, MODALS объявлены в 50-shell,
// а этот файл читается раньше — поэтому регистрация одной функцией, которую зовёт раздел (56-deals.js), как у feedCommentForm.
function feedWire() {
  A['act-quick'] = el => { const inp = byId('act-due'); if (inp) inp.value = actInput(Acts.quick(el.dataset.q, new Date())); };
  A['act-done'] = el => { if (Acts.byId(S, el.dataset.id)) { openModal('actDone', el.dataset.id); const ta = byId('ad-result'); if (ta) ta.focus(); } };
  MODALS.actDone = id => {
    const a = Acts.byId(S, id);
    return `<form data-form="act-done" data-id="${esc(id)}" novalidate>${mHead('Дело выполнено')}<div class="modal-b">
      <p class="m0">${a ? `<b>${esc(a.title)}</b><br><small class="muted">${esc(Acts.label(a))} · ${esc(Acts.refTitle(S, a.ref))}</small>` : ''}</p>
      <div class="field"><label for="ad-result">Результат</label><textarea id="ad-result" class="inp" rows="3" placeholder="Что получилось, о чём договорились"></textarea></div>
      <p class="hint">Дело станет серым и останется в ленте вместе с результатом; править его уже нельзя.</p>
      <p class="err" id="ad-err" hidden></p></div>${mFoot('Выполнено')}</form>`;
  };
  FORMS['act-done'] = f => {
    const r = Acts.done(S, f.dataset.id, byId('ad-result').value, S.me, new Date());
    if (!r.ok) return showErr('ad-err', r.reason);
    closeModal(); render();
    toast(`Дело выполнено: «${r.act.title}». Результат записан в ленту.`);
  };
  FORMS['act-plan'] = f => {
    const due = byId('act-due').value, rem = byId('act-remind').value;
    const r = Acts.plan(S, { t: f.dataset.t, id: f.dataset.id }, {
      type: byId('act-type').value, title: byId('act-title').value, due: due ? new Date(due) : null,
      ownerId: byId('act-owner').value, remind: rem === '' ? null : Number(rem),
    }, S.me, new Date());
    if (!r.ok) return showErr('act-err', r.missing && r.missing.includes('due') ? 'Укажите срок: нажмите «Сегодня», «Завтра» или выберите дату и время.' : r.reason);
    render();
    toast(`Дело запланировано: ${Acts.label(r.act)}. Ответственный: ${actWho(S, r.act.ownerId)}`);
  };
}

// Раз в минуту (и при каждой перерисовке — в render()): напоминания, которым пора, и лиды, которые ждут дольше положенного
// (РОП). Перерисовывает только колокол и меню, чтобы не сбить ввод в открытой форме.
function actsTick() {
  if (!S) return;
  const now = new Date(), made = [...Acts.notify(S, now), ...Leads.notifyWaiting(S, now)];
  if (!made.length) return;
  updBell(); renderSide(); save();
  const mine = made.filter(n => n.to.includes(S.me));
  if (mine.length) toast(mine[0].text + (mine.length > 1 ? ` И ещё напоминаний: ${mine.length - 1}.` : ''));
}

// Ядро: сделки. Завести, править, двигать по воронке, закрыть («Успешно» или «Провалена» с причиной), строки
// товаров с ценой и скидкой, резерв строки со склада, колонки канбана. Сумму считает одна функция — total.
// Права — Perms, видимость сделок — Leads.dealsVisible, остатки и резервы — Stock, события — Feed, клиенты — Clients.
// Чистые функции над состоянием st; время приходит параметром now (Date), кто делает — by (id сотрудника).
// Каждое изменение пишет запись в ленту сделки. Экраны — 56-deals.js (канбан, карточка, КП).
// Стадии «Успешно»: сделка на этапе с флагом final, wonAt. «Провалена»: lostReason и lostAt, этап остаётся тем, где сорвалась.

const Deals = (() => {
  // Причины отказа по умолчанию; общие для лидов и сделок, правятся в «Настройки → Лиды и сделки» (st.lostReasons).
  const defaultReasons = () => ['Дорого', 'Выбрали другого', 'Не дозвонились', 'Передумали', 'Другое']
    .map((name, i) => ({ id: 'lr' + (i + 1), name }));

  const str = v => String(v == null ? '' : v).trim();
  const toNum = v => (v === null || v === undefined || str(v) === '' ? NaN : Number(str(v).replace(/\s/g, '').replace(',', '.')));
  const round2 = x => Math.round(x * 100) / 100;
  const personOf = (st, id) => (st.people || []).find(p => p.id === id) || null;
  const byId = (st, id) => (st.deals || []).find(d => d.id === id) || null;
  const productOf = (st, id) => (st.products || []).find(p => p.id === id) || null;
  const fail = (reason, extra) => Object.assign({ ok: false, reason }, extra);

  const reasons = st => (st.lostReasons || defaultReasons()).map(r => r.name);

  // ——— сумма: единственный расчёт ———
  // Строка: количество × цена × (1 − скидка/100), до копейки. Цены нет (price: null) — строка в сумму не входит:
  // это «нет данных: цена», не ноль; сколько таких строк — noPrice.
  const hasPrice = it => typeof it.price === 'number' && isFinite(it.price);
  const lineSum = it => (hasPrice(it) ? round2(it.qty * it.price * (100 - (it.disc || 0)) / 100) : 0);
  // Сумма сделки: есть строки — сумма строк; нет — вписанная amount.
  function total(deal) {
    const items = (deal && deal.items) || [];
    if (items.length) return round2(items.reduce((s, it) => s + lineSum(it), 0));
    const a = Number(deal && deal.amount);
    return isFinite(a) && a > 0 ? a : 0;
  }
  // Сумма по списку сделок — единственная: колонка доски, шапка «Сделок» и плитка главного экрана зовут её.
  const sumOf = deals => round2((deals || []).reduce((s, d) => s + total(d), 0));
  const noPrice = deal => ((deal && deal.items) || []).map((it, i) => (hasPrice(it) ? -1 : i)).filter(i => i >= 0);

  // ——— состояние ———
  const lostOf = d => !!(d && d.lostReason);
  // 'lost' — провалена; 'won' — на этапе «Успешно» (флаг final); иначе 'open'.
  const state = (st, d) => (lostOf(d) ? 'lost' : Pipes.isFinal(st, d.pipeId, d.stageId) ? 'won' : 'open');

  // ——— права ———
  // Видеть сделки — право clients (и Leads.dealsVisible); заводить, править, двигать по этапам, закрывать, резервировать — dealsEdit.
  // У инженеров по умолчанию только просмотр (R30).
  const canMake = (st, by) => !!personOf(st, by) && Perms.can(st, by, 'dealsEdit');
  const canEdit = (st, d, by) => !!d && canMake(st, by) && Leads.dealsVisible(st, by).includes(d);
  // Сделка, с которой человек может работать, или отказ.
  function open(st, id, by) {
    const d = byId(st, id);
    if (!d) return { err: fail('Такой сделки нет.') };
    if (!canEdit(st, d, by)) return { err: fail('У вас нет права править эту сделку.') };
    return { d };
  }

  const log = (st, d, kind, text, by, at, data) => Feed.add(st, { t: 'deal', id: d.id }, { kind, text, by, at, data });
  const stageName = (st, d, id) => (Pipes.stage(st, d.pipeId, id) || {}).name || 'нет данных: этап';

  // ——— строки товаров ———
  const itemName = (st, it) => (it.productId ? (productOf(st, it.productId) || {}).name || 'нет данных: товар' : it.text);
  const priceText = it => (hasPrice(it) ? rub(it.price) : 'нет данных: цена');

  // Строка из введённого: товар из каталога (productId) или своя (text), количество, цена (по умолчанию цена сайта, а нет её —
  // null), скидка %. → {item} или {reason}.
  function cleanItem(st, raw) {
    const r = raw || {}, it = {};
    let prod = null;
    if (r.productId) {
      prod = productOf(st, r.productId);
      if (!prod) return { reason: 'Такого товара нет в каталоге.' };
      it.productId = prod.id;
    } else {
      if (!str(r.text)) return { reason: 'Выберите товар из каталога или напишите название своей строки.' };
      it.text = str(r.text);
    }
    const qty = r.qty === undefined ? 1 : toNum(r.qty);
    if (!(qty > 0) || !isFinite(qty)) return { reason: 'Количество — число больше нуля.' };
    it.qty = qty;
    if ('price' in r && r.price !== undefined) {
      const p = toNum(r.price);
      if (r.price !== null && str(r.price) !== '' && !(p >= 0 && isFinite(p))) return { reason: 'Цена — число не меньше нуля.' };
      it.price = isNaN(p) ? null : p;
    } else it.price = prod && typeof prod.price === 'number' ? prod.price : null;
    const disc = r.disc === undefined || str(r.disc) === '' ? 0 : toNum(r.disc);
    if (!(disc >= 0 && disc <= 100)) return { reason: 'Скидка — число от 0 до 100 %.' };
    it.disc = disc;
    return { item: it };
  }

  const itemLine = (st, it) => `${itemName(st, it)} — ${num(it.qty)} × ${priceText(it)}${it.disc ? ', скидка ' + num(it.disc) + ' %' : ''}`;

  // Сколько по сделке зарезервировано этого товара (все резервы сделки по нему).
  const reserved = (st, d, productId) => (st.reserves || []).filter(r => r.dealId === d.id && r.productId === productId).reduce((s, r) => s + r.qty, 0);
  // Сколько этого товара в строках сделки — сумма количеств всех строк с ним. Резерв по товару не бывает больше этой суммы:
  // резерв считается по товару, а не по строке, поэтому «можно ещё» = lined − reserved.
  const lined = (d, productId) => round2((d.items || []).filter(x => x.productId === productId).reduce((s, x) => s + x.qty, 0));
  // Проверка перед правкой или удалением строки: after — сколько товара останется в строках сделки. Резерв по нему больше —
  // текст отказа (what: 'remove' — удаление, иначе правка количества), иначе null. Один текст на правку и на удаление.
  const reserveBlock = (st, d, productId, after, what) => {
    const held = reserved(st, d, productId);
    if (!(held > after)) return null;
    const p = productOf(st, productId), name = (p || {}).name || 'нет данных: товар', rows = (d.items || []).filter(x => x.productId === productId).length;
    return what === 'remove'
      ? `По товару «${name}» в резерве ${qtyOf(held, p)}, а после удаления в строках останется ${qtyOf(after, p)} — сначала снимите резерв.`
      : `По товару «${name}» в резерве ${qtyOf(held, p)} — сначала снимите резерв или оставьте не меньше ${num(held)}${rows > 1 ? ' в сумме по строкам этого товара' : ''}.`;
  };

  // ——— заведение ———
  const MISSING = { client: 'клиент', type: 'тип сделки' };

  // Новая сделка: {clientId, type, managerId?, contact?, phone?, email?, kind?, object?, channel?, items?, amount?, leadId?, demo?}.
  // Без клиента (существующего) или типа — {ok:false, missing:[…]}. Воронка — своего типа, этап — первый.
  // Менеджер: названный; иначе я, если я менеджер (у роли есть тип); иначе менеджер клиента.
  // → {ok, id, missing, reason}
  function create(st, data, by, now) {
    const d0 = data || {};
    if (!canMake(st, by)) return fail('У вашей роли нет права заводить сделки.', { id: null, missing: [] });
    const client = Clients.byId(st, d0.clientId), type = Leads.TYPE[d0.type] ? d0.type : null;
    const missing = [];
    if (!client) missing.push('client');
    if (!type) missing.push('type');
    if (missing.length) return fail(`Не заполнено: ${missing.map(k => MISSING[k]).join(', ')}.`, { id: null, missing });
    const pipe = dealPipe(type, st);
    if (!pipe) return fail('Нет воронки сделок этого типа.', { id: null, missing: [] });
    const items = [];
    for (const raw of d0.items || []) {
      const c = cleanItem(st, raw);
      if (c.reason) return fail(c.reason, { id: null, missing: [] });
      items.push(c.item);
    }
    const role = Perms.roleOf(st, by);
    const managerId = d0.managerId && personOf(st, d0.managerId) ? d0.managerId : (role && role.scope ? by : client.managerId || null);
    const amount = toNum(d0.amount);
    st.deals = st.deals || [];
    const d = {
      id: Leads.nextId(st.deals, 'Д', 300), clientId: client.id, client: client.name,
      contact: str(d0.contact) || (client.kind === 'person' ? client.name : 'нет данных: контакт'),
      kind: str(d0.kind) || (type === 'b2b' ? 'Компания' : 'Частный клиент'),
      object: str(d0.object) || 'нет данных: что продаём',
      type, pipeId: pipe.id, stageId: Leads.firstOf(pipe).id, managerId,
      channel: Object.hasOwn(CH, d0.channel) ? d0.channel : 'phone',
      amount: amount >= 0 && isFinite(amount) ? amount : 0,
      phone: str(d0.phone) || (client.phones || [])[0] || '', email: str(d0.email) || client.email || '',
      items, at: now, demo: !!d0.demo,
    };
    if (d0.leadId) d.leadId = d0.leadId;
    st.deals.push(d);
    log(st, d, 'create', d0.leadId ? `Сделка создана из лида ${d0.leadId}` : 'Сделка создана', by, now);
    return { ok: true, id: d.id, missing: [], reason: '' };
  }

  // ——— правка полей ———
  const LABEL = { clientId: 'Клиент', contact: 'Контакт', phone: 'Телефон', email: 'Почта', kind: 'Вид клиента', object: 'Что продаём',
    type: 'Тип', managerId: 'Менеджер', channel: 'Связь', amount: 'Сумма' };

  // Правка сделки: patch — любые из clientId, contact, phone, email, kind, object, type, managerId, channel, amount.
  // Сумму руками вписать нельзя, если в сделке есть строки товаров: она считается по строкам. Смена типа переводит сделку
  // в воронку нового типа (тот же этап, если он там есть). Всё проверяется до правки: либо всё, либо ничего.
  // → {ok, changed:[поле…], reason}
  function update(st, id, patch, by, now) {
    const { d, err } = open(st, id, by);
    if (err) return Object.assign(err, { changed: [] });
    const p = patch || {}, next = {};
    for (const f of Object.keys(LABEL)) {
      if (!(f in p)) continue;
      let v = p[f];
      if (f === 'clientId') {
        if (!Clients.byId(st, v)) return fail('Такого клиента нет.', { changed: [] });
      } else if (f === 'type') {
        if (!Leads.TYPE[v]) return fail('Тип сделки — B2B или B2C.', { changed: [] });
      } else if (f === 'managerId') {
        v = v || null;
        if (v && !personOf(st, v)) return fail('Такого сотрудника нет.', { changed: [] });
      } else if (f === 'channel') {
        if (!Object.hasOwn(CH, v)) return fail('Такого способа связи нет.', { changed: [] });
      } else if (f === 'amount') {
        if ((d.items || []).length) return fail('В сделке есть строки товаров — сумма считается по ним, вписать её руками нельзя.', { changed: [] });
        v = toNum(v);
        if (!(v >= 0) || !isFinite(v)) return fail('Сумма — число не меньше нуля.', { changed: [] });
      } else v = str(v);
      if (v !== (d[f] == null ? (f === 'managerId' ? null : '') : d[f])) next[f] = v;
    }
    const changed = Object.keys(next);
    if (!changed.length) return { ok: true, changed, reason: '' };
    const shown = (f, v) => {
      if (f === 'managerId') return (personOf(st, v) || {}).name || 'нет данных';
      if (f === 'channel') return CH[v] || 'нет данных';
      if (f === 'type') return Leads.TYPE[v] || 'нет данных';
      if (f === 'clientId') return (Clients.byId(st, v) || {}).name || 'нет данных';
      if (f === 'amount') return v ? rub(v) : 'не рассчитана';
      return str(v) || 'нет данных';
    };
    const lines = changed.map(f => `${LABEL[f]}: ${shown(f, d[f])} → ${shown(f, next[f])}`);
    const data = changed.map(f => ({ field: f, from: d[f] == null ? null : d[f], to: next[f] }));
    for (const f of changed) d[f] = next[f];
    if (next.clientId) d.client = Clients.byId(st, d.clientId).name;
    if (next.type) {
      const pipe = dealPipe(d.type, st);
      if (pipe) { d.pipeId = pipe.id; if (!Pipes.stage(st, pipe.id, d.stageId)) d.stageId = Leads.firstOf(pipe).id; }
    }
    log(st, d, 'field', lines.join('; '), by, now, { changes: data });
    return { ok: true, changed, reason: '' };
  }

  // ——— этапы ———
  // Двигает по воронке: на любой этап, кроме той же точки; на этап с флагом final — это «Успешно» (win).
  // Проваленную сделку не двигают, пока не вернут в работу (reopen). → {ok, reason}
  function move(st, id, stageId, by, now) {
    const { d, err } = open(st, id, by);
    if (err) return err;
    if (lostOf(d)) return fail('Сделка провалена — сначала верните её в работу.');
    const to = Pipes.stage(st, d.pipeId, stageId);
    if (!to) return fail('Такого этапа нет в воронке сделки.');
    if (to.id === d.stageId) return fail('Сделка уже на этом этапе.');
    if (to.flag === 'final') return win(st, id, by, now);
    const from = Pipes.stage(st, d.pipeId, d.stageId);
    d.stageId = to.id;
    delete d.wonAt;
    log(st, d, 'stage', `Этап: «${from ? from.name : 'нет данных: этап'}» → «${to.name}»`, by, now, { from: from ? from.id : null, to: to.id });
    return { ok: true, reason: '' };
  }

  // «Успешно»: сделка переходит на этап с флагом final, запоминается wonAt. Проваленная и уже успешная — отказ.
  function win(st, id, by, now) {
    const { d, err } = open(st, id, by);
    if (err) return err;
    if (lostOf(d)) return fail('Сделка провалена — сначала верните её в работу.');
    const pipe = (st.pipelines || []).find(p => p.id === d.pipeId), fin = pipe && pipe.stages.find(s => s.flag === 'final');
    if (!fin) return fail('В воронке нет этапа «Успешно».');
    if (d.stageId === fin.id) return fail('Сделка уже успешно закрыта.');
    const from = stageName(st, d, d.stageId);
    d.stageId = fin.id;
    d.wonAt = now;
    log(st, d, 'win', `Успешно: сделка закрыта («${from}» → «${fin.name}»)`, by, now);
    return { ok: true, reason: '' };
  }

  // «Провалена» с причиной: без причины — отказ. Этап остаётся, где сделка сорвалась. Успешно закрытую не проваливают.
  function lose(st, id, reason, by, now) {
    const why = str(reason);
    if (!why) return fail('Укажите причину отказа.');
    const { d, err } = open(st, id, by);
    if (err) return err;
    if (lostOf(d)) return fail('Сделка уже провалена.');
    if (state(st, d) === 'won') return fail('Сделка успешно закрыта — провалить её нельзя, сначала верните на другой этап.');
    d.lostReason = why;
    d.lostAt = now;
    log(st, d, 'lose', `Провалена: ${why}`, by, now, { reason: why });
    return { ok: true, reason: '' };
  }

  // Вернуть проваленную сделку в работу (ошибка при отказе): причина снимается, этап прежний.
  function reopen(st, id, by, now) {
    const { d, err } = open(st, id, by);
    if (err) return err;
    if (!lostOf(d)) return fail('Сделка не провалена.');
    const was = d.lostReason;
    delete d.lostReason;
    delete d.lostAt;
    log(st, d, 'stage', `Возвращена в работу (была провалена: ${was})`, by, now);
    return { ok: true, reason: '' };
  }

  // ——— строки товаров ———
  // Добавить строку: {productId | text, qty?, price?, disc?}. → {ok, idx, reason}
  function addItem(st, id, raw, by, now) {
    const { d, err } = open(st, id, by);
    if (err) return err;
    const c = cleanItem(st, raw);
    if (c.reason) return fail(c.reason);
    d.items = d.items || [];
    d.items.push(c.item);
    log(st, d, 'item', `Добавлена строка: ${itemLine(st, c.item)}`, by, now, { idx: d.items.length - 1 });
    return { ok: true, idx: d.items.length - 1, reason: '' };
  }

  const ITEM_LABEL = { text: 'Название', qty: 'Количество', price: 'Цена', disc: 'Скидка' };
  // Правка строки idx: patch — qty, price (null или пусто — «нет данных: цена»), disc, а у своей строки ещё text.
  function setItem(st, id, idx, patch, by, now) {
    const { d, err } = open(st, id, by);
    if (err) return err;
    const it = (d.items || [])[idx];
    if (!it) return fail('Такой строки нет.');
    const p = patch || {}, raw = { qty: it.qty, price: it.price, disc: it.disc };
    if (it.productId) raw.productId = it.productId; else raw.text = 'text' in p ? p.text : it.text;
    for (const f of ['qty', 'price', 'disc']) if (f in p) raw[f] = p[f];
    const c = cleanItem(st, raw);
    if (c.reason) return fail(c.reason);
    // Количество уменьшают: резерв по товару не должен оказаться больше суммы строк (правка цены и скидки резерва не касается).
    if (it.productId && c.item.qty < it.qty) {
      const why = reserveBlock(st, d, it.productId, round2(lined(d, it.productId) - it.qty + c.item.qty), 'set');
      if (why) return fail(why);
    }
    const lines = [];
    for (const f of ['text', 'qty', 'price', 'disc']) {
      if (it.productId && f === 'text') continue;
      if (c.item[f] !== it[f]) lines.push(`${ITEM_LABEL[f]}: ${f === 'price' ? priceText(it) : it[f]} → ${f === 'price' ? priceText(c.item) : c.item[f]}`);
    }
    if (!lines.length) return { ok: true, reason: '' };
    const name = itemName(st, it);
    Object.assign(it, c.item);
    log(st, d, 'item', `Строка «${name}»: ${lines.join('; ')}`, by, now, { idx });
    return { ok: true, reason: '' };
  }

  // Убрать строку. Если в оставшихся строках товара станет меньше, чем в резерве сделки, убрать нельзя: сначала снять резерв.
  // → {ok, reason}
  function removeItem(st, id, idx, by, now) {
    const { d, err } = open(st, id, by);
    if (err) return err;
    const it = (d.items || [])[idx];
    if (!it) return fail('Такой строки нет.');
    if (it.productId) {
      const why = reserveBlock(st, d, it.productId, round2(lined(d, it.productId) - it.qty), 'remove');
      if (why) return fail(why);
    }
    d.items.splice(idx, 1);
    log(st, d, 'item', `Убрана строка: ${itemLine(st, it)}`, by, now);
    return { ok: true, reason: '' };
  }

  // ——— резервы сделки ———
  // Уведомление о резерве: постоянные адресаты вида reserve (Notify.RECIPIENTS — склад и директор) и менеджер этой сделки.
  // Менеджеры другого типа его не получают: чужую сделку они не видят.
  const managerOf = d => (d && d.managerId ? [d.managerId] : []);
  // Сколько товара сделки ещё можно зарезервировать: «в строках − уже в резерве». Единственный расчёт: ядро и экран зовут его.
  const left = (st, d, productId) => round2(lined(d, productId) - reserved(st, d, productId));

  // Один путь резерва под сделку — из строки сделки (reserveItem) и из карточки товара.
  // o: {productId, qty?, src? ('stock' | id поставки), entityId?, cityId?, until?}. Нужно право править сделку (canEdit) и право
  // reserve; товар должен быть в строках сделки; не больше «в строках − уже в резерве» (left) и не больше свободного
  // (Stock.canReserve, его причина — наша). Количество по умолчанию — вся нерезервированная часть. Юрлицо и город не названы —
  // клетка, где свободного больше всего. Срок по умолчанию — 14 дней от now. Запись в ленту сделки, уведомление — складу,
  // директору и менеджеру сделки. → {ok, reserve, reason, max}
  function reserve(st, id, opt, by, now) {
    const { d, err } = open(st, id, by);
    if (err) return err;
    if (!Perms.can(st, by, 'reserve')) return fail('У вашей роли нет права ставить резервы.');
    const o = opt || {}, pid = o.productId, p = productOf(st, pid);
    if (!p) return fail('Такого товара нет в каталоге.');
    const rows = (d.items || []).filter(x => x.productId === pid).length;
    if (!rows) return fail(`В сделке ${d.id} нет строки с товаром «${p.name}»: сначала добавьте его в сделку, потом ставьте резерв.`, { max: 0 });
    // Предел — по товару, а не по строке: две строки одного товара (10 и 5) дают 15, а не 10.
    const all = lined(d, pid), held = reserved(st, d, pid), rest = left(st, d, pid);
    if (!(rest > 0)) return fail(`Строка «${p.name}» уже зарезервирована целиком (${num(held)}).`, { max: 0 });
    const qty = o.qty === undefined || str(o.qty) === '' ? rest : toNum(o.qty);
    if (qty > rest) return fail(`${rows > 1 ? `В ${rows} строках этого товара ${num(all)}` : `В строке ${num(all)}`}, уже зарезервировано ${num(held)}: можно ещё ${num(rest)}.`, { max: rest });
    const src = o.src || 'stock';
    const cell = src !== 'stock' || (o.entityId === undefined && o.cityId === undefined) ? Stock.bestCell(st, pid) : { entityId: o.entityId, cityId: o.cityId };
    const until = o.until || new Date(new Date(now).getTime() + 14 * 864e5);
    const ask = { productId: pid, qty, entityId: cell.entityId, cityId: cell.cityId, src };
    const chk = Stock.canReserve(st, ask);
    if (!chk.ok) return fail(chk.reason, { max: chk.max });
    const res = Stock.reserve(st, Object.assign(ask, { dealId: d.id, until, by, at: now }));
    if (!res.ok) return fail(res.reason, { max: res.max });
    res.reserve.at = now;
    res.reserve.by = by;
    log(st, d, 'reserve', Feed.reserveText(st, res.reserve), by, now, { reserveId: res.reserve.id, productId: pid, qty });
    Notify.push(st, 'reserve', by, Feed.reserveText(st, res.reserve, true), now, managerOf(d));
    return { ok: true, reserve: res.reserve, reason: '', max: res.max };
  }

  // Зарезервировать строку idx со склада под эту сделку: {entityId, cityId, qty?, until?} — тот же reserve по товару строки.
  function reserveItem(st, id, idx, opt, by, now) {
    const { d, err } = open(st, id, by);
    if (err) return err;
    if (!Perms.can(st, by, 'reserve')) return fail('У вашей роли нет права ставить резервы.');
    const it = (d.items || [])[idx];
    if (!it) return fail('Такой строки нет.');
    if (!it.productId) return fail('Своя строка: такого товара нет в каталоге, резервировать нечего.');
    return reserve(st, id, Object.assign({}, opt, { productId: it.productId, src: 'stock' }), by, now);
  }

  // Лента сделки помнит резерв. Пока у резерва нет своей записи в ленте, её подмешивает сам резерв (Feed.of) — и снятый
  // резерв пропал бы из ленты бесследно. keepTrail пишет эту запись — с прежним временем и автором — до того, как резерв
  // уменьшат или снимут. Зовут все, кто снимает или списывает резерв: сделка, приёмка, карточка товара, отправка.
  function keepTrail(st, r) {
    const d = r && byId(st, r.dealId);
    if (!d || (st.feed || []).some(e => e.ref.t === 'deal' && e.ref.id === d.id && e.data && e.data.reserveId === r.id)) return;
    const w = Feed.reserveWhen(st, r);
    log(st, d, 'reserve', Feed.reserveText(st, r), w.by, w.at, { reserveId: r.id, productId: r.productId, qty: r.qty });
  }
  // Из резерва r снято q (целиком или частью): запись «Снят резерв» в ленте сделки с причиной why и уведомление складу,
  // директору и менеджеру сделки. Зовётся до того, как резерв изменён. Один текст на снятие из сделки, из карточки товара
  // и при приёмке.
  function noteRelease(st, r, q, why, by, now) {
    const d = r && byId(st, r.dealId);
    if (!d) return;
    keepTrail(st, r);
    const name = low((productOf(st, r.productId) || {}).name || 'нет данных: товар'), tail = why ? ' ' + why : '';
    log(st, d, 'reserve', `Снят резерв: ${name} — ${num(q)}${why ? '.' + tail : ''}`, by, now, { reserveId: r.id, productId: r.productId, qty: q, removed: true });
    Notify.push(st, 'reserve', by, `Снят резерв: ${name} — ${num(q)} (${d.id}, ${d.client}).${tail}`, now, managerOf(d));
  }

  // Снять резерв сделки: товар возвращается в свободный остаток. Нужно право править сделку и право reserve. → {ok, reason}
  function unreserve(st, id, reserveId, by, now) {
    const { d, err } = open(st, id, by);
    if (err) return err;
    if (!Perms.can(st, by, 'reserve')) return fail('У вашей роли нет права снимать резервы.');
    const r = (st.reserves || []).find(x => x.id === reserveId && x.dealId === d.id);
    if (!r) return fail('Такого резерва в сделке нет.');
    noteRelease(st, r, r.qty, '', by, now);
    const res = Stock.unreserve(st, reserveId, by, now);
    if (!res.ok) return fail(res.reason);
    return { ok: true, reason: '' };
  }

  // ——— выборка и колонки канбана ———
  // Сделки, которые человек видит (Leads.dealsVisible), по условиям filter: pipeId, type, q (поиск по клиенту, контакту, номеру,
  // телефону, почте, объекту), mine (мои), managerId, lost (true — вместе с проваленными, 'only' — только они),
  // acts ('none' — без открытых дел, 'overdue' — дела просрочены на момент now).
  // Нет personId — все сделки. Один отбор на канбан и таблицу.
  function query(st, filter, personId) {
    const f = filter || {}, words = Catalog.norm(f.q).split(' ').filter(Boolean);
    return (personId ? Leads.dealsVisible(st, personId) : (st.deals || [])).filter(d =>
      (!f.pipeId || d.pipeId === f.pipeId) && (!f.type || d.type === f.type)
      && (!f.mine || d.managerId === personId) && (!f.managerId || d.managerId === f.managerId)
      && (f.lost === 'only' ? lostOf(d) : f.lost ? true : !lostOf(d))
      && (!f.acts || Acts.matches(st, { t: 'deal', id: d.id }, f.acts, f.now))
      && (!words.length || words.every(w => Catalog.norm([d.id, d.client, d.contact, d.phone, d.email, d.object].join(' ')).includes(w))));
  }

  // Колонки канбана воронки pipeId: [{stage, count, sum, deals}] по порядку этапов. sum — сумма total сделок колонки.
  // Только видимые человеку сделки; проваленные в колонки не входят (filter.lost — включить).
  function columns(st, pipeId, filter, personId) {
    const pipe = (st.pipelines || []).find(p => p.id === pipeId);
    if (!pipe) return [];
    const deals = query(st, Object.assign({}, filter, { pipeId }), personId);
    return pipe.stages.map(stage => {
      const ds = deals.filter(d => d.stageId === stage.id);
      return { stage, count: ds.length, sum: sumOf(ds), deals: ds };
    });
  }

  return {
    defaultReasons, reasons, lineSum, total, sumOf, noPrice, state, canEdit, itemName, reserved, lined, left, byId,
    create, update, move, win, lose, reopen, addItem, setItem, removeItem, reserve, reserveItem, keepTrail, noteRelease, unreserve, query, columns,
  };
})();

// Шаг SEEDS: демо-сделки. Список причин отказа; прежние сделки v2 получают историю (воронка проходится теми же move, что и в работе),
// строки товаров по своим резервам и отметку времени у резервов; к ним добавлено ещё 23 сделки — всего 32 обоих типов на всех
// этапах воронки, четыре из них провалены с причиной. Строки — из настоящего каталога (товар, цена сайта на снимок 31.10.2026);
// где цены сайта у товара нет, в строке «нет данных: цена». Новых резервов шаг не ставит: остатки и свободное прежние.
// Всё помечено «пример» (demo:true и слово в названиях клиентов), телефоны вида +7 900 000-00-NN.
SEEDS.push(st => {
  st.lostReasons = Deals.defaultReasons();
  // РОП (роль заводит шаг лидов, 35-leads.js) заводит и правит сделки, как менеджеры
  const rop = st.roles.find(r => r.id === 'rop');
  if (rop) rop.perms.dealsEdit = true;
  const DAY = 864e5, STAGES = ['request', 'calc', 'offer', 'contract', 'payment', 'delivery', 'install', 'done'];
  const pad = (n, w) => String(n).padStart(w, '0');
  const mgrs = type => Leads.managers(st, type).map(p => p.id);
  const rot = { b2b: 0, b2c: 0 };
  const nextMgr = type => { const m = mgrs(type); return m[rot[type]++ % m.length]; };
  const priced = p => p.inCatalog && typeof p.price === 'number';
  // позиция каталога: по куску названия, а если такой нет — первая с ценой сайта в категории
  const pick = (like, cat) => st.products.find(p => priced(p) && p.name.includes(like)) || st.products.find(p => priced(p) && p.cat === cat);

  // Пройти сделку по воронке до этапа stage теми же move/win: шаг по времени равномерный, последнее событие — до сегодняшней полуночи.
  const walk = (d, stage, ago) => {
    const path = STAGES.slice(1, STAGES.indexOf(stage) + 1);
    const start = day(-ago, 9, 0), step = Math.min(2 * DAY, Math.floor((ago * DAY - 9 * 36e5) / (path.length + 1)));
    d.stageId = STAGES[0];
    path.forEach((s, i) => Deals.move(st, d.id, s, d.managerId, new Date(start.getTime() + (i + 1) * step)));
    return { start, step, end: new Date(start.getTime() + path.length * step) };
  };
  const COMMENTS = ['Пример: клиент просит рассрочку, уточняем условия.', 'Пример: ждём замер кровли, согласовали выезд.', 'Пример: отправили расчёт на почту, клиент думает.',
    'Пример: клиент сравнивает с другим предложением.', 'Пример: договорились созвониться после выходных.', 'Пример: клиент уточнил сроки поставки.'];
  const say = (d, k, at) => Feed.comment(st, { t: 'deal', id: d.id }, COMMENTS[k % COMMENTS.length], d.managerId, at);

  // 1. Прежние сделки v2: история, строки по резервам, отметки резервов
  const OLD = { 'Д-311': 10, 'Д-314': 16, 'Д-318': 9, 'Д-320': 6, 'Д-305': 25, 'Д-322': 2 };
  st.deals.filter(d => OLD[d.id]).forEach((d, k) => {

    mine.forEach((r, i) => {

      r.at = w.at || new Date(start.getTime() + DAY + (i + 1) * 72e5);
      r.by = w.by || d.managerId;
    });
  });

  // 2. Новые сделки: [тип, этап, дней назад, причина отказа, связь, что продаём, строки, ключ клиента]

  const L = (spec, qty, disc = 0) => (spec.length === 1 ? { text: spec[0], qty } : { spec, qty, disc });
  const ROWS = [

    ['b2b', 'contract', 14, null, 'telegram', 'Станция с накопителем для фермы', [L(PAN, 40, 5), L(INV12, 1), L(BAT, 4), L(CAB, 200), L(MC4, 40)], 'b'],
    ['b2b', 'delivery', 22, null, 'max', 'Резервное питание для котельной', [L(PAN, 24), L(INV10, 1), L(BAT2, 3), L(MNT, 6)], 'c'],
    ['b2b', 'install', 30, null, 'phone', 'Станция на кровлю производственной базы', [L(PAN, 60, 7), L(INV12, 2), L(CAB, 300), L(WORK, 1)], 'd'],
    ['b2b', 'done', 40, null, 'telegram', 'Станция для автомойки', [L(PAN, 18), L(INV10, 1), L(BAT, 2)], 'e'],
    ['b2b', 'done', 34, null, 'phone', 'Освещение и насос на удалённом участке', [L(PAN150, 12), L(INV1, 1)], 'f'],
    ['b2b', 'contract', 12, null, 'telegram', 'Расширение станции: ещё накопители', [L(BAT, 6, 3), L(CAB, 100)], 'b'],
    ['b2b', 'offer', 8, null, 'max', 'Станция для гостевого дома', [L(PAN, 16), L(INV10, 1), L(BAT2, 2)], 'g'],
    ['b2b', 'payment', 18, null, 'phone', 'Станция для лесного участка', [L(PAN, 30, 4), L(INV12, 1), L(MC4, 30)], 'h'],
    ['b2b', 'request', 2, null, 'phone', 'Нужен расчёт по резервному питанию склада', [], 'i'],
    ['b2b', 'offer', 20, 'Дорого', 'telegram', 'Станция для мастерской', [L(PAN, 22), L(INV10, 1)], 'j'],
    ['b2b', 'contract', 26, 'Выбрали другого', 'max', 'Станция для овощехранилища', [L(PAN, 28, 5), L(INV12, 1), L(BAT, 3)], 'k'],
    ['b2c', 'offer', 7, null, 'telegram', 'Станция для дома, 8 кВт', [L(PAN, 14), L(INV10, 1), L(BAT2, 2)], 'l'],
    ['b2c', 'contract', 11, null, 'max', 'Автономная станция для дачи', [L(PAN150, 10), L(INV1, 1), L(BAT2, 1), L(CAB, 60)], 'm'],
    ['b2c', 'payment', 15, null, 'phone', 'Станция для загородного дома с накопителем', [L(PAN, 12), L(INV12, 1), L(BAT, 3), L(WORK, 1)], 'n'],
    ['b2c', 'done', 33, null, 'telegram', 'Станция на крышу гаража', [L(PAN, 8, 3), L(INV1, 1), L(MC4, 16)], 'o'],
    ['b2c', 'done', 28, null, 'max', 'Резервное питание на случай отключений', [L(INV1, 1), L(BAT2, 1)], 'p'],
    ['b2c', 'request', 1, null, 'phone', 'Хочу узнать, что нужно для станции', [], 'q'],
    ['b2c', 'calc', 3, null, 'telegram', 'Станция для бани и участка', [L(PAN150, 6)], 'r'],
    ['b2c', 'payment', 9, null, 'max', 'Станция для дачи с накопителем', [L(PAN, 10), L(INV10, 1), L(BAT, 2)], 's'],
    ['b2c', 'install', 19, null, 'telegram', 'Станция для дома на склоне', [L(PAN, 16, 5), L(INV12, 1), L(BAT2, 3), L(CAB, 120), L(MNT, 4)], 't'],
    ['b2c', 'calc', 10, 'Не дозвонились', 'phone', 'Станция для дачи, расчёт', [L(PAN150, 8)], 'u'],
    ['b2c', 'offer', 16, 'Передумали', 'max', 'Станция для коттеджа', [L(PAN, 18), L(INV10, 1), L(BAT, 2)], 'v'],
  ];
  const clients = {};
  let phoneNo = 40, innNo = 110, n = 25;
  const COMPANY = ['ООО „Пример-Лес“', 'ИП Пример-Ферма', 'КФХ „Пример-Поле“', 'ООО „Пример-Тепло“', 'АО „Пример-Свет“', 'ООО „Пример-Мост“',
    'ООО „Пример-Горы“', 'ИП Пример-Гараж', 'ООО „Пример-Река“', 'ООО „Пример-Север“', 'ООО „Пример-Юг“', 'ООО „Пример-Склон“'];
  ROWS.forEach(([type, stage, ago, lostWhy, channel, object, lines, key], k) => {
    const mgr = nextMgr(type), start = day(-ago, 9, 0);
    if (!clients[key]) {

      const data = { name: company ? COMPANY[(i - 25) % COMPANY.length] : `Клиент-пример ${i}`, kind: company ? 'company' : 'person',

      if (company) data.inn = `0000000${pad(innNo++, 3)}`;
      if (k % 3 === 0) data.email = `primer${no}@example.com`;
      clients[key] = Clients.create(st, data, null, start).client;
    }
    const made = Deals.create(st, { clientId: clients[key].id, type, managerId: mgr, channel, object, demo: true,
      contact: type === 'b2b' ? `Контакт-пример ${k + 1}` : undefined }, mgr, start);
    const d = Deals.byId(st, made.id);
    for (const ln of lines) {
      const raw = ln.spec ? { productId: pick(...ln.spec).id, qty: ln.qty, disc: ln.disc } : { text: ln.text, qty: ln.qty, price: null };
      Deals.addItem(st, d.id, raw, mgr, new Date(start.getTime() + 36e5));
    }
    const t = walk(d, stage, ago);
    if (k % 2 === 0) say(d, k, new Date(start.getTime() + Math.floor(1.5 * t.step)));
    if (lostWhy) Deals.lose(st, d.id, lostWhy, mgr, new Date(t.end.getTime() + 36e5));
  });
});

// Ядро: дела — следующий шаг по лиду, сделке и клиенту. Звонок, встреча, письмо или просто дело со сроком, ответственным
// и напоминанием; выполняют его с результатом. Лента (Feed.of) подмешивает выполненные дела сама, открытые дела показывает
// feedHtml над лентой, метки «нет следующего шага» и счётчики меню берутся отсюда же.
// Чистые функции над состоянием st; время приходит параметром now (Date), кто делает — by (id сотрудника).
// Дело: {id, ref:{t,id}, type, title, due, ownerId, by, at, remind (минут до срока или null), remindedAt?, doneAt?, doneBy?, result?}.
// Дело считается «живым», пока жива его карточка: лид не закрыт, сделка не провалена и не закрыта успешно, заявка на отправку не в финальном этапе. Дела закрытых
// карточек не попадают ни в счётчики, ни в «нет следующего шага», ни в напоминания: гасить их по одному никто не обязан.

const Acts = (() => {
  const TYPES = { call: 'Звонок', meet: 'Встреча', mail: 'Письмо', todo: 'Дело' };
  // За сколько минут до срока напомнить: [минуты, подпись]; null — не напоминать.
  const REMINDS = [[null, 'Не напоминать'], [0, 'В срок'], [15, 'За 15 минут'], [60, 'За час'], [1440, 'За день']];
  // Быстрые сроки в форме
  const QUICK = { today: 'Сегодня', tomorrow: 'Завтра', week: 'Через неделю' };
  // Карточки, к которым ставят дела
  const REFS = ['deal', 'lead', 'client', 'dispatch'];
  const MISSING = { type: 'вид дела', due: 'срок' };

  const str = v => String(v == null ? '' : v).trim();
  const time = v => { const n = v == null || v === '' ? NaN : new Date(v).getTime(); return isNaN(n) ? null : n; };
  const same = (a, b) => !!a && !!b && a.t === b.t && a.id === b.id;
  const fail = (reason, extra) => Object.assign({ ok: false, reason }, extra);
  const personOf = (st, id) => (st.people || []).find(p => p.id === id) || null;
  const all = st => st.acts || [];
  const byId = (st, id) => all(st).find(a => a.id === id) || null;

  // ——— карточка, к которой привязано дело ———
  // Живая ли карточка: лид не в финале, сделка открыта, клиент есть. Нет карточки — не жива.
  function alive(st, ref) {
    if (!ref) return false;
    if (ref.t === 'deal') { const d = (st.deals || []).find(x => x.id === ref.id); return !!d && Deals.state(st, d) === 'open'; }
    if (ref.t === 'lead') { const l = (st.leads || []).find(x => x.id === ref.id); return !!l && !Pipes.isFinal(st, l.pipeId, l.stageId); }
    if (ref.t === 'client') return !!Clients.byId(st, ref.id);
    if (ref.t === 'dispatch') { const d = Dispatch.byId(st, ref.id); return !!d && !Pipes.isFinal(st, d.pipeId, d.stageId); }
    return false;
  }
  // Как назвать карточку в тексте: «Сделка Д-311 (ООО …)».
  function refTitle(st, ref) {
    let name = '';
    if (ref.t === 'deal') name = ((st.deals || []).find(x => x.id === ref.id) || {}).client;
    else if (ref.t === 'lead') { const l = (st.leads || []).find(x => x.id === ref.id); name = l ? Leads.title(l) : ''; }
    else if (ref.t === 'client') name = (Clients.byId(st, ref.id) || {}).name;
    else if (ref.t === 'dispatch') name = ((Dispatch.byId(st, ref.id) || {}).to || {}).name;
    return `${Feed.REF[ref.t] || 'Карточка'} ${ref.id}${name ? ` (${name})` : ''}`;
  }
  // Карточки, чьи дела видны в этой: у клиента — ещё его сделки и лиды (те, что видит personId), как в его ленте.
  function refs(st, ref, personId) {
    const out = [ref];
    if (ref.t === 'client') {
      const rel = Clients.related(st, ref.id, personId);
      rel.deals.forEach(d => out.push({ t: 'deal', id: d.id }));
      rel.leads.forEach(l => out.push({ t: 'lead', id: l.id }));
    }
    return out;
  }

  // ——— срок и напоминание ———
  const label = a => `${TYPES[a.type].toLowerCase()} · ${fWhen(a.due)}`;
  // Быстрые сроки от now: «сегодня» — 18:00 (а если до него меньше 15 минут — через час, но не позже конца дня),
  // «завтра» и «через неделю» — в 10:00.
  function quick(kind, now) {
    const n = new Date(now);
    const at = (add, h, m = 0) => { const d = new Date(n); d.setDate(d.getDate() + add); d.setHours(h, m, 0, 0); return d; };
    if (kind === 'tomorrow') return at(1, 10);
    if (kind === 'week') return at(7, 10);
    let d = at(0, 18);
    if (d.getTime() < n.getTime() + 15 * 6e4) { d = new Date(n.getTime() + 60 * 6e4); d.setSeconds(0, 0); }
    if (d.getDate() !== n.getDate()) d = at(0, 23, 59);
    return d;
  }

  // ——— поставить и выполнить ———
  // Новое дело: {type, title?, due, ownerId?, remind?}. Без вида или срока — {ok:false, missing:[…]}. Без названия — название
  // вида («Звонок»). Ответственный по умолчанию — тот, кто ставит; и он, и тот, кто ставит, должны видеть карточку (Feed.canComment).
  // remind — за сколько минут до срока напомнить; пусто — не напоминать. → {ok, id, act, missing, reason}
  function plan(st, ref, data, by, now) {
    const d = data || {}, missing = [];
    if (!TYPES[d.type]) missing.push('type');
    const due = time(d.due);
    if (due === null) missing.push('due');
    if (missing.length) return fail(`Не заполнено: ${missing.map(k => MISSING[k]).join(', ')}.`, { id: null, act: null, missing });
    const none = { id: null, act: null, missing: [] };
    if (!ref || !REFS.includes(ref.t) || !alive(st, ref)) return fail('Такой карточки нет или она закрыта — дело поставить некуда.', none);
    if (!Feed.canComment(st, by, ref)) return fail('У вас нет права ставить дела в эту карточку.', none);
    const ownerId = d.ownerId || by;
    if (!personOf(st, ownerId)) return fail('Такого сотрудника нет.', none);
    if (!Feed.canComment(st, ownerId, ref)) return fail('Этот сотрудник не видит карточку — поставить ему дело нельзя.', none);
    let remind = null;
    if (d.remind !== undefined && d.remind !== null && d.remind !== '' && d.remind !== false) {
      remind = d.remind === true ? 0 : Math.round(Number(d.remind));
      if (!(remind >= 0) || !isFinite(remind)) return fail('Напоминание — число минут до срока.', none);
    }
    st.acts = st.acts || [];
    const a = {
      id: Store.freeId(st.acts, 'a'), ref: { t: ref.t, id: ref.id }, type: d.type, title: str(d.title) || TYPES[d.type],
      due: new Date(due), ownerId, by: by || null, at: now, remind,
    };
    st.acts.push(a);
    return { ok: true, id: a.id, act: a, missing: [], reason: '' };
  }

  // Выполнить дело с результатом: без результата — отказ (дело выполняют с результатом). Выполненное не правится и не
  // выполняется второй раз. Запись появляется в ленте карточки (Feed.of). → {ok, act, reason}
  function done(st, id, result, by, now) {
    const a = byId(st, id);
    if (!a) return fail('Такого дела нет.', { act: null });
    if (a.doneAt) return fail('Дело уже выполнено.', { act: a });
    const res = str(result);
    if (!res) return fail('Напишите результат: что получилось.', { act: a });
    if (!Feed.canComment(st, by, a.ref)) return fail('У вас нет права закрывать дела этой карточки.', { act: a });
    a.doneAt = now;
    a.doneBy = by || null;
    a.result = res;
    return { ok: true, act: a, reason: '' };
  }
  // Фраза о выполненном деле — одна на ленту и на что угодно ещё.
  const doneText = a => `${TYPES[a.type]} «${a.title}», срок ${fWhen(a.due)}. Результат: ${a.result}`;

  // ——— выборки ———
  const byDue = (a, b) => time(a.due) - time(b.due);
  // Открытые дела карточки, ближайшее первым. У клиента — и дела его сделок и лидов (personId — чьими глазами).
  function open(st, ref, personId) {
    const rs = refs(st, ref, personId);
    return all(st).filter(a => !a.doneAt && rs.some(r => same(r, a.ref))).sort(byDue);
  }
  // Перенести открытые дела с одной карточки на другую (лид стал сделкой): меняется ref, в ленту новой карточки — одна запись
  // со списком. Выполненные дела остаются где были. → [перенесённые дела, ближайшее первым]
  function moveOpen(st, from, to, by, now) {
    const moved = all(st).filter(a => !a.doneAt && same(a.ref, from)).sort(byDue);
    if (!moved.length) return [];
    moved.forEach(a => { a.ref = { t: to.t, id: to.id }; });
    Feed.add(st, to, { kind: 'actmove', by, at: now, text: `Из ${(Feed.REF[from.t] || 'карточки').toLowerCase()} ${from.id} перенесены открытые дела (${moved.length}): ${moved.map(a => `${label(a)} «${a.title}»`).join('; ')}.` });
    return moved;
  }
  // Ближайшее открытое дело или null.
  const next = (st, ref, personId) => open(st, ref, personId)[0] || null;
  // «Нет следующего шага»: карточка жива, а открытых дел у неё нет.
  const noNext = (st, ref) => alive(st, ref) && open(st, ref).length === 0;
  // Есть ли у живой карточки просроченное открытое дело.
  const overdue = (st, ref, now) => {
    const t = time(now);
    return alive(st, ref) && t !== null && open(st, ref).some(a => time(a.due) < t);
  };
  // Подходит ли карточка под фильтр экрана: 'none' — без дел, 'overdue' — просрочены дела.
  const matches = (st, ref, mode, now) => (mode === 'none' ? noNext(st, ref) : mode === 'overdue' ? overdue(st, ref, now) : true);

  // Мои дела: сколько на сегодня (срок ещё впереди, но сегодня) и сколько просрочено (срок прошёл, now — сейчас).
  // Только открытые дела живых карточек, где человек — ответственный. type ('deal' | 'lead' | 'client') — только дела таких карточек.
  function counts(st, personId, now, type) {
    const t = time(now), out = { today: 0, overdue: 0 };
    if (t === null) return out;
    const end = new Date(t); end.setHours(24, 0, 0, 0);
    for (const a of all(st)) {
      if (a.doneAt || a.ownerId !== personId || (type && a.ref.t !== type) || !alive(st, a.ref)) continue;
      const d = time(a.due);
      if (d < t) out.overdue++; else if (d < end.getTime()) out.today++;
    }
    return out;
  }

  // ——— напоминания ———
  // Дела, которым пора напомнить: открытые, живой карточки, с напоминанием, срок минус remind уже наступил, а напоминание
  // ещё не уходило (remindedAt нет).
  function due(st, now) {
    const t = time(now);
    if (t === null) return [];
    return all(st).filter(a => !a.doneAt && !a.remindedAt && a.remind !== null && a.remind !== undefined
      && time(a.due) - a.remind * 6e4 <= t && alive(st, a.ref));
  }
  // Разослать напоминания: каждому делу — одно уведомление «act» его ответственному, дело помечается remindedAt.
  // Вторая проверка в ту же минуту ничего не шлёт. → [уведомление…]
  function notify(st, now) {
    return due(st, now).map(a => {
      a.remindedAt = now;
      return Notify.push(st, 'act', null, `Пора: ${label(a)} — «${a.title}». ${refTitle(st, a.ref)}.`, now, [a.ownerId]);
    });
  }

  return { TYPES, REMINDS, QUICK, REFS, byId, alive, refTitle, label, quick, plan, done, doneText, moveOpen, open, next, noNext, overdue, matches, counts, due, notify };
})();

// Шаг SEEDS: демо-дела. У открытых сделок и лидов — открытые дела: часть просрочена, часть на сегодня, часть на завтра и
// дальше, у части — ни одного («нет следующего шага»); у части сделок есть и выполненные дела с результатом. Ответственный —
// менеджер карточки, а каждое четвёртое дело — тот, кто сейчас в системе (st.me), чтобы счётчики не были пустыми.
// Всё помечено «пример». Напоминаний у демо-дел нет: при первом запуске в уведомления ничего не сыплется.
SEEDS.push(st => {
  st.acts = [];
  const TITLES = {
    call: ['Перезвонить по расчёту', 'Уточнить сроки по поставке', 'Согласовать время замера'],
    meet: ['Встреча на объекте', 'Показать КП в офисе'],
    mail: ['Отправить КП на почту', 'Выслать схему подключения'],
    todo: ['Подготовить договор', 'Собрать данные для расчёта'],
  };
  // шаблоны по кругу: [вид, срок: дней от сегодня, час, ещё одно дело: вид, дни, час]
  const PAT = [
    [['call', -1, 11]],
    [['meet', 0, 17]],
    [['mail', 1, 10]],
    [],
    [['todo', 5, 12], ['call', 0, 18]],
    [['meet', -3, 14], ['call', 1, 15]],
  ];
  const pick = (kind, k) => `${TITLES[kind][k % TITLES[kind].length]} (пример)`;
  const seedFor = (ref, managerId, created, k) => {
    for (const [j, [kind, add, hour]] of PAT[k % PAT.length].entries()) {
      const owner = (k + j) % 4 === 0 ? st.me : managerId;
      if (!owner) continue;
      Acts.plan(st, ref, { type: kind, title: pick(kind, k + j), due: day(add, hour, 0), ownerId: owner }, owner, created);
    }
    // выполненное дело: каждой третьей карточке, не там, где дел нет совсем
    if (k % 3 === 0 && managerId && PAT[k % PAT.length].length) {
      const r = Acts.plan(st, ref, { type: 'call', title: 'Первый звонок клиенту (пример)', due: day(-2, 11, 0), ownerId: managerId }, managerId, created);
      if (r.ok) Acts.done(st, r.id, 'Пример: дозвонились, клиент ждёт расчёт.', managerId, day(-2, 12, 0));
    }
  };
  st.deals.filter(d => Deals.state(st, d) === 'open').forEach((d, k) => seedFor({ t: 'deal', id: d.id }, d.managerId, d.at || day(-3, 9, 0), k));
  st.leads.filter(l => !Pipes.isFinal(st, l.pipeId, l.stageId)).forEach((l, k) => seedFor({ t: 'lead', id: l.id }, l.managerId, l.at || day(-3, 9, 0), k));
});

// Записать S в браузер. Не влезает — без фото и короткое сообщение; совсем не влезает — сообщение.
let _photoWarn=0,_saveT=0;
function save(){
  if(!S) return null;
  let r=Store.dump(S),ok=true;
  try{localStorage.setItem(Store.KEY,r.text)}catch(_){
    // браузер дал меньше места, чем рассчитывает Store: предел ужимается по шагу, и выкидывается только то,
    // что не влезло (сначала новые и крупные фото и файлы); не влезло и без них — не сохранено
    const full=r.text.length;ok=false;
    for(const k of [.95,.9,.8,.65,.5,.3,0]){
      r=Store.dump(S,Math.floor(full*k));
      try{localStorage.setItem(Store.KEY,r.text);ok=true;break}catch(_){}
    }
  }
  if(!ok) toast('Изменения не сохранены — мало места в браузере','warn');
  else if((r.droppedPhotos||r.droppedFiles)&&(r.droppedPhotos+r.droppedFiles)!==_photoWarn) toast((r.droppedPhotos?'Фото':'Файлы заявок')+(r.droppedPhotos&&r.droppedFiles?' и файлы заявок':'')+' не сохранены — мало места в браузере','warn');
  _photoWarn=(r.droppedPhotos||0)+(r.droppedFiles||0);
  return {ok,droppedPhotos:r.droppedPhotos,fits:r.fits&&ok};
}

// ——— поиск ———
// Реестр источников: SEARCH.push({kind, label, find:(q)=>[{title, sub, open}], order?}) — раздел регистрирует свой в своём
// файле. kind — машинное имя вида, label — подпись в строке результата («Сделка»), order — где в выдаче (меньше — выше,
// по умолчанию 50). find получает строку поиска в нижнем регистре, сам проверяет право и видимость текущему человеку
// и возвращает записи; open — готовые атрибуты кнопки (data-act="open-…" data-id="…"), как у карточек.
const SEARCH=[];
const SEARCH_PER=4,SEARCH_ALL=12;   // записей от одного источника и всего в выдаче
// Подстрока в любом из полей — общая проверка для find
const searchHas=(q,...parts)=>parts.join(' ').toLowerCase().includes(q);
// Выдача по строке q: [{kind, type (подпись), label, sub, act}]. Короче двух букв — пусто. Право и видимость проверяет
// сам источник в find: нет права — возвращает [].
function searchRes(q){
  q=String(q||'').trim().toLowerCase();if(q.length<2) return [];
  const out=[];
  for(const s of SEARCH.slice().sort((a,b)=>(a.order??50)-(b.order??50))){
    (s.find(q)||[]).slice(0,SEARCH_PER).forEach(x=>out.push({kind:s.kind,type:s.label,label:x.title,sub:x.sub||'',act:x.open}));
  }
  return out.slice(0,SEARCH_ALL);
}
