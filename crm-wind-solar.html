// ——— прокрутка колонок воронок ———
// Одно поведение для всех досок: раздел только ставит data-hscroll на контейнер, который листается вбок
// (так отмечены задачи, поставки, лиды, сделки; отправки — тем же атрибутом). Оболочка заворачивает контейнер в
// .hs и кладёт у краёв две кнопки «Листать влево/вправо». Стрелка видна, только когда с её стороны есть что листать
// и мышь у края (или на ней); пока курсор на стрелке, колонки плавно едут; доехали до конца — стрелка пропала.
// Карточку тащат у края — колонки едут сами. Пересчёт: прокрутка, размер окна, render() и любая перерисовка
// куска раздела (поиск в поставках и лидах) — по наблюдателю за #view. Сенсорный экран: стрелок нет, листают пальцем.
const HS_EDGE=64;     // полоса у края, px: мышь в ней — стрелка видна; карточка в ней — колонки едут сами
const HS_SPEED=720;   // px/с под курсором на стрелке
const HS_DRAG=1100;   // px/с у самой кромки при перетаскивании карточки
const HS_STEP=0.8;    // доля ширины контейнера за одно нажатие стрелки с клавиатуры
const HS_JUMP=0.4;    // при «меньше движения»: доля ширины за один скачок вместо плавной прокрутки
const HS_JUMP_MS=450; // и пауза между скачками, пока курсор на стрелке
Object.assign(IC,{
  chevL:'<path d="M15 5l-7 7 7 7"/>',
  chevR:'<path d="M9 5l7 7-7 7"/>'
});
// Куда ещё можно листать. el — {scrollLeft, clientWidth, scrollWidth}; доля пикселя на дробном масштабе не в счёт.
function hscrollCan(el){
  return {left:el.scrollLeft>1,right:el.scrollWidth-el.clientWidth-el.scrollLeft>1};
}
// Скорость прокрутки в px/с (минус — влево) для курсора в x над контейнером [left, right]: в полосе edge от кромки
// растёт от нуля до max, чем ближе к кромке, тем быстрее.
function hscrollEdgeSpeed(x,left,right,edge,max){
  edge=Math.min(edge,(right-left)/3);
  if(!(edge>0)) return 0;
  const l=left+edge-x,r=x-(right-edge);
  if(l>0) return -max*Math.min(1,l/edge);
  if(r>0) return max*Math.min(1,r/edge);
  return 0;
}
const hsArrow=d=>`<div class="hs-a hs-${d}" hidden><button type="button" class="hs-b" data-hs="${d}" aria-label="Листать ${d==='l'?'влево':'вправо'}">${ic(d==='l'?'chevL':'chevR')}</button></div>`;
const hsBox=el=>{const w=el.parentElement;return w&&w.classList.contains('hs')?w:null};
// Завернуть контейнер в .hs со стрелками. true — завернули сейчас (прокрутка при этом сбрасывается).
function hscrollWrap(el){
  if(hsBox(el)) return false;
  const w=document.createElement('div');w.className='hs';
  el.parentNode.insertBefore(w,el);w.appendChild(el);
  w.insertAdjacentHTML('beforeend',hsArrow('l')+hsArrow('r'));
  return true;
}
// Показать стрелку только с той стороны, куда ещё есть что листать
function hscrollUpdate(el){
  const w=hsBox(el);if(!w) return;
  const c=hscrollCan(el),l=w.querySelector('.hs-l'),r=w.querySelector('.hs-r');
  if(l) l.hidden=!c.left;
  if(r) r.hidden=!c.right;
}
// Все помеченные контейнеры раздела: завернуть, вернуть прокрутку (keep — положения до перерисовки), пересчитать
function hscrollSync(keep){
  const list=[...byId('view').querySelectorAll('[data-hscroll]')];
  list.forEach((el,i)=>{
    const fresh=hscrollWrap(el);
    if(fresh&&keep&&keep[i]) el.scrollLeft=keep[i];
    hscrollUpdate(el);
  });
}
// Раздел, который сейчас нарисован, и положения его досок: после перерисовки того же раздела (бросили карточку,
// сменили фильтр) доска остаётся на месте, а не уезжает к первой колонке
let _hsView='';
const hscrollKeep=()=>_hsView===S.view?[...byId('view').querySelectorAll('[data-hscroll]')].map(el=>el.scrollLeft):[];

// Прокрутка по кадрам: под курсором на стрелке и у края при перетаскивании. Работа одна на всех.
let _hsJob=null,_hsRaf=0,_hsNear=null;
const reducedMotion=()=>{try{return typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches}catch(_){return false}};
// speed 0 или нет контейнера — остановить; until — когда перестать, если события перетаскивания пропали
function hscrollRun(el,speed,until){
  if(!el||!speed){_hsJob=null;return}
  if(_hsJob&&_hsJob.el===el){_hsJob.speed=speed;_hsJob.until=until||0}
  else _hsJob={el,speed,until:until||0,t:0,pos:el.scrollLeft,acc:HS_JUMP_MS};
  if(!_hsRaf&&typeof requestAnimationFrame==='function') _hsRaf=requestAnimationFrame(hscrollFrame);
}
function hscrollFrame(now){
  _hsRaf=0;
  const j=_hsJob;if(!j) return;
  if(j.until&&now>j.until){_hsJob=null;return}
  const el=j.el,dt=j.t?Math.min(now-j.t,50):16,can=hscrollCan(el);
  j.t=now;
  if(j.speed<0?!can.left:!can.right){_hsJob=null;return}   // доехали до конца
  if(reducedMotion()){
    // «меньше движения»: вместо плавной прокрутки — скачки через паузу
    j.acc+=dt;
    if(j.acc>=HS_JUMP_MS){j.acc=0;el.scrollLeft+=Math.sign(j.speed)*Math.round(el.clientWidth*HS_JUMP)}
  }else{
    // дробный путь копим отдельно: браузер округляет scrollLeft, и медленная прокрутка иначе встала бы
    if(Math.abs(el.scrollLeft-j.pos)>2) j.pos=el.scrollLeft;
    j.pos+=j.speed*dt/1000;el.scrollLeft=j.pos;
  }
  _hsRaf=requestAnimationFrame(hscrollFrame);
}
const hscrollEl=w=>w&&w.querySelector('[data-hscroll]');
// Мышь над .hs: у левого или правого края — просим CSS показать стрелку этой стороны (data-near)
function hscrollPoint(e){
  if(e.pointerType&&e.pointerType!=='mouse') return;
  const w=e.target.closest?.('.hs');
  if(_hsNear&&_hsNear!==w){delete _hsNear.dataset.near;_hsNear=null}
  const el=hscrollEl(w);if(!el) return;
  const r=el.getBoundingClientRect(),side=e.clientX-r.left<HS_EDGE?'l':r.right-e.clientX<HS_EDGE?'r':'';
  if(side){w.dataset.near=side;_hsNear=w}else delete w.dataset.near;
}
function hscrollClearNear(){if(_hsNear){delete _hsNear.dataset.near;_hsNear=null}}

  // видимая сделка, не больше «в строках сделки − уже в резерве», запись в ленте сделки, уведомление складу, директору и менеджеру.
  reserve:f=>{
    const p=product(f.dataset.pid),did=byId('rs-deal').value,qty=parseInt(byId('rs-qty').value,10),src=byId('rs-src').value,until=byId('rs-until').value;
    if(!did) return showErr('rs-err','Нет ваших открытых сделок с этим товаром в строках: добавьте товар в сделку — тогда здесь можно поставить резерв.');
    if(!until||dd(fromIso(until))<0) return showErr('rs-err','Дата окончания резерва не может быть в прошлом.');
    const u=fromIso(until),now=new Date();
    const res=Deals.reserve(S,did,{productId:p.id,qty,src,entityId:byId('rs-ent').value,cityId:byId('rs-city').value,until:u},S.me,now);
    if(!res.ok) return showErr('rs-err',res.reason);
    render();toast(`Резерв поставлен: ${qtyOf(res.reserve.qty,p)} для ${did}. Склад, директор и менеджер сделки получили уведомление.`);
  },
  stage:f=>shipStageForm(f),
  task:()=>{
    const title=byId('t-title').value.trim();
    if(!title){showErr('t-err','Напишите, что нужно сделать.');byId('t-title').focus();return}
    const [tt,id]=byId('t-to').value.split(':'),due=byId('t-due').value,m=me(),now=new Date(),board=curBoard();
    const t={id:Store.freeId(S.tasks,'t'),title,desc:byId('t-desc').value.trim(),to:{t:tt,id},from:m.id,due:due?fromIso(due,18):day(2,18),boardId:board.id,stageId:startStage(board.id).id,prio:byId('t-prio').value,deal:byId('t-deal')?.value||'',at:now};
    S.tasks.push(t);
    Notify.push(S,'task',m.id,`Новая задача: «${title}», срок ${fD(t.due)}.${t.deal?' Сделка '+t.deal+'.':''} От: ${m.name}.`,now,targetPeople(t.to));
    closeModal();render();toast(`Задача поставлена. ${targetName(t)} — уведомление отправлено.`);
  },
  ship:f=>shipCreate(f),
  product:()=>{
    const name=byId('np-name').value.trim(),pr=byId('np-price'),m=me();
    if(!name) return showErr('np-err','Нужно наименование.');
    if(S.products.some(p=>Catalog.norm(p.name)===Catalog.norm(name))) return showErr('np-err',`Товар «${name}» уже есть в номенклатуре.`);
    const price=pr&&pr.value!==''?Math.max(0,Number(pr.value)):null;
    S.products.push({id:Store.freeId(S.products,'u'),name,brand:null,cat:byId('np-cat').value,unit:byId('np-unit').value,price,avail:null,url:null,src:'user',inCatalog:false});
    Notify.push(S,'arrive',m.id,`В номенклатуру добавлен товар: ${name}.`,new Date());
    closeModal();S.ui.cat='Все';S.ui.sq='';render();toast('Товар добавлен. Остатка нет — он появится после первой приёмки.');
  },
  msg:f=>{
    const d=deal(f.dataset.id),ta=byId('msg-text'),txt=ta.value.trim();
    if(!txt){ta.focus();return}
    S.msgs.push({id:Store.freeId(S.msgs,'m'),at:new Date(),deal:d.id,channel:d.channel,by:me().id,text:txt});
    render();toast(`Сообщение записано в переписку. В прототипе в ${CH[d.channel]} оно не уходит.`);
  }
};

// Раздел «Сегодня»: «что сделать сегодня» — свой у каждой роли.
// Сверху плитки дня (homeTiles): каждое число — вызов ядра, своих копий расчёта здесь нет — Ships.awaitingReceipt,
// Leads.fresh, Stock.expired, Dispatch.query, Acts.counts и Acts.noNext, Deals.sumOf, taskCounts (52-tasks.js).
// Плитку роли, которой она не нужна, не показываем; нулевая плитка спокойная. Нажатие открывает список с нужным фильтром.
// Ниже — сводка по фирме (директор), неделя, «Требует внимания», мои задачи и события.

// ——— «Сегодня» ———
// ——— плитки дня ———
// Реестр плиток: {id, label, show, calc → {value, sub, tone, …}, open}. tone '' · 'bad' (просрочено) · 'warn' (нужно действие).
const homeOpenDeals=()=>Leads.dealsVisible(S,S.me).filter(d=>Deals.state(S,d)==='open');
// Резервы по сделкам, которые видит человек (Leads.dealsVisible): резерв называет сделку и клиента, чужой — не показываем
const homeVisible=list=>{const vis=new Set(Leads.dealsVisible(S,S.me).map(d=>d.id));return list.filter(r=>vis.has(r.dealId))};
// Резервы с истёкшим сроком (Stock.expired) по видимым сделкам — одно число на плитку и на «Требует внимания»
const homeExpired=()=>homeVisible(Stock.expired(S,new Date()));
// Резервы видимых сделок, срок которых выходит за два дня
const homeSoon=()=>homeVisible(S.reserves.filter(r=>{const n=dd(r.until);return n>=0&&n<=2}));
// Сделки без следующего шага: открытые видимые сделки, у которых Acts.noNext
const homeNoNext=()=>homeOpenDeals().filter(d=>Acts.noNext(S,{t:'deal',id:d.id}));
const homeIsDriver=()=>Dispatch.drivers(S).some(p=>p.id===S.me);
// Отправки на сегодня: открытые заявки с датой «сегодня»; водителю — только назначенные ему
const homeDispatch=()=>Dispatch.query(S,{today:true,now:new Date(),driver:homeIsDriver()?S.me:''}).filter(d=>!Pipes.isFinal(S,d.pipeId,d.stageId));
const homeTone=(n,tone)=>n>0?tone:'';
const HOME_TILES=[
  {id:'tasks',label:'Мои задачи на сегодня',show:()=>true,
    calc:()=>{const c=taskCounts(),v=c.today+c.overdue;return {value:v,today:c.today,overdue:c.overdue,sub:c.overdue?`просрочено: ${c.overdue}`:v?'просроченных нет':'на сегодня задач нет',tone:homeTone(c.overdue,'bad')}},
    open:()=>{const c=taskCounts();S.ui.taskF=c.overdue&&!c.today?'over':'mine';go('tasks')}},
  {id:'leads',label:'Новые лиды',show:()=>can('leads'),
    calc:()=>{const n=Leads.fresh(S,S.me).length;return {value:n,sub:n?'ждут первого шага':'новых лидов нет',tone:homeTone(n,'warn')}},
    open:()=>{const p=leadPipe();S.ui.leads=Object.assign({},LEAD_DEF,{view:'list',stage:p?Leads.firstOf(p).id:''});go('leads')}},
  {id:'receipt',label:'Поставки к приёмке',show:()=>can('receive')||can('logistics'),
    calc:()=>{const n=Ships.awaitingReceipt(S).length;return {value:n,sub:n?'приехали и ждут приёмки':'ничего не ждёт приёмки',tone:homeTone(n,'warn')}},
    open:()=>{
      if(can('receive')) return go('receiving');
      const p=shipPipe('in'),st=p&&p.stages.find(x=>x.flag==='arrived');
      S.ui.logTab='in';setShipUi({stage:st?st.id:'open',page:1});go('logistics');
    }},
  {id:'reserves',label:'Резервы с истёкшим сроком',show:()=>can('reserve'),
    calc:()=>{const n=homeExpired().length;return {value:n,sub:n?'снимите или продлите':'просроченных резервов нет',tone:homeTone(n,'bad')}},
    open:()=>go('stock')},
  {id:'dispatch',label:'Отправки на сегодня',show:()=>Dispatch.canWork(S,S.me),
    calc:()=>{const n=homeDispatch().length;return {value:n,sub:n?(homeIsDriver()?'назначены вам':'собираем и везём'):'на сегодня отправок нет',tone:''}},
    open:()=>{S.ui.dispatch=Object.assign({},DSP_DEF,{view:dspSel().view,today:true,driver:homeIsDriver()?S.me:''});go('dispatch')}},
  {id:'acts',label:'Мои дела на сегодня',show:()=>can('clients')||can('leads')||Dispatch.canWork(S,S.me),
    calc:()=>{const c=Acts.counts(S,S.me,new Date()),v=c.today+c.overdue;return {value:v,today:c.today,overdue:c.overdue,sub:c.overdue?`просрочено: ${c.overdue}`:v?'просроченных нет':'на сегодня дел нет',tone:homeTone(c.overdue,'bad')}},
    open:()=>{
      if(!can('clients')) return go(can('leads')?'leads':'dispatch');
      const c=Acts.counts(S,S.me,new Date());
      S.ui.deals=Object.assign({},DEALS_DEF,{view:dealsSel().view,acts:c.overdue?'overdue':''});go('deals');
    }},
  {id:'nonext',label:'Сделки без следующего шага',show:()=>can('leads')||can('firm'),
    calc:()=>{const n=homeNoNext().length;return {value:n,sub:n?'запланируйте дело':'у всех сделок есть следующий шаг',tone:homeTone(n,'warn')}},
    open:()=>{S.ui.deals=Object.assign({},DEALS_DEF,{view:dealsSel().view,acts:'none'});go('deals')}}
];
// Плитки, нужные этой роли: [{id, label, value, sub, tone, …}] в порядке реестра
const homeTiles=()=>HOME_TILES.filter(t=>t.show()).map(t=>Object.assign({id:t.id,label:t.label},t.calc()));
function todayHtml(){
  const list=homeTiles();
  return `<section class="today" aria-label="Что сделать сегодня"><h3 class="today-h">Что сделать сегодня</h3><div class="tiles">${list.map(t=>`<button type="button" class="ttile${t.value?'':' calm'}${t.tone?' '+t.tone:''}" data-act="home-tile" data-tile="${esc(t.id)}"><span class="k-l">${esc(t.label)}</span><b class="k-v">${t.value}</b><span class="k-s">${esc(t.sub)}</span></button>`).join('')}</div></section>`;
}
A['home-tile']=el=>{const t=HOME_TILES.find(x=>x.id===el.dataset.tile);if(t&&t.show()) t.open()};

function vHome(){
  const m=me(),hr=new Date().getHours();
  const g=hr<5?'Доброй ночи':hr<12?'Доброе утро':hr<18?'Добрый день':'Добрый вечер';
  let h=`<div class="hello"><h2>${g}, ${esc(m.name.split(' ')[0])}</h2><p>${cap(WDF[T0.getDay()])}, ${T0.getDate()} ${MONF[T0.getMonth()]} · ${esc(roleName(m))}</p></div>`;
  h+=todayHtml();
  if(can('firm')) h+=kpiHtml();
  if(can('stock')) h+=weekHtml();
  const L=[];
  if(can('stock')||can('firm')) L.push(attnHtml());
  L.push(myTasksHtml());
  h+=`<div class="home-grid"><div class="stack">${L.join('')}</div><div class="stack">${eventsHtml()}</div></div>`;
  return h;

function kpiHtml(){
  const open=S.tasks.filter(t=>!isDone(t)),over=open.filter(taskOverdue);
  const inT=openIn(),late=S.shipments.filter(isLate);
  const rd=new Set(S.reserves.map(r=>r.dealId));
  const act=S.deals.filter(d=>Deals.state(S,d)==='open'),total=Deals.sumOf(act);
  const tile=(l,v,s,c,view)=>`<button class="kpi" data-act="go" data-view="${view}"><span class="k-l">${l}</span><b class="k-v">${v}</b><span class="k-s ${c}">${s}</span></button>`;
  return `<div class="kpis">${[
    tile('Задачи в работе',open.length,over.length?`${over.length} ${pl(over.length,'просрочена','просрочены','просрочено')}`:'просроченных нет',over.length?'bad':'ok','tasks'),
    tile('Поставок в пути',inT.length,late.length?`${late.length} ${pl(late.length,'задерживается','задерживаются','задерживаются')}`:'все по графику',late.length?'warn':'ok','logistics'),
    tile('Позиций в резерве',S.reserves.length,`по ${rd.size} ${pl(rd.size,'сделке','сделкам','сделкам')}`,'','stock'),
    tile('Сделок в работе',act.length,can('prices')?`на ${mln(total)}`:'суммы скрыты для роли','','deals')
  ].join('')}</div>`;
}
function weekHtml(){
  const act=S.shipments.filter(s=>!isDone(s)),late=act.filter(isLate);
  const chip=s=>`<button class="wchip ${s.dir} ${isLate(s)?'late':''}" data-act="open-ship" data-id="${esc(s.id)}"><b class="mono">${s.id}</b><span>${s.dir==='in'?'приход':'отгрузка'} · ${esc(shortItems(s))}</span></button>`;
  let cols='';
  if(late.length) cols+=`<div class="wd late"><div class="wd-h">Опаздывают<b>${late.length} ${pl(late.length,'поставка','поставки','поставок')}</b></div>${late.map(chip).join('')}</div>`;
  for(let i=0;i<7;i++){
    const d=day(i),list=act.filter(s=>!isLate(s)&&dd(s.eta)===i);
    cols+=`<div class="wd ${i===0?'today':''}"><div class="wd-h">${i===0?'Сегодня':i===1?'Завтра':WDF[d.getDay()]}<b>${d.getDate()} ${MON[d.getMonth()]}</b></div>${list.map(chip).join('')}</div>`;
  }
  return `<section class="card"><div class="card-h"><h3>Неделя: что приходит и что уезжает</h3><button class="btn sm ghost" data-act="go" data-view="logistics">Все перевозки ${ic('arrow')}</button></div><div class="card-b"><div class="xs"><div class="week" style="--n:${late.length?8:7}">${cols}</div></div></div></section>`;
}
function attention(){
  const a=[];
  S.tasks.filter(t=>taskOverdue(t)&&taskVisible(t)).forEach(t=>a.push({lvl:'bad',icon:'tasks',text:`Просрочена задача «${t.title}»`,sub:`${targetName(t)} · срок был ${fD(t.due)}`,act:`data-act="open-task" data-id="${t.id}"`}));
  if(can('stock')){
    S.shipments.filter(isLate).forEach(s=>a.push({lvl:'warn',icon:'truck',text:`${s.id} задерживается на ${days(-dd(s.eta))}`,sub:`Последняя отметка: ${shipLast(s).text}`,act:`data-act="open-ship" data-id="${esc(s.id)}"`}));
    S.products.forEach(p=>{
      const k=stockOf(p.id);
      if(k.freeAfter<0) a.push({lvl:'bad',icon:'box',text:`${p.name}: под резервы не хватает ${qtyOf(-k.freeAfter,p)}`,sub:'Даже с учётом всех поставок в пути',act:`data-act="open-product" data-pid="${esc(p.id)}"`});
      else if(k.onHand>0&&k.free<=0&&!k.incoming) a.push({lvl:'warn',icon:'box',text:`${p.name}: свободный остаток закончился`,sub:'Всё, что на складе, в резерве. Поставок нет',act:`data-act="open-product" data-pid="${esc(p.id)}"`});
    });
    homeExpired().forEach(r=>{const p=product(r.productId),d=deal(r.dealId);a.push({lvl:'bad',icon:'clock',text:`Срок резерва вышел: ${p?p.name:'нет данных: товар'} — ${qtyOf(r.qty,p)}`,sub:`${r.dealId} · ${d?.client||''} · был до ${fD(r.until)}`,act:`data-act="open-product" data-pid="${esc(r.productId)}"`})});
    homeSoon().forEach(r=>{const p=product(r.productId),d=deal(r.dealId);a.push({lvl:'info',icon:'clock',text:`Резерв истекает ${fRel(r.until)}: ${p.name} — ${qtyOf(r.qty,p)}`,sub:`${r.dealId} · ${d?.client||''}`,act:`data-act="open-product" data-pid="${esc(p.id)}"`})});
  }
  return a;
}
function attnHtml(){
  const a=attention();

function eventsHtml(){

// Раздел «Задачи»
// Перенесено из прототипа v2; колонки — этапы доски задач (Pipes), «готово» — флаг final.
// Задача ставится человеку или целому отделу: задачу отдела видят все в отделе, «Взять» делает взявшего исполнителем.
// Досок несколько; в режиме «Редактировать доску» имя доски и колонок правятся на месте тем же редактором,
// что и «Настройки → Воронки» (разметка и действия — в 62-settings-pipes.js, данные правит ядро Pipes).

// Доска, открытая сейчас: выбранная в переключателе, иначе первая. Новая задача встаёт на неё.
function curBoard(){
  const boards=Pipes.of(S,'tasks');
  return boards.find(b=>b.id===S.ui.taskBoard)||boards[0]||null;
}
// Режим «Редактировать доску»: только у того, кому можно менять настройки фирмы
const boardEditing=()=>!!S.ui.boardEdit&&can('settings')&&!!curBoard();
// Цвет точки задачи — по флагу и месту этапа в воронке (stageTone), а не по номеру или id этапа: этапы можно переименовать и добавить
const taskDot=t=>stageTone(t);
// Мои задачи сегодня и просроченные: {today — срок сегодня, overdue — taskOverdue}. Открытые, мои или моего отдела (taskMine).
// Единственный счёт для плитки главного экрана; «просрочена» — taskOverdue, второго определения нет.
const taskCounts=()=>{
  const mine=S.tasks.filter(t=>taskMine(t)&&!isDone(t));
  return {today:mine.filter(t=>dd(t.due)===0).length,overdue:mine.filter(taskOverdue).length};
};
// Задача отдела, которую может взять человек из этого отдела
const taskTakable=t=>t.to.t==='d'&&t.to.id===me().dept&&!isDone(t);

// ——— задачи ———
function vTasks(){
  const m=me(),F=S.ui.taskF,boards=Pipes.of(S,'tasks'),board=curBoard(),cols=board?.stages||[],edit=boardEditing();
  let list=S.tasks.filter(t=>taskVisible(t)&&t.boardId===board?.id);
  const onBoard=list.length;
  if(F==='mine') list=list.filter(taskMine);
  else if(F==='byme') list=list.filter(t=>t.from===m.id);
  else if(F==='over') list=list.filter(taskOverdue);
  if(can('tasksAll')&&S.ui.taskDept!=='all') list=list.filter(t=>tDept(t)===S.ui.taskDept);
  const seg=[['all',can('tasksAll')?'Все':'Мои и отдела'],['mine','Мне'],['byme','Поставил я'],['over','Просроченные']];
  let h='<div class="bar">';
  if(!edit){
    h+=`<div class="seg">${seg.map(([k,l])=>`<button class="${F===k?'on':''}" data-act="task-f" data-f="${k}">${l}</button>`).join('')}</div>`;
    if(can('tasksAll')) h+=`<select class="inp sm w-auto" id="task-dept" data-on="task-dept" aria-label="Отдел"><option value="all">Все отделы</option>${S.depts.map(d=>`<option value="${esc(d.id)}" ${S.ui.taskDept===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select>`;
  }
  if(boards.length>1||edit) h+=`<div class="seg" role="group" aria-label="Доска">${boards.map(b=>`<button class="${b.id===board?.id?'on':''}" data-act="task-board" data-id="${esc(b.id)}">${esc(b.name)}</button>`).join('')}</div>`;
  if(edit) h+=`<button class="btn sm" data-act="pipe-add" data-g="tasks">${ic('plus')}доска</button>`;
  h+='<span class="grow"></span>';
  if(can('settings')&&board) h+=`<button class="btn ${edit?'pri':''}" data-act="board-edit" aria-pressed="${edit}">${edit?ic('check')+'Готово':'Редактировать доску'}</button>`;
  if(!edit) h+=`<button class="btn pri" data-act="new-task">${ic('plus')}Поставить задачу</button>`;
  h+='</div>';
  if(edit) h+=pipeBoardHead(board);
  else h+=`<p class="hint">Перетаскивайте карточки между колонками или откройте задачу и смените статус. Тот, кто поставил задачу, получит уведомление. Задачу отдела видят все в отделе: нажмите «Взять», и она станет вашей.</p>`;
  if(!edit&&!list.length) h+=onBoard?emptyState('Под этот фильтр задач нет.','Показать все','task-f','data-f="all"'):emptyState('Задач нет. Поставьте первую — кнопка «Поставить задачу».','Поставить задачу','new-task');
  const colHead=st=>edit?pipeStageCtl(board,st,false):`<span>${esc(st.name)}</span>`;
  const colHtml=st=>{
    const c=list.filter(t=>t.stageId===st.id).sort((a,b)=>a.due-b.due);
    return `<div class="col ${edit?'col-edit':''}" ${edit?'':`data-col="${esc(st.id)}"`}><div class="col-h">${colHead(st)}<span class="cnt-s">${c.length}</span></div>${c.map(t=>tCard(t,edit)).join('')||'<p class="col-empty">Пусто</p>'}</div>`;
  };
  const addCol=edit?`<div class="col col-add"><button type="button" class="btn" data-act="pipe-stage-add" data-pipe="${esc(board.id)}">${ic('plus')}этап</button><p class="hint">Новый этап встанет перед завершающим: «${esc(cols[cols.length-1]?.name||'')}» останется последним.</p></div>`:'';
  h+=`<div class="xs" data-hscroll><div class="kanban" style="grid-template-columns:repeat(${cols.length+(edit?1:0)},minmax(250px,1fr))">${cols.map(colHtml).join('')}${addCol}</div></div>`;
  return h;
}
function tCard(t,edit){
  const over=taskOverdue(t),dept=t.to.t==='d';
  return `<article class="tcard ${isDone(t)?'done':''}" ${edit?'':`draggable="true" data-drag="${t.id}"`} data-act="open-task" data-id="${t.id}" tabindex="0"><div class="tc-top"><span class="tdot ${taskDot(t)}" aria-hidden="true"></span>${dept?'<span class="pill info sm">отделу</span>':''}${t.prio==='high'?'<span class="pill bad sm">Срочно</span>':''}${t.deal?`<span class="chip mono">${t.deal}</span>`:''}</div><p class="tc-t">${esc(t.title)}</p><div class="tc-m"><span class="who">${t.to.t==='p'?av(person(t.to.id),'xs'):`<span class="av xs">${ic('users')}</span>`}${esc(targetName(t))}</span><span class="due ${over?'bad':''}">${over?'просрочена · ':''}${fRel(t.due)}</span></div>${taskTakable(t)&&!edit?`<button type="button" class="btn sm tc-take" data-act="task-take" data-id="${t.id}">Взять</button>`:''}</article>`;
}
function dTask(t){
  const from=person(t.from),d=t.deal?deal(t.deal):null,over=taskOverdue(t),dept=t.to.t==='d';
  return {kind:'Задача',title:esc(t.title),sub:`Поставил(а): ${esc(from?.name||'')} · ${fWhen(t.at)}`,body:`
    <div class="seg wide">${stagesFor(t).map(st=>`<button class="${t.stageId===st.id?'on':''}" data-act="task-st" data-id="${t.id}" data-st="${esc(st.id)}">${esc(st.name)}</button>`).join('')}</div>
    ${taskTakable(t)?`<div class="tk-box"><p class="m0">Задача поставлена отделу. Нажмите «Взять» — вы станете исполнителем, у остальных в отделе она пропадёт из «Моих задач».</p><button type="button" class="btn pri" data-act="task-take" data-id="${t.id}">Взять задачу</button></div>`:''}
    <dl class="kv"><dt>Кому</dt><dd>${esc(targetName(t))}${dept?' <span class="pill info sm">отделу</span>':''}</dd>${t.took?`<dt>Взял(а)</dt><dd>${esc(person(t.to.id)?.name||'нет данных: сотрудник')} из отдела «${esc(deptName(t.took.dept))}», ${fWhen(t.took.at)}</dd>`:''}<dt>Срок</dt><dd class="${over?'bad-t':''}">${fD(t.due)}, ${WD[new Date(t.due).getDay()]}${over?' · просрочена':''}</dd><dt>Важность</dt><dd>${t.prio==='high'?'Срочно':'Обычная'}</dd>${d?`<dt>Сделка</dt><dd>${can('clients')?`<button class="link" data-act="open-deal" data-id="${d.id}">${d.id} · ${esc(d.client)}</button>`:d.id}</dd>`:''}</dl>
    ${t.desc?`<div><h4 class="sh">Подробности</h4><p class="prose">${esc(t.desc)}</p></div>`:''}`};
}

// «Взять»: первый взявший из отдела становится исполнителем. Задача уходит из «Моих задач» остальных,
// автору и отделу приходит уведомление (кто взял).
function taskTake(id){
  const t=S.tasks.find(x=>x.id===id),m=me();
  if(!t||!taskTakable(t)){toast('Эту задачу взять нельзя: она уже у кого-то или закрыта.','warn');return false}
  const dept=t.to.id,now=new Date();
  t.to={t:'p',id:m.id};t.took={dept,at:now};
  Notify.push(S,'task',m.id,`${m.name} взял(а) задачу «${t.title}» отдела «${deptName(dept)}».`,now,[t.from,...S.people.filter(p=>p.dept===dept).map(p=>p.id)]);
  render();toast(`Задача «${t.title}» теперь ваша. Автору и отделу ушло уведомление.`);
  return true;
}

SEARCH.push({kind:'task',label:'Задача',order:70,find:q=>S.tasks.filter(t=>taskVisible(t)&&searchHas(q,t.title)).map(t=>({title:t.title,sub:`${targetName(t)} · ${fRel(t.due)}`,open:`data-act="open-task" data-id="${esc(t.id)}"`}))});

// Раздел «Товары и остатки»: список всех позиций, карточка товара, резерв, журнал движений.
// Товары — Catalog (38-catalog.js), остатки и свободное — Stock.summary (33-stock.js): здесь только показ,
// ни одной своей формулы остатка. Подписи источников берутся из дат снимков (CATALOG, STOCK_SNAPSHOT).

// ——— общие подписи ———
const PAGE_SIZE=50;   // строк списка на странице: 434 строки сразу — это долгая отрисовка и длинная прокрутка
const MV_LIMIT=200;   // строк журнала на экране
const snapRu=s=>String(s).split('-').reverse().join('.');   // '2026-10-31' → '31.10.2026'
const noData=what=>`<span class="muted">нет данных: ${what}</span>`;
const priceNote=()=>`цена сайта, снимок ${snapRu(CATALOG.snapshot)}`;
const stockNote=()=>`таблица менеджеров, снимок ${snapRu(STOCK_SNAPSHOT.snapshot)}`;
const priceTxt=p=>p.price==null?noData('цена'):rub(p.price);
// В таблице менеджеров товара нет, резервов и поставок под него нет — остаток неизвестен, а не нулевой
const stockUnknown=k=>!k.known&&!(k.reservedStock+k.reservedIncoming)&&!k.incoming;
// Юрлицо и город в одну подпись; неизвестный id показывается как есть
const cellText=(e,c)=>`${Stock.entityName(S,e||Stock.ANY)??e} · ${Stock.cityName(S,c||Stock.ANY)??c}`;
const optionsHtml=(list,cur)=>list.map(([v,t])=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(t)}</option>`).join('');
const selField=(id,on,label,list,cur)=>`<div class="field"><label for="${id}">${label}</label><select id="${id}" class="inp" data-on="${on}">${optionsHtml(list,cur)}</select></div>`;

// ——— раздел: две вкладки, «Товары» и «Журнал движений» ———
function vStock(){
  const tab=S.ui.stockTab==='moves'?'moves':'goods';
  const tabs=`<div class="seg" role="tablist" aria-label="Раздел склада">${[['goods','Товары'],['moves','Журнал движений']].map(([k,l])=>`<button type="button" role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" data-act="stock-tab" data-tab="${k}">${l}</button>`).join('')}</div>`;
  return tab==='moves'?movesPane(tabs):goodsPane(tabs);
}

// ——— вкладка «Товары» ———
function goodsPane(tabs){
  const u=S.ui,cur=u.cat||'Все';
  const chips=['Все',...Catalog.cats(S)].map(c=>`<button type="button" class="fchip ${cur===c?'on':''}" data-act="stock-cat" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  const filters=[
    selField('f-brand','brand','Бренд',[['','Все бренды'],...Catalog.brands(S).map(b=>[b,b])],u.brand||''),
    selField('f-avail','avail','Наличие',[['','Любое наличие'],...[...new Set(S.products.map(p=>p.avail).filter(Boolean))].map(a=>[a,a])],u.avail||''),
    selField('f-catf','catf','Каталог',[['','В каталоге и нет'],['in','Только в каталоге'],['out','Только «нет в каталоге»']],u.catf||'')
  ].join('');
  return `<div class="bar">${tabs}<span class="grow"></span>${can('catalog')?`<button class="btn" data-act="new-product">${ic('plus')}Новый товар</button>`:''}</div>
  <div class="bar"><div class="search-in">${ic('search')}<input id="sq" class="inp" type="search" placeholder="Название, бренд или ключ каталога" value="${esc(u.sq)}" data-on="sq" aria-label="Поиск товара"></div>
  <label class="check"><input type="checkbox" id="deficit" data-on="deficit" ${u.deficit?'checked':''}> Только где не хватает</label></div>
  <div class="fgrid">${filters}</div>
  <div class="chips">${chips}</div>
  <section class="card clip"><div class="legend"><span><i class="lg f"></i>Свободно на складе</span><span><i class="lg r"></i>На складе в резерве</span><span><i class="lg w"></i>Едет к нам</span><span>«Свободно после прихода» = склад + в пути − все резервы</span></div><div id="stock-tbl">${stockTable()}</div></section>`;
}
function sbar(p,big){
  const k=stockOf(p.id),fn=Math.max(0,k.free),rs=Math.min(k.onHand,k.reservedStock),iq=k.incoming,tot=Math.max(1,fn+rs+iq),w=x=>(x/tot*100).toFixed(1)+'%';
  return `<div class="sbar ${big?'big':''}" title="Свободно ${num(fn)}, в резерве ${num(rs)}, в пути ${num(iq)}"><i class="f" style="width:${w(fn)}"></i><i class="r" style="width:${w(rs)}"></i><i class="w" style="width:${w(iq)}"></i></div>`;
}
// Позиции под поиском и фильтрами экрана (Catalog.query), затем «не хватает» — по Stock.summary
function stockRows(){
  const u=S.ui;
  const list=Catalog.query(S,{q:u.sq,cat:u.cat==='Все'?'':u.cat,brand:u.brand||'',avail:u.avail||'',inCatalog:u.catf==='in'?true:u.catf==='out'?false:undefined});
  // «не хватает»: с учётом поставок меньше нуля, либо остаток известен и свободного нет; без данных об остатке — не дефицит
  return u.deficit?list.filter(p=>{const k=stockOf(p.id);return k.freeAfter<0||(k.known&&k.free<=0)}):list;
}
function pagerHtml(page,pages){
  if(pages<2) return '';
  return `<div class="pager"><button type="button" class="btn sm" data-act="stock-page" data-page="${page-1}" ${page<1?'disabled':''}>← Назад</button><span class="muted sm">Страница <b>${page+1}</b> из <b>${pages}</b></span><button type="button" class="btn sm" data-act="stock-page" data-page="${page+1}" ${page>=pages-1?'disabled':''}>Вперёд →</button></div>`;
}
function stockRow(p,pr){
  const k=stockOf(p.id),ra=k.reservedStock+k.reservedIncoming,inc=Stock.incomingOf(S,p.id),fa=k.freeAfter,unk=stockUnknown(k),nd='<span class="muted">нет данных</span>';
  const key=p.inCatalog?`<span class="mono">${esc(p.id)}</span>`:'<span class="pill sun sm">нет в каталоге</span>';
  const meta=[p.brand,p.cat].filter(Boolean).map(esc).join(' · ');
  return `<tr class="click" data-act="open-product" data-pid="${esc(p.id)}" tabindex="0"><td><div class="pname"><span>${esc(p.name)}</span><small>${key}${meta?' · '+meta:''}</small></div></td><td class="num">${k.known?qtyOf(k.onHand,p):nd}</td><td class="num">${num(ra)}${k.reservedIncoming?`<small class="muted">${num(k.reservedIncoming)} под поставку</small>`:''}</td><td class="num free">${unk?nd:`<b class="${k.free<=0?'bad-t':''}">${num(k.free)}</b>`}</td><td>${k.incoming?`<span class="in-t">${qtyOf(k.incoming,p)}</span><small class="muted">ближайшая ${fD(k.nextEta)}${inc.length>1?` · ${inc.length} поставки`:''}</small>`:'<span class="muted">не ждём</span>'}</td><td class="num">${unk?nd:fa<0?`<span class="pill bad sm">не хватает ${num(-fa)}</span>`:num(fa)}</td>${pr?`<td class="num">${priceTxt(p)}</td>`:''}<td>${sbar(p)}</td></tr>`;
}
// Содержимое #stock-tbl: «показано N из M», страница таблицы, переключатель страниц
function stockTable(){
  const rows=stockRows(),all=S.products.length,pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));
  const page=Math.min(Math.max(0,parseInt(S.ui.page,10)||0),pages-1),from=page*PAGE_SIZE,part=rows.slice(from,from+PAGE_SIZE);
  const head=`<div class="count"><span>Показано <b>${rows.length}</b> из <b>${all}</b> позиций</span>${rows.length>PAGE_SIZE?`<span class="muted">строки ${from+1}–${from+part.length}</span>`:''}</div>`;
  if(!rows.length) return head+emptyState('Ничего не нашлось. Проверьте фильтр или строку поиска.','Сбросить фильтры','stock-reset');
  const pr=can('prices'),pg=pagerHtml(page,pages);
  return `${head}<div class="xs"><table class="tbl"><thead><tr><th>Товар</th><th class="num">На складе</th><th class="num">В резерве</th><th class="num">Свободно сейчас</th><th>Едет к нам</th><th class="num">Свободно после прихода</th>${pr?'<th class="num">Цена</th>':''}<th>Картина</th></tr></thead><tbody>${part.map(p=>stockRow(p,pr)).join('')}</tbody></table></div>${pg}`;
}
const refreshStock=()=>{S.ui.page=0;byId('stock-tbl').innerHTML=stockTable()};

// ——— журнал движений: слова и строки общие для вкладки и карточки товара ———
const moveSign=m=>m.kind===Stock.KINDS.receive?'+':(m.kind===Stock.KINDS.ship||m.kind===Stock.KINDS.damage)?'−':'';
const movePill=m=>`<span class="pill sm ${m.kind===Stock.KINDS.receive?'ok':m.kind===Stock.KINDS.ship?'info':m.kind===Stock.KINDS.damage?'bad':'sun'}">${esc(m.kind)}</span>`;
// Откуда и куда: клетка склада — «юрлицо · город»
function moveWhere(m){
  const K=Stock.KINDS,from=cellText(m.entityId,m.cityId);
  switch(m.kind){
    case K.receive: return `на склад: ${from}`;
    case K.ship: return `со склада: ${from}`;

// ——— «Списать при продаже» ———
// Из карточки товара (клетка или резерв) и из строки товара в сделке. o: {pid, e?, c? (клетка), rid? (резерв), did? (сделка)}.
// Всё решает Stock.sell: право sell, остаток клетки за вычетом чужих резервов, резерв; здесь — окно и подсказка.
// Откуда списывать: резерв (его клетка) или клетка «юрлицо × город» с остатком. Значение выбора: 'r:<резерв>' или 'c:<юрлицо>|<город>'.
function sellSources(o){
  const out=[],rs=S.reserves.filter(r=>r.productId===o.pid&&r.src==='stock'&&(o.rid?r.id===o.rid:!!o.did&&r.dealId===o.did));
  rs.forEach(r=>out.push(['r:'+r.id,`Резерв ${r.dealId||r.id}: ${num(r.qty)} · ${cellText(r.entityId,r.cityId)}`]));
  if(!o.rid){const g=Stock.grid(S,o.pid);g.rows.forEach(r=>g.cols.forEach(c=>{const n=g.cell(r.id,c.id);if(n>0) out.push(['c:'+r.id+'|'+c.id,`Из клетки ${r.name} · ${c.name}: лежит ${num(n)}`])}))}
  return out;
}
function sellArg(pid,v){
  const s=String(v||''),i=s.indexOf(':'),k=s.slice(0,i),x=s.slice(i+1);
  if(k==='r') return {productId:pid,reserveId:x};
  const [e,c]=x.split('|');
  return {productId:pid,entityId:e,cityId:c};
}
function sellMaxText(pid,v){
  const a=sellArg(pid,v),max=Stock.sellMax(S,a);
  if(a.reserveId) return `Можно списать: ${num(max)} — столько осталось в резерве.`;
  const have=Stock.grid(S,pid).cell(a.entityId||Stock.ANY,a.cityId||Stock.ANY)??0;
  return `Можно списать: ${num(max)}${have>max?` — ещё ${num(have-max)} в клетке занято резервами, их списывают по резерву`:''}.`;
}
MODALS.stockSell=o=>{

// Выбрали другую клетку или резерв в окне списания — подсказка «можно списать» пересчитывается
ON.change.sellsrc=t=>{const out=byId('ps-max');if(out) out.textContent=sellMaxText(t.dataset.pid,t.value)};
FORMS['stock-sell']=f=>{
  const pid=f.dataset.pid,now=new Date(),arg=sellArg(pid,byId('ps-src').value);
  // по резерву: лента его сделки помнит резерв (Deals.keepTrail) — даже когда списание снимет его целиком
  const rs=arg.reserveId?S.reserves.find(x=>x.id===arg.reserveId):null,did=f.dataset.did||(rs&&rs.dealId)||'';
  if(rs) Deals.keepTrail(S,rs);
  const r=Stock.sell(S,{...arg,qty:byId('ps-qty').value,doc:byId('ps-doc').value.trim()},S.me,now);
  if(!r.ok) return showErr('ps-err',r.reason);
  const p=product(pid),m=r.move,what=`${low(p.name)} — ${qtyOf(m.qty,p)} со склада ${cellText(m.entityId,m.cityId)}`;

  closeModal();render();
  toast(`Списано при продаже: ${what}. Запись в журнале есть.`);

A['stock-tab']=el=>{S.ui.stockTab=el.dataset.tab;render()};
A['stock-cat']=el=>{S.ui.cat=el.dataset.cat;S.ui.page=0;render()};
A['stock-page']=el=>{S.ui.page=parseInt(el.dataset.page,10)||0;byId('stock-tbl').innerHTML=stockTable();byId('scroll').scrollTop=0};
// Пустой список остатков: сбросить категорию, бренд, наличие, каталог, поиск и «только где не хватает»
A['stock-reset']=()=>{Object.assign(S.ui,{cat:'Все',sq:'',brand:'',avail:'',catf:'',deficit:false,page:0});render()};
// Из карточки товара — в журнал движений по этому товару
A['stock-journal']=el=>{S.ui.stockTab='moves';S.ui.mvPid=el.dataset.pid||'';S.ui.mvKind='';S.ui.drawer=null;go('stock')};

// Раздел «Поставки и перевозки»: таблица, воронка, шкала маршрута, позиции «3 + ещё N», карточка поставки.
// Считает ядро Ships (34-ships.js): поиск, фильтры, сортировка и страницы — Ships.query, «опоздала» — Ships.isLate,
// смена этапа — только Ships.setStage (через shipMark). Виды — функции state → HTML; состояние меняют A, ON, FORMS.
// Настройки вида — S.prefs.ship {view, cols, density, group, size}: сохраняются. Поиск, фильтры, сортировка,
// страница — S.ui.ships: не сохраняются.

// ——— настройки вида ———
// [ключ, подпись, ключ сортировки в Ships.query]
const SHIP_COLS=[
  ['number','Номер','number'],['supplier','Поставщик','supplier'],['stage','Этап','stage'],['where','Где сейчас',null],
  ['eta','Когда будет','eta'],['entity','Юрлицо и город',null],['items','Позиции','items'],['units','Штук','units'],
  ['carrier','Перевозчик',null],['depart','Отправлена','depart']
];
const SHIP_COLS_DEFAULT=['number','supplier','stage','where','eta','entity','items','units'];
const SHIP_GROUPS=[['','Без группировки'],['stage','По этапу'],['supplier','По поставщику'],['node','По точке'],['city','По городу']];
const SHIP_SIZES=[25,50,100];
const SHIP_VIEWS=[['table','Таблица'],['funnel','Воронка'],['map','Схема']];
const SHIP_ITEMS_SHOWN=3;

// Выбор вида с подстановкой умолчаний. Колонка «Номер» есть всегда.
function shipPrefs(){
  const p=(S.prefs&&S.prefs.ship)||{};
  const keys=SHIP_COLS.map(c=>c[0]);
  const cols=Array.isArray(p.cols)?keys.filter(k=>k==='number'||p.cols.includes(k)):SHIP_COLS_DEFAULT.slice();
  return {
    view:SHIP_VIEWS.some(v=>v[0]===p.view)?p.view:'table',
    cols,
    density:p.density==='dense'?'dense':'normal',
    group:SHIP_GROUPS.some(g=>g[0]===p.group)?p.group:'',
    size:SHIP_SIZES.includes(Number(p.size))?Number(p.size):SHIP_SIZES[0]
  };
}
function setShipPref(key,value){S.prefs.ship=Object.assign({},S.prefs.ship,{[key]:value})}

// Поиск, фильтры, сортировка, страница. stage 'open' — «не принятые»: Ships.query такого не знает, режем после него.
const SHIP_UI={q:'',stage:'open',supplier:'',node:'',city:'',entity:'',sort:'eta',page:1,settings:false};
const shipUi=()=>Object.assign({},SHIP_UI,S.ui.ships);
const setShipUi=patch=>{S.ui.ships=Object.assign(shipUi(),patch)};
const shipDir=()=>S.ui.logTab==='out'?'out':'in';
const shipNow=()=>new Date();
const SHIP_DAY=864e5;
const shipFold=x=>String(x??'').toLowerCase().replace(/ё/g,'е');

// Запрос к ядру: только фильтры, которые оно знает. Этап из чужой воронки (после смены «Едут / Отгрузки») не считается.
function shipFilter(u,dir){
  const pipe=shipPipe(dir);
  const stage=pipe&&pipe.stages.some(x=>x.id===u.stage)?u.stage:'';
  return {q:u.q,stage,supplier:u.supplier,node:u.node,city:u.city,entity:u.entity,dir,sort:u.sort};
}

// Группа строки: {key, label, order}; порядок групп — по order, равные — по подписи.
function shipGroupOf(s,mode){
  if(mode==='stage'){
    const st=(Pipes.of(S,'ships').find(p=>p.id===s.pipeId)||{stages:[]}).stages,i=st.findIndex(x=>x.id===s.stageId);
    return {key:'st:'+s.stageId,label:i<0?'нет данных: этап':st[i].name,order:i<0?999:i};
  }
  if(mode==='supplier') return {key:'su:'+s.supplier,label:s.supplier||'нет данных: поставщик',order:0};
  if(mode==='city') return {key:'ci:'+(s.cityId||''),label:s.cityId?(Stock.cityName(S,s.cityId)||s.cityId):'нет данных: город',order:s.cityId?0:999};
  const w=Ships.where(s);
  if(w.at) return {key:'no:'+w.at,label:Ships.nodeName(w.at),order:Math.max(0,Ships.NODES.findIndex(n=>n.id===w.at))};
  if(w.from) return {key:'no:'+w.from+'>'+w.to,label:`В пути ${Ships.nodeName(w.from)} → ${Ships.nodeName(w.to)}`,order:10+Math.max(0,Ships.NODES.findIndex(n=>n.id===w.from))};
  return {key:'no:',label:'нет данных: маршрут',order:999};
}

// Страница таблицы → {rows, total, page, pages, size, groups}. Без группировки и без «не принятых» — прямо Ships.query.
// Иначе берём у ядра все подходящие (оно же фильтрует и сортирует), режем и делим на страницы здесь.
function shipList(u,pr,dir){
  const f=shipFilter(u,dir),openOnly=u.stage==='open';
  if(!openOnly&&!pr.group) return Object.assign(Ships.query(S,Object.assign({},f,{page:u.page,size:pr.size})),{groups:null});
  let rows=Ships.query(S,Object.assign({},f,{page:1,size:1e9})).rows;
  if(openOnly) rows=rows.filter(s=>!isDone(s));
  let groups=null,keyOf=null;
  if(pr.group){
    groups=new Map();
    const g=new Map(rows.map(s=>[s,shipGroupOf(s,pr.group)]));
    rows.forEach(s=>{const x=g.get(s),e=groups.get(x.key);if(e) e.count++;else groups.set(x.key,{label:x.label,order:x.order,count:1})});
    rows=rows.slice().sort((a,b)=>{const x=g.get(a),y=g.get(b);return (x.order-y.order)||x.label.localeCompare(y.label,'ru',{numeric:true})||x.key.localeCompare(y.key)});
    keyOf=new Map(rows.map(s=>[s.id,g.get(s).key]));
  }
  const total=rows.length,size=pr.size,pages=Math.max(1,Math.ceil(total/size)),page=Math.min(Math.max(1,Math.floor(u.page)||1),pages);
  return {rows:rows.slice((page-1)*size,page*size),total,page,pages,size,groups,keyOf};
}

// ——— слова: когда будет, где сейчас ———
const shipDays=(s,now)=>Math.round((sod(s.eta)-sod(now))/SHIP_DAY);
function shipEtaText(s,now){
  if(isDone(s)){const L=s.history&&s.history[s.history.length-1];return s.received?'принято '+fD(s.received.at):'закрыто '+(L?fD(L.at):'нет данных: дата')}
  if(!s.eta) return 'нет данных: срок';
  const n=shipDays(s,now);
  return n>0?'через '+days(n):n===0?'сегодня':'опаздывает на '+days(-n);
}
const shipLate=(s,now)=>Ships.isLate(s,now,S);
// Где груз — словами; у отгрузки клиенту маршрута нет, берём последнюю отметку
function shipWhere(s){
  if(Array.isArray(s.route)&&s.route.length>=2) return Ships.where(s).text;
  const L=s.history&&s.history[s.history.length-1];
  return L?L.text:'нет данных: где груз';
}
const shipPlace=s=>{
  const e=Stock.entityName(S,s.entityId),c=s.cityId?Stock.cityName(S,s.cityId):null;
  return {entity:s.entityId?(e||s.entityId):'нет данных: юрлицо',city:s.cityId?(c||s.cityId):'нет данных: город'};
};

// ——— шкала маршрута ———
// Точки маршрута; пройденные отмечены, где груз сейчас — кольцо (в точке) или бегунок (на перегоне); под шкалой —
// где груз и сколько дней до прибытия (красным — опаздывает). full: с подписями точек (карточка), иначе компактная (строка).
function shipScale(s,now,full){
  if(!Array.isArray(s.route)||s.route.length<2) return `<span class="muted sm">${esc(shipWhere(s))}</span>`;
  const r=s.route,last=r.length-1,w=Ships.where(s);
  const i=Math.max(0,r.indexOf(w.at||w.from)),onLeg=!w.at,pct=Math.min(100,(i+(onLeg?w.t:0))/last*100);
  const late=shipLate(s,now),cap=shipEtaText(s,now);
  const dots=r.map((id,k)=>`<i class="rs-dot${k<=i?' on':''}${!onLeg&&k===i?' cur':''}" style="left:${k/last*100}%"></i>`).join('');
  const names=full?`<div class="rs-names">${r.map((id,k)=>`<span class="${k<=i?'on':''}" style="left:${k/last*100}%">${esc(Ships.nodeName(id))}</span>`).join('')}</div>`:'';
  const label=`Маршрут: ${Ships.routeText(r)}. Сейчас: ${w.text}. ${cap}.`;
  return `<div class="rs${full?' full':''}${late?' late':''}" role="img" aria-label="${esc(label)}"><div class="rs-line"><i class="rs-fill" style="width:${pct}%"></i>${dots}${onLeg?`<i class="rs-mark" style="left:${pct}%"></i>`:''}</div>${names}<div class="rs-cap"><span class="rs-w" title="${esc(w.text)}">${esc(full||w.at?w.text:Ships.nodeName(w.from)+' → '+Ships.nodeName(w.to)+' · '+Math.round(w.t*100)+'%')}</span><b class="${late?'bad-t':''}">${esc(cap)}</b></div></div>`;
}

// ——— позиции «3 + ещё N» ———
// Одна функция на строку таблицы и на карточку: первые три позиции и кнопка «+N» — окно со всем списком.
function shipItems(s){
  const its=s.items||[],first=its.slice(0,SHIP_ITEMS_SHOWN),more=its.length-first.length;
  if(!its.length) return '<span class="muted sm">нет данных: позиции</span>';
  const line=it=>{const p=product(it.productId);return `<div class="s-it"><span>${esc(p?p.name:'нет данных: товар')}</span> <b>× ${esc(qtyOf(it.qty,p))}</b></div>`};
  return `<div class="s-items"><div class="s-itl">${first.map(line).join('')}</div>${more>0?`<button type="button" class="s-more" data-act="ship-items" data-id="${esc(s.id)}" aria-label="Показать все ${its.length} ${pl(its.length,'позицию','позиции','позиций')}">+${more}</button>`:''}</div>`;
}
// Список для окна: подходящие под поиск по названию позиции и итог штук. Пустой поиск — всё.
function shipItemsList(s,q){
  const its=s.items||[],names=new Map(),want=shipFold(q).trim().split(/\s+/).filter(Boolean);
  its.forEach(it=>{const p=product(it.productId);names.set(it,p?p.name:'нет данных: товар')});
  const shown=its.filter(it=>want.every(w=>shipFold(names.get(it)).includes(w)));
  const sum=a=>a.reduce((x,it)=>x+(Number(it.qty)||0),0);
  const all=sum(its),part=sum(shown);
  const head=shown.length===its.length?`${its.length} ${pl(its.length,'позиция','позиции','позиций')} · штук ${num(all)}`:`Найдено ${shown.length} из ${its.length} · штук ${num(part)} из ${num(all)}`;
  const rows=shown.map(it=>{
    const p=product(it.productId);
    return `<tr><td class="num muted">${its.indexOf(it)+1}</td><td>${esc(names.get(it))}</td><td class="num"><b>${esc(qtyOf(it.qty,p))}</b>${it.got!==undefined&&it.got!==it.qty?`<small class="muted"> принято ${esc(qtyOf(it.got,p))}</small>`:''}</td></tr>`;
  }).join('');
  return `<p class="si-sum" id="si-sum">${head}</p>${shown.length?`<div class="si-scroll"><table class="tbl"><thead><tr><th class="num">№</th><th>Название</th><th class="num">Кол-во</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="empty">Ничего не нашлось.</p>'}`;
}
function mShipItems(s){
  if(!s) return `<div>${mHead('Позиции')}<div class="modal-b"><p class="empty">Поставки нет.</p></div></div>`;
  return `<div>${mHead('Позиции поставки '+esc(s.id))}<div class="modal-b si">
    <div class="field"><label for="si-q">Поиск по названию</label><input id="si-q" class="inp" type="search" data-on="ship-items-q" data-id="${esc(s.id)}" placeholder="Например: панель" autocomplete="off"></div>
    <div id="si-body">${shipItemsList(s,'')}</div>
  </div><div class="modal-f"><button type="button" class="btn" data-act="close-modal">Закрыть</button></div></div>`;
}

// ——— таблица ———
// Выпадающий список этапов: ручная смена (в строке и в карточке). На склад входящую ставит только приёмка.
function shipStageSelect(s,cls){
  const stg=stagesFor(s),locked=x=>s.dir==='in'&&x.flag==='final';
  return `<select class="${cls}" data-on="ship-stage" data-id="${esc(s.id)}" aria-label="Этап поставки ${esc(s.id)}">${stg.map(x=>`<option value="${esc(x.id)}" ${x.id===s.stageId?'selected':''} ${locked(x)?'disabled':''}>${esc(x.name)}${locked(x)?' — ставит склад':''}</option>`).join('')}</select>`;
}
function shipStageCell(s,now){
  if(can('logistics')&&!isDone(s)) return shipStageSelect(s,'inp sm s-stsel');
  const tone=isDone(s)?'ok':shipLate(s,now)?'bad':awaitsReceipt(s)?'sun':'info';
  return `<span class="pill ${tone}">${esc(stageName(s))}</span>`;
}
const SHIP_CELLS={
  number:s=>`<td><button type="button" class="link mono s-id" data-act="open-ship" data-id="${esc(s.id)}">${esc(s.id)}</button>${s.demo?'<small class="muted">демо</small>':''}</td>`,
  supplier:s=>`<td><span class="s-ell" title="${esc(s.supplier)}">${esc(s.supplier)}</span></td>`,
  stage:(s,now)=>`<td>${shipStageCell(s,now)}</td>`,
  where:(s,now)=>`<td class="s-where">${shipScale(s,now,false)}</td>`,
  eta:(s,now)=>`<td class="s-eta"><b>${s.eta?fD(s.eta):'нет данных'}</b>${shipLate(s,now)?'<small class="bad-t">опаздывает</small>':isDone(s)?`<small class="muted">${esc(shipEtaText(s,now))}</small>`:''}</td>`,
  entity:s=>{const p=shipPlace(s);return `<td><span class="s-ell" title="${esc(p.entity+' · '+p.city)}">${esc(p.entity)}<small class="muted">${esc(p.city)}</small></span></td>`},
  items:s=>`<td class="s-itc">${shipItems(s)}</td>`,
  units:s=>`<td class="num"><b>${num(Ships.units(s))}</b></td>`,
  carrier:s=>`<td><span class="s-ell" title="${esc(s.carrier)}">${esc(s.carrier)}</span></td>`,
  depart:s=>`<td>${s.depart?fD(s.depart):'<span class="muted sm">нет данных</span>'}</td>`
};
function shipRow(s,pr,now){
  return `<tr class="srow click${shipLate(s,now)?' is-late':''}${isDone(s)?' is-done':''}" data-ship="${esc(s.id)}" data-act="open-ship" data-id="${esc(s.id)}" tabindex="0">${pr.cols.map(k=>SHIP_CELLS[k](s,now)).join('')}</tr>`;
}
function shipHead(pr,u){
  const raw=u.sort,desc=raw.startsWith('-'),key=desc?raw.slice(1):raw;
  return `<tr>${pr.cols.map(k=>{
    const c=SHIP_COLS.find(x=>x[0]===k);
    if(!c[2]) return `<th class="${k==='where'?'s-where':''}">${c[1]}</th>`;
    const on=key===c[2];
    return `<th class="${k==='units'?'num':''}" aria-sort="${on?(desc?'descending':'ascending'):'none'}"><button type="button" class="s-sort${on?' on':''}" data-act="ship-sort" data-k="${c[2]}">${c[1]}<span aria-hidden="true">${on?(desc?' ▼':' ▲'):''}</span></button></th>`;
  }).join('')}</tr>`;
}
function shipPager(r){
  if(r.pages<2) return '';
  return `<div class="s-pager"><button type="button" class="btn sm" data-act="ship-page" data-p="${r.page-1}" ${r.page<2?'disabled':''}>← Назад</button><span class="muted sm">Страница ${r.page} из ${r.pages}</span><button type="button" class="btn sm" data-act="ship-page" data-p="${r.page+1}" ${r.page>=r.pages?'disabled':''}>Дальше →</button></div>`;
}
// Счётчик «Показано N из M»: N — строк на этой странице, M — всех подходящих под фильтры.
const shipCounter=(n,m)=>`<p class="s-count" id="ship-count">Показано ${n} из ${m}</p>`;
function shipTable(u,pr,dir,now){
  const r=shipList(u,pr,dir);
  let body='',cur=null;
  r.rows.forEach(s=>{
    if(r.groups){const k=r.keyOf.get(s.id);if(k!==cur){cur=k;const g=r.groups.get(k);body+=`<tr class="sgrp"><td colspan="${pr.cols.length}"><b>${esc(g.label)}</b> <span class="muted">· ${g.count}</span></td></tr>`}}
    body+=shipRow(s,pr,now);
  });
  const tbl=r.rows.length?`<section class="card clip"><div class="xs"><table class="tbl stbl ${pr.density}"><thead>${shipHead(pr,u)}</thead><tbody>${body}</tbody></table></div></section>`:`<section class="card">${emptyState('Под такие фильтры поставок нет. Поставку заводит логист кнопкой «Новая поставка».','Сбросить фильтры','ship-reset')}</section>`;
  return shipCounter(r.rows.length,r.total)+tbl+shipPager(r);
}

// ——— воронка ———
function shipCardMini(s,now){
  const late=shipLate(s,now),drag=can('logistics')&&!isDone(s);
  return `<article class="scard${late?' is-late':''}${isDone(s)?' is-done':''}" ${drag?`draggable="true" data-drag="${esc(s.id)}"`:''}>
    <div class="sc-h"><button type="button" class="link mono" data-act="open-ship" data-id="${esc(s.id)}">${esc(s.id)}</button>${late?'<span class="pill bad sm">опаздывает</span>':''}</div>
    <div class="sc-s" title="${esc(s.supplier)}">${esc(s.supplier)}</div>
    <div class="sc-m"><span><b>${num(Ships.units(s))}</b> шт.</span><span class="${late?'bad-t':''}">${s.eta?fD(s.eta):'нет данных'} · ${esc(shipEtaText(s,now))}</span></div></article>`;
}
function shipFunnel(u,pr,dir,now){
  const pipe=shipPipe(dir);
  if(!pipe) return '<section class="card"><p class="empty">нет данных: воронка поставок.</p></section>';
  const f=Object.assign(shipFilter(u,dir),{stage:'',sort:'eta',page:1,size:1e9});
  const rows=Ships.query(S,f).rows;
  const cols=pipe.stages.map(st=>{
    const list=rows.filter(s=>s.stageId===st.id),un=list.reduce((x,s)=>x+Ships.units(s),0);
    return `<section class="col scol" data-scol="${esc(st.id)}" aria-label="${esc(st.name)}"><div class="col-h"><span>${esc(st.name)}</span><span class="cnt-s">${list.length} · ${num(un)} шт.</span></div><div class="scol-b">${list.map(s=>shipCardMini(s,now)).join('')||'<p class="col-empty">Пусто</p>'}</div></section>`;
  }).join('');
  return `${shipCounter(rows.length,rows.length)}${can('logistics')?'<p class="hint">Перетащите карточку в другую колонку — этап сменится, сотрудникам придёт уведомление. На склад входящую поставку ставит приёмка.</p>':''}<div class="xs" data-hscroll><div class="sfun" style="--n:${pipe.stages.length}">${cols}</div></div>`;
}

// ——— схема маршрута ———
// Встроенная схема без внешних карт: условные контуры Китая и России, пять точек Ships.NODES, перегоны.
// Числа — только Ships.mapCounts, те же поставки, что покажет таблица после нажатия. Нажатие на точку, на «на таможне»
// или на перегон включает фильтр таблицы и переключает вид на «Таблицу». Грузы бегут по перегонам, где есть поставки.
// Где подпись точки относительно самой точки: bl — снизу слева, tl — сверху слева, r — справа, tr / br — справа сверху / снизу.
const SMAP_PLACE={cn:'bl',chita:'tl',irk:'r',msk:'tr',krd:'br'};
// Где на перегоне стоит число (доля пути): у сходящихся линий разные, чтобы числа не наползали друг на друга
const SMAP_LEG_AT={'cn>chita':.5,'chita>irk':.5,'chita>msk':.45,'chita>krd':.45,'irk>msk':.75,'irk>krd':.75,'msk>krd':.2};
// Контуры условные, не по масштабу: Китай слева, Россия справа (чтобы груз шёл слева направо, как в Ships.NODES)
const SMAP_CN='M0,24 C5,18 12,20 16,26 C20,30 24,34 23,42 C22,48 25,52 24,58 C23,66 18,72 14,78 C10,84 5,88 0,90 Z';
const SMAP_RU='M27,12 C34,6 46,8 56,6 C68,4 80,6 92,4 L100,5 L100,95 L90,96 C80,94 72,90 62,92 C52,94 46,86 42,78 C38,72 30,70 28,62 C26,56 28,52 27,46 C25,40 28,36 26,30 C24,22 25,16 27,12 Z';
const smapPct=v=>Math.round(v*100)/100+'%';
const smapShips=n=>`${n} ${pl(n,'поставка','поставки','поставок')}`;
// Какие поставки на схеме: те же поиск, поставщик, город и юрлицо, что в панели над таблицей (этап и точку схема считает сама)
const smapFilter=u=>({q:u.q,supplier:u.supplier,city:u.city,entity:u.entity});
const smapOrder=key=>key.split('>').map(id=>Math.max(0,Ships.NODES.findIndex(n=>n.id===id)));
function smapLegName(key){const [a,b]=key.split('>');return Ships.nodeName(a)+' → '+Ships.nodeName(b)}
// Подпись точки: роль («основной город-приёмщик») и то, что там делают («таможня и перевалка») — из Ships.NODES.label
function smapLabel(n){
  const parts=String(n.label||'').split(' · '),key=parts.length>1?parts[parts.length-1]:'',role=parts.length>1?parts.slice(0,-1).join(' · '):parts[0];
  return `<span class="sm-lbl">${role?`<span class="sm-role">${esc(role)}</span>`:''}${role&&key?'<span class="sm-sep"> · </span>':''}${key?`<span class="sm-key">${esc(key)}</span>`:''}</span>`;
}
// Число поставок и штук: видимый текст и атрибуты берут одно и то же
const smapCnt=c=>`<span class="sm-cnt"><span><b>${num(c.ships)}</b> ${pl(c.ships,'поставка','поставки','поставок')}</span><span><b>${num(c.units)}</b> шт</span></span>`;
function shipMap(u,dir){
  if(dir==='out') return '<section class="card"><p class="empty">Схема показывает поставки, которые едут к нам: у отгрузок клиентам маршрута из пяти точек нет. Переключитесь на «Едут к нам».</p></section>';
  const c=Ships.mapCounts(S,smapFilter(u)),N=Ships.NODES;
  const at=id=>N.find(n=>n.id===id),legKeys=Object.keys(c.legs).sort((a,b)=>{const x=smapOrder(a),y=smapOrder(b);return (x[0]-y[0])||(x[1]-y[1])});
  const totShips=N.reduce((s,n)=>s+c.nodes[n.id].ships,0)+legKeys.reduce((s,k)=>s+c.legs[k].ships,0);
  const totUnits=N.reduce((s,n)=>s+c.nodes[n.id].units,0)+legKeys.reduce((s,k)=>s+c.legs[k].units,0);
  const line=k=>{const [a,b]=k.split('>').map(at);return `<line class="sm-line${c.legs[k].ships?' on':''}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" vector-effect="non-scaling-stroke"/>`};
  const dots=legKeys.filter(k=>c.legs[k].ships>0).map(k=>{
    const [a,b]=k.split('>').map(at),n=Math.min(4,Math.ceil(c.legs[k].ships/5)),dur=Math.round((4+Math.hypot(b.x-a.x,b.y-a.y)/12)*10)/10;
    return Array.from({length:n},(_,i)=>`<i class="sm-dot" style="--x1:${smapPct(a.x)};--y1:${smapPct(a.y)};--x2:${smapPct(b.x)};--y2:${smapPct(b.y)};--xm:${smapPct(a.x+(b.x-a.x)*(i+1)/(n+1))};--ym:${smapPct(a.y+(b.y-a.y)*(i+1)/(n+1))};--dur:${dur}s;--dl:-${Math.round(dur*i/n*10)/10}s"></i>`).join('');
  }).join('');
  const legBtn=k=>{
    const [a,b]=k.split('>').map(at),t=SMAP_LEG_AT[k]??.5,g=c.legs[k];
    return `<button type="button" class="sm-leg${g.ships?' on':''}" style="left:${smapPct(a.x+(b.x-a.x)*t)};top:${smapPct(a.y+(b.y-a.y)*t)}" data-act="ship-map" data-k="${esc(k)}" data-leg="${esc(k)}" data-ships="${g.ships}" data-units="${g.units}" aria-label="Перегон ${esc(smapLegName(k))}: ${smapShips(g.ships)}, ${num(g.units)} шт. Показать в таблице"><b>${num(g.ships)}</b>${g.ships?`<span class="sm-u">· ${num(g.units)} шт</span>`:''}</button>`;
  };
  const nodeBox=n=>{
    const g=c.nodes[n.id],cu=g.customs,place=SMAP_PLACE[n.id]||'r';
    const chip=`<button type="button" class="sm-chip${g.ships?' has':''}" data-act="ship-map" data-k="${esc(n.id)}" data-node="${esc(n.id)}" data-ships="${g.ships}" data-units="${g.units}" aria-label="${esc(n.name)}, ${esc(n.label)}: ${smapShips(g.ships)}, ${num(g.units)} шт. Показать в таблице"><span class="sm-nm">${esc(n.name)}</span>${smapLabel(n)}${smapCnt(g)}</button>`;
    const cust=cu?`<button type="button" class="sm-cust${cu.ships?' has':''}" data-act="ship-map" data-k="${esc(n.id)}" data-stage="customs" data-customs-ships="${cu.ships}" data-customs-units="${cu.units}" aria-label="${esc(n.name)}, на таможне: ${smapShips(cu.ships)}, ${num(cu.units)} шт. Показать в таблице">на таможне: <b>${num(cu.ships)}</b><span class="sm-u">· <b>${num(cu.units)}</b> шт</span></button>`:'';
    return `<i class="sm-pt${g.ships?' has':''}" style="left:${smapPct(n.x)};top:${smapPct(n.y)}" aria-hidden="true"></i><div class="sm-node ${place}" style="--x:${smapPct(n.x)};--y:${smapPct(n.y)}">${chip}${cust}</div>`;
  };
  const rows=legKeys.map(k=>{const g=c.legs[k];return `<li><button type="button" class="link" data-act="ship-map" data-k="${esc(k)}" data-row-leg="${esc(k)}">${esc(smapLegName(k))}</button><span class="${g.ships?'':'muted'}">${g.ships?`${smapShips(g.ships)} · ${num(g.units)} шт`:'сейчас на перегоне никого'}</span></li>`}).join('');
  return `<p class="s-count" id="ship-count">На схеме ${smapShips(totShips)}, ${num(totUnits)} шт. Нажмите на точку или перегон — таблица покажет эти поставки.</p>
    <section class="card"><div class="smap" role="group" aria-label="Схема маршрута: ${esc(N.map(n=>n.name).join(', '))}">
      <svg class="smap-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path class="sm-land cn" d="${SMAP_CN}"/><path class="sm-land ru" d="${SMAP_RU}"/>${legKeys.map(line).join('')}</svg>
      <span class="sm-country cn" aria-hidden="true">Китай</span><span class="sm-country ru" aria-hidden="true">Россия</span>
      <div class="sm-dots" aria-hidden="true">${dots}</div>
      ${legKeys.map(legBtn).join('')}${N.map(nodeBox).join('')}
    </div><p class="hint sm-note">Схема условная: контуры и расстояния не по масштабу. Бегущие точки — грузы в пути. Числа — не принятые поставки, в точке или на перегоне; поставки из демо-набора.</p></section>
    <section class="card"><div class="card-h"><h3>Перегоны</h3></div><ul class="sm-list">${rows||'<li class="muted">Поставок с маршрутом нет.</li>'}</ul></section>`;
}

// ——— верх раздела: переключатели, фильтры, настройка вида ———
function shipFilterBar(u,pr,dir){
  const pipe=shipPipe(dir);
  const sups=[...new Set(S.shipments.filter(s=>(s.dir||'in')===dir).map(s=>s.supplier).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}));
  const legs=Object.keys(Ships.mapCounts(S,{}).legs);

  const sel=(k,label,opts)=>`<div class="field"><label for="sf-${k}">${label}</label><select id="sf-${k}" class="inp sm" data-on="ship-f" data-k="${k}">${opts}</select></div>`;
  const stageSel=pr.view!=='table'?'':sel('stage','Этап',opt('open',dir==='out'?'Не закрытые':'Не принятые',u.stage)+opt('','Все этапы',u.stage)+(pipe?pipe.stages.map(x=>opt(x.id,x.name,u.stage)).join(''):''));
  const nodeOpts=opt('','Везде',u.node)+Ships.NODES.map(n=>opt(n.id,n.name,u.node)).join('')+legs.map(k=>{const [a,b]=k.split('>');return opt(k,`В пути ${Ships.nodeName(a)} → ${Ships.nodeName(b)}`,u.node)}).join('');

    ${stageSel}
    ${sel('supplier','Поставщик',opt('','Все',u.supplier)+sups.map(x=>opt(x,x,u.supplier)).join(''))}
    ${sel('node','Точка',nodeOpts)}
    ${sel('city','Город',opt('','Все',u.city)+S.cities.map(c=>opt(c.id,c.name,u.city)).join(''))}
    ${sel('entity','Юрлицо',opt('','Все',u.entity)+S.entities.map(e=>opt(e.id,e.name,u.entity)).join(''))}
    ${dirty?`<button type="button" class="btn sm ghost" data-act="ship-reset">Сбросить</button>`:''}
  </div></section>`;
}
function shipSettings(pr,u){

  return `<section class="card sset"><div class="card-h"><h3>Настройка вида</h3><span class="hint">Запоминается: при следующем заходе вид будет таким же.</span></div><div class="card-b ss-grid">

    <div class="ss-f"><span class="lbl">Плотность строк</span><div class="seg" role="group" aria-label="Плотность строк">${[['normal','Обычная'],['dense','Плотная']].map(([k,l])=>`<button type="button" class="${pr.density===k?'on':''}" aria-pressed="${pr.density===k}" data-act="ship-density" data-d="${k}">${l}</button>`).join('')}</div></div>

// Содержимое под фильтрами: таблица или воронка. Его же перерисовывает поиск, чтобы не терять курсор в поле.

// ——— смена этапа: единственный путь ———
// Ручная отметка из строки, карточки, воронки и формы. Этап пишет только Ships.setStage (история с источником
// «вручную», уведомление всем, у кого включён вид «Поставки»); здесь — права, закрытые поставки и сообщение клиенту.
function shipMark(shipId,stageId){
  const s=ship(shipId),m=me(),now=new Date();
  if(!s) return {ok:false,reason:'Поставки нет.'};
  const fail=(msg,quiet)=>{if(!quiet) toast(msg,'warn');return {ok:false,reason:msg}};
  if(!can('logistics')) return fail('Этапы перевозки отмечает логист.');
  const stg=Pipes.stage(S,s.pipeId,stageId);
  if(!stg) return fail('Такого этапа в воронке нет.');
  if(s.stageId===stageId) return fail('Поставка уже на этом этапе.',true);
  if(isDone(s)) return fail('Поставка уже закрыта: этап не меняется.');
  if(s.dir==='in'&&stg.flag==='final') return fail('На склад входящую поставку ставит приёмка: она кладёт товар на юрлицо и город.');
  const wasOut=s.dir==='out'&&leftStart(s);
  const r=Ships.setStage(S,s.id,stageId,m.id,now,Ships.SRC.manual);
  if(!r.ok) return fail(r.reason);
  // отгрузка клиенту ушла со склада — автосообщение клиенту, как в v2
  if(s.dir==='out'&&!wasOut&&leftStart(s)&&rule('shipped')?.on&&s.deal){
    const d=deal(s.deal);
    if(d&&d.channel!=='phone') S.msgs.push({id:Store.freeId(S.msgs,'m'),at:now,deal:d.id,channel:d.channel,auto:true,text:`${d.contact}, здравствуйте! Ваш заказ отгружен: ${s.track}. Привезём ${fD(s.eta)}. Ваш менеджер — ${person(d.managerId)?.name||''}.`});
  }
  const got=r.note?r.note.to.filter(id=>id!==m.id).length:0;
  render();
  toast(`${s.id}: «${stg.name}». Уведомление получили ${got} ${pl(got,'сотрудник','сотрудника','сотрудников')}.`);
  return r;
}
// Форма «Отметить этап»: этап — через shipMark, срок и комментарий — отдельными отметками в историю.
function shipStageForm(f){
  const s=ship(f.dataset.id),m=me(),now=new Date();
  if(!s){closeModal();return}
  const stageId=byId('st-stage').value,eta=byId('st-eta').value,note=byId('st-note').value.trim();
  const ne=eta?fromIso(eta,s.eta?s.eta.getHours()||12:12):s.eta,old=s.eta,moved=!!old&&!!ne&&dd(ne)!==dd(old);
  const termNote=()=>s.history.push({at:now,by:m.id,text:`Срок прихода: было ${fD(old)}, стало ${fD(ne)}.`,source:Ships.SRC.manual});
  if(stageId!==s.stageId){
    if(moved) s.eta=ne;               // срок ставим до отметки: в уведомлении уже новая дата
    const r=shipMark(s.id,stageId);
    if(!r.ok){s.eta=old;return}
    if(moved) termNote();
  }else if(moved){
    s.eta=ne;termNote();
    Notify.push(S,'ship',m.id,`${s.id}: срок прихода — ${fD(ne)} (было ${fD(old)}). Сейчас: ${shipWhere(s)}.`,now);
  }
  if(note) s.history.push({at:now,by:m.id,text:'Комментарий: '+note,source:Ships.SRC.manual});
  closeModal();render();
}
// Форма «Новая поставка»: маршрут Китай → Чита → город назначения, положение и этап — через ядро.
function shipCreate(f){
  const from=byId('ns-from').value.trim(),m=me(),now=new Date(),items=[],pipe=shipPipe('in');
  f.querySelectorAll('.irow').forEach(r=>{const sku=r.querySelector('select').value,q=parseInt(r.querySelector('input').value,10)||0;if(q<1) return;const e=items.find(i=>i.productId===sku);if(e) e.qty+=q;else items.push({productId:sku,qty:q})});
  if(!from||!items.length) return showErr('ns-err','Укажите, откуда едет груз, и хотя бы одну позицию с количеством.');
  const city=byId('ns-city').value,route=['cn','chita',city];
  const id='П-'+(Math.max(0,...S.shipments.filter(s=>s.dir==='in').map(s=>parseInt(s.id.replace(/\D/g,''),10)||0))+1);
  const eta=byId('ns-eta').value?fromIso(byId('ns-eta').value):day(7,12);
  const start=startStage(pipe.id),wanted=Pipes.stage(S,pipe.id,byId('ns-stage').value);
  const s={id,number:id,dir:'in',supplier:from,to:'Наш склад',carrier:byId('ns-car').value,track:byId('ns-doc').value.trim()||'нет данных: номер накладной',
    entityId:byId('ns-ent').value,cityId:city,route,pos:{i:0,t:0},eta,pipeId:pipe.id,stageId:start.id,
    items,history:[{at:now,by:m.id,text:`Поставка создана. Маршрут: ${Ships.routeText(route)}.`,source:Ships.SRC.manual}]};
  S.shipments.push(s);
  // сразу на нужный этап — тоже через ядро: оно расставит груз на маршруте, запишет историю и разошлёт уведомление
  if(wanted&&wanted.id!==start.id) Ships.setStage(S,id,wanted.id,m.id,now,Ships.SRC.manual);
  else Notify.push(S,'ship',m.id,`Новая поставка ${id} из «${from}»: ${Ships.brief(S,s)}. Маршрут: ${Ships.routeText(route)}. На складе ожидается ${fD(eta)}.`,now);
  closeModal();S.ui.logTab='in';render();toast(`Поставка ${id} создана. Менеджеры уже видят её в остатках как «едет к нам».`);
}

// ——— имитация: статус от перевозчика ———
// Перевозчик (настоящего трека пока нет) сообщает, что груз сдвинулся: один шаг по маршруту через Ships.advance с
// источником «автоматически: перевозчик». Правила директора, которые этот шаг запускает, видны в истории поставки.
// Можно ли двигать: едет к нам, есть маршрут, ещё в пути (не ждёт приёмки, не принята), есть следующий шаг в плане.
function shipCarrierCan(s){
  if(!s||s.dir!=='in'||s.received||isDone(s)||awaitsReceipt(s)||!Array.isArray(s.route)||s.route.length<2) return false;
  if(s.stageId===Ships.ST.ordered) return false;

// Одна поставка в пути: с самым ранним ожидаемым приходом (то, что уже опаздывает, — первым)
const shipCarrierPick=()=>S.shipments.filter(shipCarrierCan).sort((a,b)=>(a.eta?a.eta.getTime():Infinity)-(b.eta?b.eta.getTime():Infinity)||String(a.id).localeCompare(String(b.id),'ru',{numeric:true}))[0]||null;
function shipCarrier(shipId){
  const s=shipId?ship(shipId):shipCarrierPick(),now=new Date();
  if(!s){toast('Нет поставки в пути, которую можно сдвинуть.','warn');return {ok:false,reason:'Нет поставки в пути.'}}
  const r=Ships.advance(S,s.id,null,now,Ships.SRC.carrier);

  toast(`Перевозчик сообщил по ${s.id}: «${r.to.name}». Сейчас: ${Ships.where(s).text}. Уведомление получили ${got} ${pl(got,'сотрудник','сотрудника','сотрудников')}.${rules?` Сработало ${rules} ${pl(rules,'правило','правила','правил')} директора.`:''}`);

// Имитация «груз прибыл»: поверх того же выбора поставки (shipCarrierPick) — перевозчик сообщает, что груз приехал в город
// назначения; поставка встаёт на этап с флагом «прибыло» через Ships.setStage и ждёт приёмки.
function shipArrive(){
  const s=shipCarrierPick(),now=new Date();

  const stage=stagesFor(s).find(x=>x.flag==='arrived');
  if(!stage){toast('В воронке поставок нет этапа «прибыло».','warn');return {ok:false,reason:'В воронке поставок нет этапа «прибыло».'}}

  render();

// Раздел «Приёмка на складе»
// Перенесено из прототипа v2. Что ждёт приёмки — Ships.awaitingReceipt (флаг arrived), единственное «ждёт приёмки»;
// кому уведомления — Notify; этап ставит только ядро (Ships.setStage, Ships.applyRules); товар кладёт Stock.move.
// Предпросмотр и подтверждение считают по одному плану rcvPlan(): справа на экране то же самое, что сделает receiveShip.

// ——— приёмка ———
// Юрлицо и город склада по умолчанию — те, что записаны в поставке; нет данных — кладовщик выбирает сам
const newRcv=id=>{const s=ship(id);return {shipId:id,qty:Object.fromEntries(s.items.map(i=>[i.productId,i.qty])),dmg:{},note:'',photos:[],entityId:s.entityId||'',cityId:s.cityId||'',done:null}};
function initRcv(id){S.rcv=newRcv(id)}
const pendingRcv=()=>Ships.awaitingReceipt(S).sort((a,b)=>(a.eta?a.eta.getTime():Infinity)-(b.eta?b.eta.getTime():Infinity));
// Куда ляжет товар: выбранные юрлицо и город (у черновика из старого сохранения их нет — берём из поставки)
function rcvCell(r=S.rcv){
  const s=ship(r.shipId)||{},entityId=r.entityId!==undefined?r.entityId:(s.entityId||''),cityId=r.cityId!==undefined?r.cityId:(s.cityId||'');
  const en=entityId?Stock.entityName(S,entityId):null,cn=cityId?Stock.cityName(S,cityId):null;
  return {entityId,cityId,entityName:en||'нет данных: юрлицо',cityName:cn||'нет данных: город',ok:!!en&&!!cn};
}
// Текущая приёмка: начатая или первая из ждущих (без записи в S — вид не меняет состояние)
function curRcv(){
  if(S.rcv&&S.rcv.done) return S.rcv;
  const pend=pendingRcv();
  if(S.rcv&&pend.some(s=>s.id===S.rcv.shipId)) return S.rcv;
  return pend.length?newRcv(pend[0].id):null;
}
// Перед отрисовкой раздела: начатая приёмка или первая из ждущих становится текущей
function syncRcv(){const r=curRcv();if(r!==S.rcv) S.rcv=r}
const qv=(pid,r=S.rcv)=>Math.max(0,parseInt(r.qty[pid],10)||0);
function diffHtml(it,r=S.rcv){const d=qv(it.productId,r)-it.qty;return d<0?`<span class="pill bad sm">недостача ${num(-d)}</span>`:d>0?`<span class="pill warn sm">излишек ${num(d)}</span>`:'<span class="pill ok sm">сходится</span>'}
// План приёмки — один на предпросмотр и подтверждение: что ляжет на склад и куда, на какой этап встанет поставка,
// расхождения, сделки-ждуны и что с каждой, кому уведомления. receiveShip делает ровно это и ничего сверх.
function rcvPlan(r=S.rcv){
  const s=ship(r.shipId),auto=rule('arrive').on,issues=[],dmg=[];
  s.items.forEach(it=>{
    const p=product(it.productId),q=qv(it.productId,r);
    if(q<it.qty) issues.push(`${p.name}: принято ${num(q)} из ${qtyOf(it.qty,p)}`);
    else if(q>it.qty) issues.push(`${p.name}: принято ${num(q)} вместо ${qtyOf(it.qty,p)}`);
    if(r.dmg[it.productId]) dmg.push(p.name);
  });
  const cell=rcvCell(r),fin=finalStage(s);
  // что ляжет на склад: принятое по каждой позиции, в порядке позиций поставки (ноль — ничего не кладём)
  const adds=s.items.map(it=>({productId:it.productId,qty:qv(it.productId,r)}));
  // правила «принято на складе»: поставка к тому времени уже на этапе «на складе», срабатывают те, что ставят другой этап
  const rules=(S.shipRules||[]).filter(x=>x.on===true&&x.when==='received'&&fin&&x.then!==fin.id&&Pipes.stage(S,s.pipeId,x.then));
  // резервы «из поставки» становятся резервами со склада, но не больше принятого: принятое делится между резервами по порядку
  // постановки (раньше поставлен — раньше получает); кому не хватило — резерв уменьшается или снимается (cuts)
  const all=S.reserves.filter(x=>x.src===s.id),cuts=[],res=[],rest={};
  all.forEach(x=>{
    if(!(x.productId in rest)) rest[x.productId]=qv(x.productId,r);
    const keep=Math.min(x.qty,rest[x.productId]);rest[x.productId]-=keep;
    if(keep>0) res.push(x);
    if(keep<x.qty) cuts.push({r:x,keep,drop:x.qty-keep,d:deal(x.dealId)});
  });
  // как сообщить клиенту: телефон → задача менеджеру; иначе авто-сообщение, если правило включено; иначе напоминание
  const waits=[...byDeal(res)].map(([did,list])=>{const d=deal(did);return {d,list,items:itemsText(list.map(x=>{const c=cuts.find(k=>k.r===x);return c?{...x,qty:c.keep}:x})),how:d.channel==='phone'?'call':auto?'auto':'remind'}});
  const ids=new Set([...Notify.recipients(S,'arrive'),...waits.flatMap(w=>Notify.recipients(S,'msg',[w.d.managerId])),...(issues.length||dmg.length?Notify.recipients(S,'warn'):[]),...(rules.length?Notify.recipients(S,'ship'):[]),...cuts.flatMap(c=>Notify.recipients(S,'reserve',c.d&&c.d.managerId?[c.d.managerId]:[]))]);
  const block=!fin?'В воронке поставок нет этапа «на складе» (с флагом «закрыто»): приёмке некуда перевести поставку.':!cell.ok?'Выберите юрлицо и город, куда класть товар.':'';
  return {s,issues,dmg,res,cuts,waits,warnTo:Notify.recipients(S,'warn'),to:[...ids],adds,cell,final:fin,rules,block};
}
// Почему снят резерв при приёмке — одна фраза для ленты сделки, уведомления и предпросмотра
const rcvCutWhy=(s,c)=>`При приёмке ${s.id} принято меньше, чем ждали: на склад перешло ${num(c.keep)} из ${num(c.r.qty)}.`;

// Принять поставку S.rcv по плану rcvPlan: товар ложится на выбранные юрлицо и город (Stock.move, запись в журнал),
// резервы «из поставки» становятся резервами со склада, поставка встаёт на этап «на складе» через ядро
// (Ships.setStage с пометкой «автоматически: приёмка» и Ships.applyRules на «принято на складе»), уведомления — Notify,
// клиентам — сообщение в канал сделки (имитация) или задача менеджеру позвонить.
// → итог приёмки (он же S.rcv.done) или {ok:false, reason}, если принять нельзя; тогда ничего не меняется.
function receiveShip(by,now){
  const r=S.rcv,P=rcvPlan(r),s=P.s,who=person(by);
  if(P.block) return {ok:false,reason:P.block};
  const stock=[];
  s.items.forEach((it,i)=>{
    const q=P.adds[i].qty;
    it.got=q;
    // приход: остаток растёт в клетке «юрлицо × город», запись попадает в журнал движений
    if(q&&Stock.move(S,{kind:Stock.KINDS.receive,productId:it.productId,qty:q,entityId:P.cell.entityId,cityId:P.cell.cityId,doc:s.id,by,at:now}).ok) stock.push({productId:it.productId,qty:q});
  });
  s.entityId=P.cell.entityId;s.cityId=P.cell.cityId;
  // излишек резерва над принятым снимается: «Снят резерв» в журнале, запись в ленте сделки и уведомление её менеджеру
  P.cuts.forEach(c=>{Deals.noteRelease(S,c.r,c.drop,rcvCutWhy(s,c),by,now)});
  [...P.res,...P.cuts.map(c=>c.r)].forEach(x=>{x.src='stock';x.entityId=P.cell.entityId;x.cityId=P.cell.cityId});
  P.cuts.forEach(c=>Stock.release(S,c.r.id,c.drop,by,now));
  // этап и положение груза — только через ядро; правила директора на «принято на складе» — после этапа
  const before=S.notes.length;
  Ships.setStage(S,s.id,P.final.id,by,now,Ships.SRC.receipt);
  s.history.push({at:now,by,text:`Принято на склад: ${P.cell.entityName}, ${P.cell.cityName}. Фото: ${r.photos.length}.${r.note.trim()?' Комментарий: '+r.note.trim():''}`,source:Ships.SRC.receipt,auto:true});
  const fired=Ships.applyRules(S,'received',s.id,by,now);
  s.received={at:now,by,photos:r.photos.length,urls:r.photos.slice(),note:r.note.trim()};
  const notes=S.notes.slice(0,S.notes.length-before),msgIds=[],taskIds=[];
  notes.push(Notify.push(S,'arrive',by,`${s.id} принята на склад (${P.cell.entityName}, ${P.cell.cityName}): ${s.items.map(it=>`${low(product(it.productId).name)} ${qtyOf(it.got,product(it.productId))}`).join(', ')}. Фото: ${r.photos.length}.${s.received.note?' Комментарий: '+s.received.note:''}`,now));
  if(P.issues.length||P.dmg.length) notes.push(Notify.push(S,'warn',by,`Приёмка ${s.id} с замечаниями. ${[P.issues.join('; '),P.dmg.length?'Повреждено: '+P.dmg.join(', '):''].filter(Boolean).join('. ')}. Фото в карточке поставки.`,now));
  P.waits.forEach(({d,items,how})=>{
    const mg=person(d.managerId);let tail;
    if(how==='call'){const board=taskBoard();const t={id:Store.freeId(S.tasks,'t'),title:`Позвонить клиенту: товар по ${d.id} на складе`,desc:items,to:{t:'p',id:d.managerId},from:by,due:day(0,18),boardId:board.id,stageId:startStage(board.id).id,prio:'high',deal:d.id,at:now};S.tasks.push(t);taskIds.push(t.id);tail='Менеджеру поставлена задача позвонить клиенту.'}
    else if(how==='auto'){const x={id:Store.freeId(S.msgs,'m'),at:now,deal:d.id,channel:d.channel,auto:true,sim:true,text:fillTpl(d,items,false)};S.msgs.push(x);msgIds.push(x.id);tail=`Клиенту ушло авто-сообщение в ${CH[d.channel]} (имитация, не отправлено).`}
    else tail='Авто-сообщения выключены — напишите клиенту.';
    // менеджеру сделки — отдельно: уведомите клиента (R15)
    notes.push(Notify.push(S,'msg',null,`Уведомите клиента: ${d.client} (${d.id}) — товар на складе: ${items}. ${tail} Менеджер: ${mg?.name||'нет данных'}.`,now,[d.managerId]));
  });
  const notified=new Set(notes.flatMap(n=>n.to).filter(id=>id!==by)).size;
  r.done={ok:true,shipId:s.id,noteIds:notes.map(n=>n.id),msgIds,taskIds,stock,cell:{entityId:P.cell.entityId,cityId:P.cell.cityId,entityName:P.cell.entityName,cityName:P.cell.cityName},stage:P.final.name,fired,notified,issues:P.issues.length+P.dmg.length,by:who?.id||by};
  return r.done;
}

function dealGoods(d){
  const rs=S.reserves.filter(r=>r.dealId===d.id);
  if(!rs.length) return {lvl:'',text:'не зарезервирован'};
  const wait=rs.filter(r=>r.src!=='stock');
  if(wait.some(r=>stockOf(r.productId).freeAfter<0)) return {lvl:'bad',text:'не хватает товара'};
  if(!wait.length) return {lvl:'ok',text:'всё на складе'};
  const ss=[...new Set(wait.map(r=>r.src))].map(ship).filter(Boolean);
  const last=ss.reduce((a,s)=>s.eta>a?s.eta:a,ss[0].eta);
  return {lvl:'info',text:`едет ${ss.map(s=>s.id).join(', ')} · до ${fD(last)}`};
}
// Типы, между которыми человек переключает сделки: директор и те, у кого есть право «Видеть сделки всех типов»,
// — оба; остальные — свой тип (и тот, в котором у них есть сделки). Нет ни того, ни другого — оба.
