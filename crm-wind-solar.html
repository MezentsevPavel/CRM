    if (!/^\d+$/.test(s) || +s < 1 || +s > WAIT_MAX) return { ok: false, value: waitMin(st), reason: `Напишите целое число минут от 1 до ${WAIT_MAX}.` };
    st.leadWaitMin = +s;
    return { ok: true, value: +s, reason: '' };
  }
  // «15 мин», «1 ч 5 мин», «2 д 3 ч» — одна фраза об ожидании на экране и в уведомлении
  function waitText(min) {
    if (min < 60) return `${min} мин`;
    const h = Math.floor(min / 60), m = min % 60;
    if (h < 24) return m ? `${h} ч ${m} мин` : `${h} ч`;
    const d = Math.floor(h / 24), hh = h % 24;
    return hh ? `${d} д ${hh} ч` : `${d} д`;
  }
  // Было ли с лидом хоть одно действие: запись от человека в истории (кроме записей о приходе лида), дело или запись в ленте.
  const touched = (st, lead) => (lead.history || []).some(h => h.by && !h.start)
    || (st.acts || []).some(a => a.ref.t === 'lead' && a.ref.id === lead.id)
    || (st.feed || []).some(e => e.by && e.ref.t === 'lead' && e.ref.id === lead.id);
  // Сколько минут лид ждёт реакции на момент now, а если не ждёт — null. Ждёт: лид открыт, всё ещё на первом этапе воронки,
  // с ним не сделано ни одного действия и прошло больше порога. Единственное определение «ждёт» — для метки и уведомления.
  function waiting(st, lead, now) {
    const pipe = lead && pipeOf(st, lead), gone = new Date(now).getTime() - new Date(lead && lead.at).getTime();
    if (!pipe || !(gone > waitMin(st) * MINUTE) || !isOpen(st, lead) || lead.stageId !== firstOf(pipe).id || touched(st, lead)) return null;
    return Math.floor(gone / MINUTE);
  }
  // Разослать уведомление «leadWait» (РОП) о лидах, которые ждут, — по одному разу на лид (lead.waitNoted). → [уведомление…]
  function notifyWaiting(st, now) {
    const out = [];
    for (const l of st.leads || []) {
      const min = l.waitNoted ? null : waiting(st, l, now);
      if (min === null) continue;
      l.waitNoted = now;
      out.push(Notify.push(st, 'leadWait', null, `Лид ${l.id} ждёт ${waitText(min)}: ${title(l)} — с ним никто не работал. ${l.managerId ? 'Менеджер — ' + nameOf(st, l.managerId) : 'Менеджера нет, лид нераспределённый.'}`, now));
    }
    return out;
  }

  // Можно ли человеку взять лид себе: лид открыт и человек его видит (право «лиды», тип не чужой),
  // лид ничей или уже его.
  function canTake(st, lead, personId) {
    if (!lead || !personOf(st, personId) || !isOpen(st, lead) || !Perms.can(st, personId, 'leads')) return false;
    if (lead.managerId && lead.managerId !== personId) return false;
    const scope = scopeOf(st, personId);
    return !(scope && lead.type && scope !== lead.type) && visible(st, personId).includes(lead);
  }

  // Взять лид себе. Нельзя: закрытый лид, чужой лид, лид чужого типа, нет права «лиды». Возвращает лид или null.
  function take(st, leadId, personId, now) {
    const lead = byId(st, leadId);
    if (!canTake(st, lead, personId)) return null;
    const me = personOf(st, personId), scope = scopeOf(st, personId);
    lead.managerId = personId;
    if (!lead.type && scope) lead.type = scope;
    log(lead, now, personId, `Взял в работу: ${me.name}`);
    return lead;
  }

  // «Связались»: этап «Связались», если лид ещё не дальше него; запись в историю в любом случае.
  function contacted(st, leadId, by, now) {
    const lead = byId(st, leadId);
    if (!lead || !personOf(st, by) || !isOpen(st, lead)) return null;
    const pipe = pipeOf(st, lead), to = stageIn(pipe, ST_CONTACTED);
    if (to && pipe.stages.indexOf(to) > pipe.stages.findIndex(s => s.id === lead.stageId)) lead.stageId = to.id;
    log(lead, now, by, 'Связались с клиентом');
    return lead;
  }

  // Закрыть лид с причиной: этап «Отказ». Без причины — нельзя. Возвращает лид или null.
  function close(st, leadId, reason, by, now) {
    const lead = byId(st, leadId), why = String(reason || '').trim();
    if (!lead || !why || !personOf(st, by) || !isOpen(st, lead)) return null;
    const to = stageIn(pipeOf(st, lead), ST_LOST);
    if (!to) return null;
    lead.stageId = to.id;
    lead.reason = why;
    log(lead, now, by, `Закрыт: ${why}`);
    return lead;
  }

  // Единственный путь смены этапа из воронки (перетаскивание карточки). Сделка создана → toDeal; Отказ →
  // close, причина обязательна (reason; воронка спрашивает её окном); остальные этапы — смена и запись в историю.
  // Двигает менеджер, который лид ведёт, или тот, кто раздаёт лиды; закрытый лид не двигается; на тот же этап — нельзя.
  // Возвращает лид или null.
  function move(st, leadId, stageId, by, now, reason) {
    const lead = byId(st, leadId), pipe = lead && pipeOf(st, lead), to = stageIn(pipe, stageId);
    if (!lead || !to || to.id === lead.stageId || !canWork(st, lead, by)) return null;
    if (to.id === ST_DEAL) return toDeal(st, leadId, by, now) ? lead : null;
    if (to.id === ST_LOST) return close(st, leadId, reason, by, now);
    if (to.flag === 'final') return null;       // прочие финальные этапы (если их добавили в настройках) вручную не ставим
    lead.stageId = to.id;
    log(lead, now, by, to.id === ST_QUALIFIED ? 'Квалифицирован' : `Этап: «${to.name}»`);
    return lead;
  }

  // Вести лид (связаться, квалифицировать, закрыть, двигать по воронке, делать сделку): тот, кто раздаёт лиды
  // (директор, РОП), или менеджер, которому лид достался, пока лид открыт и человек его видит.
  const canWork = (st, lead, personId) => !!lead && !!personOf(st, personId) && isOpen(st, lead)
    && (canTransfer(st, personId) || lead.managerId === personId) && visible(st, personId).includes(lead);

  // Что человеку можно с лидом — одним вызовом, на нём стоят кнопки карточки: {take, work, deal, transfer}.
  function can(st, leadId, personId) {
    const lead = byId(st, leadId), work = canWork(st, lead, personId);
    return {
      take: !!lead && !lead.managerId && canTake(st, lead, personId),
      work,
      deal: work && !lead.dealId && !!lead.managerId && !!(lead.type || scopeOf(st, lead.managerId)),
      transfer: !!lead && isOpen(st, lead) && canTransfer(st, personId),
    };
  }

  // Новые лиды человека (число на пункте меню): открытые, на первом этапе воронки, которые ведёт он сам;
  // тому, кто раздаёт лиды (директор, РОП), — ещё и нераспределённые.
  function fresh(st, personId) {
    return visible(st, personId).filter(l => {
      const pipe = pipeOf(st, l);
      return !!pipe && isOpen(st, l) && l.stageId === firstOf(pipe).id
        && (l.managerId === personId || (!l.managerId && canTransfer(st, personId)));
    });
  }

  // Принимаем ли лиды из этого источника: сайт и Битрикс24 включаются в настройках; телефон и почта — всегда.
  function allows(st, source) {
    if (source !== 'site' && source !== 'bitrix') return true;
    const pick = st.leadSource || 'both';
    return pick === 'both' || pick === source;
  }
  // Выбрать источник лидов (настройки). Неизвестное значение — отказ.
  function setSource(st, value) {
    if (!SOURCES[value]) return false;
    st.leadSource = value;
    return true;
  }

  // Кто может передавать лиды и видит все — право «Распределять и передавать лиды»: директор и РОП.
  const canTransfer = (st, personId) => Perms.can(st, personId, 'leadsAssign');

  // Передать лид (директор): {managerId} — конкретному менеджеру, {type} — типу (тогда менеджер по меньшей
  // загрузке, а если такого нет — «Нераспределённые» этого типа). Тип лида становится типом менеджера/выбранным.
  // Новый менеджер получает уведомление. Возвращает лид или null.
  function transfer(st, leadId, target, by, now) {
    const lead = byId(st, leadId);
    if (!lead || !canTransfer(st, by) || !isOpen(st, lead) || !target) return null;
    let text;
    if (target.managerId) {
      const m = personOf(st, target.managerId);
      if (!m || !Perms.can(st, m.id, 'leads')) return null;
      lead.managerId = m.id;
      const scope = scopeOf(st, m.id);
      if (scope) lead.type = scope;
      text = `Передан менеджеру: ${m.name}`;
    } else if (TYPE[target.type]) {
      lead.type = target.type;
      lead.managerId = pick(st, target.type, lead.id);
      text = lead.managerId
        ? `Передан типу ${TYPE[target.type]}: ${nameOf(st, lead.managerId)}`
        : `Передан типу ${TYPE[target.type]}: менеджера нет, лид нераспределённый`;
    } else return null;
    log(lead, now, by, text);
    if (lead.managerId) {
      Notify.push(st, 'lead', by, `Вам передан лид ${lead.id} (${SOURCE[lead.source]}): ${title(lead)}.`, now, [lead.managerId]);
    }
    return lead;
  }

  // Создать сделку из лида: воронка своего типа, первый этап, тот же менеджер, контакт и текст заявки. Клиент сделки —
  // тот, к которому лид привязан; иначе уже заведённый с тем же ИНН, телефоном или почтой; иначе новый (Clients.findOrCreate);
  // лид и сделка ссылаются на него. Открытые дела лида переходят в сделку (Acts.moveOpen).
  // Лид уходит в «Сделка создана» и ссылается на сделку. Возвращает id сделки; null — если нельзя
  // (лид закрыт, сделка уже есть, нет менеджера или тип неизвестен).
  function toDeal(st, leadId, by, now) {
    const lead = byId(st, leadId);
    if (!lead || lead.dealId || !personOf(st, by) || !isOpen(st, lead) || !lead.managerId) return null;
    const type = lead.type || scopeOf(st, lead.managerId);
    const pipe = type ? dealPipe(type, st) : null, done = stageIn(pipeOf(st, lead), ST_DEAL);
    if (!pipe || !done) return null;
    st.deals = st.deals || [];
    // Клиент сделки: тот же ИНН, телефон или почта — уже заведённый клиент, иначе новый (Clients.findOrCreate)
    // (клиент, к которому лид привязан при заведении, — он и есть клиент сделки)
    const client = (lead.clientId && Clients.byId(st, lead.clientId)) || Clients.findOrCreate(st, {
      name: lead.company || lead.name || 'нет данных: клиент', kind: lead.company || lead.inn ? 'company' : 'person',
      inn: lead.inn, phone: lead.phone, email: lead.email, managerId: lead.managerId, demo: lead.demo,
    }, by, now).client;
    const d = {
      id: nextId(st.deals, 'Д', 300),
      clientId: client.id, client: client.name,
      contact: lead.name || lead.company || 'нет данных: контакт',
      kind: type === 'b2b' ? 'Компания' : 'Частный клиент',
      object: lead.text || 'нет данных: текст заявки',
      type, pipeId: pipe.id, stageId: firstOf(pipe).id,
      managerId: lead.managerId,
      // мессенджер клиента из лида неизвестен — связь по телефону; телефон и почта едут в сделку как есть
      channel: 'phone', amount: 0, phone: lead.phone, email: lead.email,
      items: [], at: now, leadId: lead.id, demo: lead.demo,
    };
    st.deals.push(d);
    Feed.add(st, { t: 'deal', id: d.id }, { kind: 'create', text: `Сделка создана из лида ${lead.id}`, by, at: now });
    // открытые дела лида едут в сделку вместе с ним: следующий шаг не теряется
    Acts.moveOpen(st, { t: 'lead', id: lead.id }, { t: 'deal', id: d.id }, by, now);
    lead.type = type;
    lead.stageId = done.id;
    lead.dealId = d.id;
    lead.clientId = client.id;
    log(lead, now, by, `Создана сделка ${d.id}`);
    return d.id;
  }

  // Лиды, которые видит человек. Нет права «лиды» — никаких. Кто раздаёт лиды (директор, РОП) — все. Менеджер —
  // лиды своего типа и свои. Лид без типа и без менеджера («Нераспределённый» без данных) — только тем, кто раздаёт.
  function visible(st, personId) {
    if (!Perms.can(st, personId, 'leads')) return [];
    const all = st.leads || [];
    if (canTransfer(st, personId)) return all.slice();
    const scope = scopeOf(st, personId);
    return all.filter(l => l.managerId === personId || (!!scope && l.type === scope));
  }

  // Сделки, которые видит человек: нужно право «клиенты»; директор и право «все типы» — все;
  // менеджер — сделки своего типа и свои.
  function dealsVisible(st, personId) {
    if (!Perms.can(st, personId, 'clients')) return [];
    const all = st.deals || [];
    if (isDirector(st, personId) || Perms.can(st, personId, 'dealsAll')) return all.slice();
    const scope = scopeOf(st, personId);
    return all.filter(d => d.managerId === personId || (!!scope && d.type === scope));
  }

  return { SOURCE, SOURCES, TYPE, STAGE, nextId, firstOf, title, managers, classify, route, pick, openCount, create, add, waitMin, setWaitMin, waitText, waiting, notifyWaiting, canTake, take, contacted, close, move, canWork, can, fresh, allows, setSource, canTransfer, transfer, toDeal, visible, dealsVisible };
})();

// Этапы воронки лидов, на которые опирается логика по id: Pipes.removeStage их не удаляет, их можно только переименовать.
// Первый этап (firstOf) — сюда падает новый лид и по нему считается «ждёт»; остальные — действия Leads.
Pipes.guard('leads', pipe => ({
  [Leads.firstOf(pipe).id]: 'сюда падает каждый новый лид, и по нему считается «ждёт»',
  [Leads.STAGE.contacted]: 'отметка «Связались» переводит лид сюда',
  [Leads.STAGE.qualified]: 'отметка «Квалифицирован» переводит лид сюда',
  [Leads.STAGE.deal]: 'сюда лид попадает, когда из него создали сделку',
  [Leads.STAGE.lost]: 'сюда лид попадает при отказе',
}));

// Вид уведомления «Лид ждёт» в «Уведомления»: подпись и значок (список видов — KIND в 20-model.js)
KIND.leadWait = { l: 'Лид ждёт', ic: 'clock', c: 'bad' };

// Шаг SEEDS: роль РОП и демо-человек с этой ролью. РОП распределяет лиды (право leadsAssign) и сам лидов не получает:
// у роли нет типа (scope), поэтому Leads.route и Leads.pick его не выбирают. Шаг стоит до лидов — чтобы человек уже был в команде.
SEEDS.push(st => {
  const on = ['leads', 'leadsAssign', 'dealsAll', 'clients', 'stock', 'prices', 'reserve', 'write', 'mail', 'tasksAssign'];
  st.roles.push({ id: 'rop', name: 'РОП (руководитель отдела продаж)', builtin: true, perms: Object.fromEntries(Perms.LIST.map(([k]) => [k, on.includes(k)])) });
  st.people.push({ id: Store.freeId(st.people, 'p'), name: 'Елена Г.', role: 'rop', dept: 'sales', demo: true });
});

// Шаг SEEDS: источник лидов и 24 демо-лида. Всё помечено «пример» (demo:true и слово в имени/компании),
// телефоны вида +7 900 000-00-NN, почта на example.com — настоящих людей и компаний тут нет.
// Лиды заводятся теми же функциями, что и в работе (create, contacted, close, toDeal), но без уведомлений:
// менеджера выбирает route, поэтому «Нераспределённые» — лиды без компании и контакта.
SEEDS.push(st => {
  st.leadSource = 'both';
  st.leadWaitMin = 15;
  st.leads = [];
  const pad = (n, w) => String(n).padStart(w, '0');
  const COMPANIES = ['ООО „Пример-Строй“', 'ИП Пример-Агро', 'КФХ „Пример“', 'ООО „Пример-Сервис“', 'АО „Пример-Энерго“', 'ООО „Пример-Склад“', 'ООО „Пример-Дом“', 'ООО „Пример-Транс“'];
  const TEXTS = {
    b2b: ['Пример заявки: нужна станция для объекта компании, просим рассчитать и прислать КП.', 'Пример заявки: интересует сетевая станция на кровлю, просим связаться по телефону.', 'Пример заявки: нужен расчёт по резервному питанию для склада.'],
    b2c: ['Пример заявки: интересует станция для дома, просьба перезвонить.', 'Пример заявки: хочу узнать, что нужно для автономного питания на даче.', 'Пример заявки: нужен расчёт ветро-солнечной станции для участка.'],
    none: ['Пример заявки: клиент не оставил ни телефона, ни почты, назвал только имя.'],
  };
  const REASONS = ['Пример причины: клиент выбрал другого поставщика', 'Пример причины: не вышли на связь', 'Пример причины: передумал покупать'];
  // [дней назад, час, источник, что указал клиент, где лид сейчас]
  // что указал: B — компания и телефон, BI — компания, ИНН и почта, I — только ИНН, P — телефон, E — почта,
  // PE — телефон и почта, N — ничего
  const ROWS = [
    [14, 10, 'site', 'B', 'lost'], [13, 11, 'bitrix', 'P', 'lost'], [12, 9, 'site', 'I', 'contacted'], [12, 14, 'bitrix', 'PE', 'deal'],
    [11, 10, 'site', 'E', 'contacted'], [10, 12, 'bitrix', 'B', 'qualified'], [9, 9, 'site', 'P', 'qualified'], [9, 15, 'bitrix', 'BI', 'deal'],
    [8, 11, 'site', 'P', 'lost'], [7, 10, 'bitrix', 'E', 'contacted'], [7, 13, 'site', 'N', 'new'], [6, 12, 'bitrix', 'P', 'qualified'],
    [5, 9, 'site', 'B', 'contacted'], [5, 16, 'bitrix', 'PE', 'new'], [4, 10, 'site', 'I', 'new'], [4, 14, 'bitrix', 'N', 'new'],
    [3, 9, 'site', 'P', 'deal'], [3, 13, 'bitrix', 'B', 'lost'], [2, 11, 'site', 'E', 'new'], [2, 15, 'bitrix', 'P', 'new'],
    [1, 10, 'site', 'BI', 'qualified'], [1, 14, 'bitrix', 'N', 'new'], [0, 7, 'site', 'P', 'new'], [0, 8, 'bitrix', 'N', 'new'],
  ];
  ROWS.forEach(([back, h, source, kind, stage], i) => {
    const k = i + 1, at = day(-back, h, 0), later = n => day(-back, h + n, 0);
    const data = { source, demo: true, name: `Клиент-пример ${k}` };
    if (kind === 'B' || kind === 'BI') { data.company = COMPANIES[k % COMPANIES.length]; data.name = `Контакт-пример ${k}`; }
    if (kind === 'B' || kind === 'P' || kind === 'PE') data.phone = `+7 900 000-00-${pad(k, 2)}`;
    if (kind === 'BI' || kind === 'E' || kind === 'PE') data.email = `primer${k}@example.com`;
    if (kind === 'BI' || kind === 'I') data.inn = `0000000${pad(k, 3)}`;
    const group = kind === 'N' ? 'none' : kind[0] === 'B' || kind === 'I' ? 'b2b' : 'b2c';
    data.text = TEXTS[group][k % TEXTS[group].length];
    const lead = Leads.create(st, data, at, { silent: true });
    lead.waitNoted = at;     // демо-лиды старые: «ждёт» на них видно, но уведомление РОП при первом запуске не сыплется
    const m = lead.managerId;
    if (stage !== 'new') Leads.contacted(st, lead.id, m, later(1));
    if (stage === 'qualified' || stage === 'deal') Leads.move(st, lead.id, 'qualified', m, later(2));
    if (stage === 'deal') Leads.toDeal(st, lead.id, m, later(3));
    if (stage === 'lost') Leads.close(st, lead.id, REASONS[k % REASONS.length], m, later(2));
  });
});

// Ядро: почта — ящики, папки поставщиков, правила по адресам. Чистая логика, без DOM.
// Это имитация: наружу ничего не уходит, ответ только ложится в ветку письма с пометкой.
// Папка письма — id поставщика или INBOX. В ящике закупок INBOX — это «Разобрать»; в остальных ящиках
// все письма лежат в INBOX. Правило поставщика — строка: точный адрес 'adr@x' или домен '@x'.
// Данные (st.mail): boxes, suppliers, letters — схема в interfaces.md; у письма ещё replies — ветка ответов, поле появляется с первым ответом.

const Mail = (() => {
  const INBOX = 'inbox';
  const SIM_NOTE = 'имитация, не отправлено';
  const NOTE_KIND = 'mail';

  // Чтение терпит состояние без st.mail (старое сохранение): тогда просто нет ящиков и писем.
  const data = st => st.mail || { boxes: [], suppliers: [], letters: [] };
  const boxOf = (st, boxId) => data(st).boxes.find(b => b.id === boxId) || null;

  const fold = s => String(s ?? '').toLowerCase().replace(/ё/g, 'е');
  // Адрес отправителя без регистра; «Имя <adr@x>» → adr@x.
  const addrOf = from => {
    const s = String(from ?? '');
    const m = s.match(/<([^>]*)>/);
    return (m ? m[1] : s).trim().toLowerCase();
  };
  const domainOf = addr => { const i = addr.lastIndexOf('@'); return i >= 0 ? addr.slice(i + 1) : ''; };
  const ruleKey = r => String(r ?? '').trim().toLowerCase();
  // Подходит ли адрес под правило: '@домен' — любой адрес этого домена, иначе — ровно этот адрес.
  const matches = (rule, addr) => {
    if (!rule || !addr) return false;
    if (rule.startsWith('@')) return rule.length > 1 && domainOf(addr) === rule.slice(1);
    return rule === addr;
  };

  // Ящики, которые видит человек. Без права mail — никаких; директор — все; остальные — по ролям ящика.
  function boxesFor(st, personId) {
    if (!Perms.can(st, personId, 'mail')) return [];
    const role = Perms.roleOf(st, personId);
    const all = !!(role && role.all === true);
    return data(st).boxes.filter(b => all || (b.roles || []).includes(role.id));
  }

  // Папка письма. Только ящик закупок раскладывает по поставщикам: точный адрес сильнее домена.
  function folderOf(st, letter) {
    const box = boxOf(st, letter.boxId);
    if (!box || box.kind !== 'purchase') return INBOX;
    const addr = addrOf(letter.from);
    const sups = data(st).suppliers;
    const rulesOf = s => (s.rules || []).map(ruleKey);
    const exact = sups.find(s => rulesOf(s).some(r => !r.startsWith('@') && matches(r, addr)));
    if (exact) return exact.id;
    const byDomain = sups.find(s => rulesOf(s).some(r => r.startsWith('@') && matches(r, addr)));
    return byDomain ? byDomain.id : INBOX;
  }

  // «Это поставщик X, запомнить адрес»: правило (адрес или весь домен) — поставщику; письма этого ящика,
  // которые теперь по правилам лежат у него, переезжают в его папку. Правило живёт у одного поставщика.
  // → {ok, reason, rule, moved}
  function remember(st, letterId, supplierId, mode) {
    const fail = reason => ({ ok: false, reason, rule: '', moved: 0 });
    const m = data(st);
    const letter = m.letters.find(l => l.id === letterId);
    if (!letter) return fail('Письмо не найдено');
    const sup = m.suppliers.find(s => s.id === supplierId);
    if (!sup) return fail('Поставщик не найден');
    const box = boxOf(st, letter.boxId);
    if (!box || box.kind !== 'purchase') return fail('Папки поставщиков есть только в ящике закупок');
    if (mode !== 'address' && mode !== 'domain') return fail('Правило: адрес или домен');
    const addr = addrOf(letter.from), dom = domainOf(addr);
    if (!addr || !dom) return fail('У письма нет адреса отправителя');
    const rule = mode === 'domain' ? '@' + dom : addr;
    for (const s of m.suppliers) if (s !== sup) s.rules = (s.rules || []).filter(r => ruleKey(r) !== rule);
    sup.rules = sup.rules || [];
    if (!sup.rules.some(r => ruleKey(r) === rule)) sup.rules.push(rule);
    let moved = 0;
    for (const l of m.letters) {
      if (l.boxId !== letter.boxId || !matches(rule, addrOf(l.from))) continue;
      if (folderOf(st, l) === sup.id && l.folder !== sup.id) { l.folder = sup.id; moved++; }
    }
    return { ok: true, reason: '', rule, moved };
  }

  // Поиск в ящике (и в папке, если задана) по отправителю, теме и тексту; без регистра и ё/е;
  // несколько слов — все должны найтись. Новые письма сверху.
  function search(st, { boxId, folder, q } = {}) {
    const words = fold(q).split(/\s+/).filter(Boolean);
    return data(st).letters
      .filter(l => l.boxId === boxId && (!folder || l.folder === folder))
      .filter(l => {
        const hay = fold([l.fromName, l.from, l.subject, l.body].join('\n'));
        return words.every(w => hay.includes(w));
      })
      .sort((a, b) => new Date(b.at) - new Date(a.at));
  }

  // Новое письмо в ящик: папка по правилам, уведомление тем, кто видит ящик. Нет такого ящика → null.
  // letter: {boxId, from, fromName?, subject, body, demo?}; id, дата, «не прочитано» и папку ставит эта функция.
  function deliver(st, letter, now) {
    const box = boxOf(st, letter.boxId);
    if (!box) return null;
    const m = data(st);
    const l = {
      id: Store.freeId(m.letters, 'ml'), boxId: box.id, from: letter.from, fromName: letter.fromName || '',
      subject: letter.subject || '', body: letter.body || '', at: now, read: false, folder: INBOX,
    };
    if (letter.demo) l.demo = true;
    l.folder = folderOf(st, l);
    m.letters.push(l);
    // Вид «mail» в Notify.RECIPIENTS пустой: адресаты — те, кто видит ящик, они идут через extra.
    const viewers = (st.people || []).filter(p => boxesFor(st, p.id).some(b => b.id === box.id)).map(p => p.id);
    const sup = m.suppliers.find(s => s.id === l.folder);
    const where = sup ? `папка «${sup.name}»` : box.kind === 'purchase' ? 'папка «Разобрать»' : 'входящие';
    Notify.push(st, NOTE_KIND, null, `Новое письмо в ящике «${box.title}» (${where}): ${l.subject} — от ${l.fromName || l.from}.`, now, viewers);
    return l;
  }

  // Ответ на письмо — в ветку письма, с пометкой «имитация, не отправлено». Ответить может тот, кто видит ящик.
  // Нет письма, пустой текст или нет доступа → null.
  function reply(st, letterId, text, by, now) {
    const letter = data(st).letters.find(l => l.id === letterId);
    const body = String(text ?? '').trim();
    if (!letter || !body) return null;
    if (!boxesFor(st, by).some(b => b.id === letter.boxId)) return null;
    letter.replies = letter.replies || [];
    const r = { id: Store.freeId(letter.replies, 'r'), by, at: now, text: body, sim: true, note: SIM_NOTE };
    letter.replies.push(r);
    letter.read = true;
    return r;
  }

  return { INBOX, SIM_NOTE, NOTE_KIND, boxesFor, folderOf, remember, search, deliver, reply };
})();

    ['clients', 0, 10, 20, 'client1@clients.example', 'Клиент-пример 1', `Срок поставки ${short(inv[0])}`, `Здравствуйте! Подскажите, когда сможете поставить ${inv[0].name}? Нужно 2 штуки.`],
    ['clients', 0, 12, 50, 'client12@clients.example', 'Клиент-пример 12', 'Нужен расчёт станции для дома', 'Здравствуйте! Хотим солнечную станцию для загородного дома. Подскажите, с чего начать и что вам нужно от нас.'],
  ];
  rows.forEach(([boxId, back, h, m, from, fromName, subject, body], i) => {
    const l = { id: 'ml' + (i + 1), boxId, from, fromName, subject, body, at: at(back, h, m), read: back >= 3, folder: Mail.INBOX, demo: true };
    l.folder = Mail.folderOf(st, l);
    st.mail.letters.push(l);
  });
  // в одной ветке есть ответ-имитация: так видно, как выглядит пометка (отвечает менеджер B2C из демо-команды)
  const paid = st.mail.letters.find(l => l.boxId === 'clients' && l.subject === 'Оплата заказа');
  const r = Mail.reply(st, paid.id, 'Спасибо, оплату видим. Заказ передан в отгрузку, о сроках напишем отдельно.', 'p2', at(1, 16, 0));
  if (r) r.demo = true;
});

// Ядро: уведомления. Адресаты — люди (to:[personId]), прочитанность — у каждого своя (read:[personId]).
// Кому что приходит — только карта RECIPIENTS; человек может выключить вид у себя:
// prefs.notify[personId][kind] === false — этот вид ему не приходит.
// Звук нового уведомления — у каждого свой: prefs.sound[personId] = {on, kind}; когда играть, решает soundFor.

const Notify = (() => {
  // Событие → кому: 'all' — все сотрудники, иначе id встроенных ролей (их нельзя удалить, id не меняются).
  // Адресатов конкретного события (исполнитель задачи, люди отдела, менеджер сделки или лида)
  // добавляет вызывающий через extraPersons.
  const RECIPIENTS = {
    ship: 'all',                                               // поставки: этап, точка, срок — все сотрудники (R10)
    arrive: ['director', 'managerB2b', 'managerB2c'],          // приёмка «товар на складе» — менеджеры и директор (R15)
    reserve: ['director', 'warehouse'],                        // резервы — склад и директор, плюс менеджер сделки (extraPersons):
                                                               // менеджер другого типа чужую сделку не видит и о ней не узнаёт
    warn: ['director', 'logist', 'managerB2b', 'managerB2c'],  // приёмка с замечаниями — как в v2
    task: [],                                                  // задачи — исполнитель, отдел и автор (extraPersons)
    msg: ['director'],                                         // сообщения клиентам — плюс менеджер сделки (extraPersons)
    lead: ['director', 'rop'],                                 // новый лид — директору и РОП, плюс менеджер, кому он ушёл (extraPersons)
    mail: [],                                                  // новое письмо — те, кто видит ящик (extraPersons)
    act: [],                                                   // напоминание о деле — ответственный (extraPersons)
    dispatch: ['logist', 'warehouse'],                         // новая заявка на отправку — логист и кладовщик
    dispatchStep: [],                                          // этап и водитель заявки — автор или водитель (extraPersons), исполнителям не рассылаем
    leadWait: ['rop'],                                         // новый лид долго без действий — РОП
  };

  const wants = (st, personId, kind) => {
    const p = st.prefs && st.prefs.notify && st.prefs.notify[personId];
    return !(p && p[kind] === false);
  };

  // Включить или выключить вид этому человеку. Включённый — это отсутствие записи (по умолчанию приходят все виды).
  // Возвращает false, если такого вида или человека нет.
  function setWanted(st, personId, kind, on) {
    if (!Object.hasOwn(RECIPIENTS, kind) || !(st.people || []).some(p => p.id === personId)) return false;
    st.prefs = st.prefs || {};
    st.prefs.notify = st.prefs.notify || {};
    const mine = st.prefs.notify[personId] = st.prefs.notify[personId] || {};
    if (on) delete mine[kind]; else mine[kind] = false;
    return true;
  }

  // Звуки на выбор: id и подпись. Как они звучат — в 63-settings-notify.js (синтез в браузере, файлов нет).
  const SOUNDS = [['bell', 'Колокольчик'], ['drop', 'Капля'], ['double', 'Двойной сигнал'], ['soft', 'Мягкий']];

  // Звук этого человека: {on, kind}. По умолчанию выключен; неизвестный звук заменяется первым из списка.
  function soundPref(st, personId) {
    const p = st.prefs && st.prefs.sound && st.prefs.sound[personId];
    return { on: !!(p && p.on), kind: p && SOUNDS.some(s => s[0] === p.kind) ? p.kind : SOUNDS[0][0] };
  }

  // Изменить звук человека: patch = {on?, kind?}. Возвращает новые настройки или null (нет такого человека или звука).
  function setSound(st, personId, patch) {
    if (!(st.people || []).some(p => p.id === personId)) return null;
    if (patch.kind !== undefined && !SOUNDS.some(s => s[0] === patch.kind)) return null;
    const next = Object.assign(soundPref(st, personId), patch.on === undefined ? {} : { on: !!patch.on }, patch.kind === undefined ? {} : { kind: patch.kind });
    st.prefs = st.prefs || {};
    st.prefs.sound = Object.assign({}, st.prefs.sound);
    st.prefs.sound[personId] = next;
    return Object.assign({}, next);
  }

  // Кому придёт уведомление этого вида: по карте, плюс extraPersons, без тех, кто выключил вид.
  function recipients(st, kind, extraPersons) {
    const rule = RECIPIENTS[kind];
    if (rule === undefined) throw new Error(`Неизвестный вид уведомления: ${kind}`);
    const people = st.people || [];
    const byRule = rule === 'all' ? people : people.filter(p => rule.includes(p.role));
    const ids = [...byRule.map(p => p.id), ...(extraPersons || [])];
    const known = new Set(people.map(p => p.id));
    return [...new Set(ids)].filter(id => known.has(id) && wants(st, id, kind));
  }

  // Новое уведомление — в начало списка. Автор, если он среди адресатов, своё уже прочитал.
  function push(st, kind, by, text, now, extraPersons) {
    const to = recipients(st, kind, extraPersons);
    st.notes = st.notes || [];
    const note = { id: Store.freeId(st.notes, 'n'), kind, by: by || null, at: now, text, to, read: by && to.includes(by) ? [by] : [] };
    st.notes.unshift(note);
    return note;
  }

  // Непрочитанные этим человеком.
  function unread(st, personId) {
    return (st.notes || []).filter(n => n.to.includes(personId) && !n.read.includes(personId));
  }

  // Отметить прочитанным для этого человека: одно уведомление или все его. Возвращает, сколько отмечено.
  function markRead(st, personId, noteId) {
    const list = unread(st, personId).filter(n => !noteId || n.id === noteId);
    list.forEach(n => n.read.push(personId));
    return list.length;
  }

  // Номера непрочитанных этим человеком — по ним видно, пришло ли что-то новое между двумя отрисовками.
  function unreadIds(st, personId) {
    return unread(st, personId).map(n => n.id);
  }

  // Какой звук сыграть человеку: before и after — unreadIds до и после. Звук есть, только если он включён
  // и среди after появился номер, которого не было в before. before = null («смотрим впервые») — тишина,
  // иначе при каждом запуске страницы звенели бы старые уведомления. Возвращает id звука или null.
  function soundFor(st, personId, before, after) {
    const pref = soundPref(st, personId);
    if (!pref.on || !before) return null;
    const had = new Set(before);
    return (after || []).some(id => !had.has(id)) ? pref.kind : null;
  }

  return { RECIPIENTS, SOUNDS, wants, setWanted, soundPref, setSound, soundFor, recipients, push, unread, unreadIds, markRead };
})();

// Ядро: каталог товаров и склейка снимка остатков с каталогом. Чистая логика, без DOM.
// Источники — снимки CATALOG (10-catalog-data.js, таблица PVCalc) и STOCK_SNAPSHOT (11-stock-data.js, таблица менеджеров).
// Здесь же шаг SEEDS: настоящие товары и остатки вместо выдуманных товаров прототипа v2.

const Catalog = (() => {
  // Название для сравнения: без регистра, ё = е, без кавычек, любые тире = «-» без пробелов вокруг, один пробел.
  const norm = name => String(name ?? '').toLowerCase().replace(/ё/g, 'е')
    .replace(/[«»“”„"'`´]/g, '')
    .replace(/\s*[-‐‑‒–—−]\s*/g, '-')
    .replace(/\s+/g, ' ').trim();

  // Категории товаров: подписи на экране. Вид позиции каталога (колонка «Вид») и раздел таблицы менеджеров сводятся к ним.
  const CATS = ['Панели', 'Инверторы', 'Аккумуляторы', 'Контроллеры', 'Защита и соединения', 'Кабель'];
  const KIND_CAT = { 'панель': 'Панели', 'инвертор': 'Инверторы', 'АКБ': 'Аккумуляторы', 'защита и соединения': 'Защита и соединения', 'кабель': 'Кабель' };
  const SECTION_CAT = {
    'солнечные панели': 'Панели',
    'инверторы / ибп / конвертеры': 'Инверторы',
    'контроллеры заряда': 'Контроллеры',
    'аккумуляторные батареи': 'Аккумуляторы',
    'соединительное и защитное оборудование': 'Защита и соединения',
  };
  // Раздел листа остатков («Корень › Подраздел») → категория. Крепёж лежит в разделе панелей, но в каталоге
  // сайта он — «защита и соединения». Незнакомый раздел остаётся как в таблице: ничего не теряется.
  function sectionCat(section) {
    const [root, ...sub] = String(section ?? '').split(' › ');
    if (sub.some(s => norm(s).includes('крепеж'))) return 'Защита и соединения';
    return SECTION_CAT[norm(root)] || String(root).trim();
  }

  const isNum = v => typeof v === 'number' && isFinite(v);

  // Снимки → {products, stock, aside, unmatched}.
  // products: все позиции каталога (id = ключ каталога, inCatalog:true), затем строки остатков, не нашедшие пару
  //   (id 'sheet-NNN' по номеру строки, inCatalog:false — на экране «нет в каталоге»).
  // Строка остатков склеивается с позицией, только когда norm(название) совпал с norm(модель) ровно у одной позиции
  //   и ровно у одной строки остатков. Похожее, но не совпавшее, и неоднозначное не склеивается.
  // stock[productId][entityId]['_'] — остаток по юрлицу; города в таблице нет → ключ '_'. Пусто остаётся пусто, не 0.
  // aside[productId] = {damaged, custody, transitNoShip} — «Бой», ответхранение, «В пути»; есть, если заполнено хоть что-то.
  // unmatched: [{productId, name}] — строки остатков без пары в каталоге.
  function build(catalog, snapshot) {
    const products = catalog.rows.map(r => ({
      id: String(r.key), name: r.model, brand: r.brand ?? null, cat: KIND_CAT[r.cat] || r.cat,
      price: isNum(r.price) ? r.price : null, avail: r.avail ?? null, url: r.url ?? null,
      src: 'catalog', inCatalog: true, sheet: r.sheet,
    }));
    const byName = new Map();
    for (const p of products) { const k = norm(p.name); byName.set(k, [...(byName.get(k) || []), p.id]); }
    const rowsPerName = new Map();
    for (const r of snapshot.rows) { const k = norm(r.name); rowsPerName.set(k, (rowsPerName.get(k) || 0) + 1); }

    const stock = {}, aside = {}, unmatched = [];
    snapshot.rows.forEach((r, i) => {
      const k = norm(r.name), same = byName.get(k);
      let id;
      if (same && same.length === 1 && rowsPerName.get(k) === 1) id = same[0];
      else {
        id = 'sheet-' + String(i + 1).padStart(3, '0');
        products.push({ id, name: r.name, brand: null, cat: sectionCat(r.cat), price: null, avail: null, url: null, src: 'sheet', inCatalog: false });
        unmatched.push({ productId: id, name: r.name });
      }
      for (const e of ['ip', 'npp', 'vs']) if (isNum(r[e])) (stock[id] || (stock[id] = {}))[e] = { _: r[e] };
      const a = { damaged: isNum(r.damaged) ? r.damaged : null, custody: isNum(r.custody) ? r.custody : null, transitNoShip: isNum(r.transit) ? r.transit : null };
      if (Object.values(a).some(v => v !== null)) aside[id] = a;
    });
    return { products, stock, aside, unmatched };
  }

  // Категории, которые есть у товаров: сначала привычный порядок CATS, потом остальные по алфавиту.
  function cats(st) {
    const have = new Set(st.products.map(p => p.cat));
    return [...CATS.filter(c => have.has(c)), ...[...have].filter(c => !CATS.includes(c)).sort((a, b) => a.localeCompare(b, 'ru'))];
  }
  function brands(st) {
    return [...new Set(st.products.map(p => p.brand).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru'));
  }

  // Поиск и фильтры: q — слова через пробел, каждое должно встретиться в названии, бренде или ключе;
  // cat, brand, avail ('в наличии' | 'предзаказ') — точное совпадение; inCatalog — true | false. Пустое не фильтрует.
  function query(st, { q, cat, brand, avail, inCatalog } = {}) {
    const words = norm(q).split(' ').filter(Boolean);
    return st.products.filter(p =>
      (!cat || p.cat === cat) && (!brand || p.brand === brand) && (!avail || p.avail === avail) &&
      (inCatalog === undefined || inCatalog === null || p.inCatalog === inCatalog) &&
      (!words.length || words.every(w => norm(p.name + ' ' + (p.brand || '') + ' ' + p.id).includes(w))));
  }

  // ——— снимок не живёт в сохранении браузера ———
  // Товары снимка (src 'catalog' и 'sheet') — константы файла: в сохранение они не пишутся, при загрузке встают из build().
  // В сохранении только изменяемое: товары, добавленные руками, правки полей товаров снимка и id снятых из списка.
  // Метка catalogSnapshot в записи говорит «товары снимка здесь не лежат»; без неё список товаров читается как есть.
  let baseCache = null;
  const base = () => {
    if (!baseCache) {
      const built = build(CATALOG, STOCK_SNAPSHOT);
      baseCache = { ...built, byId: new Map(built.products.map(p => [p.id, p])) };
    }
    return baseCache;
  };
  const isSnap = p => p && (p.src === 'catalog' || p.src === 'sheet') && base().byId.has(p.id);
  const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);

  // Список товаров состояния → поля для записи в сохранение; null — в списке нет товаров снимка (пишется как есть).
  function pack(products) {
    if (!Array.isArray(products) || !products.some(isSnap)) return null;
    const own = [], edits = {}, seen = new Set();
    for (const p of products) {
      if (!isSnap(p)) { own.push(p); continue; }
      seen.add(p.id);
      const ref = base().byId.get(p.id), diff = {};
      for (const k of new Set([...Object.keys(p), ...Object.keys(ref)])) if (!same(p[k], ref[k])) diff[k] = p[k] ?? null;
      if (Object.keys(diff).length) edits[p.id] = diff;
    }
    const removed = [...base().byId.keys()].filter(id => !seen.has(id));
    const out = { products: own, catalogSnapshot: CATALOG.snapshot };
    if (Object.keys(edits).length) out.productEdits = edits;
    if (removed.length) out.productsRemoved = removed;
    return out;
  }

  // Прочитанное состояние: товары снимка возвращаются на место (сначала снимок, затем добавленные руками). Меняет st.
  function unpack(st) {
    if (!st || !st.catalogSnapshot) return st;
    const edits = st.productEdits || {}, removed = new Set(st.productsRemoved || []);
    const snap = base().products.filter(p => !removed.has(p.id)).map(p => ({ ...p, ...(edits[p.id] || {}) }));
    st.products = [...snap, ...(Array.isArray(st.products) ? st.products : [])];
    delete st.catalogSnapshot; delete st.productEdits; delete st.productsRemoved;
    return st;
  }

  return { norm, CATS, build, cats, brands, query, sectionCat, base, pack, unpack };
})();

// Шаг SEEDS: товары и остатки — настоящие, из снимков. Демо-записи прототипа v2 (резервы, позиции поставок,
// движения) ссылались на 12 выдуманных товаров по артикулу; их переводит этот шаг на настоящие позиции того же
// вида: панель — на панель, инвертор — на инвертор, АКБ — на аккумулятор. Позиция выбрана по смыслу записи:
// где v2 резервировал со склада — позиция, у которой в таблице менеджеров есть остаток; где товар только едет
// (АКБ) — позиция из каталога сайта. Ветрогенераторов в каталоге нет: запись ведёт на инвертор.
// Позиция названа точно, как в источнике; нет такой — берётся первая того же вида, ссылки остаются целыми.
const DEMO_LINKS = {
  'PV-550M': { cat: 'Панели', name: 'Солнечная панель HAVEL 340' },
  'INV-H6': { cat: 'Инверторы', name: 'Гибридный инвертор GD6248SMH' },
  'INV-G10': { cat: 'Инверторы', name: 'Сетевой SMARTWATT GRID G2, 6 кВт' },
  'BAT-LFP-100': { cat: 'Аккумуляторы', name: 'Аккумуляторная батарея WINDSOLAR LFP Smart BLOCK 12V 100AH (100AH / 12.8V / 1280WH / BMS)' },
  'CTRL-60': { cat: 'Контроллеры', name: 'Контроллер КЭС DOMINATOR MPPT 200/100' },
  'CAB-6R': { cat: 'Защита и соединения', name: 'Кабель для СЭС PV-1F 2х4 мм2' },
  'CAB-6B': { cat: 'Защита и соединения', name: 'Провод ПуГВнг(А)-LS 1х25 бел Кабэкс ГОСТ' },
  'MC4': { cat: 'Защита и соединения', name: 'Коннектор MC4 AB (комплект из двух разъемов)' },
  'MNT-R4': { cat: 'Защита и соединения', name: 'Комплект крепления MAX для четырех панелей изменением угла наклона 0.5 метр' },
  'BOX-DC': { cat: 'Защита и соединения', name: 'Бокс HT8WAY' },
  'MTR-3F': { cat: 'Защита и соединения', name: 'Токоизмерительные клещи SPLIT CORE CTSA016 на 100 А / 50 mA' },
  'WND-3K': { cat: 'Инверторы', name: 'Гибридный инвертор ASTERION INV ECO II 1.5 кВт (1500W / 12V / PV 900W 30-160V / MPPT 60A)' },
};
SEEDS.push(st => {
  const built = Catalog.build(CATALOG, STOCK_SNAPSHOT);
  Object.assign(st, Stock.defaults(), { products: built.products, stock: built.stock, aside: built.aside });
  const pick = ({ cat, name }) => st.products.find(p => p.cat === cat && Catalog.norm(p.name) === Catalog.norm(name))
    || st.products.find(p => p.cat === cat);
  const link = Object.fromEntries(Object.entries(DEMO_LINKS).map(([sku, rule]) => [sku, pick(rule).id]));
  const fix = id => link[id] || id;
  // поставки: юрлицо и город (демо), позиции — настоящие товары
  for (const s of st.shipments) {
    s.entityId = s.entityId || 'ip'; s.cityId = s.cityId || 'irk';
    for (const it of s.items) it.productId = fix(it.productId);
  }
  // резервы: со склада — из клетки, где больше свободного; под поставку — юрлицо и город поставки
  for (const r of st.reserves) r.productId = fix(r.productId);
  const cells = st.reserves.map(r => (r.src === 'stock' ? Stock.bestCell(st, r.productId) : null));
  st.reserves.forEach((r, i) => {
    const ship = r.src === 'stock' ? null : st.shipments.find(s => s.id === r.src);
    r.entityId = cells[i] ? cells[i].entityId : (ship ? ship.entityId : Stock.ANY);
    r.cityId = cells[i] ? cells[i].cityId : (ship ? ship.cityId : Stock.ANY);
  });
  // движения: товар и клетка склада
  for (const m of st.moves) {
    m.productId = fix(m.productId);
    const cell = Stock.bestCell(st, m.productId);
    m.entityId = cell.entityId; m.cityId = cell.cityId;
  }
});

// Ядро: заявки на отправку. Кому, куда, телефон, когда и что именно — их создаёт любой сотрудник, исполняют логист,
// кладовщик и водитель (право dispatch). Этап хранится по id этапа воронки отправок (вид dispatch), ход заявки пишется
// в общую ленту (Feed), уведомления — через Notify. Склад трогают только два действия:
//   • перемещение между складами (цель transfer): товар уходит из клетки «откуда» при «В пути» и приходит в клетку «куда»
//     при «Доставлена»; пока он в пути, Stock.incomingOf считает его приходом на склад-получатель (Dispatch.transit);
//   • списание проданного (Dispatch.sell → Stock.sell) — по праву sell, с отметкой на строке заявки.
// «Продажа» и «Другое» смена этапа склад не меняет.
// Чистые функции над состоянием st; время приходит параметром now (Date), кто делает — by (id сотрудника). Без DOM и S.
//
// Заявка st.dispatches[]: {id, number (оба — 'ОТ-NNN'), at, by, purpose:'sale'|'transfer'|'other', to:{name, phone}, address,
//   when:{date (Date, начало дня), from?, till? ('ЧЧ:ММ')}, items:[{productId?|text, qty, picked?, sold?:{at, by, entityId, cityId}}],
//   files:[{id, name, type, size, data|null, unsaved?}], note, driverId?, dealId?, pipeId, stageId, demo?,
//   у перемещения: from:{entityId, cityId}, toCell:{entityId, cityId}, moved? (списано из «откуда»), landed? (пришло в «куда»)}.
// Груз перемещения: moved && !landed — «в пути»; landed — лежит в «куда»; иначе лежит в «откуда».

const Dispatch = (() => {
  const PIPE = 'dispatch';
  // Id этапов воронки отправок по умолчанию. Логика ходит по этим id и по порядку этапов, не по названиям.
  const ST = { new: 'new', picking: 'picking', ready: 'ready', onWay: 'onWay', delivered: 'delivered', cancelled: 'cancelled' };
  const PURPOSE = { sale: 'Продажа', transfer: 'Перемещение между складами', other: 'Другое' };
  // Что не заполнено: ключ в missing → как назвать на экране.
  const MISSING = { name: 'получатель', address: 'адрес', phone: 'телефон', date: 'дата', items: 'список (хотя бы одна строка)', from: 'склад «откуда»', toCell: 'склад «куда»' };
  const NO_ADDRESS = 'нет данных: адрес';
  // Вид уведомления о ходе заявки (этап, водитель): получатель задан при отправке, постоянных адресатов нет.
  const STEP_KIND = 'dispatchStep';

  const str = v => String(v == null ? '' : v).trim();
  const fail = (reason, extra) => Object.assign({ ok: false, reason }, extra);
  const personOf = (st, id) => (st.people || []).find(p => p.id === id) || null;
  const personName = (st, id) => (personOf(st, id) || {}).name || 'нет данных: сотрудник';
  const byId = (st, id) => (st.dispatches || []).find(d => d.id === id) || null;
  const productOf = (st, id) => (st.products || []).find(p => p.id === id) || null;
  const lineName = (st, it) => (it.productId ? (productOf(st, it.productId) || {}).name || 'нет данных: товар' : it.text);
  const ref = d => ({ t: 'dispatch', id: d.id });
  const dateKey = v => { const n = new Date(v); return isNaN(n.getTime()) ? '' : n.getFullYear() + '-' + (n.getMonth() + 1) + '-' + n.getDate(); };
  const sum = (list, f) => list.reduce((a, x) => a + f(x), 0);

  // ——— воронка ———
  const pipeOf = (st, d) => (st.pipelines || []).find(p => p.id === d.pipeId) || null;
  const stagesOf = (st, d) => (pipeOf(st, d) || { stages: [] }).stages;
  const posOf = (st, d, stageId) => stagesOf(st, d).findIndex(s => s.id === stageId);
  const stageName = (st, d, stageId) => (Pipes.stage(st, d.pipeId, stageId) || {}).name || 'нет данных: этап';
  // С чего заявка начинает: первый этап воронки («Новая»).
  const firstStage = (st, d) => (stagesOf(st, d)[0] || {}).id;
  // Номер этапа, с которого груз «в пути»: «В пути»; нет такого этапа (директор удалил) — «Доставлена».
  function wayPos(st, d) {
    const w = posOf(st, d, ST.onWay);
    return w >= 0 ? w : (posOf(st, d, ST.delivered) >= 0 ? posOf(st, d, ST.delivered) : stagesOf(st, d).length);
  }
  const isFinal = (st, d) => Pipes.isFinal(st, d.pipeId, d.stageId);

  // ——— права ———
  // Вести отправки: двигать этапы, назначать водителя, отмечать «собрано». Только по праву dispatch.
  const canWork = (st, personId) => !!personOf(st, personId) && Perms.can(st, personId, 'dispatch');
  const isAuthor = (d, personId) => !!d && !!personId && d.by === personId;
  // Править заявку: с правом — всегда, автор без права — пока этап первый («Новая»).
  const canEdit = (st, personId, d) => !!d && (canWork(st, personId) || (isAuthor(d, personId) && d.stageId === firstStage(st, d)));
  // Отменить: с правом — пока не отменена, автор без права — до «В пути».
  const canCancel = (st, personId, d) => !!d && d.stageId !== ST.cancelled
    && (canWork(st, personId) || (isAuthor(d, personId) && !isFinal(st, d) && posOf(st, d, d.stageId) < wayPos(st, d)));
  // Писать в ленту заявки: любой сотрудник — раздел видят все, значит и обсуждать заявку может каждый, кто её видит.
  const canComment = (st, personId, d) => !!d && !!personOf(st, personId);
  const canSell = (st, personId) => !!personOf(st, personId) && Perms.can(st, personId, 'sell');

  // ——— перемещение: где груз ———
  const isTransfer = d => d.purpose === 'transfer';
  // Груз перемещения уже ушёл из «откуда» и ещё не пришёл в «куда».
  const inTransit = d => isTransfer(d) && d.moved === true && d.landed !== true;
  // Единственное определение «в пути» для остатков: Stock.incomingOf берёт отсюда.
  // → [{dispatchId, number, qty, eta (дата отправки заявки), entityId, cityId (склад-получатель)}], по одной записи на заявку.
  function transit(st, productId) {
    const out = [];
    for (const d of st.dispatches || []) {
      if (!inTransit(d) || !d.toCell) continue;
      const qty = sum((d.items || []).filter(i => i.productId === productId), i => i.qty);
      if (qty > 0) out.push({ dispatchId: d.id, number: d.number, qty, eta: d.when && d.when.date, entityId: d.toCell.entityId, cityId: d.toCell.cityId });
    }
    return out;
  }
  const cellText = (st, c) => `«${Stock.entityName(st, c.entityId) ?? c.entityId}, ${Stock.cityName(st, c.cityId) ?? c.cityId}»`;
  // Строки каталога, по продуктам (две строки одного товара складываются).
  function needs(d) {
    const m = new Map();
    for (const it of d.items || []) if (it.productId) m.set(it.productId, (m.get(it.productId) || 0) + it.qty);
    return m;
  }
  // Адрес склада-получателя: адрес города, а нет его — «нет данных: адрес».
  function warehouseAddress(st, cell) {
    const c = (st.cities || []).find(x => x.id === (cell && cell.cityId));
    return (c && str(c.address)) || NO_ADDRESS;
  }

  // Движение товара перемещения. Все три — через Stock.move; журнал пишет doc = номер заявки.
  // Уйти из «откуда»: сначала проверка по всем товарам, потом списание — отказ ничего не меняет.
  // Зарезервированное под клиента перемещение не забирает: берёт не больше Stock.sellMax — «остаток клетки − резервы на неё».
  function withdraw(st, d, by, now) {
    const short = [];
    for (const [productId, need] of needs(d)) {
      const lies = Stock.grid(st, productId).cell(d.from.entityId, d.from.cityId) ?? 0;
      const have = Stock.sellMax(st, { productId, entityId: d.from.entityId, cityId: d.from.cityId });
      if (need > have) short.push({ productId, name: (productOf(st, productId) || {}).name || 'нет данных: товар', need, have, held: lies - have });
    }
    if (short.length) {
      const list = short.map(x => (x.held > 0
        ? `${x.name} — нужно ${x.need}, свободно ${x.have} (лежит ${x.have + x.held}, под резервом ${x.held})`
        : `${x.name} — нужно ${x.need}, есть ${x.have}`)).join('; ');
      short.forEach(x => { if (!x.held) delete x.held; });
      return fail(`Не хватает на складе ${cellText(st, d.from)}: ${list}. Этап не изменён.`, { short });
    }
    for (const it of d.items) {
      if (!it.productId) continue;
      Stock.move(st, { kind: Stock.KINDS.ship, productId: it.productId, qty: it.qty, entityId: d.from.entityId, cityId: d.from.cityId, doc: d.number, by, at: now });
    }
    d.moved = true;
    return { ok: true };
  }
  // Положить груз в клетку: «куда» (пришёл) или «откуда» (вернули).
  function putBack(st, d, cell, by, now) {
    for (const it of d.items) {
      if (!it.productId) continue;
      Stock.move(st, { kind: Stock.KINDS.receive, productId: it.productId, qty: it.qty, entityId: cell.entityId, cityId: cell.cityId, doc: d.number, by, at: now });
    }
  }

  // Что должно стать с грузом перемещения при переходе на этап: 'cell' (в «откуда»), 'way' (в пути), 'dest' (в «куда»).
  const placeNow = d => (d.landed ? 'dest' : d.moved ? 'way' : 'cell');
  function placeFor(st, d, stageId) {
    if (stageId === ST.cancelled) return placeNow(d) === 'dest' ? 'dest' : 'cell';
    if (stageId === ST.delivered) return 'dest';
    return posOf(st, d, stageId) >= wayPos(st, d) ? 'way' : 'cell';
  }

  // Применить этап к грузу перемещения. → {ok, note?} | {ok:false, reason, short?}. Заявку не трогает, кроме moved/landed.
  function moveGoods(st, d, stageId, by, now) {
    if (!isTransfer(d)) return { ok: true };
    const from = placeNow(d), to = placeFor(st, d, stageId);
    const after = !!d.landed && stageId === ST.cancelled;
    if (from === 'dest' && to !== 'dest') {
      return fail(`Товар уже доставлен на склад ${cellText(st, d.toCell)}: вернуть его можно только обратной заявкой.`);
    }
    if (from === to) return { ok: true, note: after ? 'Товар уже на складе: движение не откатывается — нужна обратная заявка.' : '' };
    if (from === 'cell') {
      const w = withdraw(st, d, by, now);
      if (!w.ok) return w;
    }
    if (to === 'dest') { putBack(st, d, d.toCell, by, now); d.landed = true; return { ok: true, note: `Товар пришёл на склад ${cellText(st, d.toCell)}.` }; }
    if (to === 'cell') { putBack(st, d, d.from, by, now); d.moved = false; return { ok: true, note: `Товар вернулся на склад ${cellText(st, d.from)}.` }; }
    return { ok: true, note: `Товар ушёл со склада ${cellText(st, d.from)} и числится в пути на склад ${cellText(st, d.toCell)}.` };
  }

  // ——— разбор введённых данных ———
  const toDate = v => {
    if (v == null || v === '') return null;
    const m = typeof v === 'string' && v.trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    const n = new Date(v);
    return isNaN(n.getTime()) ? null : new Date(n.getFullYear(), n.getMonth(), n.getDate());
  };
  const hhmm = v => (/^([01]\d|2[0-3]):[0-5]\d$/.test(str(v)) ? str(v) : '');
  // Клетка склада из введённого. «Откуда» может быть клеткой с «нет данных» ('_' — юрлицо или город в таблице остатков не указаны):
  // в таблице менеджеров города у остатков нет. «Куда» — всегда настоящие юрлицо и город из справочника.
  const cellOf = (st, c, anyOk) => {
    const e = str(c && c.entityId), k = str(c && c.cityId);
    const okE = (st.entities || []).some(x => x.id === e) || (anyOk && e === Stock.ANY);
    const okK = (st.cities || []).some(x => x.id === k) || (anyOk && k === Stock.ANY);
    return okE && okK ? { entityId: e, cityId: k } : null;
  };

  // Строки списка: товар каталога (productId) или свой текст (text), у каждой целое количество ≥ 1.
  // Пустая строка формы (ни товара, ни текста) пропускается; строка с товаром без количества — ошибка всего списка.
  function cleanItems(st, list) {
    const items = [];
    let bad = false;
    for (const it of Array.isArray(list) ? list : []) {
      const pid = str(it && it.productId), text = str(it && it.text);
      if (!pid && !text) continue;
      const qty = Number(it.qty);
      if (!Number.isInteger(qty) || qty < 1 || (pid && !productOf(st, pid))) { bad = true; continue; }
      const row = pid ? { productId: pid, qty } : { text, qty };
      if (it.picked === true) row.picked = true;
      // отметку «списано» с данными не принимаем: её ставит только sell, а update переносит со старой строки
      items.push(row);
    }
    return { items, bad };
  }
  function cleanFiles(st, list, existing) {
    const used = [...(existing || [])];
    const out = [];
    for (const f of Array.isArray(list) ? list : []) {
      if (!f || !str(f.name)) continue;
      const file = { id: f.id || Store.freeId(used, 'fl'), name: str(f.name), type: str(f.type), size: Number(f.size) || 0, data: typeof f.data === 'string' && f.data ? f.data : null };
      if (f.unsaved) file.unsaved = true;
      used.push(file);
      out.push(file);
    }
    return out;
  }

  // Введённое → запись заявки без служебных полей. → {rec} | {missing:[ключ…], reason}
  function normalize(st, data, current) {
    const d = data || {};
    const purpose = d.purpose == null || d.purpose === '' ? 'sale' : d.purpose;
    if (!PURPOSE[purpose]) return { missing: [], reason: 'Неизвестная цель отправки.' };
    const missing = [];
    const name = str(d.to && d.to.name), phone = str(d.to && d.to.phone);
    if (!name) missing.push('name');
    let address = str(d.address);
    const date = toDate(d.when && d.when.date);
    const it = cleanItems(st, d.items);
    let from = null, toCell = null, reason = '';
    if (purpose === 'transfer') {
      from = cellOf(st, d.from, true); toCell = cellOf(st, d.toCell, false);
      if (!from) missing.push('from');
      if (!toCell) missing.push('toCell');
      if (from && toCell && from.entityId === toCell.entityId && from.cityId === toCell.cityId) {
        missing.push('toCell'); reason = 'Склад «откуда» и склад «куда» совпадают.';
      }
      // адрес перемещения — адрес склада-получателя; без него — «нет данных: адрес»
      if (!address && toCell) address = warehouseAddress(st, toCell);
      if (!address) address = NO_ADDRESS;
    } else if (!address) missing.push('address');
    if (phone.replace(/\D/g, '').length < 5) missing.push('phone');
    if (!date) missing.push('date');
    if (!it.items.length || it.bad) { missing.push('items'); if (it.bad) reason = reason || 'В списке есть строка без количества или с неизвестным товаром.'; }
    let dealId = str(d.dealId);
    if (dealId && !(st.deals || []).some(x => x.id === dealId)) return { missing: [], reason: `Сделки ${dealId} нет.` };
    // новый файл с данными больше предела (Store.FILE_MAX) — отказ; уже сохранённые файлы заявки и файлы без данных
    // (не поместились в браузер) места не занимают и не проверяются
    const had = new Set(((current && current.files) || []).map(f => f.id));
    const big = (Array.isArray(d.files) ? d.files : []).filter(f => f && !had.has(f.id) && typeof f.data === 'string' && f.data).map(Store.fileTooBig).find(Boolean);
    if (big) return { missing: [], reason: big };
    if (missing.length) {
      return { missing, reason: reason || `Не заполнено: ${missing.map(k => MISSING[k]).join(', ')}.` };
    }
    const when = { date };
    if (hhmm(d.when && d.when.from)) when.from = hhmm(d.when.from);
    if (hhmm(d.when && d.when.till)) when.till = hhmm(d.when.till);
    const rec = {
      purpose, to: { name, phone }, address, when, items: it.items,
      files: cleanFiles(st, d.files, current && current.files), note: str(d.note),
    };
    if (purpose === 'transfer') { rec.from = from; rec.toCell = toCell; }
    if (dealId) rec.dealId = dealId;
    return { rec };
  }

  // ——— заявки ———
  // Следующий номер: больше всех выданных (удалять заявки нельзя, но номер от длины списка не берём).
  function nextNumber(st) {
    const used = (st.dispatches || []).map(d => Number(String(d.number).replace(/\D/g, '')) || 0);
    return 'ОТ-' + String(Math.max(0, ...used) + 1).padStart(3, '0');
  }
  function firstPipe(st) {
    const p = Pipes.of(st, PIPE)[0];
    return p ? { pipe: p, stage: p.stages.find(s => !s.flag) || p.stages[0] } : null;
  }

  // Создать заявку. Любой сотрудник может создать. data: {purpose, to:{name, phone}, address, when:{date, from?, till?},
  // items:[{productId?|text, qty}], files?, note?, from?, toCell? (перемещение), dealId?, demo?}.
  // Нет получателя, адреса, телефона, даты или списка — {ok:false, missing:[name|address|phone|date|items…]} и ничего не сохраняется.
  // opts.silent — без уведомлений (демо-данные). → {ok, id, missing, reason}
  function create(st, data, by, now, opts) {
    if (!personOf(st, by)) return fail('Нет такого сотрудника.', { id: null, missing: [] });
    const n = normalize(st, data, null);
    if (!n.rec) return fail(n.reason, { id: null, missing: n.missing });
    const start = firstPipe(st);
    if (!start) return fail('Нет воронки отправок.', { id: null, missing: [] });
    const number = nextNumber(st);
    const d = Object.assign({ id: number, number, at: now, by }, n.rec, { pipeId: start.pipe.id, stageId: start.stage.id });
    if (data && data.demo) d.demo = true;
    st.dispatches = st.dispatches || [];
    st.dispatches.push(d);
    const what = `${PURPOSE[d.purpose]}, кому: ${d.to.name}, на ${fD(d.when.date)}, ${d.items.length} ${pl(d.items.length, 'позиция', 'позиции', 'позиций')}`;
    Feed.add(st, ref(d), { kind: 'create', text: `Заявка создана: ${what}.`, by, at: now });
    if (!(opts && opts.silent)) Notify.push(st, 'dispatch', by, `Новая заявка на отправку ${d.number}: ${what}. Создал: ${personName(st, by)}.`, now);
    return { ok: true, id: d.id, missing: [], reason: '' };
  }

  // Заявка → данные в форме create (для правки и для проверки того, что менять нельзя).
  const snapshot = d => ({
    purpose: d.purpose, to: { ...d.to }, address: d.address, when: { ...d.when }, items: d.items.map(i => ({ ...i })),
    files: d.files.map(f => ({ ...f })), note: d.note, from: d.from, toCell: d.toCell, dealId: d.dealId,
  });

  // Править заявку: data сливается с тем, что уже есть, и проверяется как при создании. Нужно canEdit.
  // Пока товар перемещения не вернулся на склад «откуда» (он в пути или доставлен), цель, склады и товары менять нельзя.
  // → {ok, missing, reason}
  function update(st, id, data, by, now) {
    const d = byId(st, id);
    if (!d) return fail('Такой заявки нет.', { missing: [] });
    if (!canEdit(st, by, d)) return fail('Править заявку нельзя: она уже в работе, а у вас нет права вести отправки.', { missing: [] });
    const merged = Object.assign(snapshot(d), data || {});
    const n = normalize(st, merged, d);
    if (!n.rec) return fail(n.reason, { missing: n.missing });
    if (d.moved && (n.rec.purpose !== d.purpose || JSON.stringify(n.rec.items.map(i => [i.productId, i.text, i.qty])) !== JSON.stringify(d.items.map(i => [i.productId, i.text, i.qty]))
      || JSON.stringify(n.rec.from) !== JSON.stringify(d.from) || JSON.stringify(n.rec.toCell) !== JSON.stringify(d.toCell))) {
      return fail('Товар перемещения уже списан со склада: цель, склады и список менять нельзя. Верните заявку на этап до «В пути» или отмените её.', { missing: [] });
    }
    // списанная при продаже строка остаётся как была: товар, текст и количество не меняются, удалить её нельзя
    // (иначе в заявке «списано 50», а в журнале склада «Отгрузка 2»); строки выше и ниже править можно
    const taken = new Set();
    for (const old of d.items.filter(i => i.sold)) {
      const k = n.rec.items.findIndex((row, i) => !taken.has(i) && !row.sold && row.productId === old.productId && row.text === old.text && row.qty === old.qty);
      if (k < 0) return fail(`Строка «${lineName(st, old)}» уже списана при продаже (${num(old.qty)}): изменить или удалить её нельзя. Нужно больше — добавьте новую строку.`, { missing: [] });
      taken.add(k);
      n.rec.items[k].sold = old.sold;
      if (old.picked) n.rec.items[k].picked = true;
    }
    // отметка «собрано» остаётся у тех строк, что не менялись
    n.rec.items.forEach((row, i) => {
      const old = d.items[i];
      if (!taken.has(i) && old && !old.sold && old.productId === row.productId && old.text === row.text && old.picked) row.picked = true;
    });
    Object.assign(d, n.rec);
    if (d.purpose !== 'transfer') { delete d.from; delete d.toCell; }
    if (!n.rec.dealId) delete d.dealId;
    Feed.add(st, ref(d), { kind: 'field', text: `Заявка изменена: ${personName(st, by)}.`, by, at: now });
    return { ok: true, missing: [], reason: '' };
  }

  // ——— ход заявки ———
  // Перевести заявку на этап. Двигать этапы можно с правом dispatch; отменить — ещё и автору до «В пути».
  // У перемещения склад меняется вместе с этапом (см. шапку); не хватает товара в «откуда» — этап не меняется,
  // в ответе short:[{productId, name, need, have}]. → {ok, from, to, note} | {ok:false, reason, short?}
  // opts.silent — без уведомлений (демо-данные).
  function setStage(st, id, stageId, by, now, opts) {
    const d = byId(st, id);
    if (!d) return fail('Такой заявки нет.');
    if (!Pipes.stage(st, d.pipeId, stageId)) return fail('Такого этапа в воронке нет.');
    if (d.stageId === stageId) return fail('Заявка уже на этом этапе.');
    if (stageId === ST.cancelled ? !canCancel(st, by, d) : !canWork(st, by)) {
      return fail(stageId === ST.cancelled ? 'Отменить заявку может автор до «В пути» или тот, кто ведёт отправки.' : 'Двигать этапы могут только те, кто ведёт отправки.');
    }
    const g = moveGoods(st, d, stageId, by, now);
    if (!g.ok) return g;
    const from = d.stageId;
    d.stageId = stageId;
    const text = `Этап: «${stageName(st, d, from)}» → «${stageName(st, d, stageId)}».${g.note ? ' ' + g.note : ''}`;
    Feed.add(st, ref(d), { kind: 'stage', text, by, at: now, data: { from, to: stageId } });
    if (!(opts && opts.silent)) {
      // автору — каждая смена этапа его заявки, кроме тех, что он сделал сам. Вид STEP_KIND без постоянных адресатов
      // (Notify.RECIPIENTS): логист и кладовщик новую заявку получают, а ход каждой — нет. Некому слать — записи нет.
      const extra = d.by && d.by !== by ? [d.by] : [];
      if (extra.length) Notify.push(st, STEP_KIND, by, `${d.number} (${d.to.name}): ${personName(st, by)} перевёл заявку на этап «${stageName(st, d, stageId)}».${g.note ? ' ' + g.note : ''}`, now, extra);
    }
    return { ok: true, from, to: stageId, note: g.note || '' };
  }

  // Назначить водителя (driverId пустой — снять). Водитель — любой сотрудник с правом dispatch. Нужно canWork.
  // Водителю приходит уведомление. → {ok, reason}
  function assign(st, id, driverId, by, now, opts) {
    const d = byId(st, id);
    if (!d) return fail('Такой заявки нет.');
    if (!canWork(st, by)) return fail('Назначать водителя могут только те, кто ведёт отправки.');
    const to = str(driverId);
    if (to && !canWork(st, to)) return fail('Водителем можно назначить только сотрудника, который ведёт отправки.');
    if ((d.driverId || '') === to) return fail(to ? 'Этот водитель уже назначен.' : 'Водитель и так не назначен.');
    if (to) d.driverId = to; else delete d.driverId;
    Feed.add(st, ref(d), { kind: 'field', text: to ? `Водитель: ${personName(st, to)}.` : 'Водитель снят.', by, at: now });
    if (to && !(opts && opts.silent)) {
      Notify.push(st, STEP_KIND, by, `Вам назначена отправка ${d.number}: ${d.to.name}, ${d.address}, на ${fD(d.when.date)}.`, now, [to]);
    }
    return { ok: true, reason: '' };
  }

  // Водители: сотрудники с ролью «Водитель» (роль встроенная). Для списка выбора и фильтра.
  const drivers = st => (st.people || []).filter(p => p.role === 'driver');

  // Отметить строку собранной (done=true) или снять отметку. Нужно canWork; закрытую заявку не трогаем.
  function pick(st, id, lineIdx, done, by, now) {
    const d = byId(st, id);
    if (!d) return fail('Такой заявки нет.');
    if (!canWork(st, by)) return fail('Отмечать «собрано» могут только те, кто ведёт отправки.');
    const it = d.items[lineIdx];
    if (!it) return fail('Такой строки нет.');
    if (isFinal(st, d)) return fail('Заявка закрыта: отметки менять нельзя.');
    if (!!it.picked === !!done) return { ok: true, reason: '' };
    if (done) it.picked = true; else delete it.picked;
    const p = picked(d);
    Feed.add(st, ref(d), { kind: 'item', text: `${done ? 'Собрано' : 'Снята отметка'}: ${lineName(st, it)} — ${num(it.qty)}. Собрано ${p.done} из ${p.total}.`, by, at: now });
    return { ok: true, reason: '' };
  }
  // «Собрано N из M»: строк с отметкой и всего строк. Единственный счёт для карточки и таблицы.
  const picked = d => ({ done: (d.items || []).filter(i => i.picked).length, total: (d.items || []).length });

  // Комментарий в ленту заявки: любой сотрудник. → {ok, entry, reason}
  function comment(st, id, text, by, now) {
    const d = byId(st, id);
    if (!d) return fail('Такой заявки нет.', { entry: null });
    if (!str(text)) return fail('Напишите комментарий.', { entry: null });
    if (!canComment(st, by, d)) return fail('Писать в ленту могут только сотрудники.', { entry: null });
    const entry = Feed.add(st, ref(d), { kind: 'comment', text, by, at: now });
    return entry ? { ok: true, entry, reason: '' } : fail('Не удалось записать комментарий.', { entry: null });
  }

  // Списать при продаже строку заявки «Продажа»: Stock.sell из клетки {entityId, cityId} (или по резерву reserveId),
  // на строке — отметка «списано: кто, когда, откуда». Нужно право sell. → то же, что Stock.sell
  function sell(st, id, lineIdx, opt, by, now) {
    const d = byId(st, id);
    if (!d) return fail('Такой заявки нет.');
    if (d.purpose !== 'sale') return fail('Списывать при продаже можно только в заявке с целью «Продажа».');
    const it = d.items[lineIdx];
    if (!it) return fail('Такой строки нет.');
    if (!it.productId) return fail('Строка своим текстом склад не трогает: списывать нечего.');
    if (it.sold) return fail('Эта строка уже списана.');
    const o = opt || {};
    // по резерву: лента сделки помнит резерв, даже когда списание снимет его целиком
    if (o.reserveId) Deals.keepTrail(st, (st.reserves || []).find(x => x.id === o.reserveId));
    const r = Stock.sell(st, { productId: it.productId, qty: it.qty, entityId: o.entityId, cityId: o.cityId, reserveId: o.reserveId, doc: d.number }, by, now);
    if (!r.ok) return r;
    it.sold = { at: now, by, entityId: r.move.entityId, cityId: r.move.cityId };
    Feed.add(st, ref(d), { kind: 'item', text: `Списано при продаже: ${lineName(st, it)} — ${num(it.qty)} со склада ${cellText(st, it.sold)}.`, by, at: now });
    return r;
  }
  // «списано: кто, когда, откуда» — одна фраза для карточки и таблицы
  const soldText = (st, it) => (it.sold ? `списано: ${personName(st, it.sold.by)}, ${fWhen(it.sold.at)}, ${cellText(st, it.sold)}` : '');

  // ——— отбор для списка и воронки ———
  // filter: {q (номер, получатель, адрес), stage (id), mine (автор или водитель personId), today (на сегодня по now), driver (id), personId, now}.
  // Сначала открытые — по дате отправки, ближайшие первыми; затем закрытые — свежие первыми.
  function query(st, filter) {
    const f = filter || {};
    const words = Catalog.norm(f.q).split(' ').filter(Boolean);
    const rows = (st.dispatches || []).filter(d =>
      (!f.stage || d.stageId === f.stage)
      && (!f.mine || d.by === f.personId || d.driverId === f.personId)
      && (!f.today || (f.now && dateKey(d.when.date) === dateKey(f.now)))
      && (!f.driver || d.driverId === f.driver)
      && (!words.length || words.every(w => Catalog.norm([d.number, d.to.name, d.address].join(' ')).includes(w))));
    const t = d => new Date(d.when.date).getTime();
    return rows.map(d => ({ d, fin: isFinal(st, d) }))
      .sort((a, b) => (a.fin - b.fin) || (a.fin ? t(b.d) - t(a.d) : t(a.d) - t(b.d)) || (a.d.number < b.d.number ? -1 : 1))
      .map(x => x.d);
  }

  return {
    PIPE, ST, STEP_KIND, PURPOSE, MISSING, NO_ADDRESS, byId, create, update, canWork, canEdit, canCancel, canComment, canSell,
    setStage, assign, drivers, pick, picked, comment, sell, soldText, query, transit, inTransit, warehouseAddress, lineName,
  };
})();

// Этапы воронки отправок, на которые опирается логика по id: Pipes.removeStage их не удаляет, их можно только переименовать.
Pipes.guard(Dispatch.PIPE, pipe => {
  const g = {
    [Dispatch.ST.onWay]: 'с него товар перемещения уходит со склада, и от него отмена уже не простая',
    [Dispatch.ST.delivered]: 'на нём товар перемещения приходит на склад',
    [Dispatch.ST.cancelled]: 'на нём заявку отменяют, а товар возвращается на склад',
  };
  g[(pipe.stages.find(s => !s.flag) || pipe.stages[0]).id] = 'сюда встаёт каждая новая заявка';
  g[pipe.stages[0].id] = 'с него начинается каждая заявка, и автор правит её, пока она здесь';
  return g;
});

// ——— демо-данные ———
// Подпись и значок вида уведомлений «Отправки» (KIND объявлен в 20-model.js).
KIND.dispatch = { l: 'Отправки', ic: 'truck', c: 'info' };
KIND.dispatchStep = { l: 'Ход отправок', ic: 'truck', c: 'info' };

// Шаг SEEDS: встроенная роль «Водитель» (право dispatch; цен, сделок и остатков ей не положено), два демо-водителя,
// воронка отправок и 20 демо-заявок «пример» на разных этапах и с разными целями. Получатели, адреса и телефоны явно
// выдуманные («Клиент-пример 3», «(пример)», +7 900 000-00-NN). Строки — настоящие товары каталога.
// Демо-перемещения не доходят дальше «Готова к отправке»: «В пути» увозит товар из клетки, а демо не должно менять
// настоящий снимок остатков — сразу после «Сбросить» остатки равны Catalog.build(снимок).
// Заявки заводятся теми же функциями, что и в работе, но без уведомлений (silent).
SEEDS.push(st => {
  const perms = on => Object.fromEntries(Perms.LIST.map(([k]) => [k, on.includes(k)]));
  st.roles.push({ id: 'driver', name: 'Водитель', builtin: true, perms: perms(['dispatch']) });
  // РОП (роль заводит шаг лидов, 35-leads.js) списывает при продаже, как менеджеры
  const rop = st.roles.find(r => r.id === 'rop');
  if (rop) rop.perms.sell = true;
  const driverIds = ['Роман Е.', 'Василий Т.'].map(name => {
    const p = { id: Store.freeId(st.people, 'p'), name, role: 'driver', dept: 'logistics', demo: true };
    st.people.push(p);
    return p.id;
  });
  st.pipelines.push({ id: Dispatch.PIPE, kind: 'dispatch', name: 'Отправки', stages: [
    { id: 'new', name: 'Новая' }, { id: 'picking', name: 'Собирается' }, { id: 'ready', name: 'Готова к отправке' },
    { id: 'onWay', name: 'В пути' }, { id: 'delivered', name: 'Доставлена', flag: 'final' }, { id: 'cancelled', name: 'Отменена', flag: 'final' },
  ] });
  st.dispatches = [];

  const pad = (n, w) => String(n).padStart(w, '0');
  const catalog = st.products.filter(p => p.inCatalog);
  // клетка для перемещений: «ИП, город не указан» (так лежит большинство остатков в таблице менеджеров);
  // берём товары, у которых там не меньше 6, сначала товары каталога, потом позиции таблицы менеджеров
  const FROM = { entityId: 'ip', cityId: Stock.ANY };
  const have = p => Stock.grid(st, p.id).cell(FROM.entityId, FROM.cityId) ?? 0;
  // позиции с небольшим остатком (от 6): большие партии из таблицы менеджеров демо-перемещения не трогают
  const movable = [...catalog, ...st.products.filter(p => !p.inCatalog)].filter(p => have(p) >= 6 && have(p) <= 30).sort((x, y) => have(x) - have(y));
  let used = 0;
  const TO = [{ entityId: 'ip', cityId: 'msk' }, { entityId: 'ip', cityId: 'krd' }, { entityId: 'npp', cityId: 'irk' }, { entityId: 'ip', cityId: 'irk' }];
  const TOWNS = ['г. Иркутск', 'г. Москва', 'г. Краснодар'];
  const NOTES = ['Пример примечания: позвонить за час до приезда.', 'Пример примечания: хрупкое, не кантовать.', 'Пример примечания: нужна машина с бортом.', ''];
  const DOC = text => ({ id: 'fl1', name: 'накладная-пример.txt', type: 'text/plain', size: text.length, data: 'data:text/plain;charset=utf-8,' + encodeURIComponent(text) });
  const path = ['new', 'picking', 'ready', 'onWay', 'delivered'];

  // [цель, автор, создана дней назад, этап, отправка через дней (0 — сегодня), водитель (номер в driverIds или -1), окно]
  const ROWS = [
    ['sale', 'p2', 6, 'delivered', -4, 0, ['10:00', '14:00']], ['sale', 'p3', 5, 'delivered', -3, 1, null],
    ['sale', 'p9', 4, 'cancelled', -2, -1, null], ['sale', 'p10', 3, 'onWay', 0, 0, ['09:00', '12:00']],
    ['sale', 'p2', 3, 'onWay', 0, 1, null], ['sale', 'p3', 2, 'ready', 0, 0, ['14:00', '18:00']],
    ['sale', 'p9', 2, 'picking', 0, -1, null], ['sale', 'p10', 1, 'picking', 1, -1, null],
    ['sale', 'p2', 1, 'new', 0, -1, ['11:00', '13:00']], ['sale', 'p3', 0, 'new', 2, -1, null],
    ['transfer', 'p6', 4, 'ready', 0, 0, null], ['transfer', 'p6', 3, 'ready', 1, 0, null],
    ['transfer', 'p5', 2, 'picking', 1, 1, null], ['transfer', 'p6', 2, 'ready', 1, -1, null],
    ['transfer', 'p5', 1, 'new', 3, -1, null], ['transfer', 'p6', 1, 'cancelled', -1, 0, null],
    ['other', 'p4', 3, 'delivered', -1, 1, null], ['other', 'p7', 1, 'ready', 0, 0, null],
    ['other', 'p1', 0, 'new', 1, -1, null], ['sale', 'p2', 0, 'picking', 0, -1, null],
  ];
  ROWS.forEach(([purpose, author, back, stage, off, drv, win], i) => {
    const k = i + 1, n = pad(k, 2);
    const at = day(-back, 9 + (k % 5), (k * 7) % 60);
    const later = j => new Date(at.getTime() + j * 7200000);
    const data = {
      purpose, demo: true,
      to: { name: `Клиент-пример ${k}`, phone: `+7 900 000-00-${n}` },
      address: `${TOWNS[k % TOWNS.length]}, ул. Примерная, ${k} (пример)`,
      when: { date: day(off, 0, 0) },
      items: [], note: NOTES[k % NOTES.length], files: k % 6 === 0 ? [DOC(`Накладная-пример к заявке ${k}. Демонстрационный файл.`)] : [],
    };
    if (win) { data.when.from = win[0]; data.when.till = win[1]; }
    if (purpose === 'transfer') {
      const to = TO[k % TO.length];
      data.from = FROM; data.toCell = to;
      data.to = { name: `Склад: ${Stock.entityName(st, to.entityId)}, ${Stock.cityName(st, to.cityId)}`, phone: `+7 900 000-00-${n}` };
      data.address = '';
      for (let j = 0; j < 2 && movable.length; j++) {
        const p = movable[used++ % movable.length];
        data.items.push({ productId: p.id, qty: Math.max(1, Math.min(2 + ((k + j) % 4), Math.floor(have(p) / 2))) });
      }
    } else if (purpose === 'other') {
      data.items.push({ text: `Образцы и документы (пример ${k})`, qty: 1 }, { text: 'Упаковка (пример)', qty: 2 });
    } else {
      const lines = 1 + (k % 3);
      for (let j = 0; j < lines; j++) data.items.push({ productId: catalog[(k * 17 + j * 29) % catalog.length].id, qty: [1, 2, 3, 4, 6, 10][(k + j) % 6] });
      // две заявки на продажу — из сделок: Clients.related показывает отправки клиента
      if (k === 4) data.dealId = 'Д-311';
      if (k === 5) data.dealId = 'Д-305';
    }
    const made = Dispatch.create(st, data, author, at, { silent: true });
    if (!made.ok) return;
    const driver = drv >= 0 ? driverIds[drv] : null;
    if (driver) Dispatch.assign(st, made.id, driver, 'p6', later(1), { silent: true });
    const d = Dispatch.byId(st, made.id);
    // отменённая заявка не дошла дальше «Собирается»
    const steps = stage === 'cancelled' ? 1 : path.indexOf(stage);
    for (let j = 1; j <= steps; j++) {
      if (j === 2) d.items.forEach((_, idx) => Dispatch.pick(st, d.id, idx, true, 'p5', later(j)));
      if (!Dispatch.setStage(st, d.id, path[j], j <= 2 ? 'p5' : (driver || 'p6'), later(j + 1), { silent: true }).ok) break;
      // кладовщик начал собирать: отмечена половина строк
      if (j === 1) d.items.slice(0, Math.floor(d.items.length / 2)).forEach((_, idx) => Dispatch.pick(st, d.id, idx, true, 'p5', later(j + 1)));
    }
    if (stage === 'cancelled') Dispatch.setStage(st, d.id, 'cancelled', purpose === 'transfer' ? 'p6' : author, later(6), { silent: true });
  });
});

// Ядро: клиенты. Клиент — отдельная карточка: человек или компания (ИНН), телефоны, почта, адрес, менеджер.
// Дубли ищет find: тот же ИНН, телефон (по цифрам) или почта. Лиды и сделки ссылаются на клиента (clientId),
// related собирает всё, что к нему относится. Права — Perms, видимость сделок и лидов — Leads, события — Feed.
// Чистые функции над состоянием st; время приходит параметром now (Date). Экран — 70-clients.js.

const Clients = (() => {
  const KIND = { person: 'человек', company: 'компания' };
  const str = v => String(v == null ? '' : v).trim();
  const digits = v => str(v).replace(/\D/g, '');

  // Телефон для сравнения: только цифры; «+7» и «8» в начале одиннадцатизначного номера — одно и то же.
  function phoneKey(v) {
    const d = digits(v);
    return d.length === 11 && (d[0] === '7' || d[0] === '8') ? d.slice(1) : d;
  }
  const emailKey = v => str(v).toLowerCase();
  const innKey = digits;

  // Телефоны из данных: список phones и/или одиночный phone; без пустых и без повторов (по цифрам).
  function phonesOf(data) {
    const seen = new Set(), out = [];
    for (const v of [...(Array.isArray(data.phones) ? data.phones : []), data.phone]) {
      const s = str(v), k = phoneKey(s);
      if (k && !seen.has(k)) { seen.add(k); out.push(s); }
    }
    return out;
  }

  const byId = (st, id) => (st.clients || []).find(c => c.id === id) || null;
  const personOf = (st, id) => (st.people || []).find(p => p.id === id) || null;

  // Насколько запись q совпала с клиентом: ИНН — 3, телефон — 2, почта — 1; 0 — не совпала.
  // q — {phone, phones, email, inn}: клиент, лид, сделка или то, что ввели в форме.
  function score(c, q) {
