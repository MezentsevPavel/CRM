// Раздел «Товары и остатки»: список всех позиций, карточка товара, резерв, журнал движений.
// Товары — Catalog (38-catalog.js), остатки и свободное — Stock.summary (33-stock.js): здесь только показ,
// ни одной своей формулы остатка. Подписи источников берутся из дат снимков (CATALOG, STOCK_SNAPSHOT).

// ——— общие подписи ———
const PAGE_SIZE=50;   // строк списка на странице: 434 строки сразу — это долгая отрисовка и длинная прокрутка
const MV_LIMIT=200;   // строк журнала на экране
const snapRu=s=>String(s).split('-').reverse().join('.');   // '2026-10-31' → '31.10.2026'
const noData=what=>`<span class="muted">нет данных: ${what}</span>`;
const priceNote=()=>`цена сайта, снимок ${snapRu(CATALOG.snapshot)}`;
const stockNote=()=>`таблица менеджеров, снимок ${snapRu(STOCK_SNAPSHOT.snapshot)}`;
const priceTxt=p=>p.price==null?noData('цена'):rub(p.price);
// В таблице менеджеров товара нет, резервов и поставок под него нет — остаток неизвестен, а не нулевой
const stockUnknown=k=>!k.known&&!(k.reservedStock+k.reservedIncoming)&&!k.incoming;
// Юрлицо и город в одну подпись; неизвестный id показывается как есть
const cellText=(e,c)=>`${Stock.entityName(S,e||Stock.ANY)??e} · ${Stock.cityName(S,c||Stock.ANY)??c}`;
const optionsHtml=(list,cur)=>list.map(([v,t])=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(t)}</option>`).join('');
const selField=(id,on,label,list,cur)=>`<div class="field"><label for="${id}">${label}</label><select id="${id}" class="inp" data-on="${on}">${optionsHtml(list,cur)}</select></div>`;

// ——— раздел: две вкладки, «Товары» и «Журнал движений» ———
function vStock(){
  const tab=S.ui.stockTab==='moves'?'moves':'goods';
  const tabs=`<div class="seg" role="tablist" aria-label="Раздел склада">${[['goods','Товары'],['moves','Журнал движений']].map(([k,l])=>`<button type="button" role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" data-act="stock-tab" data-tab="${k}">${l}</button>`).join('')}</div>`;
  return tab==='moves'?movesPane(tabs):goodsPane(tabs);
}

// ——— вкладка «Товары» ———
function goodsPane(tabs){
  const u=S.ui,cur=u.cat||'Все';
  const chips=['Все',...Catalog.cats(S)].map(c=>`<button type="button" class="fchip ${cur===c?'on':''}" data-act="stock-cat" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  const filters=[
    selField('f-brand','brand','Бренд',[['','Все бренды'],...Catalog.brands(S).map(b=>[b,b])],u.brand||''),
    selField('f-avail','avail','Наличие',[['','Любое наличие'],...[...new Set(S.products.map(p=>p.avail).filter(Boolean))].map(a=>[a,a])],u.avail||''),
    selField('f-catf','catf','Каталог',[['','В каталоге и нет'],['in','Только в каталоге'],['out','Только «нет в каталоге»']],u.catf||'')
  ].join('');
  return `<div class="bar">${tabs}<span class="grow"></span>${can('catalog')?`<button class="btn" data-act="new-product">${ic('plus')}Новый товар</button>`:''}</div>
  <div class="bar"><div class="search-in">${ic('search')}<input id="sq" class="inp" type="search" placeholder="Название, бренд или ключ каталога" value="${esc(u.sq)}" data-on="sq" aria-label="Поиск товара"></div>
  <label class="check"><input type="checkbox" id="deficit" data-on="deficit" ${u.deficit?'checked':''}> Только где не хватает</label></div>
  <div class="fgrid">${filters}</div>
  <div class="chips">${chips}</div>
  <section class="card clip"><div class="legend"><span><i class="lg f"></i>Свободно на складе</span><span><i class="lg r"></i>На складе в резерве</span><span><i class="lg w"></i>Едет к нам</span><span>«Свободно после прихода» = склад + в пути − все резервы</span></div><div id="stock-tbl">${stockTable()}</div></section>`;
}
function sbar(p,big){
  const k=stockOf(p.id),fn=Math.max(0,k.free),rs=Math.min(k.onHand,k.reservedStock),iq=k.incoming,tot=Math.max(1,fn+rs+iq),w=x=>(x/tot*100).toFixed(1)+'%';
  return `<div class="sbar ${big?'big':''}" title="Свободно ${num(fn)}, в резерве ${num(rs)}, в пути ${num(iq)}"><i class="f" style="width:${w(fn)}"></i><i class="r" style="width:${w(rs)}"></i><i class="w" style="width:${w(iq)}"></i></div>`;
}
// Позиции под поиском и фильтрами экрана (Catalog.query), затем «не хватает» — по Stock.summary
function stockRows(){
  const u=S.ui;
  const list=Catalog.query(S,{q:u.sq,cat:u.cat==='Все'?'':u.cat,brand:u.brand||'',avail:u.avail||'',inCatalog:u.catf==='in'?true:u.catf==='out'?false:undefined});
  // «не хватает»: с учётом поставок меньше нуля, либо остаток известен и свободного нет; без данных об остатке — не дефицит
  return u.deficit?list.filter(p=>{const k=stockOf(p.id);return k.freeAfter<0||(k.known&&k.free<=0)}):list;
}
function pagerHtml(page,pages){
  if(pages<2) return '';
  return `<div class="pager"><button type="button" class="btn sm" data-act="stock-page" data-page="${page-1}" ${page<1?'disabled':''}>← Назад</button><span class="muted sm">Страница <b>${page+1}</b> из <b>${pages}</b></span><button type="button" class="btn sm" data-act="stock-page" data-page="${page+1}" ${page>=pages-1?'disabled':''}>Вперёд →</button></div>`;
}
function stockRow(p,pr){
  const k=stockOf(p.id),ra=k.reservedStock+k.reservedIncoming,inc=Stock.incomingOf(S,p.id),fa=k.freeAfter,unk=stockUnknown(k),nd='<span class="muted">нет данных</span>';
  const key=p.inCatalog?`<span class="mono">${esc(p.id)}</span>`:'<span class="pill sun sm">нет в каталоге</span>';
  const meta=[p.brand,p.cat].filter(Boolean).map(esc).join(' · ');
  return `<tr class="click" data-act="open-product" data-pid="${esc(p.id)}" tabindex="0"><td><div class="pname"><span>${esc(p.name)}</span><small>${key}${meta?' · '+meta:''}</small></div></td><td class="num">${k.known?qtyOf(k.onHand,p):nd}</td><td class="num">${num(ra)}${k.reservedIncoming?`<small class="muted">${num(k.reservedIncoming)} под поставку</small>`:''}</td><td class="num free">${unk?nd:`<b class="${k.free<=0?'bad-t':''}">${num(k.free)}</b>`}</td><td>${k.incoming?`<span class="in-t">${qtyOf(k.incoming,p)}</span><small class="muted">ближайшая ${fD(k.nextEta)}${inc.length>1?` · ${inc.length} поставки`:''}</small>`:'<span class="muted">не ждём</span>'}</td><td class="num">${unk?nd:fa<0?`<span class="pill bad sm">не хватает ${num(-fa)}</span>`:num(fa)}</td>${pr?`<td class="num">${priceTxt(p)}</td>`:''}<td>${sbar(p)}</td></tr>`;
}
// Содержимое #stock-tbl: «показано N из M», страница таблицы, переключатель страниц
function stockTable(){
  const rows=stockRows(),all=S.products.length,pages=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));
  const page=Math.min(Math.max(0,parseInt(S.ui.page,10)||0),pages-1),from=page*PAGE_SIZE,part=rows.slice(from,from+PAGE_SIZE);
  const head=`<div class="count"><span>Показано <b>${rows.length}</b> из <b>${all}</b> позиций</span>${rows.length>PAGE_SIZE?`<span class="muted">строки ${from+1}–${from+part.length}</span>`:''}</div>`;
  if(!rows.length) return head+'<p class="empty">Ничего не нашлось. Проверьте фильтр или строку поиска.</p>';
  const pr=can('prices'),pg=pagerHtml(page,pages);
  return `${head}<div class="xs"><table class="tbl"><thead><tr><th>Товар</th><th class="num">На складе</th><th class="num">В резерве</th><th class="num">Свободно сейчас</th><th>Едет к нам</th><th class="num">Свободно после прихода</th>${pr?'<th class="num">Цена</th>':''}<th>Картина</th></tr></thead><tbody>${part.map(p=>stockRow(p,pr)).join('')}</tbody></table></div>${pg}`;
}
const refreshStock=()=>{S.ui.page=0;byId('stock-tbl').innerHTML=stockTable()};

// ——— журнал движений: слова и строки общие для вкладки и карточки товара ———
const moveSign=m=>m.kind===Stock.KINDS.receive?'+':(m.kind===Stock.KINDS.ship||m.kind===Stock.KINDS.damage)?'−':'';
const movePill=m=>`<span class="pill sm ${m.kind===Stock.KINDS.receive?'ok':m.kind===Stock.KINDS.ship?'info':m.kind===Stock.KINDS.damage?'bad':'sun'}">${esc(m.kind)}</span>`;
// Откуда и куда: клетка склада — «юрлицо · город»
function moveWhere(m){
  const K=Stock.KINDS,from=cellText(m.entityId,m.cityId);
  switch(m.kind){
    case K.receive: return `на склад: ${from}`;
    case K.ship: return `со склада: ${from}`;
    case K.damage: return `со склада в «Бой»: ${from}`;
    case K.transfer: return `${from} → ${cellText(m.toEntityId,m.toCityId)}`;
    case K.reserve: return `резерв: ${from}`;
    case K.unreserve: return `снят резерв: ${from}`;
    default: return from;
  }
}
const whoName=id=>person(id)?.name||'';
function movesPane(tabs){
  const u=S.ui,ids=[...new Set(S.moves.map(m=>m.productId))];
  if(u.mvPid&&!ids.includes(u.mvPid)) ids.push(u.mvPid);
  const prods=ids.map(id=>[id,product(id)?.name||id]).sort((a,b)=>a[1].localeCompare(b[1],'ru'));
  const filters=selField('mv-pid','mvpid','Товар',[['','Все товары'],...prods],u.mvPid||'')+selField('mv-kind','mvkind','Вид движения',[['','Все виды'],...Object.values(Stock.KINDS).map(k=>[k,k])],u.mvKind||'');
  return `<div class="bar">${tabs}</div><div class="fgrid">${filters}</div><section class="card clip"><div id="mv-tbl">${movesTable()}</div></section>`;
}
function movesTable(){
  const u=S.ui,list=S.moves.filter(m=>(!u.mvPid||m.productId===u.mvPid)&&(!u.mvKind||m.kind===u.mvKind)),part=list.slice(0,MV_LIMIT);
  const head=`<div class="count"><span>Показано <b>${list.length}</b> из <b>${S.moves.length}</b> движений</span>${list.length>MV_LIMIT?`<span class="muted">первые ${MV_LIMIT}: уточните фильтр</span>`:''}</div>`;
  if(!part.length) return head+'<p class="empty">Движений по этому фильтру нет.</p>';
  return `${head}<div class="xs"><table class="tbl"><thead><tr><th>Когда</th><th>Кто</th><th>Вид</th><th>Товар</th><th class="num">Сколько</th><th>Откуда и куда</th><th>Документ</th></tr></thead><tbody>${part.map(m=>{
    const p=product(m.productId),who=whoName(m.by);
    return `<tr><td class="nowrap">${fWhen(m.at)}</td><td>${who?esc(who):noData('кто')}</td><td>${movePill(m)}</td><td>${p?`<button type="button" class="link" data-act="open-product" data-pid="${esc(p.id)}">${esc(p.name)}</button>`:noData('товар')}</td><td class="num">${moveSign(m)}${qtyOf(m.qty,p)}</td><td>${esc(moveWhere(m))}</td><td class="mono">${esc(m.doc||'')}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}

// ——— карточка товара ———
function srcPill(r){

  return `<span class="pill ${bad?'bad':'info'} sm">едет: ${s?.id||r.src}${s?' · '+fD(s.eta):''}${bad?' · не хватает':''}</span>`;
}
// Сетка «юрлицо × город» с итогами; пустая клетка — пустая, не 0

// «Можно поставить» — тем же Stock.canReserve, что проверяет сама постановка
const maxText=(pid,src,ent,city)=>`Можно поставить: ${num(Stock.canReserve(S,{productId:pid,qty:1,entityId:ent,cityId:city,src}).max)}`;
function reserveForm(p,k,inc){

function dProduct(p){
  const k=stockOf(p.id),rs=resOf(p.id),inc=Stock.incomingOf(S,p.id),all=S.moves.filter(m=>m.productId===p.id),mv=all.slice(0,10),unk=stockUnknown(k);

  ].join('');

  const mList=mv.length?`<ul class="mv">${mv.map(m=>`<li>${movePill(m)}<b>${moveSign(m)}${qtyOf(m.qty,p)}</b><span>${esc(moveWhere(m))}</span><span class="mono muted">${esc(m.doc||'')}</span><small>${fWhen(m.at)} · ${esc(whoName(m.by)||'нет данных: кто')}</small></li>`).join('')}</ul><p class="m0"><button type="button" class="btn sm" data-act="stock-journal" data-pid="${esc(p.id)}">Весь журнал по товару${all.length>mv.length?` (${all.length})`:''}</button></p>`:'<p class="muted m0">Движений пока нет.</p>';
  return {kind:p.cat,title:esc(p.name),sub:`${p.inCatalog?`<span class="mono">${esc(p.id)}</span>`:'нет в каталоге'}${p.brand?' · '+esc(p.brand):''}`,body:`
    <div><h4 class="sh">Карточка каталога</h4><dl class="kv">${info}</dl></div>
    <div class="pst">${st('На складе',k.known?qtyOf(k.onHand,p):'нет данных')}${st('В резерве',num(k.reservedStock+k.reservedIncoming),'',k.reservedIncoming?`со склада ${num(k.reservedStock)}, под поставки ${num(k.reservedIncoming)}`:'')}${st('Свободно сейчас',unk?'нет данных':num(k.free),unk?'':k.free<=0?'bad-t':'ok-t')}${st('Свободно после прихода',unk?'нет данных':num(k.freeAfter),k.freeAfter<0?'bad-t':'',k.incoming?`едет ${num(k.incoming)}`:'')}</div>

// Раздел «Поставки и перевозки»
// Перенесено из прототипа v2; этапы — воронка поставки (Pipes), «закрыта» — флаг final, «ждёт приёмки» — awaitsReceipt.

// ——— поставки и перевозки ———
function vLogistics(){
  const byEta=(a,b)=>a.eta-b.eta;
  const ins=S.shipments.filter(s=>s.dir==='in'&&!isDone(s)).sort(byEta),outs=S.shipments.filter(s=>s.dir==='out'&&!isDone(s)).sort(byEta);
  const done=S.shipments.filter(isDone).sort((a,b)=>shipLast(b).at-shipLast(a).at);
  const tab=S.ui.logTab,list=tab==='in'?ins:tab==='out'?outs:done;
  let h=`<div class="bar"><div class="seg">${[['in','Едут к нам',ins.length],['out','Отгрузки клиентам',outs.length],['done','Завершённые',done.length]].map(([k,l,c])=>`<button class="${tab===k?'on':''}" data-act="log-tab" data-tab="${k}">${l}<b>${c}</b></button>`).join('')}</div><span class="grow"></span>${can('logistics')?`<button class="btn pri" data-act="new-ship">${ic('plus')}Новая поставка</button>`:''}</div>`;
  if(!can('logistics')) h+=`<p class="hint">Этапы перевозки отмечает логист. Каждая отметка приходит вам уведомлением.</p>`;
  h+=list.length?`<div class="ships">${list.map(shipCard).join('')}</div>`:'<section class="card"><p class="empty">Здесь пока пусто.</p></section>';
  return h;
}
function shipCard(s){
  const stg=stagesFor(s),pos=stagePos(s),done=isDone(s),late=isLate(s),n=dd(s.eta),nm=esc(stageName(s)),L=shipLast(s);
  const pill=done?`<span class="pill ok">${nm}</span>`:late?'<span class="pill bad">Задерживается</span>':awaitsReceipt(s)?`<span class="pill sun">${nm}</span>`:`<span class="pill info">${nm}</span>`;
  const when=done?L.at:s.eta;
  const etaTxt=done?(s.received?'принято '+fT(s.received.at):'доставлено '+fT(L.at)):n>0?'через '+days(n):n===0?'сегодня'+(s.eta.getHours()?', к '+fT(s.eta):''):'опаздывает на '+days(-n);
  const waits=s.dir==='in'?[...byDeal(S.reserves.filter(r=>r.src===s.id)).keys()]:(s.deal?[s.deal]:[]);
  const items=s.items.map(it=>{const p=product(it.productId);const t=`${esc(p.name)} <b>× ${qtyOf(it.got??it.qty,p)}</b>`;return can('stock')?`<button class="chip" data-act="open-product" data-pid="${esc(it.productId)}">${t}</button>`:`<span class="chip">${t}</span>`}).join('');
  let w='';
  if(waits.length) w=`<div class="waits">${ic('users')}<span>${s.dir==='in'?'Ждут этот товар':'Для сделки'}: ${can('clients')?waits.map(id=>`<button class="link" data-act="open-deal" data-id="${id}">${id} · ${esc(deal(id)?.client||'')}</button>`).join(', '):waits.length+' '+pl(waits.length,'сделка','сделки','сделок')}</span></div>`;
  let ph='';
  if(s.received){const r=s.received;ph=`<div class="photos-row">${(r.urls.length?r.urls.map(u=>`<img src="${u}" alt="Фото приёмки">`):Array.from({length:r.photos},()=>`<span class="ph-ph">${ic('photo')}</span>`)).join('')}<small>${r.photos} фото · принял(а) ${esc(person(r.by)?.name||'')}${r.note?' · '+esc(r.note):''}</small></div>${unsavedNote(r)}`;}
  let f='';
  if(!done){
    const b=[];
    if(can('logistics')) b.push(`<button class="btn sm" data-act="stage" data-id="${s.id}">${ic('pin')}Отметить этап</button>`);
    if(can('receive')&&awaitsReceipt(s)) b.push(`<button class="btn sm pri" data-act="rcv-start" data-id="${s.id}">${ic('camera')}Принять на складе</button>`);
    if(b.length) f=`<div class="ship-f">${b.join('')}</div>`;
  }
  return `<article class="card ship ${late?'is-late':''}"><div class="ship-h"><div class="ship-id"><b class="mono">${s.id}</b>${pill}</div><div class="eta ${late?'bad-t':''}"><small>${done?'Закрыто':s.dir==='in'?'Ожидается на складе':'Доставка'}</small><b>${fD(when)}</b><span>${etaTxt}</span></div></div>
    <div class="route"><span>${esc(s.supplier)}</span>${ic('arrow')}<span>${esc(s.to)}</span></div>
    <div class="muted sm">${esc(s.carrier)} · <span class="mono">${esc(s.track)}</span></div>
    <ol class="steps" style="--n:${stg.length}">${stg.map((x,i)=>`<li class="${i<pos||done?'done':i===pos?'cur':''}"><span>${esc(x.name)}</span></li>`).join('')}</ol>
    <div class="lastm">${ic('pin')}<span>${esc(L.text)}<small>${fWhen(L.at)} · отметка: ${esc(person(L.by)?.name||'')}</small></span></div>
    <div class="items">${items}</div>${w}${ph}${f}</article>`;
}

// Раздел «Приёмка на складе»
// Перенесено из прототипа v2. Что ждёт приёмки — awaitsReceipt (флаг arrived); кому уведомления — Notify;
// предпросмотр и подтверждение считают по одному плану rcvPlan().

// ——— приёмка ———
const newRcv=id=>{const s=ship(id);return {shipId:id,qty:Object.fromEntries(s.items.map(i=>[i.productId,i.qty])),dmg:{},note:'',photos:[],done:null}};
function initRcv(id){S.rcv=newRcv(id)}
const pendingRcv=()=>S.shipments.filter(awaitsReceipt).sort((a,b)=>a.eta-b.eta);
// Текущая приёмка: начатая или первая из ждущих (без записи в S — вид не меняет состояние)
function curRcv(){
  if(S.rcv&&S.rcv.done) return S.rcv;
  const pend=pendingRcv();
  if(S.rcv&&pend.some(s=>s.id===S.rcv.shipId)) return S.rcv;
  return pend.length?newRcv(pend[0].id):null;
}
// Перед отрисовкой раздела: начатая приёмка или первая из ждущих становится текущей
function syncRcv(){const r=curRcv();if(r!==S.rcv) S.rcv=r}
const qv=(pid,r=S.rcv)=>Math.max(0,parseInt(r.qty[pid],10)||0);
function diffHtml(it,r=S.rcv){const d=qv(it.productId,r)-it.qty;return d<0?`<span class="pill bad sm">недостача ${num(-d)}</span>`:d>0?`<span class="pill warn sm">излишек ${num(d)}</span>`:'<span class="pill ok sm">сходится</span>'}
// План приёмки — один на предпросмотр и подтверждение: расхождения, сделки-ждуны и что с каждой, кому уведомления
function rcvPlan(r=S.rcv){
  const s=ship(r.shipId),auto=rule('arrive').on,issues=[],dmg=[];
  s.items.forEach(it=>{
    const p=product(it.productId),q=qv(it.productId,r);
    if(q<it.qty) issues.push(`${p.name}: принято ${num(q)} из ${qtyOf(it.qty,p)}`);
    else if(q>it.qty) issues.push(`${p.name}: принято ${num(q)} вместо ${qtyOf(it.qty,p)}`);
    if(r.dmg[it.productId]) dmg.push(p.name);
  });
  const res=S.reserves.filter(x=>x.src===s.id);
  // как сообщить клиенту: телефон → задача менеджеру; иначе авто-сообщение, если правило включено; иначе напоминание
  const waits=[...byDeal(res)].map(([did,list])=>{const d=deal(did);return {d,list,items:itemsText(list),how:d.channel==='phone'?'call':auto?'auto':'remind'}});
  const ids=new Set([...Notify.recipients(S,'arrive'),...waits.flatMap(w=>Notify.recipients(S,'msg',[w.d.managerId])),...(issues.length||dmg.length?Notify.recipients(S,'warn'):[])]);
  return {s,issues,dmg,res,waits,warnTo:Notify.recipients(S,'warn'),to:[...ids]};
}
function vReceiving(){
  const r=curRcv();
  if(r&&r.done) return rcvLayout(rcvDoneHtml(r),rcvAfterHtml(r));
  if(!r) return '<section class="card"><p class="empty">Сейчас нечего принимать: нет поставок на этапе «прибыло, ждёт приёмки». Как только логист отметит прибытие, поставка появится здесь.</p></section>';
  return rcvLayout(rcvPhoneHtml(r,pendingRcv()),`<div id="rcv-prev">${rcvPreview(r)}</div>`);
}
function rcvLayout(phone,side){
  return `<p class="hint">Так приёмку видит кладовщик с телефона: выбрал поставку, пересчитал, сфотографировал — и все, кого это касается, сразу получили уведомления. Справа видно, что произойдёт.</p><div class="rcv"><section class="phone" aria-label="Экран кладовщика"><div class="phone-in"><div class="ph-bar"><b>Приёмка</b><span>${esc(me().name)} · ${fT(new Date())}</span></div>${phone}</div></section><div class="stack">${side}</div></div>`;
}
function photosHtml(r=S.rcv){
  return r.photos.map((u,i)=>`<figure class="ph"><img src="${u}" alt="Фото ${i+1}"><button class="ph-x" data-act="rcv-photo-del" data-i="${i}" aria-label="Удалить фото">${ic('x')}</button></figure>`).join('')+`<label class="ph add" for="rcv-file">${ic('camera')}<span>Снять или добавить фото</span><input id="rcv-file" class="sr" type="file" accept="image/*" capture="environment" multiple data-on="rcv-photo"></label>`;
}

// Принять поставку S.rcv: остаток растёт, резервы «из поставки» становятся резервами со склада,
// поставка — на завершающий этап, уведомления через Notify, клиентам — сообщение или задача менеджеру.
function receiveShip(by,now){
  const r=S.rcv,P=rcvPlan(r),s=P.s,who=person(by);
  s.items.forEach(it=>{
    const q=qv(it.productId,r);
    it.got=q;
    // приход: остаток растёт в клетке «юрлицо × город» поставки, запись попадает в журнал движений
    if(q) Stock.move(S,{kind:Stock.KINDS.receive,productId:it.productId,qty:q,entityId:s.entityId,cityId:s.cityId,doc:s.id,by,at:now});
  });
  P.res.forEach(x=>{x.src='stock'});
  s.stageId=finalStage(s)?.id||s.stageId;s.history.push({at:now,by,text:'Наш склад'});
  s.received={at:now,by,photos:r.photos.length,urls:r.photos.slice(),note:r.note.trim()};
  const notes=[],msgIds=[];
  notes.push(Notify.push(S,'arrive',by,`${s.id} принята на склад: ${s.items.map(it=>`${low(product(it.productId).name)} ${qtyOf(it.got,product(it.productId))}`).join(', ')}. Фото: ${r.photos.length}.${s.received.note?' Комментарий: '+s.received.note:''}`,now));
  if(P.issues.length||P.dmg.length) notes.push(Notify.push(S,'warn',by,`Приёмка ${s.id} с замечаниями. ${[P.issues.join('; '),P.dmg.length?'Повреждено: '+P.dmg.join(', '):''].filter(Boolean).join('. ')}. Фото в карточке поставки.`,now));
  P.waits.forEach(({d,items,how})=>{
    const mg=person(d.managerId);let tail;
    if(how==='call'){const board=taskBoard();S.tasks.push({id:Store.freeId(S.tasks,'t'),title:`Позвонить клиенту: товар по ${d.id} на складе`,desc:items,to:{t:'p',id:d.managerId},from:by,due:day(0,18),boardId:board.id,stageId:startStage(board.id).id,prio:'high',deal:d.id,at:now});tail='Менеджеру поставлена задача позвонить клиенту.'}
    else if(how==='auto'){const x={id:Store.freeId(S.msgs,'m'),at:now,deal:d.id,channel:d.channel,auto:true,text:fillTpl(d,items,false)};S.msgs.push(x);msgIds.push(x.id);tail=`Клиенту ушло авто-сообщение в ${CH[d.channel]} (имитация, не отправлено).`}
    else tail='Авто-сообщения выключены — напишите клиенту.';
    // менеджеру сделки — отдельно: уведомите клиента (R15)
    notes.push(Notify.push(S,'msg',null,`Уведомите клиента: ${d.client} (${d.id}) — товар на складе: ${items}. ${tail} Менеджер: ${mg?.name||'нет данных'}.`,now,[d.managerId]));
  });
  const notified=new Set(notes.flatMap(n=>n.to).filter(id=>id!==by)).size;
  r.done={shipId:s.id,noteIds:notes.map(n=>n.id),msgIds,notified,issues:P.issues.length+P.dmg.length,by:who?.id||by};
  return r.done;
}

  toast(`${r.shipId} принята. Уведомления получили ${r.notified} ${pl(r.notified,'сотрудник','сотрудника','сотрудников')}${r.msgIds.length?`, клиентам подготовлено ${r.msgIds.length} ${pl(r.msgIds.length,'сообщение','сообщения','сообщений')}`:''}.`);
}

function addPhotos(files){
  const push=u=>{if(!S.rcv||S.rcv.done) return;S.rcv.photos.push(u);const b=byId('rcv-photos');if(b) b.innerHTML=photosHtml();saveSoon()};
  [...files].slice(0,9).forEach(f=>{
    if(!/^image\//.test(f.type)) return;
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,720/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let u;try{u=c.toDataURL('image/jpeg',.82)}catch(_){u=fr.result}push(u)};img.onerror=()=>push(fr.result);img.src=fr.result};
    fr.readAsDataURL(f);
  });
}

function dealGoods(d){
  const rs=S.reserves.filter(r=>r.dealId===d.id);
  if(!rs.length) return {lvl:'',text:'не зарезервирован'};
  const wait=rs.filter(r=>r.src!=='stock');
  if(wait.some(r=>stockOf(r.productId).freeAfter<0)) return {lvl:'bad',text:'не хватает товара'};
  if(!wait.length) return {lvl:'ok',text:'всё на складе'};
  const ss=[...new Set(wait.map(r=>r.src))].map(ship).filter(Boolean);
  const last=ss.reduce((a,s)=>s.eta>a?s.eta:a,ss[0].eta);
  return {lvl:'info',text:`едет ${ss.map(s=>s.id).join(', ')} · до ${fD(last)}`};
}
function vClients(){
  const pr=can('prices');
  // воронка на каждую воронку сделок, в которой есть сделки или которая единственная
  const pipes=Pipes.of(S,'deals'),fun=pipes.filter(p=>pipes.length<2||Pipes.items(S,p.id).length).map(p=>{const ds=Pipes.items(S,p.id);return `${pipes.length>1?`<h4 class="sh">${esc(p.name)}</h4>`:''}<div class="xs"><div class="funnel" style="grid-template-columns:repeat(${p.stages.length},minmax(92px,1fr))">${p.stages.map(st=>{const c=ds.filter(d=>d.stageId===st.id).length;return `<div class="fn ${c?'':'zero'}"><b>${c}</b><span>${esc(st.name)}</span></div>`}).join('')}</div></div>`}).join('');

function dDeal(d){

  const compose=d.channel==='phone'?'<p class="lock">Клиент на связи только по телефону.</p>':can('write')?`<form class="compose" data-form="msg" data-id="${d.id}"><textarea id="msg-text" class="inp" rows="3" placeholder="Сообщение клиенту в ${CH[d.channel]}" aria-label="Сообщение клиенту"></textarea><button class="btn pri" type="submit">${ic('send')}Отправить в ${CH[d.channel]}</button></form>`:`<p class="lock">${ic('lock')}У вашей роли нет права писать клиентам.</p>`;
  return {kind:'Сделка '+d.id,title:esc(d.client),sub:esc(d.kind+' · '+d.object),body:`
    <ol class="steps" style="--n:${stagesFor(d).length}">${stagesFor(d).map((x,i)=>`<li class="${i<stagePos(d)?'done':x.id===d.stageId?'cur':''}"><span>${esc(x.name)}</span></li>`).join('')}</ol>

    <div class="stack-s"><h4 class="sh" style="margin:0">Переписка</h4>${chat}${compose}</div>`};
}

  const mx=`<section class="card clip"><div class="card-h"><h3>Что может каждая роль</h3></div><div class="card-b"><p class="hint">Галочки работают сразу. Попробуйте: снимите «Видеть цены и суммы» у менеджера B2B, затем вверху выберите менеджера B2B — колонка цен пропадёт. У директора права не снимаются.</p></div><div class="xs"><table class="tbl matrix"><thead><tr><th>Право</th>${S.roles.map(r=>`<th class="c">${esc(r.name)}</th>`).join('')}</tr></thead><tbody>${Perms.LIST.map(([k,l])=>`<tr><td>${l}</td>${S.roles.map(r=>`<td class="c"><input type="checkbox" id="pm-${esc(r.id)}-${k}" data-on="perm" data-role="${esc(r.id)}" data-perm="${k}" ${r.all||r.perms[k]?'checked':''} ${r.all?'disabled':''} aria-label="${l} — ${esc(r.name)}"></td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
  return emp+mx;
}

// Раздел «Настройки»: вкладки из реестра SETTINGS_TABS, по order слева направо.
// Вкладка — {id, label, order, ok:()=>bool, render:()=>html}; render — вид S → HTML, состояние не меняет.
// Следующий таск добавляет свою вкладку одной строкой в своём файле: SETTINGS_TABS.push({…}).
// Порядок вкладок по спецификации (R34): Внешний вид 10 · Уведомления · Воронки · Почта · Лиды ·
// Склады и юрлица · Поставки · Роли и права · Данные 90.
const SETTINGS_TABS=[];
// Вкладки, открытые текущему человеку
const settingsTabs=()=>SETTINGS_TABS.filter(t=>t.ok()).sort((a,b)=>a.order-b.order);
// Открытая вкладка: выбранная (S.ui.setTab), если её видно этому человеку, иначе первая видимая
const settingsTab=()=>{const vis=settingsTabs();return vis.find(t=>t.id===S.ui.setTab)||vis[0]||null};

function vSettings(){
  const vis=settingsTabs(),cur=settingsTab();
  const tabs=`<div class="seg set-tabs" role="tablist" aria-label="Вкладки настроек">${vis.map(t=>`<button type="button" role="tab" aria-selected="${t===cur}" class="${t===cur?'on':''}" data-act="set-tab" data-tab="${esc(t.id)}">${esc(t.label)}</button>`).join('')}</div>`;
  return `<div class="bar">${tabs}</div>${cur?cur.render():''}`;
}

SETTINGS_TABS.push(
  {id:'look',label:'Внешний вид',order:10,ok:()=>true,render:()=>`<section class="card"><div class="card-h"><h3>Тема</h3></div><div class="card-b stack-s">

// Раздел «Почта»: слева ящики и папки поставщиков со счётчиками непрочитанных, в середине список писем с поиском,
// справа письмо. Это имитация: ответ только ложится в ветку письма с пометкой, наружу ничего не уходит.
// Всё считает ядро Mail (ящики, папки, поиск, «запомнить», ответ, приход письма); здесь — только экран.
// Выбор на экране (ящик, папка, письмо, поиск) лежит в S.ui.mail и не сохраняется; вид его читает через mailSel()
// и ничего не меняет. На телефоне показывается один столбец (S.ui.mail.pane: nav · list · letter) с кнопкой «назад».

Object.assign(IC,{
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 7.5l8.5 6 8.5-6"/>',
  back:'<path d="M15 5l-7 7 7 7"/>'
});

const MAIL_LATER='подключение — на следующем этапе';
const MAIL_NO_ADDR='нет данных: адрес';

const mailData=()=>S.mail||{boxes:[],suppliers:[],letters:[]};
const mailU=()=>S.ui.mail||(S.ui.mail={});

// Что выбрано сейчас: ящик из видимых этому человеку, папка (только в ящике закупок), письмо, поиск, столбец на телефоне.
function mailSel(){
  const m=mailData(),u=S.ui.mail||{},boxes=Mail.boxesFor(S,S.me);
  const box=boxes.find(b=>b.id===u.box)||boxes[0]||null;
  const purchase=!!box&&box.kind==='purchase';
  const folder=purchase&&(u.folder===Mail.INBOX||m.suppliers.some(s=>s.id===u.folder))?u.folder:'all';
  const letter=box&&u.letter?m.letters.find(l=>l.id===u.letter&&l.boxId===box.id)||null:null;
  const pane=letter&&u.pane==='letter'?'letter':u.pane==='nav'?'nav':'list';
  return {boxes,box,purchase,folder,q:String(u.q||''),letter,pane,reply:!!letter&&u.reply===letter.id};
}
// Письма выбранного ящика и папки с учётом поиска — одним поиском ядра
const mailList=sel=>sel.box?Mail.search(S,{boxId:sel.box.id,folder:sel.folder==='all'?'':sel.folder,q:sel.q}):[];
// Непрочитанные в ящике или в его папке — единственный счёт для счётчиков в папках, ящиках и меню
const mailUnread=(boxId,folder)=>Mail.search(S,{boxId,folder:folder&&folder!=='all'?folder:''}).filter(l=>!l.read).length;
const mailUnreadAll=()=>Mail.boxesFor(S,S.me).reduce((n,b)=>n+mailUnread(b.id),0);
const mailFolderName=(box,l)=>{const s=mailData().suppliers.find(x=>x.id===l.folder);return s?s.name:box&&box.kind==='purchase'?'Разобрать':'Входящие'};
const mailCnt=n=>n?`<span class="cnt hot">${n}</span>`:'';

function mailNav(sel){
  const m=mailData();
  const boxes=sel.boxes.map(b=>{
    const on=b.id===sel.box?.id,n=mailUnread(b.id);
    let h=`<button type="button" class="mail-box${on?' on':''}" data-act="mail-box" data-id="${esc(b.id)}"><span class="mail-box-t"><b>${esc(b.title)}</b>${mailCnt(n)}</span><small class="${b.address?'':'muted'}">${b.address?esc(b.address):MAIL_NO_ADDR}</small>${b.added?`<span class="pill sun sm">${MAIL_LATER}</span>`:''}</button>`;
    if(on&&b.kind==='purchase'){
      const f=(id,label,example)=>`<button type="button" class="mail-fold${sel.folder===id?' on':''}" data-act="mail-folder" data-folder="${esc(id)}"><span>${esc(label)}${example?' <span class="pill sm">пример</span>':''}</span>${mailCnt(mailUnread(b.id,id))}</button>`;
      h+=`<div class="mail-folds">${f('all','Все письма')}${f(Mail.INBOX,'Разобрать')}${m.suppliers.map(s=>f(s.id,s.name,s.example)).join('')}</div>`;
    }
    return h;
  }).join('');
  return `<aside class="mail-nav card"><div class="card-h"><h3>Ящики</h3></div><div class="mail-nav-b">${boxes}</div></aside>`;
}

function mailItems(sel){
  const list=mailList(sel),un=list.filter(l=>!l.read).length;
  const head=`<p class="count"><span>${sel.q.trim()?'Найдено':'Писем'}: <b>${list.length}</b></span><span>непрочитанных: <b>${un}</b></span></p>`;
  if(!list.length) return head+`<p class="empty">${sel.q.trim()?'По этому запросу писем нет.':sel.box&&sel.box.added?`В новом ящике писем пока нет — ${MAIL_LATER}.`:'В этой папке писем нет.'}</p>`;
  return head+`<ul class="mail-items">${list.map(l=>{
    const sn=l.body.replace(/\s+/g,' ').slice(0,90);
    return `<li><button type="button" class="mail-li${l.read?'':' unread'}${l.id===sel.letter?.id?' on':''}" data-act="mail-open" data-id="${esc(l.id)}"><span class="mail-li-top"><b>${esc(l.fromName||l.from)}</b><small>${esc(fWhen(l.at))}</small></span><span class="mail-li-sub">${esc(l.subject)}</span><span class="mail-li-sn">${esc(sn)}</span><span class="mail-li-tags">${l.demo?'<span class="pill sm">пример</span>':''}${sel.purchase&&sel.folder==='all'?`<span class="pill sm info">${esc(mailFolderName(sel.box,l))}</span>`:''}${(l.replies||[]).length?'<span class="pill sm sun">есть ответ</span>':''}</span></button></li>`;
  }).join('')}</ul>`;
}

function mailListPane(sel){
  const m=mailData();
  const fname=!sel.purchase||sel.folder==='all'?'':sel.folder===Mail.INBOX?'Разобрать':(m.suppliers.find(s=>s.id===sel.folder)?.name||'');
  return `<section class="mail-list card"><div class="mail-bar">
    <button type="button" class="btn ghost sm mail-back" data-act="mail-back">${ic('back')}Ящики и папки</button>
    <div class="mail-title"><b>${esc(sel.box.title)}</b>${fname?`<small>${esc(fname)}</small>`:''}</div>
    <div class="search-in">${ic('search')}<input id="mail-q" class="inp" type="search" placeholder="Поиск: отправитель, тема, текст" value="${esc(sel.q)}" data-on="mail-q" autocomplete="off" aria-label="Поиск по письмам"></div>
    <button type="button" class="btn sm" data-act="mail-sim" data-box="${esc(sel.box.id)}">${ic('plus')}Имитация: пришло письмо</button>
  </div><div id="mail-items">${mailItems(sel)}</div></section>`;
}

function mailRememberBox(sel,l){
  const m=mailData();
  if(!sel.purchase||l.folder!==Mail.INBOX) return '';
  if(!m.suppliers.length) return `<div class="mail-rem"><p class="hint">Это письмо лежит в «Разобрать». Поставщиков пока нет — добавьте их в «Настройки → Почта», и письма будут раскладываться по папкам.</p></div>`;
  const addr=(String(l.from).match(/<([^>]*)>/)?.[1]||l.from).trim().toLowerCase(),dom=addr.includes('@')?addr.slice(addr.lastIndexOf('@')):'';
  return `<form class="mail-rem" data-form="mail-remember" data-id="${esc(l.id)}" novalidate>
    <b>Это поставщик?</b>
    <div class="mail-rem-f">
      <div class="field"><label for="mail-sup">Это поставщик</label><select id="mail-sup" class="inp"><option value="">— выберите —</option>${m.suppliers.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="mail-mode">Запомнить</label><select id="mail-mode" class="inp"><option value="address">этот адрес — ${esc(addr)}</option>${dom?`<option value="domain">весь домен — ${esc(dom)}</option>`:''}</select></div>
      <button type="submit" class="btn pri">Запомнить адрес</button>
    </div>
    <p class="hint">Письма с этого адреса (или домена) перейдут в папку поставщика, новые будут ложиться туда сами.</p>
    <p class="err" id="mail-err" hidden></p></form>`;
}

function mailLetterPane(sel){
  const l=sel.letter;
  if(!l) return `<article class="mail-letter card mail-empty"><p class="empty">Выберите письмо в списке.</p></article>`;
  const replies=(l.replies||[]).map(r=>`<div class="mail-reply"><div class="mail-reply-h"><b>Ответ: ${esc(person(r.by)?.name||'нет данных: сотрудник')}</b><small>${esc(fWhen(r.at))}</small><span class="pill sun sm">${esc(r.note||Mail.SIM_NOTE)}</span>${r.demo?'<span class="pill sm">пример</span>':''}</div><p>${esc(r.text)}</p></div>`).join('');
  const form=sel.reply
    ?`<form class="mail-reply-f" data-form="mail-reply" data-id="${esc(l.id)}" novalidate><div class="field"><label for="mail-reply-text">Ваш ответ</label><textarea id="mail-reply-text" class="inp" rows="4" placeholder="Текст ответа"></textarea></div><p class="hint">${Mail.SIM_NOTE}: ответ ляжет в ветку письма, наружу ничего не уйдёт.</p><p class="err" id="mail-reply-err" hidden></p><div class="mail-reply-btns"><button type="button" class="btn" data-act="mail-reply-cancel">Отмена</button><button type="submit" class="btn pri">Записать ответ</button></div></form>`
    :`<div><button type="button" class="btn" data-act="mail-reply">${ic('send')}Ответить</button></div>`;
  return `<article class="mail-letter card"><div class="mail-lh">
    <button type="button" class="btn ghost sm mail-back" data-act="mail-back">${ic('back')}К списку</button>
    <h2>${esc(l.subject)}</h2>
    <p class="mail-meta"><span>От: <b>${esc(l.fromName||l.from)}</b>${l.fromName?` &lt;${esc(l.from)}&gt;`:''}</span><span>${esc(fWhen(l.at))}</span><span>Ящик «${esc(sel.box.title)}» · ${esc(mailFolderName(sel.box,l))}</span>${l.demo?'<span class="pill sm">пример</span>':''}</p>
  </div><div class="mail-body">${esc(l.body)}</div>
  ${replies?`<div class="mail-replies"><h4>Ответы</h4>${replies}</div>`:''}
  <div class="mail-act">${form}${mailRememberBox(sel,l)}</div></article>`;
}

// ——— имитация: пришло письмо ———
// Поочерёдно: письмо от известного поставщика (ляжет в его папку) и от незнакомого адреса (в «Разобрать»).
// В ящике без папок поставщиков — письмо клиента. Кладёт Mail.deliver: он же рассылает уведомление тем, кто видит ящик.
function mailSimulate(boxId){
  const m=mailData();
  const box=m.boxes.find(b=>b.id===boxId)||m.boxes.find(b=>b.kind==='purchase')||m.boxes[0];
  if(!box){toast('Ящиков нет — письму некуда прийти.','warn');return null}
  const n=m.letters.filter(l=>l.sim).length+1;
  let from,fromName,subject;
  const known=m.suppliers.filter(s=>(s.rules||[]).length);
  if(box.kind==='purchase'&&n%2===1&&known.length){
    const s=known[((n-1)/2)%known.length],r=s.rules[0];
    from=r.startsWith('@')?'sim'+r:r;fromName=s.name;subject='Пример: письмо от поставщика';
  }else if(box.kind==='purchase'){
    from=`new-${n}@unknown-${n}.example`;fromName='Незнакомый отправитель (пример)';subject='Пример: письмо от незнакомого адреса';
  }else{
    from=`client-sim-${n}@clients.example`;fromName='Клиент-пример';subject='Пример: вопрос от клиента';
  }
  const l=Mail.deliver(S,{boxId:box.id,from,fromName,subject,body:'Это пример входящего письма для проверки. Настоящая почта не подключена: письмо создано кнопкой «Имитация».',demo:true},new Date());
  if(!l) return null;
  l.sim=true;
  const to=(S.notes[0]&&S.notes[0].kind===Mail.NOTE_KIND?S.notes[0].to:[]).length;
  render();
  toast(`Пришло письмо в ящик «${box.title}», папка «${mailFolderName(box,l)}». Уведомление получили: ${to}.`);
  return l;
}
SIMS.push({id:'mail',label:'Имитация: пришло письмо',run:()=>{mailSimulate()}});

// Настройки → «Склады и юрлица»: справочники юрлиц и городов (добавить, переименовать, адрес склада)
// и откуда взят каталог. Справочники лежат в S.entities и S.cities: сетка остатков, форма резерва и журнал
// берут названия оттуда же, поэтому переименование видно везде сразу.

// Название уже занято другим элементом справочника (сравнение как у товаров: регистр и пробелы не в счёт)
const nameTaken=(list,name,exceptId)=>list.some(x=>x.id!==exceptId&&Catalog.norm(x.name)===Catalog.norm(name));

// Переименование из поля data-on: пустое и занятое название не принимаются, поле возвращается к прежнему
function renameInDict(list,t,what){
  const item=list.find(x=>x.id===t.dataset.id);if(!item) return;
  const name=String(t.value).trim();
  if(!name||nameTaken(list,name,item.id)){
    t.value=item.name;
    toast(!name?'Название не может быть пустым.':`${what} «${name}» уже есть в справочнике.`,'warn');
    return;
  }
  if(name===item.name) return;
  const old=item.name;item.name=name;
  render();toast(`${what} «${old}» теперь называется «${name}».`);
}
ON.change['ent-name']=t=>renameInDict(S.entities,t,'Юрлицо');
ON.change['city-name']=t=>renameInDict(S.cities,t,'Город');
ON.change['city-addr']=t=>{
  const c=S.cities.find(x=>x.id===t.dataset.id);if(!c) return;
  c.address=String(t.value).trim();
  toast(c.address?`Адрес склада «${c.name}» сохранён.`:`Адрес склада «${c.name}» очищен: нет данных.`);
};

// Настройки → «Почта»: ящики (добавить, адрес, кто видит) и поставщики (добавить, переименовать, правила-адреса,
// удалить). Данные лежат в S.mail, раздел «Почта» читает их оттуда же, поэтому правка видна там сразу.
// Правило поставщика — точный адрес (sales@firma.ru) или весь домен (@firma.ru); письма раскладывает Mail.folderOf.

const mailSame=(a,b)=>String(a).trim().toLowerCase().replace(/ё/g,'е')===String(b).trim().toLowerCase().replace(/ё/g,'е');
const MAIL_ADDR=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;

// «sales@firma.ru, @firma.ru, firma.ru» → правила; bad — то, что на адрес или домен не похоже
function mailParseRules(text){
  const rules=[],bad=[];
  for(let r of String(text||'').toLowerCase().split(/[\s,;]+/).filter(Boolean)){
    if(!r.includes('@')&&/^[^\s.]+(\.[^\s.]+)+$/.test(r)) r='@'+r;           // «firma.ru» → весь домен
    if(/^@[^@\s]+\.[^@\s]+$/.test(r)||MAIL_ADDR.test(r)){if(!rules.includes(r)) rules.push(r)}else bad.push(r);
  }
  return {rules,bad};
}
// Правило уже у другого поставщика: у одного правила один хозяин
const mailRuleOwner=(rule,exceptId)=>mailData().suppliers.find(s=>s.id!==exceptId&&(s.rules||[]).some(r=>mailSame(r,rule)))||null;
// Разложить все письма заново по правилам; → сколько писем сменили папку
function mailRefile(){
  let moved=0;
  for(const l of mailData().letters){const f=Mail.folderOf(S,l);if(f!==l.folder){l.folder=f;moved++}}
  return moved;
}
// Удаление поставщика: его письма уходят в «Разобрать», правила уходят вместе с ним
function mailDeleteSupplier(supId){
  const m=mailData(),i=m.suppliers.findIndex(s=>s.id===supId);
  if(i<0) return {ok:false,moved:0,name:''};
  const [sup]=m.suppliers.splice(i,1);
  let moved=0;
  for(const l of m.letters) if(l.folder===supId){l.folder=Mail.INBOX;moved++}
  return {ok:true,moved,name:sup.name};
}
const mailRoleNames=b=>{
  const names=S.roles.filter(r=>r.all||(b.roles||[]).includes(r.id)).map(r=>r.name);
  return names.join(', ');
};

// ——— ящики ———
ON.change['mbox-title']=t=>{
  const b=mailData().boxes.find(x=>x.id===t.dataset.id);if(!b) return;
  const name=t.value.trim();
  if(!name||mailData().boxes.some(x=>x.id!==b.id&&mailSame(x.title,name))){
    t.value=b.title;toast(!name?'Название ящика не может быть пустым.':`Ящик «${name}» уже есть.`,'warn');return;
  }
  if(name===b.title) return;
  const old=b.title;b.title=name;render();toast(`Ящик «${old}» теперь называется «${name}».`);
};
ON.change['mbox-addr']=t=>{
  const b=mailData().boxes.find(x=>x.id===t.dataset.id);if(!b) return;
  const addr=t.value.trim();
  if(addr&&!MAIL_ADDR.test(addr)){t.value=b.address||'';toast('Адрес должен быть вида name@firma.ru.','warn');return}
  b.address=addr;render();
  toast(addr?`Адрес ящика «${b.title}» сохранён. Подключения пока нет — оно на следующем этапе.`:`Адрес ящика «${b.title}» очищен: нет данных.`);
};
ON.change['mbox-role']=t=>{
  const b=mailData().boxes.find(x=>x.id===t.dataset.id);if(!b) return;
  const roles=(b.roles||[]).filter(r=>r!==t.dataset.role);
  if(t.checked) roles.push(t.dataset.role);
  b.roles=roles;render();
  toast(`Ящик «${b.title}» видят: ${mailRoleNames(b)}.`);
};
FORMS['mbox-add']=()=>{
  const m=mailData(),title=byId('mbox-new-title').value.trim(),addr=byId('mbox-new-addr').value.trim();
  if(!title) return showErr('mbox-err','Напишите название ящика.');
  if(m.boxes.some(b=>mailSame(b.title,title))) return showErr('mbox-err',`Ящик «${title}» уже есть.`);
  if(addr&&!MAIL_ADDR.test(addr)) return showErr('mbox-err','Адрес должен быть вида name@firma.ru. Можно оставить пустым — будет «нет данных: адрес».');
  const roles=S.roles.filter(r=>!r.all&&byId('mbox-new-role-'+r.id)?.checked).map(r=>r.id);
  const box={id:Store.freeId(m.boxes,'box'),kind:'other',title,address:addr,roles,added:true};
  m.boxes.push(box);
  render();
  toast(`Ящик «${title}» добавлен. Видят: ${mailRoleNames(box)}. В «Почте» он с пометкой «${MAIL_LATER}».`);
};

// ——— поставщики ———
ON.change['msup-name']=t=>{
  const s=mailData().suppliers.find(x=>x.id===t.dataset.id);if(!s) return;
  const name=t.value.trim();
  if(!name||mailData().suppliers.some(x=>x.id!==s.id&&mailSame(x.name,name))){
    t.value=s.name;toast(!name?'Название поставщика не может быть пустым.':`Поставщик «${name}» уже есть.`,'warn');return;
  }
  if(name===s.name) return;
  const old=s.name;s.name=name;s.example=false;           // своё название — уже не пример
  render();toast(`Поставщик «${old}» теперь называется «${name}».`);
};
ON.change['msup-rules']=t=>{
  const s=mailData().suppliers.find(x=>x.id===t.dataset.id);if(!s) return;
  const {rules,bad}=mailParseRules(t.value);
  const back=()=>{t.value=(s.rules||[]).join(', ')};
  if(bad.length){back();toast(`Не похоже на адрес или домен: ${bad.join(', ')}. Пишите sales@firma.ru или @firma.ru.`,'warn');return}
  const dup=rules.map(r=>[r,mailRuleOwner(r,s.id)]).find(x=>x[1]);
  if(dup){back();toast(`Правило ${dup[0]} уже у поставщика «${dup[1].name}».`,'warn');return}
  s.rules=rules;
  const moved=mailRefile();
  render();
  toast(`Правила «${s.name}» сохранены.${moved?` Письма переложены по папкам: ${moved}.`:''}${rules.length?'':' Правил нет — письма этого поставщика не будут раскладываться.'}`);
};
FORMS['msup-add']=()=>{
  const m=mailData(),name=byId('msup-new-name').value.trim();
  if(!name) return showErr('msup-err','Напишите название поставщика.');
  if(m.suppliers.some(s=>mailSame(s.name,name))) return showErr('msup-err',`Поставщик «${name}» уже есть.`);
  const {rules,bad}=mailParseRules(byId('msup-new-rules').value);
  if(bad.length) return showErr('msup-err',`Не похоже на адрес или домен: ${bad.join(', ')}. Пишите sales@firma.ru или @firma.ru.`);
  const dup=rules.map(r=>[r,mailRuleOwner(r)]).find(x=>x[1]);
  if(dup) return showErr('msup-err',`Правило ${dup[0]} уже у поставщика «${dup[1].name}».`);
  m.suppliers.push({id:Store.freeId(m.suppliers,'sup'),name,example:false,rules});
  const moved=mailRefile();
  render();
  toast(`Поставщик «${name}» добавлен.${moved?` В его папку переехало писем: ${moved}.`:''}`);
};
A['msup-del']=el=>openModal('msup-del',el.dataset.id);
MODALS['msup-del']=id=>{
  const s=mailData().suppliers.find(x=>x.id===id);
  if(!s) return `<form data-form="msup-del" novalidate>${mHead('Поставщик не найден')}<div class="modal-b"><p class="m0">Такого поставщика уже нет.</p></div></form>`;
  const n=mailData().letters.filter(l=>l.folder===id).length;

    <p class="m0">«${esc(s.name)}» и его правила-адреса будут удалены.</p>
    <p class="hint">${n?`Писем в его папке: ${n}. Они не пропадут — перейдут в «Разобрать».`:'В его папке писем нет.'}</p>
  </div>${mFoot('Удалить')}</form>`;
};
FORMS['msup-del']=f=>{
  const res=mailDeleteSupplier(f.dataset.id);
  closeModal();render();
  if(res.ok) toast(`Поставщик «${res.name}» удалён.${res.moved?` Писем перенесено в «Разобрать»: ${res.moved}.`:''}`);
};
