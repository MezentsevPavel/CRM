    return `<div class="wait"><div class="wait-h"><b>${esc(d.client)}</b><span class="mono muted">${d.id}</span>${chPill(d.channel)}<span class="muted sm">менеджер ${esc(mg?.name||'нет данных')}</span></div><p class="sm m0">Ждёт: ${esc(items)}</p>${msg}</div>`;
  }).join('');
  return `<section class="card"><div class="card-h"><h3>Что произойдёт после приёмки ${s.id}</h3></div><div class="card-b stack-s">
    <div><h4 class="sh">Добавится на склад</h4><ul class="plain">${add}</ul></div>
    <div><h4 class="sh">Уведомление получат</h4><div class="who-list">${ppl.map(p=>`<span class="chip">${av(p,'xs')}${esc(p.name)} · ${esc(roleName(p).toLowerCase())}</span>`).join('')}</div>${P.issues.length||P.dmg.length?`<p class="warn-t sm" style="margin:8px 0 0">Есть расхождение или повреждение — отдельное предупреждение получат: ${warnNames}.</p>`:''}</div>
    <div><h4 class="sh">Клиенты, которые ждут этот товар</h4><div class="stack-s">${waits||'<p class="muted sm m0">Резервов под эту поставку нет — весь товар станет свободным для продажи.</p>'}</div></div>
  </div></section>`;
}
function updRcvPrev(){const b=byId('rcv-prev');if(b) b.innerHTML=rcvPreview()}
// Принять поставку S.rcv: остаток растёт, резервы «из поставки» становятся резервами со склада,
// поставка — на завершающий этап, уведомления через Notify, клиентам — сообщение или задача менеджеру.
function receiveShip(by,now){
  const r=S.rcv,P=rcvPlan(r),s=P.s,who=person(by);
  s.items.forEach(it=>{
    const p=product(it.sku),q=qv(it.sku,r);
    p.stock+=q;it.got=q;
    if(q) S.moves.unshift({at:now,sku:it.sku,kind:'Приход',qty:q,doc:s.id,by});
  });
  P.res.forEach(x=>{x.src='stock'});
  s.stageId=finalStage(s)?.id||s.stageId;s.last={place:'Наш склад',at:now,by};
  s.received={at:now,by,photos:r.photos.length,urls:r.photos.slice(),note:r.note.trim()};
  const notes=[],msgIds=[];
  notes.push(Notify.push(S,'arrive',by,`${s.id} принята на склад: ${s.items.map(it=>`${low(product(it.sku).name)} ${num(it.got)} ${product(it.sku).unit}`).join(', ')}. Фото: ${r.photos.length}.${s.received.note?' Комментарий: '+s.received.note:''}`,now));
  if(P.issues.length||P.dmg.length) notes.push(Notify.push(S,'warn',by,`Приёмка ${s.id} с замечаниями. ${[P.issues.join('; '),P.dmg.length?'Повреждено: '+P.dmg.join(', '):''].filter(Boolean).join('. ')}. Фото в карточке поставки.`,now));
  P.waits.forEach(({d,items,how})=>{
    const mg=person(d.managerId);let tail;
    if(how==='call'){const board=taskBoard();S.tasks.push({id:Store.freeId(S.tasks,'t'),title:`Позвонить клиенту: товар по ${d.id} на складе`,desc:items,to:{t:'p',id:d.managerId},from:by,due:day(0,18),boardId:board.id,stageId:startStage(board.id).id,prio:'high',deal:d.id,at:now});tail='Менеджеру поставлена задача позвонить клиенту.'}
    else if(how==='auto'){const x={id:Store.freeId(S.msgs,'m'),at:now,deal:d.id,channel:d.channel,auto:true,text:fillTpl(d,items,false)};S.msgs.push(x);msgIds.push(x.id);tail=`Клиенту ушло авто-сообщение в ${CH[d.channel]} (имитация, не отправлено).`}
    else tail='Авто-сообщения выключены — напишите клиенту.';
    // менеджеру сделки — отдельно: уведомите клиента (R15)
    notes.push(Notify.push(S,'msg',null,`Уведомите клиента: ${d.client} (${d.id}) — товар на складе: ${items}. ${tail} Менеджер: ${mg?.name||'нет данных'}.`,now,[d.managerId]));
  });
  const notified=new Set(notes.flatMap(n=>n.to).filter(id=>id!==by)).size;
  r.done={shipId:s.id,noteIds:notes.map(n=>n.id),msgIds,notified,issues:P.issues.length+P.dmg.length,by:who?.id||by};
  return r.done;
}
function rcvConfirm(){
  const r=receiveShip(me().id,new Date());
  render();byId('scroll').scrollTop=0;
  toast(`${r.shipId} принята. Уведомления получили ${r.notified} ${pl(r.notified,'сотрудник','сотрудника','сотрудников')}${r.msgIds.length?`, клиентам подготовлено ${r.msgIds.length} ${pl(r.msgIds.length,'сообщение','сообщения','сообщений')}`:''}.`);
}
function rcvDoneHtml(rc=S.rcv){
  const r=rc.done,s=ship(r.shipId);
  return `<div class="done-box"><span class="done-ic">${ic('check')}</span><h3 class="m0">${s.id} на складе</h3><p class="m0 muted">Остатки обновлены, резервы под эту поставку стали резервами со склада. Уведомили ${r.notified} ${pl(r.notified,'сотрудника','сотрудников','сотрудников')}.${r.msgIds.length?` Клиентам подготовлено сообщений: ${r.msgIds.length} — в прототипе они не уходят.`:''}</p>${r.issues?'<p class="m0 warn-t">Расхождения и повреждения отправлены отдельным предупреждением.</p>':''}<div class="bar"><button class="btn pri" data-act="rcv-again">Принять другую поставку</button><button class="btn" data-act="go" data-view="notifications">Уведомления</button></div></div>`;
}
function rcvAfterHtml(rc=S.rcv){
  const r=rc.done,notes=S.notes.filter(n=>r.noteIds.includes(n.id)),msgs=S.msgs.filter(x=>r.msgIds.includes(x.id));
  let h=`<section class="card"><div class="card-h"><h3>Кому что ушло</h3></div><ul class="notes">${notes.map(n=>noteRow(n,false,true)).join('')}</ul></section>`;
  if(msgs.length) h+=`<section class="card"><div class="card-h"><h3>Сообщения клиентам</h3><span class="pill sun sm">имитация: не отправлены</span></div><div class="card-b stack-s">${msgs.map(x=>{const d=deal(x.deal);return `<div class="stack-s" style="gap:6px"><p class="sm m0"><b>${esc(d.client)}</b> · ${CH[x.channel]}</p><div class="chat"><div class="bub out">${esc(x.text)}<small>${fT(x.at)} · авто</small></div></div></div>`}).join('')}</div></section>`;
  return h;
}
function addPhotos(files){
  const push=u=>{if(!S.rcv||S.rcv.done) return;S.rcv.photos.push(u);const b=byId('rcv-photos');if(b) b.innerHTML=photosHtml();saveSoon()};
  [...files].slice(0,9).forEach(f=>{
    if(!/^image\//.test(f.type)) return;
    const fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,720/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);let u;try{u=c.toDataURL('image/jpeg',.82)}catch(_){u=fr.result}push(u)};img.onerror=()=>push(fr.result);img.src=fr.result};
    fr.readAsDataURL(f);
  });
}

// Раздел «Клиенты и сделки»
// Перенесено из прототипа v2; этапы — воронки сделок B2B и B2C (Pipes), «сдана» — флаг final.

// ——— клиенты и сделки ———
function dealGoods(d){
  const rs=S.reserves.filter(r=>r.deal===d.id);
  if(!rs.length) return {lvl:'',text:'не зарезервирован'};
  const wait=rs.filter(r=>r.src!=='stock');
  if(wait.some(r=>freeAfter(product(r.sku))<0)) return {lvl:'bad',text:'не хватает товара'};
  if(!wait.length) return {lvl:'ok',text:'всё на складе'};
  const ss=[...new Set(wait.map(r=>r.src))].map(ship).filter(Boolean);
  const last=ss.reduce((a,s)=>s.eta>a?s.eta:a,ss[0].eta);
  return {lvl:'info',text:`едет ${ss.map(s=>s.id).join(', ')} · до ${fD(last)}`};
}
function vClients(){
  const pr=can('prices');
  // воронка на каждую воронку сделок, в которой есть сделки или которая единственная
  const pipes=Pipes.of(S,'deals'),fun=pipes.filter(p=>pipes.length<2||Pipes.items(S,p.id).length).map(p=>{const ds=Pipes.items(S,p.id);return `${pipes.length>1?`<h4 class="sh">${esc(p.name)}</h4>`:''}<div class="xs"><div class="funnel" style="grid-template-columns:repeat(${p.stages.length},minmax(92px,1fr))">${p.stages.map(st=>{const c=ds.filter(d=>d.stageId===st.id).length;return `<div class="fn ${c?'':'zero'}"><b>${c}</b><span>${esc(st.name)}</span></div>`}).join('')}</div></div>`}).join('');
  const rows=S.deals.slice().sort((a,b)=>stagePos(b)-stagePos(a)).map(d=>{const g=dealGoods(d);return `<tr class="click" data-act="open-deal" data-id="${d.id}" tabindex="0"><td><div class="pname"><span>${esc(d.client)}</span><small class="mono">${d.id} · ${esc(d.kind)}</small></div></td><td>${esc(d.object)}</td><td><span class="pill ${stageTone(d)}">${esc(stageName(d))}</span></td><td><span class="pill sm ${g.lvl}">${esc(g.text)}</span></td><td class="nowrap">${esc(person(d.managerId)?.name||'нет данных: менеджер')}</td><td>${chPill(d.channel)}</td>${pr?`<td class="num">${d.amount?rub(d.amount):'<span class="muted">не рассчитана</span>'}</td>`:''}</tr>`}).join('');
  return `${fun}<section class="card clip"><div class="xs"><table class="tbl"><thead><tr><th>Клиент</th><th>Объект</th><th>Этап</th><th>Товар</th><th>Менеджер</th><th>Связь</th>${pr?'<th class="num">Сумма</th>':''}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
function dDeal(d){
  const rs=S.reserves.filter(r=>r.deal===d.id),ts=S.tasks.filter(t=>t.deal===d.id&&taskVisible(t)),ms=S.msgs.filter(x=>x.deal===d.id).slice().sort((a,b)=>a.at-b.at);
  const goods=rs.length?`<div class="xs"><table class="tbl"><thead><tr><th>Товар</th><th class="num">Кол-во</th><th>Где</th></tr></thead><tbody>${rs.map(r=>{const p=product(r.sku);return `<tr ${can('stock')?`class="click" data-act="open-product" data-sku="${p.sku}"`:''}><td>${esc(p.name)}</td><td class="num">${num(r.qty)} ${p.unit}</td><td>${srcPill(r)}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted m0">Под сделку ничего не зарезервировано.</p>';
  const tasks=ts.length?`<ul class="list" style="padding:0">${ts.map(t=>`<li><button class="li" data-act="open-task" data-id="${t.id}"><span class="tdot ${esc(t.stageId)}"></span><span class="li-t">${esc(t.title)}<small>${esc(targetName(t))} · ${esc(stageName(t))}</small></span><span class="due ${taskOverdue(t)?'bad':''}">${fRel(t.due)}</span></button></li>`).join('')}</ul>`:'<p class="muted m0">Задач по сделке нет.</p>';
  const chat=ms.length?`<div class="chat">${ms.map(x=>`<div class="bub ${x.inbound?'':'out'}">${esc(x.text)}<small>${x.inbound?esc(d.contact):x.auto?'Авто-сообщение':esc(person(x.by)?.name||'')} · ${CH[x.channel]} · ${fWhen(x.at)}</small></div>`).join('')}</div>`:'<p class="muted m0">Переписки пока нет.</p>';
  const compose=d.channel==='phone'?'<p class="lock">Клиент на связи только по телефону.</p>':can('write')?`<form class="compose" data-form="msg" data-id="${d.id}"><textarea id="msg-text" class="inp" rows="3" placeholder="Сообщение клиенту в ${CH[d.channel]}" aria-label="Сообщение клиенту"></textarea><button class="btn pri" type="submit">${ic('send')}Отправить в ${CH[d.channel]}</button></form>`:`<p class="lock">${ic('lock')}У вашей роли нет права писать клиентам.</p>`;
  return {kind:'Сделка '+d.id,title:esc(d.client),sub:esc(d.kind+' · '+d.object),body:`
    <ol class="steps" style="--n:${stagesFor(d).length}">${stagesFor(d).map((x,i)=>`<li class="${i<stagePos(d)?'done':x.id===d.stageId?'cur':''}"><span>${esc(x.name)}</span></li>`).join('')}</ol>
    <dl class="kv"><dt>Объект</dt><dd>${esc(d.object)}</dd><dt>Менеджер</dt><dd>${esc(person(d.managerId)?.name||'нет данных: менеджер')}</dd><dt>Связь</dt><dd>${CH[d.channel]}</dd>${can('prices')?`<dt>Сумма</dt><dd>${d.amount?rub(d.amount):'не рассчитана'}</dd>`:''}</dl>
    <div><h4 class="sh">Товар под сделку</h4>${goods}</div>
    <div><h4 class="sh">Задачи</h4>${tasks}</div>
    <div class="stack-s"><h4 class="sh" style="margin:0">Переписка</h4>${chat}${compose}</div>`};
}

// Раздел «Сообщения клиентам»
// Перенесено из прототипа v2 без изменений логики.

// ——— сообщения клиентам ———
function tplSample(){const d=deal('Д-318');return d?`${fillTpl(d,'контроллер заряда MPPT 60 А — 1 шт',true)}<small>${CH[S.ui.tplCh]} · авто</small>`:''}
function vMessages(){
  const ed=can('auto');
  const rules=`<section class="card"><div class="card-h"><h3>Правила: когда и что делаем</h3>${ed?'':'<span class="pill sm">менять может директор</span>'}</div><ul class="rules">${S.rules.map(r=>`<li class="rule"><label class="sw"><input type="checkbox" id="rule-${r.id}" data-on="rule" data-id="${r.id}" ${r.on?'checked':''} ${ed?'':'disabled'} aria-label="${esc(r.when)}"><span class="sw-t" aria-hidden="true"></span></label><div><p><b>Когда:</b> ${esc(r.when)}</p><p><b>Делаем:</b> ${esc(r.then)}</p></div></li>`).join('')}</ul></section>`;
  const tpl=`<section class="card"><div class="card-h"><h3>Шаблон «Товар пришёл на склад»</h3><div class="seg">${['telegram','max'].map(c=>`<button class="${S.ui.tplCh===c?'on':''}" data-act="tpl-ch" data-ch="${c}">${CH[c]}</button>`).join('')}</div></div><div class="card-b tpl-grid"><div class="stack-s"><div class="field"><label for="tpl">Текст сообщения</label><textarea id="tpl" class="inp" rows="6" data-on="tpl" ${ed?'':'disabled'}>${esc(S.tpl)}</textarea></div><div class="vars"><span>Вставить:</span>${VARS.map(v=>`<button class="chip" data-act="ins-var" data-v="${v}" ${ed?'':'disabled'}>${v}</button>`).join('')}</div><div class="field"><label for="addr">Адрес склада для сообщений</label><input id="addr" class="inp" data-on="addr" value="${esc(S.address)}" placeholder="Нет данных — впишите адрес склада" ${ed?'':'disabled'}></div></div><div><p class="prev-h" id="tpl-h">Так увидит клиент в ${CH[S.ui.tplCh]} · пример по сделке Д-318</p><div class="chat"><div class="bub out" id="tpl-prev">${tplSample()}</div></div></div></div></section>`;
  const log=`<section class="card clip"><div class="card-h"><h3>Журнал сообщений</h3><span class="pill sun sm">прототип: сообщения не отправляются</span></div><div class="xs"><table class="tbl"><thead><tr><th>Когда</th><th>Клиент</th><th>Канал</th><th>Сообщение</th><th>Кто</th></tr></thead><tbody>${S.msgs.slice().sort((a,b)=>b.at-a.at).map(x=>{const d=deal(x.deal);return `<tr><td class="nowrap">${fWhen(x.at)}</td><td><div class="pname"><span>${esc(d?.client||'')}</span><small class="mono">${x.deal}</small></div></td><td>${chPill(x.channel)}</td><td class="msg-cell">${esc(x.text)}</td><td class="nowrap">${x.inbound?'<span class="pill sm">ответ клиента</span>':x.auto?'<span class="pill violet sm">авто</span>':esc(person(x.by)?.name||'')}</td></tr>`}).join('')}</tbody></table></div></section>`;
  return rules+tpl+log;
}
function updTpl(){const p=byId('tpl-prev');if(p) p.innerHTML=tplSample();const h=byId('tpl-h');if(h) h.textContent=`Так увидит клиент в ${CH[S.ui.tplCh]} · пример по сделке Д-318`}

// Раздел «Сотрудники и права»

// ——— сотрудники и права ———
const isEngineer=p=>p.role==='engineer'||p.role==='chiefEngineer';
function vTeam(){
  const pick=S.roles.filter(r=>!r.all);
  const roleCell=p=>Perms.roleOf(S,p.id)?.all?esc(roleName(p)):`<select class="inp sm w-auto" id="pr-${esc(p.id)}" data-on="person-role" data-id="${esc(p.id)}" aria-label="Роль: ${esc(p.name)}">${pick.map(r=>`<option value="${esc(r.id)}" ${p.role===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select>`;
  const specCell=p=>isEngineer(p)?`<select class="inp sm w-auto" id="ps-${esc(p.id)}" data-on="person-spec" data-id="${esc(p.id)}" aria-label="Специализация: ${esc(p.name)}">${p.specialty?'':'<option value="">нет данных</option>'}${Object.entries(SPECIALTY).map(([k,v])=>`<option value="${k}" ${p.specialty===k?'selected':''}>${v}</option>`).join('')}</select>`:'<span class="muted">—</span>';
  const emp=`<section class="card clip"><div class="card-h"><h3>Сотрудники</h3><span class="muted sm">${S.people.length} ${pl(S.people.length,'человек','человека','человек')}${S.people.some(p=>p.demo)?' · демо: примеры, не ваши сотрудники':''}</span></div><div class="xs"><table class="tbl"><thead><tr><th>Сотрудник</th><th>Отдел</th><th>Роль</th><th>Специализация</th><th></th></tr></thead><tbody>${S.people.map(p=>`<tr><td><span class="who">${av(p)}${esc(p.name)}${p.demo?' <span class="pill sm">демо</span>':''}</span></td><td>${esc(deptName(p.dept))}</td><td>${roleCell(p)}</td><td>${specCell(p)}</td><td class="num"><button class="btn sm ghost" data-act="view-as" data-id="${esc(p.id)}">${ic('eye')}Войти как</button></td></tr>`).join('')}</tbody></table></div></section>`;
  const mx=`<section class="card clip"><div class="card-h"><h3>Что может каждая роль</h3></div><div class="card-b"><p class="hint">Галочки работают сразу. Попробуйте: снимите «Видеть цены и суммы» у менеджера B2B, затем вверху выберите менеджера B2B — колонка цен пропадёт. У директора права не снимаются.</p></div><div class="xs"><table class="tbl matrix"><thead><tr><th>Право</th>${S.roles.map(r=>`<th class="c">${esc(r.name)}</th>`).join('')}</tr></thead><tbody>${Perms.LIST.map(([k,l])=>`<tr><td>${l}</td>${S.roles.map(r=>`<td class="c"><input type="checkbox" id="pm-${esc(r.id)}-${k}" data-on="perm" data-role="${esc(r.id)}" data-perm="${k}" ${r.all||r.perms[k]?'checked':''} ${r.all?'disabled':''} aria-label="${l} — ${esc(r.name)}"></td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
  return emp+mx;
}

// Раздел «Настройки»: вкладки из реестра SETTINGS_TABS, по order слева направо.
// Вкладка — {id, label, order, ok:()=>bool, render:()=>html}; render — вид S → HTML, состояние не меняет.
// Следующий таск добавляет свою вкладку одной строкой в своём файле: SETTINGS_TABS.push({…}).
// Порядок вкладок по спецификации (R34): Внешний вид 10 · Уведомления · Воронки · Почта · Лиды ·
// Склады и юрлица · Поставки · Роли и права · Данные 90.
const SETTINGS_TABS=[];
// Вкладки, открытые текущему человеку
const settingsTabs=()=>SETTINGS_TABS.filter(t=>t.ok()).sort((a,b)=>a.order-b.order);
// Открытая вкладка: выбранная (S.ui.setTab), если её видно этому человеку, иначе первая видимая
const settingsTab=()=>{const vis=settingsTabs();return vis.find(t=>t.id===S.ui.setTab)||vis[0]||null};

function vSettings(){
  const vis=settingsTabs(),cur=settingsTab();
  const tabs=`<div class="seg set-tabs" role="tablist" aria-label="Вкладки настроек">${vis.map(t=>`<button type="button" role="tab" aria-selected="${t===cur}" class="${t===cur?'on':''}" data-act="set-tab" data-tab="${esc(t.id)}">${esc(t.label)}</button>`).join('')}</div>`;
  return `<div class="bar">${tabs}</div>${cur?cur.render():''}`;
}

SETTINGS_TABS.push(
  {id:'look',label:'Внешний вид',order:10,ok:()=>true,render:()=>`<section class="card"><div class="card-h"><h3>Тема</h3></div><div class="card-b stack-s">
    ${themeSwitch(false)}
    <p class="hint">«Как в системе» — светлая или тёмная, как настроено на этом устройстве, и меняется вместе с ним. Тот же переключатель — значками в шапке. Выбор запоминается в этом браузере.</p>
  </div></section>`},
  {id:'data',label:'Данные',order:90,ok:()=>can('settings'),render:()=>`<section class="card"><div class="card-h"><h3>Данные прототипа</h3></div><div class="card-b stack-s">
    <p class="m0"><b>Где хранятся:</b> в этом браузере, на этом компьютере. В другом браузере или на другом компьютере — свои данные, общего сервера у прототипа нет.</p>
    <p class="hint">Сброс вернёт задачи, поставки, резервы, сделки, уведомления и остальное к исходным примерам. Перед сбросом прототип переспросит.</p>
    <div><button type="button" class="btn" data-act="reset">Сбросить данные прототипа</button></div>
  </div></section>`}
);

NAV.push({id:'settings',label:'Настройки',icon:'sliders',group:'Настройки',order:10,ok:()=>settingsTabs().length>0});
VIEWS.settings=vSettings;
A['set-tab']=el=>{S.ui.setTab=el.dataset.tab;render()};

// Запуск: состояние из браузера (localStorage[Store.KEY]); нет или битое — демо seed(). Затем первая отрисовка.

S=startState();
render();
})();
</script>
