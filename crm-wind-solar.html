  // 3 — почта: st.mail (ящики, поставщики, письма). Старое сохранение без неё уходит в пользу демо.
  const REV = 3;
  // Браузер даёт сайту около 5 млн символов на всё; берём с запасом.
  const LIMIT = 4500000;
  const NO_SPACE = 'не сохранено — мало места в браузере';
  // Фото в состоянии — строки data:image/… (снимки с телефона при приёмке).
  const PHOTO = /^data:image\//;

  // Date из любого «мира» (страница, node:vm в тестах) — не через instanceof.
  const isDate = v => Object.prototype.toString.call(v) === '[object Date]';
  const isPhoto = v => typeof v === 'string' && PHOTO.test(v);

  // Копия состояния, пригодная для JSON: даты → {$date: ISO}, ui не сохраняется.
  function plain(v, top) {
    if (isDate(v)) return { $date: isNaN(v.getTime()) ? null : v.toISOString() };
    if (Array.isArray(v)) return v.map(x => plain(x, false));
    if (v && typeof v === 'object') {
      const o = {};
      for (const k of Object.keys(v)) {
        if (top && k === 'ui') continue;
        const x = v[k];
        if (x === undefined || typeof x === 'function') continue;
        o[k] = plain(x, false);
      }
      return o;
    }
    return v;
  }

  // Выкидывает фото из копии; запись, где они были, помечается. Возвращает, сколько фото выкинуто.
  function dropPhotos(node) {
    let total = 0;
    const walk = (v, owner) => {
      if (Array.isArray(v)) { v.forEach(x => walk(x, owner)); return; }
      if (!v || typeof v !== 'object') return;
      let here = 0;
      for (const k of Object.keys(v)) {
        const x = v[k];
        if (isPhoto(x)) { v[k] = null; here++; continue; }
        if (Array.isArray(x)) {
          const keep = x.filter(y => !isPhoto(y));
          here += x.length - keep.length;
          v[k] = keep;
          keep.forEach(y => walk(y, v));
          continue;
        }
        walk(x, v);
      }
      if (here) {
        const prev = v.unsaved && v.unsaved.photos || 0;
        v.unsaved = { photos: prev + here, text: NO_SPACE };
        total += here;
      }
    };
    walk(node, null);
    return total;
  }

  // Состояние → {text, droppedPhotos, fits}. Не влезает в limit — фото выкидываются
  // (droppedPhotos — сколько), их записи помечаются «не сохранено — мало места в браузере».
  // Само состояние не меняется.
  function dump(state, limit = LIMIT) {
    const copy = plain(state, true);
    // товары снимка каталога в браузер не идут: они константы файла (Catalog.pack), пишется только изменяемое
    const packed = Catalog.pack(copy.products);
    if (packed) Object.assign(copy, packed);
    copy.rev = REV;
    let text = JSON.stringify(copy);
    let droppedPhotos = 0;
    if (text.length > limit) {
      droppedPhotos = dropPhotos(copy);
      if (droppedPhotos) text = JSON.stringify(copy);
    }
    return { text, droppedPhotos, fits: text.length <= limit };
  }

  // Строка из localStorage → состояние с живыми датами; пусто, мусор или чужая версия схемы → null
  // (тогда запуск берёт seed()).
  function load(raw) {
    if (typeof raw !== 'string' || !raw) return null;
    let st;
    try {
      st = JSON.parse(raw, (k, v) => {
        if (v && typeof v === 'object' && !Array.isArray(v)) {
          const keys = Object.keys(v);
          if (keys.length === 1 && keys[0] === '$date') return new Date(v.$date === null ? NaN : v.$date);
        }
        return v;
      });
    } catch (_) { return null; }
    if (!st || typeof st !== 'object' || Array.isArray(st) || st.v !== VERSION || st.rev !== REV) return null;
    delete st.rev;
    return Catalog.unpack(st);
  }

  // Свободный id для новой записи списка: не совпадёт ни с одним сохранённым (общий для ядра).
  function freeId(list, prefix) {
    const used = new Set((list || []).map(x => x && x.id));
    let n = (list || []).length + 1;
    while (used.has(prefix + n)) n++;
    return prefix + n;
  }

  return { KEY, VERSION, REV, LIMIT, NO_SPACE, load, dump, freeId };
})();

// Ядро: роли и права. Роли — данные (st.roles), проверки спрашивают право, а не название роли.
// Встроенные роли не удаляются; у директора все права, и снять их нельзя.

const Perms = (() => {
  // Права: ключ и подпись. Первые тринадцать — как в v2, дальше новые.
  const LIST = [
    ['firm', 'Видеть сводку по всей фирме'],
    ['tasksAll', 'Видеть задачи всех отделов'],
    ['tasksAssign', 'Ставить задачи другим отделам'],
    ['stock', 'Видеть остатки, резервы и поставки'],
    ['prices', 'Видеть цены и суммы'],
    ['reserve', 'Ставить и снимать резервы'],
    ['catalog', 'Добавлять товары в номенклатуру'],
    ['logistics', 'Отмечать этапы перевозки'],
    ['receive', 'Принимать товар на склад'],
    ['clients', 'Видеть клиентов и сделки'],
    ['write', 'Писать клиентам в Telegram и MAX'],
    ['auto', 'Настраивать авто-сообщения'],
    ['admin', 'Управлять сотрудниками и правами'],
    ['mail', 'Работать с почтой своих ящиков'],
    ['leads', 'Видеть и вести лиды'],
    ['dealsAll', 'Видеть сделки всех типов'],
    ['settings', 'Менять настройки фирмы'],
  ];
  const KEYS = LIST.map(p => p[0]);

  // Права по умолчанию — «Решения по реализации» спецификации.
  // Менеджер видит лиды и сделки своего типа (scope), dealsAll у него нет.
  const ENGINEER = ['tasksAssign', 'stock', 'clients', 'dealsAll'];
  const DEFAULTS = [
    { id: 'director', name: 'Директор', all: true, on: KEYS },
    { id: 'managerB2b', name: 'Менеджер B2B', scope: 'b2b', on: ['stock', 'prices', 'reserve', 'leads', 'clients', 'write', 'mail'] },
    { id: 'managerB2c', name: 'Менеджер B2C', scope: 'b2c', on: ['stock', 'prices', 'reserve', 'leads', 'clients', 'write', 'mail'] },
    { id: 'logist', name: 'Логист', on: ['stock', 'logistics', 'mail', 'tasksAssign'] },
    { id: 'warehouse', name: 'Кладовщик', on: ['stock', 'receive'] },
    // Главный инженер и инженер — одна матрица (R30).
    { id: 'chiefEngineer', name: 'Главный инженер', on: ENGINEER },
    { id: 'engineer', name: 'Инженер', on: ENGINEER },
  ];

  // Полная матрица {право: да/нет} из списка включённых прав или из готовой матрицы.
  function matrix(perms) {
    const on = Array.isArray(perms) ? perms : Object.keys(perms || {}).filter(k => perms[k] === true);
    const m = {};
    for (const k of KEYS) m[k] = on.includes(k);
    return m;
  }

  // Встроенные роли — новая копия на каждый вызов (для seed()).
  function defaultRoles() {
    return DEFAULTS.map(r => {
      const role = { id: r.id, name: r.name, builtin: true, perms: matrix(r.on) };
      if (r.all) role.all = true;
      if (r.scope) role.scope = r.scope;
      return role;
    });
  }

  const person = (st, personId) => (st.people || []).find(p => p.id === personId) || null;

  function roleOf(st, personId) {
    const p = person(st, personId);
    if (!p) return null;
    return (st.roles || []).find(r => r.id === p.role) || null;
  }

  // Может ли человек это. Неизвестное право — нет ни у кого (опечатка не открывает доступ).
  function can(st, personId, perm) {
    if (!KEYS.includes(perm)) return false;
    const role = roleOf(st, personId);
    if (!role) return false;
    if (role.all) return true;
    return !!(role.perms && role.perms[perm] === true);
  }

  // Своя роль директора: имя и права. Пустое или занятое имя → null.
  function addRole(st, name, perms) {
    const n = String(name || '').trim();
    if (!n) return null;
    st.roles = st.roles || [];
    if (st.roles.some(r => r.name.trim().toLowerCase() === n.toLowerCase())) return null;
    const role = { id: Store.freeId(st.roles, 'role'), name: n, builtin: false, perms: matrix(perms) };
    st.roles.push(role);
    return role;
  }

  const staff = n => n % 10 === 1 && n % 100 !== 11 ? 'сотрудник'
    : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'сотрудника' : 'сотрудников';

  // Удалить роль: встроенную нельзя, роль с людьми нельзя, пока их не переназначат.
  function removeRole(st, roleId) {
    const roles = st.roles || [];
    const role = roles.find(r => r.id === roleId);
    if (!role) return { ok: false, reason: 'Роль не найдена' };
    if (role.builtin) return { ok: false, reason: `Роль «${role.name}» встроенная — её нельзя удалить` };
    const n = (st.people || []).filter(p => p.role === roleId).length;
    if (n) return { ok: false, reason: `На роли «${role.name}» ${n} ${staff(n)} — сначала назначьте им другую роль` };
    st.roles = roles.filter(r => r.id !== roleId);
    return { ok: true, reason: '' };
  }

  return { LIST, defaultRoles, roleOf, can, addRole, removeRole };
})();

// Ядро: воронки всех видов — доски задач, сделки B2B и B2C, лиды, поставки.
// Одна модель «воронка с этапами»; запись хранит id этапа, не номер, поэтому
// переименование, вставка и удаление этапа данные не ломают.
// «Сделано/закрыто» — флаг final у этапа, «прибыло, ждёт приёмки» — флаг arrived.

const Pipes = (() => {
  const KINDS = ['tasks', 'deals', 'leads', 'ships'];
  // Где лежат записи вида и в каком поле id воронки.
  const STORE = {
    tasks: { list: 'tasks', field: 'boardId' },
    deals: { list: 'deals', field: 'pipeId' },
    leads: { list: 'leads', field: 'pipeId' },
    ships: { list: 'shipments', field: 'pipeId' },
  };

  const S_ = (id, name, flag) => (flag ? { id, name, flag } : { id, name });
  const DEAL_STAGES = () => [
    S_('request', 'Заявка'), S_('calc', 'Расчёт'), S_('offer', 'КП'), S_('contract', 'Договор'),
    S_('payment', 'Оплата'), S_('delivery', 'Поставка'), S_('install', 'Монтаж'), S_('done', 'Сдана', 'final'),
  ];
  // Воронки по умолчанию — ровно как в interfaces.md. Новая копия на каждый вызов (для seed()).
  function defaults() {
    return [
      { id: 'tasksCommon', kind: 'tasks', name: 'Общие', stages: [
        S_('new', 'Новые'), S_('work', 'В работе'), S_('review', 'На проверке'), S_('done', 'Готово', 'final'),
      ] },
      { id: 'dealsB2b', kind: 'deals', name: 'Сделки B2B', scope: 'b2b', stages: DEAL_STAGES() },
      { id: 'dealsB2c', kind: 'deals', name: 'Сделки B2C', scope: 'b2c', stages: DEAL_STAGES() },
      { id: 'leads', kind: 'leads', name: 'Лиды', stages: [
        S_('new', 'Новый'), S_('contacted', 'Связались'), S_('qualified', 'Квалифицирован'),
        S_('deal', 'Сделка создана', 'final'), S_('lost', 'Отказ', 'final'),
      ] },
      { id: 'ships', kind: 'ships', name: 'Поставки', stages: [
        S_('ordered', 'Заказано'), S_('shipped', 'Отгружено поставщиком'), S_('toBorder', 'В пути до границы'),
        S_('customs', 'Таможня'), S_('transship', 'Перевалка в Чите'), S_('toStock', 'В пути до склада'),
        S_('arrived', 'Прибыло в город', 'arrived'), S_('inStock', 'На складе', 'final'),
      ] },
    ];
  }

  const pipes = st => st.pipelines || [];
  const pipe = (st, pipeId) => pipes(st).find(p => p.id === pipeId) || null;
  const clean = name => String(name || '').trim();

  // Воронки вида; со scope — этого типа и общие (без scope).
  function of(st, kind, scope) {
    return pipes(st).filter(p => p.kind === kind && (!scope || !p.scope || p.scope === scope));
  }

  function stage(st, pipeId, stageId) {
    const p = pipe(st, pipeId);
    return (p && p.stages.find(s => s.id === stageId)) || null;
  }

  function isFinal(st, pipeId, stageId) {
    const s = stage(st, pipeId, stageId);
    return !!s && s.flag === 'final';
  }

  // Записи воронки (задачи доски, сделки, лиды, поставки).
  function items(st, pipeId) {
    const p = pipe(st, pipeId);
    if (!p) return [];
    const { list, field } = STORE[p.kind];
    return (st[list] || []).filter(x => x[field] === pipeId);
  }

  function rename(st, pipeId, name) {
    const p = pipe(st, pipeId), n = clean(name);
    if (!p) return { ok: false, reason: 'Воронка не найдена' };
    if (!n) return { ok: false, reason: 'Название не может быть пустым' };
    p.name = n;
    return { ok: true, reason: '' };
  }

  function renameStage(st, pipeId, stageId, name) {
    const s = stage(st, pipeId, stageId), n = clean(name);
    if (!s) return { ok: false, reason: 'Этап не найден' };
    if (!n) return { ok: false, reason: 'Название не может быть пустым' };
    s.name = n;
    return { ok: true, reason: '' };
  }

  // Новый этап после afterId, без него — в конец. Возвращает этап или null.
  function addStage(st, pipeId, name, afterId) {
    const p = pipe(st, pipeId), n = clean(name);
    if (!p || !n) return null;
    const s = { id: Store.freeId(p.stages, 's'), name: n };
    const i = afterId ? p.stages.findIndex(x => x.id === afterId) : -1;
    if (i < 0) p.stages.push(s); else p.stages.splice(i + 1, 0, s);
    return s;
  }

  const FLAG = { final: 'завершающий', arrived: '«прибыло, ждёт приёмки»' };

  // Удалить этап: его записи переезжают на этап moveToId той же воронки, ни одна не теряется.
  function removeStage(st, pipeId, stageId, moveToId) {
    const p = pipe(st, pipeId);
    if (!p) return { ok: false, moved: 0, reason: 'Воронка не найдена' };
    const s = p.stages.find(x => x.id === stageId);
    if (!s) return { ok: false, moved: 0, reason: 'Этап не найден' };
    if (p.stages.length < 2) return { ok: false, moved: 0, reason: 'Последний этап воронки удалить нельзя' };
    if (s.flag && !p.stages.some(x => x !== s && x.flag === s.flag)) {
      return { ok: false, moved: 0, reason: `Этап «${s.name}» — единственный ${FLAG[s.flag] || s.flag} в воронке «${p.name}»` };
    }
    const here = items(st, pipeId).filter(x => x.stageId === stageId);
    const to = p.stages.find(x => x.id === moveToId && x.id !== stageId);
    if (here.length && !to) return { ok: false, moved: 0, reason: `На этапе «${s.name}» ${here.length} зап. — выберите, куда их перенести` };
    here.forEach(x => { x.stageId = to.id; });
    p.stages = p.stages.filter(x => x !== s);
    return { ok: true, moved: here.length, reason: '' };
  }

  // Новая воронка вида: этапы — копия воронки по умолчанию этого вида.
  function addPipe(st, kind, name, scope) {
    const n = clean(name);
    if (!KINDS.includes(kind) || !n) return null;
    const base = defaults().find(p => p.kind === kind);
    st.pipelines = pipes(st);
    const p = { id: Store.freeId(st.pipelines, kind), kind, name: n, stages: base.stages };
    if (scope) p.scope = scope;
    st.pipelines.push(p);
    return p;
  }

  // Этап в другой воронке для переезжающей записи: тот же id → то же название → тот же флаг → первый.
  function matchStage(from, to, stageId) {
    const s = from.stages.find(x => x.id === stageId);
    return to.stages.find(x => x.id === stageId)
      || (s && to.stages.find(x => x.name === s.name))
      || (s && s.flag && to.stages.find(x => x.flag === s.flag))
      || to.stages[0];
  }

  // Удалить воронку: последнюю своего вида нельзя; записи переезжают в moveToPipeId того же вида.
  function removePipe(st, pipeId, moveToPipeId) {
    const p = pipe(st, pipeId);
    if (!p) return { ok: false, moved: 0, reason: 'Воронка не найдена' };
    if (of(st, p.kind).length < 2) return { ok: false, moved: 0, reason: `«${p.name}» — последняя воронка этого вида, её нельзя удалить` };
    const here = items(st, pipeId);
    const to = moveToPipeId !== pipeId ? pipe(st, moveToPipeId) : null;
    if (here.length && (!to || to.kind !== p.kind)) {
      return { ok: false, moved: 0, reason: `В воронке «${p.name}» ${here.length} зап. — выберите воронку того же вида, куда их перенести` };
    }
    const { field } = STORE[p.kind];
    here.forEach(x => { x.stageId = matchStage(p, to, x.stageId).id; x[field] = to.id; });
    st.pipelines = pipes(st).filter(x => x !== p);
    return { ok: true, moved: here.length, reason: '' };
  }

  return { KINDS, defaults, of, stage, isFinal, items, rename, renameStage, addStage, removeStage, addPipe, removePipe };
})();

// Ядро: остатки, резервы и журнал движений. Чистая логика, без DOM и текущего времени —
// время приходит аргументом. Свободный остаток считает summary() — единственное место формулы.
//
// Данные состояния (схема v3):
//   stock[productId][entityId|'_'][cityId|'_'] = количество; '_' — «нет данных» (в таблице менеджеров города нет);
//   aside[productId] = {damaged, custody, transitNoShip} — «Бой», ответхранение, «В пути» без поставки;
//   reserves[{id, productId, qty, entityId, cityId, src:'stock'|shipId, dealId, until}];
//   moves[{at, productId, kind, qty, entityId, cityId, doc, by}] — новые записи сверху.
// Пустая клетка — null или нет ключа, не ноль: «0» в таблице и «не заполнено» — разные вещи.

const Stock = (() => {
  // «Нет данных»: юрлицо или город в источнике не указаны.
  const ANY = '_';
  // Виды движений — подписи как на экране и в журнале.
  const KINDS = { receive: 'Приход', ship: 'Отгрузка', reserve: 'Резерв', unreserve: 'Снят резерв', transfer: 'Перемещение', damage: 'Списание в бой' };
  const NO_ENTITY = 'нет данных: юрлицо';
  const NO_CITY = 'нет данных: город';

  // Юрлица и города по умолчанию — свежая копия на каждый вызов (для seed()). Адрес склада пуст: «нет данных: адрес».
  function defaults() {
    return {
      entities: [{ id: 'ip', name: 'ИП' }, { id: 'npp', name: 'НПП' }, { id: 'vs', name: 'ВС' }],
      cities: [{ id: 'irk', name: 'Иркутск', address: '' }, { id: 'msk', name: 'Москва', address: '' }, { id: 'krd', name: 'Краснодар', address: '' }],
    };
  }

  const isNum = v => typeof v === 'number' && isFinite(v);
  const sum = (list, f) => list.reduce((a, x) => a + f(x), 0);
  const total = vals => { const n = vals.filter(isNum); return n.length ? sum(n, x => x) : null; };

  // Подпись юрлица или города; неизвестный id (не из справочника) → null.
  const nameIn = (list, id, none) => (id === ANY ? none : (list || []).find(x => x.id === id)?.name ?? null);
  const entityName = (st, id) => nameIn(st.entities, id, NO_ENTITY);
  const cityName = (st, id) => nameIn(st.cities, id, NO_CITY);

  // ——— таблица «юрлицо × город» ———
  // rows — юрлица из справочника, затем '_' (если есть данные без юрлица); cols — то же для городов.
  // cell(e, c) — число или null (пусто). totals: rows[e], cols[c], all — суммы по непустым клеткам, null — если все пусты.
  function grid(st, productId) {
    const data = (st.stock && st.stock[productId]) || {};
    const entKeys = Object.keys(data);
    const cityKeys = [...new Set(entKeys.flatMap(e => Object.keys(data[e] || {})))];
    const order = (known, keys) => {
      const ids = known.map(x => x.id);
      return [...ids, ...keys.filter(k => k !== ANY && !ids.includes(k)), ...(keys.includes(ANY) ? [ANY] : [])];
    };
    const rows = order(st.entities || [], entKeys).map(id => ({ id, name: entityName(st, id) ?? id }));
    const cols = order(st.cities || [], cityKeys).map(id => ({ id, name: cityName(st, id) ?? id }));
    const cell = (e, c) => (data[e] && isNum(data[e][c]) ? data[e][c] : null);
    const totals = {
      rows: Object.fromEntries(rows.map(r => [r.id, total(cols.map(c => cell(r.id, c.id)))])),
      cols: Object.fromEntries(cols.map(c => [c.id, total(rows.map(r => cell(r.id, c.id)))])),
      all: total(rows.flatMap(r => cols.map(c => cell(r.id, c.id)))),
    };
    return { rows, cols, cell, totals };
  }

  // ——— поставки в пути ———
  // Входящая поставка, ещё не принятая на склад (этап без флага final), по возрастанию ожидаемой даты.
  function incomingOf(st, productId) {
    return (st.shipments || [])
      .filter(s => s.dir === 'in' && !Pipes.isFinal(st, s.pipeId, s.stageId))
      .flatMap(s => (s.items || []).filter(i => i.productId === productId).map(i => ({ shipId: s.id, qty: i.qty, eta: s.eta })))
      .sort((a, b) => a.eta - b.eta);
  }

  // Сколько в поставке ещё не отдано под резервы (для резерва «из поставки»).
  function freeIn(st, shipId, productId) {
    const s = (st.shipments || []).find(x => x.id === shipId);
    const q = s ? sum((s.items || []).filter(i => i.productId === productId), i => i.qty) : 0;
    return q - sum((st.reserves || []).filter(r => r.src === shipId && r.productId === productId), r => r.qty);
  }

  // ——— свободный остаток: единственный расчёт ———
  // onHand — годный остаток на складах по всем юрлицам и городам. «Бой», ответхранение и «В пути» (без поставки)
  // лежат отдельно (damaged, custody, transitNoShip; null — в таблице пусто) и в свободный остаток не входят.
  // free = onHand − резервы со склада.
  // freeAfter = free + incoming (поставки в пути) − reservedIncoming (резервы под эти поставки).
  // known — в таблице остатков по товару есть хоть одно число (иначе остаток «нет данных»).
  // now принимается по договору интерфейса: резервы с истёкшим сроком пока остаются в силе, пока их не сняли.
  function summary(st, productId, now) {
    void now;
    const g = grid(st, productId);
    const a = (st.aside && st.aside[productId]) || {};
    const inc = incomingOf(st, productId);
    const rs = (st.reserves || []).filter(r => r.productId === productId);
    const onHand = g.totals.all ?? 0;
    const reservedStock = sum(rs.filter(r => r.src === 'stock'), r => r.qty);
    const reservedIncoming = sum(rs.filter(r => r.src !== 'stock'), r => r.qty);
    const incoming = sum(inc, x => x.qty);
    const free = onHand - reservedStock;
    return {
      known: g.totals.all !== null,
      onHand,
      damaged: isNum(a.damaged) ? a.damaged : null,
      custody: isNum(a.custody) ? a.custody : null,
      transitNoShip: isNum(a.transitNoShip) ? a.transitNoShip : null,
      incoming, reservedStock, reservedIncoming,
      free,
      freeAfter: free + incoming - reservedIncoming,
      nextEta: inc.length ? inc[0].eta : null,
    };
  }

  // ——— резервы ———
  // Где лежит резерв со склада: юрлицо и город ('_' — не указаны).
  const cellKey = r => (r.entityId || ANY) + '|' + (r.cityId || ANY);

  // Можно ли поставить резерв {productId, qty, entityId, cityId, src}: src — 'stock' (по умолчанию) или id поставки.
  // Со склада: не больше свободного в клетке «юрлицо × город» и не больше свободного по товару в целом.
  // → {ok, max, reason}: max — сколько можно поставить, reason — по-русски, с этим числом.
  function canReserve(st, { productId, qty, entityId, cityId, src } = {}) {
    const source = src || 'stock';
    const e = entityId || ANY, c = cityId || ANY;
    let max = 0, where = '';
    if (source === 'stock') {
      const en = entityName(st, e), cn = cityName(st, c);
      if (en === null) return { ok: false, max: 0, reason: 'Такого юрлица нет в справочнике.' };
      if (cn === null) return { ok: false, max: 0, reason: 'Такого города нет в справочнике.' };
      const have = grid(st, productId).cell(e, c) ?? 0;
      const held = sum((st.reserves || []).filter(r => r.productId === productId && r.src === 'stock' && cellKey(r) === e + '|' + c), r => r.qty);
      max = Math.max(0, Math.min(have - held, summary(st, productId).free));
      where = `Со склада (${en}, ${cn}) свободно только ${max}.`;
    } else {
      const s = (st.shipments || []).find(x => x.id === source);
      if (!s || Pipes.isFinal(st, s.pipeId, s.stageId)) return { ok: false, max: 0, reason: `Поставки ${source} нет среди ожидаемых.` };
      max = Math.max(0, freeIn(st, source, productId));
      where = `В поставке ${source} свободно только ${max}.`;
    }
    const q = Number(qty);
    if (!Number.isInteger(q) || q < 1) return { ok: false, max, reason: 'Укажите количество — целое число больше нуля.' };
    if (q > max) return { ok: false, max, reason: `${where} Уменьшите количество или выберите другой склад.` };
    return { ok: true, max, reason: '' };
  }

  // Клетка склада, откуда лучше всего резервировать: где больше всего свободного. Нет остатка → ('_', '_').
  function bestCell(st, productId) {
    const g = grid(st, productId);
    let best = { entityId: ANY, cityId: ANY }, top = 0;
    for (const r of g.rows) for (const c of g.cols) {
      const held = sum((st.reserves || []).filter(x => x.productId === productId && x.src === 'stock' && cellKey(x) === r.id + '|' + c.id), x => x.qty);
      const free = (g.cell(r.id, c.id) ?? 0) - held;
      if (free > top) { top = free; best = { entityId: r.id, cityId: c.id }; }
    }
    return best;
  }

  // ——— журнал движений ———
  function log(st, rec) {
    if (!st.moves) st.moves = [];
    st.moves.unshift(rec);
    return rec;
  }
  function addTo(st, productId, e, c, delta) {
    if (!st.stock) st.stock = {};
    const byE = st.stock[productId] || (st.stock[productId] = {});
    const byC = byE[e] || (byE[e] = {});
    byC[c] = (isNum(byC[c]) ? byC[c] : 0) + delta;
  }

  // Движение товара, меняющее остаток: Приход, Отгрузка, Списание в бой, Перемещение
  // ({kind, productId, qty, entityId, cityId, toEntityId?, toCityId?, doc, by, at}). Остаток и журнал — вместе.
  // Резерв и его снятие — через reserve() и unreserve(): им нужна запись резерва.
  // → {ok, move} или {ok:false, reason}; при отказе ничего не меняется.
  function move(st, { kind, productId, qty, entityId, cityId, toEntityId, toCityId, doc, by, at } = {}) {
    const q = Number(qty), e = entityId || ANY, c = cityId || ANY;
    if (![KINDS.receive, KINDS.ship, KINDS.damage, KINDS.transfer].includes(kind)) {
      return { ok: false, reason: `Движение «${kind}» не меняет остаток: резервы ставит и снимает reserve / unreserve.` };
    }
    if (!Number.isInteger(q) || q < 1) return { ok: false, reason: 'Укажите количество — целое число больше нуля.' };
    const rec = { at, productId, kind, qty: q, entityId: e, cityId: c, doc, by };
    if (kind !== KINDS.receive) {
      const have = grid(st, productId).cell(e, c) ?? 0;
      if (q > have) return { ok: false, reason: `В клетке «${entityName(st, e) ?? e}, ${cityName(st, c) ?? c}» только ${have}, а нужно ${q}.` };
      addTo(st, productId, e, c, -q);
    }
    if (kind === KINDS.receive) addTo(st, productId, e, c, q);
    if (kind === KINDS.transfer) {
      rec.toEntityId = toEntityId || ANY; rec.toCityId = toCityId || ANY;
      addTo(st, productId, rec.toEntityId, rec.toCityId, q);
    }
    if (kind === KINDS.damage) {
      if (!st.aside) st.aside = {};
      const a = st.aside[productId] || (st.aside[productId] = { damaged: null, custody: null, transitNoShip: null });
      a.damaged = (isNum(a.damaged) ? a.damaged : 0) + q;
    }
    return { ok: true, move: log(st, rec) };
  }

  // Поставить резерв {productId, qty, entityId, cityId, src, dealId, until, by, at}. Сначала canReserve.
  // → {ok, reserve, max} или {ok:false, max, reason}. Запись в журнале — «Резерв».
  function reserve(st, p = {}) {
    const chk = canReserve(st, p);
    if (!chk.ok) return { ok: false, max: chk.max, reason: chk.reason };
    const src = p.src || 'stock';
    const ship = src === 'stock' ? null : st.shipments.find(x => x.id === src);
    const r = {
      id: Store.freeId(st.reserves, 'r'), productId: p.productId, qty: Number(p.qty),
      entityId: ship ? (ship.entityId || ANY) : (p.entityId || ANY), cityId: ship ? (ship.cityId || ANY) : (p.cityId || ANY),
      src, dealId: p.dealId, until: p.until,
    };
    st.reserves.push(r);
    log(st, { at: p.at, productId: r.productId, kind: KINDS.reserve, qty: r.qty, entityId: r.entityId, cityId: r.cityId, doc: r.dealId, by: p.by });
    return { ok: true, reserve: r, max: chk.max - r.qty };
  }

  // Снять резерв: товар возвращается в свободный остаток, в журнале — «Снят резерв». → {ok, reserve} | {ok:false, reason}
  function unreserve(st, reserveId, by, at) {
    const i = (st.reserves || []).findIndex(r => r.id === reserveId);
    if (i < 0) return { ok: false, reason: 'Такого резерва нет.' };
    const r = st.reserves.splice(i, 1)[0];
    log(st, { at, productId: r.productId, kind: KINDS.unreserve, qty: r.qty, entityId: r.entityId || ANY, cityId: r.cityId || ANY, doc: r.dealId, by });
    return { ok: true, reserve: r };
  }

  return { ANY, KINDS, NO_ENTITY, NO_CITY, defaults, entityName, cityName, grid, incomingOf, freeIn, summary, canReserve, bestCell, move, reserve, unreserve };
})();

// Ядро: почта — ящики, папки поставщиков, правила по адресам. Чистая логика, без DOM.
// Это имитация: наружу ничего не уходит, ответ только ложится в ветку письма с пометкой.
// Папка письма — id поставщика или INBOX. В ящике закупок INBOX — это «Разобрать»; в остальных ящиках
// все письма лежат в INBOX. Правило поставщика — строка: точный адрес 'adr@x' или домен '@x'.
// Данные (st.mail): boxes, suppliers, letters — схема в interfaces.md; у письма ещё replies — ветка ответов, поле появляется с первым ответом.

const Mail = (() => {
  const INBOX = 'inbox';
  const SIM_NOTE = 'имитация, не отправлено';
  const NOTE_KIND = 'mail';

  // Чтение терпит состояние без st.mail (старое сохранение): тогда просто нет ящиков и писем.
  const data = st => st.mail || { boxes: [], suppliers: [], letters: [] };
  const boxOf = (st, boxId) => data(st).boxes.find(b => b.id === boxId) || null;

  const fold = s => String(s ?? '').toLowerCase().replace(/ё/g, 'е');
  // Адрес отправителя без регистра; «Имя <adr@x>» → adr@x.
  const addrOf = from => {
    const s = String(from ?? '');
    const m = s.match(/<([^>]*)>/);
    return (m ? m[1] : s).trim().toLowerCase();
  };
  const domainOf = addr => { const i = addr.lastIndexOf('@'); return i >= 0 ? addr.slice(i + 1) : ''; };
  const ruleKey = r => String(r ?? '').trim().toLowerCase();
  // Подходит ли адрес под правило: '@домен' — любой адрес этого домена, иначе — ровно этот адрес.
  const matches = (rule, addr) => {
    if (!rule || !addr) return false;
    if (rule.startsWith('@')) return rule.length > 1 && domainOf(addr) === rule.slice(1);
    return rule === addr;
  };

  // Ящики, которые видит человек. Без права mail — никаких; директор — все; остальные — по ролям ящика.
  function boxesFor(st, personId) {
    if (!Perms.can(st, personId, 'mail')) return [];
    const role = Perms.roleOf(st, personId);
    const all = !!(role && role.all === true);
    return data(st).boxes.filter(b => all || (b.roles || []).includes(role.id));
  }

  // Папка письма. Только ящик закупок раскладывает по поставщикам: точный адрес сильнее домена.
  function folderOf(st, letter) {
    const box = boxOf(st, letter.boxId);
    if (!box || box.kind !== 'purchase') return INBOX;
    const addr = addrOf(letter.from);
    const sups = data(st).suppliers;
    const rulesOf = s => (s.rules || []).map(ruleKey);
    const exact = sups.find(s => rulesOf(s).some(r => !r.startsWith('@') && matches(r, addr)));
    if (exact) return exact.id;
    const byDomain = sups.find(s => rulesOf(s).some(r => r.startsWith('@') && matches(r, addr)));
    return byDomain ? byDomain.id : INBOX;
  }

  // «Это поставщик X, запомнить адрес»: правило (адрес или весь домен) — поставщику; письма этого ящика,
  // которые теперь по правилам лежат у него, переезжают в его папку. Правило живёт у одного поставщика.
  // → {ok, reason, rule, moved}
  function remember(st, letterId, supplierId, mode) {
    const fail = reason => ({ ok: false, reason, rule: '', moved: 0 });
    const m = data(st);
    const letter = m.letters.find(l => l.id === letterId);
    if (!letter) return fail('Письмо не найдено');
    const sup = m.suppliers.find(s => s.id === supplierId);
    if (!sup) return fail('Поставщик не найден');
    const box = boxOf(st, letter.boxId);
    if (!box || box.kind !== 'purchase') return fail('Папки поставщиков есть только в ящике закупок');
    if (mode !== 'address' && mode !== 'domain') return fail('Правило: адрес или домен');
    const addr = addrOf(letter.from), dom = domainOf(addr);
    if (!addr || !dom) return fail('У письма нет адреса отправителя');
    const rule = mode === 'domain' ? '@' + dom : addr;
    for (const s of m.suppliers) if (s !== sup) s.rules = (s.rules || []).filter(r => ruleKey(r) !== rule);
    sup.rules = sup.rules || [];
    if (!sup.rules.some(r => ruleKey(r) === rule)) sup.rules.push(rule);
    let moved = 0;
    for (const l of m.letters) {
      if (l.boxId !== letter.boxId || !matches(rule, addrOf(l.from))) continue;
      if (folderOf(st, l) === sup.id && l.folder !== sup.id) { l.folder = sup.id; moved++; }
    }
    return { ok: true, reason: '', rule, moved };
  }

  // Поиск в ящике (и в папке, если задана) по отправителю, теме и тексту; без регистра и ё/е;
  // несколько слов — все должны найтись. Новые письма сверху.
  function search(st, { boxId, folder, q } = {}) {
    const words = fold(q).split(/\s+/).filter(Boolean);
    return data(st).letters
      .filter(l => l.boxId === boxId && (!folder || l.folder === folder))
      .filter(l => {
        const hay = fold([l.fromName, l.from, l.subject, l.body].join('\n'));
        return words.every(w => hay.includes(w));
      })
      .sort((a, b) => new Date(b.at) - new Date(a.at));
  }

  // Новое письмо в ящик: папка по правилам, уведомление тем, кто видит ящик. Нет такого ящика → null.
  // letter: {boxId, from, fromName?, subject, body, demo?}; id, дата, «не прочитано» и папку ставит эта функция.
  function deliver(st, letter, now) {
    const box = boxOf(st, letter.boxId);
    if (!box) return null;
    const m = data(st);
    const l = {
      id: Store.freeId(m.letters, 'ml'), boxId: box.id, from: letter.from, fromName: letter.fromName || '',
      subject: letter.subject || '', body: letter.body || '', at: now, read: false, folder: INBOX,
    };
    if (letter.demo) l.demo = true;
    l.folder = folderOf(st, l);
    m.letters.push(l);
    // Вид «mail» в Notify.RECIPIENTS пустой: адресаты — те, кто видит ящик, они идут через extra.
    const viewers = (st.people || []).filter(p => boxesFor(st, p.id).some(b => b.id === box.id)).map(p => p.id);
    const sup = m.suppliers.find(s => s.id === l.folder);
    const where = sup ? `папка «${sup.name}»` : box.kind === 'purchase' ? 'папка «Разобрать»' : 'входящие';
    Notify.push(st, NOTE_KIND, null, `Новое письмо в ящике «${box.title}» (${where}): ${l.subject} — от ${l.fromName || l.from}.`, now, viewers);
    return l;
  }

  // Ответ на письмо — в ветку письма, с пометкой «имитация, не отправлено». Ответить может тот, кто видит ящик.
  // Нет письма, пустой текст или нет доступа → null.
  function reply(st, letterId, text, by, now) {
    const letter = data(st).letters.find(l => l.id === letterId);
    const body = String(text ?? '').trim();
    if (!letter || !body) return null;
    if (!boxesFor(st, by).some(b => b.id === letter.boxId)) return null;
    letter.replies = letter.replies || [];
    const r = { id: Store.freeId(letter.replies, 'r'), by, at: now, text: body, sim: true, note: SIM_NOTE };
    letter.replies.push(r);
    letter.read = true;
    return r;
  }

  return { INBOX, SIM_NOTE, NOTE_KIND, boxesFor, folderOf, remember, search, deliver, reply };
})();

// ——— демо-данные ———
// Шаг SEEDS: два ящика, шесть поставщиков-примеров и письма за две недели до фиксированной даты демо.
// Настоящих названий поставщиков и адресов нет — названия «Поставщик-пример N», адреса на зарезервированном
// домене .example, письма с пометкой demo. Адреса самих ящиков — «нет данных» (address:''), подключения нет.
// Товары в текстах — настоящие позиции каталога. Шаг стоит в файле раньше шага каталога (38), поэтому берёт
// позиции из тех же снимков сам: Catalog.build — чистая функция, на состояние не влияет.
SEEDS.push(st => {
  const DAY = new Date(2026, 9, 31); // фиксированная дата демо — день снимков каталога и остатков
  const at = (back, h, m) => new Date(DAY.getFullYear(), DAY.getMonth(), DAY.getDate() - back, h, m);
  const products = Catalog.build(CATALOG, STOCK_SNAPSHOT).products;
  const pick = (cat, i) => { const list = products.filter(p => p.cat === cat); return list[i % list.length] || products[0]; };
  const short = p => p.name.split(/\s[\[(]/)[0];
  const inv = [0, 1, 2].map(i => pick('Инверторы', i));
  const akb = [0, 1, 2].map(i => pick('Аккумуляторы', i));
  const pan = [0, 1].map(i => pick('Панели', i));
  const ctl = [0, 1].map(i => pick('Контроллеры', i));
  const prot = [0, 1].map(i => pick('Защита и соединения', i));
  const cab = pick('Кабель', 0);

  st.mail = {
    boxes: [
      { id: 'purchase', kind: 'purchase', title: 'Закупки', address: '', roles: ['logist', 'director'] },
      { id: 'clients', kind: 'clients', title: 'Клиенты', address: '', roles: ['managerB2b', 'managerB2c', 'director'] },
    ],
    suppliers: [
      { id: 'sup1', name: 'Поставщик-пример 1 (инверторы)', example: true, rules: ['@invertor-1.example'] },
      { id: 'sup2', name: 'Поставщик-пример 2 (аккумуляторы)', example: true, rules: ['sales@akb-2.example'] },
      { id: 'sup3', name: 'Поставщик-пример 3 (солнечные панели)', example: true, rules: ['@panel-3.example'] },
      { id: 'sup4', name: 'Поставщик-пример 4 (кабель и защита)', example: true, rules: ['orders@kabel-4.example', 'docs@kabel-4.example'] },
      { id: 'sup5', name: 'Поставщик-пример 5 (контроллеры)', example: true, rules: ['@ctrl-5.example'] },
      { id: 'sup6', name: 'Поставщик-пример 6 (крепёж)', example: true, rules: ['@krepezh-6.example'] },
    ],
    letters: [],
  };

  // [ящик, дней назад, час, минута, адрес, от кого, тема, текст]
  const rows = [
    // ——— Закупки ———
    ['purchase', 13, 15, 30, 'offers@newsupplier-7.example', 'Новый поставщик-пример', 'Коммерческое предложение на кабель', `Здравствуйте! Предлагаем поставки кабеля и коннекторов, в том числе ${cab.name}. Пришлём прайс по запросу.`],

// Ядро: уведомления. Адресаты — люди (to:[personId]), прочитанность — у каждого своя (read:[personId]).
// Кому что приходит — только карта RECIPIENTS; человек может выключить вид у себя:
// prefs.notify[personId][kind] === false — этот вид ему не приходит.

const Notify = (() => {
  // Событие → кому: 'all' — все сотрудники, иначе id встроенных ролей (их нельзя удалить, id не меняются).
  // Адресатов конкретного события (исполнитель задачи, люди отдела, менеджер сделки или лида)
  // добавляет вызывающий через extraPersons.
  const RECIPIENTS = {
    ship: 'all',                                               // поставки: этап, точка, срок — все сотрудники (R10)
    arrive: ['director', 'managerB2b', 'managerB2c'],          // приёмка «товар на складе» — менеджеры и директор (R15)
    reserve: ['director', 'managerB2b', 'managerB2c', 'warehouse'], // резервы — как в v2
    warn: ['director', 'logist', 'managerB2b', 'managerB2c'],  // приёмка с замечаниями — как в v2
    task: [],                                                  // задачи — исполнитель, отдел и автор (extraPersons)
    msg: ['director'],                                         // сообщения клиентам — плюс менеджер сделки (extraPersons)
    lead: ['director'],                                        // новый лид — плюс менеджер, кому он ушёл (extraPersons)
    mail: [],                                                  // новое письмо — те, кто видит ящик (extraPersons)
  };

  const wants = (st, personId, kind) => {
    const p = st.prefs && st.prefs.notify && st.prefs.notify[personId];
    return !(p && p[kind] === false);
  };

  // Кому придёт уведомление этого вида: по карте, плюс extraPersons, без тех, кто выключил вид.
  function recipients(st, kind, extraPersons) {
    const rule = RECIPIENTS[kind];
    if (rule === undefined) throw new Error(`Неизвестный вид уведомления: ${kind}`);
    const people = st.people || [];
    const byRule = rule === 'all' ? people : people.filter(p => rule.includes(p.role));
    const ids = [...byRule.map(p => p.id), ...(extraPersons || [])];
    const known = new Set(people.map(p => p.id));
    return [...new Set(ids)].filter(id => known.has(id) && wants(st, id, kind));
  }

  // Новое уведомление — в начало списка. Автор, если он среди адресатов, своё уже прочитал.
  function push(st, kind, by, text, now, extraPersons) {
    const to = recipients(st, kind, extraPersons);
    st.notes = st.notes || [];
    const note = { id: Store.freeId(st.notes, 'n'), kind, by: by || null, at: now, text, to, read: by && to.includes(by) ? [by] : [] };
    st.notes.unshift(note);
    return note;
  }

  // Непрочитанные этим человеком.
  function unread(st, personId) {
    return (st.notes || []).filter(n => n.to.includes(personId) && !n.read.includes(personId));
  }

  // Отметить прочитанным для этого человека: одно уведомление или все его. Возвращает, сколько отмечено.
  function markRead(st, personId, noteId) {
    const list = unread(st, personId).filter(n => !noteId || n.id === noteId);
    list.forEach(n => n.read.push(personId));
    return list.length;
  }

  return { RECIPIENTS, recipients, push, unread, markRead };
})();

// Ядро: каталог товаров и склейка снимка остатков с каталогом. Чистая логика, без DOM.
// Источники — снимки CATALOG (10-catalog-data.js, таблица PVCalc) и STOCK_SNAPSHOT (11-stock-data.js, таблица менеджеров).
// Здесь же шаг SEEDS: настоящие товары и остатки вместо выдуманных товаров прототипа v2.

const Catalog = (() => {
  // Название для сравнения: без регистра, ё = е, без кавычек, любые тире = «-» без пробелов вокруг, один пробел.
  const norm = name => String(name ?? '').toLowerCase().replace(/ё/g, 'е')
    .replace(/[«»“”„"'`´]/g, '')
    .replace(/\s*[-‐‑‒–—−]\s*/g, '-')
    .replace(/\s+/g, ' ').trim();

  // Категории товаров: подписи на экране. Вид позиции каталога (колонка «Вид») и раздел таблицы менеджеров сводятся к ним.
  const CATS = ['Панели', 'Инверторы', 'Аккумуляторы', 'Контроллеры', 'Защита и соединения', 'Кабель'];
  const KIND_CAT = { 'панель': 'Панели', 'инвертор': 'Инверторы', 'АКБ': 'Аккумуляторы', 'защита и соединения': 'Защита и соединения', 'кабель': 'Кабель' };
  const SECTION_CAT = {
    'солнечные панели': 'Панели',
    'инверторы / ибп / конвертеры': 'Инверторы',
    'контроллеры заряда': 'Контроллеры',
    'аккумуляторные батареи': 'Аккумуляторы',
    'соединительное и защитное оборудование': 'Защита и соединения',
  };
  // Раздел листа остатков («Корень › Подраздел») → категория. Крепёж лежит в разделе панелей, но в каталоге
  // сайта он — «защита и соединения». Незнакомый раздел остаётся как в таблице: ничего не теряется.
  function sectionCat(section) {
    const [root, ...sub] = String(section ?? '').split(' › ');
    if (sub.some(s => norm(s).includes('крепеж'))) return 'Защита и соединения';
    return SECTION_CAT[norm(root)] || String(root).trim();
  }

  const isNum = v => typeof v === 'number' && isFinite(v);

  // Снимки → {products, stock, aside, unmatched}.
  // products: все позиции каталога (id = ключ каталога, inCatalog:true), затем строки остатков, не нашедшие пару
  //   (id 'sheet-NNN' по номеру строки, inCatalog:false — на экране «нет в каталоге»).
  // Строка остатков склеивается с позицией, только когда norm(название) совпал с norm(модель) ровно у одной позиции
  //   и ровно у одной строки остатков. Похожее, но не совпавшее, и неоднозначное не склеивается.
  // stock[productId][entityId]['_'] — остаток по юрлицу; города в таблице нет → ключ '_'. Пусто остаётся пусто, не 0.
  // aside[productId] = {damaged, custody, transitNoShip} — «Бой», ответхранение, «В пути»; есть, если заполнено хоть что-то.
  // unmatched: [{productId, name}] — строки остатков без пары в каталоге.
  function build(catalog, snapshot) {
    const products = catalog.rows.map(r => ({
      id: String(r.key), name: r.model, brand: r.brand ?? null, cat: KIND_CAT[r.cat] || r.cat,
      price: isNum(r.price) ? r.price : null, avail: r.avail ?? null, url: r.url ?? null,
      src: 'catalog', inCatalog: true, sheet: r.sheet,
    }));
    const byName = new Map();
    for (const p of products) { const k = norm(p.name); byName.set(k, [...(byName.get(k) || []), p.id]); }
    const rowsPerName = new Map();
    for (const r of snapshot.rows) { const k = norm(r.name); rowsPerName.set(k, (rowsPerName.get(k) || 0) + 1); }

    const stock = {}, aside = {}, unmatched = [];
    snapshot.rows.forEach((r, i) => {
      const k = norm(r.name), same = byName.get(k);
      let id;
      if (same && same.length === 1 && rowsPerName.get(k) === 1) id = same[0];
      else {
        id = 'sheet-' + String(i + 1).padStart(3, '0');
        products.push({ id, name: r.name, brand: null, cat: sectionCat(r.cat), price: null, avail: null, url: null, src: 'sheet', inCatalog: false });
        unmatched.push({ productId: id, name: r.name });
      }
      for (const e of ['ip', 'npp', 'vs']) if (isNum(r[e])) (stock[id] || (stock[id] = {}))[e] = { _: r[e] };
      const a = { damaged: isNum(r.damaged) ? r.damaged : null, custody: isNum(r.custody) ? r.custody : null, transitNoShip: isNum(r.transit) ? r.transit : null };
      if (Object.values(a).some(v => v !== null)) aside[id] = a;
    });
    return { products, stock, aside, unmatched };
  }

  // Категории, которые есть у товаров: сначала привычный порядок CATS, потом остальные по алфавиту.
  function cats(st) {
    const have = new Set(st.products.map(p => p.cat));
    return [...CATS.filter(c => have.has(c)), ...[...have].filter(c => !CATS.includes(c)).sort((a, b) => a.localeCompare(b, 'ru'))];
  }
  function brands(st) {
    return [...new Set(st.products.map(p => p.brand).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru'));
  }

  // Поиск и фильтры: q — слова через пробел, каждое должно встретиться в названии, бренде или ключе;
  // cat, brand, avail ('в наличии' | 'предзаказ') — точное совпадение; inCatalog — true | false. Пустое не фильтрует.
  function query(st, { q, cat, brand, avail, inCatalog } = {}) {
    const words = norm(q).split(' ').filter(Boolean);
    return st.products.filter(p =>
      (!cat || p.cat === cat) && (!brand || p.brand === brand) && (!avail || p.avail === avail) &&
      (inCatalog === undefined || inCatalog === null || p.inCatalog === inCatalog) &&
      (!words.length || words.every(w => norm(p.name + ' ' + (p.brand || '') + ' ' + p.id).includes(w))));
  }

  // ——— снимок не живёт в сохранении браузера ———
  // Товары снимка (src 'catalog' и 'sheet') — константы файла: в сохранение они не пишутся, при загрузке встают из build().
  // В сохранении только изменяемое: товары, добавленные руками, правки полей товаров снимка и id снятых из списка.
  // Метка catalogSnapshot в записи говорит «товары снимка здесь не лежат»; без неё список товаров читается как есть.
  let baseCache = null;
  const base = () => {
    if (!baseCache) {
      const built = build(CATALOG, STOCK_SNAPSHOT);
      baseCache = { ...built, byId: new Map(built.products.map(p => [p.id, p])) };
    }
    return baseCache;
  };
  const isSnap = p => p && (p.src === 'catalog' || p.src === 'sheet') && base().byId.has(p.id);
  const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);

  // Список товаров состояния → поля для записи в сохранение; null — в списке нет товаров снимка (пишется как есть).
  function pack(products) {
    if (!Array.isArray(products) || !products.some(isSnap)) return null;
    const own = [], edits = {}, seen = new Set();
    for (const p of products) {
      if (!isSnap(p)) { own.push(p); continue; }
      seen.add(p.id);
      const ref = base().byId.get(p.id), diff = {};
      for (const k of new Set([...Object.keys(p), ...Object.keys(ref)])) if (!same(p[k], ref[k])) diff[k] = p[k] ?? null;
      if (Object.keys(diff).length) edits[p.id] = diff;
    }
    const removed = [...base().byId.keys()].filter(id => !seen.has(id));
    const out = { products: own, catalogSnapshot: CATALOG.snapshot };
    if (Object.keys(edits).length) out.productEdits = edits;
    if (removed.length) out.productsRemoved = removed;
    return out;
  }

  // Прочитанное состояние: товары снимка возвращаются на место (сначала снимок, затем добавленные руками). Меняет st.
  function unpack(st) {
    if (!st || !st.catalogSnapshot) return st;
    const edits = st.productEdits || {}, removed = new Set(st.productsRemoved || []);
    const snap = base().products.filter(p => !removed.has(p.id)).map(p => ({ ...p, ...(edits[p.id] || {}) }));
    st.products = [...snap, ...(Array.isArray(st.products) ? st.products : [])];
    delete st.catalogSnapshot; delete st.productEdits; delete st.productsRemoved;
    return st;
  }

  return { norm, CATS, build, cats, brands, query, sectionCat, base, pack, unpack };
})();

// Шаг SEEDS: товары и остатки — настоящие, из снимков. Демо-записи прототипа v2 (резервы, позиции поставок,
// движения) ссылались на 12 выдуманных товаров по артикулу; их переводит этот шаг на настоящие позиции того же
// вида: панель — на панель, инвертор — на инвертор, АКБ — на аккумулятор. Позиция выбрана по смыслу записи:
// где v2 резервировал со склада — позиция, у которой в таблице менеджеров есть остаток; где товар только едет
// (АКБ) — позиция из каталога сайта. Ветрогенераторов в каталоге нет: запись ведёт на инвертор.
// Позиция названа точно, как в источнике; нет такой — берётся первая того же вида, ссылки остаются целыми.
const DEMO_LINKS = {
  'PV-550M': { cat: 'Панели', name: 'Солнечная панель HAVEL 340' },
  'INV-H6': { cat: 'Инверторы', name: 'Гибридный инвертор GD6248SMH' },
  'INV-G10': { cat: 'Инверторы', name: 'Сетевой SMARTWATT GRID G2, 6 кВт' },
  'BAT-LFP-100': { cat: 'Аккумуляторы', name: 'Аккумуляторная батарея WINDSOLAR LFP Smart BLOCK 12V 100AH (100AH / 12.8V / 1280WH / BMS)' },
  'CTRL-60': { cat: 'Контроллеры', name: 'Контроллер КЭС DOMINATOR MPPT 200/100' },
  'CAB-6R': { cat: 'Защита и соединения', name: 'Кабель для СЭС PV-1F 2х4 мм2' },
  'CAB-6B': { cat: 'Защита и соединения', name: 'Провод ПуГВнг(А)-LS 1х25 бел Кабэкс ГОСТ' },
  'MC4': { cat: 'Защита и соединения', name: 'Коннектор MC4 AB (комплект из двух разъемов)' },
  'MNT-R4': { cat: 'Защита и соединения', name: 'Комплект крепления MAX для четырех панелей изменением угла наклона 0.5 метр' },
  'BOX-DC': { cat: 'Защита и соединения', name: 'Бокс HT8WAY' },
  'MTR-3F': { cat: 'Защита и соединения', name: 'Токоизмерительные клещи SPLIT CORE CTSA016 на 100 А / 50 mA' },
  'WND-3K': { cat: 'Инверторы', name: 'Гибридный инвертор ASTERION INV ECO II 1.5 кВт (1500W / 12V / PV 900W 30-160V / MPPT 60A)' },
};
SEEDS.push(st => {
  const built = Catalog.build(CATALOG, STOCK_SNAPSHOT);
  Object.assign(st, Stock.defaults(), { products: built.products, stock: built.stock, aside: built.aside });
  const pick = ({ cat, name }) => st.products.find(p => p.cat === cat && Catalog.norm(p.name) === Catalog.norm(name))
    || st.products.find(p => p.cat === cat);
  const link = Object.fromEntries(Object.entries(DEMO_LINKS).map(([sku, rule]) => [sku, pick(rule).id]));
  const fix = id => link[id] || id;
  // поставки: юрлицо и город (демо), позиции — настоящие товары
  for (const s of st.shipments) {
    s.entityId = s.entityId || 'ip'; s.cityId = s.cityId || 'irk';
    for (const it of s.items) it.productId = fix(it.productId);
  }
  // резервы: со склада — из клетки, где больше свободного; под поставку — юрлицо и город поставки
  for (const r of st.reserves) r.productId = fix(r.productId);
  const cells = st.reserves.map(r => (r.src === 'stock' ? Stock.bestCell(st, r.productId) : null));
  st.reserves.forEach((r, i) => {
    const ship = r.src === 'stock' ? null : st.shipments.find(s => s.id === r.src);
    r.entityId = cells[i] ? cells[i].entityId : (ship ? ship.entityId : Stock.ANY);
    r.cityId = cells[i] ? cells[i].cityId : (ship ? ship.cityId : Stock.ANY);
  });
  // движения: товар и клетка склада
  for (const m of st.moves) {
    m.productId = fix(m.productId);
    const cell = Stock.bestCell(st, m.productId);
    m.entityId = cell.entityId; m.cityId = cell.cityId;
  }
});

// Оболочка: состояние S и его сохранение, тема, разделы NAV, боковая панель, «Кто я», уведомления, окна,
// карточка справа, поиск, переходы, render(), действия A, формы FORMS, обработчики событий.
// Права — Perms.can(S, S.me, …), этапы — по id и флагам Pipes, уведомления — только Notify.push.

// ——— состояние и сохранение в браузере ———
// S поднимает запуск (90-boot.js): startState(). До запуска — null.
let S=null;
// Чистое демо-состояние: seed() + то, что не сохраняется (ui).
const freshState=()=>Object.assign(seed(),{ui:defaultUi()});
// Сохранённое в браузере состояние или null (нет, битое, чужая версия схемы).
function savedState(){
  let raw=null;
  try{raw=localStorage.getItem(Store.KEY)}catch(_){return null}
  const st=Store.load(raw);
  if(!st) return null;
  // чего нет в сохранённом (раздел добавлен позже) — берём из демо
  const base=seed();
  for(const k of Object.keys(base)) if(!(k in st)) st[k]=base[k];
  if(!st.people.some(p=>p.id===st.me)) st.me=st.people[0]?.id||'';
  st.ui=defaultUi();
  return st;
}
// Раздел из адреса страницы (#team) или ''.
function hashView(){try{return /^#[a-z]+$/.test(location.hash)?location.hash.slice(1):''}catch(_){return ''}}
function startState(){
  const st=savedState()||freshState();
  const v=hashView();if(v) st.view=v;
  return st;
}
// Записать S в браузер. Не влезает — без фото и короткое сообщение; совсем не влезает — сообщение.
let _photoWarn=0,_saveT=0;
function save(){
  if(!S) return null;
  let r=Store.dump(S),ok=true;
  try{localStorage.setItem(Store.KEY,r.text)}catch(_){
    // браузер дал меньше места, чем рассчитывает Store, — сохраняем без фото
    r=Store.dump(S,0);
    try{localStorage.setItem(Store.KEY,r.text)}catch(_){ok=false}
  }
  if(!ok) toast('Изменения не сохранены — мало места в браузере','warn');
  else if(r.droppedPhotos&&r.droppedPhotos!==_photoWarn) toast('Фото не сохранены — мало места в браузере','warn');
  _photoWarn=r.droppedPhotos;
  return {ok,droppedPhotos:r.droppedPhotos,fits:r.fits&&ok};
}
// Для ввода с клавиатуры — не на каждую букву
const saveSoon=()=>{clearTimeout(_saveT);_saveT=setTimeout(save,400)};
// Сброс к демо: человек, раздел и тема остаются, данные — как в seed()
function resetData(){
  const m=S?.me,v=S?.view,th=S?.prefs?.theme;
  S=freshState();
  if(S.people.some(p=>p.id===m)) S.me=m;
  if(v) S.view=v;
  if(th) S.prefs.theme=th;
  closeModal();render();
  toast('Данные прототипа сброшены к исходным');
}

// ——— тема ———
// Выбор человека — S.prefs.theme: 'light', 'dark' или 'auto' (как в системе). На <html> ставится
// data-theme="light|dark": для «как в системе» — по prefers-color-scheme устройства. Цвета тем — 00-tokens.css.
const THEMES=[['light','Светлая','sun'],['dark','Тёмная','moon'],['auto','Как в системе','monitor']];
Object.assign(IC,{
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/>',
  moon:'<path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/>',
  monitor:'<rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20"/>',
  sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'
});
const themePref=()=>THEMES.some(t=>t[0]===S?.prefs?.theme)?S.prefs.theme:'auto';
const systemDark=()=>{try{return typeof matchMedia==='function'&&matchMedia('(prefers-color-scheme: dark)').matches}catch(_){return false}};
// Какая тема на экране при выборе pref: 'light' или 'dark'
const themeOf=pref=>pref==='dark'||(pref==='auto'&&systemDark())?'dark':'light';
function applyTheme(){document.documentElement.dataset.theme=themeOf(themePref())}
function setTheme(t){
  if(!THEMES.some(x=>x[0]===t)) return;
  S.prefs.theme=t;render();
}
// Переключатель темы — один для шапки (compact: только значки) и для «Настройки → Внешний вид»
const themeSwitch=compact=>`<div class="seg theme-seg${compact?' compact':''}" role="group" aria-label="Тема">${THEMES.map(([k,l,i])=>{const on=themePref()===k;return `<button type="button" class="${on?'on':''}" data-act="theme" data-theme="${k}" aria-pressed="${on}" title="${l}">${ic(i)}<span>${l}</span></button>`}).join('')}</div>`;

// сверху вниз), внутри группы — по order. Следующие таски добавляют раздел в своём файле: NAV.push({…}).
const NAV=[

  {id:'tasks',label:'Задачи',icon:'tasks',group:'Работа',order:20,ok:()=>true,badge:()=>S.tasks.filter(t=>!isDone(t)&&taskMine(t)).length},
  {id:'notifications',label:'Уведомления',icon:'bell',group:'Работа',order:30,ok:()=>true,badge:()=>unread().length,hot:true},

  {id:'logistics',label:'Поставки и перевозки',icon:'truck',group:'Товар',order:20,ok:()=>can('stock')||can('logistics'),badge:()=>S.shipments.filter(s=>!isDone(s)).length},
  {id:'receiving',label:'Приёмка на складе',icon:'camera',group:'Товар',order:30,ok:()=>can('receive'),badge:()=>S.shipments.filter(awaitsReceipt).length,hot:true},
  {id:'clients',label:'Клиенты и сделки',icon:'users',group:'Продажи',order:10,ok:()=>can('clients')},
  {id:'messages',label:'Сообщения клиентам',icon:'chat',group:'Продажи',order:20,ok:()=>can('write')||can('auto')},
  {id:'team',label:'Сотрудники и права',icon:'shield',group:'Управление',order:10,ok:()=>can('admin')}
];
// Разделы, открытые текущему человеку: только они попадают в меню
const navItems=()=>NAV.filter(n=>n.ok());
const GROUPS=['Работа','Товар','Продажи','Управление','Настройки'];

function renderSide(){
  const vis=navItems(),m=me();
  let h='';
  for(const g of GROUPS){
    const items=vis.filter(n=>n.group===g).sort((a,b)=>(a.order||0)-(b.order||0));
    if(!items.length) continue;
    h+=`<div class="nav-g"><h4>${g}</h4>${items.map(n=>{const b=n.badge?n.badge():0;return `<button class="nav-i ${S.view===n.id?'on':''}" data-act="go" data-view="${n.id}">${ic(n.icon)}<span>${n.label}</span>${b?`<span class="cnt ${n.hot?'hot':''}">${b}</span>`:''}</button>`}).join('')}</div>`;
  }
  h+=`<div class="me">${av(m)}<div><b>${esc(m.name)}</b><small>${esc(roleName(m))}</small></div></div>`;
  byId('side').innerHTML=h;
}

// «Кто я»: каждый человек с ролью — «Имя — Роль»

// ——— уведомления ———
// Вид не меняет состояние: прочитанным раздел помечает render() после отрисовки.
function vNotes(){
  const firm=can('firm'),all=firm&&S.ui.noteScope==='all';
  let list=S.notes.filter(n=>all||n.to.includes(S.me));
  if(S.ui.noteK!=='all') list=list.filter(n=>n.kind===S.ui.noteK);
  const un=new Set(unread().map(n=>n.id));
  let h=`<div class="bar"><div class="seg">${[['all','Все'],...Object.entries(KIND).map(([k,v])=>[k,v.l])].map(([k,l])=>`<button class="${S.ui.noteK===k?'on':''}" data-act="note-k" data-k="${k}">${l}</button>`).join('')}</div>${firm?`<div class="seg">${[['mine','Мне'],['all','Вся фирма']].map(([k,l])=>`<button class="${S.ui.noteScope===k?'on':''}" data-act="note-scope" data-k="${k}">${l}</button>`).join('')}</div>`:''}</div>`;

function mStage(s){

  return `<form data-form="stage" data-id="${s.id}" novalidate>${mHead('Отметка по перевозке '+s.id)}<div class="modal-b">
    <div class="field"><label for="st-stage">Этап</label><select id="st-stage" class="inp">${stg.map(x=>`<option value="${esc(x.id)}" ${x.id===def?'selected':''} ${locked(x)?'disabled':''}>${esc(x.name)}${locked(x)?' — ставит склад при приёмке':''}</option>`).join('')}</select></div>
    <div class="field"><label for="st-place">Где груз сейчас</label><input id="st-place" class="inp" value="${esc(shipLast(s).text)}"></div>
    <div class="field"><label for="st-eta">${s.dir==='in'?'Ожидается на складе':'Доставка клиенту'}</label><input id="st-eta" type="date" class="inp" value="${iso(s.eta)}"></div>

}

// ——— карточка справа ———
// Реестр карточек: DRAWERS.<type> = id => ({kind, title, sub, body}) или null (нет записи или нет права —
// карточка не открывается). Раздел кладёт свою карточку в своём файле: DRAWERS.product = id => …
const DRAWERS={};
function openDrawer(type,id){S.ui.drawer={type,id};renderDrawer()}
function closeDrawer(){S.ui.drawer=null;renderDrawer()}
function renderDrawer(){
  const root=byId('drawer-root'),d=S.ui.drawer;
  if(!d){root.innerHTML='';root.dataset.k='';return}
  const f=Object.hasOwn(DRAWERS,d.type)?DRAWERS[d.type]:null,c=f?f(d.id):null;
  if(!c){S.ui.drawer=null;root.innerHTML='';root.dataset.k='';return}
  const k=d.type+':'+d.id,same=root.dataset.k===k,sc=same?(root.querySelector('.drawer-b')?.scrollTop||0):0;
  root.classList.toggle('still',same);
  root.innerHTML=`<div class="scrim" data-act="close-drawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-t"><div class="drawer-h"><div class="dh-t"><small>${esc(c.kind)}</small><h2 id="dr-t">${c.title}</h2>${c.sub?`<p>${c.sub}</p>`:''}</div><button class="btn ghost icon" data-act="close-drawer" aria-label="Закрыть">${ic('x')}</button></div><div class="drawer-b">${c.body}</div></aside>`;
  if(same){const b=root.querySelector('.drawer-b');if(b) b.scrollTop=sc}
  root.dataset.k=k;
}

// ——— всплывающие подсказки ———
function toast(msg,kind){
  const el=document.createElement('div');el.className='toast';
  el.innerHTML=`${ic(kind==='warn'?'alert':'check')}<span>${esc(msg)}</span>`;
  byId('toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320)},4800);
}

// ——— поиск ———
function searchRes(q){
  q=q.trim().toLowerCase();if(q.length<2) return [];
  const r=[],has=s=>s.toLowerCase().includes(q);
  if(can('stock')) Catalog.query(S,{q}).slice(0,6).forEach(p=>{const k=stockOf(p.id);r.push({type:'Товар',label:p.name,sub:k.known?`свободно ${qtyOf(k.free,p)}`:'остаток: нет данных',act:`data-act="open-product" data-pid="${esc(p.id)}"`})});
  if(can('clients')) S.deals.forEach(d=>{if(has(d.client+' '+d.id+' '+d.object)) r.push({type:'Сделка',label:d.client,sub:`${d.id} · ${d.object}`,act:`data-act="open-deal" data-id="${d.id}"`})});
  if(can('stock')||can('logistics')) S.shipments.forEach(s=>{if(has(s.id+' '+s.supplier+' '+s.to+' '+s.track)) r.push({type:'Перевозка',label:`${s.id} · ${s.supplier}`,sub:`${stageName(s)} · ${fD(s.eta)}`,act:`data-act="go" data-view="logistics" data-tab="${isDone(s)?'done':s.dir}"`})});
  S.tasks.filter(taskVisible).forEach(t=>{if(has(t.title)) r.push({type:'Задача',label:t.title,sub:`${targetName(t)} · ${fRel(t.due)}`,act:`data-act="open-task" data-id="${t.id}"`})});
  return r.slice(0,9);
}

// ——— переходы ———
function go(v,tab){
  const n=NAV.find(x=>x.id===v);
  if(!n||!n.ok()){toast('У вас нет доступа к этому разделу','warn');return}
  S.view=v;if(tab) S.ui.logTab=tab;
  setNav(false);render();byId('scroll').scrollTop=0;
}
function setNav(open){S.ui.navOpen=open;byId('app').classList.toggle('nav-open',open)}
// «Кто я»: смотреть CRM глазами этого человека — его права, задачи, уведомления
function setMe(pid){
  if(!person(pid)) return;
  S.me=pid;S.ui.drawer=null;S.ui.taskF='all';closeModal();
  const vis=navItems(),hidden=NAV.filter(n=>!vis.includes(n)).map(n=>n.label),m=me();
  if(!vis.some(n=>n.id===S.view)) S.view='home';
  render();
  toast(`Теперь вы — ${m.name} (${roleName(m)}). ${hidden.length?'Недоступно: '+hidden.join(', ')+'.':'Доступно всё.'}`);
}
function setTaskStatus(id,stageId){
  const t=S.tasks.find(x=>x.id===id);if(!t||t.stageId===stageId) return;
  const stg=Pipes.stage(S,t.boardId,stageId);if(!stg) return;
  const m=me();t.stageId=stageId;
  Notify.push(S,'task',m.id,`Задача «${t.title}» — теперь «${stg.name}». Отметка: ${m.name}.`,new Date(),[t.from,...targetPeople(t.to)]);
  render();toast(`Статус «${stg.name}». Уведомление ушло тому, кто поставил задачу.`);
}

// ——— главный вывод ———
const VIEWS={home:vHome,tasks:vTasks,notifications:vNotes,stock:vStock,logistics:vLogistics,receiving:vReceiving,clients:vClients,messages:vMessages,team:vTeam};
// Прямой переход (адрес, сохранённый раздел) туда, где у человека нет права: в меню раздела нет, на экране — это.
const vNoAccess=n=>`<section class="card deny"><span class="deny-ic">${ic('lock')}</span><h2>Нет доступа к разделу</h2><p>«${esc(n.label)}» закрыт для роли «${esc(roleName(me()))}». Права ролей меняют в разделе «Сотрудники и права».</p><button type="button" class="btn pri" data-act="go" data-view="home">${ic('home')}На главный экран</button></section>`;
function render(){
  applyTheme();
  // неизвестный раздел — «Сегодня»; известный, но без права — экран «Нет доступа»
  if(!NAV.some(n=>n.id===S.view&&VIEWS[n.id])) S.view='home';
  const n=NAV.find(x=>x.id===S.view),ok=n.ok();
  if(ok&&S.view==='receiving') syncRcv();
  byId('view').innerHTML=ok?VIEWS[S.view]():vNoAccess(n);
  // открыли по адресу (#…) — адрес следует за разделом, иначе перезагрузка вернёт старый
  try{const h=hashView();if(h&&h!==S.view) history.replaceState(null,'','#'+S.view)}catch(_){}
  // открыл раздел «Уведомления» — свои прочитаны (подсвечены один раз, при этой отрисовке)
  if(ok&&S.view==='notifications') Notify.markRead(S,S.me);
  renderSide();
  byId('ttl').textContent=n.label;
  byId('role').innerHTML=whoOptions();
  byId('theme-sw').innerHTML=themeSwitch(true);
  updBell();renderDrawer();save();
}

// ——— реестры полей и имитаций ———
// Поля data-on: ON.input['<key>'] и ON.change['<key>'] = (el, e) => … — раздел регистрирует свои в своём файле.
const ON={input:{},change:{}};
// Имитации внешних событий для «Пульта проверки»: SIMS.push({id, label, run:()=>void}) — в файле раздела.
const SIMS=[];

// ——— действия по клику ———
const A={
  go:el=>go(el.dataset.view,el.dataset.tab),
  'nav-toggle':()=>setNav(!S.ui.navOpen),
  // сброс — только после подтверждения в окне (и из полосы «Прототип», и из «Настройки → Данные»)
  reset:()=>openModal('reset'),
  theme:el=>setTheme(el.dataset.theme),
  bell:()=>{
    const pop=byId('pop');if(!pop.hidden){pop.hidden=true;return}

    pop.hidden=false;list.forEach(n=>Notify.markRead(S,S.me,n.id));updBell();renderSide();save();
  },
  'open-product':el=>openDrawer('product',el.dataset.pid),
  'open-deal':el=>openDrawer('deal',el.dataset.id),
  'open-task':el=>openDrawer('task',el.dataset.id),
  'close-drawer':()=>closeDrawer(),
  'close-modal':()=>closeModal(),
  'new-task':()=>openModal('task'),
  'new-ship':()=>openModal('ship'),
  'new-product':()=>openModal('product'),
  stage:el=>openModal('stage',el.dataset.id),
  'add-irow':()=>byId('ns-items').insertAdjacentHTML('beforeend',irow()),
  'task-f':el=>{S.ui.taskF=el.dataset.f;render()},
  'task-st':el=>setTaskStatus(el.dataset.id,el.dataset.st),
  cat:el=>{S.ui.cat=el.dataset.cat;render()},
  'log-tab':el=>{S.ui.logTab=el.dataset.tab;render()},
  'note-k':el=>{S.ui.noteK=el.dataset.k;render()},
  'note-scope':el=>{S.ui.noteScope=el.dataset.k;render()},
  'view-as':el=>setMe(el.dataset.id),
  unreserve:el=>{
    const m=me(),now=new Date(),res=Stock.unreserve(S,el.dataset.id,m.id,now);if(!res.ok) return;
    const r=res.reserve,p=product(r.productId),d=deal(r.dealId);
    Notify.push(S,'reserve',m.id,`Снят резерв: ${p.name} — ${qtyOf(r.qty,p)} (${r.dealId}, ${d?.client||''}).`,now);
    render();toast('Резерв снят, товар снова свободен.');
  },
  'rcv-start':el=>{initRcv(el.dataset.id);go('receiving')},
  'rcv-step':el=>{
    const pid=el.dataset.pid,inp=byId('rcv-q-'+pid),v=Math.max(0,(parseInt(inp.value,10)||0)+parseInt(el.dataset.d,10));
    inp.value=v;S.rcv.qty[pid]=v;byId('rcv-diff-'+pid).innerHTML=diffHtml(rcvItem(pid));updRcvPrev();saveSoon();
  },
  'rcv-photo-del':el=>{S.rcv.photos.splice(+el.dataset.i,1);byId('rcv-photos').innerHTML=photosHtml();saveSoon()},
  'rcv-confirm':()=>rcvConfirm(),
  'rcv-again':()=>{S.rcv=null;render()},
  'tpl-ch':el=>{S.ui.tplCh=el.dataset.ch;el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));updTpl()},
  'ins-var':el=>{
    const ta=byId('tpl');if(!ta) return;
    const a=ta.selectionStart??ta.value.length,b=ta.selectionEnd??a;
    ta.value=ta.value.slice(0,a)+el.dataset.v+ta.value.slice(b);S.tpl=ta.value;ta.focus();ta.selectionStart=ta.selectionEnd=a+el.dataset.v.length;updTpl();saveSoon();

// ——— формы ———
const FORMS={
  reset:()=>resetData(),
  reserve:f=>{
    const p=product(f.dataset.pid),did=byId('rs-deal').value,qty=parseInt(byId('rs-qty').value,10),src=byId('rs-src').value,until=byId('rs-until').value;
    if(!did) return showErr('rs-err','Нет открытых сделок, под которые можно поставить резерв.');
    if(!until||dd(fromIso(until))<0) return showErr('rs-err','Дата окончания резерва не может быть в прошлом.');
    const d=deal(did),m=me(),u=fromIso(until),now=new Date();
    const res=Stock.reserve(S,{productId:p.id,qty,entityId:byId('rs-ent').value,cityId:byId('rs-city').value,src,dealId:did,until:u,by:m.id,at:now});
    if(!res.ok) return showErr('rs-err',res.reason);
    Notify.push(S,'reserve',m.id,`Резерв: ${low(p.name)} — ${qtyOf(qty,p)} ${src==='stock'?'со склада':'из поставки '+src} для ${did} (${d.client}) до ${fD(u)}.`,now);
    render();toast(`Резерв поставлен: ${qtyOf(qty,p)} для ${did}. Склад и директор получили уведомление.`);
  },
  stage:f=>{
    const s=ship(f.dataset.id),m=me(),now=new Date();
    const stg=Pipes.stage(S,s.pipeId,byId('st-stage').value);
    if(!stg||(s.dir==='in'&&stg.flag==='final')){closeModal();return}
    const place=byId('st-place').value.trim()||shipLast(s).text,eta=byId('st-eta').value,note=byId('st-note').value.trim(),notify=byId('st-notify').checked;
    const old=s.eta,ne=eta?fromIso(eta,s.eta.getHours()||12):s.eta,moved=dd(ne)!==dd(old),wasOut=s.dir==='out'&&leftStart(s);
    s.stageId=stg.id;s.history.push({at:now,by:m.id,text:place});s.eta=ne;
    let sent=0;
    if(notify) sent=Notify.push(S,'ship',m.id,`${s.id}: ${stg.name.toLowerCase()} — ${place}. ${s.dir==='in'?'На складе ожидается':'Доставка'} ${fD(ne)}${moved?` (было ${fD(old)})`:''}.${note?' '+note:''}`,now).to.filter(id=>id!==m.id).length;
    if(s.dir==='out'&&!wasOut&&leftStart(s)&&rule('shipped').on&&s.deal){const d=deal(s.deal);if(d&&d.channel!=='phone') S.msgs.push({id:Store.freeId(S.msgs,'m'),at:now,deal:d.id,channel:d.channel,auto:true,text:`${d.contact}, здравствуйте! Ваш заказ отгружен: ${s.track}. Привезём ${fD(ne)}. Ваш менеджер — ${person(d.managerId)?.name||''}.`})}
    closeModal();render();toast(notify?`Отмечено. Уведомление получили ${sent} ${pl(sent,'сотрудник','сотрудника','сотрудников')}.`:'Отмечено без уведомления.');
  },
  task:()=>{
    const title=byId('t-title').value.trim();
    if(!title){showErr('t-err','Напишите, что нужно сделать.');byId('t-title').focus();return}
    const [tt,id]=byId('t-to').value.split(':'),due=byId('t-due').value,m=me(),now=new Date(),board=taskBoard();
    const t={id:Store.freeId(S.tasks,'t'),title,desc:byId('t-desc').value.trim(),to:{t:tt,id},from:m.id,due:due?fromIso(due,18):day(2,18),boardId:board.id,stageId:startStage(board.id).id,prio:byId('t-prio').value,deal:byId('t-deal')?.value||'',at:now};
    S.tasks.push(t);
    Notify.push(S,'task',m.id,`Новая задача: «${title}», срок ${fD(t.due)}.${t.deal?' Сделка '+t.deal+'.':''} От: ${m.name}.`,now,targetPeople(t.to));
    closeModal();render();toast(`Задача поставлена. ${targetName(t)} — уведомление отправлено.`);
  },
  ship:f=>{
    const from=byId('ns-from').value.trim(),m=me(),now=new Date(),items=[],pipe=shipPipe('in');
    f.querySelectorAll('.irow').forEach(r=>{const sku=r.querySelector('select').value,q=parseInt(r.querySelector('input').value,10)||0;if(q<1) return;const e=items.find(i=>i.productId===sku);if(e) e.qty+=q;else items.push({productId:sku,qty:q})});
    if(!from||!items.length) return showErr('ns-err','Укажите, откуда едет груз, и хотя бы одну позицию с количеством.');
    const id='П-'+(Math.max(0,...S.shipments.filter(s=>s.dir==='in').map(s=>parseInt(s.id.replace(/\D/g,''),10)||0))+1);
    const eta=byId('ns-eta').value?fromIso(byId('ns-eta').value):day(7,12);
    const stageId=Pipes.stage(S,pipe.id,byId('ns-stage').value)?.id||startStage(pipe.id).id;
    S.shipments.push({id,dir:'in',supplier:from,to:'Наш склад',carrier:byId('ns-car').value,track:byId('ns-doc').value.trim()||'нет данных: номер накладной',pipeId:pipe.id,stageId,eta,history:[{at:now,by:m.id,text:from}],items});
    Notify.push(S,'ship',m.id,`Новая поставка ${id} из «${from}»: ${items.map(i=>`${low(product(i.productId).name)} ${qtyOf(i.qty,product(i.productId))}`).join(', ')}. На складе ожидается ${fD(eta)}.`,now);
    closeModal();S.ui.logTab='in';render();toast(`Поставка ${id} создана. Менеджеры уже видят её в остатках как «едет к нам».`);
  },
  product:()=>{
    const name=byId('np-name').value.trim(),pr=byId('np-price'),m=me();
    if(!name) return showErr('np-err','Нужно наименование.');
    if(S.products.some(p=>Catalog.norm(p.name)===Catalog.norm(name))) return showErr('np-err',`Товар «${name}» уже есть в номенклатуре.`);
    const price=pr&&pr.value!==''?Math.max(0,Number(pr.value)):null;
    S.products.push({id:Store.freeId(S.products,'u'),name,brand:null,cat:byId('np-cat').value,unit:byId('np-unit').value,price,avail:null,url:null,src:'user',inCatalog:false});
    Notify.push(S,'arrive',m.id,`В номенклатуру добавлен товар: ${name}.`,new Date());
    closeModal();S.ui.cat='Все';S.ui.sq='';render();toast('Товар добавлен. Остатка нет — он появится после первой приёмки.');
  },
  msg:f=>{
    const d=deal(f.dataset.id),ta=byId('msg-text'),txt=ta.value.trim();
    if(!txt){ta.focus();return}
    S.msgs.push({id:Store.freeId(S.msgs,'m'),at:new Date(),deal:d.id,channel:d.channel,by:me().id,text:txt});
    render();toast(`Сообщение записано в переписку. В прототипе в ${CH[d.channel]} оно не уходит.`);
  }
};

// ——— события ———
document.addEventListener('click',e=>{
  if(!e.target.closest('.bell-w')) byId('pop').hidden=true;
  const inSearch=e.target.closest('.search');
  if(!inSearch) byId('q-res').hidden=true;
  if(e.target.classList?.contains('modal-wrap')){closeModal();return}
  const el=e.target.closest('[data-act]');if(!el) return;
  const f=A[el.dataset.act];if(!f) return;
  if(el.closest('#q-res')){byId('q-res').hidden=true;byId('q').value=''}
  if(el.closest('#pop')) byId('pop').hidden=true;
  f(el,e);
});
document.addEventListener('submit',e=>{const f=e.target,k=f.dataset.form;if(!k||!FORMS[k]) return;e.preventDefault();FORMS[k](f)});
// Поле с data-on="<key>": обработчик ON.input[key] или ON.change[key], затем отложенное сохранение
function onField(kind,e){
  const t=e.target,k=t.dataset?.on;if(!k||!Object.hasOwn(ON[kind],k)) return;
  ON[kind][k](t,e);saveSoon();
}
document.addEventListener('input',e=>onField('input',e));
document.addEventListener('change',e=>onField('change',e));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(S.ui.modal) closeModal();else if(S.ui.drawer) closeDrawer();else{byId('pop').hidden=true;byId('q-res').hidden=true;if(S.ui.navOpen) setNav(false)}
    return;
  }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('[data-act]:not(button):not(input):not(select):not(textarea):not(label)')){e.preventDefault();e.target.click()}
});
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('[data-drag]');if(!c) return;e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move';c.classList.add('dragging')});
document.addEventListener('dragend',()=>{document.querySelectorAll('.dragging,.col.drop').forEach(x=>x.classList.remove('dragging','drop'))});
document.addEventListener('dragover',e=>{const col=e.target.closest?.('[data-col]');if(!col) return;e.preventDefault();document.querySelectorAll('.col.drop').forEach(x=>{if(x!==col) x.classList.remove('drop')});col.classList.add('drop')});
document.addEventListener('drop',e=>{const col=e.target.closest?.('[data-col]');if(!col) return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');col.classList.remove('drop');if(id) setTaskStatus(id,col.dataset.col)});
byId('role').addEventListener('change',e=>setMe(e.target.value));
// адрес поменяли руками (#team) — показать этот раздел (или «Нет доступа»)
if(typeof window!=='undefined') window.addEventListener('hashchange',()=>{const v=hashView();if(v&&S&&v!==S.view){S.view=v;S.ui.drawer=null;render()}});
// «как в системе»: устройство переключило светлую/тёмную — тема следом
try{if(typeof matchMedia==='function') matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S) applyTheme()})}catch(_){}
byId('q').addEventListener('input',e=>{
  const v=e.target.value,box=byId('q-res');
  if(!v.trim()){box.hidden=true;return}
  const r=searchRes(v);
  box.innerHTML=r.length?`<ul class="pop-l">${r.map(x=>`<li><button class="li" ${x.act}><span class="pill sm">${x.type}</span><span class="li-t">${esc(x.label)}<small>${esc(x.sub)}</small></span></button></li>`).join('')}</ul>`:'<p class="empty">Ничего не нашлось</p>';
  box.hidden=false;
});

// Раздел «Сегодня»
// Перенесено из прототипа v2; «я» — человек S.me, «готово/закрыто» — флаг final этапа.

// ——— «Сегодня» ———
function vHome(){
  const m=me(),hr=new Date().getHours();
  const g=hr<5?'Доброй ночи':hr<12?'Доброе утро':hr<18?'Добрый день':'Добрый вечер';
  let h=`<div class="hello"><h2>${g}, ${esc(m.name.split(' ')[0])}</h2><p>${cap(WDF[T0.getDay()])}, ${T0.getDate()} ${MONF[T0.getMonth()]} · ${esc(roleName(m))}</p></div>`;
  if(can('firm')) h+=kpiHtml();
  if(can('stock')) h+=weekHtml();
  const L=[];
  if(can('stock')||can('firm')) L.push(attnHtml());
  L.push(myTasksHtml());
  h+=`<div class="home-grid"><div class="stack">${L.join('')}</div><div class="stack">${eventsHtml()}</div></div>`;
  return h;
}
function kpiHtml(){
  const open=S.tasks.filter(t=>!isDone(t)),over=open.filter(taskOverdue);
  const inT=openIn(),late=S.shipments.filter(isLate);

function weekHtml(){

  if(late.length) cols+=`<div class="wd late"><div class="wd-h">Опаздывают<b>${late.length} ${pl(late.length,'поставка','поставки','поставок')}</b></div>${late.map(chip).join('')}</div>`;

function attention(){
  const a=[];
  S.tasks.filter(t=>taskOverdue(t)&&taskVisible(t)).forEach(t=>a.push({lvl:'bad',icon:'tasks',text:`Просрочена задача «${t.title}»`,sub:`${targetName(t)} · срок был ${fD(t.due)}`,act:`data-act="open-task" data-id="${t.id}"`}));
  if(can('stock')){
    S.shipments.filter(isLate).forEach(s=>a.push({lvl:'warn',icon:'truck',text:`${s.id} задерживается на ${days(-dd(s.eta))}`,sub:`Последняя отметка: ${shipLast(s).text}`,act:'data-act="go" data-view="logistics"'}));
    S.products.forEach(p=>{

      else if(k.onHand>0&&k.free<=0&&!k.incoming) a.push({lvl:'warn',icon:'box',text:`${p.name}: свободный остаток закончился`,sub:'Всё, что на складе, в резерве. Поставок нет',act:`data-act="open-product" data-pid="${esc(p.id)}"`});

  }
  return a;
}
