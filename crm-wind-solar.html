function dShip(s){
  const now=shipNow(),late=shipLate(s,now),done=isDone(s),place=shipPlace(s);
  const waits=s.dir==='in'?[...byDeal(S.reserves.filter(r=>r.src===s.id)).keys()]:(s.deal?[s.deal]:[]);
  const hist=(s.history||[]).slice().reverse().map(h=>{
    const src=h.source||(h.auto?'автоматически':'вручную'),who=h.by?person(h.by)?.name:null;
    return `<li><div class="sh-t">${esc(h.text)}</div><small>${fWhen(h.at)}${who?' · '+esc(who):''} · <span class="pill sm${h.auto?' info':''}">${esc(src)}</span></small></li>`;
  }).join('');
  const photos=s.received?(()=>{const r=s.received;return `<div class="photos-row">${(r.urls.length?r.urls.map(u=>`<img src="${u}" alt="Фото приёмки">`):Array.from({length:r.photos},()=>`<span class="ph-ph">${ic('photo')}</span>`)).join('')}<small>${r.photos} фото · принял(а) ${esc(person(r.by)?.name||'')}${r.note?' · '+esc(r.note):''}</small></div>${unsavedNote(r)}`})():'';
  const acts=[];
  if(can('logistics')&&!done) acts.push(`<button type="button" class="btn sm" data-act="stage" data-id="${esc(s.id)}">${ic('pin')}Отметить этап…</button>`);
  if(can('logistics')&&shipCarrierCan(s)) acts.push(`<button type="button" class="btn sm" data-act="ship-carrier" data-id="${esc(s.id)}">${ic('truck')}Имитация: статус от перевозчика</button>`);
  if(can('receive')&&awaitsReceipt(s)) acts.push(`<button type="button" class="btn sm pri" data-act="rcv-start" data-id="${esc(s.id)}">${ic('camera')}Принять на складе</button>`);
  const stageNow=done||!can('logistics')?`<span class="pill ${done?'ok':late?'bad':awaitsReceipt(s)?'sun':'info'}">${esc(stageName(s))}</span>`:shipStageSelect(s,'inp sm');
  return {kind:(s.dir==='out'?'Отгрузка ':'Поставка ')+s.id,title:esc(s.supplier)+(s.demo?' <span class="pill sm">пример</span>':''),sub:esc(shipWhere(s)),body:`
    <div class="d-stage"><div class="field"><label>Этап</label>${stageNow}</div>${late?'<span class="pill bad">Опаздывает</span>':''}</div>
    ${shipScale(s,now,true)}
    <dl class="kv"><dt>Ожидается</dt><dd>${s.eta?fD(s.eta):'нет данных'} · ${esc(shipEtaText(s,now))}</dd>
      <dt>Отправлена</dt><dd>${s.depart?fD(s.depart):'нет данных: дата отправки'}</dd>
      <dt>Перевозчик</dt><dd>${esc(s.carrier||'нет данных')}</dd><dt>Трек</dt><dd><span class="mono">${esc(s.track||'нет данных')}</span></dd>
      ${s.dir==='in'?`<dt>Юрлицо</dt><dd>${esc(place.entity)}</dd><dt>Город</dt><dd>${esc(place.city)}</dd>`:`<dt>Куда</dt><dd>${esc(s.to||'нет данных')}</dd>`}
      ${Array.isArray(s.route)&&s.route.length>1?`<dt>Маршрут</dt><dd>${esc(Ships.routeText(s.route))}</dd>`:''}</dl>
    <div><h4 class="sh">Позиции · штук ${num(Ships.units(s))}</h4>${shipItems(s)}</div>
    ${waits.length?`<div class="waits">${ic('users')}<span>${s.dir==='in'?'Ждут этот товар':'Для сделки'}: ${can('clients')?waits.map(id=>`<button type="button" class="link" data-act="open-deal" data-id="${esc(id)}">${esc(id)} · ${esc(deal(id)?.client||'')}</button>`).join(', '):waits.length+' '+pl(waits.length,'сделка','сделки','сделок')}</span></div>`:''}
    ${photos}${acts.length?`<div class="ship-f">${acts.join('')}</div>`:''}
    <div><h4 class="sh">История отметок</h4><ul class="shist">${hist||'<li class="muted">Отметок пока нет.</li>'}</ul></div>`};
}

// Свои колонки (data-scol) и свой drop: общий обработчик оболочки смотрит только на data-col (задачи).

// Раздел «Приёмка на складе»
// Перенесено из прототипа v2. Что ждёт приёмки — Ships.awaitingReceipt (флаг arrived), единственное «ждёт приёмки»;
// кому уведомления — Notify; этап ставит только ядро (Ships.setStage, Ships.applyRules); товар кладёт Stock.move.
// Предпросмотр и подтверждение считают по одному плану rcvPlan(): справа на экране то же самое, что сделает receiveShip.

// ——— приёмка ———
// Юрлицо и город склада по умолчанию — те, что записаны в поставке; нет данных — кладовщик выбирает сам
const newRcv=id=>{const s=ship(id);return {shipId:id,qty:Object.fromEntries(s.items.map(i=>[i.productId,i.qty])),dmg:{},note:'',photos:[],entityId:s.entityId||'',cityId:s.cityId||'',done:null}};
function initRcv(id){S.rcv=newRcv(id)}
const pendingRcv=()=>Ships.awaitingReceipt(S).sort((a,b)=>(a.eta?a.eta.getTime():Infinity)-(b.eta?b.eta.getTime():Infinity));
// Куда ляжет товар: выбранные юрлицо и город (у черновика из старого сохранения их нет — берём из поставки)
function rcvCell(r=S.rcv){
  const s=ship(r.shipId)||{},entityId=r.entityId!==undefined?r.entityId:(s.entityId||''),cityId=r.cityId!==undefined?r.cityId:(s.cityId||'');
  const en=entityId?Stock.entityName(S,entityId):null,cn=cityId?Stock.cityName(S,cityId):null;
  return {entityId,cityId,entityName:en||'нет данных: юрлицо',cityName:cn||'нет данных: город',ok:!!en&&!!cn};
}
// Текущая приёмка: начатая или первая из ждущих (без записи в S — вид не меняет состояние)
function curRcv(){
  if(S.rcv&&S.rcv.done) return S.rcv;
  const pend=pendingRcv();
  if(S.rcv&&pend.some(s=>s.id===S.rcv.shipId)) return S.rcv;
  return pend.length?newRcv(pend[0].id):null;
}
// Перед отрисовкой раздела: начатая приёмка или первая из ждущих становится текущей
function syncRcv(){const r=curRcv();if(r!==S.rcv) S.rcv=r}
const qv=(pid,r=S.rcv)=>Math.max(0,parseInt(r.qty[pid],10)||0);
function diffHtml(it,r=S.rcv){const d=qv(it.productId,r)-it.qty;return d<0?`<span class="pill bad sm">недостача ${num(-d)}</span>`:d>0?`<span class="pill warn sm">излишек ${num(d)}</span>`:'<span class="pill ok sm">сходится</span>'}
// План приёмки — один на предпросмотр и подтверждение: что ляжет на склад и куда, на какой этап встанет поставка,
// расхождения, сделки-ждуны и что с каждой, кому уведомления. receiveShip делает ровно это и ничего сверх.
function rcvPlan(r=S.rcv){
  const s=ship(r.shipId),auto=rule('arrive').on,issues=[],dmg=[];
  s.items.forEach(it=>{
    const p=product(it.productId),q=qv(it.productId,r);
    if(q<it.qty) issues.push(`${p.name}: принято ${num(q)} из ${qtyOf(it.qty,p)}`);
    else if(q>it.qty) issues.push(`${p.name}: принято ${num(q)} вместо ${qtyOf(it.qty,p)}`);
    if(r.dmg[it.productId]) dmg.push(p.name);
  });

// Принять поставку S.rcv по плану rcvPlan: товар ложится на выбранные юрлицо и город (Stock.move, запись в журнал),
// резервы «из поставки» становятся резервами со склада, поставка встаёт на этап «на складе» через ядро
// (Ships.setStage с пометкой «автоматически: приёмка» и Ships.applyRules на «принято на складе»), уведомления — Notify,
// клиентам — сообщение в канал сделки (имитация) или задача менеджеру позвонить.
// → итог приёмки (он же S.rcv.done) или {ok:false, reason}, если принять нельзя; тогда ничего не меняется.
function receiveShip(by,now){
  const r=S.rcv,P=rcvPlan(r),s=P.s,who=person(by);
  if(P.block) return {ok:false,reason:P.block};
  const stock=[];
  s.items.forEach((it,i)=>{
    const q=P.adds[i].qty;
    it.got=q;
    // приход: остаток растёт в клетке «юрлицо × город», запись попадает в журнал движений
    if(q&&Stock.move(S,{kind:Stock.KINDS.receive,productId:it.productId,qty:q,entityId:P.cell.entityId,cityId:P.cell.cityId,doc:s.id,by,at:now}).ok) stock.push({productId:it.productId,qty:q});
  });
  s.entityId=P.cell.entityId;s.cityId=P.cell.cityId;
  P.res.forEach(x=>{x.src='stock';x.entityId=P.cell.entityId;x.cityId=P.cell.cityId});
  // этап и положение груза — только через ядро; правила директора на «принято на складе» — после этапа
  const before=S.notes.length;
  Ships.setStage(S,s.id,P.final.id,by,now,Ships.SRC.receipt);
  s.history.push({at:now,by,text:`Принято на склад: ${P.cell.entityName}, ${P.cell.cityName}. Фото: ${r.photos.length}.${r.note.trim()?' Комментарий: '+r.note.trim():''}`,source:Ships.SRC.receipt,auto:true});
  const fired=Ships.applyRules(S,'received',s.id,by,now);
  s.received={at:now,by,photos:r.photos.length,urls:r.photos.slice(),note:r.note.trim()};
  const notes=S.notes.slice(0,S.notes.length-before),msgIds=[],taskIds=[];
  notes.push(Notify.push(S,'arrive',by,`${s.id} принята на склад (${P.cell.entityName}, ${P.cell.cityName}): ${s.items.map(it=>`${low(product(it.productId).name)} ${qtyOf(it.got,product(it.productId))}`).join(', ')}. Фото: ${r.photos.length}.${s.received.note?' Комментарий: '+s.received.note:''}`,now));
  if(P.issues.length||P.dmg.length) notes.push(Notify.push(S,'warn',by,`Приёмка ${s.id} с замечаниями. ${[P.issues.join('; '),P.dmg.length?'Повреждено: '+P.dmg.join(', '):''].filter(Boolean).join('. ')}. Фото в карточке поставки.`,now));
  P.waits.forEach(({d,items,how})=>{
    const mg=person(d.managerId);let tail;
    if(how==='call'){const board=taskBoard();const t={id:Store.freeId(S.tasks,'t'),title:`Позвонить клиенту: товар по ${d.id} на складе`,desc:items,to:{t:'p',id:d.managerId},from:by,due:day(0,18),boardId:board.id,stageId:startStage(board.id).id,prio:'high',deal:d.id,at:now};S.tasks.push(t);taskIds.push(t.id);tail='Менеджеру поставлена задача позвонить клиенту.'}
    else if(how==='auto'){const x={id:Store.freeId(S.msgs,'m'),at:now,deal:d.id,channel:d.channel,auto:true,sim:true,text:fillTpl(d,items,false)};S.msgs.push(x);msgIds.push(x.id);tail=`Клиенту ушло авто-сообщение в ${CH[d.channel]} (имитация, не отправлено).`}
    else tail='Авто-сообщения выключены — напишите клиенту.';
    // менеджеру сделки — отдельно: уведомите клиента (R15)
    notes.push(Notify.push(S,'msg',null,`Уведомите клиента: ${d.client} (${d.id}) — товар на складе: ${items}. ${tail} Менеджер: ${mg?.name||'нет данных'}.`,now,[d.managerId]));
  });
  const notified=new Set(notes.flatMap(n=>n.to).filter(id=>id!==by)).size;
  r.done={ok:true,shipId:s.id,noteIds:notes.map(n=>n.id),msgIds,taskIds,stock,cell:{entityId:P.cell.entityId,cityId:P.cell.cityId,entityName:P.cell.entityName,cityName:P.cell.cityName},stage:P.final.name,fired,notified,issues:P.issues.length+P.dmg.length,by:who?.id||by};
  return r.done;
}

function dealGoods(d){
  const rs=S.reserves.filter(r=>r.dealId===d.id);
  if(!rs.length) return {lvl:'',text:'не зарезервирован'};
  const wait=rs.filter(r=>r.src!=='stock');
  if(wait.some(r=>stockOf(r.productId).freeAfter<0)) return {lvl:'bad',text:'не хватает товара'};
  if(!wait.length) return {lvl:'ok',text:'всё на складе'};
  const ss=[...new Set(wait.map(r=>r.src))].map(ship).filter(Boolean);
  const last=ss.reduce((a,s)=>s.eta>a?s.eta:a,ss[0].eta);
  return {lvl:'info',text:`едет ${ss.map(s=>s.id).join(', ')} · до ${fD(last)}`};
}

  return `<article class="tcard lcard${isDone(l)?' done':''}" draggable="true" data-drag="${esc(l.id)}" data-act="open-lead" data-id="${esc(l.id)}" tabindex="0"><div class="tc-top">${leadSrcPill(l)}${leadTypePill(l)}${l.demo?'<span class="pill sm">пример</span>':''}</div><p class="tc-t">${esc(Leads.title(l))}<small class="mono lc-id">${esc(l.id)}</small></p>${l.text?`<p class="lc-x">${esc(l.text)}</p>`:''}<div class="tc-m">${mgr}<span class="due">${esc(fRel(l.at))}</span></div></article>`;

function leadFunnel(list){
  const pipe=leadPipe();
  if(!pipe) return '<section class="card"><p class="empty">Воронки лидов нет — её заводят в «Настройки → Воронки».</p></section>';
  return `<div class="xs" data-hscroll><div class="lkan" style="--n:${pipe.stages.length}">${pipe.stages.map(s=>{
    const c=list.filter(l=>l.pipeId===pipe.id&&l.stageId===s.id);
    return `<div class="col" data-lcol="${esc(s.id)}"><div class="col-h"><span>${esc(s.name)}</span><span class="cnt-s">${c.length}</span></div>${c.map(leadCard).join('')||'<p class="col-empty">Пусто</p>'}</div>`;
  }).join('')}</div></div>`;
}

// ——— тело раздела: счёт + список или воронка (его же перерисовывает поиск) ———
function leadBody(){
  const u=leadSel(),all=Leads.visible(S,S.me),funnel=u.view==='funnel';
  const list=leadFilter(all,u,!funnel);
  const head=`<p class="count"><span>Лидов: <b>${list.length}</b>${list.length!==all.length?` из ${all.length}`:''}</span><span>без менеджера: <b>${leadFreeCount(all)}</b></span></p>`;
  if(!all.length) return `${head}<section class="card"><p class="empty">Лидов пока нет. Они приходят с сайта и из Битрикса24 — откуда именно, выбирают в «Настройки → Лиды».${can('settings')?' Проверить можно кнопками «Имитация» выше.':''}</p></section>`;
  if(!list.length) return `${head}<section class="card"><p class="empty">По этим условиям лидов нет. <button type="button" class="link" data-act="lead-reset">Сбросить поиск и фильтры</button></p></section>`;
  return head+(funnel?`<p class="hint">Перетащите карточку на другой этап или откройте лид и нажмите кнопку. «Сделка создана» заводит сделку, «Отказ» спрашивает причину. Двигать лид может менеджер, который его ведёт, и тот, кто раздаёт лиды (директор, РОП).</p>${leadFunnel(list)}`:leadTable(list));
}

// ——— почему нельзя: один текст на экран, окно и тост ———
function leadWhy(l,need){
  if(isDone(l)) return `Лид ${l.id} закрыт — менять его уже нельзя.`;
  if(need==='transfer') return 'Передавать лиды могут директор и РОП — тот, у кого есть право «Распределять и передавать лиды».';
  if(need==='take') return l.managerId===S.me?`Лид ${l.id} уже у вас.`:l.managerId?`Лид ${l.id} уже ведёт ${leadWho(l.managerId)}.`:`Лид ${l.id} другого типа — взять его может менеджер ${Leads.TYPE[l.type]||'нужного типа'}.`;
  if(need==='deal'&&l.dealId) return `Сделка по лиду ${l.id} уже создана: ${l.dealId}.`;
  if(!l.managerId) return `У лида ${l.id} пока нет менеджера — сначала нажмите «Взять» или попросите РОП или директора передать лид.`;
  if(need==='deal'&&Leads.can(S,l.id,S.me).work) return `Сделку из лида ${l.id} не создать: не определён тип лида — передайте его менеджеру B2B или B2C.`;
  return `Лид ${l.id} ведёт ${leadWho(l.managerId)} — менять его могут он и тот, кто раздаёт лиды (директор, РОП).`;
}

// ——— карточка лида ———
function dLead(l){
  const c=Leads.can(S,l.id,S.me),open=!isDone(l);
  const deal=l.dealId?Leads.dealsVisible(S,S.me).find(d=>d.id===l.dealId):null;
  const stg=stagesFor(l).filter(s=>s.id!==Leads.STAGE.lost);
  const steps=l.stageId===Leads.STAGE.lost
    ?`<p class="lock">${ic('lock')}Лид закрыт. Причина: ${esc(l.reason||'нет данных: причина')}</p>`
    :`<ol class="steps" style="--n:${stg.length}">${stg.map((x,i)=>`<li class="${i<stagePos(l)?'done':x.id===l.stageId?'cur':''}"><span>${esc(x.name)}</span></li>`).join('')}</ol>`;
  const b=(act,label,cls)=>`<button type="button" class="btn${cls?' '+cls:''}" data-act="${act}" data-id="${esc(l.id)}">${label}</button>`;
  let acts='';
  if(c.take) acts+=b('lead-take','Взять','pri');
  if(c.work){
    acts+=b('lead-contacted','Связались');
    if(l.stageId!==Leads.STAGE.qualified) acts+=b('lead-qualify','Квалифицирован');
    if(c.deal) acts+=b('lead-deal',ic('plus')+'Создать сделку','pri');
    acts+=b('lead-close',ic('x')+'Закрыть');
  }
  if(deal) acts+=`<button type="button" class="btn" data-act="open-deal" data-id="${esc(deal.id)}">Открыть сделку ${esc(deal.id)}</button>`;
  const lock=open&&!c.take&&!c.work?`<p class="lock">${ic('lock')}${esc(leadWhy(l,'work'))}</p>`:'';
  const tr=c.transfer?`<form class="rform" data-form="lead-transfer" data-id="${esc(l.id)}" novalidate><p class="sh">Передать</p><div class="field"><label for="lead-tr">Кому</label><select id="lead-tr" class="inp"><optgroup label="Менеджеру">${Leads.managers(S).map(m=>`<option value="m:${esc(m.id)}"${m.id===l.managerId?' selected':''}>${esc(m.name)} — ${Leads.TYPE[Perms.roleOf(S,m.id).scope]}, открытых лидов: ${Leads.openCount(S,m.id)}</option>`).join('')}</optgroup><optgroup label="Типу — менеджеру с меньшей загрузкой"><option value="t:b2b">Тип B2B</option><option value="t:b2c">Тип B2C</option></optgroup></select></div><p class="hint">Новый менеджер получит уведомление, в истории лида останется, кто и кому передал.</p><div><button type="submit" class="btn">Передать</button></div></form>`:'';
  const hist=l.history.slice().reverse().map(h=>`<li><span>${esc(h.text)}</span><small>${esc(h.by?leadWho(h.by):'Система')} · ${esc(fWhen(h.at))}</small></li>`).join('');
  return {kind:'Лид '+l.id,title:esc(Leads.title(l)),sub:`${esc(Leads.SOURCE[l.source]||l.source)} · ${esc(fWhen(l.at))}`,body:`
    ${steps}
    ${acts?`<div class="lead-act">${acts}</div>`:''}${lock}
    <dl class="kv"><dt>Источник</dt><dd>${leadSrcPill(l)}${leadDemoPill(l)}</dd><dt>Пришёл</dt><dd>${esc(fWhen(l.at))}</dd><dt>Тип</dt><dd>${leadTypePill(l)}</dd><dt>Менеджер</dt><dd>${leadMgrCell(l)}</dd>
      <dt>Контакт</dt><dd>${l.name?esc(l.name):leadNoData('имя')}</dd><dt>Телефон</dt><dd>${l.phone?esc(l.phone):leadNoData('телефон')}</dd><dt>Почта</dt><dd>${l.email?esc(l.email):leadNoData('почта')}</dd>
      ${l.company?`<dt>Компания</dt><dd>${esc(l.company)}</dd>`:''}${l.inn?`<dt>ИНН</dt><dd>${esc(l.inn)}</dd>`:''}${l.reason?`<dt>Причина отказа</dt><dd>${esc(l.reason)}</dd>`:''}${l.dealId?`<dt>Сделка</dt><dd>${esc(l.dealId)}</dd>`:''}</dl>
    <div><h4 class="sh">Текст заявки</h4><p class="prose">${l.text?esc(l.text):leadNoData('текст заявки')}</p></div>
    ${tr}
    <div><h4 class="sh">История</h4><ul class="mv">${hist}</ul></div>`};
}

// ——— действия: каждое — запись в историю (ядро) и короткое подтверждение ———
// need — что требуется от человека по Leads.can: take, work, deal, transfer
function leadAct(id,need,run,done){
  const l=leadById(id);if(!l) return null;
  if(!Leads.can(S,id,S.me)[need]){toast(leadWhy(l,need),'warn');return null}
  const r=run(new Date());
  if(!r){toast(`Лид ${id}: не получилось.`,'warn');return null}
  render();toast(done(r));return r;
}
// Перевести лид на этап: из воронки (перетаскивание) и из кнопок карточки. Всё — через Leads.move
function leadMoveTo(id,stageId){
  const l=leadById(id),to=l&&Pipes.stage(S,l.pipeId,stageId);
  if(!l||!to||to.id===l.stageId) return null;
  const c=Leads.can(S,id,S.me);
  if(!c.work){toast(leadWhy(l,'work'),'warn');return null}
  if(stageId===Leads.STAGE.lost){openModal('leadLost',id);return null}
  if(stageId===Leads.STAGE.deal&&!c.deal){toast(leadWhy(l,'deal'),'warn');return null}
  const r=Leads.move(S,id,stageId,S.me,new Date());
  if(!r){toast(`Лид ${id} на этап «${to.name}» не переносится.`,'warn');return null}
  render();
  if(stageId===Leads.STAGE.deal){
    const d=S.deals.find(x=>x.id===r.dealId);
    toast(`Сделка ${d.id} создана из лида ${id}: контакт и текст заявки перенесены. Воронка «${pipeById(d.pipeId).name}», менеджер — ${leadWho(d.managerId)}.`);
  }else toast(`Лид ${id} теперь на этапе «${to.name}». Запись в истории есть.`);
  return r;
}

document.addEventListener('dragover',e=>{
  const col=e.target.closest?.('[data-lcol]');if(!col) return;
  e.preventDefault();

// Всё явно ненастоящее: имена «пример», телефоны +7 900 000-01-NN, почта на example.com.
const LEAD_SIM=[
  {company:'ООО „Пример-Имитация“',phone:'+7 900 000-01-',text:'Пример заявки (имитация): нужна станция для объекта компании, просим прислать КП.'},
  {phone:'+7 900 000-01-',text:'Пример заявки (имитация): интересует станция для дома, просьба перезвонить.'},
  {inn:'0000001',text:'Пример заявки (имитация): нужен расчёт резервного питания для склада.'},
  {email:'sim-primer@example.com',text:'Пример заявки (имитация): написал на почту, хочет узнать про ветро-солнечную станцию для дачи.'},
];
function leadSimulate(source){
  if(!Object.hasOwn(Leads.SOURCE,source)) return null;
  if(!Leads.allows(S,source)){
    toast(`Источник «${Leads.SOURCE[source]}» сейчас не используется: в «Настройки → Лиды» выбрано «${Leads.SOURCES[S.leadSource]||Leads.SOURCES.both}». Лид не создан.`,'warn');
    return null;
  }
  const n=(S.leads||[]).filter(l=>l.sim).length+1,k=LEAD_SIM[(n-1)%LEAD_SIM.length],nn=String(n%100).padStart(2,'0');
  const data={source,demo:true,name:`Клиент-пример (имитация ${n})`,text:k.text};
  if(k.company){data.company=k.company;data.name=`Контакт-пример (имитация ${n})`}
  if(k.phone) data.phone=k.phone+nn;
  if(k.inn) data.inn=k.inn+String(n%1000).padStart(3,'0');
  if(k.email) data.email=k.email;
  const lead=Leads.create(S,data,new Date());
  lead.sim=true;
  const note=S.notes[0],got=note&&note.kind==='lead'?note.to.length:0;
  render();
  toast(`Пришёл лид ${lead.id} (${Leads.SOURCE[source]}, «пример»). ${lead.managerId?`Тип ${Leads.TYPE[lead.type]}, менеджер — ${leadWho(lead.managerId)}.`:'Менеджера нет — лид нераспределённый.'} Уведомление получили: ${got}.`);
  return lead;
}

// Что выбрано сейчас: ящик из видимых этому человеку, папка (только в ящике закупок), письмо, поиск, столбец на телефоне.
function mailSel(){
  const m=mailData(),u=S.ui.mail||{},boxes=Mail.boxesFor(S,S.me);
  const box=boxes.find(b=>b.id===u.box)||boxes[0]||null;
  const purchase=!!box&&box.kind==='purchase';
  const folder=purchase&&(u.folder===Mail.INBOX||m.suppliers.some(s=>s.id===u.folder))?u.folder:'all';
  const letter=box&&u.letter?m.letters.find(l=>l.id===u.letter&&l.boxId===box.id)||null:null;
  const pane=letter&&u.pane==='letter'?'letter':u.pane==='nav'?'nav':'list';

// ——— имитация: пришло письмо ———
// Поочерёдно: письмо от известного поставщика (ляжет в его папку) и от незнакомого адреса (в «Разобрать»).
// В ящике без папок поставщиков — письмо клиента. Кладёт Mail.deliver: он же рассылает уведомление тем, кто видит ящик.
function mailSimulate(boxId){
  const m=mailData();
  const box=m.boxes.find(b=>b.id===boxId)||m.boxes.find(b=>b.kind==='purchase')||m.boxes[0];
  if(!box){toast('Ящиков нет — письму некуда прийти.','warn');return null}
  const n=m.letters.filter(l=>l.sim).length+1;
  let from,fromName,subject;
  const known=m.suppliers.filter(s=>(s.rules||[]).length);
  if(box.kind==='purchase'&&n%2===1&&known.length){
    const s=known[((n-1)/2)%known.length],r=s.rules[0];
    from=r.startsWith('@')?'sim'+r:r;fromName=s.name;subject='Пример: письмо от поставщика';
  }else if(box.kind==='purchase'){
    from=`new-${n}@unknown-${n}.example`;fromName='Незнакомый отправитель (пример)';subject='Пример: письмо от незнакомого адреса';
  }else{
    from=`client-sim-${n}@clients.example`;fromName='Клиент-пример';subject='Пример: вопрос от клиента';
  }
  const l=Mail.deliver(S,{boxId:box.id,from,fromName,subject,body:'Это пример входящего письма для проверки. Настоящая почта не подключена: письмо создано кнопкой «Имитация».',demo:true},new Date());
  if(!l) return null;
  l.sim=true;
  const to=(S.notes[0]&&S.notes[0].kind===Mail.NOTE_KIND?S.notes[0].to:[]).length;
  render();
  toast(`Пришло письмо в ящик «${box.title}», папка «${mailFolderName(box,l)}». Уведомление получили: ${to}.`);
  return l;
}

// Настройки → «Склады и юрлица»: справочники юрлиц и городов (добавить, переименовать, адрес склада)
// и откуда взят каталог. Справочники лежат в S.entities и S.cities: сетка остатков, форма резерва и журнал
// берут названия оттуда же, поэтому переименование видно везде сразу.

// Название уже занято другим элементом справочника (сравнение как у товаров: регистр и пробелы не в счёт)
const nameTaken=(list,name,exceptId)=>list.some(x=>x.id!==exceptId&&Catalog.norm(x.name)===Catalog.norm(name));

// Переименование из поля data-on: пустое и занятое название не принимаются, поле возвращается к прежнему
function renameInDict(list,t,what){
  const item=list.find(x=>x.id===t.dataset.id);if(!item) return;
  const name=String(t.value).trim();
  if(!name||nameTaken(list,name,item.id)){
    t.value=item.name;
    toast(!name?'Название не может быть пустым.':`${what} «${name}» уже есть в справочнике.`,'warn');
    return;
  }
  if(name===item.name) return;
  const old=item.name;item.name=name;
  render();toast(`${what} «${old}» теперь называется «${name}».`);
}

ON.change['city-name']=t=>renameInDict(S.cities,t,'Город');

// Настройки → «Поставки»: правила директора «если <событие> — поставить этап <этап>».
// Правила лежат в S.shipRules [{id, on, when, then}]; событие и срабатывание считает ядро Ships (applyRules):
// приёмка зовёт его на «принято на складе», шаг перевозчика — на «перевозчик: груз в точке …» и «таможня пройдена».
// Срабатывание видно в истории поставки с пометкой «правило: …».

// События для выбора: подписи — Ships.eventLabel, одно место. Китай — начало маршрута: груз туда не «приходит».
const SHIP_RULE_EVENTS=()=>[
  'received',
  ...Ships.NODES.filter(n=>n.id!=='cn').map(n=>'carrier:'+n.id),
  'carrier',
  'customs'
];
// Этапы воронки поставок «едут к нам»: на них правило ставит поставку
const shipRuleStages=()=>(shipPipe('in')||{stages:[]}).stages;
const shipRules=()=>S.shipRules||[];

function shipRuleEventSel(r,attrs){
  const evs=SHIP_RULE_EVENTS();
  if(!evs.includes(r.when)) evs.push(r.when);
  return `<select ${attrs} class="inp sm">${evs.map(ev=>`<option value="${esc(ev)}" ${ev===r.when?'selected':''}>${esc(Ships.eventLabel(ev))}</option>`).join('')}</select>`;
}
function shipRuleStageSel(r,attrs){
  const st=shipRuleStages(),known=st.some(x=>x.id===r.then);
  return `<select ${attrs} class="inp sm">${known?'':`<option value="" selected>нет данных: этап</option>`}${st.map(x=>`<option value="${esc(x.id)}" ${x.id===r.then?'selected':''}>${esc(x.name)}${x.flag==='final'?' (на складе)':''}</option>`).join('')}</select>`;
}
function vShipSettings(){
  const rules=shipRules();

// Настройки → «Почта»: ящики (добавить, адрес, кто видит) и поставщики (добавить, переименовать, правила-адреса,
// удалить). Данные лежат в S.mail, раздел «Почта» читает их оттуда же, поэтому правка видна там сразу.
// Правило поставщика — точный адрес (sales@firma.ru) или весь домен (@firma.ru); письма раскладывает Mail.folderOf.

const mailSame=(a,b)=>String(a).trim().toLowerCase().replace(/ё/g,'е')===String(b).trim().toLowerCase().replace(/ё/g,'е');
const MAIL_ADDR=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;

// «sales@firma.ru, @firma.ru, firma.ru» → правила; bad — то, что на адрес или домен не похоже
function mailParseRules(text){
  const rules=[],bad=[];
  for(let r of String(text||'').toLowerCase().split(/[\s,;]+/).filter(Boolean)){
    if(!r.includes('@')&&/^[^\s.]+(\.[^\s.]+)+$/.test(r)) r='@'+r;           // «firma.ru» → весь домен
    if(/^@[^@\s]+\.[^@\s]+$/.test(r)||MAIL_ADDR.test(r)){if(!rules.includes(r)) rules.push(r)}else bad.push(r);
  }
  return {rules,bad};
}
// Правило уже у другого поставщика: у одного правила один хозяин
const mailRuleOwner=(rule,exceptId)=>mailData().suppliers.find(s=>s.id!==exceptId&&(s.rules||[]).some(r=>mailSame(r,rule)))||null;
// Разложить все письма заново по правилам; → сколько писем сменили папку
function mailRefile(){
  let moved=0;
  for(const l of mailData().letters){const f=Mail.folderOf(S,l);if(f!==l.folder){l.folder=f;moved++}}
  return moved;
}
// Удаление поставщика: его письма уходят в «Разобрать», правила уходят вместе с ним
function mailDeleteSupplier(supId){
  const m=mailData(),i=m.suppliers.findIndex(s=>s.id===supId);
  if(i<0) return {ok:false,moved:0,name:''};
  const [sup]=m.suppliers.splice(i,1);
  let moved=0;
  for(const l of m.letters) if(l.folder===supId){l.folder=Mail.INBOX;moved++}
  return {ok:true,moved,name:sup.name};
}
const mailRoleNames=b=>{
  const names=S.roles.filter(r=>r.all||(b.roles||[]).includes(r.id)).map(r=>r.name);
  return names.join(', ');
};
