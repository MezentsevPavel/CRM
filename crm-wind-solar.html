<title>CRM wind-solar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Цвета и шрифт — из приложения PVCalc (его tokens.css и тёмная тема): тёплый светлый фон,
   белые карточки, один зелёный акцент, солнечный янтарь — резервы и «внимание», красный — нарушения.
   Синего и фиолетового в палитре приложения нет, поэтому «в пути» и каналы связи — нейтральный серый.
   Раскладка: светлая панель разделов слева, справа рабочее поле с карточками.
   Тема: оболочка ставит на <html> data-theme="light" или "dark" (светлая, тёмная или по системе — S.prefs.theme);
   блок @media — только до запуска кода. --logo-plate — подложка логотипа: в тёмной теме светлая,
   иначе тёмная надпись Windsolar не читается. */
:root{
  --bg:#F1F2EF; --surface:#FFFFFF; --surface-2:#F7F8F6; --sunken:#E8E9E6; --line:rgba(27,29,27,.10); --line-2:rgba(27,29,27,.18); --ink:#1B1D1B; --ink-2:rgba(27,29,27,.66); --ink-3:rgba(27,29,27,.64); --primary:#0C8646; --primary-2:#0A733A; --primary-ink:#FFFFFF; --primary-soft:#E7F5EE; --primary-line:rgba(14,158,82,.28); --primary-deep:#07602F; --sun:#F5A623; --on-sun:#2A1C00; --sun-soft:#FDEFD7; --sun-ink:#8A5200; --ok:#0A7A3F; --ok-soft:#E7F5EE; --warn:#8A5200; --warn-soft:#FDEFD7; --bad:#B3261E; --bad-soft:#F7E9E8; --info:#4F524F; --info-soft:#E8E9E6; --violet:#4F524F; --violet-soft:#E8E9E6; --seg-on:#FFFFFF; --bezel:#1B1D1B; --overlay:rgba(14,18,16,.45); --on-overlay:#FFFFFF; --shadow-1:0 1px 2px rgba(20,30,24,.05),0 2px 8px rgba(20,30,24,.05); --shadow:0 4px 10px rgba(20,30,24,.08),0 20px 44px rgba(20,30,24,.14);
  --f-display:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --logo-plate:transparent;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1210; --surface:#171C1A; --surface-2:#1D2220; --sunken:#222926; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.16); --ink:#ECEFEA; --ink-2:rgba(236,239,234,.66); --ink-3:rgba(236,239,234,.60); --primary:#35C77F; --primary-2:#4FCD91; --primary-ink:#0E1210; --primary-soft:#1B3026; --primary-line:rgba(53,199,127,.32); --primary-deep:#9BE8C0; --sun:#E8B23C; --on-sun:#2A1C00; --sun-soft:#38341F; --sun-ink:#EDBE5A; --ok:#35C77F; --ok-soft:#1B3026; --warn:#EDBE5A; --warn-soft:#38341F; --bad:#E0894A; --bad-soft:#332B21; --info:#B9BDB8; --info-soft:#222926; --violet:#B9BDB8; --violet-soft:#222926; --seg-on:#393E3B; --bezel:#2A302D; --overlay:rgba(0,0,0,.55); --on-overlay:#FFFFFF; --shadow-1:0 1px 2px rgba(0,0,0,.34),0 2px 8px rgba(0,0,0,.30); --shadow:0 4px 12px rgba(0,0,0,.42),0 22px 48px rgba(0,0,0,.55);
  --logo-plate:#F1F2EF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1210; --surface:#171C1A; --surface-2:#1D2220; --sunken:#222926; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.16); --ink:#ECEFEA; --ink-2:rgba(236,239,234,.66); --ink-3:rgba(236,239,234,.60); --primary:#35C77F; --primary-2:#4FCD91; --primary-ink:#0E1210; --primary-soft:#1B3026; --primary-line:rgba(53,199,127,.32); --primary-deep:#9BE8C0; --sun:#E8B23C; --on-sun:#2A1C00; --sun-soft:#38341F; --sun-ink:#EDBE5A; --ok:#35C77F; --ok-soft:#1B3026; --warn:#EDBE5A; --warn-soft:#38341F; --bad:#E0894A; --bad-soft:#332B21; --info:#B9BDB8; --info-soft:#222926; --violet:#B9BDB8; --violet-soft:#222926; --seg-on:#393E3B; --bezel:#2A302D; --overlay:rgba(0,0,0,.55); --on-overlay:#FFFFFF; --shadow-1:0 1px 2px rgba(0,0,0,.34),0 2px 8px rgba(0,0,0,.30); --shadow:0 4px 12px rgba(0,0,0,.42),0 22px 48px rgba(0,0,0,.55);
  --logo-plate:#F1F2EF;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.sm{font-size:12.5px}
.m0{margin:0}
.nowrap{white-space:nowrap}
.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bad-t{color:var(--bad)}.ok-t{color:var(--ok)}.warn-t{color:var(--warn)}
.xs{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack-s{display:flex;flex-direction:column;gap:14px;min-width:0}

/* ——— каркас ——— */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;overflow-y:auto;padding-block:18px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;background:var(--surface);border-right:1px solid var(--line);color:var(--ink)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:0 0 4px}
.logo{display:block;padding:6px 10px;border-radius:12px;background:var(--logo-plate)}
.logo img{display:block;width:auto;height:30px}
.brand small{display:block;padding-left:10px;font-size:11.5px;color:var(--ink-3)}
.side-b{display:flex;flex-direction:column;flex:1 0 auto}
.nav-g{display:flex;flex-direction:column;gap:2px;margin-top:20px}
.nav-g h4{margin:0 10px 6px;font:700 10.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.nav-i{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;border-radius:12px;background:transparent;color:var(--ink);font-size:13.5px;font-weight:500;text-align:left}
.nav-i .ic{color:var(--ink-3)}
.nav-i:hover{background:var(--surface-2)}
.nav-i.on{background:var(--primary-soft);color:var(--primary-deep);font-weight:700}
.nav-i.on .ic{color:var(--primary)}
.cnt{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:10px;background:var(--sunken);color:var(--ink-2);font-size:11.5px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.cnt.hot{background:var(--sun);color:var(--on-sun)}
.me{display:flex;align-items:center;gap:10px;margin-top:auto;padding:14px 6px 2px;border-top:1px solid var(--line)}
.me b{display:block;font-size:13px}
.me small{display:block;font-size:11.5px;color:var(--ink-3)}
.side-scrim{display:none;position:fixed;inset:0;z-index:44;background:var(--overlay)}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{position:relative;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:24px;padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.ttl{margin:0;font:800 17px/1.2 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
/* .btn.burger: иначе .btn ниже по файлу показывает «меню» и на широком экране */
.btn.burger{display:none}
.search{position:relative;flex:1 1 0;min-width:160px;max-width:440px;margin-left:auto}
.s-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);display:flex;color:var(--ink-3)}
.search .inp{padding-left:36px;background:var(--surface-2)}
.as{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.as select{width:auto;max-width:240px}
.theme-sw{display:flex}
.theme-seg.compact{flex-wrap:nowrap}
.theme-seg:not(.compact){border-radius:14px}
.theme-seg:not(.compact) button{border-radius:11px}
.theme-seg button{display:inline-flex;align-items:center;gap:7px}
.theme-seg .ic{width:16px;height:16px}
.theme-seg.compact button{padding:6px 8px}
.theme-seg.compact span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bell-w{position:relative}
.bn{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--sun);color:var(--on-sun);font-size:10.5px;font-weight:700;line-height:1;display:grid;place-items:center}
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:min(400px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.pop-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pop-h b{font-size:13.5px}
.pop-l{max-height:min(60vh,460px);overflow-y:auto;margin:0;padding:0;list-style:none}
.pop-f{padding:8px;border-top:1px solid var(--line)}
.q-res{left:0;right:auto;width:100%}
.q-res .pop-l{padding:6px}

.demo{display:flex;align-items:center;gap:10px;padding-block:7px;padding-left:24px;padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--sun-soft);color:var(--sun-ink);font-size:12.5px;line-height:1.35}
.demo .ic{width:16px;height:16px}
.demo>span{flex:1;min-width:0}
.demo .btn{color:var(--sun-ink)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.view{display:flex;flex-direction:column;gap:16px;max-width:1480px;padding-block:22px 48px;padding-left:24px;padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ——— элементы ——— */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:linear-gradient(135deg,var(--primary),var(--primary-2));border-color:transparent;color:var(--primary-ink);box-shadow:var(--shadow-1)}
.btn.pri:hover{background:var(--primary-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.icon{width:36px;padding:0}
.btn.big{width:100%;height:48px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .ic{width:16px;height:16px}
.link{padding:0;border:0;background:none;color:var(--primary);font-weight:500;text-align:left}
.link:hover{text-decoration:underline}
.inp{width:100%;height:38px;padding:0 11px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);font-size:14px}
.inp.sm{height:32px;padding:0 8px;font-size:13px}
textarea.inp{height:auto;min-height:72px;padding:9px 11px;line-height:1.45;resize:vertical}
.inp:focus{outline:2px solid var(--primary);outline-offset:-1px}
.inp:disabled{background:var(--sunken);color:var(--ink-3)}
.w-auto{width:auto}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.field.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.span2{grid-column:1/-1}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;margin:0;accent-color:var(--primary)}
.hint{margin:0;font-size:12.5px;color:var(--ink-3);max-width:80ch}
.err{margin:0;font-size:13px;color:var(--bad)}
.lock{display:flex;align-items:center;gap:8px;margin:0;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:var(--sunken);color:var(--ink-2);font-size:12px;font-weight:500;line-height:1.5;white-space:nowrap}
.pill.sm{padding:1px 7px;font-size:11px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}.pill.sun{background:var(--sun-soft);color:var(--sun-ink)}.pill.violet{background:var(--violet-soft);color:var(--violet)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;text-align:left}
button.chip:hover{border-color:var(--line-2);background:var(--sunken)}
button.chip:disabled{opacity:.5;cursor:not-allowed}
.chip b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:13px}
.fchip:hover{border-color:var(--line-2)}
.fchip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-deep);font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:999px;background:var(--sunken)}
.seg button{padding:6px 12px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button b{margin-left:5px;color:var(--ink-3);font-weight:600}
.seg.wide{display:flex}
.seg.wide button{flex:1}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.av{display:inline-grid;place-items:center;width:30px;height:30px;flex:none;border-radius:50%;background:var(--sunken);color:var(--ink-2);font-size:11.5px;font-weight:600}
.av.xs{width:20px;height:20px;font-size:9.5px}
.av .ic{width:12px;height:12px}
.who{display:inline-flex;align-items:center;gap:7px;min-width:0}

.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-1)}
.card.clip{overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:14px 16px 10px}
.card-h h3{margin:0;font-size:14.5px;font-weight:600}
.card-b{padding:0 16px 16px}
.empty{margin:0;padding:18px 16px;color:var(--ink-3);font-size:13.5px}
.sh{margin:0 0 8px;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
/* «Нет доступа к разделу» — прямой переход туда, где у человека нет права */
.deny{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:560px;margin:24px auto 0;padding:32px 24px;text-align:center}
.deny h2{margin:0;font:800 18px/1.25 var(--f-display);letter-spacing:-.015em}
.deny p{margin:0;max-width:44ch;color:var(--ink-2)}
.deny-ic{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--sunken);color:var(--ink-3)}
.deny-ic .ic{width:22px;height:22px}
.deny .btn{margin-top:6px}

/* ——— таблицы (общие для всех разделов) ——— */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);color:var(--ink-3);font-size:12px;font-weight:500;text-align:left;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl .c{text-align:center}

/* ——— уведомления ——— */
.notes{margin:0;padding:0;list-style:none}
.note{display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px;padding:11px 16px;border-top:1px solid var(--line)}
.notes>.note:first-child{border-top:0}
.note.unread{background:var(--surface-2)}
.nic{display:grid;place-items:center;width:32px;height:32px;border-radius:9px}
.nic .ic{width:17px;height:17px}
.nic.info{background:var(--info-soft);color:var(--info)}.nic.ok{background:var(--ok-soft);color:var(--ok)}.nic.pri{background:var(--primary-soft);color:var(--primary)}
.nic.sun{background:var(--sun-soft);color:var(--sun-ink)}.nic.violet{background:var(--violet-soft);color:var(--violet)}.nic.bad{background:var(--bad-soft);color:var(--bad)}
.nt p{margin:0;font-size:13.5px}
.nt small{display:block;margin-top:3px;font-size:12px;color:var(--ink-3)}
.new-b{color:var(--sun-ink);font-weight:600}
.to{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

/* ——— карточка справа и окна ——— */
.scrim{position:fixed;inset:0;z-index:40;background:var(--overlay);animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;display:flex;flex-direction:column;width:min(580px,100%);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);background:var(--surface);box-shadow:var(--shadow);animation:slide .22s ease}
.still .scrim,.still .drawer{animation:none}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.dh-t{flex:1;min-width:0}
.dh-t small{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.dh-t h2{margin:4px 0 0;font:800 18px/1.25 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.dh-t p{margin:6px 0 0;font-size:13px;color:var(--ink-3)}
.drawer-b{flex:1;display:flex;flex-direction:column;gap:22px;overflow-y:auto;padding:18px 20px 32px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;margin:0;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.st{display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:12px;background:var(--surface-2)}
.st span{font-size:11.5px;line-height:1.2;color:var(--ink-3)}
.st b{font:800 17px/1.1 var(--f-display);letter-spacing:-.01em}
.rform{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--surface-2)}
.rform .sh{margin:0}
.mv{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.mv li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.mv li:first-child{border-top:0}
.mv small{margin-left:auto;font-size:12px;color:var(--ink-3)}
.prose{max-width:62ch;margin:0;font-size:14px;line-height:1.55}
.modal-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--overlay);animation:fade .15s}

const DAY=864e5;
const T0=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const day=(n,h=10,m=0)=>{const d=new Date(T0);d.setDate(d.getDate()+n);d.setHours(h,m,0,0);return d};
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MONF=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const dd=d=>Math.round((sod(d)-T0)/DAY);
const fD=d=>{d=new Date(d);return d.getDate()+' '+MON[d.getMonth()]};
const fRel=d=>{const n=dd(d);return n===0?'сегодня':n===1?'завтра':n===-1?'вчера':fD(d)};
const fT=d=>{d=new Date(d);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const fWhen=d=>fRel(d)+', '+fT(d);
const iso=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fromIso=(s,h=12)=>{const [y,m,x]=s.split('-').map(Number);return new Date(y,m-1,x,h)};
const num=n=>Number(n).toLocaleString('ru-RU');
const rub=n=>num(Math.round(n))+' ₽';
const mln=n=>n>=1e6?(n/1e6).toLocaleString('ru-RU',{maximumFractionDigits:2})+' млн ₽':rub(n);
const pl=(n,a,b,c)=>{const x=Math.abs(n)%100,y=x%10;return x>10&&x<20?c:y>1&&y<5?b:y===1?a:c};
const days=n=>n+' '+pl(n,'день','дня','дней');

// Ядро: сохранение состояния в браузере. Чистые функции, без DOM и localStorage —
// строку для localStorage отдаёт dump(), разбирает load(); писать и читать будет запуск.

const Store = (() => {
  const KEY = 'ws-crm-v3';
  const VERSION = 3;
  // Браузер даёт сайту около 5 млн символов на всё; берём с запасом.
  const LIMIT = 4500000;
  const NO_SPACE = 'не сохранено — мало места в браузере';
  // Фото в состоянии — строки data:image/… (снимки с телефона при приёмке).
  const PHOTO = /^data:image\//;

  // Date из любого «мира» (страница, node:vm в тестах) — не через instanceof.
  const isDate = v => Object.prototype.toString.call(v) === '[object Date]';
  const isPhoto = v => typeof v === 'string' && PHOTO.test(v);

  // Копия состояния, пригодная для JSON: даты → {$date: ISO}, ui не сохраняется.
  function plain(v, top) {
    if (isDate(v)) return { $date: isNaN(v.getTime()) ? null : v.toISOString() };
    if (Array.isArray(v)) return v.map(x => plain(x, false));
    if (v && typeof v === 'object') {
      const o = {};
      for (const k of Object.keys(v)) {
        if (top && k === 'ui') continue;
        const x = v[k];
        if (x === undefined || typeof x === 'function') continue;
        o[k] = plain(x, false);
      }
      return o;
    }
    return v;
  }

  // Выкидывает фото из копии; запись, где они были, помечается. Возвращает, сколько фото выкинуто.
  function dropPhotos(node) {
    let total = 0;
    const walk = (v, owner) => {
      if (Array.isArray(v)) { v.forEach(x => walk(x, owner)); return; }
      if (!v || typeof v !== 'object') return;
      let here = 0;
      for (const k of Object.keys(v)) {
        const x = v[k];
        if (isPhoto(x)) { v[k] = null; here++; continue; }
        if (Array.isArray(x)) {
          const keep = x.filter(y => !isPhoto(y));
          here += x.length - keep.length;
          v[k] = keep;
          keep.forEach(y => walk(y, v));
          continue;
        }
        walk(x, v);
      }
      if (here) {
        const prev = v.unsaved && v.unsaved.photos || 0;
        v.unsaved = { photos: prev + here, text: NO_SPACE };
        total += here;
      }
    };
    walk(node, null);
    return total;
  }

  // Состояние → {text, droppedPhotos, fits}. Не влезает в limit — фото выкидываются
  // (droppedPhotos — сколько), их записи помечаются «не сохранено — мало места в браузере».
  // Само состояние не меняется.
  function dump(state, limit = LIMIT) {
    const copy = plain(state, true);
    let text = JSON.stringify(copy);
    let droppedPhotos = 0;
    if (text.length > limit) {
      droppedPhotos = dropPhotos(copy);
      if (droppedPhotos) text = JSON.stringify(copy);
    }
    return { text, droppedPhotos, fits: text.length <= limit };
  }

  // Строка из localStorage → состояние с живыми датами; пусто, мусор или чужая версия схемы → null
  // (тогда запуск берёт seed()).
  function load(raw) {
    if (typeof raw !== 'string' || !raw) return null;
    let st;
    try {
      st = JSON.parse(raw, (k, v) => {
        if (v && typeof v === 'object' && !Array.isArray(v)) {
          const keys = Object.keys(v);
          if (keys.length === 1 && keys[0] === '$date') return new Date(v.$date === null ? NaN : v.$date);
        }
        return v;
      });
    } catch (_) { return null; }
    if (!st || typeof st !== 'object' || Array.isArray(st) || st.v !== VERSION) return null;
    return st;
  }

  // Свободный id для новой записи списка: не совпадёт ни с одним сохранённым (общий для ядра).
  function freeId(list, prefix) {
    const used = new Set((list || []).map(x => x && x.id));
    let n = (list || []).length + 1;
    while (used.has(prefix + n)) n++;
    return prefix + n;
  }

  return { KEY, VERSION, LIMIT, NO_SPACE, load, dump, freeId };
})();

// Ядро: роли и права. Роли — данные (st.roles), проверки спрашивают право, а не название роли.
// Встроенные роли не удаляются; у директора все права, и снять их нельзя.

const Perms = (() => {
  // Права: ключ и подпись. Первые тринадцать — как в v2, дальше новые.
  const LIST = [
    ['firm', 'Видеть сводку по всей фирме'],
    ['tasksAll', 'Видеть задачи всех отделов'],
    ['tasksAssign', 'Ставить задачи другим отделам'],
    ['stock', 'Видеть остатки, резервы и поставки'],
    ['prices', 'Видеть цены и суммы'],
    ['reserve', 'Ставить и снимать резервы'],
    ['catalog', 'Добавлять товары в номенклатуру'],
    ['logistics', 'Отмечать этапы перевозки'],
    ['receive', 'Принимать товар на склад'],
    ['clients', 'Видеть клиентов и сделки'],
    ['write', 'Писать клиентам в Telegram и MAX'],
    ['auto', 'Настраивать авто-сообщения'],
    ['admin', 'Управлять сотрудниками и правами'],
    ['mail', 'Работать с почтой своих ящиков'],
    ['leads', 'Видеть и вести лиды'],
    ['dealsAll', 'Видеть сделки всех типов'],
    ['settings', 'Менять настройки фирмы'],
  ];
  const KEYS = LIST.map(p => p[0]);

  // Права по умолчанию — «Решения по реализации» спецификации.
  // Менеджер видит лиды и сделки своего типа (scope), dealsAll у него нет.
  const ENGINEER = ['tasksAssign', 'stock', 'clients', 'dealsAll'];
  const DEFAULTS = [
    { id: 'director', name: 'Директор', all: true, on: KEYS },
    { id: 'managerB2b', name: 'Менеджер B2B', scope: 'b2b', on: ['stock', 'prices', 'reserve', 'leads', 'clients', 'write', 'mail'] },
    { id: 'managerB2c', name: 'Менеджер B2C', scope: 'b2c', on: ['stock', 'prices', 'reserve', 'leads', 'clients', 'write', 'mail'] },
    { id: 'logist', name: 'Логист', on: ['stock', 'logistics', 'mail', 'tasksAssign'] },
    { id: 'warehouse', name: 'Кладовщик', on: ['stock', 'receive'] },
    // Главный инженер и инженер — одна матрица (R30).
    { id: 'chiefEngineer', name: 'Главный инженер', on: ENGINEER },
    { id: 'engineer', name: 'Инженер', on: ENGINEER },
  ];

  // Полная матрица {право: да/нет} из списка включённых прав или из готовой матрицы.
  function matrix(perms) {
    const on = Array.isArray(perms) ? perms : Object.keys(perms || {}).filter(k => perms[k] === true);
    const m = {};
    for (const k of KEYS) m[k] = on.includes(k);
    return m;
  }

  // Встроенные роли — новая копия на каждый вызов (для seed()).
  function defaultRoles() {
    return DEFAULTS.map(r => {
      const role = { id: r.id, name: r.name, builtin: true, perms: matrix(r.on) };
      if (r.all) role.all = true;
      if (r.scope) role.scope = r.scope;
      return role;
    });
  }

  const person = (st, personId) => (st.people || []).find(p => p.id === personId) || null;

  function roleOf(st, personId) {
    const p = person(st, personId);
    if (!p) return null;
    return (st.roles || []).find(r => r.id === p.role) || null;
  }

  // Может ли человек это. Неизвестное право — нет ни у кого (опечатка не открывает доступ).
  function can(st, personId, perm) {
    if (!KEYS.includes(perm)) return false;
    const role = roleOf(st, personId);
    if (!role) return false;
    if (role.all) return true;
    return !!(role.perms && role.perms[perm] === true);
  }

  // Своя роль директора: имя и права. Пустое или занятое имя → null.
  function addRole(st, name, perms) {
    const n = String(name || '').trim();
    if (!n) return null;
    st.roles = st.roles || [];
    if (st.roles.some(r => r.name.trim().toLowerCase() === n.toLowerCase())) return null;
    const role = { id: Store.freeId(st.roles, 'role'), name: n, builtin: false, perms: matrix(perms) };
    st.roles.push(role);
    return role;
  }

  const staff = n => n % 10 === 1 && n % 100 !== 11 ? 'сотрудник'
    : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'сотрудника' : 'сотрудников';

  // Удалить роль: встроенную нельзя, роль с людьми нельзя, пока их не переназначат.
  function removeRole(st, roleId) {
    const roles = st.roles || [];
    const role = roles.find(r => r.id === roleId);
    if (!role) return { ok: false, reason: 'Роль не найдена' };
    if (role.builtin) return { ok: false, reason: `Роль «${role.name}» встроенная — её нельзя удалить` };
    const n = (st.people || []).filter(p => p.role === roleId).length;
    if (n) return { ok: false, reason: `На роли «${role.name}» ${n} ${staff(n)} — сначала назначьте им другую роль` };
    st.roles = roles.filter(r => r.id !== roleId);
    return { ok: true, reason: '' };
  }

  return { LIST, defaultRoles, roleOf, can, addRole, removeRole };
})();

// Ядро: воронки всех видов — доски задач, сделки B2B и B2C, лиды, поставки.
// Одна модель «воронка с этапами»; запись хранит id этапа, не номер, поэтому
// переименование, вставка и удаление этапа данные не ломают.
// «Сделано/закрыто» — флаг final у этапа, «прибыло, ждёт приёмки» — флаг arrived.

const Pipes = (() => {
  const KINDS = ['tasks', 'deals', 'leads', 'ships'];
  // Где лежат записи вида и в каком поле id воронки.
  const STORE = {
    tasks: { list: 'tasks', field: 'boardId' },
    deals: { list: 'deals', field: 'pipeId' },
    leads: { list: 'leads', field: 'pipeId' },
    ships: { list: 'shipments', field: 'pipeId' },
  };

  const S_ = (id, name, flag) => (flag ? { id, name, flag } : { id, name });
  const DEAL_STAGES = () => [
    S_('request', 'Заявка'), S_('calc', 'Расчёт'), S_('offer', 'КП'), S_('contract', 'Договор'),
    S_('payment', 'Оплата'), S_('delivery', 'Поставка'), S_('install', 'Монтаж'), S_('done', 'Сдана', 'final'),
  ];
  // Воронки по умолчанию — ровно как в interfaces.md. Новая копия на каждый вызов (для seed()).
  function defaults() {
    return [
      { id: 'tasksCommon', kind: 'tasks', name: 'Общие', stages: [
        S_('new', 'Новые'), S_('work', 'В работе'), S_('review', 'На проверке'), S_('done', 'Готово', 'final'),
      ] },
      { id: 'dealsB2b', kind: 'deals', name: 'Сделки B2B', scope: 'b2b', stages: DEAL_STAGES() },
      { id: 'dealsB2c', kind: 'deals', name: 'Сделки B2C', scope: 'b2c', stages: DEAL_STAGES() },
      { id: 'leads', kind: 'leads', name: 'Лиды', stages: [
        S_('new', 'Новый'), S_('contacted', 'Связались'), S_('qualified', 'Квалифицирован'),
        S_('deal', 'Сделка создана', 'final'), S_('lost', 'Отказ', 'final'),
      ] },
      { id: 'ships', kind: 'ships', name: 'Поставки', stages: [
        S_('ordered', 'Заказано'), S_('shipped', 'Отгружено поставщиком'), S_('toBorder', 'В пути до границы'),
        S_('customs', 'Таможня'), S_('transship', 'Перевалка в Чите'), S_('toStock', 'В пути до склада'),
        S_('arrived', 'Прибыло в город', 'arrived'), S_('inStock', 'На складе', 'final'),
      ] },
    ];
  }

  const pipes = st => st.pipelines || [];
  const pipe = (st, pipeId) => pipes(st).find(p => p.id === pipeId) || null;
  const clean = name => String(name || '').trim();

  // Воронки вида; со scope — этого типа и общие (без scope).
  function of(st, kind, scope) {
    return pipes(st).filter(p => p.kind === kind && (!scope || !p.scope || p.scope === scope));
  }

  function stage(st, pipeId, stageId) {
    const p = pipe(st, pipeId);
    return (p && p.stages.find(s => s.id === stageId)) || null;
  }

  function isFinal(st, pipeId, stageId) {
    const s = stage(st, pipeId, stageId);
    return !!s && s.flag === 'final';
  }

  // Записи воронки (задачи доски, сделки, лиды, поставки).
  function items(st, pipeId) {
    const p = pipe(st, pipeId);
    if (!p) return [];
    const { list, field } = STORE[p.kind];
    return (st[list] || []).filter(x => x[field] === pipeId);
  }

  function rename(st, pipeId, name) {
    const p = pipe(st, pipeId), n = clean(name);
    if (!p) return { ok: false, reason: 'Воронка не найдена' };
    if (!n) return { ok: false, reason: 'Название не может быть пустым' };
    p.name = n;
    return { ok: true, reason: '' };
  }

  function renameStage(st, pipeId, stageId, name) {
    const s = stage(st, pipeId, stageId), n = clean(name);
    if (!s) return { ok: false, reason: 'Этап не найден' };
    if (!n) return { ok: false, reason: 'Название не может быть пустым' };
    s.name = n;
    return { ok: true, reason: '' };
  }

  // Новый этап после afterId, без него — в конец. Возвращает этап или null.
  function addStage(st, pipeId, name, afterId) {
    const p = pipe(st, pipeId), n = clean(name);
    if (!p || !n) return null;
    const s = { id: Store.freeId(p.stages, 's'), name: n };
    const i = afterId ? p.stages.findIndex(x => x.id === afterId) : -1;
    if (i < 0) p.stages.push(s); else p.stages.splice(i + 1, 0, s);
    return s;
  }

  const FLAG = { final: 'завершающий', arrived: '«прибыло, ждёт приёмки»' };

  // Удалить этап: его записи переезжают на этап moveToId той же воронки, ни одна не теряется.
  function removeStage(st, pipeId, stageId, moveToId) {
    const p = pipe(st, pipeId);
    if (!p) return { ok: false, moved: 0, reason: 'Воронка не найдена' };
    const s = p.stages.find(x => x.id === stageId);
    if (!s) return { ok: false, moved: 0, reason: 'Этап не найден' };
    if (p.stages.length < 2) return { ok: false, moved: 0, reason: 'Последний этап воронки удалить нельзя' };
    if (s.flag && !p.stages.some(x => x !== s && x.flag === s.flag)) {
      return { ok: false, moved: 0, reason: `Этап «${s.name}» — единственный ${FLAG[s.flag] || s.flag} в воронке «${p.name}»` };
    }
    const here = items(st, pipeId).filter(x => x.stageId === stageId);
    const to = p.stages.find(x => x.id === moveToId && x.id !== stageId);
    if (here.length && !to) return { ok: false, moved: 0, reason: `На этапе «${s.name}» ${here.length} зап. — выберите, куда их перенести` };
    here.forEach(x => { x.stageId = to.id; });
    p.stages = p.stages.filter(x => x !== s);
    return { ok: true, moved: here.length, reason: '' };
  }

  // Новая воронка вида: этапы — копия воронки по умолчанию этого вида.
  function addPipe(st, kind, name, scope) {
    const n = clean(name);
    if (!KINDS.includes(kind) || !n) return null;
    const base = defaults().find(p => p.kind === kind);
    st.pipelines = pipes(st);
    const p = { id: Store.freeId(st.pipelines, kind), kind, name: n, stages: base.stages };
    if (scope) p.scope = scope;
    st.pipelines.push(p);
    return p;
  }

  // Этап в другой воронке для переезжающей записи: тот же id → то же название → тот же флаг → первый.
  function matchStage(from, to, stageId) {
    const s = from.stages.find(x => x.id === stageId);
    return to.stages.find(x => x.id === stageId)
      || (s && to.stages.find(x => x.name === s.name))
      || (s && s.flag && to.stages.find(x => x.flag === s.flag))
      || to.stages[0];
  }

  // Удалить воронку: последнюю своего вида нельзя; записи переезжают в moveToPipeId того же вида.
  function removePipe(st, pipeId, moveToPipeId) {
    const p = pipe(st, pipeId);
    if (!p) return { ok: false, moved: 0, reason: 'Воронка не найдена' };
    if (of(st, p.kind).length < 2) return { ok: false, moved: 0, reason: `«${p.name}» — последняя воронка этого вида, её нельзя удалить` };
    const here = items(st, pipeId);
    const to = moveToPipeId !== pipeId ? pipe(st, moveToPipeId) : null;
    if (here.length && (!to || to.kind !== p.kind)) {
      return { ok: false, moved: 0, reason: `В воронке «${p.name}» ${here.length} зап. — выберите воронку того же вида, куда их перенести` };
    }
    const { field } = STORE[p.kind];
    here.forEach(x => { x.stageId = matchStage(p, to, x.stageId).id; x[field] = to.id; });
    st.pipelines = pipes(st).filter(x => x !== p);
    return { ok: true, moved: here.length, reason: '' };
  }

  return { KINDS, defaults, of, stage, isFinal, items, rename, renameStage, addStage, removeStage, addPipe, removePipe };
})();

// Ядро: уведомления. Адресаты — люди (to:[personId]), прочитанность — у каждого своя (read:[personId]).
// Кому что приходит — только карта RECIPIENTS; человек может выключить вид у себя:
// prefs.notify[personId][kind] === false — этот вид ему не приходит.

const Notify = (() => {
  // Событие → кому: 'all' — все сотрудники, иначе id встроенных ролей (их нельзя удалить, id не меняются).
  // Адресатов конкретного события (исполнитель задачи, люди отдела, менеджер сделки или лида)
  // добавляет вызывающий через extraPersons.
  const RECIPIENTS = {
    ship: 'all',                                               // поставки: этап, точка, срок — все сотрудники (R10)
    arrive: ['director', 'managerB2b', 'managerB2c'],          // приёмка «товар на складе» — менеджеры и директор (R15)
    reserve: ['director', 'managerB2b', 'managerB2c', 'warehouse'], // резервы — как в v2
    warn: ['director', 'logist', 'managerB2b', 'managerB2c'],  // приёмка с замечаниями — как в v2
    task: [],                                                  // задачи — исполнитель, отдел и автор (extraPersons)
    msg: ['director'],                                         // сообщения клиентам — плюс менеджер сделки (extraPersons)
    lead: ['director'],                                        // новый лид — плюс менеджер, кому он ушёл (extraPersons)
  };

  const wants = (st, personId, kind) => {
    const p = st.prefs && st.prefs.notify && st.prefs.notify[personId];
    return !(p && p[kind] === false);
  };

  // Кому придёт уведомление этого вида: по карте, плюс extraPersons, без тех, кто выключил вид.
  function recipients(st, kind, extraPersons) {
    const rule = RECIPIENTS[kind];
    if (rule === undefined) throw new Error(`Неизвестный вид уведомления: ${kind}`);
    const people = st.people || [];
    const byRule = rule === 'all' ? people : people.filter(p => rule.includes(p.role));
    const ids = [...byRule.map(p => p.id), ...(extraPersons || [])];
    const known = new Set(people.map(p => p.id));
    return [...new Set(ids)].filter(id => known.has(id) && wants(st, id, kind));
  }

  // Новое уведомление — в начало списка. Автор, если он среди адресатов, своё уже прочитал.
  function push(st, kind, by, text, now, extraPersons) {
    const to = recipients(st, kind, extraPersons);
    st.notes = st.notes || [];
    const note = { id: Store.freeId(st.notes, 'n'), kind, by: by || null, at: now, text, to, read: by && to.includes(by) ? [by] : [] };
    st.notes.unshift(note);
    return note;
  }

  // Непрочитанные этим человеком.
  function unread(st, personId) {
    return (st.notes || []).filter(n => n.to.includes(personId) && !n.read.includes(personId));
  }

  // Отметить прочитанным для этого человека: одно уведомление или все его. Возвращает, сколько отмечено.
  function markRead(st, personId, noteId) {
    const list = unread(st, personId).filter(n => !noteId || n.id === noteId);
    list.forEach(n => n.read.push(personId));
    return list.length;
  }

  return { RECIPIENTS, recipients, push, unread, markRead };
})();

// Оболочка: состояние S и его сохранение, тема, разделы NAV, боковая панель, «Кто я», уведомления, окна,
// карточка справа, поиск, переходы, render(), действия A, формы FORMS, обработчики событий.
// Права — Perms.can(S, S.me, …), этапы — по id и флагам Pipes, уведомления — только Notify.push.

// ——— состояние и сохранение в браузере ———
// S поднимает запуск (90-boot.js): startState(). До запуска — null.
let S=null;
// Чистое демо-состояние: seed() + то, что не сохраняется (ui).
const freshState=()=>Object.assign(seed(),{ui:defaultUi()});
// Сохранённое в браузере состояние или null (нет, битое, чужая версия схемы).
function savedState(){
  let raw=null;
  try{raw=localStorage.getItem(Store.KEY)}catch(_){return null}
  const st=Store.load(raw);
  if(!st) return null;
  // чего нет в сохранённом (раздел добавлен позже) — берём из демо
  const base=seed();
  for(const k of Object.keys(base)) if(!(k in st)) st[k]=base[k];
  if(!st.people.some(p=>p.id===st.me)) st.me=st.people[0]?.id||'';
  st.ui=defaultUi();
  return st;
}
// Раздел из адреса страницы (#team) или ''.
function hashView(){try{return /^#[a-z]+$/.test(location.hash)?location.hash.slice(1):''}catch(_){return ''}}
function startState(){
  const st=savedState()||freshState();
  const v=hashView();if(v) st.view=v;
  return st;
}
// Записать S в браузер. Не влезает — без фото и короткое сообщение; совсем не влезает — сообщение.
let _photoWarn=0,_saveT=0;
function save(){
  if(!S) return null;
  let r=Store.dump(S),ok=true;
  try{localStorage.setItem(Store.KEY,r.text)}catch(_){
    // браузер дал меньше места, чем рассчитывает Store, — сохраняем без фото
    r=Store.dump(S,0);
    try{localStorage.setItem(Store.KEY,r.text)}catch(_){ok=false}
  }
  if(!ok) toast('Изменения не сохранены — мало места в браузере','warn');
  else if(r.droppedPhotos&&r.droppedPhotos!==_photoWarn) toast('Фото не сохранены — мало места в браузере','warn');
  _photoWarn=r.droppedPhotos;
  return {ok,droppedPhotos:r.droppedPhotos,fits:r.fits&&ok};
}
// Для ввода с клавиатуры — не на каждую букву
const saveSoon=()=>{clearTimeout(_saveT);_saveT=setTimeout(save,400)};
// Сброс к демо: человек, раздел и тема остаются, данные — как в seed()
function resetData(){
  const m=S?.me,v=S?.view,th=S?.prefs?.theme;
  S=freshState();
  if(S.people.some(p=>p.id===m)) S.me=m;
  if(v) S.view=v;
  if(th) S.prefs.theme=th;
  closeModal();render();
  toast('Данные прототипа сброшены к исходным');
}

const THEMES=[['light','Светлая','sun'],['dark','Тёмная','moon'],['auto','Как в системе','monitor']];
Object.assign(IC,{

});
const themePref=()=>THEMES.some(t=>t[0]===S?.prefs?.theme)?S.prefs.theme:'auto';
const systemDark=()=>{try{return typeof matchMedia==='function'&&matchMedia('(prefers-color-scheme: dark)').matches}catch(_){return false}};

];
// Разделы, открытые текущему человеку: только они попадают в меню
const navItems=()=>NAV.filter(n=>n.ok());
const GROUPS=['Работа','Товар','Продажи','Управление','Настройки'];

function renderSide(){
  const vis=navItems(),m=me();

  for(const g of GROUPS){

    if(!items.length) continue;
    h+=`<div class="nav-g"><h4>${g}</h4>${items.map(n=>{const b=n.badge?n.badge():0;return `<button class="nav-i ${S.view===n.id?'on':''}" data-act="go" data-view="${n.id}">${ic(n.icon)}<span>${n.label}</span>${b?`<span class="cnt ${n.hot?'hot':''}">${b}</span>`:''}</button>`}).join('')}</div>`;
  }
  h+=`<div class="me">${av(m)}<div><b>${esc(m.name)}</b><small>${esc(roleName(m))}</small></div></div>`;
  byId('side').innerHTML=h;
}

// ——— карточка справа ———
function openDrawer(type,id){S.ui.drawer={type,id};renderDrawer()}

function renderDrawer(){
  const root=byId('drawer-root'),d=S.ui.drawer;
  if(!d){root.innerHTML='';root.dataset.k='';return}
  let c=null;
  if(d.type==='product'&&can('stock')){const p=product(d.id);if(p) c=dProduct(p)}
  else if(d.type==='deal'&&can('clients')){const x=deal(d.id);if(x) c=dDeal(x)}

  if(!c){S.ui.drawer=null;root.innerHTML='';root.dataset.k='';return}
  const k=d.type+':'+d.id,same=root.dataset.k===k,sc=same?(root.querySelector('.drawer-b')?.scrollTop||0):0;
  root.classList.toggle('still',same);

// ——— всплывающие подсказки ———
function toast(msg,kind){
  const el=document.createElement('div');el.className='toast';
  el.innerHTML=`${ic(kind==='warn'?'alert':'check')}<span>${esc(msg)}</span>`;
  byId('toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320)},4800);
}

// ——— поиск ———
function searchRes(q){
  q=q.trim().toLowerCase();if(q.length<2) return [];
  const r=[],has=s=>s.toLowerCase().includes(q);
  if(can('stock')) S.products.forEach(p=>{if(has(p.name+' '+p.sku)) r.push({type:'Товар',label:p.name,sub:`${p.sku} · свободно ${num(freeNow(p))} ${p.unit}`,act:`data-act="open-product" data-sku="${esc(p.sku)}"`})});
  if(can('clients')) S.deals.forEach(d=>{if(has(d.client+' '+d.id+' '+d.object)) r.push({type:'Сделка',label:d.client,sub:`${d.id} · ${d.object}`,act:`data-act="open-deal" data-id="${d.id}"`})});
  if(can('stock')||can('logistics')) S.shipments.forEach(s=>{if(has(s.id+' '+s.from+' '+s.to+' '+s.doc)) r.push({type:'Перевозка',label:`${s.id} · ${s.from}`,sub:`${stageName(s)} · ${fD(s.eta)}`,act:`data-act="go" data-view="logistics" data-tab="${isDone(s)?'done':s.dir}"`})});
  S.tasks.filter(taskVisible).forEach(t=>{if(has(t.title)) r.push({type:'Задача',label:t.title,sub:`${targetName(t)} · ${fRel(t.due)}`,act:`data-act="open-task" data-id="${t.id}"`})});
  return r.slice(0,9);
}

// ——— переходы ———
function go(v,tab){
  const n=NAV.find(x=>x.id===v);
  if(!n||!n.ok()){toast('У вас нет доступа к этому разделу','warn');return}

}
function setNav(open){S.ui.navOpen=open;byId('app').classList.toggle('nav-open',open)}
// «Кто я»: смотреть CRM глазами этого человека — его права, задачи, уведомления
function setMe(pid){
  if(!person(pid)) return;
  S.me=pid;S.ui.drawer=null;S.ui.taskF='all';closeModal();
  const vis=navItems(),hidden=NAV.filter(n=>!vis.includes(n)).map(n=>n.label),m=me();
  if(!vis.some(n=>n.id===S.view)) S.view='home';

function setTaskStatus(id,stageId){
  const t=S.tasks.find(x=>x.id===id);if(!t||t.stageId===stageId) return;

// ——— главный вывод ———
const VIEWS={home:vHome,tasks:vTasks,notifications:vNotes,stock:vStock,logistics:vLogistics,receiving:vReceiving,clients:vClients,messages:vMessages,team:vTeam};
// Прямой переход (адрес, сохранённый раздел) туда, где у человека нет права: в меню раздела нет, на экране — это.
const vNoAccess=n=>`<section class="card deny"><span class="deny-ic">${ic('lock')}</span><h2>Нет доступа к разделу</h2><p>«${esc(n.label)}» закрыт для роли «${esc(roleName(me()))}». Права ролей меняют в разделе «Сотрудники и права».</p><button type="button" class="btn pri" data-act="go" data-view="home">${ic('home')}На главный экран</button></section>`;
function render(){
  applyTheme();

  if(!NAV.some(n=>n.id===S.view&&VIEWS[n.id])) S.view='home';

  // открыл раздел «Уведомления» — свои прочитаны (подсвечены один раз, при этой отрисовке)
  if(ok&&S.view==='notifications') Notify.markRead(S,S.me);

  byId('ttl').textContent=n.label;
  byId('role').innerHTML=whoOptions();

// ——— формы ———
const FORMS={
  reset:()=>resetData(),
  reserve:f=>{
    const p=product(f.dataset.sku),did=byId('rs-deal').value,qty=parseInt(byId('rs-qty').value,10),src=byId('rs-src').value,until=byId('rs-until').value;
    if(!did) return showErr('rs-err','Нет открытых сделок, под которые можно поставить резерв.');
    if(!qty||qty<1) return showErr('rs-err','Укажите количество — целое число больше нуля.');
    const avail=src==='stock'?freeNow(p):shipFree(src,p.sku);
    if(qty>avail) return showErr('rs-err',`Свободно только ${num(Math.max(0,avail))} ${p.unit}. Уменьшите количество или выберите другой источник.`);
    if(!until||dd(fromIso(until))<0) return showErr('rs-err','Дата окончания резерва не может быть в прошлом.');
    const d=deal(did),m=me(),u=fromIso(until),now=new Date();
    S.reserves.push({id:Store.freeId(S.reserves,'r'),sku:p.sku,deal:did,qty,src,until:u});
    S.moves.unshift({at:now,sku:p.sku,kind:'Резерв',qty,doc:did,by:m.id});
    Notify.push(S,'reserve',m.id,`Резерв: ${low(p.name)} — ${num(qty)} ${p.unit} ${src==='stock'?'со склада':'из поставки '+src} для ${did} (${d.client}) до ${fD(u)}.`,now);
    render();toast(`Резерв поставлен: ${num(qty)} ${p.unit} для ${did}. Склад и директор получили уведомление.`);
  },
  stage:f=>{
    const s=ship(f.dataset.id),m=me(),now=new Date();
    const stg=Pipes.stage(S,s.pipeId,byId('st-stage').value);
    if(!stg||(s.dir==='in'&&stg.flag==='final')){closeModal();return}
    const place=byId('st-place').value.trim()||s.last.place,eta=byId('st-eta').value,note=byId('st-note').value.trim(),notify=byId('st-notify').checked;
    const old=s.eta,ne=eta?fromIso(eta,s.eta.getHours()||12):s.eta,moved=dd(ne)!==dd(old),wasOut=s.dir==='out'&&leftStart(s);
    s.stageId=stg.id;s.last={place,at:now,by:m.id};s.eta=ne;
    let sent=0;
    if(notify) sent=Notify.push(S,'ship',m.id,`${s.id}: ${stg.name.toLowerCase()} — ${place}. ${s.dir==='in'?'На складе ожидается':'Доставка'} ${fD(ne)}${moved?` (было ${fD(old)})`:''}.${note?' '+note:''}`,now).to.filter(id=>id!==m.id).length;
    if(s.dir==='out'&&!wasOut&&leftStart(s)&&rule('shipped').on&&s.deal){const d=deal(s.deal);if(d&&d.channel!=='phone') S.msgs.push({id:Store.freeId(S.msgs,'m'),at:now,deal:d.id,channel:d.channel,auto:true,text:`${d.contact}, здравствуйте! Ваш заказ отгружен: ${s.doc}. Привезём ${fD(ne)}. Ваш менеджер — ${person(d.managerId)?.name||''}.`})}
    closeModal();render();toast(notify?`Отмечено. Уведомление получили ${sent} ${pl(sent,'сотрудник','сотрудника','сотрудников')}.`:'Отмечено без уведомления.');
  },
  task:()=>{
    const title=byId('t-title').value.trim();
    if(!title){showErr('t-err','Напишите, что нужно сделать.');byId('t-title').focus();return}
    const [tt,id]=byId('t-to').value.split(':'),due=byId('t-due').value,m=me(),now=new Date(),board=taskBoard();
    const t={id:Store.freeId(S.tasks,'t'),title,desc:byId('t-desc').value.trim(),to:{t:tt,id},from:m.id,due:due?fromIso(due,18):day(2,18),boardId:board.id,stageId:startStage(board.id).id,prio:byId('t-prio').value,deal:byId('t-deal')?.value||'',at:now};
    S.tasks.push(t);
    Notify.push(S,'task',m.id,`Новая задача: «${title}», срок ${fD(t.due)}.${t.deal?' Сделка '+t.deal+'.':''} От: ${m.name}.`,now,targetPeople(t.to));
    closeModal();render();toast(`Задача поставлена. ${targetName(t)} — уведомление отправлено.`);
  },
  ship:f=>{
    const from=byId('ns-from').value.trim(),m=me(),now=new Date(),items=[],pipe=shipPipe('in');
    f.querySelectorAll('.irow').forEach(r=>{const sku=r.querySelector('select').value,q=parseInt(r.querySelector('input').value,10)||0;if(q<1) return;const e=items.find(i=>i.sku===sku);if(e) e.qty+=q;else items.push({sku,qty:q})});
    if(!from||!items.length) return showErr('ns-err','Укажите, откуда едет груз, и хотя бы одну позицию с количеством.');
    const id='П-'+(Math.max(0,...S.shipments.filter(s=>s.dir==='in').map(s=>parseInt(s.id.replace(/\D/g,''),10)||0))+1);
    const eta=byId('ns-eta').value?fromIso(byId('ns-eta').value):day(7,12);
    const stageId=Pipes.stage(S,pipe.id,byId('ns-stage').value)?.id||startStage(pipe.id).id;
    S.shipments.push({id,dir:'in',from,to:'Наш склад',carrier:byId('ns-car').value,doc:byId('ns-doc').value.trim()||'нет данных: номер накладной',pipeId:pipe.id,stageId,eta,last:{place:from,at:now,by:m.id},items});
    Notify.push(S,'ship',m.id,`Новая поставка ${id} из «${from}»: ${items.map(i=>`${low(product(i.sku).name)} ${num(i.qty)} ${product(i.sku).unit}`).join(', ')}. На складе ожидается ${fD(eta)}.`,now);
    closeModal();S.ui.logTab='in';render();toast(`Поставка ${id} создана. Менеджеры уже видят её в остатках как «едет к нам».`);
  },
  product:()=>{
    const sku=byId('np-sku').value.trim().toUpperCase(),name=byId('np-name').value.trim(),pr=byId('np-price'),m=me();
    if(!sku||!name) return showErr('np-err','Нужны артикул и наименование.');
    if(product(sku)) return showErr('np-err',`Артикул ${sku} уже есть в номенклатуре.`);
    const price=pr&&pr.value!==''?Math.max(0,Number(pr.value)):null;
    S.products.push({sku,name,cat:byId('np-cat').value,unit:byId('np-unit').value,price,stock:0});
    Notify.push(S,'arrive',m.id,`В номенклатуру добавлен товар: ${name} (${sku}).`,new Date());
    closeModal();S.ui.cat='Все';S.ui.sq='';render();toast(`Товар ${sku} добавлен. Остаток 0 — появится после первой приёмки.`);
  },
  msg:f=>{
    const d=deal(f.dataset.id),ta=byId('msg-text'),txt=ta.value.trim();
    if(!txt){ta.focus();return}
    S.msgs.push({id:Store.freeId(S.msgs,'m'),at:new Date(),deal:d.id,channel:d.channel,by:me().id,text:txt});
    render();toast(`Сообщение записано в переписку. В прототипе в ${CH[d.channel]} оно не уходит.`);
  }
};

function kpiHtml(){

    tile('Поставок в пути',inT.length,late.length?`${late.length} ${pl(late.length,'задерживается','задерживаются','задерживаются')}`:'все по графику',late.length?'warn':'ok','logistics'),
    tile('Позиций в резерве',S.reserves.length,`по ${rd.size} ${pl(rd.size,'сделке','сделкам','сделкам')}`,'','stock'),

function weekHtml(){
  const act=S.shipments.filter(s=>!isDone(s)),late=act.filter(isLate);
  const chip=s=>`<button class="wchip ${s.dir} ${isLate(s)?'late':''}" data-act="go" data-view="logistics" data-tab="${s.dir}"><b class="mono">${s.id}</b><span>${s.dir==='in'?'приход':'отгрузка'} · ${esc(shortItems(s))}</span></button>`;
  let cols='';
  if(late.length) cols+=`<div class="wd late"><div class="wd-h">Опаздывают<b>${late.length} ${pl(late.length,'поставка','поставки','поставок')}</b></div>${late.map(chip).join('')}</div>`;
  for(let i=0;i<7;i++){
    const d=day(i),list=act.filter(s=>!isLate(s)&&dd(s.eta)===i);
    cols+=`<div class="wd ${i===0?'today':''}"><div class="wd-h">${i===0?'Сегодня':i===1?'Завтра':WDF[d.getDay()]}<b>${d.getDate()} ${MON[d.getMonth()]}</b></div>${list.map(chip).join('')}</div>`;

}
function attention(){
  const a=[];
  S.tasks.filter(t=>taskOverdue(t)&&taskVisible(t)).forEach(t=>a.push({lvl:'bad',icon:'tasks',text:`Просрочена задача «${t.title}»`,sub:`${targetName(t)} · срок был ${fD(t.due)}`,act:`data-act="open-task" data-id="${t.id}"`}));
  if(can('stock')){
    S.shipments.filter(isLate).forEach(s=>a.push({lvl:'warn',icon:'truck',text:`${s.id} задерживается на ${days(-dd(s.eta))}`,sub:`Последняя отметка: ${s.last.place}`,act:'data-act="go" data-view="logistics"'}));
    S.products.forEach(p=>{
      const fa=freeAfter(p);
      if(fa<0) a.push({lvl:'bad',icon:'box',text:`${p.name}: под резервы не хватает ${num(-fa)} ${p.unit}`,sub:'Даже с учётом всех поставок в пути',act:`data-act="open-product" data-sku="${p.sku}"`});
      else if(p.stock>0&&freeNow(p)<=0&&!incomingQty(p.sku)) a.push({lvl:'warn',icon:'box',text:`${p.name}: свободный остаток закончился`,sub:'Всё, что на складе, в резерве. Поставок нет',act:`data-act="open-product" data-sku="${p.sku}"`});
    });
    S.reserves.filter(r=>{const n=dd(r.until);return n>=0&&n<=2}).forEach(r=>{const p=product(r.sku),d=deal(r.deal);a.push({lvl:'info',icon:'clock',text:`Резерв истекает ${fRel(r.until)}: ${p.name} — ${num(r.qty)} ${p.unit}`,sub:`${r.deal} · ${d?.client||''}`,act:`data-act="open-product" data-sku="${p.sku}"`})});
  }
  return a;
}

  const a=attention();
  return `<section class="card"><div class="card-h"><h3>Требует внимания</h3>${a.length?`<span class="pill bad">${a.length}</span>`:''}</div>${a.length?`<ul class="list">${a.map(x=>`<li><button class="li ${x.lvl}" ${x.act}><span class="li-ic">${ic(x.icon)}</span><span class="li-t">${esc(x.text)}<small>${esc(x.sub)}</small></span></button></li>`).join('')}</ul>`:'<p class="empty">Всё спокойно: просрочек, задержек и нехватки товара нет.</p>'}</section>`;
}

  const m=me();

function eventsHtml(){

function vStock(){
  return `<div class="bar"><div class="search-in">${ic('search')}<input id="sq" class="inp" type="search" placeholder="Название или артикул" value="${esc(S.ui.sq)}" data-on="sq" aria-label="Поиск товара"></div>

function sbar(p,big){
  const fn=Math.max(0,freeNow(p)),rs=Math.min(p.stock,resStock(p.sku)),iq=incomingQty(p.sku),tot=Math.max(1,fn+rs+iq),w=x=>(x/tot*100).toFixed(1)+'%';
  return `<div class="sbar ${big?'big':''}" title="Свободно ${num(fn)}, в резерве ${num(rs)}, в пути ${num(iq)}"><i class="f" style="width:${w(fn)}"></i><i class="r" style="width:${w(rs)}"></i><i class="w" style="width:${w(iq)}"></i></div>`;
}
const priceTxt=p=>p.price==null?'<span class="muted">нет данных</span>':rub(p.price);
function stockTable(){
  const q=S.ui.sq.trim().toLowerCase();
  let list=S.products.filter(p=>(S.ui.cat==='Все'||p.cat===S.ui.cat)&&(!q||(p.name+' '+p.sku).toLowerCase().includes(q)));
  if(S.ui.deficit) list=list.filter(p=>freeAfter(p)<0||freeNow(p)<=0);
  if(!list.length) return '<p class="empty">Ничего не нашлось. Проверьте фильтр или строку поиска.</p>';
  const pr=can('prices');
  return `<div class="xs"><table class="tbl"><thead><tr><th>Товар</th><th class="num">На складе</th><th class="num">В резерве</th><th class="num">Свободно</th><th>Едет к нам</th><th class="num">Будет свободно</th>${pr?'<th class="num">Цена</th>':''}<th>Картина</th></tr></thead><tbody>${list.map(p=>{
    const ra=resAll(p.sku),rsh=ra-resStock(p.sku),fn=freeNow(p),inc=incomingOf(p.sku),iq=incomingQty(p.sku),fa=freeAfter(p);

function srcPill(r){

}

// Раздел «Поставки и перевозки»
// Перенесено из прототипа v2; этапы — воронка поставки (Pipes), «закрыта» — флаг final, «ждёт приёмки» — awaitsReceipt.

// ——— поставки и перевозки ———
function vLogistics(){
  const byEta=(a,b)=>a.eta-b.eta;
  const ins=S.shipments.filter(s=>s.dir==='in'&&!isDone(s)).sort(byEta),outs=S.shipments.filter(s=>s.dir==='out'&&!isDone(s)).sort(byEta);
  const done=S.shipments.filter(isDone).sort((a,b)=>b.last.at-a.last.at);
  const tab=S.ui.logTab,list=tab==='in'?ins:tab==='out'?outs:done;
  let h=`<div class="bar"><div class="seg">${[['in','Едут к нам',ins.length],['out','Отгрузки клиентам',outs.length],['done','Завершённые',done.length]].map(([k,l,c])=>`<button class="${tab===k?'on':''}" data-act="log-tab" data-tab="${k}">${l}<b>${c}</b></button>`).join('')}</div><span class="grow"></span>${can('logistics')?`<button class="btn pri" data-act="new-ship">${ic('plus')}Новая поставка</button>`:''}</div>`;
  if(!can('logistics')) h+=`<p class="hint">Этапы перевозки отмечает логист. Каждая отметка приходит вам уведомлением.</p>`;
  h+=list.length?`<div class="ships">${list.map(shipCard).join('')}</div>`:'<section class="card"><p class="empty">Здесь пока пусто.</p></section>';
  return h;
}
function shipCard(s){
  const stg=stagesFor(s),pos=stagePos(s),done=isDone(s),late=isLate(s),n=dd(s.eta),nm=esc(stageName(s));
  const pill=done?`<span class="pill ok">${nm}</span>`:late?'<span class="pill bad">Задерживается</span>':awaitsReceipt(s)?`<span class="pill sun">${nm}</span>`:`<span class="pill info">${nm}</span>`;
  const when=done?s.last.at:s.eta;
  const etaTxt=done?(s.received?'принято '+fT(s.received.at):'доставлено '+fT(s.last.at)):n>0?'через '+days(n):n===0?'сегодня'+(s.eta.getHours()?', к '+fT(s.eta):''):'опаздывает на '+days(-n);
  const waits=s.dir==='in'?[...byDeal(S.reserves.filter(r=>r.src===s.id)).keys()]:(s.deal?[s.deal]:[]);
  const items=s.items.map(it=>{const p=product(it.sku);const t=`${esc(p.name)} <b>× ${num(it.got??it.qty)} ${p.unit}</b>`;return can('stock')?`<button class="chip" data-act="open-product" data-sku="${it.sku}">${t}</button>`:`<span class="chip">${t}</span>`}).join('');
  let w='';
  if(waits.length) w=`<div class="waits">${ic('users')}<span>${s.dir==='in'?'Ждут этот товар':'Для сделки'}: ${can('clients')?waits.map(id=>`<button class="link" data-act="open-deal" data-id="${id}">${id} · ${esc(deal(id)?.client||'')}</button>`).join(', '):waits.length+' '+pl(waits.length,'сделка','сделки','сделок')}</span></div>`;
  let ph='';
  if(s.received){const r=s.received;ph=`<div class="photos-row">${(r.urls.length?r.urls.map(u=>`<img src="${u}" alt="Фото приёмки">`):Array.from({length:r.photos},()=>`<span class="ph-ph">${ic('photo')}</span>`)).join('')}<small>${r.photos} фото · принял(а) ${esc(person(r.by)?.name||'')}${r.note?' · '+esc(r.note):''}</small></div>`;}
  let f='';
  if(!done){
    const b=[];
    if(can('logistics')) b.push(`<button class="btn sm" data-act="stage" data-id="${s.id}">${ic('pin')}Отметить этап</button>`);
    if(can('receive')&&awaitsReceipt(s)) b.push(`<button class="btn sm pri" data-act="rcv-start" data-id="${s.id}">${ic('camera')}Принять на складе</button>`);
    if(b.length) f=`<div class="ship-f">${b.join('')}</div>`;
  }
  return `<article class="card ship ${late?'is-late':''}"><div class="ship-h"><div class="ship-id"><b class="mono">${s.id}</b>${pill}</div><div class="eta ${late?'bad-t':''}"><small>${done?'Закрыто':s.dir==='in'?'Ожидается на складе':'Доставка'}</small><b>${fD(when)}</b><span>${etaTxt}</span></div></div>
    <div class="route"><span>${esc(s.from)}</span>${ic('arrow')}<span>${esc(s.to)}</span></div>
    <div class="muted sm">${esc(s.carrier)} · <span class="mono">${esc(s.doc)}</span></div>
    <ol class="steps" style="--n:${stg.length}">${stg.map((x,i)=>`<li class="${i<pos||done?'done':i===pos?'cur':''}"><span>${esc(x.name)}</span></li>`).join('')}</ol>
    <div class="lastm">${ic('pin')}<span>${esc(s.last.place)}<small>${fWhen(s.last.at)} · отметка: ${esc(person(s.last.by)?.name||'')}</small></span></div>
    <div class="items">${items}</div>${w}${ph}${f}</article>`;
}

// Раздел «Приёмка на складе»
// Перенесено из прототипа v2. Что ждёт приёмки — awaitsReceipt (флаг arrived); кому уведомления — Notify;
// предпросмотр и подтверждение считают по одному плану rcvPlan().

// ——— приёмка ———
const newRcv=id=>{const s=ship(id);return {shipId:id,qty:Object.fromEntries(s.items.map(i=>[i.sku,i.qty])),dmg:{},note:'',photos:[],done:null}};
function initRcv(id){S.rcv=newRcv(id)}
const pendingRcv=()=>S.shipments.filter(awaitsReceipt).sort((a,b)=>a.eta-b.eta);
// Текущая приёмка: начатая или первая из ждущих (без записи в S — вид не меняет состояние)
function curRcv(){
  if(S.rcv&&S.rcv.done) return S.rcv;
  const pend=pendingRcv();
  if(S.rcv&&pend.some(s=>s.id===S.rcv.shipId)) return S.rcv;
  return pend.length?newRcv(pend[0].id):null;
}
// Перед отрисовкой раздела: начатая приёмка или первая из ждущих становится текущей
function syncRcv(){const r=curRcv();if(r!==S.rcv) S.rcv=r}
const qv=(sku,r=S.rcv)=>Math.max(0,parseInt(r.qty[sku],10)||0);
function diffHtml(it,r=S.rcv){const d=qv(it.sku,r)-it.qty;return d<0?`<span class="pill bad sm">недостача ${num(-d)}</span>`:d>0?`<span class="pill warn sm">излишек ${num(d)}</span>`:'<span class="pill ok sm">сходится</span>'}
// План приёмки — один на предпросмотр и подтверждение: расхождения, сделки-ждуны и что с каждой, кому уведомления
function rcvPlan(r=S.rcv){
  const s=ship(r.shipId),auto=rule('arrive').on,issues=[],dmg=[];
  s.items.forEach(it=>{
    const p=product(it.sku),q=qv(it.sku,r);
    if(q<it.qty) issues.push(`${p.name}: принято ${num(q)} из ${num(it.qty)} ${p.unit}`);
    else if(q>it.qty) issues.push(`${p.name}: принято ${num(q)} вместо ${num(it.qty)} ${p.unit}`);
    if(r.dmg[it.sku]) dmg.push(p.name);
  });
  const res=S.reserves.filter(x=>x.src===s.id);
  // как сообщить клиенту: телефон → задача менеджеру; иначе авто-сообщение, если правило включено; иначе напоминание
  const waits=[...byDeal(res)].map(([did,list])=>{const d=deal(did);return {d,list,items:itemsText(list),how:d.channel==='phone'?'call':auto?'auto':'remind'}});
  const ids=new Set([...Notify.recipients(S,'arrive'),...waits.flatMap(w=>Notify.recipients(S,'msg',[w.d.managerId])),...(issues.length||dmg.length?Notify.recipients(S,'warn'):[])]);
  return {s,issues,dmg,res,waits,warnTo:Notify.recipients(S,'warn'),to:[...ids]};
}
function vReceiving(){
  const r=curRcv();
  if(r&&r.done) return rcvLayout(rcvDoneHtml(r),rcvAfterHtml(r));
  if(!r) return '<section class="card"><p class="empty">Сейчас нечего принимать: нет поставок на этапе «прибыло, ждёт приёмки». Как только логист отметит прибытие, поставка появится здесь.</p></section>';
  return rcvLayout(rcvPhoneHtml(r,pendingRcv()),`<div id="rcv-prev">${rcvPreview(r)}</div>`);
}
function rcvLayout(phone,side){
  return `<p class="hint">Так приёмку видит кладовщик с телефона: выбрал поставку, пересчитал, сфотографировал — и все, кого это касается, сразу получили уведомления. Справа видно, что произойдёт.</p><div class="rcv"><section class="phone" aria-label="Экран кладовщика"><div class="phone-in"><div class="ph-bar"><b>Приёмка</b><span>${esc(me().name)} · ${fT(new Date())}</span></div>${phone}</div></section><div class="stack">${side}</div></div>`;
}
function photosHtml(r=S.rcv){
  return r.photos.map((u,i)=>`<figure class="ph"><img src="${u}" alt="Фото ${i+1}"><button class="ph-x" data-act="rcv-photo-del" data-i="${i}" aria-label="Удалить фото">${ic('x')}</button></figure>`).join('')+`<label class="ph add" for="rcv-file">${ic('camera')}<span>Снять или добавить фото</span><input id="rcv-file" class="sr" type="file" accept="image/*" capture="environment" multiple data-on="rcv-photo"></label>`;
}
function rcvPhoneHtml(r,pend){
  const s=ship(r.shipId);
  const opts=pend.map(x=>{const on=x.id===s.id;return `<label class="opt ${on?'on':''}"><input type="radio" name="rcv-ship" id="rcv-s-${x.id}" value="${x.id}" ${on?'checked':''} data-on="rcv-ship"><span><b class="mono">${x.id}</b> · ${esc(x.from)}<small>${isLate(x)?'задерживается':esc(stageName(x).toLowerCase())} · ${x.items.length} ${pl(x.items.length,'позиция','позиции','позиций')} · ожидается ${fRel(x.eta)}</small></span></label>`}).join('');
  const rows=s.items.map(it=>{const p=product(it.sku);return `<div class="cnt-row"><div class="cnt-name">${esc(p.name)}<small>Ожидалось: ${num(it.qty)} ${p.unit}</small></div><div class="qty"><button type="button" data-act="rcv-step" data-sku="${it.sku}" data-d="-1" aria-label="Меньше">−</button><input id="rcv-q-${it.sku}" type="number" inputmode="numeric" min="0" value="${esc(r.qty[it.sku])}" data-on="rcv-qty" data-sku="${it.sku}" aria-label="Принято, ${p.unit}"><button type="button" data-act="rcv-step" data-sku="${it.sku}" data-d="1" aria-label="Больше">+</button></div><div class="cnt-x"><label class="check"><input type="checkbox" id="rcv-d-${it.sku}" data-on="rcv-dmg" data-sku="${it.sku}" ${r.dmg[it.sku]?'checked':''}> Есть повреждения</label><span id="rcv-diff-${it.sku}">${diffHtml(it,r)}</span></div></div>`}).join('');
  return `<div class="ph-sec"><span class="ph-step">Шаг 1</span><h3>Какая поставка пришла</h3>${opts}</div>
    <div class="ph-sec"><span class="ph-step">Шаг 2</span><h3>Пересчитайте товар</h3>${rows}</div>
    <div class="ph-sec"><span class="ph-step">Шаг 3</span><h3>Фото груза и накладной</h3><div class="photos" id="rcv-photos">${photosHtml(r)}</div><div class="field"><label for="rcv-note">Комментарий</label><textarea id="rcv-note" class="inp" rows="2" data-on="rcv-note" placeholder="Например: одна коробка надорвана, содержимое целое">${esc(r.note)}</textarea></div></div>
    <div class="ph-foot"><button class="btn pri big" data-act="rcv-confirm">${ic('check')}Принять на склад и уведомить</button></div>`;
}
function rcvPreview(r=S.rcv){
  const P=rcvPlan(r),s=P.s,m=me();
  const ppl=P.to.filter(id=>id!==m.id).map(person).filter(Boolean);
  const add=s.items.map(it=>{const p=product(it.sku);return `<li><span>${esc(p.name)}</span><b class="num">+${num(qv(it.sku,r))} ${p.unit}</b></li>`}).join('');
