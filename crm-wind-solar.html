function dealsBody(){
  const u=dealsSel(),{vis,cur,pipe}=dealsScope(),pr=can('prices');
  if(!vis.length) return `<section class="card">${emptyState('Сделок пока нет. Заведите первую или создайте её из лида в разделе «Лиды».',can('dealsEdit')?'Новая сделка':'','deal-new')}</section>`;
  if(!pipe) return '<section class="card"><p class="empty">Воронки сделок этого типа нет — её заводят в «Настройки → Воронки».</p></section>';
  const list=Deals.query(S,dealsFilter(u,cur),S.me),sum=Deals.sumOf(list);
  const head=`<p class="count"><span>Сделок: <b>${list.length}</b></span>${pr?`<span>на сумму: <b>${rub(sum)}</b></span>`:''}<span>${esc(pipe.name)}</span></p>`;
  if(!list.length){
    const dirty=u.q.trim()||u.mine||u.lost||u.acts;
    return `${head}<section class="card">${dirty?emptyState('По этим условиям сделок нет.','Сбросить поиск и фильтры','deal-reset'):emptyState(`Сделок типа ${Leads.TYPE[cur]} пока нет. Заведите первую или создайте её из лида.`,can('dealsEdit')?'Новая сделка':'','deal-new')}</section>`;
  }
  return head+(u.view==='table'?dealsTable(cur,u):dealsBoard(pipe,cur,u));
}

function vDeals(){
  const u=dealsSel(),{vis,types,cur,pipes,pipe}=dealsScope();
  const lostN=Deals.query(S,{type:cur,q:u.q,mine:u.mine,lost:'only'},S.me).length;
  const seg=(act,items,on,aria)=>`<div class="seg" role="group" aria-label="${aria}">${items.map(([k,l,n])=>`<button type="button" class="${on===k?'on':''}" aria-pressed="${on===k}" data-act="${act}" data-${act==='deal-type'?'type':'v'}="${k}">${l}${n===undefined?'':`<b>${n}</b>`}</button>`).join('')}</div>`;
  const typeSw=types.length>1?seg('deal-type',types.map(t=>[t,Leads.TYPE[t],vis.filter(d=>d.type===t).length]),cur,'Тип клиентов'):'';
  const pipeSel=pipes.length>1?`<select class="inp sm w-auto" data-on="deal-pipe" aria-label="Воронка">${pipes.map(p=>`<option value="${esc(p.id)}"${pipe&&p.id===pipe.id?' selected':''}>${esc(p.name)}</option>`).join('')}</select>`:'';
  const dirty=u.q.trim()||u.mine||u.lost||u.acts,fq={type:cur,q:u.q,mine:u.mine,now:new Date()};

  <div class="bar dbar">${typeSw}${seg('deal-view',[['board','Доска'],['table','Таблица']],u.view,'Вид')}${pipeSel}<div class="search-in">${ic('search')}<input id="deal-q" class="inp" type="search" placeholder="Поиск: клиент, номер, телефон, объект" value="${esc(u.q)}" data-on="deal-q" autocomplete="off" aria-label="Поиск по сделкам"></div><span class="grow"></span>${can('dealsEdit')?`<button type="button" class="btn pri" data-act="deal-new">${ic('plus')}Новая сделка</button>`:''}</div>
  <div class="bar dfilt"><button type="button" class="fchip${u.mine?' on':''}" aria-pressed="${u.mine}" data-act="deal-mine">Мои</button><button type="button" class="fchip${u.lost?' on':''}" aria-pressed="${u.lost}" data-act="deal-lostf">Провалены · ${lostN}</button><button type="button" class="fchip${u.acts==='none'?' on':''}" aria-pressed="${u.acts==='none'}" data-act="deal-acts" data-k="none">Без дел · ${noActN}</button><button type="button" class="fchip${u.acts==='overdue'?' on':''}" aria-pressed="${u.acts==='overdue'}" data-act="deal-acts" data-k="overdue">Просрочены дела · ${lateN}</button>${dirty?'<button type="button" class="btn ghost sm" data-act="deal-reset">Сбросить</button>':''}</div>
  <div id="deal-body" class="stack-s">${dealsBody()}</div>`;
}

// ——— быстрая форма «Новая сделка» ———
// Клиент: найти среди существующих (Clients.search) или завести нового тут же; остальное — контакт, телефон, тип, менеджер.
function dealClientOpts(q,sel){
  const hits=q.trim()?clientsSeen(Clients.search(S,q)).slice(0,6):[],pick=sel&&clientVisible(Clients.byId(S,sel))&&Clients.byId(S,sel);
  // выбранный клиент («Выбрать его» в подсказке о дубле) остаётся в списке, даже если поиск по имени его не вернул
  if(pick&&!hits.some(c=>c.id===sel)) hits.unshift(pick);
  const cur=sel&&hits.some(c=>c.id===sel)?sel:(hits[0]?hits[0].id:'new');
  const one=(v,html)=>`<label class="dpick"><input type="radio" name="dn-c" value="${esc(v)}" data-on="deal-cs"${cur===v?' checked':''}><span>${html}</span></label>`;
  return one('new','Новый клиент — заполните ниже')+hits.map(c=>one(c.id,`${esc(c.name)}<small>${esc(c.id)}${(c.phones||[])[0]?' · '+esc(c.phones[0]):''}${c.inn?' · ИНН '+esc(c.inn):''}${c.demo?' · пример':''}</small>`)).join('')
    +(q.trim()&&!hits.length?'<p class="hint">Такого клиента нет — заведём нового.</p>':'');
}
// Менеджеры в форме: я (по умолчанию) и менеджеры типов
function dealManagers(){
  const m=me(),list=[m,...Leads.managers(S).filter(p=>p.id!==m.id)];
  return list.map(p=>`<option value="${esc(p.id)}"${p.id===m.id?' selected':''}>${esc(p.name)}${p.id===m.id?' (я)':''}</option>`).join('');
}

    <div id="dn-new" class="stack-s"><div class="field"><label for="dn-cname">Имя клиента или название компании</label><input id="dn-cname" class="inp" autocomplete="off"></div>
      <div class="grid2"><div class="field"><label for="dn-email">Почта</label><input id="dn-email" class="inp" type="email" data-on="deal-dup" autocomplete="off"></div><div class="field"><label for="dn-inn">ИНН (если компания)</label><input id="dn-inn" class="inp" inputmode="numeric" data-on="deal-dup" autocomplete="off"></div></div></div>

      <div class="field"><label for="dn-obj">Что продаём</label><input id="dn-obj" class="inp" placeholder="Например: станция 8 кВт для дома" autocomplete="off"></div><div class="field"><label for="dn-ch">Связь</label><select id="dn-ch" class="inp">${Object.entries(CH).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div>
    <div id="dn-dup" aria-live="polite"></div>
    ${stg?`<p class="hint">Сделка встанет на этап «${esc(stg.name)}».</p>`:''}
    <p class="err" id="dn-err" hidden></p></div>${mFoot('Завести сделку')}</form>`;

// ——— карточка сделки ———
const DEAL_TABS=[['details','Детали'],['items','Товары'],['feed','Лента']];
const DEAL_FIELD={contact:'Контакт',phone:'Телефон',email:'Почта',object:'Что продаём',type:'Тип',managerId:'Менеджер',channel:'Связь',amount:'Сумма'};

// Полоса этапов: клик по этапу переводит сделку (Deals.move); последний этап — «Успешно»
function dealSteps(d,edit){
  const stg=stagesFor(d),pos=stagePos(d),lost=!!d.lostReason;
  return `<div class="dsteps" role="group" aria-label="Этапы сделки">${stg.map((x,i)=>{
    const cls=i<pos?'done':x.id===d.stageId?(lost?'lost':'cur'):'';
    return `<button type="button" class="dstep ${cls}" data-act="deal-stage" data-id="${esc(d.id)}" data-st="${esc(x.id)}"${x.id===d.stageId||!edit||lost?' disabled':''}${x.id===d.stageId?' aria-current="step"':''}><span>${esc(x.name)}</span></button>`;
  }).join('')}</div>`;
}
// Кнопки действий над сделкой: зависят от состояния (Deals.state) и права
function dealActions(d,edit){
  const st=Deals.state(S,d),id=esc(d.id),b=(act,label,cls)=>`<button type="button" class="btn${cls?' '+cls:''}" data-act="${act}" data-id="${id}">${label}</button>`;
  let h='';
  if(edit&&st==='open') h+=b('deal-win',ic('check')+'Успешно','pri')+b('deal-lose',ic('x')+'Провалена');
  if(edit&&st==='lost') h+=b('deal-reopen','Вернуть в работу','pri');
  if(can('prices')) h+=b('deal-kp',ic('print')+'КП');
  if(st!=='lost') h+=b('deal-dispatch',ic('truck')+'Создать отправку');
  const note=st==='lost'?`<p class="lock bad-t">${ic('alert')}Провалена: ${esc(d.lostReason)}${d.lostAt?' · '+esc(fWhen(d.lostAt)):''}. Этап не меняется, пока сделку не вернут в работу.</p>`
    :st==='won'?`<p class="lock ok-t">${ic('check')}Успешно закрыта${d.wonAt?' · '+esc(fWhen(d.wonAt)):''}. Чтобы вернуть в работу, выберите другой этап.</p>`:'';
  return `${h?`<div class="dact">${h}</div>`:''}${note}${edit?'':`<p class="lock">${ic('lock')}Сделка открыта на просмотр: двигать по этапам и править её могут те, у кого есть право «Заводить и править сделки».</p>`}`;
}
// Ссылка на клиента: на карточку клиента (DRAWERS.client — раздел «Клиенты»), пока её нет — просто имя
function dealClientLink(d){
  const c=Clients.byId(S,d.clientId);
  if(!c) return esc(d.client);
  return Object.hasOwn(DRAWERS,'client')?`<button type="button" class="link" data-act="open-client" data-id="${esc(c.id)}">${esc(c.name)}</button> <small class="muted mono">${esc(c.id)}</small>`:`${esc(c.name)} <small class="muted mono">${esc(c.id)}</small>`;
}
function dealDetails(d,edit){
  const id=esc(d.id);
  const field=(f,label,html)=>`<div class="field"><label for="df-${f}">${label}</label>${html}</div>`;
  const text=(f,val,kind,ph)=>edit?`<input id="df-${f}" class="inp" type="${kind||'text'}" data-on="deal-f" data-id="${id}" data-f="${f}" value="${esc(dealVal(val))}" placeholder="нет данных: ${ph}" autocomplete="off">`:(dealVal(val)?`<span>${esc(val)}</span>`:dealNoData(ph));
  const sel=(f,opts,cur)=>edit?`<select id="df-${f}" class="inp" data-on="deal-f" data-id="${id}" data-f="${f}">${opts.map(([v,l])=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(l)}</option>`).join('')}</select>`:esc((opts.find(o=>o[0]===cur)||[0,'нет данных'])[1]);
  const mgrs=Leads.managers(S).map(p=>[p.id,p.name]);
  if(d.managerId&&!mgrs.some(m=>m[0]===d.managerId)) mgrs.unshift([d.managerId,dealWho(d.managerId)]);
  const noItems=!(d.items||[]).length,pr=can('prices');
  const sum=!pr?'':noItems?field('amount','Сумма, ₽',edit?`<input id="df-amount" class="inp" type="number" min="0" step="any" inputmode="decimal" data-on="deal-f" data-id="${id}" data-f="amount" value="${d.amount?esc(d.amount):''}" placeholder="не рассчитана"><small class="muted">Строк товаров нет — сумма вписана руками. Добавите строки — она посчитается по ним.</small>`:esc(dealSumText(d))):field('sum','Сумма',`<b>${rub(Deals.total(d))}</b><small class="muted">считается по товарам (вкладка «Товары»)</small>`);
  const lead=d.leadId?`<dt>Лид</dt><dd>${Leads.visible(S,S.me).some(l=>l.id===d.leadId)?`<button type="button" class="link" data-act="open-lead" data-id="${esc(d.leadId)}">${esc(d.leadId)}</button>`:esc(d.leadId)}</dd>`:'';
  return `<div class="dform"><div class="field span2"><span class="lbl">Клиент</span><span>${dealClientLink(d)}</span></div>
    ${field('contact','Контакт',text('contact',d.contact,'text','контакт'))}${field('phone','Телефон',text('phone',d.phone,'tel','телефон'))}
    ${field('email','Почта',text('email',d.email,'email','почта'))}${field('object','Что продаём',text('object',d.object,'text','что продаём'))}
    ${field('type','Тип',sel('type',Object.entries(Leads.TYPE),d.type))}${field('managerId','Менеджер',sel('managerId',[['','Не назначен'],...mgrs],d.managerId||''))}
    ${field('channel','Связь',sel('channel',Object.entries(CH),d.channel))}${sum}</div>
    <dl class="kv"><dt>Воронка</dt><dd>${esc(pipeById(d.pipeId)?.name||'нет данных: воронка')}</dd><dt>Этап</dt><dd>${esc(stageName(d))}</dd><dt>Создана</dt><dd>${d.at?esc(fWhen(d.at)):'нет данных: дата'}${d.demo?' <span class="pill sm">пример</span>':''}</dd>${lead}</dl>`;
}
function dealCard(d){
  const edit=Deals.canEdit(S,d,S.me),tab=DEAL_TABS.some(t=>t[0]===S.ui.dealTab)?S.ui.dealTab:'details';
  const tabs=`<div class="dtabs" role="tablist" aria-label="Разделы карточки">${DEAL_TABS.map(([k,l])=>`<button type="button" role="tab" class="dtab${tab===k?' on':''}" aria-selected="${tab===k}" data-act="deal-tab" data-tab="${k}">${l}${k==='items'&&(d.items||[]).length?`<b>${d.items.length}</b>`:''}</button>`).join('')}</div>`;
  const body=tab==='items'?dealItems(d,edit):tab==='feed'?feedHtml({t:'deal',id:d.id}):dealDetails(d,edit);
  return {kind:'Сделка '+d.id,title:esc(d.client),sub:`${esc(Leads.TYPE[d.type]||'нет данных: тип')} · ${esc(d.object)}`,body:`${edit?dealSteps(d,edit):''}${dealActions(d,edit)}${tabs}<div class="dpane">${body}</div>`};
}

// ——— вкладка «Товары» ———
// Откуда цена строки: цена сайта (как в каталоге), вписана руками или нет данных
function dealPriceSrc(it){
  if(!(typeof it.price==='number')) return '<span class="pill sm warn">нет данных: цена</span>';
  const p=it.productId?product(it.productId):null;
  return p&&p.price===it.price?`<span class="pill sm" title="${esc(priceNote())}">цена сайта</span>`:'<span class="pill sm">вписана руками</span>';
}
const dealLineSum=it=>(typeof it.price==='number'?rub(Deals.lineSum(it)):'не входит в итог');
const dealTotalText=d=>{
  const np=Deals.noPrice(d).length;
  return np?`В итог не вошли строки без цены: ${np}. Впишите цену — и они посчитаются.`:((d.items||[]).length?'':(Deals.total(d)?'Строк нет: показана сумма, вписанная в «Деталях».':'Строк нет — добавьте товары.'));
};
// Сколько товара сделки ещё можно зарезервировать — только Deals.left (строки сделки с этим товаром минус уже в резерве);
// тем же числом ядро ограничивает резерв, своей копии формулы у экрана нет.
function dealLine(d,it,i,edit,pr){
  const id=esc(d.id),p=it.productId?product(it.productId):null,name=Deals.itemName(S,it);
  let info,res='',btn='';
  if(p){
    const k=stockOf(p.id),held=Deals.reserved(S,d,p.id),left=Deals.left(S,d,p.id);
    info=`<small class="dl-st">${k.known?`свободно ${qtyOf(Math.max(0,k.free),p)}`:'остаток: нет данных'}${held?` · в резерве по сделке: ${qtyOf(held,p)}`:''}</small>`;
    res=S.reserves.filter(r=>r.dealId===d.id&&r.productId===p.id).map(r=>`<span class="chip dl-r">${srcPill(r)}<span>${qtyOf(r.qty,p)}${r.src==='stock'?' · '+esc(cellText(r.entityId,r.cityId)):''}${r.until?' · до '+fD(r.until):''}</span>${edit&&can('reserve')?`<button type="button" class="btn sm ghost" data-act="deal-unres" data-id="${id}" data-rid="${esc(r.id)}">Снять</button>`:''}</span>`).join('');
    if(edit&&can('reserve')&&left>0) btn=`<button type="button" class="btn sm" data-act="deal-res" data-id="${id}" data-i="${i}">${ic('lock')}Зарезервировать</button>`;
    // списание — окно склада (53-stock.js): сначала резерв этой сделки, если он есть; право sell
    if(can('sell')) btn+=`<button type="button" class="btn sm" data-act="stock-sell" data-pid="${esc(p.id)}" data-did="${id}">Списать при продаже</button>`;
  }else info='<small class="dl-st">своя строка — не из каталога, резерва нет</small>';
  const numf=(f,label,val,ph)=>edit?`<div class="field"><label for="di-${f}-${i}">${label}</label><input id="di-${f}-${i}" class="inp sm" type="number" min="0" step="any" inputmode="decimal" data-on="deal-i" data-id="${id}" data-i="${i}" data-f="${f}" value="${val===null||val===undefined?'':esc(val)}"${ph?` placeholder="${ph}"`:''}></div>`:`<div class="field"><span class="lbl">${label}</span><span>${val===null||val===undefined||val===''?dealNoData('цена'):esc(val)}</span></div>`;
  return `<li class="dline"><div class="dl-h"><div class="dl-n"><b>${esc(name)}</b>${info}</div>${edit?`<button type="button" class="btn ghost icon sm" data-act="deal-del-i" data-id="${id}" data-i="${i}" aria-label="Убрать строку «${esc(name)}»">${ic('x')}</button>`:''}</div>
    <div class="dl-in">${numf('qty','Кол-во',it.qty)}${pr?`${numf('price','Цена, ₽',typeof it.price==='number'?it.price:null,'нет данных: цена')}${numf('disc','Скидка, %',it.disc||0)}<div class="field"><span class="lbl">Сумма</span><output class="dl-sum" id="di-sum-${i}">${esc(dealLineSum(it))}</output></div>`:''}</div>
    <div class="dl-f">${pr?`<span id="di-src-${i}">${dealPriceSrc(it)}</span>`:''}${res}${btn}</div></li>`;
}
// Результаты поиска по каталогу: сначала то, что есть в каталоге; цена и свободный остаток видны сразу
function dealFound(d,q){
  const query=String(q||'').trim();
  if(query.length<2) return '<p class="hint">Введите хотя бы две буквы названия, бренда или артикула.</p>';
  const list=Catalog.query(S,{q:query}).sort((a,b)=>(b.inCatalog?1:0)-(a.inCatalog?1:0)).slice(0,8);
  if(!list.length) return '<p class="hint">В каталоге такого нет. Можно добавить свою строку ниже.</p>';
  const pr=can('prices');
  return list.map(p=>{const k=stockOf(p.id);return `<button type="button" class="dpr" data-act="deal-add-p" data-id="${esc(d.id)}" data-pid="${esc(p.id)}"><span class="dpr-n">${esc(p.name)}</span><small>${pr?(typeof p.price==='number'?rub(p.price):'нет данных: цена')+' · ':''}${k.known?'свободно '+qtyOf(Math.max(0,k.free),p):'остаток: нет данных'}${p.inCatalog?'':' · нет в каталоге'}</small>${ic('plus')}</button>`}).join('');
}
function dealItems(d,edit){
  const pr=can('prices'),items=d.items||[],id=esc(d.id);
  const add=edit?`<div class="stack-s"><div class="field"><label for="deal-ps">Добавить товар из каталога</label><input id="deal-ps" class="inp" type="search" placeholder="Название, бренд или артикул" data-on="deal-ps" data-id="${id}" autocomplete="off"></div><div id="deal-pres" class="dpres">${dealFound(d,'')}</div>

  const total=pr?`<div class="dtot"><span>Итого</span><b id="di-total">${rub(Deals.total(d))}</b></div><p class="hint" id="di-warn">${esc(dealTotalText(d))}</p>`:`<p class="lock">${ic('lock')}Цены и суммы скрыты для вашей роли.</p>`;
  return `<div class="stack-s">${items.length?`<ul class="dlines">${items.map((it,i)=>dealLine(d,it,i,edit,pr)).join('')}</ul>`:'<p class="muted m0">Товаров в сделке пока нет.</p>'}${total}${add}

}

// ——— коммерческое предложение ———
// Страница для печати. Реквизитов фирмы и срока действия в системе нет: на месте — «нет данных: …».
// Логотип подставляет обработчик кнопки «КП» (вид не трогает документ).
function dealKp(d){
  const items=d.items||[],mgr=person(d.managerId),c=Clients.byId(S,d.clientId),now=new Date();
  const when=`${now.getDate()} ${MONF[now.getMonth()]} ${now.getFullYear()} г.`;
  const rows=items.map((it,i)=>`<tr><td>${i+1}</td><td>${esc(Deals.itemName(S,it))}</td><td class="num">${num(it.qty)}</td><td class="num">${typeof it.price==='number'?rub(it.price):'нет данных: цена'}</td><td class="num">${it.disc?num(it.disc)+' %':'0 %'}</td><td class="num">${esc(dealLineSum(it))}</td></tr>`).join('');
  const np=Deals.noPrice(d).length;
  return `<div class="kp" id="kp">
    <div class="kp-top"><span class="logo" id="kp-logo"></span><div class="kp-t"><h2>Коммерческое предложение</h2><p>№ ${esc(d.id)} · ${esc(when)}</p></div></div>
    <dl class="kp-kv"><dt>Исполнитель</dt><dd>нет данных: реквизиты фирмы (название, ИНН, адрес, банк)</dd>
      <dt>Заказчик</dt><dd>${esc(d.client)}${c&&c.inn?', ИНН '+esc(c.inn):''}</dd>
      <dt>Контакт</dt><dd>${dealVal(d.contact)?esc(d.contact):'нет данных: контакт'}${d.phone?', '+esc(d.phone):''}${d.email?', '+esc(d.email):''}</dd>
      ${dealVal(d.object)?`<dt>Предмет</dt><dd>${esc(d.object)}</dd>`:''}</dl>
    ${items.length?`<div class="xs"><table class="tbl kp-tbl"><thead><tr><th>№</th><th>Наименование</th><th class="num">Кол-во</th><th class="num">Цена</th><th class="num">Скидка</th><th class="num">Сумма</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="muted">В сделке нет товаров: добавьте строки на вкладке «Товары».</p>'}
    <p class="kp-tot"><span>Итого</span><b>${rub(Deals.total(d))}</b></p>
    ${np?`<p class="hint">В итог не вошли строки без цены: ${np}.</p>`:''}
    <dl class="kp-kv"><dt>Срок действия</dt><dd>нет данных: срок действия предложения</dd><dt>Менеджер</dt><dd>${mgr?esc(mgr.name)+', '+esc(roleName(mgr)):'нет данных: менеджер'}</dd><dt>Дата</dt><dd>${esc(when)}</dd></dl>
  </div>`;
}

MODALS.dealReserve=key=>{

  const held=Deals.reserved(S,d,p.id),all=Deals.lined(d,p.id),left=Deals.left(S,d,p.id),cell=Stock.bestCell(S,p.id),k=stockOf(p.id);

// ——— действия: каждое — запись в ленту (ядро) и короткое подтверждение ———
const dealById=id=>Deals.byId(S,id);
// Перерисовать только тело раздела (счёт и доску) — правка в карточке не сбрасывает фокус в её полях
function dealsRefresh(){const box=byId('deal-body');if(box) box.innerHTML=dealsBody()}
// Выполнить действие ядра: отказ — понятная причина, успех — перерисовка и подтверждение
function dealRun(r,done){
  if(!r.ok){toast(r.reason,'warn');return null}
  render();toast(done);return r;
}
// Перевести сделку на этап: из доски (перетаскивание) и из полосы этапов. Последний этап — «Успешно» (решает Deals.move)
function dealMoveTo(id,stageId){
  const d=dealById(id),to=d&&Pipes.stage(S,d.pipeId,stageId);
  if(!d||!to||to.id===d.stageId) return null;
  const r=Deals.move(S,id,stageId,S.me,new Date());
  return dealRun(r,to.flag==='final'?`Сделка ${id} закрыта успешно: этап «${to.name}». Запись в ленте есть.`:`Сделка ${id} теперь на этапе «${to.name}». Запись в ленте есть.`);
}

// Количество, цена, скидка строки: после правки обновляются сумма строки и итог на месте
function dealItemSync(d){
  (d.items||[]).forEach((it,i)=>{
    const s=byId('di-sum-'+i),src=byId('di-src-'+i);
    if(s) s.textContent=dealLineSum(it);

}

// Подсказка «Похоже, это …» (clientDupHtml, 70-clients.js) — только для нового клиента: у выбранного из списка телефон его собственный

function dealPickSync(){
  dealDupSync();
  const r=document.querySelector('#dn-cres input[name="dn-c"]:checked'),nw=byId('dn-new');

FORMS['deal-new']=f=>{
  const {types}=dealsScope(),type=byId('dn-type').value,now=new Date();

  let client=cid==='new'?null:Clients.byId(S,cid);
  if(cid!=='new'&&!client) return showErr('dn-err','Такого клиента нет — выберите другого.');
  if(!client){
    const name=byId('dn-cname').value.trim();
    if(!name) return showErr('dn-err','Напишите имя клиента или название компании — или выберите клиента из списка.');
    const inn=byId('dn-inn').value.trim();
    const cr=Clients.create(S,{name,kind:inn||type==='b2b'?'company':'person',phone:byId('dn-phone').value,email:byId('dn-email').value,inn,managerId:byId('dn-mgr').value||undefined},S.me,now);
    if(!cr.ok) return showErr('dn-err',cr.reason);
    client=cr.client;
  }
  const r=Deals.create(S,{clientId:client.id,type,managerId:byId('dn-mgr').value||undefined,contact:byId('dn-contact').value,phone:byId('dn-phone').value,object:byId('dn-obj').value,channel:byId('dn-ch').value},S.me,now);
  if(!r.ok) return showErr('dn-err',r.reason);

  const to=f.dataset.stage,d=dealById(r.id);

  S.ui.dealType=type;S.ui.dealPipe=d.pipeId;S.ui.dealTab='details';
  render();openDrawer('deal',r.id);
  toast(`Сделка ${r.id} заведена: ${client.name}, этап «${stageName(d)}». Запись в ленте есть.`);
};

function leadTable(list){
  const rows=list.map(l=>`<tr class="click" data-act="open-lead" data-id="${esc(l.id)}" tabindex="0"><td><div class="pname"><span>${esc(Leads.title(l))}${leadDemoPill(l)}</span><small class="mono">${esc(l.id)}<span class="l-show-s"> · ${esc(Leads.SOURCE[l.source]||l.source)}${l.type?' · '+Leads.TYPE[l.type]:''}</span></small></div></td><td class="l-hide-s">${leadSrcPill(l)}</td><td class="l-hide-s">${leadTypePill(l)}</td><td>${leadStagePill(l)}${leadWaitHtml(l)}${actNextHtml({t:'lead',id:l.id})}</td><td>${leadMgrCell(l)}</td><td class="l-hide-s nowrap">${esc(fWhen(l.at))}</td></tr>`).join('');
  return `<section class="card clip"><div class="xs"><table class="tbl"><thead><tr><th>Лид</th><th class="l-hide-s">Источник</th><th class="l-hide-s">Тип</th><th>Этап</th><th>Менеджер</th><th class="l-hide-s">Пришёл</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

// ——— воронка ———
function leadCard(l){
  const mgr=l.managerId?`<span class="who">${av(person(l.managerId),'xs')}${esc(leadWho(l.managerId))}</span>`:'<span class="pill sm warn">Нераспределённый</span>';
  return `<article class="tcard lcard${isDone(l)?' done':''}" draggable="true" data-drag="${esc(l.id)}" data-act="open-lead" data-id="${esc(l.id)}" tabindex="0"><div class="tc-top">${leadSrcPill(l)}${leadTypePill(l)}${l.demo?'<span class="pill sm">пример</span>':''}</div><p class="tc-t">${esc(Leads.title(l))}<small class="mono lc-id">${esc(l.id)}</small></p>${l.text?`<p class="lc-x">${esc(l.text)}</p>`:''}${leadWaitHtml(l)}${actNextHtml({t:'lead',id:l.id})}<div class="tc-m">${mgr}<span class="due">${esc(fRel(l.at))}</span></div></article>`;
}
function leadFunnel(list){
  const pipe=leadPipe();
  if(!pipe) return '<section class="card"><p class="empty">Воронки лидов нет — её заводят в «Настройки → Воронки».</p></section>';
  return `<div class="xs" data-hscroll><div class="lkan" style="--n:${pipe.stages.length}">${pipe.stages.map(s=>{
    const c=list.filter(l=>l.pipeId===pipe.id&&l.stageId===s.id);
    return `<div class="col" data-lcol="${esc(s.id)}"><div class="col-h"><span>${esc(s.name)}</span><span class="cnt-s">${c.length}</span></div>${c.map(leadCard).join('')||'<p class="col-empty">Пусто</p>'}</div>`;
  }).join('')}</div></div>`;
}

// ——— тело раздела: счёт + список или воронка (его же перерисовывает поиск) ———
function leadBody(){
  const u=leadSel(),all=Leads.visible(S,S.me),funnel=u.view==='funnel';
  const list=leadFilter(all,u,!funnel);
  const head=`<p class="count"><span>Лидов: <b>${list.length}</b>${list.length!==all.length?` из ${all.length}`:''}</span><span>без менеджера: <b>${leadFreeCount(all)}</b></span></p>`;
  if(!all.length) return `${head}<section class="card">${emptyState(`Лидов пока нет. Они приходят с сайта и из Битрикса24 — откуда именно, выбирают в «Настройки → Лиды и сделки». Лид можно завести и руками.${can('settings')?' Проверить приход можно кнопками «Имитация» выше или в «Пульте проверки».':''}`,'Новый лид','lead-new')}</section>`;
  if(!list.length) return `${head}<section class="card">${emptyState('По этим условиям лидов нет.','Сбросить поиск и фильтры','lead-reset')}</section>`;
  return head+(funnel?`<p class="hint">Перетащите карточку на другой этап или откройте лид и нажмите кнопку. «Сделка создана» заводит сделку, «Отказ» спрашивает причину. Двигать лид может менеджер, который его ведёт, и тот, кто раздаёт лиды (директор, РОП).</p>${leadFunnel(list)}`:leadTable(list));
}

function vLeads(){
  const u=leadSel(),all=Leads.visible(S,S.me),pipe=leadPipe(),funnel=u.view==='funnel';
  const free=leadFreeCount(all);
  const opt=(v,l,cur)=>`<option value="${esc(v)}"${cur===v?' selected':''}>${esc(l)}</option>`;
  const sel=(k,label,opts)=>`<select class="inp sm w-auto" data-on="lead-f" data-k="${k}" aria-label="${label}">${opts}</select>`;
  const filters=(funnel?'':sel('stage','Этап',opt('','Все этапы',u.stage)+(pipe?pipe.stages.map(s=>opt(s.id,s.name,u.stage)).join(''):'')))
    +sel('type','Тип',opt('','Все типы',u.type)+opt('b2b','B2B',u.type)+opt('b2c','B2C',u.type)+opt('none','Тип не определён',u.type))
    +sel('source','Источник',opt('','Все источники',u.source)+Object.entries(Leads.SOURCE).map(([k,v])=>opt(k,v,u.source)).join(''))
    +sel('manager','Менеджер',opt('','Все менеджеры',u.manager)+opt('none','Нераспределённые',u.manager)+Leads.managers(S).map(m=>opt(m.id,m.name,u.manager)).join(''));
  const dirty=u.q.trim()||u.stage||u.type||u.source||u.manager||u.acts;
  const noActN=leadFilter(all,{...u,acts:'none'},!funnel).length,lateN=leadFilter(all,{...u,acts:'overdue'},!funnel).length;
  const sims=can('settings')?`<span class="grow"></span><button type="button" class="btn sm" data-act="lead-sim" data-source="site">${ic('plus')}Имитация: пришёл лид с сайта</button><button type="button" class="btn sm" data-act="lead-sim" data-source="bitrix">${ic('plus')}Имитация: пришёл лид из Битрикса24</button>`:'';
  return `<p class="hint">Лиды — заявки, которые ещё не стали сделками. Новый лид сам уходит менеджеру своего типа: компания или ИНН — B2B, иначе телефон или почта — B2C; кому менеджера не нашлось, тот лежит в «Нераспределённых» — их раздаёт РОП или директор. Заявки здесь пока примерные: настоящего подключения сайта и Битрикса24 нет.</p>
  <div class="bar lbar"><div class="seg" role="group" aria-label="Вид">${[['list','Список'],['funnel','Воронка']].map(([k,l])=>`<button type="button" class="${u.view===k?'on':''}" aria-pressed="${u.view===k}" data-act="lead-view" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="search-in">${ic('search')}<input id="lead-q" class="inp" type="search" placeholder="Поиск: имя, компания, ИНН, телефон, почта, текст" value="${esc(u.q)}" data-on="lead-q" autocomplete="off" aria-label="Поиск по лидам"></div><button type="button" class="btn pri" data-act="lead-new">${ic('plus')}Новый лид</button>${sims}</div>
  <div class="bar lfilt">${filters}<button type="button" class="fchip${u.manager==='none'?' on':''}" aria-pressed="${u.manager==='none'}" data-act="lead-free">Нераспределённые · ${free}</button><button type="button" class="fchip${u.acts==='none'?' on':''}" aria-pressed="${u.acts==='none'}" data-act="lead-acts" data-k="none">Без дел · ${noActN}</button><button type="button" class="fchip${u.acts==='overdue'?' on':''}" aria-pressed="${u.acts==='overdue'}" data-act="lead-acts" data-k="overdue">Просрочены дела · ${lateN}</button>${dirty?'<button type="button" class="btn ghost sm" data-act="lead-reset">Сбросить</button>':''}</div>
  <div id="lead-body" class="stack-s">${leadBody()}</div>`;
}

// ——— почему нельзя: один текст на экран, окно и тост ———
function leadWhy(l,need){
  if(isDone(l)) return `Лид ${l.id} закрыт — менять его уже нельзя.`;
  if(need==='transfer') return 'Передавать лиды могут директор и РОП — тот, у кого есть право «Распределять и передавать лиды».';
  if(need==='take') return l.managerId===S.me?`Лид ${l.id} уже у вас.`:l.managerId?`Лид ${l.id} уже ведёт ${leadWho(l.managerId)}.`:`Лид ${l.id} другого типа — взять его может менеджер ${Leads.TYPE[l.type]||'нужного типа'}.`;
  if(need==='deal'&&l.dealId) return `Сделка по лиду ${l.id} уже создана: ${l.dealId}.`;
  if(!l.managerId) return `У лида ${l.id} пока нет менеджера — сначала нажмите «Взять» или попросите РОП или директора передать лид.`;
  if(need==='deal'&&Leads.can(S,l.id,S.me).work) return `Сделку из лида ${l.id} не создать: не определён тип лида — передайте его менеджеру B2B или B2C.`;
  return `Лид ${l.id} ведёт ${leadWho(l.managerId)} — менять его могут он и тот, кто раздаёт лиды (директор, РОП).`;
}

// ——— карточка лида ———
// «Детали» и «Лента» — как у сделки; в «Ленте» дела («Запланировать», открытые дела) и комментарии (feedHtml)
const LEAD_TABS=[['details','Детали'],['feed','Лента']];
function dLead(l){
  const c=Leads.can(S,l.id,S.me),open=!isDone(l);
  const deal=l.dealId?Leads.dealsVisible(S,S.me).find(d=>d.id===l.dealId):null;
  const stg=stagesFor(l).filter(s=>s.id!==Leads.STAGE.lost);
  const steps=l.stageId===Leads.STAGE.lost
    ?`<p class="lock">${ic('lock')}Лид закрыт. Причина: ${esc(l.reason||'нет данных: причина')}</p>`
    :`<ol class="steps" style="--n:${stg.length}">${stg.map((x,i)=>`<li class="${i<stagePos(l)?'done':x.id===l.stageId?'cur':''}"><span>${esc(x.name)}</span></li>`).join('')}</ol>`;
  const b=(act,label,cls)=>`<button type="button" class="btn${cls?' '+cls:''}" data-act="${act}" data-id="${esc(l.id)}">${label}</button>`;
  let acts='';
  if(c.take) acts+=b('lead-take','Взять','pri');
  if(c.work){
    acts+=b('lead-contacted','Связались');
    if(l.stageId!==Leads.STAGE.qualified) acts+=b('lead-qualify','Квалифицирован');
    if(c.deal) acts+=b('lead-deal',ic('plus')+'Создать сделку','pri');
    acts+=b('lead-close',ic('x')+'Закрыть');
  }
  if(deal) acts+=`<button type="button" class="btn" data-act="open-deal" data-id="${esc(deal.id)}">Открыть сделку ${esc(deal.id)}</button>`;
  const lock=open&&!c.take&&!c.work?`<p class="lock">${ic('lock')}${esc(leadWhy(l,'work'))}</p>`:'';
  const tr=c.transfer?`<form class="rform" data-form="lead-transfer" data-id="${esc(l.id)}" novalidate><p class="sh">Передать</p><div class="field"><label for="lead-tr">Кому</label><select id="lead-tr" class="inp"><optgroup label="Менеджеру">${Leads.managers(S).map(m=>`<option value="m:${esc(m.id)}"${m.id===l.managerId?' selected':''}>${esc(m.name)} — ${Leads.TYPE[Perms.roleOf(S,m.id).scope]}, открытых лидов: ${Leads.openCount(S,m.id)}</option>`).join('')}</optgroup><optgroup label="Типу — менеджеру с меньшей загрузкой"><option value="t:b2b">Тип B2B</option><option value="t:b2c">Тип B2C</option></optgroup></select></div><p class="hint">Новый менеджер получит уведомление, в истории лида останется, кто и кому передал.</p><div><button type="submit" class="btn">Передать</button></div></form>`:'';
  const hist=l.history.slice().reverse().map(h=>`<li><span>${esc(h.text)}</span><small>${esc(h.by?leadWho(h.by):'Система')} · ${esc(fWhen(h.at))}</small></li>`).join('');
  const tab=LEAD_TABS.some(t=>t[0]===S.ui.leadTab)?S.ui.leadTab:'details',nOpen=Acts.open(S,{t:'lead',id:l.id}).length;
  const tabs=`<div class="dtabs" role="tablist" aria-label="Разделы карточки">${LEAD_TABS.map(([k,v])=>`<button type="button" role="tab" class="dtab${tab===k?' on':''}" aria-selected="${tab===k}" data-act="lead-tab" data-tab="${k}">${v}${k==='feed'&&nOpen?`<b>${nOpen}</b>`:''}</button>`).join('')}</div>`;
  const wait=Leads.waiting(S,l,new Date()),waitNote=wait===null?'':`<p class="lead-waitnote">${leadWaitHtml(l)}<span>С лидом никто не работал дольше ${Leads.waitMin(S)} мин: нажмите «Взять» или запланируйте звонок во вкладке «Лента».</span></p>`;
  const details=`
    <dl class="kv"><dt>Источник</dt><dd>${leadSrcPill(l)}${leadDemoPill(l)}</dd><dt>Пришёл</dt><dd>${esc(fWhen(l.at))}</dd><dt>Тип</dt><dd>${leadTypePill(l)}</dd><dt>Менеджер</dt><dd>${leadMgrCell(l)}</dd>
      <dt>Контакт</dt><dd>${l.name?esc(l.name):leadNoData('имя')}</dd><dt>Телефон</dt><dd>${l.phone?esc(l.phone):leadNoData('телефон')}</dd><dt>Почта</dt><dd>${l.email?esc(l.email):leadNoData('почта')}</dd>
      ${l.company?`<dt>Компания</dt><dd>${esc(l.company)}</dd>`:''}${l.inn?`<dt>ИНН</dt><dd>${esc(l.inn)}</dd>`:''}${l.reason?`<dt>Причина отказа</dt><dd>${esc(l.reason)}</dd>`:''}${l.dealId?`<dt>Сделка</dt><dd>${esc(l.dealId)}</dd>`:''}</dl>
    <div><h4 class="sh">Текст заявки</h4><p class="prose">${l.text?esc(l.text):leadNoData('текст заявки')}</p></div>
    ${tr}
    <div><h4 class="sh">История</h4><ul class="mv">${hist}</ul></div>`;
  return {kind:'Лид '+l.id,title:esc(Leads.title(l)),sub:`${esc(Leads.SOURCE[l.source]||l.source)} · ${esc(fWhen(l.at))}`,body:`
    ${steps}
    ${acts?`<div class="lead-act">${acts}</div>`:''}${lock}${waitNote}${tabs}<div class="dpane">${tab==='feed'?feedHtml({t:'lead',id:l.id}):details}</div>`};
}

// ——— окно «Закрыть лид» ———
// Причина — из общего списка (Deals.reasons, «Настройки → Лиды и сделки»). Вариант «Другое» открывает поле для своих слов:
// если такой причины в списке нет, окно добавляет её последней строкой. Список пуст — сразу поле для своих слов.
const LEAD_OTHER='__other';
const leadOtherName=list=>list.find(r=>r.trim().toLowerCase()==='другое')||null;
const leadIsOther=v=>v===LEAD_OTHER||v.trim().toLowerCase()==='другое';
MODALS.leadLost=id=>{
  const l=leadById(id),why=Deals.reasons(S);
  const opts=why.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('')+(leadOtherName(why)?'':`<option value="${LEAD_OTHER}">Другое — своими словами</option>`);
  return `<form data-form="lead-lost" data-id="${esc(id)}" novalidate>${mHead('Закрыть лид '+esc(id))}<div class="modal-b">
    <p class="m0">${l?esc(Leads.title(l)):''}</p>
    <div class="field"><label for="ll-reason">Причина отказа</label><select id="ll-reason" class="inp" data-on="lead-reason">${opts}</select></div>
    <div class="field" id="ll-other-f"${leadIsOther(why[0]||LEAD_OTHER)?'':' hidden'}><label for="ll-other">Своими словами</label><textarea id="ll-other" class="inp" rows="3" placeholder="Например: выбрал другого поставщика"></textarea></div>
    <p class="hint">Лид уйдёт на этап «Отказ», причина запишется в его историю. Вернуть закрытый лид нельзя. Список причин правят в «Настройки → Лиды и сделки».</p>
    <p class="err" id="ll-err" hidden></p></div>${mFoot('Закрыть лид')}</form>`;
};
// Причина из окна: выбранная из списка, а у «Другое» — то, что написано своими словами
function leadReasonOf(){
  const v=byId('ll-reason').value.trim();
  return leadIsOther(v)?byId('ll-other').value.trim():v;
}

// ——— окно «Новый лид» ———
// Тип лида и менеджера ставит ядро (Leads.add → classify, route); до сохранения — подсказка «Похоже, это клиент …»
// (clientDupHtml из «Клиентов»), и лид можно привязать к найденному. Выбранный клиент хранится в S.ui.leadClient (не сохраняется).
MODALS.leadNew=()=>{
  const f=(id,label,html,cls)=>`<div class="field${cls?' '+cls:''}"><label for="ln-${id}">${label}</label>${html}</div>`;
  const inp=(id,type,dup,mode)=>`<input id="ln-${id}" class="inp" type="${type}"${mode?` inputmode="${mode}"`:''}${dup?' data-on="lead-dup"':''} autocomplete="off">`;
  return `<form data-form="lead-new" novalidate>${mHead('Новый лид')}<div class="modal-b">
    <div class="grid2">${f('source','Откуда пришёл',`<select id="ln-source" class="inp">${Object.entries(Leads.SOURCE).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}</select>`)}
      ${f('name','Имя',inp('name','text'))}${f('phone','Телефон',inp('phone','tel',1))}${f('email','Почта',inp('email','email',1))}
      ${f('company','Компания',inp('company','text'))}${f('inn','ИНН',inp('inn','text',1,'numeric'))}
      ${f('text','Текст заявки','<textarea id="ln-text" class="inp" rows="3" placeholder="Что просит клиент"></textarea>','span2')}</div>
    <div id="ln-dup" aria-live="polite">${leadDupHtml()}</div>
    <p class="hint">Тип лида (B2B или B2C) определится сам: компания или ИНН — B2B, иначе телефон или почта — B2C. Менеджера выберет система. Нужно хотя бы имя, телефон, почта или компания.</p>
    <p class="err" id="ln-err" hidden></p></div>${mFoot('Завести лид')}</form>`;
};
// Подсказка о похожем клиенте по тому, что уже введено; «Выбрать его» из «Клиентов» здесь превращается в «Привязать лид»
function leadDupHtml(){
  const v=id=>(byId(id)||{}).value||'',c=S.ui.leadClient&&Clients.byId(S,S.ui.leadClient);
  if(c) return `<div class="dup" role="status"><p class="dup-t m0">${ic('check')}<span>Лид будет привязан к клиенту <b>${esc(c.name)}</b><small>${esc(c.id)}${c.demo?' · пример':''}</small></span></p><div><button type="button" class="btn sm" data-act="lead-unlink">Не привязывать</button></div></div>`;
  return clientDupHtml({phone:v('ln-phone'),email:v('ln-email'),inn:v('ln-inn')}).replace(/data-act="dup-pick"([^>]*)>Выбрать его</g,'data-act="lead-link"$1>Привязать лид<');
}

// ——— действия: каждое — запись в историю (ядро) и короткое подтверждение ———
// need — что требуется от человека по Leads.can: take, work, deal, transfer
function leadAct(id,need,run,done){
  const l=leadById(id);if(!l) return null;
  if(!Leads.can(S,id,S.me)[need]){toast(leadWhy(l,need),'warn');return null}
  const r=run(new Date());
  if(!r){toast(`Лид ${id}: не получилось.`,'warn');return null}
  render();toast(done(r));return r;
}
// Перевести лид на этап: из воронки (перетаскивание) и из кнопок карточки. Всё — через Leads.move
function leadMoveTo(id,stageId){
  const l=leadById(id),to=l&&Pipes.stage(S,l.pipeId,stageId);
  if(!l||!to||to.id===l.stageId) return null;
  const c=Leads.can(S,id,S.me);
  if(!c.work){toast(leadWhy(l,'work'),'warn');return null}
  if(stageId===Leads.STAGE.lost){openModal('leadLost',id);return null}
  if(stageId===Leads.STAGE.deal&&!c.deal){toast(leadWhy(l,'deal'),'warn');return null}
  const r=Leads.move(S,id,stageId,S.me,new Date());
  if(!r){toast(`Лид ${id} на этап «${to.name}» не переносится.`,'warn');return null}
  render();
  if(stageId===Leads.STAGE.deal){
    const d=S.deals.find(x=>x.id===r.dealId);
    toast(`Сделка ${d.id} создана из лида ${id}: контакт и текст заявки перенесены. Воронка «${pipeById(d.pipeId).name}», менеджер — ${leadWho(d.managerId)}.`);
  }else toast(`Лид ${id} теперь на этапе «${to.name}». Запись в истории есть.`);
  return r;
}

A['open-lead']=el=>{S.ui.leadTab='details';openDrawer('lead',el.dataset.id)};
A['lead-tab']=el=>{S.ui.leadTab=el.dataset.tab;render()};
A['lead-new']=()=>{S.ui.leadClient=null;openModal('leadNew')};
A['lead-link']=el=>{
  const c=Clients.byId(S,el.dataset.id);if(!c) return;
  S.ui.leadClient=c.id;const box=byId('ln-dup');if(box) box.innerHTML=leadDupHtml();
  toast(`Лид будет привязан к существующему клиенту ${c.id}: ${c.name}. Новый клиент не заводится.`);
};
A['lead-unlink']=()=>{S.ui.leadClient=null;const box=byId('ln-dup');if(box) box.innerHTML=leadDupHtml()};
A['lead-view']=el=>{leadU().view=el.dataset.v==='funnel'?'funnel':'list';render()};
A['lead-free']=()=>{const u=leadU();u.manager=u.manager==='none'?'':'none';render()};

// драг и дроп: столбцы воронки лидов — data-lcol (задачи в оболочке — data-col, они не пересекаются)
document.addEventListener('dragover',e=>{
  const col=e.target.closest?.('[data-lcol]');if(!col) return;
  e.preventDefault();
  document.querySelectorAll('.col.drop').forEach(x=>{if(x!==col) x.classList.remove('drop')});col.classList.add('drop');
});
document.addEventListener('drop',e=>{
  const col=e.target.closest?.('[data-lcol]');if(!col) return;
  e.preventDefault();col.classList.remove('drop');
  const id=e.dataTransfer.getData('text/plain');
  if(id&&leadById(id)) leadMoveTo(id,col.dataset.lcol);
});

// ——— имитация: пришёл лид ———
// Заявки по кругу: компания, телефон, только ИНН, только почта — чтобы видно было и B2B, и B2C.
// Всё явно ненастоящее: имена «пример», телефоны +7 900 000-01-NN, почта на example.com.
const LEAD_SIM=[
  {company:'ООО „Пример-Имитация“',phone:'+7 900 000-01-',text:'Пример заявки (имитация): нужна станция для объекта компании, просим прислать КП.'},
  {phone:'+7 900 000-01-',text:'Пример заявки (имитация): интересует станция для дома, просьба перезвонить.'},
  {inn:'0000001',text:'Пример заявки (имитация): нужен расчёт резервного питания для склада.'},
  {email:'sim-primer@example.com',text:'Пример заявки (имитация): написал на почту, хочет узнать про ветро-солнечную станцию для дачи.'},
];
function leadSimulate(source){
  if(!Object.hasOwn(Leads.SOURCE,source)) return null;
  if(!Leads.allows(S,source)){
    toast(`Источник «${Leads.SOURCE[source]}» сейчас не используется: в «Настройки → Лиды и сделки» выбрано «${Leads.SOURCES[S.leadSource]||Leads.SOURCES.both}». Лид не создан.`,'warn');
    return null;
  }
  const n=(S.leads||[]).filter(l=>l.sim).length+1,k=LEAD_SIM[(n-1)%LEAD_SIM.length],nn=String(n%100).padStart(2,'0');
  const data={source,demo:true,name:`Клиент-пример (имитация ${n})`,text:k.text};
  if(k.company){data.company=k.company;data.name=`Контакт-пример (имитация ${n})`}
  if(k.phone) data.phone=k.phone+nn;
  if(k.inn) data.inn=k.inn+String(n%1000).padStart(3,'0');
  if(k.email) data.email=k.email;
  const lead=Leads.create(S,data,new Date());
  lead.sim=true;
  const note=S.notes[0],got=note&&note.kind==='lead'?note.to.length:0;
  render();
  toast(`Пришёл лид ${lead.id} (${Leads.SOURCE[source]}, «пример»). ${lead.managerId?`Тип ${Leads.TYPE[lead.type]}, менеджер — ${leadWho(lead.managerId)}.`:'Менеджера нет — лид нераспределённый.'} Уведомление получили: ${got}.`);
  return lead;
}
// Результат имитации для «Пульта проверки»: {text — что произошло, view — где смотреть, id — карточка}
const leadSimResult=(source)=>{
  const l=leadSimulate(source);
  if(!l) return {text:`Лид не создан: источник «${Leads.SOURCE[source]}» сейчас не используется. Источник выбирают в «Настройки → Лиды и сделки».`,view:'settings'};
  return {text:`Пришёл лид ${l.id} (${Leads.SOURCE[source]}, «пример»). ${l.managerId?`Тип ${Leads.TYPE[l.type]}, менеджер: ${leadWho(l.managerId)}`:'Менеджера нет — лид нераспределённый'}`,view:'leads',id:l.id};
};

// Раздел «Почта»: слева ящики и папки поставщиков со счётчиками непрочитанных, в середине список писем с поиском,
// справа письмо. Это имитация: ответ только ложится в ветку письма с пометкой, наружу ничего не уходит.
// Всё считает ядро Mail (ящики, папки, поиск, «запомнить», ответ, приход письма); здесь — только экран.
// Выбор на экране (ящик, папка, письмо, поиск) лежит в S.ui.mail и не сохраняется; вид его читает через mailSel()
// и ничего не меняет. На телефоне показывается один столбец (S.ui.mail.pane: nav · list · letter) с кнопкой «назад».

Object.assign(IC,{
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 7.5l8.5 6 8.5-6"/>',
  back:'<path d="M15 5l-7 7 7 7"/>'
});

const MAIL_LATER='подключение — на следующем этапе';
const MAIL_NO_ADDR='нет данных: адрес';

const mailData=()=>S.mail||{boxes:[],suppliers:[],letters:[]};
const mailU=()=>S.ui.mail||(S.ui.mail={});

// Что выбрано сейчас: ящик из видимых этому человеку, папка (только в ящике закупок), письмо, поиск, столбец на телефоне.
function mailSel(){
  const m=mailData(),u=S.ui.mail||{},boxes=Mail.boxesFor(S,S.me);
  const box=boxes.find(b=>b.id===u.box)||boxes[0]||null;
  const purchase=!!box&&box.kind==='purchase';
  const folder=purchase&&(u.folder===Mail.INBOX||m.suppliers.some(s=>s.id===u.folder))?u.folder:'all';
  const letter=box&&u.letter?m.letters.find(l=>l.id===u.letter&&l.boxId===box.id)||null:null;
  const pane=letter&&u.pane==='letter'?'letter':u.pane==='nav'?'nav':'list';
  return {boxes,box,purchase,folder,q:String(u.q||''),letter,pane,reply:!!letter&&u.reply===letter.id};
}
// Письма выбранного ящика и папки с учётом поиска — одним поиском ядра
const mailList=sel=>sel.box?Mail.search(S,{boxId:sel.box.id,folder:sel.folder==='all'?'':sel.folder,q:sel.q}):[];
// Непрочитанные в ящике или в его папке — единственный счёт для счётчиков в папках, ящиках и меню
const mailUnread=(boxId,folder)=>Mail.search(S,{boxId,folder:folder&&folder!=='all'?folder:''}).filter(l=>!l.read).length;
const mailUnreadAll=()=>Mail.boxesFor(S,S.me).reduce((n,b)=>n+mailUnread(b.id),0);
const mailFolderName=(box,l)=>{const s=mailData().suppliers.find(x=>x.id===l.folder);return s?s.name:box&&box.kind==='purchase'?'Разобрать':'Входящие'};
const mailCnt=n=>n?`<span class="cnt hot">${n}</span>`:'';

function mailNav(sel){
  const m=mailData();
  const boxes=sel.boxes.map(b=>{
    const on=b.id===sel.box?.id,n=mailUnread(b.id);
    let h=`<button type="button" class="mail-box${on?' on':''}" data-act="mail-box" data-id="${esc(b.id)}"><span class="mail-box-t"><b>${esc(b.title)}</b>${mailCnt(n)}</span><small class="${b.address?'':'muted'}">${b.address?esc(b.address):MAIL_NO_ADDR}</small>${b.added?`<span class="pill sun sm">${MAIL_LATER}</span>`:''}</button>`;
    if(on&&b.kind==='purchase'){
      const f=(id,label,example)=>`<button type="button" class="mail-fold${sel.folder===id?' on':''}" data-act="mail-folder" data-folder="${esc(id)}"><span>${esc(label)}${example?' <span class="pill sm">пример</span>':''}</span>${mailCnt(mailUnread(b.id,id))}</button>`;
      h+=`<div class="mail-folds">${f('all','Все письма')}${f(Mail.INBOX,'Разобрать')}${m.suppliers.map(s=>f(s.id,s.name,s.example)).join('')}</div>`;
    }
    return h;
  }).join('');
  return `<aside class="mail-nav card"><div class="card-h"><h3>Ящики</h3></div><div class="mail-nav-b">${boxes}</div></aside>`;
}

function mailItems(sel){
  const list=mailList(sel),un=list.filter(l=>!l.read).length;
  const head=`<p class="count"><span>${sel.q.trim()?'Найдено':'Писем'}: <b>${list.length}</b></span><span>непрочитанных: <b>${un}</b></span></p>`;
  if(!list.length) return head+(sel.q.trim()?emptyState('По этому запросу писем нет.','Очистить поиск','mail-q-clear'):sel.box&&sel.box.added?emptyState(`В новом ящике писем пока нет — ${MAIL_LATER}.`):emptyState(`В этой папке писем нет. Письма приходят сами.${can('admin')?' Пока почта не подключена, проверить можно «Имитацией» в «Пульте проверки».':''}`));
  return head+`<ul class="mail-items">${list.map(l=>{
    const sn=l.body.replace(/\s+/g,' ').slice(0,90);
    return `<li><button type="button" class="mail-li${l.read?'':' unread'}${l.id===sel.letter?.id?' on':''}" data-act="mail-open" data-id="${esc(l.id)}"><span class="mail-li-top"><b>${esc(l.fromName||l.from)}</b><small>${esc(fWhen(l.at))}</small></span><span class="mail-li-sub">${esc(l.subject)}</span><span class="mail-li-sn">${esc(sn)}</span><span class="mail-li-tags">${l.demo?'<span class="pill sm">пример</span>':''}${sel.purchase&&sel.folder==='all'?`<span class="pill sm info">${esc(mailFolderName(sel.box,l))}</span>`:''}${(l.replies||[]).length?'<span class="pill sm sun">есть ответ</span>':''}</span></button></li>`;
  }).join('')}</ul>`;
}

function mailListPane(sel){
  const m=mailData();
  const fname=!sel.purchase||sel.folder==='all'?'':sel.folder===Mail.INBOX?'Разобрать':(m.suppliers.find(s=>s.id===sel.folder)?.name||'');
  return `<section class="mail-list card"><div class="mail-bar">
    <button type="button" class="btn ghost sm mail-back" data-act="mail-back">${ic('back')}Ящики и папки</button>
    <div class="mail-title"><b>${esc(sel.box.title)}</b>${fname?`<small>${esc(fname)}</small>`:''}</div>
    <div class="search-in">${ic('search')}<input id="mail-q" class="inp" type="search" placeholder="Поиск: отправитель, тема, текст" value="${esc(sel.q)}" data-on="mail-q" autocomplete="off" aria-label="Поиск по письмам"></div>
    <button type="button" class="btn sm" data-act="mail-sim" data-box="${esc(sel.box.id)}">${ic('plus')}Имитация: пришло письмо</button>
  </div><div id="mail-items">${mailItems(sel)}</div></section>`;
}

function mailRememberBox(sel,l){
  const m=mailData();
  if(!sel.purchase||l.folder!==Mail.INBOX) return '';
  if(!m.suppliers.length) return `<div class="mail-rem"><p class="hint">Это письмо лежит в «Разобрать». Поставщиков пока нет — добавьте их в «Настройки → Почта», и письма будут раскладываться по папкам.</p></div>`;
  const addr=(String(l.from).match(/<([^>]*)>/)?.[1]||l.from).trim().toLowerCase(),dom=addr.includes('@')?addr.slice(addr.lastIndexOf('@')):'';
  return `<form class="mail-rem" data-form="mail-remember" data-id="${esc(l.id)}" novalidate>
    <b>Это поставщик?</b>
    <div class="mail-rem-f">
      <div class="field"><label for="mail-sup">Это поставщик</label><select id="mail-sup" class="inp"><option value="">— выберите —</option>${m.suppliers.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="mail-mode">Запомнить</label><select id="mail-mode" class="inp"><option value="address">этот адрес — ${esc(addr)}</option>${dom?`<option value="domain">весь домен — ${esc(dom)}</option>`:''}</select></div>
      <button type="submit" class="btn pri">Запомнить адрес</button>
    </div>
    <p class="hint">Письма с этого адреса (или домена) перейдут в папку поставщика, новые будут ложиться туда сами.</p>
    <p class="err" id="mail-err" hidden></p></form>`;
}

function mailLetterPane(sel){
  const l=sel.letter;
  if(!l) return `<article class="mail-letter card mail-empty"><p class="empty">Выберите письмо в списке.</p></article>`;
  const replies=(l.replies||[]).map(r=>`<div class="mail-reply"><div class="mail-reply-h"><b>Ответ: ${esc(person(r.by)?.name||'нет данных: сотрудник')}</b><small>${esc(fWhen(r.at))}</small><span class="pill sun sm">${esc(r.note||Mail.SIM_NOTE)}</span>${r.demo?'<span class="pill sm">пример</span>':''}</div><p>${esc(r.text)}</p></div>`).join('');
  const form=sel.reply
    ?`<form class="mail-reply-f" data-form="mail-reply" data-id="${esc(l.id)}" novalidate><div class="field"><label for="mail-reply-text">Ваш ответ</label><textarea id="mail-reply-text" class="inp" rows="4" placeholder="Текст ответа"></textarea></div><p class="hint">${Mail.SIM_NOTE}: ответ ляжет в ветку письма, наружу ничего не уйдёт.</p><p class="err" id="mail-reply-err" hidden></p><div class="mail-reply-btns"><button type="button" class="btn" data-act="mail-reply-cancel">Отмена</button><button type="submit" class="btn pri">Записать ответ</button></div></form>`
    :`<div><button type="button" class="btn" data-act="mail-reply">${ic('send')}Ответить</button></div>`;
  return `<article class="mail-letter card"><div class="mail-lh">
    <button type="button" class="btn ghost sm mail-back" data-act="mail-back">${ic('back')}К списку</button>
    <h2>${esc(l.subject)}</h2>
    <p class="mail-meta"><span>От: <b>${esc(l.fromName||l.from)}</b>${l.fromName?` &lt;${esc(l.from)}&gt;`:''}</span><span>${esc(fWhen(l.at))}</span><span>Ящик «${esc(sel.box.title)}» · ${esc(mailFolderName(sel.box,l))}</span>${l.demo?'<span class="pill sm">пример</span>':''}</p>
  </div><div class="mail-body">${esc(l.body)}</div>
  ${replies?`<div class="mail-replies"><h4>Ответы</h4>${replies}</div>`:''}
  <div class="mail-act">${form}${mailRememberBox(sel,l)}</div></article>`;
}

function vMail(){
  const sel=mailSel();
  if(!sel.box) return `<section class="card"><p class="empty">Для вашей роли нет ни одного ящика. Ящики и кто их видит — в «Настройки → Почта».</p></section>`;
  return `<p class="hint mail-hint">Почта — имитация: письма примерные, настоящий ящик не подключён, ответы наружу не уходят.</p>
  <div class="mail" data-pane="${sel.pane}">${mailNav(sel)}${mailListPane(sel)}${mailLetterPane(sel)}</div>`;
}

VIEWS.mail=vMail;

  if(!r) return showErr('mail-reply-err','Напишите текст ответа.');
  mailU().reply=null;render();
  toast(`Ответ записан в ветку письма — ${Mail.SIM_NOTE}.`);
};
FORMS['mail-remember']=f=>{
  const supId=byId('mail-sup').value;
  if(!supId) return showErr('mail-err','Выберите поставщика.');

  const sup=mailData().suppliers.find(s=>s.id===supId);

};

// ——— имитация: пришло письмо ———
// Поочерёдно: письмо от известного поставщика (ляжет в его папку) и от незнакомого адреса (в «Разобрать»).
// В ящике без папок поставщиков — письмо клиента. Кладёт Mail.deliver: он же рассылает уведомление тем, кто видит ящик.
function mailSimulate(boxId){
  const m=mailData();
  const box=m.boxes.find(b=>b.id===boxId)||m.boxes.find(b=>b.kind==='purchase')||m.boxes[0];
  if(!box){toast('Ящиков нет — письму некуда прийти.','warn');return null}
  const n=m.letters.filter(l=>l.sim).length+1;
  let from,fromName,subject;
  const known=m.suppliers.filter(s=>(s.rules||[]).length);
  if(box.kind==='purchase'&&n%2===1&&known.length){
    const s=known[((n-1)/2)%known.length],r=s.rules[0];
    from=r.startsWith('@')?'sim'+r:r;fromName=s.name;subject='Пример: письмо от поставщика';
  }else if(box.kind==='purchase'){
    from=`new-${n}@unknown-${n}.example`;fromName='Незнакомый отправитель (пример)';subject='Пример: письмо от незнакомого адреса';
  }else{
    from=`client-sim-${n}@clients.example`;fromName='Клиент-пример';subject='Пример: вопрос от клиента';
  }
  const l=Mail.deliver(S,{boxId:box.id,from,fromName,subject,body:'Это пример входящего письма для проверки. Настоящая почта не подключена: письмо создано кнопкой «Имитация».',demo:true},new Date());
  if(!l) return null;
  l.sim=true;
  const to=(S.notes[0]&&S.notes[0].kind===Mail.NOTE_KIND?S.notes[0].to:[]).length;
  render();
  toast(`Пришло письмо в ящик «${box.title}», папка «${mailFolderName(box,l)}». Уведомление получили: ${to}.`);
  return l;
}
// Результат имитации для «Пульта проверки»: {text — что произошло, view — где смотреть, id — карточка}
SIMS.push({id:'mail',label:'Имитация: пришло письмо',run:()=>{
  const l=mailSimulate();
  if(!l) return {text:'Письмо не пришло: нет ящика, куда ему прийти.',view:'mail'};
  const box=mailData().boxes.find(b=>b.id===l.boxId);
  return {text:`Пришло письмо «${l.subject}» в ящик «${box.title}», папка «${mailFolderName(box,l)}».`,view:'mail',id:l.id};
}});

// «Настройки → Воронки»: один редактор для всех воронок — доски задач, сделки B2B и B2C, лиды, поставки, отправки.
// Тот же редактор зовёт режим «Редактировать доску» в «Задачах» (52-tasks.js): разметку дают pipeNameCtl, pipeStageCtl и
// pipeEditor, действия — A['pipe-*'] и FORMS['pipe-*'] ниже. Данные правит только ядро Pipes (32-pipes.js):
// оно же не даёт потерять записи, правила поставок и этапы, на которых держится логика.
// Выбор воронки и группы — S.ui.pipeGroup, S.ui.pipeSel (не сохраняется).

// Группы выбора. add — можно заводить новые воронки группы (их умеют показывать «Задачи» и «Сделки»);
// у лидов, поставок и отправок разделы работают с первой воронкой, поэтому там правятся только этапы.
const PIPE_GROUPS=[
  {id:'tasks',label:'Доски задач',kind:'tasks',add:'доска',where:'Колонки досок в разделе «Задачи».'},
  {id:'b2b',label:'Сделки B2B',kind:'deals',scope:'b2b',add:'воронка',where:'Колонки канбана в разделе «Сделки», тип B2B.'},
  {id:'b2c',label:'Сделки B2C',kind:'deals',scope:'b2c',add:'воронка',where:'Колонки канбана в разделе «Сделки», тип B2C.'},
  {id:'leads',label:'Лиды',kind:'leads',where:'Этапы лидов в разделе «Лиды».'},
  {id:'ships',label:'Поставки',kind:'ships',where:'Этапы поставок: вид «Воронка» в разделе «Поставки и перевозки», правила в «Настройки → Поставки».'},
  {id:'dispatch',label:'Отправки',kind:'dispatch',where:'Этапы заявок в разделе «Отправки».'},
];
const PIPE_FLAG={final:'завершающий',arrived:'прибыло, ждёт приёмки'};

const pipeGroup=()=>PIPE_GROUPS.find(g=>g.id===S.ui.pipeGroup)||PIPE_GROUPS[0];
const groupPipes=g=>Pipes.of(S,g.kind,g.scope).filter(p=>!g.scope||p.scope===g.scope);
// Воронка, открытая в настройках: выбранная в группе, иначе первая
const pipeSel=()=>{const ps=groupPipes(pipeGroup());return ps.find(p=>p.id===S.ui.pipeSel)||ps[0]||null};
const pipeNoun=p=>p.kind==='tasks'?'доска':'воронка';
const pipeAcc=p=>p.kind==='tasks'?'доску':'воронку';

// ——— разметка редактора: её берут и настройки, и доска задач ———
const pipeNameCtl=p=>`<input class="inp pe-name" data-on="pipe-name" data-pipe="${esc(p.id)}" value="${esc(p.name)}" aria-label="Название: ${esc(pipeNoun(p))}" autocomplete="off">`;

// Один этап: имя правится на месте; вместо «×» у этапа, на котором держится логика, — замок. full — с пояснением словами.
function pipeStageCtl(p,s,full){
  const why=Pipes.why(S,p.id,s.id),attrs=`data-pipe="${esc(p.id)}" data-stage="${esc(s.id)}"`;
  const act=why
    ?`<button type="button" class="btn ghost icon sm pe-lock" data-act="pipe-lock" ${attrs} title="${esc(Pipes.lock(S,p.id,s.id))}" aria-label="Этап «${esc(s.name)}» защищён: ${esc(why)}">${ic('lock')}</button>`
    :`<button type="button" class="btn ghost icon sm" data-act="pipe-stage-del" ${attrs} title="Удалить этап" aria-label="Удалить этап «${esc(s.name)}»">${ic('x')}</button>`;
  return `<div class="pe-stage"><input class="inp sm pe-sname" data-on="pipe-stage-name" ${attrs} value="${esc(s.name)}" aria-label="Название этапа" autocomplete="off">${act}</div>`
    +(full&&why?`<small class="pe-why">${ic('lock')}Защищён: ${esc(why)}. Название менять можно, удалить нельзя.</small>`:'');
}

// Имя воронки и «удалить»: для последней воронки своего рода кнопка выключена и объясняет почему
function pipeBoardHead(p){
  const last=Pipes.siblings(S,p.id).length<2,n=pipeNoun(p),acc=pipeAcc(p);
  return `<div class="pe-head">${pipeNameCtl(p)}<button type="button" class="btn sm" data-act="pipe-del" data-pipe="${esc(p.id)}" ${last?'disabled':''} title="${last?`Последнюю ${acc} удалить нельзя`:''}">Удалить ${acc}</button></div>`
    +(last?`<p class="hint">Последнюю ${acc} удалить нельзя: записям некуда переехать.</p>`:'');
}

// Весь редактор воронки (для настроек): имя, этапы строками с числом записей, «+ этап»
function pipeEditor(p,g){
  const rows=p.stages.map((s,i)=>{
    const n=Pipes.usage(S,p.id,s.id).items;
    return `<li class="pe-row"><span class="pe-n">${i+1}</span><div class="pe-main">${pipeStageCtl(p,s,true)}</div>${s.flag?`<span class="pill sm">${esc(PIPE_FLAG[s.flag]||s.flag)}</span>`:''}<span class="muted sm pe-cnt">${n?`${n} ${pl(n,'запись','записи','записей')}`:'пусто'}</span></li>`;
  }).join('');
  const lastName=p.stages[p.stages.length-1]?.name||'';
  return `<section class="card"><div class="card-h"><h3 data-pipe-title="${esc(p.id)}">${esc(p.name)}</h3><span class="muted sm">${p.stages.length} ${pl(p.stages.length,'этап','этапа','этапов')} · ${esc(g.where)}</span></div><div class="card-b stack-s">
    ${g.add?pipeBoardHead(p):`<div class="pe-head">${pipeNameCtl(p)}</div>`}
    <ol class="pe-list">${rows}</ol>
    <div class="pe-foot"><button type="button" class="btn" data-act="pipe-stage-add" data-pipe="${esc(p.id)}">${ic('plus')}этап</button><span class="hint">Новый этап встаёт перед завершающими: «${esc(lastName)}» остаётся последним. Переименование видно в разделе сразу.</span></div>
  </div></section>`;
}

function vPipes(){
  const g=pipeGroup(),ps=groupPipes(g),p=pipeSel();
  const groups=`<div class="seg" role="group" aria-label="Что настраиваем">${PIPE_GROUPS.map(x=>`<button type="button" class="${x===g?'on':''}" data-act="pipe-group" data-g="${x.id}">${x.label}</button>`).join('')}</div>`;
  const picks=(ps.length>1||g.add)?`<div class="bar">${ps.length>1?`<div class="seg" role="group" aria-label="Какая воронка">${ps.map(x=>`<button type="button" class="${p&&x.id===p.id?'on':''}" data-act="pipe-pick" data-id="${esc(x.id)}">${esc(x.name)}</button>`).join('')}</div>`:''}${g.add?`<button type="button" class="btn sm" data-act="pipe-add" data-g="${g.id}">${ic('plus')}${g.add}</button>`:''}</div>`:'';
  return `<div class="bar">${groups}</div>${picks}<p class="hint">Воронка — цепочка этапов, по которой идёт запись. Здесь меняют названия этапов, добавляют и удаляют их; записи с удаляемого этапа CRM переносит туда, куда вы скажете. Этапы с замком — на них держится логика CRM, их можно только переименовать.</p>${p?pipeEditor(p,g):'<p class="empty">Воронок этого вида нет.</p>'}`;
}

SETTINGS_TABS.push({id:'pipes',label:'Воронки',order:30,ok:()=>can('settings'),render:vPipes});

// ——— окна: куда перенести записи ———
const pipeOpt=(x,sel)=>`<option value="${esc(x.id)}" ${sel?'selected':''}>${esc(x.name)}</option>`;
// Ключ окна «pipeId|stageId»
MODALS.pipeStageDel=key=>{
  const [pid,sid]=String(key).split('|'),p=pipeById(pid),s=p&&Pipes.stage(S,pid,sid);
  if(!s) return '';
  // куда переносить — решает ядро (Pipes.moveTargets): завершающие этапы («На складе», «Сдана», «Доставлена»…) запись получает
  // только своим действием, поэтому здесь их нет; по умолчанию — ближайший следующий из разрешённых
  const u=Pipes.usage(S,pid,sid),i=p.stages.indexOf(s),rest=Pipes.moveTargets(S,pid,sid);
  const next=p.stages.slice(i+1).find(x=>rest.includes(x))||[...p.stages.slice(0,i)].reverse().find(x=>rest.includes(x));
  const what=[u.items?`${u.items} ${pl(u.items,'запись','записи','записей')}`:'',u.rules?`${u.rules} ${pl(u.rules,'правило','правила','правил')} поставок`:''].filter(Boolean).join(' и ');
  if(!rest.length) return `${mHead('Удалить этап «'+esc(s.name)+'»?')}<div class="modal-b"><p class="m0">${esc(Pipes.stuck(S,pid,sid))}</p></div>`;
  return `<form data-form="pipe-stage-del" data-pipe="${esc(pid)}" data-stage="${esc(sid)}" novalidate>${mHead('Удалить этап «'+esc(s.name)+'»?')}<div class="modal-b">
    <p class="m0">На этапе: ${what}. Ничего не пропадёт — всё переедет на этап, который вы выберете. Завершающих этапов в списке нет: туда запись попадает только своим действием.</p>
    <div class="field"><label for="pm-to">Куда перенести</label><select id="pm-to" class="inp">${rest.map(x=>pipeOpt(x,x===next)).join('')}</select></div>
    <p class="err" id="pm-err" hidden></p></div>${mFoot('Перенести и удалить')}</form>`;
};
MODALS.pipeDel=pid=>{
  const p=pipeById(pid);
  if(!p) return '';
  const n=pipeAcc(p),cnt=Pipes.items(S,pid).length,rest=Pipes.siblings(S,pid).filter(x=>x.id!==pid);
  return `<form data-form="pipe-del" data-pipe="${esc(pid)}" novalidate>${mHead('Удалить '+n+' «'+esc(p.name)+'»?')}<div class="modal-b">
    ${cnt?`<p class="m0">В ней ${cnt} ${pl(cnt,'запись','записи','записей')}. Ничего не пропадёт — всё переедет на ${n}, которую вы выберете.</p>
    <div class="field"><label for="pd-to">Куда перенести</label><select id="pd-to" class="inp">${rest.map((x,i)=>pipeOpt(x,i===0)).join('')}</select></div>`:`<p class="m0">В ней нет записей, переносить нечего.</p>`}
    <p class="err" id="pd-err" hidden></p></div>${mFoot('Удалить')}</form>`;
};

// ——— действия: те же и в настройках, и на доске ———
const focusPipeStage=(pid,sid)=>setTimeout(()=>{const el=document.querySelector(`[data-on="pipe-stage-name"][data-pipe="${pid}"][data-stage="${sid}"]`);if(el){el.focus();el.select&&el.select()}},40);

A['pipe-group']=el=>{S.ui.pipeGroup=el.dataset.g;S.ui.pipeSel=null;render()};
A['pipe-pick']=el=>{S.ui.pipeSel=el.dataset.id;render()};
A['pipe-lock']=el=>toast(Pipes.lock(S,el.dataset.pipe,el.dataset.stage),'warn');

// Переименование перерисовку не запускает: иначе нажатие на соседнюю кнопку сразу после ввода пропало бы (поле теряет фокус

ON.change['pipe-stage-name']=t=>{

  if(!r.ok){render();return toast(r.reason,'warn')}

A['pipe-stage-add']=el=>{
  const pid=el.dataset.pipe,s=Pipes.addStage(S,pid,'Новый этап',Pipes.beforeEnd(S,pid));
  if(!s) return;
  render();toast('Этап добавлен — впишите название.');focusPipeStage(pid,s.id);
};
A['pipe-stage-del']=el=>{
  const pid=el.dataset.pipe,sid=el.dataset.stage,s=Pipes.stage(S,pid,sid),u=Pipes.usage(S,pid,sid),why=Pipes.lock(S,pid,sid);
  if(!s) return;
  if(why) return toast(why,'warn');
  if(u.items||u.rules) return openModal('pipeStageDel',pid+'|'+sid);
  const r=Pipes.removeStage(S,pid,sid);

FORMS['pipe-stage-del']=f=>{
  const pid=f.dataset.pipe,sid=f.dataset.stage,s=Pipes.stage(S,pid,sid),to=byId('pm-to').value;
  const r=Pipes.removeStage(S,pid,sid,to);
  if(!r.ok) return showErr('pm-err',r.reason);
  const dest=Pipes.stage(S,pid,to);

};

A['pipe-add']=el=>{
  const g=PIPE_GROUPS.find(x=>x.id===el.dataset.g)||pipeGroup();
  const p=Pipes.addPipe(S,g.kind,g.add==='доска'?'Новая доска':'Новая воронка',g.scope);
  if(!p) return toast('Не удалось добавить: нет образца этапов.','warn');
  S.ui.pipeGroup=g.id;S.ui.pipeSel=p.id;
  if(g.kind==='tasks') S.ui.taskBoard=p.id;
  render();toast(`Добавлена ${g.add} «${p.name}» с этапами по умолчанию. Назовите её и поправьте этапы.`);
};
A['pipe-del']=el=>{
  const p=pipeById(el.dataset.pipe);
  if(!p) return;
  if(Pipes.siblings(S,p.id).length<2) return toast(`Последнюю ${pipeAcc(p)} удалить нельзя.`,'warn');
  openModal('pipeDel',p.id);
};
FORMS['pipe-del']=f=>{
  const id=f.dataset.pipe,p=pipeById(id),to=byId('pd-to')?.value||'';
  const r=Pipes.removePipe(S,id,to);
  if(!r.ok) return showErr('pd-err',r.reason);
  if(S.ui.taskBoard===id) S.ui.taskBoard=to||null;
  if(S.ui.pipeSel===id) S.ui.pipeSel=to||null;
  if(S.ui.dealPipe===id) S.ui.dealPipe=to||null;
  closeModal();render();
  toast(`Удалена: «${p.name}».${r.moved?` ${r.moved} ${pl(r.moved,'запись','записи','записей')} переехали на «${pipeById(to).name}».`:''}`);
};

// «Настройки → Уведомления»: каждый сотрудник сам выбирает, о чём ему сообщать, и какой звук играть.

// Здесь — подписи видов, синтез звуков в браузере (WebAudio, файлов нет) и проверка «пришло ли новое» при отрисовке.

// ——— виды уведомлений по-русски, по группам ———
// Каждый вид из Notify.RECIPIENTS должен быть здесь ровно один раз (это проверяет тест): иначе его нельзя было бы выключить.

  ]},

const NOTIFY_KINDS=NOTIFY_GROUPS.flatMap(g=>g.kinds.map(([id,name,what])=>({id,name,what,group:g.title})));
const soundName=id=>(Notify.SOUNDS.find(s=>s[0]===id)||[])[1]||'нет данных: звук';

// ——— звуки: ноты ———
// Нота: f — частота, Гц (f2 — до какой частоты скользит), at — когда начать, с, dur — длина, с,
// vol — громкость 0…1, type — форма волны. Список звуков и подписи — Notify.SOUNDS.
const SOUND_NOTES={
  bell:[{f:880,at:0,dur:1.1,vol:.28,type:'sine'},{f:1760,at:0,dur:.7,vol:.12,type:'sine'},{f:2637,at:0,dur:.4,vol:.05,type:'sine'}],
  drop:[{f:1100,f2:380,at:0,dur:.28,vol:.3,type:'sine'}],
  double:[{f:740,at:0,dur:.14,vol:.2,type:'triangle'},{f:740,at:.2,dur:.14,vol:.2,type:'triangle'}],
  soft:[{f:523,at:0,dur:.5,vol:.22,type:'triangle'},{f:659,at:.16,dur:.7,vol:.2,type:'triangle'}],
};
// Один звуковой контекст на страницу (браузер не любит их десятки); Ctx — конструктор, по умолчанию из браузера.
let audio={C:null,ctx:null};
// Сыграть звук. Без WebAudio (в тестах, в старом браузере) или если браузер не дал — тишина и false, ошибки нет.
function playSound(kind,Ctx){
  const notes=SOUND_NOTES[kind];
  const C=Ctx||(typeof AudioContext!=='undefined'?AudioContext:typeof webkitAudioContext!=='undefined'?webkitAudioContext:null);
  if(!notes||!C) return false;
  try{
    if(audio.C!==C) audio={C,ctx:new C()};
    const ctx=audio.ctx,t0=ctx.currentTime;
    if(ctx.state==='suspended'&&ctx.resume) ctx.resume();
    for(const n of notes){
      const osc=ctx.createOscillator(),g=ctx.createGain(),a=t0+n.at,b=a+n.dur;
      osc.type=n.type;
      osc.frequency.setValueAtTime(n.f,a);
      if(n.f2) osc.frequency.exponentialRampToValueAtTime(n.f2,b);
      g.gain.setValueAtTime(.0001,a);
      g.gain.exponentialRampToValueAtTime(n.vol,a+.015);
      g.gain.exponentialRampToValueAtTime(.0001,b);
      osc.connect(g);g.connect(ctx.destination);
      osc.start(a);osc.stop(b+.05);
    }
    return true;
  }catch(_){return false}
}

// ——— звук при новом уведомлении ———
// render() зовёт после каждой отрисовки. Помним, какие уведомления были непрочитанными в прошлый раз;
// появилось новое и звук включён — играем. Первая отрисовка и смена «кто я» звука не дают: это не новое.
let chimeSeen=null;
let chimeLast=null;   // какой звук играл последним
let chimes=0;         // сколько раз играл
function chimeCheck(){
  const ids=Notify.unreadIds(S,S.me),before=chimeSeen&&chimeSeen.me===S.me?chimeSeen.ids:null;
  chimeSeen={me:S.me,ids};
  const kind=Notify.soundFor(S,S.me,before,ids);
  if(kind){chimeLast=kind;chimes++;playSound(kind)}
  return kind;
}

// и откуда взят каталог. Справочники лежат в S.entities и S.cities: сетка остатков, форма резерва и журнал
// берут названия оттуда же, поэтому переименование видно везде сразу.

// Название уже занято другим элементом справочника (сравнение как у товаров: регистр и пробелы не в счёт)
const nameTaken=(list,name,exceptId)=>list.some(x=>x.id!==exceptId&&Catalog.norm(x.name)===Catalog.norm(name));

// Переименование из поля data-on: пустое и занятое название не принимаются, поле возвращается к прежнему
function renameInDict(list,t,what){
  const item=list.find(x=>x.id===t.dataset.id);if(!item) return;
  const name=String(t.value).trim();
  if(!name||nameTaken(list,name,item.id)){
    t.value=item.name;
    toast(!name?'Название не может быть пустым.':`${what} «${name}» уже есть в справочнике.`,'warn');
    return;
  }
  if(name===item.name) return;
  const old=item.name;item.name=name;
  render();toast(`${what} «${old}» теперь называется «${name}».`);
}

// ——— причины отказа ———
// Список — S.lostReasons = [{id, name}]. Сделка и лид хранят сам текст причины (lostReason, reason), а не ссылку на список:
// удалить или переименовать причину можно, уже проваленные записи от этого не меняются.
const lostReasonList=st=>st.lostReasons||Deals.defaultReasons();
const lostReasonKey=s=>String(s==null?'':s).trim().toLowerCase();
// Сколько раз причина записана в проваленных сделках и закрытых лидах (по тексту)
const lostReasonUsed=(st,name)=>(st.deals||[]).filter(d=>d.lostReason===name).length+(st.leads||[]).filter(l=>l.reason===name).length;
// Проверка имени: не пустое и не повторяет другую причину (без учёта регистра). → текст ошибки или ''
function lostReasonCheck(st,name,selfId){
  const n=String(name==null?'':name).trim();
  if(!n) return 'Напишите причину отказа.';
  if(lostReasonList(st).some(r=>r.id!==selfId&&lostReasonKey(r.name)===lostReasonKey(n))) return `Причина «${n}» уже есть в списке.`;
  return '';
}
// Добавить причину. → {ok, id, reason}
function lostReasonAdd(st,name){
  const bad=lostReasonCheck(st,name);
  if(bad) return {ok:false,id:null,reason:bad};
  st.lostReasons=lostReasonList(st);
  const r={id:Store.freeId(st.lostReasons,'lr'),name:String(name).trim()};
  st.lostReasons.push(r);
  return {ok:true,id:r.id,reason:''};
}
// Переименовать причину. Тот же текст — ничего не менялось (changed:false). → {ok, changed, reason}
function lostReasonRename(st,id,name){
  const r=lostReasonList(st).find(x=>x.id===id);
  if(!r) return {ok:false,changed:false,reason:'Такой причины нет.'};
  const bad=lostReasonCheck(st,name,id);
  if(bad) return {ok:false,changed:false,reason:bad};
  const n=String(name).trim();
  if(n===r.name) return {ok:true,changed:false,reason:''};
  st.lostReasons=lostReasonList(st);
  st.lostReasons.find(x=>x.id===id).name=n;
  return {ok:true,changed:true,reason:''};
}
// Убрать причину из списка. Проваленные записи с этим текстом остаются как были. → {ok, name, reason}
function lostReasonRemove(st,id){
  const r=lostReasonList(st).find(x=>x.id===id);
  if(!r) return {ok:false,name:'',reason:'Такой причины нет.'};
  st.lostReasons=lostReasonList(st).filter(x=>x.id!==id);
  return {ok:true,name:r.name,reason:''};
}

// Настройки → «Почта»: ящики (добавить, адрес, кто видит) и поставщики (добавить, переименовать, правила-адреса,
// удалить). Данные лежат в S.mail, раздел «Почта» читает их оттуда же, поэтому правка видна там сразу.
// Правило поставщика — точный адрес (sales@firma.ru) или весь домен (@firma.ru); письма раскладывает Mail.folderOf.

const mailSame=(a,b)=>String(a).trim().toLowerCase().replace(/ё/g,'е')===String(b).trim().toLowerCase().replace(/ё/g,'е');
const MAIL_ADDR=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;

// «sales@firma.ru, @firma.ru, firma.ru» → правила; bad — то, что на адрес или домен не похоже
function mailParseRules(text){
  const rules=[],bad=[];
  for(let r of String(text||'').toLowerCase().split(/[\s,;]+/).filter(Boolean)){
    if(!r.includes('@')&&/^[^\s.]+(\.[^\s.]+)+$/.test(r)) r='@'+r;           // «firma.ru» → весь домен
    if(/^@[^@\s]+\.[^@\s]+$/.test(r)||MAIL_ADDR.test(r)){if(!rules.includes(r)) rules.push(r)}else bad.push(r);
  }
  return {rules,bad};
}
// Правило уже у другого поставщика: у одного правила один хозяин
const mailRuleOwner=(rule,exceptId)=>mailData().suppliers.find(s=>s.id!==exceptId&&(s.rules||[]).some(r=>mailSame(r,rule)))||null;
// Разложить все письма заново по правилам; → сколько писем сменили папку
function mailRefile(){
  let moved=0;
  for(const l of mailData().letters){const f=Mail.folderOf(S,l);if(f!==l.folder){l.folder=f;moved++}}
  return moved;
}
// Удаление поставщика: его письма уходят в «Разобрать», правила уходят вместе с ним
function mailDeleteSupplier(supId){
  const m=mailData(),i=m.suppliers.findIndex(s=>s.id===supId);
  if(i<0) return {ok:false,moved:0,name:''};
  const [sup]=m.suppliers.splice(i,1);
  let moved=0;
  for(const l of m.letters) if(l.folder===supId){l.folder=Mail.INBOX;moved++}
  return {ok:true,moved,name:sup.name};
}
const mailRoleNames=b=>{
  const names=S.roles.filter(r=>r.all||(b.roles||[]).includes(r.id)).map(r=>r.name);
  return names.join(', ');
};

  const {rules,bad}=mailParseRules(t.value);
  const back=()=>{t.value=(s.rules||[]).join(', ')};
  if(bad.length){back();toast(`Не похоже на адрес или домен: ${bad.join(', ')}. Пишите sales@firma.ru или @firma.ru.`,'warn');return}
  const dup=rules.map(r=>[r,mailRuleOwner(r,s.id)]).find(x=>x[1]);

FORMS['msup-add']=()=>{
  const m=mailData(),name=byId('msup-new-name').value.trim();
  if(!name) return showErr('msup-err','Напишите название поставщика.');
  if(m.suppliers.some(s=>mailSame(s.name,name))) return showErr('msup-err',`Поставщик «${name}» уже есть.`);
  const {rules,bad}=mailParseRules(byId('msup-new-rules').value);
  if(bad.length) return showErr('msup-err',`Не похоже на адрес или домен: ${bad.join(', ')}. Пишите sales@firma.ru или @firma.ru.`);
  const dup=rules.map(r=>[r,mailRuleOwner(r)]).find(x=>x[1]);
  if(dup) return showErr('msup-err',`Правило ${dup[0]} уже у поставщика «${dup[1].name}».`);
  m.suppliers.push({id:Store.freeId(m.suppliers,'sup'),name,example:false,rules});

  render();
  toast(`Поставщик «${name}» добавлен.${moved?` В его папку переехало писем: ${moved}.`:''}`);

// Число на пункте меню: открытые заявки, назначенные мне, и — у тех, кто ведёт отправки — открытые на сегодня
function dspBadge(st=S,personId=S.me,now=new Date()){
  const ids=new Set(Dispatch.query(st,{driver:personId}).filter(d=>dspIsOpen(st,d)).map(d=>d.id));
  if(Dispatch.canWork(st,personId)) Dispatch.query(st,{today:true,now}).filter(d=>dspIsOpen(st,d)).forEach(d=>ids.add(d.id));

function dspFunnel(list){

  return `<div class="xs" data-hscroll><div class="dspkan" style="--n:${pipe.stages.length}">${pipe.stages.map(s=>{
    const c=list.filter(d=>d.pipeId===pipe.id&&d.stageId===s.id);
    return `<div class="col" data-dspcol="${esc(s.id)}"><div class="col-h"><span>${esc(s.name)}</span><span class="cnt-s">${c.length}</span></div>${c.map(dspCard).join('')||'<p class="col-empty">Пусто</p>'}</div>`;
  }).join('')}</div></div>`;
}

// ——— карточка заявки ———
function dDispatch(d){
  const work=Dispatch.canWork(S,S.me),stages=dspStages(d),pos=stages.findIndex(s=>s.id===d.stageId);
  const flow=stages.filter(s=>s.id!==Dispatch.ST.cancelled),fpos=flow.findIndex(s=>s.id===d.stageId);
  const cancelled=d.stageId===Dispatch.ST.cancelled;
  const steps=cancelled?`<p class="lock">${ic('lock')}Заявка отменена.</p>`
    :`<ol class="steps" style="--n:${flow.length}">${flow.map((s,i)=>`<li class="${i<fpos?'done':s.id===d.stageId?'cur':''}"><span>${esc(s.name)}</span></li>`).join('')}</ol>`;
  // кнопки этапов — крупные, во всю ширину; ближайший этап — главная
  const nextId=(stages.slice(pos+1).find(s=>s.id!==Dispatch.ST.cancelled)||{}).id;
  const stageBtn=s=>{const back=stages.findIndex(x=>x.id===s.id)<pos;return `<button type="button" class="btn big dsp-stg${s.id===nextId?' pri':''}" data-act="dsp-stage" data-id="${esc(d.id)}" data-stage="${esc(s.id)}">${s.id===nextId?ic('arrow'):''}${back?'Вернуть на':'Перевести на'} «${esc(s.name)}»</button>`};
  const canCancel=Dispatch.canCancel(S,S.me,d);

    +(canCancel?`<button type="button" class="btn big dsp-stg dsp-cancel" data-act="dsp-cancel-ask" data-id="${esc(d.id)}">${ic('x')}Отменить заявку</button>`:'');

  // водитель: назначает тот, кто ведёт отправки
  const people=S.people.filter(p=>Dispatch.canWork(S,p.id)),isDrv=p=>p.role==='driver';

  const tel=dspTel(d.to.phone);

  const p=Dispatch.picked(d),canPick=work&&dspIsOpen(S,d);

  const canSell=Dispatch.canSell(S,S.me)&&d.purpose==='sale';
  const lines=d.items.map((it,i)=>{
    const pr=it.productId?product(it.productId):null,sold=Dispatch.soldText(S,it);
    const sellBtn=canSell&&it.productId&&!it.sold?`<button type="button" class="btn sm dsp-sell" data-act="dsp-sell" data-id="${esc(d.id)}" data-i="${i}">Списать при продаже</button>`:'';
    return `<li><label class="dsp-line"><input type="checkbox"${it.picked?' checked':''}${canPick?'':' disabled'} data-on="dsp-pick" data-id="${esc(d.id)}" data-i="${i}"><span><b>${esc(Dispatch.lineName(S,it))}</b> — ${esc(qtyOf(it.qty,pr))}${it.productId?'':' <small class="muted">своя строка</small>'}${sold?`<small class="dsp-sold">${esc(sold)}</small>`:''}</span></label>${sellBtn}</li>`;

// ——— форма «Новая отправка» / правка заявки ———
// Черновик лежит в S.ui.dspDraft: поля пишут в него по мере ввода (data-on="dsp-f"), при отправке значения ещё раз берутся из полей.
const dspDraft=()=>S.ui.dspDraft||null;
function dspDraftFrom(pre,editId){
  const p=pre||{},w=p.when||{},cell=(c,e,k)=>({e:(c&&c.entityId)||e,k:(c&&c.cityId)||k});
  const f=cell(p.from,(S.entities[0]||{}).id||'',(S.cities[0]||{}).id||''),t=cell(p.toCell,(S.entities[0]||{}).id||'',(S.cities[1]||S.cities[0]||{}).id||'');
  return {editId:editId||'',purpose:p.purpose||'sale',name:(p.to&&p.to.name)||'',phone:(p.to&&p.to.phone)||'',
    address:p.address&&p.address!==Dispatch.NO_ADDRESS&&p.purpose!=='transfer'?p.address:'',
    date:w.date?iso(w.date):'',from:w.from||'',till:w.till||'',note:p.note||'',dealId:p.dealId||'',
    fromE:f.e,fromC:f.k,toE:t.e,toC:t.k,
    // списанная при продаже строка в форме не меняется и не удаляется (Dispatch.update тоже откажет)
    items:(p.items||[]).map(i=>Object.assign(i.productId?{productId:i.productId,qty:i.qty}:{text:i.text,qty:i.qty},i.sold?{locked:true}:{})),
    files:(p.files||[]).map(x=>({...x}))};
}
// Открыть форму новой заявки. pre — те же поля, что у Dispatch.create: purpose, to, address, when, items, files, note, dealId.
function openDispatchNew(pre){S.ui.dspDraft=dspDraftFrom(pre,'');openModal('dispatchForm')}

// Окно «Списать при продаже» для строки заявки. Откуда — те же варианты, что в окне карточки товара (sellSources из 53-stock.js):
// резерв сделки заявки (он первый и выбран) и клетки «юрлицо × город» с остатком. Количество — из строки, не вводится.
