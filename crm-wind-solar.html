<title>CRM wind-solar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Цвета и шрифт — из приложения PVCalc (его tokens.css и тёмная тема): тёплый светлый фон,
   белые карточки, один зелёный акцент, солнечный янтарь — резервы и «внимание», красный — нарушения.
   Синего и фиолетового в палитре приложения нет, поэтому «в пути» и каналы связи — нейтральный серый.
   Раскладка: светлая панель разделов слева, справа рабочее поле с карточками.
   Тема: оболочка ставит на <html> data-theme="light" или "dark" (светлая, тёмная или по системе — S.prefs.theme);
   блок @media — только до запуска кода. --logo-plate — подложка логотипа: в тёмной теме светлая,
   иначе тёмная надпись Windsolar не читается. */
:root{
  --bg:#F1F2EF; --surface:#FFFFFF; --surface-2:#F7F8F6; --sunken:#E8E9E6; --line:rgba(27,29,27,.10); --line-2:rgba(27,29,27,.18); --ink:#1B1D1B; --ink-2:rgba(27,29,27,.66); --ink-3:rgba(27,29,27,.64); --primary:#0C8646; --primary-2:#0A733A; --primary-ink:#FFFFFF; --primary-soft:#E7F5EE; --primary-line:rgba(14,158,82,.28); --primary-deep:#07602F; --sun:#F5A623; --on-sun:#2A1C00; --sun-soft:#FDEFD7; --sun-ink:#8A5200; --ok:#0A7A3F; --ok-soft:#E7F5EE; --warn:#8A5200; --warn-soft:#FDEFD7; --bad:#B3261E; --bad-soft:#F7E9E8; --info:#4F524F; --info-soft:#E8E9E6; --violet:#4F524F; --violet-soft:#E8E9E6; --seg-on:#FFFFFF; --bezel:#1B1D1B; --overlay:rgba(14,18,16,.45); --on-overlay:#FFFFFF; --shadow-1:0 1px 2px rgba(20,30,24,.05),0 2px 8px rgba(20,30,24,.05); --shadow:0 4px 10px rgba(20,30,24,.08),0 20px 44px rgba(20,30,24,.14);
  --f-display:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --logo-plate:transparent;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1210; --surface:#171C1A; --surface-2:#1D2220; --sunken:#222926; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.16); --ink:#ECEFEA; --ink-2:rgba(236,239,234,.66); --ink-3:rgba(236,239,234,.60); --primary:#35C77F; --primary-2:#4FCD91; --primary-ink:#0E1210; --primary-soft:#1B3026; --primary-line:rgba(53,199,127,.32); --primary-deep:#9BE8C0; --sun:#E8B23C; --on-sun:#2A1C00; --sun-soft:#38341F; --sun-ink:#EDBE5A; --ok:#35C77F; --ok-soft:#1B3026; --warn:#EDBE5A; --warn-soft:#38341F; --bad:#E0894A; --bad-soft:#332B21; --info:#B9BDB8; --info-soft:#222926; --violet:#B9BDB8; --violet-soft:#222926; --seg-on:#393E3B; --bezel:#2A302D; --overlay:rgba(0,0,0,.55); --on-overlay:#FFFFFF; --shadow-1:0 1px 2px rgba(0,0,0,.34),0 2px 8px rgba(0,0,0,.30); --shadow:0 4px 12px rgba(0,0,0,.42),0 22px 48px rgba(0,0,0,.55);
  --logo-plate:#F1F2EF;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1210; --surface:#171C1A; --surface-2:#1D2220; --sunken:#222926; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.16); --ink:#ECEFEA; --ink-2:rgba(236,239,234,.66); --ink-3:rgba(236,239,234,.60); --primary:#35C77F; --primary-2:#4FCD91; --primary-ink:#0E1210; --primary-soft:#1B3026; --primary-line:rgba(53,199,127,.32); --primary-deep:#9BE8C0; --sun:#E8B23C; --on-sun:#2A1C00; --sun-soft:#38341F; --sun-ink:#EDBE5A; --ok:#35C77F; --ok-soft:#1B3026; --warn:#EDBE5A; --warn-soft:#38341F; --bad:#E0894A; --bad-soft:#332B21; --info:#B9BDB8; --info-soft:#222926; --violet:#B9BDB8; --violet-soft:#222926; --seg-on:#393E3B; --bezel:#2A302D; --overlay:rgba(0,0,0,.55); --on-overlay:#FFFFFF; --shadow-1:0 1px 2px rgba(0,0,0,.34),0 2px 8px rgba(0,0,0,.30); --shadow:0 4px 12px rgba(0,0,0,.42),0 22px 48px rgba(0,0,0,.55);
  --logo-plate:#F1F2EF;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.sm{font-size:12.5px}
.m0{margin:0}
.nowrap{white-space:nowrap}
.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bad-t{color:var(--bad)}.ok-t{color:var(--ok)}.warn-t{color:var(--warn)}
.xs{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack-s{display:flex;flex-direction:column;gap:14px;min-width:0}

/* ——— каркас ——— */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;overflow-y:auto;padding-block:18px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;background:var(--surface);border-right:1px solid var(--line);color:var(--ink)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:0 0 4px}
.logo{display:block;padding:6px 10px;border-radius:12px;background:var(--logo-plate)}
.logo img{display:block;width:auto;height:30px}
.brand small{display:block;padding-left:10px;font-size:11.5px;color:var(--ink-3)}
.side-b{display:flex;flex-direction:column;flex:1 0 auto}
.nav-g{display:flex;flex-direction:column;gap:2px;margin-top:20px}
.nav-g h4{margin:0 10px 6px;font:700 10.5px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.nav-i{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;border-radius:12px;background:transparent;color:var(--ink);font-size:13.5px;font-weight:500;text-align:left}
.nav-i .ic{color:var(--ink-3)}
.nav-i:hover{background:var(--surface-2)}
.nav-i.on{background:var(--primary-soft);color:var(--primary-deep);font-weight:700}
.nav-i.on .ic{color:var(--primary)}
.cnt{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:10px;background:var(--sunken);color:var(--ink-2);font-size:11.5px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.cnt.hot{background:var(--sun);color:var(--on-sun)}
.me{display:flex;align-items:center;gap:10px;margin-top:auto;padding:14px 6px 2px;border-top:1px solid var(--line)}
.me b{display:block;font-size:13px}
.me small{display:block;font-size:11.5px;color:var(--ink-3)}
.side-scrim{display:none;position:fixed;inset:0;z-index:44;background:var(--overlay)}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{position:relative;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:24px;padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.ttl{margin:0;font:800 17px/1.2 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
/* .btn.burger: иначе .btn ниже по файлу показывает «меню» и на широком экране */
.btn.burger{display:none}
.search{position:relative;flex:1 1 0;min-width:160px;max-width:440px;margin-left:auto}
.s-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);display:flex;color:var(--ink-3)}
.search .inp{padding-left:36px;background:var(--surface-2)}
.as{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.as select{width:auto;max-width:240px}
.theme-sw{display:flex}
.theme-seg.compact{flex-wrap:nowrap}
.theme-seg:not(.compact){border-radius:14px}
.theme-seg:not(.compact) button{border-radius:11px}
.theme-seg button{display:inline-flex;align-items:center;gap:7px}
.theme-seg .ic{width:16px;height:16px}
.theme-seg.compact button{padding:6px 8px}
.theme-seg.compact span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bell-w{position:relative}
.bn{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--sun);color:var(--on-sun);font-size:10.5px;font-weight:700;line-height:1;display:grid;place-items:center}
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:min(400px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.pop-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pop-h b{font-size:13.5px}
.pop-l{max-height:min(60vh,460px);overflow-y:auto;margin:0;padding:0;list-style:none}
.pop-f{padding:8px;border-top:1px solid var(--line)}
.q-res{left:0;right:auto;width:100%}
.q-res .pop-l{padding:6px}

.demo{display:flex;align-items:center;gap:10px;padding-block:7px;padding-left:24px;padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--sun-soft);color:var(--sun-ink);font-size:12.5px;line-height:1.35}
.demo .ic{width:16px;height:16px}
.demo>span{flex:1;min-width:0}
.demo .btn{color:var(--sun-ink)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.view{display:flex;flex-direction:column;gap:16px;padding-block:22px 48px;padding-left:24px;padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ——— элементы ——— */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:500;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:linear-gradient(135deg,var(--primary),var(--primary-2));border-color:transparent;color:var(--primary-ink);box-shadow:var(--shadow-1)}
.btn.pri:hover{background:var(--primary-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.icon{width:36px;padding:0}
.btn.big{width:100%;height:48px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .ic{width:16px;height:16px}
.link{padding:0;border:0;background:none;color:var(--primary);font-weight:500;text-align:left}
.link:hover{text-decoration:underline}
.inp{width:100%;height:38px;padding:0 11px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);font-size:14px}
.inp.sm{height:32px;padding:0 8px;font-size:13px}
textarea.inp{height:auto;min-height:72px;padding:9px 11px;line-height:1.45;resize:vertical}
.inp:focus{outline:2px solid var(--primary);outline-offset:-1px}
.inp:disabled{background:var(--sunken);color:var(--ink-3)}
.w-auto{width:auto}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.field.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.span2{grid-column:1/-1}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
.check input{width:16px;height:16px;margin:0;accent-color:var(--primary)}
.hint{margin:0;font-size:12.5px;color:var(--ink-3);max-width:80ch}
.err{margin:0;font-size:13px;color:var(--bad)}
.lock{display:flex;align-items:center;gap:8px;margin:0;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:var(--sunken);color:var(--ink-2);font-size:12px;font-weight:500;line-height:1.5;white-space:nowrap}
.pill.sm{padding:1px 7px;font-size:11px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--info-soft);color:var(--info)}.pill.sun{background:var(--sun-soft);color:var(--sun-ink)}.pill.violet{background:var(--violet-soft);color:var(--violet)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px;text-align:left}
button.chip:hover{border-color:var(--line-2);background:var(--sunken)}
button.chip:disabled{opacity:.5;cursor:not-allowed}
.chip b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:13px}
.fchip:hover{border-color:var(--line-2)}
.fchip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-deep);font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:999px;background:var(--sunken)}
.seg button{padding:6px 12px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button b{margin-left:5px;color:var(--ink-3);font-weight:600}
.seg.wide{display:flex}
.seg.wide button{flex:1}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.av{display:inline-grid;place-items:center;width:30px;height:30px;flex:none;border-radius:50%;background:var(--sunken);color:var(--ink-2);font-size:11.5px;font-weight:600}
.av.xs{width:20px;height:20px;font-size:9.5px}
.av .ic{width:12px;height:12px}
.who{display:inline-flex;align-items:center;gap:7px;min-width:0}

.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-1)}
.card.clip{overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:14px 16px 10px}
.card-h h3{margin:0;font-size:14.5px;font-weight:600}
.card-b{padding:0 16px 16px}
.empty{margin:0;padding:18px 16px;color:var(--ink-3);font-size:13.5px}
.sh{margin:0 0 8px;font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
/* «Нет доступа к разделу» — прямой переход туда, где у человека нет права */
.deny{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:560px;margin:24px auto 0;padding:32px 24px;text-align:center}
.deny h2{margin:0;font:800 18px/1.25 var(--f-display);letter-spacing:-.015em}
.deny p{margin:0;max-width:44ch;color:var(--ink-2)}
.deny-ic{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--sunken);color:var(--ink-3)}
.deny-ic .ic{width:22px;height:22px}
.deny .btn{margin-top:6px}

/* ——— таблицы (общие для всех разделов) ——— */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);color:var(--ink-3);font-size:12px;font-weight:500;text-align:left;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl .c{text-align:center}

/* ——— уведомления ——— */
.notes{margin:0;padding:0;list-style:none}
.note{display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px;padding:11px 16px;border-top:1px solid var(--line)}
.notes>.note:first-child{border-top:0}
.note.unread{background:var(--surface-2)}
.nic{display:grid;place-items:center;width:32px;height:32px;border-radius:9px}
.nic .ic{width:17px;height:17px}
.nic.info{background:var(--info-soft);color:var(--info)}.nic.ok{background:var(--ok-soft);color:var(--ok)}.nic.pri{background:var(--primary-soft);color:var(--primary)}
.nic.sun{background:var(--sun-soft);color:var(--sun-ink)}.nic.violet{background:var(--violet-soft);color:var(--violet)}.nic.bad{background:var(--bad-soft);color:var(--bad)}
.nt p{margin:0;font-size:13.5px}
.nt small{display:block;margin-top:3px;font-size:12px;color:var(--ink-3)}
.new-b{color:var(--sun-ink);font-weight:600}
.to{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}

/* ——— карточка справа и окна ——— */
.scrim{position:fixed;inset:0;z-index:40;background:var(--overlay);animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;display:flex;flex-direction:column;width:min(580px,100%);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);background:var(--surface);box-shadow:var(--shadow);animation:slide .22s ease}
.still .scrim,.still .drawer{animation:none}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.dh-t{flex:1;min-width:0}
.dh-t small{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.dh-t h2{margin:4px 0 0;font:800 18px/1.25 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.dh-t p{margin:6px 0 0;font-size:13px;color:var(--ink-3)}
.drawer-b{flex:1;display:flex;flex-direction:column;gap:22px;overflow-y:auto;padding:18px 20px 32px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;margin:0;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.st{display:flex;flex-direction:column;gap:4px;padding:10px;border-radius:12px;background:var(--surface-2)}
.st span{font-size:11.5px;line-height:1.2;color:var(--ink-3)}
.st b{font:800 17px/1.1 var(--f-display);letter-spacing:-.01em}
.rform{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--surface-2)}
.rform .sh{margin:0}
.mv{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.mv li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.mv li:first-child{border-top:0}
.mv small{margin-left:auto;font-size:12px;color:var(--ink-3)}
.prose{max-width:62ch;margin:0;font-size:14px;line-height:1.55}
.modal-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--overlay);animation:fade .15s}
.modal{display:flex;flex-direction:column;width:min(560px,100%);max-height:100%;overflow-y:auto;border-radius:26px;background:var(--surface);box-shadow:var(--shadow)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font:800 16px/1.25 var(--f-display);letter-spacing:-.01em}
.modal-b{display:flex;flex-direction:column;gap:14px;padding:16px 18px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:8px}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;width:min(400px,calc(100% - 32px));pointer-events:none}
.toast{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-size:13.5px;line-height:1.4;pointer-events:auto;animation:tin .22s ease;transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateY(6px)}
.toast .ic{width:17px;height:17px;margin-top:1px;color:var(--sun)}
/* ——— стрелки у краёв досок (50-shell.js: контейнер с data-hscroll оборачивается в .hs) ———
   Полоса .hs-a во всю высоту доски; сама кнопка липнет к видимой части экрана, чтобы её было видно и у высокой доски.
   Видна, только когда с этой стороны есть что листать (иначе hidden) и мышь у края (data-near) или кнопка в фокусе. */
.hs{position:relative;min-width:0}
.hs-a{position:absolute;top:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:center;width:52px;pointer-events:none}
.hs-l{left:0}
.hs-r{right:0}
.hs-b{position:sticky;top:96px;bottom:96px;display:grid;place-items:center;width:40px;height:40px;padding:0;border:1px solid var(--line-2);border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .15s,background .15s}
.hs-b *{pointer-events:none}
.hs-b:hover{background:var(--primary-soft);color:var(--primary-deep)}
.hs[data-near="l"] .hs-l .hs-b,.hs[data-near="r"] .hs-r .hs-b,.hs-b:focus-visible{opacity:1;pointer-events:auto}
/* палец листает сам, стрелки только мешали бы */
@media (hover:none),(pointer:coarse){.hs-a{display:none}}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;left:0;z-index:45;width:min(290px,86vw);padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-104%);transition:transform .22s ease}
  .app.nav-open .side{transform:none;box-shadow:var(--shadow)}
  .app.nav-open .side-scrim{display:block}
  .btn.burger{display:inline-flex}
  .top,.demo,.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .ttl{flex:1 1 0;min-width:0}
  .search{order:9;flex-basis:100%;max-width:none;margin-left:0}
  .as select{max-width:150px}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .drawer{padding-left:env(safe-area-inset-left,0px)}
}

@media (max-width:560px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .top{gap:10px}
  .ttl{font-size:15px}
  /* телефон: 1-я строка — меню, раздел, тема, уведомления; 2-я — «Кто я»; 3-я — поиск */
  .as{order:8;flex:1 1 100%;min-width:0}
  .as select{flex:1;min-width:0;max-width:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .demo{align-items:flex-start}
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ——— «Сегодня» ——— */
.hello h2{margin:0;font:800 22px/1.2 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.hello p{margin:6px 0 0;color:var(--ink-3)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px 16px;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-1);background:var(--surface);color:var(--ink);text-align:left}
.kpi:hover{border-color:var(--line-2)}
.k-l{font-size:12.5px;color:var(--ink-2)}
.k-v{font:800 30px/1 var(--f-display);letter-spacing:-.02em}
.k-s{font-size:12.5px;color:var(--ink-3)}
.k-s.bad{color:var(--bad)}.k-s.warn{color:var(--warn)}.k-s.ok{color:var(--ok)}
.week{display:grid;grid-template-columns:repeat(var(--n),minmax(108px,1fr));gap:8px;min-width:calc(var(--n) * 116px)}
.wd{display:flex;flex-direction:column;gap:6px;min-height:118px;padding:9px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.wd.today{border-color:var(--primary);background:var(--surface);box-shadow:inset 0 0 0 1px var(--primary)}
.wd.late{border-color:var(--bad-soft);background:var(--bad-soft)}
.wd-h{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.wd-h b{display:block;margin-top:2px;font:800 14px/1.2 var(--f-display);letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.wd.late .wd-h{color:var(--bad)}
.wchip{display:flex;flex-direction:column;gap:1px;padding:6px 8px;border:0;border-radius:7px;background:var(--info-soft);color:var(--info);font-size:11.5px;line-height:1.3;text-align:left}
.wchip.out{background:var(--ok-soft);color:var(--ok)}
.wchip.late{background:var(--surface);color:var(--bad)}
.wchip b{font-size:12px}
.home-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.list{margin:0;padding:0 8px 8px;list-style:none}
.li{display:flex;align-items:flex-start;gap:11px;width:100%;padding:9px 8px;border:0;border-radius:12px;background:transparent;text-align:left}
.li:hover{background:var(--surface-2)}
.li-ic{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:8px;background:var(--sunken);color:var(--ink-2)}
.li-ic .ic{width:16px;height:16px}
.li.bad .li-ic{background:var(--bad-soft);color:var(--bad)}.li.warn .li-ic{background:var(--warn-soft);color:var(--warn)}.li.info .li-ic{background:var(--info-soft);color:var(--info)}
.li-t{flex:1;min-width:0;font-size:13.5px}
.li-t small{display:block;margin-top:2px;font-size:12px;color:var(--ink-3)}
.due{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.due.bad{color:var(--bad);font-weight:500}
.tdot{width:10px;height:10px;flex:none;margin-top:5px;border:2px solid var(--ink-3);border-radius:50%}
.tdot.work{border-color:var(--primary);background:var(--primary-soft)}
.tdot.review{border-color:var(--sun);background:var(--sun-soft)}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .home-grid{grid-template-columns:minmax(0,1fr)}
}

@media (max-width:560px){
  .k-v{font-size:24px}
}

/* ——— задачи ——— */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:12px;min-width:1036px}
.col{display:flex;flex-direction:column;gap:8px;min-height:260px;padding:10px;border-radius:18px;background:var(--sunken)}
.col.drop{outline:2px dashed var(--primary);outline-offset:-2px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 4px;font-size:13px;font-weight:600}
.cnt-s{font-size:12px;font-weight:500;color:var(--ink-3)}
.col-empty{margin:0;padding:14px 6px;text-align:center;font-size:12.5px;color:var(--ink-3)}
.tcard{display:flex;flex-direction:column;gap:8px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:grab}
.tcard:hover{border-color:var(--line-2)}
.tcard.dragging{opacity:.5}
.tcard.done .tc-t{color:var(--ink-3);text-decoration:line-through}
.tc-top{display:flex;flex-wrap:wrap;gap:6px}
.tc-top:empty{display:none}
.tc-t{margin:0;font-size:13.5px;font-weight:500;line-height:1.35}
.tc-m{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2)}

/* ——— товары и остатки ——— */
.pname{display:flex;flex-direction:column;gap:2px;min-width:200px}
.pname small{font-size:11.5px;color:var(--ink-3)}
.u{font-size:12px;color:var(--ink-3)}
.in-t{display:block;color:var(--info);font-weight:500;white-space:nowrap}
td small.muted{display:block;font-size:11.5px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:12px;height:8px;border-radius:2px}
.lg.f,.sbar .f{background:var(--ok)}
.lg.r,.sbar .r{background:var(--sun)}
.lg.w,.sbar .w{background:repeating-linear-gradient(135deg,var(--info) 0 2px,var(--info-soft) 2px 4px)}
.sbar{display:flex;width:128px;height:8px;overflow:hidden;border-radius:4px;background:var(--sunken)}
.sbar i{display:block;height:100%}
.sbar.big{width:100%;height:12px;border-radius:6px}
.search-in{position:relative;flex:1;min-width:220px;max-width:380px}
.search-in .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search-in .inp{padding-left:36px}
/* список: счётчик, страницы, фильтры */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;max-width:760px}
.count{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 14px;margin:0;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.count b{color:var(--ink)}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;padding:12px 16px;border-top:1px solid var(--line)}
.pname small{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
td.free b{font-weight:700}
/* карточка товара */
.pst{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.st small{font-size:11px;line-height:1.3;color:var(--ink-3)}
.kv{display:grid;grid-template-columns:minmax(92px,32%) minmax(0,1fr);gap:8px 12px;margin:0;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv dd small{display:block;font-size:12px;color:var(--ink-3)}
.mx th{white-space:normal;min-width:72px}
.mx th[scope=row]{background:transparent;color:var(--ink);font-size:13.5px;font-weight:500;white-space:nowrap;text-align:left}
.mx td.e{background:var(--surface-2)}
.mx td.tot{font-weight:700}
.mx tfoot th,.mx tfoot td{border-top:1px solid var(--line-2);border-bottom:0}
.mv .pill{align-self:center}
/* настройки: склады и юрлица */
.wh-row{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.wh-row.city{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.wh-add{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.wh-add .field{flex:1;min-width:180px}
@media (max-width:560px){.wh-row.city{grid-template-columns:minmax(0,1fr)}}

/* ——— поставки и перевозки: таблица, воронка, шкала маршрута, позиции, карточка ——— */

/* этапы полосками — общие для карточки поставки и карточки сделки */
.steps{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;margin:0;padding:0;list-style:none}
.steps li{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:11px;line-height:1.25;color:var(--ink-3);overflow-wrap:anywhere}
.steps li::before{content:"";height:5px;border-radius:3px;background:var(--sunken)}
.steps li.done::before{background:var(--primary-line)}
.steps li.cur::before{background:var(--primary)}
.steps li.cur{color:var(--ink);font-weight:600}
.waits{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink-2)}
.waits .ic{width:16px;height:16px;margin-top:1px;color:var(--ink-3)}
.ship-f{display:flex;flex-wrap:wrap;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.photos-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.photos-row img,.ph-ph{width:54px;height:54px;border-radius:8px;object-fit:cover}
.ph-ph{display:grid;place-items:center;background:var(--sunken);color:var(--ink-3)}
.photos-row small{margin-left:4px;font-size:12px;color:var(--ink-3)}

/* фильтры и настройка вида */
.sfilters{padding:12px 14px}
.sf-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.sf-row .field{flex:1 1 130px;min-width:0}
.sf-row .sf-q{flex:2 1 240px}
.sset .hint{margin:0}
.ss-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;align-items:start}
.ss-f{display:flex;flex-direction:column;gap:8px;min-width:0;margin:0;padding:0;border:0}
fieldset.ss-f legend{padding:0;margin-bottom:6px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.s-count{margin:0;font-size:13px;color:var(--ink-3)}
.s-pager{display:flex;align-items:center;justify-content:center;gap:12px}

/* таблица: строка фиксированной высоты, лишнее обрезается */
.stbl{min-width:1100px}
.stbl td{height:64px;padding:6px 12px;overflow:hidden}
.stbl.dense td{height:40px;padding:3px 10px}
.srow.is-late>td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.srow.is-done{color:var(--ink-2)}
.sgrp td{height:auto;padding:7px 12px;background:var(--surface-2);font-size:12.5px}
.s-sort{padding:0;border:0;background:none;color:inherit;font:inherit;white-space:nowrap}
.s-sort:hover,.s-sort.on{color:var(--ink)}
.s-id{display:block;font-weight:600}
.s-id+small{display:block;font-size:11px;line-height:13px}
.s-ell{display:block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-ell small{display:block}
.s-stsel{width:auto;min-width:150px;max-width:200px;height:30px}
.s-eta{white-space:nowrap}
.s-eta b{display:block}
.s-eta small{display:block;font-size:11.5px}
.s-where{min-width:250px}
.s-itc{min-width:270px}
.stbl.dense .s-ell small{display:inline;margin-left:6px}
.stbl.dense .s-eta b,.stbl.dense .s-eta small{display:inline}
.stbl.dense .s-id,.stbl.dense .s-id+small{display:inline}

/* позиции «3 + ещё N» */
.s-items{display:flex;align-items:center;gap:8px;min-width:0}
.s-itl{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.s-it{display:flex;gap:4px;max-width:250px;font-size:12.5px;line-height:15px;white-space:nowrap}
.s-it span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.s-it b{flex:none;font-weight:600;color:var(--ink-2)}
.s-more{flex:none;min-width:36px;height:26px;padding:0 9px;border:1px solid var(--primary-line);border-radius:999px;background:var(--primary-soft);color:var(--primary);font:600 12px var(--f-body);cursor:pointer}
.s-more:hover{background:var(--primary-line)}
.stbl.dense .s-itl{flex-direction:row;gap:12px}
.stbl.dense .s-it{max-width:130px}
.drawer .s-it{max-width:none;font-size:13.5px;line-height:21px;white-space:normal}
.drawer .s-it span{overflow:visible;text-overflow:clip}
.drawer .s-items{align-items:flex-start}

/* шкала маршрута */
.rs{display:flex;flex-direction:column;gap:3px;max-width:270px}
.rs.full{max-width:none;gap:6px;padding:4px 30px 0}
.rs-line{position:relative;height:14px;margin:0 7px}
.rs-line::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;border-radius:1px;background:var(--line-2)}
.rs-fill{position:absolute;left:0;top:6px;height:2px;border-radius:1px;background:var(--primary)}
.rs.late .rs-fill{background:var(--bad)}
.rs-dot{position:absolute;top:2px;width:10px;height:10px;margin-left:-5px;box-sizing:border-box;border:2px solid var(--line-2);border-radius:50%;background:var(--surface)}
.rs-dot.on{border-color:var(--primary);background:var(--primary)}
.rs.late .rs-dot.on{border-color:var(--bad);background:var(--bad)}
.rs-dot.cur{box-shadow:0 0 0 3px var(--primary-soft)}
.rs.late .rs-dot.cur{box-shadow:0 0 0 3px var(--bad-soft)}
.rs-mark{position:absolute;top:0;width:14px;height:14px;margin-left:-7px;box-sizing:border-box;border:2px solid var(--surface);border-radius:50%;background:var(--sun);box-shadow:0 0 0 1px var(--sun-ink)}
.rs-names{position:relative;height:16px;margin:0 7px}
.rs-names span{position:absolute;top:0;transform:translateX(-50%);font-size:11.5px;white-space:nowrap;color:var(--ink-3)}
.rs-names span.on{color:var(--ink);font-weight:600}
.rs-cap{display:flex;justify-content:space-between;gap:8px;font-size:12px;line-height:15px}
.rs-w{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.rs-cap b{flex:none;font-weight:600;color:var(--ink-2)}
.rs-cap b.bad-t{color:var(--bad)}
.rs.full .rs-cap{font-size:13px;line-height:18px}
.stbl.dense .rs{flex-direction:row;align-items:center;gap:8px}
.stbl.dense .rs-line{flex:none;width:70px}
.stbl.dense .rs-cap{flex:1;min-width:0}

/* воронка */
.sfun{display:grid;grid-template-columns:repeat(var(--n),minmax(220px,1fr));gap:12px;min-width:calc(var(--n)*232px)}
.scol{min-height:200px}
.scol-b{display:flex;flex-direction:column;gap:8px;max-height:min(68vh,640px);overflow-y:auto;overscroll-behavior:contain}
.scard{display:flex;flex-direction:column;gap:5px;padding:10px 11px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.scard[draggable="true"]{cursor:grab}
.scard:hover{border-color:var(--line-2)}
.scard.dragging{opacity:.5}
.scard.is-late{border-color:var(--bad)}
.scard.is-done{color:var(--ink-2)}
.sc-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.sc-s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;color:var(--ink-2)}
.sc-m{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-size:12px;color:var(--ink-2)}
.sc-m b{color:var(--ink)}

/* окно «Все позиции» */
.si-sum{margin:0;font-size:13px;color:var(--ink-2)}
.si-scroll{max-height:min(52vh,460px);overflow:auto;border:1px solid var(--line);border-radius:12px}
.si-scroll .tbl th{position:sticky;top:0;z-index:1}
#si-body{display:flex;flex-direction:column;gap:10px}

/* карточка справа */
.d-stage{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.d-stage .field{min-width:200px}
.shist{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.shist li{padding-left:12px;border-left:2px solid var(--line)}
.sh-t{font-size:13.5px}
.shist small{display:block;margin-top:2px;font-size:12px;color:var(--ink-3)}

@media (max-width:560px){
  .sf-row .field{flex:1 1 calc(50% - 10px)}

const DAY=864e5;
const T0=(()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const day=(n,h=10,m=0)=>{const d=new Date(T0);d.setDate(d.getDate()+n);d.setHours(h,m,0,0);return d};
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const dd=d=>Math.round((sod(d)-T0)/DAY);
const fD=d=>{d=new Date(d);return d.getDate()+' '+MON[d.getMonth()]};
const fRel=d=>{const n=dd(d);return n===0?'сегодня':n===1?'завтра':n===-1?'вчера':fD(d)};
const fT=d=>{d=new Date(d);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const fWhen=d=>fRel(d)+', '+fT(d);

const num=n=>Number(n).toLocaleString('ru-RU');
const rub=n=>num(Math.round(n))+' ₽';
const mln=n=>n>=1e6?(n/1e6).toLocaleString('ru-RU',{maximumFractionDigits:2})+' млн ₽':rub(n);
const pl=(n,a,b,c)=>{const x=Math.abs(n)%100,y=x%10;return x>10&&x<20?c:y>1&&y<5?b:y===1?a:c};

const pipeIdOf=x=>x.boardId||x.pipeId;

const stagesFor=x=>pipeById(pipeIdOf(x))?.stages||[];
const stageOf=x=>Pipes.stage(S,pipeIdOf(x),x.stageId);
const stageName=x=>stageOf(x)?.name||'нет данных: этап';
const stagePos=x=>stagesFor(x).findIndex(s=>s.id===x.stageId);

const isDone=x=>Pipes.isFinal(S,pipeIdOf(x),x.stageId);
// С чего запись начинает путь: первый этап воронки без флага
const startStage=pipeId=>(pipeById(pipeId)?.stages||[]).find(s=>!s.flag)||null;
const finalStage=x=>stagesFor(x).find(s=>s.flag==='final')||null;
