  // Ревизия формы данных внутри схемы v3: пишется в сохранение (dump), при несовпадении load даёт null и запуск берёт seed().
  // Меняется, когда форма записей меняется так, что сохранённое прежней формы читать нельзя.
  // 2 — товары каталога (id вместо sku), остатки по юрлицам и городам, юрлица и города в состоянии. Сохранения без rev — ревизия 1.
  // 3 — почта: st.mail (ящики, поставщики, письма). Старое сохранение без неё уходит в пользу демо.
  // 4 — поставки: маршрут route, положение pos, depart, number, carrier, юрлицо/город; st.shipRules. Прежнее сохранение уходит в пользу демо.
  // 5 — лиды: st.leads, st.leadSource; у сделок из лидов leadId, phone, email. Прежнее сохранение уходит в пользу демо.
  // 6 — роль РОП и право leadsAssign (таск 04): сохранение без них уходит в пользу демо.
  // 7 — клиенты и лента (таск 09): st.clients, st.feed, st.lostReasons; у сделок clientId, items, at, wonAt, lostReason; у лидов clientId.
  // 8 — дела (таск 10): st.acts; лента подмешивает выполненные дела.
  // 9 — лиды заводятся руками, время реакции (таск 10).
  // 10 — отправки (таск 07): st.dispatches, права dispatch и sell, роль «Водитель», вид воронки dispatch.
  // 12 — звук уведомлений у каждого свой (таск 06): prefs.sound = {personId: {on, kind}} вместо одного {on, kind}.
  // 13 — ремонт F1: право dealsEdit, резервы только по строкам сделки, демо-перемещения не увозят товар, правило поставок sr3.
  const REV = 13;
  // Браузер даёт сайту около 5 млн символов на всё; берём с запасом.
  const LIMIT = 4500000;
  const NO_SPACE = 'не сохранено — мало места в браузере';
  // Фото в состоянии — строки data:image/… (снимки с телефона при приёмке).
  const PHOTO = /^data:image\//;

  // Date из любого «мира» (страница, node:vm в тестах) — не через instanceof.
  const isDate = v => Object.prototype.toString.call(v) === '[object Date]';
  const isPhoto = v => typeof v === 'string' && PHOTO.test(v);

  // Копия состояния, пригодная для JSON: даты → {$date: ISO}, ui не сохраняется.
  function plain(v, top) {
    if (isDate(v)) return { $date: isNaN(v.getTime()) ? null : v.toISOString() };
    if (Array.isArray(v)) return v.map(x => plain(x, false));
    if (v && typeof v === 'object') {
      const o = {};
      for (const k of Object.keys(v)) {
        if (top && k === 'ui') continue;
        const x = v[k];
        if (x === undefined || typeof x === 'function') continue;
        o[k] = plain(x, false);
      }
      return o;
    }
    return v;
  }

  // Предел одного файла заявки — 2 МБ: больше — отказ ещё при прикреплении. Браузер даёт на всё около 5 млн символов,
  // а файл в сохранении занимает примерно на треть больше своего размера: два-три таких файла — и места нет.
  const FILE_MAX = 2 * 1024 * 1024;
  const mb = n => String(Math.round(n / 1048576 * 10) / 10).replace('.', ',');
  // Файл больше предела → причина отказа (её показывают и форма, и ядро заявки), иначе null.
  function fileTooBig(f) {
    const size = Number(f && f.size) || 0;
    return size > FILE_MAX ? `Файл «${f.name}» — ${mb(size)} МБ, больше предела ${mb(FILE_MAX)} МБ. Сожмите его или разбейте на части до ${mb(FILE_MAX)} МБ.` : null;
  }

  // Время записи для порядка выкидывания: ближайшее поле at по пути к фото или файлу. Времени нет (черновик приёмки) —
  // запись считается самой новой: она ещё не сохранена как принятая.
  const NEWEST = Number.MAX_SAFE_INTEGER;
  const atOf = v => (v && v.at && v.at.$date && Date.parse(v.at.$date)) || 0;
  const GONE = Symbol('выкинуто');

  // Что можно выкинуть из копии: фото приёмки (строки data:image/… вне заявок) и данные файлов заявок на отправку.
  // Картинка, приложенная к заявке, — файл заявки, а не фото приёмки.
  function heavy(copy) {
    const out = [];
    const walk = (v, at) => {
      if (Array.isArray(v)) { v.forEach(x => walk(x, at)); return; }
      if (!v || typeof v !== 'object') return;
      const here = atOf(v) || at;
      for (const k of Object.keys(v)) {
        if (v === copy && k === 'dispatches') continue;
        const x = v[k];
        if (isPhoto(x)) out.push({ photo: true, holder: v, key: k, size: x.length, at: here });
        else if (Array.isArray(x)) x.forEach((y, i) => isPhoto(y) ? out.push({ photo: true, holder: v, key: k, index: i, size: y.length, at: here }) : walk(y, here));
        else walk(x, here);
      }
    };
    walk(copy, NEWEST);
    for (const d of copy.dispatches || []) {
      for (const f of (d && d.files) || []) {
        if (f && typeof f.data === 'string' && f.data) out.push({ file: f, size: f.data.length, at: atOf(f) || atOf(d) || NEWEST });
      }
    }
    return out;
  }

  // Выкинуть одно: у файла data → null и unsaved:true; у фото запись, где оно было, получает unsaved:{photos, text}.
  function drop(c) {
    if (c.file) { c.file.data = null; c.file.unsaved = true; return; }
    if (c.index === undefined) c.holder[c.key] = null; else c.holder[c.key][c.index] = GONE;
    const prev = c.holder.unsaved && c.holder.unsaved.photos || 0;
    c.holder.unsaved = { photos: prev + 1, text: NO_SPACE };
  }
  // Выкинутые из списка фото в текст не идут
  const text = copy => JSON.stringify(copy, (k, v) => Array.isArray(v) && v.includes(GONE) ? v.filter(y => y !== GONE) : v);

  // Состояние → {text, droppedPhotos, droppedFiles, fits}. Не влезает в limit — выкидывается только то, что не помещается:
  // по одному фото приёмки или файлу заявки, сначала самые новые, при равном времени — самые крупные, пока текст не влезет.
  // Прежние фото и файлы сохраняются. Выкинутое помечается «не сохранено — мало места в браузере»: у фото —
  // запись unsaved:{photos, text}, у файла unsaved:true; droppedPhotos и droppedFiles — сколько выкинуто.
  // Само состояние не меняется.
  function dump(state, limit = LIMIT) {
    const copy = plain(state, true);
    // товары снимка каталога в браузер не идут: они константы файла (Catalog.pack), пишется только изменяемое
    const packed = Catalog.pack(copy.products);
    if (packed) Object.assign(copy, packed);
    copy.rev = REV;
    let out = JSON.stringify(copy);
    let droppedPhotos = 0, droppedFiles = 0;
    if (out.length > limit) {
      const list = heavy(copy).sort((a, b) => b.at - a.at || b.size - a.size);
      // длину после выкидывания сначала прикидываем, точную считаем, когда прикидка влезла
      let est = out.length;
      for (const c of list) {
        if (est <= limit) break;
        drop(c);
        if (c.photo) droppedPhotos++; else droppedFiles++;
        est -= c.size;
        if (est <= limit) { out = text(copy); est = out.length; }
      }
      if (droppedPhotos || droppedFiles) out = text(copy);
    }
    return { text: out, droppedPhotos, droppedFiles, fits: out.length <= limit };
  }

  // Строка из localStorage → состояние с живыми датами; пусто, мусор или чужая версия схемы → null
  // (тогда запуск берёт seed()).
  function load(raw) {
    if (typeof raw !== 'string' || !raw) return null;
    let st;
    try {
      st = JSON.parse(raw, (k, v) => {
        if (v && typeof v === 'object' && !Array.isArray(v)) {
          const keys = Object.keys(v);
          if (keys.length === 1 && keys[0] === '$date') return new Date(v.$date === null ? NaN : v.$date);
        }
        return v;
      });
    } catch (_) { return null; }
    if (!st || typeof st !== 'object' || Array.isArray(st) || st.v !== VERSION || st.rev !== REV) return null;
    delete st.rev;
    return Catalog.unpack(st);
  }

  // Свободный id для новой записи списка: не совпадёт ни с одним сохранённым (общий для ядра).
  function freeId(list, prefix) {
    const used = new Set((list || []).map(x => x && x.id));
    let n = (list || []).length + 1;
    while (used.has(prefix + n)) n++;
    return prefix + n;
  }

  return { KEY, VERSION, REV, LIMIT, NO_SPACE, FILE_MAX, fileTooBig, load, dump, freeId };
})();

// Ядро: роли и права. Роли — данные (st.roles), проверки спрашивают право, а не название роли.
// Встроенные роли не удаляются; у директора все права, и снять их нельзя.

const Perms = (() => {
  // Права: ключ и подпись. Первые тринадцать — как в v2, дальше новые.
  const LIST = [
    ['firm', 'Видеть сводку по всей фирме'],
    ['tasksAll', 'Видеть задачи всех отделов'],
    ['tasksAssign', 'Ставить задачи другим отделам'],
    ['stock', 'Видеть остатки, резервы и поставки'],
    ['prices', 'Видеть цены и суммы'],
    ['reserve', 'Ставить и снимать резервы'],
    ['catalog', 'Добавлять товары в номенклатуру'],
    ['logistics', 'Отмечать этапы перевозки'],
    ['receive', 'Принимать товар на склад'],
    ['clients', 'Видеть клиентов и сделки'],
    ['write', 'Писать клиентам в Telegram и MAX'],
    ['auto', 'Настраивать авто-сообщения'],
    ['admin', 'Управлять сотрудниками и правами'],
    ['mail', 'Работать с почтой своих ящиков'],
    ['leads', 'Видеть и вести лиды'],
    ['leadsAssign', 'Распределять и передавать лиды'],
    ['dealsAll', 'Видеть сделки всех типов'],
    ['dealsEdit', 'Заводить и править сделки'],
    ['settings', 'Менять настройки фирмы'],
    ['dispatch', 'Вести отправки'],
    ['sell', 'Списывать при продаже'],
  ];
  const KEYS = LIST.map(p => p[0]);

  // Права по умолчанию — «Решения по реализации» спецификации.
  // Менеджер видит лиды и сделки своего типа (scope), dealsAll у него нет. Заводить и править сделки (dealsEdit) — менеджерам,
  // РОП (право ему дают в шаге сделок, 42-deals.js) и директору; инженеры смотрят сделки, но не правят (R30).
  const ENGINEER = ['tasksAssign', 'stock', 'clients', 'dealsAll'];
  const DEFAULTS = [
    { id: 'director', name: 'Директор', all: true, on: KEYS },
    { id: 'managerB2b', name: 'Менеджер B2B', scope: 'b2b', on: ['stock', 'prices', 'reserve', 'leads', 'clients', 'dealsEdit', 'write', 'mail', 'sell', 'tasksAssign'] },
    { id: 'managerB2c', name: 'Менеджер B2C', scope: 'b2c', on: ['stock', 'prices', 'reserve', 'leads', 'clients', 'dealsEdit', 'write', 'mail', 'sell', 'tasksAssign'] },
    { id: 'logist', name: 'Логист', on: ['stock', 'logistics', 'mail', 'tasksAssign', 'dispatch'] },
    { id: 'warehouse', name: 'Кладовщик', on: ['stock', 'receive', 'dispatch'] },
    // Главный инженер и инженер — одна матрица (R30).
    { id: 'chiefEngineer', name: 'Главный инженер', on: ENGINEER },
    { id: 'engineer', name: 'Инженер', on: ENGINEER },
  ];

  // Полная матрица {право: да/нет} из списка включённых прав или из готовой матрицы.
  function matrix(perms) {
    const on = Array.isArray(perms) ? perms : Object.keys(perms || {}).filter(k => perms[k] === true);
    const m = {};
    for (const k of KEYS) m[k] = on.includes(k);
    return m;
  }

  // Встроенные роли — новая копия на каждый вызов (для seed()).
  function defaultRoles() {
    return DEFAULTS.map(r => {
      const role = { id: r.id, name: r.name, builtin: true, perms: matrix(r.on) };
      if (r.all) role.all = true;
      if (r.scope) role.scope = r.scope;
      return role;
    });
  }

  const person = (st, personId) => (st.people || []).find(p => p.id === personId) || null;

  function roleOf(st, personId) {
    const p = person(st, personId);
    if (!p) return null;
    return (st.roles || []).find(r => r.id === p.role) || null;
  }

  // Может ли человек это. Неизвестное право — нет ни у кого (опечатка не открывает доступ).
  function can(st, personId, perm) {
    if (!KEYS.includes(perm)) return false;
    const role = roleOf(st, personId);
    if (!role) return false;
    if (role.all) return true;
    return !!(role.perms && role.perms[perm] === true);
  }

  // Почему такую роль завести нельзя ('' — можно): имя пустое или уже занято.
  function addBlock(st, name) {
    const n = String(name || '').trim();
    if (!n) return 'Впишите название роли.';
    if ((st.roles || []).some(r => r.name.trim().toLowerCase() === n.toLowerCase())) return `Роль «${n}» уже есть — назовите по-другому.`;
    return '';
  }

  // Своя роль директора: имя и права. Пустое или занятое имя → null (причину говорит addBlock).
  function addRole(st, name, perms) {
    if (addBlock(st, name)) return null;
    st.roles = st.roles || [];
    const role = { id: Store.freeId(st.roles, 'role'), name: String(name).trim(), builtin: false, perms: matrix(perms) };
    st.roles.push(role);
    return role;
  }

  const staff = n => n % 10 === 1 && n % 100 !== 11 ? 'сотрудник'
    : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'сотрудника' : 'сотрудников';

  // Почему роль удалить нельзя ('' — можно): встроенная, или на ней есть люди — пока их не переназначат.
  function removeBlock(st, roleId) {
    const role = (st.roles || []).find(r => r.id === roleId);
    if (!role) return 'Роль не найдена';
    if (role.builtin) return `Роль «${role.name}» встроенная — её нельзя удалить`;
    const n = (st.people || []).filter(p => p.role === roleId).length;
    return n ? `На роли «${role.name}» ${n} ${staff(n)} — сначала назначьте им другую роль` : '';
  }

  // Удалить роль: встроенную нельзя, роль с людьми нельзя, пока их не переназначат.
  function removeRole(st, roleId) {
    const reason = removeBlock(st, roleId);
    if (reason) return { ok: false, reason };
    st.roles = st.roles.filter(r => r.id !== roleId);
    return { ok: true, reason: '' };
  }

  return { LIST, defaultRoles, roleOf, can, addBlock, addRole, removeBlock, removeRole };
})();

// Ядро: воронки всех видов — доски задач, сделки B2B и B2C, лиды, поставки.
// Одна модель «воронка с этапами»; запись хранит id этапа, не номер, поэтому
// переименование, вставка и удаление этапа данные не ломают.
// «Сделано/закрыто» — флаг final у этапа, «прибыло, ждёт приёмки» — флаг arrived.
// Правка воронок данных не теряет: удаление этапа или воронки переносит ВСЕ записи этого вида (Pipes.items знает пять видов)
// и правила поставок (shipRules.then); этапы, на которые опирается логика по id, удалить нельзя — только переименовать.

const Pipes = (() => {
  const KINDS = ['tasks', 'deals', 'leads', 'ships', 'dispatch'];
  // Где лежат записи вида и в каком поле id воронки.
  const STORE = {
    tasks: { list: 'tasks', field: 'boardId' },
    deals: { list: 'deals', field: 'pipeId' },
    leads: { list: 'leads', field: 'pipeId' },
    ships: { list: 'shipments', field: 'pipeId' },
    dispatch: { list: 'dispatches', field: 'pipeId' },
  };

  const S_ = (id, name, flag) => (flag ? { id, name, flag } : { id, name });
  const DEAL_STAGES = () => [
    S_('request', 'Заявка'), S_('calc', 'Расчёт'), S_('offer', 'КП'), S_('contract', 'Договор'),
    S_('payment', 'Оплата'), S_('delivery', 'Поставка'), S_('install', 'Монтаж'), S_('done', 'Сдана', 'final'),
  ];
  // Воронки по умолчанию — ровно как в interfaces.md. Новая копия на каждый вызов (для seed()).
  function defaults() {
    return [
      { id: 'tasksCommon', kind: 'tasks', name: 'Общие', stages: [
        S_('new', 'Новые'), S_('work', 'В работе'), S_('review', 'На проверке'), S_('done', 'Готово', 'final'),
      ] },
      { id: 'dealsB2b', kind: 'deals', name: 'Сделки B2B', scope: 'b2b', stages: DEAL_STAGES() },
      { id: 'dealsB2c', kind: 'deals', name: 'Сделки B2C', scope: 'b2c', stages: DEAL_STAGES() },
      { id: 'leads', kind: 'leads', name: 'Лиды', stages: [
        S_('new', 'Новый'), S_('contacted', 'Связались'), S_('qualified', 'Квалифицирован'),
        S_('deal', 'Сделка создана', 'final'), S_('lost', 'Отказ', 'final'),
      ] },
      { id: 'ships', kind: 'ships', name: 'Поставки', stages: [
        S_('ordered', 'Заказано'), S_('shipped', 'Отгружено поставщиком'), S_('toBorder', 'В пути до границы'),
        S_('customs', 'Таможня'), S_('transship', 'Перевалка в Чите'), S_('toStock', 'В пути до склада'),
        S_('arrived', 'Прибыло в город', 'arrived'), S_('inStock', 'На складе', 'final'),
      ] },
    ];
  }

  const pipes = st => st.pipelines || [];
  const pipe = (st, pipeId) => pipes(st).find(p => p.id === pipeId) || null;
  const clean = name => String(name || '').trim();

  // Воронки вида; со scope — этого типа и общие (без scope).
  function of(st, kind, scope) {
    return pipes(st).filter(p => p.kind === kind && (!scope || !p.scope || p.scope === scope));
  }

  function stage(st, pipeId, stageId) {
    const p = pipe(st, pipeId);
    return (p && p.stages.find(s => s.id === stageId)) || null;
  }

  function isFinal(st, pipeId, stageId) {
    const s = stage(st, pipeId, stageId);
    return !!s && s.flag === 'final';
  }

  // Записи воронки (задачи доски, сделки, лиды, поставки).
  function items(st, pipeId) {
    const p = pipe(st, pipeId);
    if (!p) return [];
    const { list, field } = STORE[p.kind];
    return (st[list] || []).filter(x => x[field] === pipeId);
  }

  function rename(st, pipeId, name) {
    const p = pipe(st, pipeId), n = clean(name);
    if (!p) return { ok: false, reason: 'Воронка не найдена' };
    if (!n) return { ok: false, reason: 'Название не может быть пустым' };
    p.name = n;
    return { ok: true, reason: '' };
  }

  function renameStage(st, pipeId, stageId, name) {
    const s = stage(st, pipeId, stageId), n = clean(name);
    if (!s) return { ok: false, reason: 'Этап не найден' };
    if (!n) return { ok: false, reason: 'Название не может быть пустым' };
    s.name = n;
    return { ok: true, reason: '' };
  }

  // Новый этап после afterId, без него — в конец. Возвращает этап или null.
  function addStage(st, pipeId, name, afterId) {
    const p = pipe(st, pipeId), n = clean(name);
    if (!p || !n) return null;
    const s = { id: Store.freeId(p.stages, 's'), name: n };
    const i = afterId ? p.stages.findIndex(x => x.id === afterId) : -1;
    if (i < 0) p.stages.push(s); else p.stages.splice(i + 1, 0, s);
    return s;
  }

  // Что значит флаг этапа — для объяснения, почему этап не удалить.
  const FLAG_WHY = {
    final: 'он завершающий: по нему CRM считает запись закрытой',
    arrived: 'он отмечает «прибыло, ждёт приёмки»: по нему склад видит, что принимать',
  };

  // Этапы, на которые опирается логика по id, объявляет сам модуль вида: Pipes.guard('leads', pipe => ({ <id этапа>: 'зачем он нужен' })).
  // Так список лежит там, где живёт логика (35-leads.js, 39-dispatch.js), а не копией здесь.
  const guards = {};
  function guard(kind, fn) { guards[kind] = fn; }

  // Зачем этап нужен логике: '' — свободный. Этап с флагом и этап из списка модуля вида — только переименовывать.
  function why(st, pipeId, stageId) {
    const p = pipe(st, pipeId), s = p && p.stages.find(x => x.id === stageId);
    if (!s) return '';
    if (s.flag) return FLAG_WHY[s.flag] || 'у него есть флаг, на который опирается CRM';
    return (guards[p.kind] ? guards[p.kind](p) : {})[stageId] || '';
  }

  // Почему этап нельзя удалить, целой фразой: '' — можно.
  function lock(st, pipeId, stageId) {
    const w = why(st, pipeId, stageId), s = stage(st, pipeId, stageId);
    return w ? `Этап «${s.name}» нельзя удалить: ${w}. Его можно только переименовать.` : '';
  }

  // Правила поставок «если событие — поставить этап»: они ссылаются на этапы воронки поставок «едут к нам» (как в «Настройки → Поставки»).
  const ruleHolds = p => p.kind === 'ships' && (p.dir || 'in') === 'in';
  const rulesAt = (st, p, stageId) => (ruleHolds(p) ? (st.shipRules || []).filter(r => r.then === stageId) : []);

  // Что висит на этапе: записей и правил. Нужно, чтобы спросить «куда перенести», только когда есть что переносить.
  function usage(st, pipeId, stageId) {
    const p = pipe(st, pipeId);
    if (!p) return { items: 0, rules: 0 };
    return { items: items(st, pipeId).filter(x => x.stageId === stageId).length, rules: rulesAt(st, p, stageId).length };
  }

  // ——— завершающие этапы: туда запись попадает только своим путём ———
  // Этап с флагом final («На складе», «Сдана», «Доставлена»…) или arrived («Прибыло в город»). На него ведут только свои действия:
  // приёмка, Deals.win, Dispatch.setStage, Leads.move, шаг перевозчика. Перенос записей при удалении этапа или воронки
  // и правило поставок сюда не ставят — иначе поставка «на складе» без приёмки, сделка «Сдана» без wonAt, отправка
  // «Доставлена» без движения склада. Исключение — правило «принято на складе» (when 'received'): оно срабатывает после приёмки.
  const closing = s => !!s && (s.flag === 'final' || s.flag === 'arrived');
  // Правило поставок может ставить этап s: обычный — любое, завершающий — только «принято на складе».
  const ruleMayTo = (rule, s) => !!s && (!closing(s) || rule.when === 'received');
  // Куда можно перенести то, что висит на этапе stageId при его удалении: этапы той же воронки, кроме него самого.
  // Завершающие — только если на этапе нет записей, а правила все «принято на складе». → [этап…]
  function moveTargets(st, pipeId, stageId) {
    const p = pipe(st, pipeId);
    if (!p) return [];
    const busy = items(st, pipeId).some(x => x.stageId === stageId), rules = rulesAt(st, p, stageId);
    return p.stages.filter(x => x.id !== stageId && (!closing(x) || (!busy && rules.every(r => ruleMayTo(r, x)))));
  }
  // На этапе есть что переносить, а некуда (остальные — завершающие): причина целой фразой; '' — переносить есть куда или нечего.
  function stuck(st, pipeId, stageId) {
    const p = pipe(st, pipeId), s = p && p.stages.find(x => x.id === stageId);
    if (!s) return '';
    const n = items(st, pipeId).filter(x => x.stageId === stageId).length, r = rulesAt(st, p, stageId).length;
    if ((!n && !r) || moveTargets(st, pipeId, stageId).length) return '';
    const what = [n ? `${n} зап.` : '', r ? `${r} ${pl(r, 'правило', 'правила', 'правил')} поставок` : ''].filter(Boolean).join(' и ');
    const ends = p.stages.filter(x => x.id !== stageId && closing(x)).map(x => `«${x.name}»`).join(', ');
    return `На этапе «${s.name}» ${what}, а перенести их некуда: остальные этапы завершающие (${ends}) — туда запись попадает только своим действием. Сначала добавьте обычный этап.`;
  }

  // После какого этапа вставлять новый, чтобы завершающие этапы остались в конце: перед первым этапом с флагом.
  // Без флагов — undefined (в конец).
  function beforeEnd(st, pipeId) {
    const p = pipe(st, pipeId);
    const i = p ? p.stages.findIndex(s => s.flag) : -1;
    return i > 0 ? p.stages[i - 1].id : undefined;
  }

  // Удалить этап: его записи и правила поставок переезжают на этап moveToId той же воронки, ничего не теряется.
  // Этап с флагом и этап, на который опирается логика (lock), не удаляется.
  function removeStage(st, pipeId, stageId, moveToId) {
    const p = pipe(st, pipeId);
    if (!p) return { ok: false, moved: 0, reason: 'Воронка не найдена' };
    const s = p.stages.find(x => x.id === stageId);
    if (!s) return { ok: false, moved: 0, reason: 'Этап не найден' };
    if (p.stages.length < 2) return { ok: false, moved: 0, reason: 'Последний этап воронки удалить нельзя' };
    const why = lock(st, pipeId, stageId);
    if (why) return { ok: false, moved: 0, reason: why };
    const here = items(st, pipeId).filter(x => x.stageId === stageId), rules = rulesAt(st, p, stageId);
    const to = p.stages.find(x => x.id === moveToId && x.id !== stageId);
    if (here.length || rules.length) {
      const what = [];
      if (here.length) what.push(`${here.length} зап.`);
      if (rules.length) what.push(`${rules.length} ${pl(rules.length, 'правило', 'правила', 'правил')} поставок`);
      const ok = moveTargets(st, pipeId, stageId), none = stuck(st, pipeId, stageId);
      if (none) return { ok: false, moved: 0, reason: none };
      if (!to) return { ok: false, moved: 0, reason: `На этапе «${s.name}» ${what.join(' и ')} — выберите, куда их перенести` };
      if (!ok.includes(to)) {
        return { ok: false, moved: 0, reason: `На этап «${to.name}» переносить нельзя: он завершающий, туда запись попадает только своим действием (приёмка, «Успешно», «Доставлена»). Выберите обычный этап.` };
      }
    }
    here.forEach(x => { x.stageId = to.id; });
    rules.forEach(r => { r.then = to.id; });
    p.stages = p.stages.filter(x => x !== s);
    return { ok: true, moved: here.length, rules: rules.length, reason: '' };
  }

  // Новая воронка вида: этапы — копия воронки по умолчанию этого вида.
  function addPipe(st, kind, name, scope) {
    const n = clean(name);
    if (!KINDS.includes(kind) || !n) return null;
    // воронки отправок по умолчанию в defaults() нет (её кладёт шаг SEEDS в 39-dispatch.js): берём этапы первой такой воронки
    const base = defaults().find(p => p.kind === kind) || pipes(st).find(p => p.kind === kind);
    if (!base) return null;
    st.pipelines = pipes(st);
    const p = { id: Store.freeId(st.pipelines, kind), kind, name: n, stages: base.stages.map(s => ({ ...s })) };
    if (scope) p.scope = scope;
    st.pipelines.push(p);
    return p;
  }

  // Этап в другой воронке для переезжающей записи: тот же id → то же название → тот же флаг → первый — но с тем же флагом,
  // что был: с обычного этапа на завершающий (и наоборот) запись не переезжает. Подходящего нет — null.
  function matchStage(from, to, stageId) {
    const s = from.stages.find(x => x.id === stageId), flag = (s && s.flag) || '';
    const same = to.stages.filter(x => (x.flag || '') === flag);
    return same.find(x => x.id === stageId) || (s && same.find(x => x.name === s.name)) || same[0] || null;
  }
  // Этап для правила поставок в другой воронке: как matchStage, но «принято на складе» может вести и на завершающий.
  function matchRuleStage(from, to, rule) {
    return matchStage(from, to, rule.then) || (ruleMayTo(rule, to.stages[0]) ? to.stages[0] : to.stages.find(x => !closing(x)) || null);
  }

  // Воронки «того же рода», что эта: вид, тип сделок (scope) и направление поставок (dir) совпадают.
  // Записи переезжают только между такими: сделка B2B не должна оказаться в воронке B2C.
  const alike = (a, b) => a.kind === b.kind && (a.scope || '') === (b.scope || '') && (a.dir || '') === (b.dir || '');
  const siblings = (st, pipeId) => { const p = pipe(st, pipeId); return p ? pipes(st).filter(x => alike(x, p)) : []; };

  // Удалить воронку: последнюю своего рода нельзя; записи и правила поставок переезжают в moveToPipeId того же рода.
  function removePipe(st, pipeId, moveToPipeId) {
    const p = pipe(st, pipeId);
    if (!p) return { ok: false, moved: 0, reason: 'Воронка не найдена' };
    if (siblings(st, pipeId).length < 2) return { ok: false, moved: 0, reason: `«${p.name}» — последняя воронка этого вида, её нельзя удалить` };
    const here = items(st, pipeId);
    const to = moveToPipeId !== pipeId ? pipe(st, moveToPipeId) : null;
    const rules = ruleHolds(p) ? (st.shipRules || []).filter(r => p.stages.some(x => x.id === r.then)) : [];
    if ((here.length || rules.length) && (!to || !alike(to, p))) {
      return { ok: false, moved: 0, reason: `В воронке «${p.name}» ${here.length} зап. — выберите воронку того же вида, куда их перенести` };
    }
    const { field } = STORE[p.kind];
    // сначала — куда встанет каждая запись и правило; если хоть одной некуда (в той воронке нет этапа того же рода), отказ
    const place = here.map(x => matchStage(p, to, x.stageId)), ruleTo = rules.map(r => matchRuleStage(p, to, r));
    const lost = here.filter((x, i) => !place[i]);
    if (lost.length || ruleTo.some(x => !x)) {
      return { ok: false, moved: 0, reason: `В воронке «${to.name}» нет этапа, куда перенести ${lost.length || 'правила'}${lost.length ? ' зап.' : ''} без смены их состояния: завершающие этапы ставятся только своим действием. Добавьте туда обычный этап.` };
    }
    here.forEach((x, i) => { x.stageId = place[i].id; x[field] = to.id; });
    rules.forEach((r, i) => { r.then = ruleTo[i].id; });
    st.pipelines = pipes(st).filter(x => x !== p);
    return { ok: true, moved: here.length, reason: '' };
  }

  return { KINDS, defaults, of, stage, isFinal, closing, ruleMayTo, moveTargets, stuck, items, usage, why, lock, guard, beforeEnd, siblings, rename, renameStage, addStage, removeStage, addPipe, removePipe };
})();

// Ядро: остатки, резервы и журнал движений. Чистая логика, без DOM и текущего времени —
// время приходит аргументом. Свободный остаток считает summary() — единственное место формулы.
//
// Данные состояния (схема v3):
//   stock[productId][entityId|'_'][cityId|'_'] = количество; '_' — «нет данных» (в таблице менеджеров города нет);
//   aside[productId] = {damaged, custody, transitNoShip} — «Бой», ответхранение, «В пути» без поставки;
//   reserves[{id, productId, qty, entityId, cityId, src:'stock'|shipId, dealId, until}];
//   moves[{at, productId, kind, qty, entityId, cityId, doc, by}] — новые записи сверху.
// Пустая клетка — null или нет ключа, не ноль: «0» в таблице и «не заполнено» — разные вещи.

const Stock = (() => {
  // «Нет данных»: юрлицо или город в источнике не указаны.
  const ANY = '_';
  // Виды движений — подписи как на экране и в журнале.
  const KINDS = { receive: 'Приход', ship: 'Отгрузка', reserve: 'Резерв', unreserve: 'Снят резерв', transfer: 'Перемещение', damage: 'Списание в бой' };
  const NO_ENTITY = 'нет данных: юрлицо';
  const NO_CITY = 'нет данных: город';

  // Юрлица и города по умолчанию — свежая копия на каждый вызов (для seed()). Адрес склада пуст: «нет данных: адрес».
  function defaults() {
    return {
      entities: [{ id: 'ip', name: 'ИП' }, { id: 'npp', name: 'НПП' }, { id: 'vs', name: 'ВС' }],
      cities: [{ id: 'irk', name: 'Иркутск', address: '' }, { id: 'msk', name: 'Москва', address: '' }, { id: 'krd', name: 'Краснодар', address: '' }],
    };
  }

  const isNum = v => typeof v === 'number' && isFinite(v);
  const sum = (list, f) => list.reduce((a, x) => a + f(x), 0);
  const total = vals => { const n = vals.filter(isNum); return n.length ? sum(n, x => x) : null; };

  // Подпись юрлица или города; неизвестный id (не из справочника) → null.
  const nameIn = (list, id, none) => (id === ANY ? none : (list || []).find(x => x.id === id)?.name ?? null);
  const entityName = (st, id) => nameIn(st.entities, id, NO_ENTITY);
  const cityName = (st, id) => nameIn(st.cities, id, NO_CITY);

  // ——— таблица «юрлицо × город» ———
  // rows — юрлица из справочника, затем '_' (если есть данные без юрлица); cols — то же для городов.
  // cell(e, c) — число или null (пусто). totals: rows[e], cols[c], all — суммы по непустым клеткам, null — если все пусты.
  function grid(st, productId) {
    const data = (st.stock && st.stock[productId]) || {};
    const entKeys = Object.keys(data);
    const cityKeys = [...new Set(entKeys.flatMap(e => Object.keys(data[e] || {})))];
    const order = (known, keys) => {
      const ids = known.map(x => x.id);
      return [...ids, ...keys.filter(k => k !== ANY && !ids.includes(k)), ...(keys.includes(ANY) ? [ANY] : [])];
    };
    const rows = order(st.entities || [], entKeys).map(id => ({ id, name: entityName(st, id) ?? id }));
    const cols = order(st.cities || [], cityKeys).map(id => ({ id, name: cityName(st, id) ?? id }));
    const cell = (e, c) => (data[e] && isNum(data[e][c]) ? data[e][c] : null);
    const totals = {
      rows: Object.fromEntries(rows.map(r => [r.id, total(cols.map(c => cell(r.id, c.id)))])),
      cols: Object.fromEntries(cols.map(c => [c.id, total(rows.map(r => cell(r.id, c.id)))])),
      all: total(rows.flatMap(r => cols.map(c => cell(r.id, c.id)))),
    };
    return { rows, cols, cell, totals };
  }

  // ——— поставки в пути ———
  // Приход, который ещё не лёг на склад: входящая поставка, не принятая на склад (этап без флага final), и перемещение
  // между складами, уже ушедшее из клетки «откуда» (Dispatch.transit — единственное определение «в пути»).
  // По возрастанию ожидаемой даты. У перемещения shipId — номер заявки (ОТ-NNN), плюс dispatchId и клетка-получатель
  // entityId/cityId: это не поставка, под неё резерв не ставится (freeIn даёт 0).
  function incomingOf(st, productId) {
    const ships = (st.shipments || [])
      .filter(s => s.dir === 'in' && !Pipes.isFinal(st, s.pipeId, s.stageId))
      .flatMap(s => (s.items || []).filter(i => i.productId === productId).map(i => ({ shipId: s.id, qty: i.qty, eta: s.eta })));
    const moves = Dispatch.transit(st, productId)
      .map(t => ({ shipId: t.number, dispatchId: t.dispatchId, qty: t.qty, eta: t.eta, entityId: t.entityId, cityId: t.cityId }));
    return [...ships, ...moves].sort((a, b) => a.eta - b.eta);
  }

  // Сколько в поставке ещё не отдано под резервы (для резерва «из поставки»).
  function freeIn(st, shipId, productId) {
    const s = (st.shipments || []).find(x => x.id === shipId);
    const q = s ? sum((s.items || []).filter(i => i.productId === productId), i => i.qty) : 0;
    return q - sum((st.reserves || []).filter(r => r.src === shipId && r.productId === productId), r => r.qty);
  }

  // ——— свободный остаток: единственный расчёт ———
  // onHand — годный остаток на складах по всем юрлицам и городам. «Бой», ответхранение и «В пути» (без поставки)
  // лежат отдельно (damaged, custody, transitNoShip; null — в таблице пусто) и в свободный остаток не входят.
  // free = onHand − резервы со склада.
  // freeAfter = free + incoming (поставки в пути) − reservedIncoming (резервы под эти поставки).
  // known — в таблице остатков по товару есть хоть одно число (иначе остаток «нет данных»).
  // now принимается по договору интерфейса: резервы с истёкшим сроком пока остаются в силе, пока их не сняли.
  function summary(st, productId, now) {
    void now;
    const g = grid(st, productId);
    const a = (st.aside && st.aside[productId]) || {};
    const inc = incomingOf(st, productId);
    const rs = (st.reserves || []).filter(r => r.productId === productId);
    const onHand = g.totals.all ?? 0;
    const reservedStock = sum(rs.filter(r => r.src === 'stock'), r => r.qty);
    const reservedIncoming = sum(rs.filter(r => r.src !== 'stock'), r => r.qty);
    const incoming = sum(inc, x => x.qty);
    const free = onHand - reservedStock;
    return {
      known: g.totals.all !== null,
      onHand,
      damaged: isNum(a.damaged) ? a.damaged : null,
      custody: isNum(a.custody) ? a.custody : null,
      transitNoShip: isNum(a.transitNoShip) ? a.transitNoShip : null,
      incoming, reservedStock, reservedIncoming,
      free,
      freeAfter: free + incoming - reservedIncoming,
      nextEta: inc.length ? inc[0].eta : null,
    };
  }

  // ——— резервы ———
  // Где лежит резерв со склада: юрлицо и город ('_' — не указаны).
  const cellKey = r => (r.entityId || ANY) + '|' + (r.cityId || ANY);

  // Можно ли поставить резерв {productId, qty, entityId, cityId, src}: src — 'stock' (по умолчанию) или id поставки.
  // Со склада: не больше свободного в клетке «юрлицо × город» и не больше свободного по товару в целом.
  // → {ok, max, reason}: max — сколько можно поставить, reason — по-русски, с этим числом.
  function canReserve(st, { productId, qty, entityId, cityId, src } = {}) {
    const source = src || 'stock';
    const e = entityId || ANY, c = cityId || ANY;
    let max = 0, where = '';
    if (source === 'stock') {
      const en = entityName(st, e), cn = cityName(st, c);
      if (en === null) return { ok: false, max: 0, reason: 'Такого юрлица нет в справочнике.' };
      if (cn === null) return { ok: false, max: 0, reason: 'Такого города нет в справочнике.' };
      const have = grid(st, productId).cell(e, c) ?? 0;
      const held = sum((st.reserves || []).filter(r => r.productId === productId && r.src === 'stock' && cellKey(r) === e + '|' + c), r => r.qty);
      max = Math.max(0, Math.min(have - held, summary(st, productId).free));
      where = `Со склада (${en}, ${cn}) свободно только ${max}.`;
    } else {
      const s = (st.shipments || []).find(x => x.id === source);
      if (!s || Pipes.isFinal(st, s.pipeId, s.stageId)) return { ok: false, max: 0, reason: `Поставки ${source} нет среди ожидаемых.` };
      max = Math.max(0, freeIn(st, source, productId));
      where = `В поставке ${source} свободно только ${max}.`;
    }
    const q = Number(qty);
    if (!Number.isInteger(q) || q < 1) return { ok: false, max, reason: 'Укажите количество — целое число больше нуля.' };
    if (q > max) return { ok: false, max, reason: `${where} Уменьшите количество или выберите другой склад.` };
    return { ok: true, max, reason: '' };
  }

  // Клетка склада, откуда лучше всего резервировать: где больше всего свободного. Нет остатка → ('_', '_').
  function bestCell(st, productId) {
    const g = grid(st, productId);
    let best = { entityId: ANY, cityId: ANY }, top = 0;
    for (const r of g.rows) for (const c of g.cols) {
      const held = sum((st.reserves || []).filter(x => x.productId === productId && x.src === 'stock' && cellKey(x) === r.id + '|' + c.id), x => x.qty);
      const free = (g.cell(r.id, c.id) ?? 0) - held;
      if (free > top) { top = free; best = { entityId: r.id, cityId: c.id }; }
    }
    return best;
  }

  // ——— журнал движений ———
  function log(st, rec) {
    if (!st.moves) st.moves = [];
    st.moves.unshift(rec);
    return rec;
  }
  function addTo(st, productId, e, c, delta) {
    if (!st.stock) st.stock = {};
    const byE = st.stock[productId] || (st.stock[productId] = {});
    const byC = byE[e] || (byE[e] = {});
    byC[c] = (isNum(byC[c]) ? byC[c] : 0) + delta;
  }

  // Движение товара, меняющее остаток: Приход, Отгрузка, Списание в бой, Перемещение
  // ({kind, productId, qty, entityId, cityId, toEntityId?, toCityId?, doc, by, at}). Остаток и журнал — вместе.
  // Резерв и его снятие — через reserve() и unreserve(): им нужна запись резерва.
  // → {ok, move} или {ok:false, reason}; при отказе ничего не меняется.
  function move(st, { kind, productId, qty, entityId, cityId, toEntityId, toCityId, doc, by, at } = {}) {
    const q = Number(qty), e = entityId || ANY, c = cityId || ANY;
    if (![KINDS.receive, KINDS.ship, KINDS.damage, KINDS.transfer].includes(kind)) {
      return { ok: false, reason: `Движение «${kind}» не меняет остаток: резервы ставит и снимает reserve / unreserve.` };
    }
    if (!Number.isInteger(q) || q < 1) return { ok: false, reason: 'Укажите количество — целое число больше нуля.' };
    const rec = { at, productId, kind, qty: q, entityId: e, cityId: c, doc, by };
    if (kind !== KINDS.receive) {
      const have = grid(st, productId).cell(e, c) ?? 0;
      if (q > have) return { ok: false, reason: `В клетке «${entityName(st, e) ?? e}, ${cityName(st, c) ?? c}» только ${have}, а нужно ${q}.` };
      addTo(st, productId, e, c, -q);
    }
    if (kind === KINDS.receive) addTo(st, productId, e, c, q);
    if (kind === KINDS.transfer) {
      rec.toEntityId = toEntityId || ANY; rec.toCityId = toCityId || ANY;
      addTo(st, productId, rec.toEntityId, rec.toCityId, q);
    }
    if (kind === KINDS.damage) {
      if (!st.aside) st.aside = {};
      const a = st.aside[productId] || (st.aside[productId] = { damaged: null, custody: null, transitNoShip: null });
      a.damaged = (isNum(a.damaged) ? a.damaged : 0) + q;
    }
    return { ok: true, move: log(st, rec) };
  }

  // Поставить резерв {productId, qty, entityId, cityId, src, dealId, until, by, at}. Сначала canReserve.
  // → {ok, reserve, max} или {ok:false, max, reason}. Запись в журнале — «Резерв».
  function reserve(st, p = {}) {
    const chk = canReserve(st, p);
    if (!chk.ok) return { ok: false, max: chk.max, reason: chk.reason };
    const src = p.src || 'stock';
    const ship = src === 'stock' ? null : st.shipments.find(x => x.id === src);
    const r = {
      id: Store.freeId(st.reserves, 'r'), productId: p.productId, qty: Number(p.qty),
      entityId: ship ? (ship.entityId || ANY) : (p.entityId || ANY), cityId: ship ? (ship.cityId || ANY) : (p.cityId || ANY),
      src, dealId: p.dealId, until: p.until,
    };
    st.reserves.push(r);
    log(st, { at: p.at, productId: r.productId, kind: KINDS.reserve, qty: r.qty, entityId: r.entityId, cityId: r.cityId, doc: r.dealId, by: p.by });
    return { ok: true, reserve: r, max: chk.max - r.qty };
  }

  // Снять резерв: товар возвращается в свободный остаток, в журнале — «Снят резерв». → {ok, reserve} | {ok:false, reason}
  function unreserve(st, reserveId, by, at) {
    const i = (st.reserves || []).findIndex(r => r.id === reserveId);
    if (i < 0) return { ok: false, reason: 'Такого резерва нет.' };
    const r = st.reserves.splice(i, 1)[0];
    log(st, { at, productId: r.productId, kind: KINDS.unreserve, qty: r.qty, entityId: r.entityId || ANY, cityId: r.cityId || ANY, doc: r.dealId, by });
    return { ok: true, reserve: r };
  }

  // Резервы с истёкшим сроком: день «до» раньше дня now. В последний день срока резерв ещё действует. Единственное определение
  // «срок резерва вышел»: плитка главного экрана и «Требует внимания» зовут его, а не считают сами.
  function expired(st, now) {
    const today = sod(now);
    return (st.reserves || []).filter(r => r.until && sod(r.until) < today);
  }

  // Снять с резерва q штук: весь резерв — unreserve(), часть — резерв уменьшается, в журнале «Снят резерв» на q.
  // r — запись резерва или его id. → {ok, reserve} | {ok:false, reason}
  function release(st, r, q, by, at) {
    if (typeof r === 'string') r = (st.reserves || []).find(x => x.id === r);
    if (!r) return { ok: false, reason: 'Такого резерва нет.' };
    if (!Number.isInteger(Number(q)) || q < 1) return { ok: false, reason: 'Укажите количество — целое число больше нуля.' };
    if (q >= r.qty) return unreserve(st, r.id, by, at);
    r.qty -= q;
    log(st, { at, productId: r.productId, kind: KINDS.unreserve, qty: q, entityId: r.entityId || ANY, cityId: r.cityId || ANY, doc: r.dealId, by });
    return { ok: true, reserve: r };
  }

  // Сколько можно списать при продаже. По резерву (reserveId) — сколько в нём осталось и лежит в его клетке; без резерва —
  // остаток клетки минус резервы со склада на эту клетку (зарезервированное под другого клиента списывать нельзя).
  // Резерв «под поставку» клетку не занимает: на складе этого товара ещё нет. Единственное место правила: Stock.sell и экран.
  function sellMax(st, { productId, entityId, cityId, reserveId } = {}) {
    if (reserveId) {
      const r = (st.reserves || []).find(x => x.id === reserveId);
      if (!r || r.productId !== productId || r.src !== 'stock') return 0;
      return Math.max(0, Math.min(r.qty, grid(st, productId).cell(r.entityId || ANY, r.cityId || ANY) ?? 0));
    }
    const e = entityId || ANY, c = cityId || ANY;
    const held = sum((st.reserves || []).filter(r => r.productId === productId && r.src === 'stock' && cellKey(r) === e + '|' + c), r => r.qty);
    return Math.max(0, (grid(st, productId).cell(e, c) ?? 0) - held);
  }

  // Списать проданное: {productId, qty, entityId, cityId, reserveId?, doc} → «Отгрузка» из клетки (через move) и,
  // если есть reserveId, снятие этого количества с резерва — одним действием, поэтому свободный остаток
  // (годный остаток − резервы) не меняется. Клетка по резерву — та, где он стоит. Нужно право sell.
  // Без reserveId — не больше sellMax: остаток клетки минус резервы на неё; с reserveId — в пределах своего резерва.
  // → {ok, move, reserve} | {ok:false, reason}; при отказе ничего не меняется.
  function sell(st, { productId, qty, entityId, cityId, reserveId, doc } = {}, by, now) {
    if (!Perms.can(st, by, 'sell')) return { ok: false, reason: 'У вас нет права списывать товар при продаже.' };
    const q = Number(qty);
    if (!Number.isInteger(q) || q < 1) return { ok: false, reason: 'Укажите количество — целое число больше нуля.' };
    let e = entityId || ANY, c = cityId || ANY, r = null;
    if (reserveId) {
      r = (st.reserves || []).find(x => x.id === reserveId) || null;
      if (!r) return { ok: false, reason: 'Такого резерва нет.' };
      if (r.productId !== productId) return { ok: false, reason: 'Этот резерв поставлен на другой товар.' };
      if (r.src !== 'stock') return { ok: false, reason: `Резерв стоит под поставку ${r.src}: на складе этого товара ещё нет.` };
      if (q > r.qty) return { ok: false, reason: `В резерве только ${r.qty}, а списать нужно ${q}.` };
      const re = r.entityId || ANY, rc = r.cityId || ANY;
      if ((entityId || cityId) && (e !== re || c !== rc)) {
        return { ok: false, reason: `Резерв лежит в клетке «${entityName(st, re) ?? re}, ${cityName(st, rc) ?? rc}» — списать можно только оттуда.` };
      }
      e = re; c = rc;
    } else {
      // лежит достаточно, но часть занята чужим резервом — отказ с числом; если не лежит вовсе, скажет move
      const have = grid(st, productId).cell(e, c) ?? 0, free = sellMax(st, { productId, entityId: e, cityId: c });
      if (q <= have && q > free) {
        return { ok: false, reason: `В клетке «${entityName(st, e) ?? e}, ${cityName(st, c) ?? c}» лежит ${have}, из них под резервом ${have - free}: без резерва можно списать только ${free}, а нужно ${q}. Зарезервированное списывают по его резерву.` };
      }
    }
    const m = move(st, { kind: KINDS.ship, productId, qty: q, entityId: e, cityId: c, doc, by, at: now });
    if (!m.ok) return { ok: false, reason: m.reason + ' Списать больше, чем лежит в клетке, нельзя.' };
    if (r) release(st, r, q, by, now);
    return { ok: true, move: m.move, reserve: r };
  }

  return { ANY, KINDS, NO_ENTITY, NO_CITY, defaults, entityName, cityName, grid, incomingOf, freeIn, summary, canReserve, bestCell, move, reserve, unreserve, release, expired, sellMax, sell };
})();

// Ядро: поставки и маршрут. Чистые функции, без DOM; текущее время приходит аргументом now.
// Поставка из-за границы идёт по маршруту — списку точек route:[nodeId…] из пяти точек NODES.
// Положение pos:{i, t}: t = 0 — груз стоит в точке route[i]; 0 < t < 1 — идёт по перегону route[i] → route[i+1],
// прошёл долю t. Этап (stageId) и положение двигаются вместе: смена этапа переставляет груз на схеме.
// Этапы названы по id воронки поставок по умолчанию (32-pipes.js): ordered, shipped, toBorder, customs,
// transship, toStock, arrived (флаг arrived), inStock (флаг final). Директор может переименовать и убрать
// этапы без флага — тогда груз просто не встаёт на отсутствующий этап.
// Отметка в history: {at, by, text, source, auto?} — source говорит, кто двинул поставку: SRC.

const Ships = (() => {
  // ——— точки схемы: подпись и условные координаты (0–100 по обеим осям, слева направо по ходу груза) ———
  const NODES = [
    { id: 'cn', name: 'Китай', label: 'основной город-поставщик', x: 8, y: 50 },
    { id: 'chita', name: 'Чита', label: 'основной город-приёмщик · таможня и перевалка', x: 32, y: 50 },
    { id: 'irk', name: 'Иркутск', label: 'основной город-получатель', x: 58, y: 50 },
    { id: 'msk', name: 'Москва', label: 'город-получатель', x: 90, y: 24 },
    { id: 'krd', name: 'Краснодар', label: 'город-получатель', x: 90, y: 76 },
  ];
  const nodeOf = id => NODES.find(n => n.id === id) || null;
  const nodeName = id => (nodeOf(id) ? nodeOf(id).name : String(id));

  // Этапы воронки поставок по умолчанию (id).
  const ST = { ordered: 'ordered', shipped: 'shipped', toBorder: 'toBorder', customs: 'customs', transship: 'transship', toStock: 'toStock', arrived: 'arrived', inStock: 'inStock' };
  // Кто двинул поставку — подпись в истории.
  const SRC = {
    manual: 'вручную',
    carrier: 'автоматически: перевозчик',
    receipt: 'автоматически: приёмка',
    rule: label => 'правило: ' + label,
  };
  // Положение на перегоне, где груз «в пути» (середина), и доля по умолчанию.
  const LEG_T = 0.5;

  const shipOf = (st, id) => (st.shipments || []).find(s => s.id === id) || null;
  const sumBy = (a, f) => a.reduce((x, y) => x + f(y), 0);
  const units = s => sumBy(s.items || [], i => Number(i.qty) || 0);
  const hasRoute = s => Array.isArray(s.route) && s.route.length >= 2;
  const posOf = s => ({
    i: s.pos && Number.isInteger(s.pos.i) ? s.pos.i : 0,
    t: s.pos && Number.isFinite(s.pos.t) ? s.pos.t : 0,
  });
  const onLeg = p => p.t > 0 && p.t < 1;
  const routeText = route => (route || []).map(nodeName).join(' → ');
  const fold = x => String(x ?? '').toLowerCase().replace(/ё/g, 'е');

  // ——— где груз сейчас ———
  // → {at, text} — стоит в точке; {from, to, t, text} — идёт по перегону; {text} — маршрута нет.
  function where(s) {
    if (!hasRoute(s)) return { text: 'нет данных: маршрут' };
    const { i, t } = posOf(s);
    const last = s.route.length - 1;
    if (!onLeg({ t }) || i >= last) {
      const id = s.route[Math.min(Math.max(i, 0), last)];
      const note = id === 'chita' ? (s.stageId === ST.customs ? ', таможня' : s.stageId === ST.transship ? ', перевалка' : '') : '';
      return { at: id, text: nodeName(id) + note };
    }
    const from = s.route[i], to = s.route[i + 1];
    return { from, to, t, text: `в пути ${nodeName(from)} → ${nodeName(to)}, пройдено ${Math.round(t * 100)}%` };
  }

  // ——— путь груза по маршруту: последовательность состояний {i, t, stageId} ———
  // Китай: «Заказано» → «Отгружено»; перегон до Читы — «В пути до границы»; в Чите — «Таможня» → «Перевалка»;
  // дальше перегоны и промежуточные точки — «В пути до склада»; в последней точке — «Прибыло в город».
  // Состояния с этапом, которого нет в воронке, пропускаются.
  function plan(st, s) {
    const out = [];
    if (!hasRoute(s)) return out;
    const r = s.route, last = r.length - 1;
    const add = (i, t, stageId) => { if (Pipes.stage(st, s.pipeId, stageId)) out.push({ i, t, stageId }); };
    add(0, 0, ST.ordered);
    add(0, 0, ST.shipped);
    for (let k = 0; k < last; k++) {
      add(k, LEG_T, r[k + 1] === 'chita' ? ST.toBorder : ST.toStock);
      const n = k + 1;
      if (r[n] === 'chita') {
        add(n, 0, ST.customs);
        add(n, 0, ST.transship);
        if (n === last) add(n, 0, ST.arrived);
      } else {
        add(n, 0, n === last ? ST.arrived : ST.toStock);
      }
    }
    return out;
  }

  // Где в плане сейчас поставка: по этапу и положению, иначе — по одному из двух. -1 — не нашли.
  function cursor(pl, s) {
    const p = posOf(s);
    const same = e => e.i === p.i && onLeg(e) === onLeg(p);
    let k = pl.findIndex(e => same(e) && e.stageId === s.stageId);
    if (k < 0) k = pl.findIndex(e => e.stageId === s.stageId);
    if (k < 0) k = pl.findIndex(same);
    return k;
  }

  // Доля пути, 0–1, по плану (для сроков и демо): состояние k из L.
  const progress = (pl, k) => {
    if (pl.length < 2 || k < 0) return 0;
    const e = pl[k];
    return Math.min(1, Math.max(0, (k + (onLeg(e) ? e.t - 0.5 : 0)) / (pl.length - 1)));
  };

  // ——— «ждёт приёмки» и «опоздала» — единственные определения ———
  const awaits = (st, s) => s.dir === 'in' && !s.received && !!s.stageId && (Pipes.stage(st, s.pipeId, s.stageId) || {}).flag === 'arrived';
  // awaitingReceipt(st, s) — ждёт ли эта поставка приёмки (да/нет); awaitingReceipt(st) — все такие поставки.
  function awaitingReceipt(st, s) {
    if (s !== undefined) return awaits(st, s);
    return (st.shipments || []).filter(x => awaits(st, x));
  }

  // Опоздала: ещё не закрыта и день ожидаемого прихода раньше дня now. st нужен, чтобы знать, закрыт ли этап;
  // без st закрытой считается принятая (received).
  function isLate(s, now, st) {
    if (s.received) return false;
    if (st && Pipes.isFinal(st, s.pipeId, s.stageId)) return false;
    return !!s.eta && sod(s.eta) < sod(now);
  }

  // ——— счётчики для схемы ———
  // Фильтр — как у query (кроме node: схема и сама показывает точки). Считаются только едущие поставки к нам
  // с маршрутом и не принятые (этап без флага final).
  // → {nodes:{<nodeId>:{ships, units}, chita:{ships, units, customs:{ships, units}}}, legs:{'a>b':{ships, units}}}
  // legs: все перегоны маршрутов выбранных поставок, у пустых — нули.
  function mapCounts(st, filter) {
    const f = { ...(filter || {}), node: undefined, dir: 'in' };
    const names = productNames(st);
    const nodes = {}, legs = {};
    NODES.forEach(n => { nodes[n.id] = { ships: 0, units: 0 }; });
    nodes.chita.customs = { ships: 0, units: 0 };
    const add = (c, u) => { c.ships += 1; c.units += u; };
    for (const s of st.shipments || []) {
      if (!hasRoute(s) || Pipes.isFinal(st, s.pipeId, s.stageId) || !matches(st, s, f, names)) continue;
      for (let k = 0; k < s.route.length - 1; k++) {
        const key = s.route[k] + '>' + s.route[k + 1];
        legs[key] = legs[key] || { ships: 0, units: 0 };
      }
      const w = where(s), u = units(s);
      if (w.at) {
        add(nodes[w.at] || (nodes[w.at] = { ships: 0, units: 0 }), u);
        if (w.at === 'chita' && s.stageId === ST.customs) add(nodes.chita.customs, u);
      } else {
        add(legs[w.from + '>' + w.to], u);
      }
    }
    return { nodes, legs };
  }

  // ——— поиск, фильтры, сортировка, страницы ———
  const productNames = st => new Map((st.products || []).map(p => [p.id, p.name]));
  const atNode = (s, key) => {
    const w = where(s);
    return String(key).includes('>') ? !!w.from && w.from + '>' + w.to === key : w.at === key;
  };
  function matches(st, s, f, names) {
    const dir = f.dir || 'in';
    if (dir !== 'all' && (s.dir || 'in') !== dir) return false;
    if (f.stage && s.stageId !== f.stage) return false;
    if (f.supplier && s.supplier !== f.supplier) return false;
    if (f.city && s.cityId !== f.city) return false;
    if (f.entity && s.entityId !== f.entity) return false;
    if (f.node && !atNode(s, f.node)) return false;
    const q = fold(f.q).trim();
    if (q) {
      const hay = fold([s.id, s.number, s.supplier, s.track, where(s).text, ...(s.items || []).map(i => names.get(i.productId) || '')].join(' '));
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  }
  // Ключ сортировки; '-ключ' — по убыванию. Равные — по номеру.
  const SORTS = {
    eta: s => s.eta, depart: s => s.depart, number: s => s.id, supplier: s => s.supplier,
    units: s => units(s), items: s => (s.items || []).length,
  };
  function query(st, f = {}) {
    const names = productNames(st);
    let rows = (st.shipments || []).filter(s => matches(st, s, f, names));
    const raw = String(f.sort || 'eta');
    const desc = raw.startsWith('-'), key = desc ? raw.slice(1) : raw;
    const stagePos = s => { const p = (st.pipelines || []).find(x => x.id === s.pipeId); return p ? p.stages.findIndex(x => x.id === s.stageId) : -1; };
    const val = key === 'stage' ? stagePos : (SORTS[key] || SORTS.eta);
    const num = v => (v instanceof Date || Object.prototype.toString.call(v) === '[object Date]' ? v.getTime() : v);
    const cmp = (a, b) => {
      const x = num(val(a)), y = num(val(b));
      const c = typeof x === 'string' ? String(x).localeCompare(String(y), 'ru') : (x ?? 0) - (y ?? 0);
      return (desc ? -c : c) || String(a.id).localeCompare(String(b.id), 'ru', { numeric: true });
    };
    rows = rows.slice().sort(cmp);
    const total = rows.length;
    const size = Math.max(1, Math.floor(f.size) || 50);
    const pages = Math.max(1, Math.ceil(total / size));
    const page = Math.min(Math.max(1, Math.floor(f.page) || 1), pages);
    return { rows: rows.slice((page - 1) * size, page * size), total, page, pages, size };
  }

  // ——— смена этапа ———
  // Первый этап плана с таким id, а если груз уже стоит на таком — он же (чтобы не прыгать зря).
  function syncPos(st, s, stageId) {
    if (!hasRoute(s)) return;
    const stage = Pipes.stage(st, s.pipeId, stageId);
    const last = s.route.length - 1;
    if (stage && stage.flag === 'final') { s.pos = { i: last, t: 0 }; return; }
    const hits = plan(st, s).filter(e => e.stageId === stageId);
    if (!hits.length) return;
    const p = posOf(s);
    const keep = hits.find(e => e.i === p.i && onLeg(e) === onLeg(p));
    const e = keep || hits[0];
    s.pos = { i: e.i, t: keep ? p.t : e.t };
  }

  // «Что» везём — для текста уведомления: первая позиция и «и ещё N».
  function brief(st, s) {
    const items = s.items || [];
    if (!items.length) return 'без позиций';
    const p = (st.products || []).find(x => x.id === items[0].productId);
    let first = p ? p.name : 'нет данных: товар';
    if (first.length > 56) first = first.slice(0, 55) + '…';
    const more = items.length - 1;
    return more > 0 ? `${first} и ещё ${more} ${pl(more, 'позиция', 'позиции', 'позиций')}` : first;
  }

  // Записывает новый этап и положение, отметку в историю, уведомление. Приёмка шлёт свои уведомления сама.
  function put(st, s, stageId, by, now, source, pos) {
    const was = Pipes.stage(st, s.pipeId, s.stageId);
    const stage = Pipes.stage(st, s.pipeId, stageId);
    s.stageId = stageId;
    if (pos) s.pos = { i: pos.i, t: pos.t }; else syncPos(st, s, stageId);
    const where_ = where(s).text;
    const entry = { at: now, by: by || null, text: `Этап: «${was ? was.name : 'нет данных'}» → «${stage.name}». ${where_}.`, source };
    if (source !== SRC.manual) entry.auto = true;
    s.history = s.history || [];
    s.history.push(entry);
    let note = null;
    if (source !== SRC.receipt) {
      const when = s.dir === 'out' ? 'Доставка' : 'На складе ожидается';
      const here = hasRoute(s) ? ` Сейчас: ${where_}.` : '';
      note = Notify.push(st, 'ship', by || null, `${s.id}: ${brief(st, s)} — этап «${stage.name}».${here} ${when} ${s.eta ? fD(s.eta) : 'нет данных: дата'}.`, now);
    }
    return { ok: true, from: was, to: stage, note, text: entry.text };
  }

  // Ручная (или иная) смена этапа. → {ok, reason?, from, to, note}
  function setStage(st, shipId, stageId, by, now, source) {
    const s = shipOf(st, shipId);
    if (!s) return { ok: false, reason: 'Поставки нет.' };
    if (!Pipes.stage(st, s.pipeId, stageId)) return { ok: false, reason: 'Такого этапа в воронке нет.' };
    if (s.stageId === stageId) return { ok: false, reason: 'Поставка уже на этом этапе.' };
    return put(st, s, stageId, by, now, source || SRC.manual);
  }

  // ——— шаг по маршруту (трек перевозчика) ———
  // Груз делает следующий шаг плана: выехал → в пути → в точке → таможня → перевалка → … → «Прибыло в город».
  // Дальше (на склад) его двигает только приёмка. Шаг порождает события для правил директора.
  // → {ok, reason?, from, to, events:[…], applied:[ruleId…]}
  function advance(st, shipId, by, now, source) {
    const s = shipOf(st, shipId);
    if (!s) return { ok: false, reason: 'Поставки нет.' };
    if (!hasRoute(s)) return { ok: false, reason: 'У поставки нет маршрута.' };
    if (Pipes.isFinal(st, s.pipeId, s.stageId) || s.received) return { ok: false, reason: 'Поставка уже принята на складе.' };
    const pl = plan(st, s);
    const k = cursor(pl, s);
    const next = pl[k + 1];
    if (!next) return { ok: false, reason: 'Груз уже в городе назначения: дальше его принимает склад.' };
    const prevStage = s.stageId, prevPos = posOf(s);
    const src = source || SRC.carrier;
    const r = put(st, s, next.stageId, by, now, src, next);
    const events = [];
    // «груз в точке» — только когда груз пришёл в точку, а не когда в ней сменился этап (таможня → перевалка)
    if (!onLeg(next) && next.i > 0 && (onLeg(prevPos) || prevPos.i !== next.i)) events.push('carrier:' + s.route[next.i]);
    if (prevStage === ST.customs && next.stageId !== ST.customs) events.push('customs');
    const applied = [];
    for (const ev of events) applied.push(...applyRules(st, ev, shipId, by, now));
    return { ok: true, from: r.from, to: r.to, events, applied, note: r.note };
  }

  // ——— правила директора: «если событие — поставить этап» ———
  // st.shipRules:[{id, on, when, then}]: on — включено; when — 'received' (принято на складе), 'customs'
  // (таможня пройдена), 'carrier:<nodeId>' (перевозчик: груз в точке) или просто 'carrier' (в любой точке);
  // then — id этапа воронки поставки.
  const EVENTS = { received: 'принято на складе', customs: 'таможня пройдена' };
  function eventLabel(ev) {
    if (EVENTS[ev]) return EVENTS[ev];
    if (ev === 'carrier') return 'перевозчик: груз в любой точке';
    if (String(ev).startsWith('carrier:')) return 'перевозчик: груз в точке ' + nodeName(String(ev).slice(8));
    return String(ev);
  }
  const ruleHits = (rule, event) => rule.when === event || (rule.when === 'carrier' && String(event).startsWith('carrier:'));

  // Применяет включённые правила к событию по поставке. Правило срабатывает, только если меняет этап;
  // срабатывание пишется в историю (source «правило: …») и рассылается как смена этапа.
  // → id сработавших правил.
  function applyRules(st, event, shipId, by, now) {
    const s = shipOf(st, shipId);
    const fired = [];
    if (!s) return fired;
    for (const rule of st.shipRules || []) {
      if (rule.on !== true || !ruleHits(rule, event)) continue;
      const stage = Pipes.stage(st, s.pipeId, rule.then);
      // «На складе» и «Прибыло в город» правило ставит, только если оно «принято на складе»: иначе поставка закрылась бы без приёмки
      if (!stage || s.stageId === rule.then || !Pipes.ruleMayTo(rule, stage)) continue;
      put(st, s, rule.then, by, now, SRC.rule(`если ${eventLabel(rule.when)} — «${stage.name}»`));
      fired.push(rule.id);
    }
    return fired;
  }

  return {
    NODES, ST, SRC, EVENTS, nodeOf, nodeName, routeText, units, brief,
    where, plan, progress, awaitingReceipt, isLate, mapCounts, query,
    advance, setStage, applyRules, eventLabel,
  };
})();

// ——— демо-данные ———
// Шаг SEEDS: 126 поставок на фиксированную дату демо 31.10.2026 — после «Сбросить» те же самые (свой генератор
// псевдослучайных чисел с зерном, ничего от настоящей даты). Настоящих поставщиков и номеров нет: «Поставщик-пример N»,
// номера и треки с пометкой «демо». Позиции — настоящие товары каталога (берём из тех же снимков, что и шаг почты:
// шаг каталога (38) стоит позже). Пять якорных поставок (П-1038, П-1041…П-1044) и отгрузка О-207 остались от v2:
// на них ссылаются резервы, задачи и движения; их позиции названы артикулами v2 — на настоящие товары их переводит
// шаг каталога вместе с резервами, которые на них ссылаются.
SEEDS.push(st => {
  const DEMO = new Date(2026, 9, 31);
  const at = (back, h = 12, m = 0) => new Date(DEMO.getFullYear(), DEMO.getMonth(), DEMO.getDate() - back, h, m);
  // mulberry32: фиксированное зерно — фиксированный набор
  let seedNum = 31102026;
  const rnd = () => {
    seedNum = (seedNum + 0x6D2B79F5) | 0;
    let t = Math.imul(seedNum ^ (seedNum >>> 15), 1 | seedNum);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const int = (lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1));
  const pickW = list => {
    let x = rnd() * list.reduce((s, e) => s + e[1], 0);
    for (const e of list) { x -= e[1]; if (x < 0) return e[0]; }
    return list[list.length - 1][0];
  };
  const shuffle = arr => {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  };

  const products = Catalog.build(CATALOG, STOCK_SNAPSHOT).products;
  const SUPPLIERS = [
    { n: 1, cats: ['Инверторы'] }, { n: 2, cats: ['Аккумуляторы'] }, { n: 3, cats: ['Панели'] },
    { n: 4, cats: ['Кабель', 'Защита и соединения'] }, { n: 5, cats: ['Контроллеры'] }, { n: 6, cats: ['Защита и соединения'] },
    { n: 7, cats: null }, // смешанный: любые товары
  ].map(s => ({ ...s, name: `Поставщик-пример ${s.n}`, pool: s.cats ? products.filter(p => s.cats.includes(p.cat)) : products }));
  const sup = n => SUPPLIERS[n - 1];
  const QTY = { 'Панели': [10, 120], 'Инверторы': [1, 10], 'Аккумуляторы': [2, 24], 'Контроллеры': [1, 12], 'Защита и соединения': [5, 100], 'Кабель': [100, 600] };
  const pickItems = (supplier, n) => {
    const pool = supplier.pool.slice();
    const out = [];
    for (let k = 0; k < Math.min(n, pool.length); k++) {
      const p = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
      const [lo, hi] = QTY[p.cat] || [1, 20];
      out.push({ productId: p.id, qty: int(lo, hi) });
    }
    return out;
  };

  // маршруты: все через Читу (там таможня и перевалка), места назначения разные
  const ROUTES = [
    [['cn', 'chita', 'irk'], 38], [['cn', 'chita', 'msk'], 22], [['cn', 'chita', 'krd'], 14],
    [['cn', 'chita', 'irk', 'msk'], 14], [['cn', 'chita', 'irk', 'krd'], 8], [['cn', 'chita', 'irk', 'msk', 'krd'], 4],
  ];
  const LEG_DAYS = { 'cn>chita': 6, 'chita>irk': 4, 'chita>msk': 8, 'chita>krd': 9, 'irk>msk': 5, 'irk>krd': 6, 'msk>krd': 3 };
  const totalDays = route => 2 + 6 + route.slice(1).reduce((s, n, k) => s + (LEG_DAYS[route[k] + '>' + n] || 5), 0);
  const LEG_TEXT = { toBorder: 'Груз в пути до границы', toStock: 'Груз в пути' };
  const stateText = (route, e) => {
    const here = Ships.nodeName(route[e.i]);
    if (e.stageId === 'ordered') return 'Заказ оформлен у поставщика';
    if (e.stageId === 'shipped') return 'Груз передан перевозчику';
    if (e.t > 0) return `${LEG_TEXT[e.stageId]}: ${here} → ${Ships.nodeName(route[e.i + 1])}`;
    if (e.stageId === 'customs') return 'Прибыл в Читу, таможенное оформление';
    if (e.stageId === 'transship') return 'Таможня пройдена, перевалка в Чите';
    if (e.stageId === 'arrived') return `Прибыл в город: ${here}, ждёт приёмки`;
    return `Груз в точке: ${here}`;
  };

  // отметки истории: состояния плана до k включительно (не больше четырёх), последняя — в момент last,
  // прежние раньше на step дней; часть отметок — от «перевозчика»
  const hist = (route, pl, k, last, step, over) => {
    const out = [];
    for (let j = Math.max(0, k - 3); j <= k; j++) {
      const back = (k - j) * step;
      const t = new Date(last.getFullYear(), last.getMonth(), last.getDate() - back, j === k ? last.getHours() : 9 + (j % 6), j === k ? last.getMinutes() : (j * 7) % 60);
      const e = { at: t, by: 'p6', text: j === k && over ? over : stateText(route, pl[j]), source: Ships.SRC.manual };
      if ((j + k) % 4 === 0) { e.source = Ships.SRC.carrier; e.auto = true; }
      out.push(e);
    }
    return out;
  };

  const base = (id, supplier, route, entityId, extra) => ({
    id, number: `${id} (демо)`, dir: 'in', supplier: supplier.name, to: 'Наш склад',
    carrier: pickW([[CARRIERS[0], 4], [CARRIERS[1], 2], [CARRIERS[3], 4]]),
    track: `ТРЕК-ПРИМЕР-${id.replace(/\D/g, '')} (демо)`, entityId, cityId: route[route.length - 1], route, pipeId: 'ships', demo: true, ...extra,
  });

  const shipments = [];

  // ——— якорные поставки v2: положение и сроки заданы руками ———
  const anchor = (id, supplier, stageId, pos, eta, depart, carrier, rows, lastAt, lastText, extra) => {
    const route = ['cn', 'chita', 'irk'];
    const s = base(id, supplier, route, 'ip', { carrier, stageId, pos, eta, depart, items: rows.map(([productId, qty]) => ({ productId, qty })), ...extra });
    const pl = Ships.plan(st, s), k = pl.findIndex(e => e.stageId === (stageId === 'inStock' ? 'arrived' : stageId));
    if (extra && extra.received) {
      s.history = hist(route, pl, k, new Date(lastAt.getTime() - 3600e3), 3);
      s.history.push({ at: lastAt, by: 'p5', text: lastText, source: Ships.SRC.receipt, auto: true });
    } else s.history = hist(route, pl, k, lastAt, 3, lastText);
    return s;
  };
  shipments.push(
    anchor('П-1038', sup(6), 'inStock', { i: 2, t: 0 }, at(2, 15), at(21, 12), CARRIERS[2], [['MNT-R4', 24]], at(2, 15, 30), 'Принято на складе',
      { received: { at: at(2, 15, 30), by: 'p5', photos: 3, urls: [], note: '' } }),
    anchor('П-1041', sup(1), 'toStock', { i: 1, t: 0.6 }, at(-3, 12), at(20, 12), CARRIERS[0], [['INV-H6', 10], ['BAT-LFP-100', 16]], at(0, 9, 40), 'Прошёл Читу, идёт в Иркутск'),
    anchor('П-1042', sup(7), 'toStock', { i: 1, t: 0.35 }, at(1, 12), at(22, 12), CARRIERS[1], [['WND-3K', 2], ['MTR-3F', 5]], at(1, 18, 5), 'Задерживается: груз стоит на перегоне Чита → Иркутск'),
    anchor('П-1043', sup(3), 'transship', { i: 1, t: 0 }, at(-6, 12), at(14, 12), CARRIERS[3], [['PV-550M', 120], ['MNT-R4', 30]], at(1, 7, 20), 'Перевалка в Чите'),
    anchor('П-1044', sup(4), 'arrived', { i: 2, t: 0 }, at(0, 14), at(12, 12), CARRIERS[0], [['CAB-6R', 500], ['CAB-6B', 500], ['MC4', 200], ['CTRL-60', 6], ['BOX-DC', 10]], at(0, 8, 15), 'Терминал транспортной компании в городе'),
  );
  shipments[0].items[0].got = 24;

  // ——— генерация: 120 поставок по квотам этапов ———
  const QUOTA = [['ordered', 8], ['shipped', 12], ['toBorder', 20], ['customs', 12], ['transship', 9], ['toStock', 24], ['arrived', 9], ['inStock', 26]];
  // сколько из поставок этапа опаздывают
  const LATE = { toBorder: 5, customs: 4, transship: 3, toStock: 7, arrived: 4 };
  const slots = [];
  for (const [stage, n] of QUOTA) for (let k = 0; k < n; k++) slots.push({ stage, late: k < (LATE[stage] || 0) });
  shuffle(slots);
  // несколько больших поставок — 50–150 позиций, у смешанного поставщика
  const BIG = new Map([[4, 52], [19, 64], [37, 75], [58, 96], [83, 120], [101, 150]]);
  const SIZES = [1, 1, 2, 2, 3, 3, 3, 4, 4, 5, 6, 7, 8, 10];

  slots.forEach((slot, idx) => {
    const id = `П-${1101 + idx}`;
    const big = BIG.get(idx);
    const supplier = big ? sup(7) : sup(pickW([[1, 4], [2, 3], [3, 5], [4, 3], [5, 2], [6, 2], [7, 2]]));
    const route = pickW(ROUTES);
    const entityId = pickW([['ip', 5], ['npp', 3], ['vs', 2]]);
    const s = base(id, supplier, route, entityId, {});
    s.items = pickItems(supplier, big || SIZES[int(0, SIZES.length - 1)]);
    s.stageId = slot.stage;
    const pl = Ships.plan(st, s);
    const hits = pl.map((e, k) => k).filter(k => pl[k].stageId === (slot.stage === 'inStock' ? 'arrived' : slot.stage));
    const k = hits[int(0, hits.length - 1)];
    const e = pl[k];
    s.pos = { i: e.i, t: e.t > 0 ? Math.round((0.15 + rnd() * 0.7) * 100) / 100 : 0 };
    const T = totalDays(route) + int(0, 4);
    const p = slot.stage === 'inStock' ? 1 : Ships.progress(pl, k);
    const step = Math.max(1, Math.floor(T / pl.length));
    if (slot.stage === 'inStock') {
      const back = int(2, 30);
      s.eta = at(back, 15); s.depart = at(back + T, 12);
      s.received = { at: at(back, int(9, 17), int(0, 59)), by: 'p5', photos: int(1, 3), urls: [], note: '' };
      s.items.forEach(i => { i.got = i.qty; });
      s.history = hist(route, pl, k, s.received.at, step);
      s.history.push({ at: s.received.at, by: 'p5', text: 'Принято на складе', source: Ships.SRC.receipt, auto: true });
    } else {
      if (slot.stage === 'ordered') { const d = int(1, 7); s.depart = at(-d, 12); s.eta = at(-(d + T), 12); }
      else if (slot.late) { const d = slot.stage === 'arrived' ? int(1, 6) : int(1, 9); s.eta = at(d, 12); s.depart = at(d + T, 12); }
      else { const left = slot.stage === 'arrived' ? 0 : Math.ceil((1 - p) * T); s.eta = at(-left, 12); s.depart = at(T - left, 12); }
      s.history = hist(route, pl, k, at(slot.late ? int(1, 3) : 0, int(7, 11), int(0, 59)), step);
    }
    shipments.push(s);
  });

  // отгрузка клиенту от v2 — единственная исходящая
  shipments.push({
    id: 'О-207', number: 'О-207 (демо)', dir: 'out', deal: 'Д-305', supplier: 'Наш склад', to: 'Объект Д-305 · Волкова Мария',
    carrier: 'Своя машина', track: 'Отгрузка О-207', pipeId: 'shipsOut', stageId: 'onWay', eta: at(0, 16),
    history: [{ at: at(0, 11, 0), by: 'p6', text: 'Выехали со склада', source: Ships.SRC.manual }],
    items: [{ productId: 'PV-550M', qty: 12 }, { productId: 'MNT-R4', qty: 3 }, { productId: 'CAB-6R', qty: 60 }], demo: true,
  });

  st.shipments = shipments;
  // правила директора по умолчанию (Настройки → Поставки); третье выключено — пример выключенного. «Прибыло в город»
  // и «На складе» ставит только «принято на складе» (Pipes.ruleMayTo): прибытие отмечает шаг перевозчика, склад — приёмка
  st.shipRules = [
    { id: 'sr1', on: true, when: 'received', then: 'inStock' },
    { id: 'sr2', on: true, when: 'customs', then: 'transship' },
    { id: 'sr3', on: false, when: 'customs', then: 'toStock' },
  ];
});

// Ядро: лиды. Чистые функции над состоянием st, время приходит параметром now (Date).
// Тип лида и менеджер определяются автоматически (классификация и распределение), дальше
// менеджер ведёт лид: взять, «связались», закрыть, создать сделку; директор и РОП передают любой лид.
// Видимость: менеджер видит лиды своего типа (роль со scope); все лиды видит и раздаёт тот, у кого право
// «Распределять и передавать лиды» (leadsAssign): директор и РОП.
// Права — Perms, воронки — Pipes, уведомления — Notify; тут их только вызывают.
// Экраны — 60-leads.js (раздел «Лиды»), 56-deals.js (сделки), 67-settings-leads.js (настройки); они зовут только это ядро.

const Leads = (() => {
  // Откуда пришёл лид и как он подписан; «phone», «mail» и «other» — лид, заведённый руками (форма «Новый лид»).
  // Порядок — как в форме: звонок, почта, сайт, Битрикс24, другое.
  const SOURCE = { phone: 'звонок', mail: 'почта', site: 'сайт', bitrix: 'Битрикс24', other: 'другое' };
  const TYPE = { b2b: 'B2B', b2c: 'B2C' };
  // Откуда принимаем лиды — выбор в «Настройки → Лиды и сделки» (st.leadSource); подписи вариантов выбора.
  const SOURCES = { bitrix: 'Битрикс24', site: 'Сайт напрямую', both: 'Оба' };
  // Этапы воронки лидов, которых касаются действия, — по id (названия можно переименовать).
  const ST_CONTACTED = 'contacted', ST_QUALIFIED = 'qualified', ST_DEAL = 'deal', ST_LOST = 'lost';
  const STAGE = { contacted: ST_CONTACTED, qualified: ST_QUALIFIED, deal: ST_DEAL, lost: ST_LOST };

  const filled = v => String(v == null ? '' : v).trim() !== '';
  const personOf = (st, id) => (st.people || []).find(p => p.id === id) || null;
  const nameOf = (st, id) => (personOf(st, id) || {}).name || 'нет данных: сотрудник';
  const scopeOf = (st, id) => { const r = Perms.roleOf(st, id); return (r && r.scope) || null; };
  const isDirector = (st, id) => { const r = Perms.roleOf(st, id); return !!(r && r.all); };
  const byId = (st, leadId) => (st.leads || []).find(l => l.id === leadId) || null;
  const pipeOf = (st, lead) => Pipes.of(st, 'leads').find(p => p.id === lead.pipeId) || null;
  const stageIn = (pipe, id) => (pipe && pipe.stages.find(s => s.id === id)) || null;
  const isOpen = (st, lead) => !Pipes.isFinal(st, lead.pipeId, lead.stageId);
  // С чего запись начинает путь по воронке: первый этап без флага
  const firstOf = pipe => pipe.stages.find(s => !s.flag) || pipe.stages[0];

  // Следующий номер вида «Л-101»: после самого большого из занятых, но не меньше min + 1.
  function nextId(list, prefix, min) {
    const re = new RegExp('^' + prefix + '-(\\d+)$');
    let n = min;
    for (const x of list || []) { const m = re.exec(String(x.id)); if (m) n = Math.max(n, +m[1]); }
    return prefix + '-' + (n + 1);
  }

  // start — запись о приходе лида (как пришёл, кем заведён, кому достался): сама по себе действием с лидом не считается
  const log = (lead, now, by, text, start) => { lead.history.push(start ? { at: now, by: by || null, text, start: true } : { at: now, by: by || null, text }); };

  // Как называть лид в тексте: компания, имя, телефон, почта — что есть.
  const title = lead => lead.company || lead.name || lead.phone || lead.email || 'нет данных: имя и контакт';

  // Тип лида по заявке: компания или ИНН → b2b; иначе телефон или почта → b2c; иначе null.
  function classify(lead) {
    if (filled(lead.company) || filled(lead.inn)) return 'b2b';
    if (filled(lead.phone) || filled(lead.email)) return 'b2c';
    return null;
  }

  // Открытые лиды менеджера (этап не final); skipId — не считать этот лид (он как раз переезжает).
  const openCount = (st, managerId, skipId) =>
    (st.leads || []).filter(l => l.managerId === managerId && l.id !== skipId && isOpen(st, l)).length;

  // Менеджеры, которым достаются лиды: у роли есть тип (scope) и право «лиды»; type — только этого типа.
  const managers = (st, type) => (st.people || []).filter(p => {
    const scope = scopeOf(st, p.id);
    return !!scope && (!type || scope === type) && Perms.can(st, p.id, 'leads');
  });

  // Менеджер типа с наименьшим числом открытых лидов; при равенстве — первый в списке людей. Нет такого — null.
  function pick(st, type, skipId) {
    if (!TYPE[type]) return null;
    let best = null, bestN = Infinity;
    for (const p of managers(st, type)) {
      const n = openCount(st, p.id, skipId);
      if (n < bestN) { best = p.id; bestN = n; }
    }
    return best;
  }

  // Кому достаётся лид: по типу заявки. Тип не определён или менеджера такого типа нет — null («Нераспределённые»).
  const route = (st, lead) => pick(st, classify(lead));

  // Новый лид: тип, менеджер, первый этап воронки лидов, история. Уведомление вида «lead» — назначенному
  // менеджеру, директору и РОП; opts.silent — без уведомления (демо-данные); opts.by — лид завёл человек руками
  // (в истории он назван). data.clientId — клиент, к которому лид привязан (существование проверяет add).
  function create(st, data, now, opts) {
    const source = data.source, by = (opts && opts.by) || null;
    if (!SOURCE[source]) throw new Error(`Неизвестный источник лида: ${source}`);
    const pipe = Pipes.of(st, 'leads')[0];
    if (!pipe) throw new Error('Нет воронки лидов');
    st.leads = st.leads || [];
    const lead = {
      id: nextId(st.leads, 'Л', 100), at: now, source,
      name: String(data.name || '').trim(), phone: String(data.phone || '').trim(), email: String(data.email || '').trim(),
      company: String(data.company || '').trim(), inn: String(data.inn || '').trim(), text: String(data.text || '').trim(),
      type: null, managerId: null,
      pipeId: pipe.id, stageId: firstOf(pipe).id,
      history: [], demo: !!data.demo,
    };
    lead.type = classify(lead);
    lead.managerId = route(st, lead);
    log(lead, now, by, by ? `Заведён вручную: ${SOURCE[source]}` : `Лид пришёл: ${SOURCE[source]}`, true);
    const client = data.clientId ? Clients.byId(st, data.clientId) : null;
    if (client) {
      lead.clientId = client.id;
      log(lead, now, by, `Привязан к клиенту ${client.id}: ${client.name}`, true);
    }
    if (lead.managerId) log(lead, now, null, `Назначен автоматически: ${nameOf(st, lead.managerId)} (${TYPE[lead.type]})`, true);
    else log(lead, now, null, lead.type
      ? `Нераспределённый: нет менеджера ${TYPE[lead.type]}`
      : 'Нераспределённый: нет ни компании, ни ИНН, ни телефона, ни почты', true);
    st.leads.push(lead);
    if (!(opts && opts.silent)) {
      const who = lead.managerId ? `менеджер — ${nameOf(st, lead.managerId)}` : 'нераспределённый';
      Notify.push(st, 'lead', by, `Новый лид ${lead.id} (${SOURCE[source]}): ${title(lead)}${lead.type ? ', ' + TYPE[lead.type] : ''}, ${who}.`, now, lead.managerId ? [lead.managerId] : []);
    }
    return lead;
  }

  // Завести лид руками (форма «Новый лид»): data — как у create, плюс clientId (привязка к найденному клиенту).
  // Нужны известный источник и хоть что-то о клиенте (имя, телефон, почта, компания или ИНН); заводит тот, у кого есть
  // право «лиды». Тип и менеджер — как у любого лида (classify, route). → {ok, lead, reason}
  function add(st, data, by, now) {
    const d = data || {}, no = reason => ({ ok: false, lead: null, reason });
    if (!SOURCE[d.source]) return no('Выберите, откуда пришёл лид.');
    if (!personOf(st, by) || !Perms.can(st, by, 'leads')) return no('Заводить лиды могут те, у кого есть право на раздел «Лиды».');
    if (!['name', 'phone', 'email', 'company', 'inn'].some(k => filled(d[k]))) return no('Укажите хотя бы имя, телефон, почту или компанию.');
    if (filled(d.clientId) && !Clients.byId(st, d.clientId)) return no('Клиента, к которому привязываете лид, нет.');
    return { ok: true, lead: create(st, d, now, { by }), reason: '' };
  }

  // ——— время реакции ———
  // Сколько минут новый лид может лежать без единого действия (Настройки → Лиды и сделки): st.leadWaitMin, по умолчанию 15.
  const WAIT_DEFAULT = 15, WAIT_MAX = 10080, MINUTE = 6e4;
  const waitMin = st => (Number(st.leadWaitMin) >= 1 ? Number(st.leadWaitMin) : WAIT_DEFAULT);
  // Поменять порог: целое число минут от 1 до 10080 (неделя). → {ok, value, reason}
  function setWaitMin(st, value) {
    const s = String(value == null ? '' : value).trim();
